<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MokomėsKartu">
<link rel="apple-touch-icon" href="/logo/mk-ikona-180.png">
<title>Šešėlių dirbtuvė – MokomėsKartu.lt</title>
<meta name="description" content="Dailės žaidimas 7–8 klasei: valdyk lempą 3D dirbtuvėje ir mokykis matyti šviesą, šešėlius ir tonus ant daugiau nei šimto skirtingų daiktų.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffe9c9">
<link rel="icon" href="/logo/mk-ikona.svg">
<script src="/bendra/mk.js"></script>
<script src="tekstai.lt.js"></script>
<script src="daiktai.js"></script>
<style>
body{--ink:#2b2f3a;--soft:#6a6f80;--red:#e5484d;background:linear-gradient(#ffe9c9,#fff6e8 50%,#ffffff) fixed;color:var(--ink);--kid:"Trebuchet MS","Segoe UI",system-ui,sans-serif;--body:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.mk-app{max-width:760px}
.mk-ico[data-k="music"]{display:none}
.hero{position:relative;height:210px;border-radius:22px;overflow:hidden;border:3px solid var(--ink);box-shadow:0 6px 0 rgba(43,47,58,.18);margin-bottom:12px;background:linear-gradient(#ffd9a8,#f7b267)}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero .lamp{animation:swing 6s ease-in-out infinite;transform-origin:280px 96px}
@keyframes swing{0%,100%{transform:translateX(-150px)}50%{transform:translateX(150px)}}
.hero .sh{animation:shad 6s ease-in-out infinite;transform-origin:280px 168px}
@keyframes shad{0%,100%{transform:skewX(-52deg) scaleY(.5)}50%{transform:skewX(52deg) scaleY(.5)}}
.hero .beam{animation:beam 6s ease-in-out infinite;transform-origin:280px 60px}
h1{margin:4px 0;font:900 clamp(31px,8.6vw,46px)/1 var(--kid);letter-spacing:-.02em}
h1 small{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:99px;background:#fff;border:2px solid var(--ink);font:800 13px/1.5 var(--body);letter-spacing:0;vertical-align:8px}
.lead{margin:6px 0 4px;font:600 16px/1.45 var(--body);max-width:60ch}.note{margin:0 0 12px;font:600 13.5px/1.4 var(--body);color:var(--soft)}
h2{margin:20px 0 8px;font:900 19px/1.2 var(--kid);text-transform:uppercase;letter-spacing:.03em}
.ll{display:grid;gap:9px}
.lc{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;padding:10px 12px;border:3px solid var(--ink);border-radius:16px;background:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(43,47,58,.18);color:var(--ink)}
.lc:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(43,47,58,.18)}
.lc .dot{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;color:#fff;font:900 20px/1 var(--kid)}
.lc b{display:block;font:900 18px/1.15 var(--kid)}.lc .s{display:block;font:600 13px/1.3 var(--body);color:var(--soft)}
.lc .st{display:flex;gap:1px}.lc .st svg{width:19px;height:19px}
.seen{margin:12px 0 0;padding:10px 12px;border:3px dashed var(--ink);border-radius:14px;background:#fffdf6;font:800 14.5px/1.3 var(--body)}
details.lr{border:3px solid var(--ink);border-radius:14px;background:#fff;margin-bottom:8px}
details.lr summary{padding:10px 12px;font:800 15.5px/1.2 var(--kid);cursor:pointer}
details.lr p{margin:0 12px 10px;font:500 15px/1.5 var(--body)}
/* žaidimas */
#game{position:fixed;inset:0;z-index:40;background:#3a2a1e;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:absolute;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;gap:8px;align-items:flex-start;pointer-events:none}
#ins{flex:1;min-width:0;max-width:560px;margin-right:auto;padding:8px 12px;border:3px solid var(--ink);border-radius:16px;background:#fff;box-shadow:0 5px 0 rgba(43,47,58,.25)}
#ins small{display:block;font:800 11px/1.2 var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}
#ins b{display:block;margin-top:2px;font:800 clamp(15px,4.2vw,18px)/1.25 var(--kid)}
#objN{display:inline-block;margin-top:5px;padding:1px 9px;border-radius:99px;background:#fff3b8;border:2px solid var(--ink);font:800 12.5px/1.5 var(--body)}
.stat{pointer-events:auto;display:grid;gap:6px;justify-items:end}
.pill{padding:6px 10px;border:3px solid var(--ink);border-radius:13px;background:#fff;font:900 14px/1 var(--kid);box-shadow:0 3px 0 rgba(43,47,58,.25);white-space:nowrap}
.pill svg{width:15px;height:15px;vertical-align:-2px}
#bExit{pointer-events:auto;width:42px;height:38px;border:3px solid var(--ink);border-radius:12px;background:#fff;font:900 15px/1 var(--kid);cursor:pointer;color:var(--ink)}
.bot{position:absolute;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));display:grid;gap:8px;justify-items:center;pointer-events:none}
#msg{text-align:center;min-height:0}
#msg span{display:inline-block;max-width:480px;padding:8px 14px;border-radius:14px;border:3px solid var(--ink);background:#fff;font:800 15px/1.3 var(--body);box-shadow:0 4px 0 rgba(43,47,58,.25);animation:pop .35s cubic-bezier(.3,1.7,.5,1)}
#msg span.bad{background:#ffe3df}#msg span.good{background:#dffbe6}#msg span.new{background:#fff3b8}
@keyframes pop{from{transform:scale(.7);opacity:.2}to{transform:none;opacity:1}}
#ord{padding:5px 14px;border-radius:12px;background:#fff;border:3px solid var(--ink);font:900 16px/1.2 var(--kid)}#ord:empty{display:none}
#hint{max-width:460px;padding:5px 12px;border-radius:12px;background:rgba(43,47,58,.72);text-align:center;font:700 13px/1.3 var(--body);color:#fff}#hint:empty{display:none}
#bMain{pointer-events:auto;width:min(100%,300px);height:54px;border:3px solid var(--ink);border-radius:16px;background:#ffd23f;color:var(--ink);font:900 19px/1 var(--kid);letter-spacing:.03em;cursor:pointer;box-shadow:0 5px 0 rgba(43,47,58,.4)}
#bMain.next{background:#2fbf71;color:#fff}
#bMain:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(43,47,58,.4)}
#ov{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(43,47,58,.5);overflow:auto}
#ov:empty{display:none}
.rc{width:100%;max-width:430px;max-height:calc(100dvh - 28px);overflow:auto;padding:18px 16px 14px;border:3px solid var(--ink);border-radius:22px;background:#fff;box-shadow:0 8px 0 rgba(43,47,58,.3);text-align:center;animation:pop .45s cubic-bezier(.3,1.7,.5,1)}
.rc h3{margin:0 0 6px;font:900 27px/1.1 var(--kid)}
.rc p{margin:6px 0;font:600 15.5px/1.45 var(--body)}
.rc .st{display:flex;justify-content:center;gap:6px;margin:8px 0}.rc .st svg{width:52px;height:52px}
.rc .bt{display:grid;gap:8px;margin-top:12px}
.rc button{height:50px;border:3px solid var(--ink);border-radius:15px;background:#fff;font:900 17px/1 var(--kid);cursor:pointer;box-shadow:0 4px 0 rgba(43,47,58,.22);color:var(--ink)}
.rc button.pri{background:#2fbf71;color:#fff}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <main id="menu">
    <div class="hero" aria-hidden="true">
      <svg viewBox="0 0 560 210" preserveAspectRatio="xMidYMid slice">
        <rect y="150" width="560" height="60" fill="#c58f5c"/><ellipse cx="280" cy="172" rx="230" ry="30" fill="#fff6e3" stroke="#2b2f3a" stroke-width="3"/>
        <g class="sh"><ellipse cx="280" cy="150" rx="34" ry="40" fill="#2b2f3a" opacity=".32"/></g>
        <g stroke="#2b2f3a" stroke-width="3" stroke-linejoin="round"><path d="M250 168q-6-52 30-58 36 6 30 58z" fill="#2bb3a3"/><path d="M258 110h44l-6-22h-32z" fill="#2bb3a3"/><ellipse cx="280" cy="88" rx="16" ry="5" fill="#1f8f82"/><path d="M262 130q18 12 36 0" fill="none" stroke="#fff" stroke-width="4" opacity=".7"/></g>
        <g class="lamp"><path d="M280 0v34" stroke="#2b2f3a" stroke-width="4"/><path d="M256 62l10-28h28l10 28z" fill="#1f6f8b" stroke="#2b2f3a" stroke-width="3" stroke-linejoin="round"/><ellipse cx="280" cy="63" rx="24" ry="7" fill="#fff6c9" stroke="#2b2f3a" stroke-width="3"/><path d="M262 70l-30 80h96l-30-80z" fill="#fff3b0" opacity=".35"/></g>
      </svg>
    </div>
    <h1><span id="h1"></span><small id="gr"></small></h1><p class="lead" id="lead"></p><p class="note" id="note"></p>
    <h2 id="llT"></h2><div class="ll" id="ll"></div><p class="seen" id="seen"></p>
    <h2 id="lrT"></h2><div id="lr"></div>
  </main>
</div>
<div id="game" hidden>
  <canvas id="gl"></canvas>
  <div class="top"><div id="ins"><small id="insL"></small><b id="insB"></b><span id="objN"></span></div><div class="stat"><button id="bExit" type="button">✕</button><div class="pill" id="pPts"></div></div></div>
  <div class="bot"><div id="msg"></div><div id="ord"></div><div id="hint"></div><button id="bMain" type="button" hidden></button></div>
</div>
<div id="ov"></div>
<script type="module" src="zaidimas.js"></script>
</body>
</html>
