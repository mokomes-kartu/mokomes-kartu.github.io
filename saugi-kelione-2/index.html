<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Saugi kelionė į mokyklą – MokomėsKartu.lt</title>
<meta name="description" content="Eismo saugumo žaidimas 1–2 klasėms: pats nuvesk vaiką į mokyklą – šviesoforas, perėja, kiemai, atšvaitas.">
<meta name="theme-color" content="#fff9e6">
<link rel="icon" href="/logo/mk-ikona.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;800&family=Manrope:wght@600;700;800&display=swap">
<script src="/bendra/mk.js"></script>
<script src="tekstai.lt.js"></script>
<style>
/* Saugi kelionė 2: vaikas pats veda veikėją gatve (laiko mygtuką), sustoja, apsidairo, renkasi kelią. */
body{--ac:#1c7ed6;--ac-soft:#dbeeff}
.road{display:flex;align-items:flex-end;gap:8px;margin:2px 0 6px;padding:26px 12px 8px;background:#fff;border-radius:18px;box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.14)}
.road .ic{width:32px;height:32px;flex:none}
.road .ic svg{width:100%;height:100%;display:block}
.road .path{position:relative;flex:1;height:12px;margin-bottom:6px;border-radius:6px;background:#e9e1cc;box-shadow:inset 0 0 0 2px var(--ink)}
.road .path i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--good);box-shadow:inset 0 0 0 2px var(--ink)}
.road .pk{position:absolute;bottom:2px;width:24px;height:40px;transform:translateX(-50%)}
.road .pk svg{width:100%;height:100%;display:block;overflow:visible}
.mk-dots{margin:2px 0 4px}
.scene-w{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 0 0 3px var(--ink),0 7px 0 rgba(18,26,51,.18);margin:8px 0 10px;background:#bfe6ff;touch-action:none;user-select:none;-webkit-user-select:none}
.scene{display:block;width:100%;height:auto}
.scene-w.flash{animation:fl .5s}
@keyframes fl{0%,60%{box-shadow:0 0 0 6px var(--bad),0 7px 0 rgba(18,26,51,.18)}}
.blink{animation:bl .7s steps(2) infinite}
@keyframes bl{50%{opacity:.1}}
.pulse{animation:pu .8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{50%{transform:scale(1.18)}}
.kidg .lg{transform-box:fill-box;transform-origin:50% 0}
.kidg.walk .lg1{animation:sw .36s linear infinite alternate}
.kidg.walk .lg2{animation:sw .36s linear infinite alternate-reverse}
.kidg.walk .bd{animation:bob .18s linear infinite alternate}
@keyframes sw{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
@keyframes bob{to{transform:translateY(-1.6px)}}
.kidg .x{display:none}
.kidg.ears .x-ears,.kidg.phone .x-phone,.kidg.hood .x-hood,.kidg.refl .x-refl{display:block}
.kidg.phone .arm-r{display:none}
.kidg.dim .bd,.kidg.dim .lg{opacity:.42}
.beam{display:none}
.dark .beam{display:block}
.rain path{animation:rn .5s linear infinite}
@keyframes rn{to{transform:translate(-14px,38px)}}
.ctl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;min-height:118px;touch-action:none;user-select:none;-webkit-user-select:none}
.ctl button{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:none}
.walk{grid-column:2;width:112px;height:112px;border-radius:50%;background:var(--good);color:#fff;font:800 19px/1 var(--kid);display:grid;place-items:center;align-content:center;gap:2px;
  box-shadow:inset 0 0 0 3px var(--ink),0 8px 0 rgba(18,26,51,.3);transition:transform .08s,box-shadow .08s}
.walk svg{width:50px;height:44px}
.walk.on{transform:translateY(6px);box-shadow:inset 0 0 0 3px var(--ink),0 2px 0 rgba(18,26,51,.3);background:#249458}
.walk.coach{animation:pu 1s ease-in-out infinite}
.look{width:78px;height:78px;border-radius:24px;background:#fff;box-shadow:inset 0 0 0 3px var(--ink),0 6px 0 rgba(18,26,51,.22);display:grid;place-items:center;visibility:hidden}
.look svg{width:56px;height:44px}
.look.show{visibility:visible;animation:pu 1s ease-in-out infinite}
.look.done{background:#b8f0c4;animation:none}
.look:active{transform:translateY(4px)}
#lookL{justify-self:end}#lookR{justify-self:start}
.modb{position:absolute;right:10px;bottom:10px;width:76px;height:76px;border-radius:50%;border:0;background:#ffe066;box-shadow:inset 0 0 0 3px var(--ink),0 6px 0 rgba(18,26,51,.25);display:none;place-items:center;cursor:pointer;animation:pu .9s ease-in-out infinite}
.modb.show{display:grid}
.modb svg{width:52px;height:52px}
.cards{grid-column:1/-1;display:flex;justify-content:center;gap:12px}
.cards button{flex:1;max-width:150px;aspect-ratio:1;border-radius:26px;background:#fff;box-shadow:inset 0 0 0 3px var(--ink),0 7px 0 rgba(18,26,51,.22);display:grid;place-items:center;padding:8px;animation:mkIn .4s backwards cubic-bezier(.2,1.4,.4,1)}
.cards button svg{width:100%;height:100%}
.cards button:active{transform:translateY(4px)}
.cards button.no{background:#ffd3c7;opacity:.5;pointer-events:none}
.cards button.ok{background:#b8f0c4;pointer-events:none}
.mk-hero-art{width:min(440px,100%)}
.mk-hero-art .scene-w{margin:0 0 4px}
.mk-guide{margin-top:6px}
.note{max-width:520px;margin:16px auto 0;color:var(--soft);font-size:13px;text-align:center}
.goal{display:flex;gap:12px;align-items:center;background:#fff;border-radius:22px;padding:12px 14px;margin:0 0 14px;box-shadow:inset 0 0 0 2.5px var(--ink),0 5px 0 rgba(18,26,51,.16)}
.goal svg{width:92px;height:92px;flex:none}
.goal b{font:800 18px/1.2 var(--kid);display:block;margin-bottom:4px}
.goal p{margin:0;font-weight:700;font-size:14.5px;line-height:1.3}
.starfly{position:absolute;width:34px;height:34px;pointer-events:none;animation:sf .9s ease-out forwards}
@keyframes sf{from{transform:translateY(0) scale(.4);opacity:1}to{transform:translateY(-90px) scale(1.3);opacity:0}}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <section id="menu">
    <div class="mk-hero">
      <div class="mk-hero-art" id="heroArt"></div>
      <h1 id="h1"></h1>
      <p id="lead"></p>
    </div>
    <div class="goal" id="goal"></div>
    <div id="levels"></div>
    <div id="learn"></div>
    <p class="note" id="note"></p>
  </section>
  <section id="play" hidden>
    <div class="road" aria-hidden="true"><span class="ic" id="icHome"></span><div class="path"><i id="pathFill"></i><span class="pk" id="pk"></span></div><span class="ic" id="icSchool"></span></div>
    <div id="dots"></div>
    <div class="scene-w" id="sw"><svg class="scene" id="scene" viewBox="0 0 360 330" role="img"></svg><button type="button" class="modb" id="modb"></button></div>
    <div class="ctl" id="ctl"></div>
    <div id="g"></div>
  </section>
</div>
<script>

}

const SPR = {

const ballSvg = `<circle r="9" fill="#fff" stroke="${INK}" stroke-width="2.2"/><path d="M0-4 4-1 2.5 4h-5L-4-1Z" fill="${INK}"/><path d="M0-4V-9M4-1l4.5-2M2.5 4l2.5 4.5M-2.5 4-5 8.5M-4-1l-4.5-2" stroke="${INK}" stroke-width="1.3"/>`;
const dogSvg = `<ellipse cx="0" cy="0" rx="14" ry="3" fill="#000" opacity=".18"/><rect x="-12" y="-16" width="24" height="12" rx="6" fill="#c98b4f" stroke="${INK}" stroke-width="2"/>

  <circle cx="15" cy="-20" r="1.4" fill="${INK}"/><circle cx="20" cy="-17" r="1.8" fill="${INK}"/><path d="M-12-13q-7-3-6-9" fill="none" stroke="#c98b4f" stroke-width="4" stroke-linecap="round"/>`;
const cyclistSvg = `<ellipse cx="0" cy="1" rx="26" ry="3.5" fill="#000" opacity=".18"/><g fill="none" stroke="${INK}" stroke-width="3"><circle cx="-17" cy="-9" r="9.5"/><circle cx="17" cy="-9" r="9.5"/><path d="M-17-9-6-26h15l8 17M-6-26 1-9 9-26M-11-30h9M9-32l3 6" stroke-linecap="round" stroke-linejoin="round"/></g>
  <path d="M-4-28 2-46l10 6" fill="none" stroke="#20c997" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="3" cy="-54" r="8" fill="#f8cfaa" stroke="${INK}" stroke-width="2"/><path d="M-5-56q8-12 16 0Z" fill="#e03131" stroke="${INK}" stroke-width="2"/>`;

["red", "green", "blink", "amb", "late"].forEach(v => CAT.push("L:" + v + ":"));

/* ---------- pasaulio piešimas ---------- */
function palette(tod){
  const dark = tod === "night" || tod === "nrain", dusk = tod === "dusk";
  return { dark: dark || dusk, night: dark, sky: dark ? "#1f2a52" : dusk ? "#5b5f97" : tod === "rain" || tod === "fog" ? "#c9d6e2" : "#bfe6ff",
    walls: dark ? ["#4c5578", "#5a4a6e", "#465a70"] : dusk ? ["#b89a8a", "#8f9cc0", "#a3a7c9"] : ["#ffd8a8", "#d0ebff", "#ffe3e3", "#d3f9d8"],
    roof: dark ? "#2b3150" : dusk ? "#8a4a3a" : "#e8590c", win: dark || dusk ? "#ffe066" : "#a5d8ff", tree: dark ? "#2f5d46" : dusk ? "#4d8b62" : "#69db7c",
    side: dark ? "#8a867c" : dusk ? "#bdb6a5" : "#efe7d3", sideHi: dark ? "#9d998e" : dusk ? "#cfc8b6" : "#fbf6ea", line: dark ? "#6f6b62" : "#d6ccb4",
    road: dark ? "#353a46" : dusk ? "#4d525f" : "#666b77", fence: dark ? "#5b4a3a" : "#c98b4f" };
}
function bgBlock(x0, w, p, seed){
  let g = `<rect x="${x0}" y="0" width="${w}" height="${H}" fill="${p.sky}"/>`;
  let x = x0 + 8, k = seed || 0;
  while(x < x0 + w - 40){
    const hw = 50 + (k * 37) % 26, hh = 40 + (k * 53) % 22, c = p.walls[k % p.walls.length];
    g += `<rect x="${x}" y="${100 - hh}" width="${hw}" height="${hh}" fill="${c}" stroke="${INK}" stroke-width="2"/><path d="M${x - 5} ${100 - hh}l${hw / 2 + 5}-20 ${hw / 2 + 5} 20Z" fill="${p.roof}" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>
      <rect x="${x + 8}" y="${108 - hh}" width="12" height="12" rx="2" fill="${p.win}" stroke="${INK}" stroke-width="1.5"/><rect x="${x + hw - 20}" y="${108 - hh}" width="12" height="12" rx="2" fill="${p.win}" stroke="${INK}" stroke-width="1.5"/>`;
    x += hw + 12; const r = 11 + (k * 7) % 6;
    g += `<rect x="${x + r - 3}" y="${100 - r - 4}" width="6" height="${r + 4}" fill="#8d5a2b"/><circle cx="${x + r}" cy="${100 - r - 12}" r="${r}" fill="${p.tree}" stroke="${INK}" stroke-width="2"/>`;
    x += r * 2 + 14; k++;
  }
  g += `<rect x="${x0}" y="100" width="${w}" height="${RT - 100}" fill="${p.side}"/><path d="M${x0} 100h${w}M${x0} ${RT}h${w}" stroke="${INK}" stroke-width="2"/>
    <rect x="${x0}" y="${RT}" width="${w}" height="${RB - RT}" fill="${p.road}"/><path d="M${x0} ${(RT + RB) / 2}h${w}" stroke="#fff" stroke-width="3" stroke-dasharray="24 18" opacity=".9"/>
    <rect x="${x0}" y="${RB}" width="${w}" height="${H - RB}" fill="${p.side}"/><rect x="${x0}" y="${RB}" width="${w}" height="6" fill="${p.sideHi}"/><path d="M${x0} ${RB}h${w}M${x0} ${RB + 6}h${w}" stroke="${INK}" stroke-width="2"/>`;
  for(let i = 0; i < w / 34; i++) g += `<path d="M${x0 + i * 34 + 12} ${RB + 6}v${H - RB - 20}" stroke="${p.line}" stroke-width="1.5"/>`;
  g += `<path d="M${x0} ${RB + 44}h${w}" stroke="${p.line}" stroke-width="1.5"/><rect x="${x0}" y="${H - 14}" width="${w}" height="14" fill="${p.fence}" stroke="${INK}" stroke-width="2"/>`;
  for(let i = 0; i < w / 17; i++) g += `<path d="M${x0 + i * 17 + 8} ${H - 14}v14" stroke="${INK}" stroke-width="1.2" opacity=".5"/>`;
  if(p.dark) for(let lx = x0 + 60; lx < x0 + w; lx += 190) g += `<rect x="${lx}" y="44" width="4" height="60" fill="#868e96" stroke="${INK}" stroke-width="1.2"/><path d="M${lx + 2} 46q0-7 9-7h8" fill="none" stroke="#868e96" stroke-width="4"/><circle cx="${lx + 20}" cy="41" r="4.5" fill="#fff3a0"/><path d="M${lx + 20} 44 ${lx - 22} 150h84Z" fill="#ffe066" opacity=".13"/>`;
  return g;
}
const zebraSvg = xc => Array.from({ length: 8 }, (_, i) => `<rect x="${xc - ZW}" y="${RT + 5 + i * 13}" width="${ZW * 2}" height="7.5" rx="1" fill="#fff"/>`).join("") + post(xc - ZW - 12, RB + 12, "pereja", 26);
function lightSvg(xc, st){
  const cx = xc + ZW + 16, lamp = (cy, cls, col, pose) => `<g class="${cls}"><circle cx="${cx}" cy="${cy}" r="13" fill="#3a3030" stroke="#0b0f1c" stroke-width="2"/><circle class="on" cx="${cx}" cy="${cy}" r="13" fill="${col}"/><circle class="on" cx="${cx}" cy="${cy}" r="18" fill="${col}" opacity=".22"/>${ped(cx, cy, 21, "#fff", pose)}</g>`;

/* ---------- maršrutas ---------- */
function pickKeys(lv){
  const plan = pick(lv.plans), seen = MK.get(SEEN, []), used = new Set();
  const take = t => { const pool = ofType(t).filter(k => !used.has(k)); const fresh = pool.filter(k => !seen.includes(k)); const k = pick(fresh.length ? fresh : pool); used.add(k); return k; };
  // eilės tvarka: R pirmas; S prieš Z; G tik artimoje pusėje (po nelyginio perėjimų skaičiaus)
  for(let tryN = 0; tryN < 80; tryN++){
    let letters = plan.split("");
    const hasR = letters.includes("R"); letters = letters.filter(c => c !== "R");
    const sIdx = letters.indexOf("S"); if(sIdx >= 0){ letters.splice(sIdx, 1); letters.splice(letters.indexOf("Z"), 1); }
    letters = MK.shuffle(letters);
    if(sIdx >= 0){ const at = R(0, letters.length); letters.splice(at, 0, "S", "Z"); }
    if(hasR) letters.unshift("R");
    let side = "F", ok = true;
    for(const c of letters){ if(c === "G" && side !== "N"){ ok = false; break; } if(c === "L" || c === "Z") side = side === "F" ? "N" : "F"; }
    if(ok && side === "F") return letters.map(take);
  }
  return plan.split("").map(take);
}
function build(lvIdx){
  const lv = LEVELS[lvIdx], tod = pick(lv.tods), pal = palette(tod), keys = pickKeys(lv);
  MK.set(SEEN, MK.get(SEEN, []).concat(keys).slice(-34));
  G = { lv, lvIdx, tod, pal, keys, events: [], cars: [], ents: [], nodes: [], ni: 1, kid: { x: 70, y: YF, side: "F" }, okN: 0, cur: -1, latched: true, blockT: 0, done: false, first: true, time: 0 };
  let x = 150, side = "F"; const yOf = s => s === "F" ? YF : YN;
  G.nodes.push({ x: 70, y: YF });
  let statics = "", top = "";
  keys.forEach((key, i) => {
    const [t, v, m] = key.split(":"), ev = { i, key, t, v, m, ok: true, started: false, done: false, cars: [], side, tm: 0 };
    G.events.push(ev);
    const fin = (nx, ny) => G.nodes.push({ x: nx, y: ny, finish: ev });
    if(t === "R"){ ev.xc = 70; G.nodes[0].stop = true; G.nodes[0].ev = ev; G.nodes[0].fork = true; G.nodes.push({ x: 120, y: YF, finish: ev }); return; }
    if(t === "L" || t === "Z"){
      const xc = x + 190; ev.xc = xc; ev.cross = true; ev.dead = v.startsWith("dead");
      statics += zebraSvg(xc); if(t === "L" || ev.dead) top += `<g id="lt${i}">${lightSvg(xc, ev.dead ? "off" : "red")}</g>`;
      if(v === "bus") statics += `<rect x="${xc - 190}" y="${RB + 8}" width="6" height="34" fill="#adb5bd" stroke="${INK}" stroke-width="1.5"/><rect x="${xc - 200}" y="${RB - 8}" width="26" height="20" rx="4" fill="#ffd43b" stroke="${INK}" stroke-width="2"/><path d="M${xc - 195} ${RB + 2}h16M${xc - 195} ${RB - 3}h16" stroke="${INK}" stroke-width="2"/>`;
      G.nodes.push({ x: xc - 90, y: yOf(side), start: ev });
      G.nodes.push({ x: xc, y: yOf(side), stop: true, curb: ev, gate: () => crossGate(ev) });
      side = side === "F" ? "N" : "F"; fin(xc, yOf(side)); x = xc + 110; return;
    }
    if(t === "D"){
      const xc = x + 170; ev.xc = xc;
      statics += side === "F" ? `<rect x="${xc - 30}" y="100" width="60" height="${RT - 100}" fill="${pal.road}" opacity=".55"/><rect x="${xc - 30}" y="52" width="60" height="48" fill="#868e96" stroke="${INK}" stroke-width="2"/>${[0, 1, 2, 3].map(j => `<path d="M${xc - 30} ${62 + j * 10}h60" stroke="${INK}" stroke-width="1.3" opacity=".5"/>`).join("")}`
        : `<rect x="${xc - 30}" y="${RB}" width="60" height="${H - RB}" fill="${pal.road}" opacity=".55"/><rect x="${xc - 34}" y="${H - 16}" width="68" height="16" fill="${pal.road}"/>`;

          + post(xs + 40, RB + 26, "draud", 26) + post(xs + 40, H - 16, "takas", 26);
        G.nodes.push({ x: xs, y: YN, stop: true, ev, fork: true }); G.nodes.push({ x: xs + 44, y: YN + 40 }); G.nodes.push({ x: xs + 170, y: YN + 40 }); fin(xs + 205, YN); x = xs + 215;
      } else {
        statics += `<path d="M${xs + 30} ${RB + 40}h190" stroke="#fff" stroke-width="3"/><rect x="${xs + 30}" y="${RB + 6}" width="190" height="34" fill="#e8590c" opacity=".28"/>`
          + [0, 1].map(j => `<g transform="translate(${xs + 80 + j * 90} ${RB + 23}) scale(.42)">${signSvg("dvir", 66)}</g><g transform="translate(${xs + 80 + j * 90} ${RB + 60}) scale(.42)">${signSvg("takas", 66)}</g>`).join("");

      }

  });
  const xEnd = x + 150; G.nodes.push({ x: xEnd, y: YF, end: true }); G.worldW = xEnd + 220;
  // mokykla
  statics += `<g transform="translate(${xEnd + 20} 100)"><rect x="-10" y="-74" width="170" height="74" fill="#d0ebff" stroke="${INK}" stroke-width="2.5"/><path d="M-18-72 75-104l93 32Z" fill="#1c7ed6" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="62" y="-34" width="26" height="34" fill="#8d5a2b" stroke="${INK}" stroke-width="2"/>${[8, 34, 100, 126].map(wx => `<rect x="${wx}" y="-56" width="18" height="18" fill="#fff" stroke="${INK}" stroke-width="2"/>`).join("")}
    <path d="M75-104v-22h20v12H75" fill="#ff4f5e" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/><rect x="52" y="-88" width="46" height="13" rx="3" fill="#fff" stroke="${INK}" stroke-width="1.5"/><path d="M58-81h34" stroke="${INK}" stroke-width="3" stroke-dasharray="5 3"/></g>`;

  scene.innerHTML = "";
  scene.classList.toggle("dark", pal.dark);
  G.world = el("g"); scene.appendChild(G.world);
  G.world.appendChild(el("g", bgBlock(-200, G.worldW + 400, pal, lvIdx + 1) + statics));
  G.layFar = el("g"); G.layKidA = el("g"); G.layNear = el("g"); G.layKidB = el("g"); G.layTop = el("g", top);

  if(pal.dark && !keys.some(k => k[0] === "R")) G.kid.refl = true;   // tamsoje be atšvaito užduoties – atšvaitas jau prisegtas

}

/* ---------- automobiliai ---------- */
function mkCar(ev, lane, x, o){
  o = o || {};
  const c = { lane, x, max: o.v || SPEED, v: o.v0 != null ? o.v0 : (o.v || SPEED), w: o.w || 84, kind: o.kind || "car", stopX: null, ev, late: o.late, dir: lane === "N" ? 1 : -1 };
  c.el = el("g", SPR[c.kind](o.col || pick(CARCOL))); (lane === "N" ? G.layNear : G.layFar).appendChild(c.el);
  G.cars.push(c); if(ev) ev.cars.push(c); return c;
}
const stopLine = (c, xc) => xc - c.dir * (ZW + 14 + c.w / 2);
const passed = (c, xc) => c.dir > 0 ? c.x - c.w / 2 > xc + ZW + 4 : c.x + c.w / 2 < xc - ZW - 4;
const trySt = (c, xc) => { if(c.late || c.stopX != null || passed(c, xc)) return; const line = stopLine(c, xc), d = (line - c.x) * c.dir; if(d > c.v * c.v / (2 * ACC) + 4) c.stopX = line; else c.late = true; };
const danger = (c, xc) => !passed(c, xc) && c.v > 7 && Math.abs(c.x - xc) < 340;
function updCars(dt){
  for(const c of G.cars){
    if(c.stopX != null){ const d = (c.stopX - c.x) * c.dir; c.v = d <= .6 ? 0 : Math.min(c.max, Math.sqrt(2 * ACC * d), c.v + ACC * dt); }
    else c.v = Math.min(c.max, c.v + ACC * dt);
    c.x += c.v * c.dir * dt;
    const s = c.lane === "N" ? .86 : .78;
    c.el.setAttribute("transform", `translate(${c.x.toFixed(1)} ${c.lane === "N" ? LN : LF}) scale(${s * c.dir} ${s})`);
    if(Math.abs(c.x - G.kid.x) > 900){ c.dead = true; c.el.remove(); }
  }
  G.cars = G.cars.filter(c => !c.dead);
}

/* ---------- situacijų logika ---------- */
function setMod(ev){ if(ev.m){ G.kid.mod = ev.m; kidClass(); modb.innerHTML = CARD[ev.m](); modb.setAttribute("aria-label", T.aria[ev.m]); modb.classList.add("show"); say(T.hint[ev.m]); } }
function startEv(ev){
  if(ev.started) return; ev.started = true; G.cur = ev.i; G.dots.cur(ev.i);
  const xc = ev.xc;
  if(ev.t === "L"){
    setMod(ev); if(!ev.m) say(T.hint.light);
    const v = ev.v;
    if(v === "red" || v === "late"){ ev.ph = "red"; ev.tm = v === "late" ? 3.2 : 3.8; mkCar(ev, "N", xc - 230); mkCar(ev, "F", xc + 300); ev.sp = 1.2; }
    else if(v === "blink"){ ev.ph = "blink"; ev.tm = 2.6; }
    else { ev.ph = "green"; ev.tm = 9; const c = mkCar(ev, "F", 0, { v0: 0 }); c.x = stopLine(c, xc); c.stopX = c.x;
      if(v === "amb"){ ev.amb = mkCar(ev, "N", xc - 420, { kind: "amb", w: 96, v: 150 }); ev.amb.late = true; }
      else { const d = mkCar(ev, "N", 0, { v0: 0 }); d.x = stopLine(d, xc); d.stopX = d.x; } }
    setLight(ev);
  }
  if(ev.t === "Z"){
    setMod(ev); if(!ev.m) say(ev.dead ? T.hint.dead : T.hint.zebra);
    const v = ev.v;
    if(v === "left" || v === "deadL") mkCar(ev, "N", xc - 470);
    if(v === "right" || v === "deadR") mkCar(ev, "F", xc + 470);
    if(v === "two"){ mkCar(ev, "N", xc - 420); mkCar(ev, "F", xc + 690); }
    if(v === "stops"){ ev.yielder = mkCar(ev, pick(["N", "F"]), 0); ev.yielder.x = xc - ev.yielder.dir * 520; }
    if(v === "bus"){ ev.bus = mkCar(ev, "N", 0, { kind: "bus", w: 160, v: 84, v0: 0 }); ev.bus.x = xc - ZW - 14 - 80; ev.bus.stopX = ev.bus.x; ev.busT = 3.4; }
  }
  if(ev.t === "D"){
    say(T.hint.drive); ev.active = true; ev.tm = 0; $("wr" + ev.i).style.display = "";
    const far = ev.side === "F"; ev.col = pick(CARCOL);
    if(ev.v === "out"){ ev.fr = el("g", SPR.front(ev.col)); (far ? G.layFar : G.layKidB).appendChild(ev.fr); ev.y0 = far ? 96 : H + 44; ev.y1 = far ? RT + 22 : RB + 6; }
    else { ev.car = mkCar(ev, far ? "F" : "N", 0, { col: ev.col }); ev.car.x = xc - ev.car.dir * 360; ev.car.stopX = xc; }
  }
}
function setLight(ev){ const g = $("lt" + ev.i); if(!g) return; const lt = g.firstChild; lt.setAttribute("class", "lt st-" + (ev.dead ? "off" : ev.ph)); }
function updEv(ev, dt){
  if(!ev.started) return;
  const xc = ev.xc;
  if(ev.t === "L"){
    if(ev.done){ if(ev.ph !== "red"){ ev.ph = "red"; setLight(ev); ev.cars.forEach(c => c.stopX = null); } return; }
    if(!ev.crossing) ev.tm -= dt;
    if(ev.ph === "red"){
      ev.sp -= dt; if(ev.sp <= 0 && ev.tm > 1.3){ ev.sp = 1.9; ev.alt = !ev.alt; const l = ev.alt ? "N" : "F"; mkCar(ev, l, l === "N" ? xc - 400 : xc + 400); }
      if(ev.tm <= 0){ ev.ph = "green"; ev.tm = 9; setLight(ev); MK.sfx.beep(true);
        if(ev.v === "late" && !ev.lateDone){ ev.lateDone = true; const c = mkCar(ev, "N", xc - 190, { v: 135 }); c.late = true; } }
    } else if(ev.ph === "green"){ if(ev.tm <= 0){ ev.ph = "blink"; ev.tm = 2.6; setLight(ev); } }
    else if(ev.ph === "blink"){ if(ev.tm <= 0){ ev.ph = "red"; ev.tm = 4.4; ev.sp = .2; setLight(ev); ev.cars.forEach(c => c.stopX = null); } }
    if(ev.ph !== "red") ev.cars.forEach(c => trySt(c, xc));
    if(ev.amb && !passed(ev.amb, xc)){ ev.sir = (ev.sir || 0) - dt; if(ev.sir <= 0){ ev.sir = .32; ev.hi = !ev.hi; MK.sfx.beep(ev.hi); } }
  }
  if(ev.t === "Z"){
    if(ev.done){ ev.cars.forEach(c => c.stopX = null); return; }
    if(ev.yielder && ev.atCurb) trySt(ev.yielder, xc);
    if(ev.bus && ev.atCurb && !ev.busGone){ ev.busT -= dt; if(ev.busT <= 0){ ev.busGone = true; ev.bus.stopX = null; MK.sfx.vroom(); } }
    if(ev.crossing) ev.cars.forEach(c => { if(c !== ev.bus) trySt(c, xc); });
  }
  if(ev.t === "D" && ev.active){
    ev.tm += dt; ev.bp = (ev.bp || 0) - dt; if(ev.bp <= 0){ ev.bp = .5; MK.sfx.beep(); }
    const far = ev.side === "F", sc = far ? .7 : .9;
    if(ev.v === "out"){
      const k = Math.min(1, ev.tm / 3); const y = ev.y0 + (ev.y1 - ev.y0) * k;
      ev.fr.setAttribute("transform", `translate(${xc} ${y}) scale(${sc})`);
      if(k >= 1){ ev.fr.remove(); const c = mkCar(null, far ? "F" : "N", xc, { col: ev.col, v0: 20 }); c.x = xc; endDrive(ev); }
    } else {
      if(!ev.turn && ev.car.v === 0 && ev.tm > .5){ ev.turn = ev.tm; ev.car.dead = true; ev.car.el.remove(); ev.fr = el("g", SPR.front(ev.col)); (far ? G.layFar : G.layKidB).appendChild(ev.fr); }
      if(ev.turn){ const k = Math.min(1, (ev.tm - ev.turn) / 2.6), y0 = far ? RT + 22 : RB + 6, y1 = far ? 92 : H + 50; ev.fr.setAttribute("transform", `translate(${xc} ${y0 + (y1 - y0) * k}) scale(${sc})`); if(k >= 1){ ev.fr.remove(); endDrive(ev); } }
    }
  }
}
function endDrive(ev){ ev.active = false; $("wr" + ev.i).style.display = "none"; if(!G.blockT) say(T.hint.go); }
function crossGate(ev){
  const xc = ev.xc;
  if(G.kid.mod) return G.kid.mod;
  if(ev.t === "L"){
    if(ev.ph === "red") return "red";
    if(ev.ph === "blink") return "blink";
    if(ev.amb && !passed(ev.amb, xc)) return "amb";
    if(ev.cars.some(c => danger(c, xc))) return "late";
    return null;
  }
  if(!ev.lookL || !ev.lookR) return "look";
  if(ev.bus && !passed(ev.bus, xc)) return "bus";
  if(ev.cars.some(c => danger(c, xc))) return "car";
  return null;
}
function goodKey(ev){ return ev.t === "L" ? (ev.v === "amb" ? "amb" : "light") : ev.t === "Z" ? (ev.v === "stops" ? "stops" : ev.v === "bus" ? "bus" : "zebra") : ev.t === "D" ? "drive" : ev.t === "R" ? "refl" : ev.v; }
function finishEv(ev){
  if(ev.done) return; ev.done = true; ev.crossing = false;
  G.dots.mark(ev.i, ev.ok); showLooks(false);
  if(ev.ok){ G.okN++; store.safe++; MK.set(STORE, store); MK.sfx.good(); starFly(); }
  say(`${ev.ok ? pick(T.praise) + " " : ""}${T.good[goodKey(ev)]}`);
  progress();
}
function violation(key, ev){
  if(ev) ev.ok = false; MK.sfx.bad(); holding = false; G.latched = true; G.blockT = .9; walkBtn(false);
  sw.classList.remove("flash"); void sw.offsetWidth; sw.classList.add("flash");
  if(ev && ev.t === "Z"){ ev.lookL = ev.lookR = false; if(ev.atCurb) showLooks(true); }
  say(T.bad[key], "bad");
}

/* ---------- pasirinkimų kortelės ---------- */
function forkOpts(ev){
  const v = ev.v;
  if(ev.t === "S") return [["across", CARD.across(), false], ["zebra", CARD.toZebra(), true]];
  if(ev.t === "F") return [["run", CARD.run(v), false], v === "friend" ? ["zebra", CARD.toZebra(), true] : ["stop", CARD.stop(), true]];
  if(ev.t === "G") return v === "signs" ? [["draud", CARD.sign("draud"), false], ["takas", CARD.sign("takas"), true]] : [["dvir", CARD.sign("dvir"), false], ["takas", CARD.sign("takas"), true]];
  const sets = { a: ["glasses", "toy"], b: ["cap", "ball"], c: ["toy", "cap"] }[ev.m];
  return [["refl", CARD.item("refl"), true]].concat(sets.map(k => [k, CARD.item(k), false]));
}
function showFork(ev){
  if(!ev.started){ ev.started = true; G.cur = ev.i; G.dots.cur(ev.i); }
  say(T.hint[ev.t === "R" ? "refl" : ev.v]);
  if(ev.t === "F" && ev.v !== "friend" && !ev.toy){
    ev.toy = el("g", ev.v === "dog" ? dogSvg : ballSvg); G.layKidA.appendChild(ev.toy); ev.toyT = 0;
  }
  ctl.innerHTML = `<div class="cards">${MK.shuffle(forkOpts(ev)).map(([k, svg, ok], j) => `<button type="button" data-ok="${ok ? 1 : 0}" data-k="${k}" style="animation-delay:${j * 90}ms">${svg}</button>`).join("")}</div>`;
  G.fork = ev;
}
function onCard(b){
  const ev = G.fork; if(!ev) return; MK.unlock();
  if(b.dataset.ok === "1"){
    b.classList.add("ok"); G.fork = null; ev.resolved = true;
    if(ev.t === "R"){ G.kid.refl = true; kidClass(); }
    if(ev.t === "F" && ev.v !== "friend") mkCar(ev, "N", G.kid.x - 300);
    if(ev.t === "G" && ev.v === "bike"){ ev.cyc = el("g", cyclistSvg); G.layKidA.appendChild(ev.cyc); ev.cx = ev.xc + 330; G.ents.push(dt => { ev.cx -= 150 * dt; ev.cyc.setAttribute("transform", `translate(${ev.cx} ${RB + 30}) scale(-.7 .7)`); return ev.cx < ev.xc - 300; }); }
    MK.sfx.tap(); setTimeout(() => { if(G && !G.done){ walkCtl(); say(T.hint.go); } }, 450);
  } else { b.classList.add("no"); ev.ok = false; MK.sfx.bad(); say(T.bad[ev.t === "S" ? "short" : ev.t === "R" ? "refl" : ev.v], "bad"); if(ev.t === "G" && ev.v === "bike") MK.sfx.beep(true); }
}

/* ---------- valdymas ---------- */
function walkCtl(){
  ctl.innerHTML = `<button type="button" class="look" id="lookL" aria-label="${T.aria.lookL}">${eyeSvg(-1)}</button>
    <button type="button" class="walk" id="walk" aria-label="${T.aria.walk}">${feetSvg}<span>${T.walk}</span></button>
    <button type="button" class="look" id="lookR" aria-label="${T.aria.lookR}">${eyeSvg(1)}</button>`;
  const w = $("walk");
  const down = e => { e.preventDefault(); MK.unlock(); holding = true; G.latched = false; walkBtn(true); if(G.first){ G.first = false; w.classList.remove("coach"); } };
  const up = () => { holding = false; walkBtn(false); };
  w.addEventListener("pointerdown", down); ["pointerup", "pointercancel", "pointerleave"].forEach(n => w.addEventListener(n, up));
  w.addEventListener("contextmenu", e => e.preventDefault());
  if(G.first) w.classList.add("coach");
  $("lookL").onclick = () => look(-1); $("lookR").onclick = () => look(1);
  const ev = G.events[G.cur]; if(ev && ev.atCurb && !ev.done && ev.t === "Z") showLooks(true);
}
function walkBtn(on){ const w = $("walk"); if(w) w.classList.toggle("on", on); }
function showLooks(on){ const a = $("lookL"), b = $("lookR"); if(!a) return; const ev = G.events[G.cur];
  a.classList.toggle("show", on); b.classList.toggle("show", on); a.classList.toggle("done", !!(on && ev && ev.lookL)); b.classList.toggle("done", !!(on && ev && ev.lookR)); }
function look(dir){
  const ev = G.events[G.cur]; if(!ev || ev.t !== "Z" || !ev.atCurb || ev.done) return; MK.unlock(); MK.sfx.tap();
  if(dir < 0) ev.lookL = true; else ev.lookR = true; showLooks(true);
  const xc = ev.xc, lane = dir < 0 ? "N" : "F";
  const bad = ev.cars.some(c => c.lane === lane && (danger(c, xc) || (c === ev.bus && !passed(c, xc))));
  const k = G.kid, by = k.y - 70;
  G.bubble.innerHTML = `<g transform="translate(${k.x + dir * 34} ${by})"><circle r="17" fill="${bad ? "#ffd3c7" : "#b8f0c4"}" stroke="${INK}" stroke-width="2.5"/>${bad ? `<g transform="translate(0 6) scale(${.3 * -dir} .3)">${SPR.car("#e03131")}</g>` : `<path d="M-8 0l6 6 10-12" fill="none" stroke="#2b8a3e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>`}</g>`;
  clearTimeout(G.bt); G.bt = setTimeout(() => { if(G) G.bubble.innerHTML = ""; }, 1300);
}
modb.addEventListener("click", () => { if(!G || !G.kid.mod) return; MK.unlock(); MK.sfx.tap(); G.kid.mod = ""; kidClass(); modb.classList.remove("show"); const ev = G.events[G.cur]; if(ev) say(ev.t === "L" ? T.hint.light : ev.dead ? T.hint.dead : T.hint.zebra); });
ctl.addEventListener("click", e => { const b = e.target.closest(".cards button"); if(b) onCard(b); });
document.addEventListener("keydown", e => { if(play.hidden || !G) return; if(e.code === "Space" || e.code === "ArrowUp"){ e.preventDefault(); if(!e.repeat){ holding = true; G.latched = false; walkBtn(true); G.first = false; } } if(e.code === "ArrowLeft") look(-1); if(e.code === "ArrowRight") look(1); });
document.addEventListener("keyup", e => { if(e.code === "Space" || e.code === "ArrowUp"){ holding = false; walkBtn(false); } });
window.addEventListener("blur", () => { holding = false; walkBtn(false); });

/* ---------- pagalbiniai ---------- */
function say(html, mood){ MK.say($("g"), html, mood); }
function kidClass(){ const k = G.kid; G.kidEl.setAttribute("class", "kidg" + (k.walking ? " walk" : "") + (k.mod ? " " + k.mod : "") + (k.refl ? " refl" : "") + (G.pal.dark && !k.refl ? " dim" : "")); }
function starFly(){ const s = document.createElement("div"); s.className = "starfly"; s.style.left = "calc(50% - 60px)"; s.style.top = "45%"; s.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.5 5.700 21.100l1.500-7L2 9.300l7-.8Z" fill="#ffc61a" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/></svg>`; sw.appendChild(s); setTimeout(() => s.remove(), 950); }
function progress(){ const p = Math.max(0, Math.min(1, (G.kid.x - 70) / (G.nodes[G.nodes.length - 1].x - 70))) * 100; $("pathFill").style.width = p + "%"; $("pk").style.left = p + "%"; }

/* ---------- ciklas ---------- */
function tick(ts){
  raf = requestAnimationFrame(tick);
  const dt = Math.min(.05, (ts - lastT) / 1000 || 0); lastT = ts; if(!G || G.done) return;
  step(dt);
}
function step(dt){
  G.time += dt; if(G.blockT > 0) G.blockT = Math.max(0, G.blockT - dt);
  const k = G.kid; let moving = false;
  if(holding && !G.latched && !G.blockT && !G.fork){
    const prev = G.nodes[G.ni - 1], nx = G.nodes[G.ni];
    const atPrev = Math.abs(k.x - prev.x) < .5 && Math.abs(k.y - prev.y) < .5;
    let v = null;
    if(atPrev && prev.fork && !prev.ev.resolved){ showFork(prev.ev); }
    else {
      if(atPrev && prev.gate){ v = prev.gate(); if(v) violation(v, prev.curb || G.events[G.cur]); else { if(prev.curb){ prev.curb.crossing = true; showLooks(false); G.bubble.innerHTML = ""; } prev.gate = null; } }
      if(!v && nx){
        const dx = nx.x - k.x, dy = nx.y - k.y, d = Math.hypot(dx, dy), s = KSPEED * dt;
        if(d <= s){ k.x = nx.x; k.y = nx.y; arrive(nx); } else { k.x += dx / d * s; k.y += dy / d * s; }
        moving = true;
      }
    }
  }
  if(moving !== !!k.walking){ k.walking = moving; kidClass(); }
  if(moving){ G.stepT = (G.stepT || 0) - dt; if(G.stepT <= 0){ G.stepT = .36; MK.sfx.hop(G.ni); } progress(); }
  for(const ev of G.events) updEv(ev, dt);
  for(const ev of G.events) if(ev.toy && ev.toyT < 1){ ev.toyT = Math.min(1, ev.toyT + dt / 1.1); const dirY = ev.side === "F" ? 1 : -1, ty = (ev.side === "F" ? RT : RB) + dirY * (ev.v === "dog" ? 96 : 52) * ev.toyT; ev.toy.setAttribute("transform", `translate(${ev.xc + 26 * ev.toyT} ${ty - Math.abs(Math.sin(ev.toyT * 9)) * 8})`); }
  G.ents = G.ents.filter(f => !f(dt));
  updCars(dt);
  // veikėjas ir kamera
  const sc = .64 + (k.y - YF) / (YN - YF) * .16;
  G.kidEl.setAttribute("transform", `translate(${k.x.toFixed(1)} ${k.y.toFixed(1)}) scale(${sc.toFixed(3)})`);
  const lay = k.y > LN - 4 ? G.layKidB : G.layKidA; if(G.kidEl.parentNode !== lay) lay.appendChild(G.kidEl);
  const cam = Math.max(-10, Math.min(G.worldW - W, k.x - 140));
  G.world.setAttribute("transform", `translate(${(-cam).toFixed(1)} 0)`);
}
function arrive(n){
  if(n.start) startEv(n.start);
  if(n.curb){ const ev = n.curb; ev.atCurb = true; if(ev.t === "Z") showLooks(true); }
  if(n.fork && !n.ev.resolved){ showFork(n.ev); }
  if(n.stop){ G.latched = true; holding = false; walkBtn(false); }
  if(n.finish) finishEv(n.finish);
  if(n.end) return finale();
  G.ni++;
}
function finale(){
  G.done = true; G.kid.walking = false; kidClass(); MK.sfx.win();
  const total = G.events.length, stars = MK.starsFor(G.okN, total); MK.best(GAME, G.lv.id, stars);
  const lvIdx = G.lvIdx;
  setTimeout(() => MK.result({ stars, text: T.result(G.okN, total), next: lvIdx < LEVELS.length - 1 ? () => start(lvIdx + 1) : null, again: () => start(lvIdx), menu: showMenu }), 700);
}
function stopLoop(){ cancelAnimationFrame(raf); raf = 0; holding = false; G = null; modb.classList.remove("show"); }
function start(i){
  stopLoop(); menu.hidden = true; play.hidden = false;
  build(i); G.dots = MK.dots($("dots"), G.events.length); $("g").innerHTML = MK.guide(T.hint.first);
  walkCtl(); progress(); step(0);
  if(G.nodes[0].fork) showFork(G.nodes[0].ev);
  lastT = performance.now(); raf = requestAnimationFrame(tick); window.scrollTo(0, 0);
}
window.__mkTest = { get G(){ return G; }, step, CAT, LEVELS, hold: v => { holding = v; if(v && G) G.latched = false; }, crossGate, look, start };
showMenu();
})();
</script>
<style>
.lt .on{display:none}
.lt.st-red .lr .on,.lt.st-green .lg .on,.lt.st-blink .lg .on{display:block}
.lt.st-blink .lg{animation:bl .7s steps(2) infinite}
</style>
</body>
