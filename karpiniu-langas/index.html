<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MokomėsKartu">
<link rel="apple-touch-icon" href="/logo/mk-ikona-180.png">
<title>Karpinių langas – MokomėsKartu.lt</title>
<meta name="description" content="2–3 klasių matematikos žaidimas: simetrijos ašis, simetriškos figūros languotame popieriuje, lankstymas ir karpiniai.">
<meta name="theme-color" content="#fff9e6">
<meta name="robots" content="noindex">
<link rel="icon" href="/logo/mk-ikona.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800&family=Manrope:wght@600;700;800&display=swap">
<script src="/bendra/mk.js"></script>
<script src="/karpiniu-langas/tekstai.lt.js"></script>
<style>
/* Meniu: karpytoja Ugnė prie lango, „Mano langas“ (karpinių kolekcija), „Kurk savo karpinį“, lygiai, „Noriu pasimokyti“.
   Užduotys: Taip/Ne su lapo lankstymu, karpinio užbaigimas languotame lape, „Kas išeis išlanksčius?“, simetrijos ašių žymėjimas. */
body{--ac:#d83a52;--ac-ink:#fff;--ac-soft:#ffe3e8}
.mk-hero{padding-top:0}
.mk-hero h1{margin-top:8px;font-size:clamp(34px,8.6vw,56px)}
.mk-hero p{max-width:42ch;font-size:16.5px}
.hero-art{width:min(100%,480px);border-radius:26px;overflow:hidden;position:relative;box-shadow:0 6px 0 rgba(18,26,51,.15)}
.hero-art svg{display:block;width:100%;height:auto}
.hero-art::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 3px var(--ink);pointer-events:none}
.col{width:100%;max-width:520px;margin:0 auto 14px;padding:12px 14px 14px;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 2.5px var(--ink),0 5px 0 rgba(18,26,51,.14)}
.col h2{margin:0;font:800 18px/1.2 var(--kid);display:flex;gap:8px;align-items:center}
.col h2 svg{width:30px;height:30px;flex:none}
.col p{margin:4px 0 10px;color:var(--soft);font-weight:700;font-size:14.5px}
.col h3{margin:12px 0 6px;font:800 14px/1.2 var(--body);color:var(--soft)}
.win{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;padding:7px;border-radius:12px;background:#8a5a33;box-shadow:inset 0 0 0 2px #121a33}
.win>div{aspect-ratio:1;border-radius:5px;background:linear-gradient(160deg,#dff3ff,#b9e0fb);display:grid;place-items:center;overflow:hidden;position:relative}
.win>div.off{background:linear-gradient(160deg,#eef6fb,#dbe9f2)}
.win>div.off::after{content:"?";font:800 17px/1 var(--kid);color:#9db5c6}
.win svg{width:82%;height:82%;display:block}
.win .new{animation:mkPop .7s cubic-bezier(.2,1.6,.4,1)}
.freebtn{display:flex;width:100%;max-width:520px;margin:0 auto 16px}
.hud{display:flex;align-items:center;gap:8px;margin:0 0 8px;min-height:36px}
.hud .mk-dots{margin-right:auto;justify-content:flex-start}
.chip{display:inline-flex;align-items:baseline;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink);font:800 17px/36px var(--kid);white-space:nowrap}
.chip small{font:800 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.chip.pop{animation:mkPop .35s cubic-bezier(.2,1.6,.4,1)}
#guide{max-width:600px;margin:0 auto 10px}
#guide .mk-bubble{font-size:16.5px}
.card{width:100%;max-width:600px;margin:0 auto 10px;padding:12px 12px 14px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.12)}
.board{margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.board svg{display:block;width:100%;height:auto;touch-action:none;overflow:visible}
.board.lock{pointer-events:none}
.board.shake{animation:mkShake .45s}
.cap{margin:0 0 6px;text-align:center;font:800 13px/1.2 var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}
.ans{display:grid;gap:10px;margin-top:12px}
.ans.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.a{min-height:54px;padding:8px 12px;border:0;border-radius:16px;background:#fff;cursor:pointer;text-align:center;font:800 20px/1.2 var(--kid);color:var(--ink);
  box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.16);transition:transform .1s;touch-action:manipulation}
.a:active{transform:translateY(3px)}
.a.ok{background:#dff7e6;box-shadow:inset 0 0 0 3.5px var(--good),0 4px 0 rgba(18,26,51,.16)}
.a.no{background:#ffe6df;box-shadow:inset 0 0 0 3.5px var(--bad),0 4px 0 rgba(18,26,51,.16)}
.ans.done .a{pointer-events:none}
.ans.done .a:not(.ok):not(.no){opacity:.5}
.opt{position:relative;padding:8px}
.opt svg{display:block;width:100%;height:auto;border-radius:6px}
.opt i{position:absolute;left:6px;top:6px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font:800 15px/26px var(--kid);font-style:normal}
.tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0 0}
.tools .mk-btn{min-height:48px;padding:8px 20px;font-size:18px}
.go{display:flex;width:100%;max-width:600px;margin:4px auto 0}
.fade{animation:mkIn .4s cubic-bezier(.2,1.2,.4,1)}
.ax-l{cursor:pointer}
.sw{display:flex;gap:10px;justify-content:center;margin:10px 0 0}
.sw button{width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;box-shadow:inset 0 0 0 2.5px var(--ink);padding:0}
.sw button.on{box-shadow:inset 0 0 0 2.5px var(--ink),0 0 0 3px #fff,0 0 0 6px var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.seg button{min-height:44px;border:0;border-radius:12px;background:#fff;cursor:pointer;font:800 15px/1.2 var(--body);box-shadow:inset 0 0 0 2.5px var(--ink)}
.seg button.on{background:var(--ac);color:#fff}
.note{min-height:22px;margin:8px 0 0;text-align:center;font:800 15px/1.35 var(--body);color:#1c8a52}
.note.warn{color:#b8531a}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <section id="menu">
    <div class="mk-hero"><div class="hero-art" id="heroArt"></div><h1 id="heroH"></h1><p id="heroP"></p></div>
    <div class="col" id="col"></div>
    <button type="button" class="mk-btn alt freebtn" id="freeBtn"></button>
    <div id="levels"></div>
    <div id="learn"></div>
  </section>
  <section id="play" hidden>
    <div class="hud"><div id="dots"></div><span class="chip" id="ptsChip"><b id="pts">0</b><small id="ptsL"></small></span></div>
    <div id="guide"></div>
    <div id="flow"></div>
  </section>
  <section id="free" hidden></section>
</div>
<script>
(function(){
"use strict";
const T = window.MK_T, GAME = "karpiniu-langas", GRADES = [2, 3];
const $ = id => document.getElementById(id), R = MK.rnd, PK = MK.pick, SH = MK.shuffle;
const K = "#121a33", C = 30, P = 18;
const COLS = ["#d83a52", "#2f6fd6", "#2f9e5b", "#7a4fd0", "#e8790c"];

/* ================= langelių tinklelio veiksmai ================= */
const parse = s => s.split("/").map(r => [...r].map(c => c === "#" ? 1 : 0));
const copy = g => g.map(r => r.slice());
const mirX = g => g.map(r => r.slice().reverse());
const mirY = g => g.slice().reverse().map(r => r.slice());
const tr = g => g[0].map((_, x) => g.map(r => r[x]));
const joinH = (a, b) => a.map((r, i) => r.concat(b[i]));
const joinV = (a, b) => copy(a).concat(copy(b));
const gkey = g => g.map(r => r.join("")).join("/");
const blank = (W, H) => Array.from({ length: H }, () => Array(W).fill(0));
const place = (g, W, H, ox, oy) => { const b = blank(W, H); g.forEach((r, y) => r.forEach((v, x) => { if(v) b[y + oy][x + ox] = 1; })); return b; };
const count = g => g.reduce((s, r) => s + r.reduce((a, b) => a + b, 0), 0);
const refl = (x, y, ax) => ax.d === "v" ? [2 * ax.p - 1 - x, y] : [x, 2 * ax.p - 1 - y];
const inb = (g, x, y) => y >= 0 && y < g.length && x >= 0 && x < g[0].length;
/* Langeliai, kuriems sulenkus per ašį nėra poros (tušti sąrašas – figūra simetriška). */
function mism(g, ax){
  const out = [], seen = new Set();
  g.forEach((r, y) => r.forEach((v, x) => { if(!v) return; const [a, b] = refl(x, y, ax);
    if(!inb(g, a, b) || !g[b][a]){ const k = inb(g, a, b) ? a + "," + b : x + "," + y; if(!seen.has(k)){ seen.add(k); out.push(k.split(",").map(Number)); } } }));
  return out;
}
const isSym = (g, ax) => mism(g, ax).length === 0;
function toggleNear(g, x0, x1, y0, y1){
  const c = [];
  for(let y = y0; y <= y1; y++) for(let x = x0; x <= x1; x++){
    const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => inb(g, x + a, y + b) && g[y + b][x + a]);
    if(g[y][x] || nb) c.push([x, y]);
  }
  if(!c.length) return null; const [x, y] = PK(c), o = copy(g); o[y][x] ^= 1; return o;
}

/* ================= karpinių rinkinys: kairioji pusė, dešinysis simbolis – prie ašies ================= */
const RAW = {
  S: { sirdele: ".#./###/###/.##/..#/...", eglute: "..#/.##/..#/.##/###/..#", namelis: "..#/.##/###/###/##./##.", grybas: ".##/###/###/..#/..#/.##",
    taure: "###/###/.##/..#/..#/.##", deimantas: "..#/.##/###/###/.##/..#", raketa: "..#/.##/.##/.##/###/#.#", zmogeliukas: ".##/.##/###/.##/.#./.#.",
    medis: ".##/###/###/###/..#/..#", kate: "#../###/#.#/###/###/.##", tulpe: "#.#/###/###/.##/..#/..#", obuolys: "..#/##./###/###/###/.##",
    karuna: ".../#.#/#.#/###/###/###", asotis: ".##/..#/.##/###/###/.##", varpelis: "..#/.##/.##/###/###/..#", inkaras: "..#/.##/..#/#.#/###/.##",
    snaige: "..#/#.#/.##/.##/#.#/..#" },
  M: { egle: "...#/..##/.###/..##/.###/####/...#/...#", drugelis: "#..#/##.#/####/####/.###/####/###./##..", pilis: "#.#./#.#./####/####/####/###./###./###.",
    zvaigzde: "...#/...#/####/.###/..##/.###/###./#...", robotas: "...#/.###/.#.#/.###/####/#.##/..##/.##.", peleda: "#.../####/#..#/####/####/.###/..##/..#.",
    boruze: "..#./..##/.###/####/####/####/.###/..##", vaza: ".###/..##/..##/.###/####/####/####/.###", taure2: "####/####/.###/..##/...#/...#/..##/.###",
    sketis: "..##/.###/####/####/...#/...#/...#/...#", balionas: ".###/####/####/####/.###/..##/...#/..##", tulpe2: "#..#/##.#/####/.###/...#/.#.#/..##/...#",
    raketa2: "...#/..##/..##/..##/.###/.###/####/#..#", namas: "...#/..##/.###/####/.###/.#.#/.###/.##.", snaige2: "...#/.#.#/..##/####/####/..##/.#.#/...#",
    saule: "#..#/.###/.###/####/####/.###/.###/#..#", remelis: "####/#.../#.##/#.##/#.##/#.##/#.../####", zmogus: "..##/..##/...#/####/..##/..##/..#./.##." },
  L: { egle3: "....#/...##/..###/...##/..###/.####/..###/.####/#####/....#", sirdis: ".##../####./#####/#####/#####/.####/..###/...##/....#/.....",
    drugelis2: "##.../###.#/#####/#####/.####/..###/.####/#####/###.#/##...", pilis2: "#.#.#/#.#.#/#####/#####/##.##/#####/#####/####./####./####.",
    kate2: "#..../##.../#####/##.##/#####/####./#####/.####/..###/.....", zvaigzde2: "....#/....#/...##/#####/.####/..###/..###/.####/###../#....",
    snaige3: "....#/.#..#/..#.#/...##/#####/#####/...##/..#.#/.#..#/....#", saule2: "#...#/.#..#/..###/..###/#####/#####/..###/..###/.#..#/#...#",
    gele: "..##./.####/.####/..###/....#/#...#/.##.#/..###/....#/....#", robotas2: "....#/.####/.#.##/.####/...##/#####/#.###/#.###/..##./.###.",
    raketa3: "....#/...##/..###/..##./..###/..###/.####/#####/#.###/#..#.", vaza2: ".####/..###/...##/..###/.####/#####/#####/#####/.####/..###",
    inkaras2: "...##/...##/....#/..###/....#/....#/#...#/##..#/.####/..###", grybas2: "..###/.####/#####/#####/#####/...##/...##/...##/...##/..###",
    ledai: "..###/.####/.####/#####/.####/..###/..###/...##/...##/....#", karuna2: "...../...../#...#/#.#.#/#####/#####/##.##/#####/...../.....",
    obuolys2: "....#/...#./.##../####./#####/#####/#####/#####/.####/..##.", varpas: "....#/...##/..###/..###/..###/.####/.####/#####/#####/....#" }
};
const DES = [];
Object.keys(RAW).forEach(sz => Object.keys(RAW[sz]).forEach(id => {
  const half = parse(RAW[sz][id]), g = joinH(half, mirX(half));
  DES.push({ id, sz, half, g, four: gkey(mirY(g)) === gkey(g), col: COLS[DES.length % COLS.length] });
}));
const DBY = {}; DES.forEach(d => DBY[d.id] = d);
/* Nesimetriškos mažos figūros „Karpinių dvynėms“ */
const MOT = ["#./#./##", "##/#./#.", "###/#../#..", "#../###", ".#/##/#.", "#./##/.#", "#../##./###", "##./.##/..#", "#.#/###/#..", ".#./###/#..", "##/##/#.",
  "..#/###/#.#", "###/##./#..", "#../#../###/#.#", "##./##./#../##.", ".##/###/##.", "##/##/#./#.", "###/#../##./#..", ".#/.#/##", "#.#/###/..#",
  "##./.#./.##", "..#/.##/###/#.#", "###/..#/.##", "#../###/.#.", ".##/.#./##./#..", "#.#/##./#.."].map(parse);

/* Atsitiktinis ornamentas: pusė (arba ketvirtis), prigludusi prie ašies. */
function rndBlob(w, h, n, both){
  const g = blank(w, h), cells = []; let y = R(0, h - 1), x = w - 1; if(both){ y = h - 1; }
  g[y][x] = 1; cells.push([x, y]);
  for(let i = 0; i < 200 && cells.length < n; i++){
    const [cx, cy] = PK(cells), [dx, dy] = PK([[1, 0], [-1, 0], [0, 1], [0, -1]]), a = cx + dx, b = cy + dy;
    if(inb(g, a, b) && !g[b][a]){ g[b][a] = 1; cells.push([a, b]); }
  }
  return g;
}

/* ================= piešiniai ================= */
function thumb(g, col, bg){
  const W = g[0].length, H = g.length; let s = "";
  g.forEach((r, y) => r.forEach((v, x) => { if(v) s += `<rect x="${x}" y="${y}" width="1.04" height="1.04"/>`; }));
  return `<svg viewBox="-0.5 -0.5 ${W + 1} ${H + 1}" aria-hidden="true">${bg ? `<rect x="-0.5" y="-0.5" width="${W + 1}" height="${H + 1}" fill="${bg}"/>` : ""}<g fill="${col}">${s}</g></svg>`;
}
/* B: { W, H, g, col, axes, edit(x,y), given(x,y), folds:[{d,p}], rows, cols } */
function boardSvg(B){
  const W = B.W, H = B.H, w = W * C, h = H * C; let s = `<svg viewBox="${-P} ${-P} ${w + 2 * P} ${h + 2 * P}" role="img">`;
  s += `<rect x="-3" y="1" width="${w + 6}" height="${h + 5}" rx="4" fill="rgba(18,26,51,.16)"/><rect x="0" y="0" width="${w}" height="${h}" fill="#fffdf6"/>`;
  if(B.edit && !B.noTint){ let e = ""; for(let y = 0; y < H; y++) for(let x = 0; x < W; x++) if(B.edit(x, y)) e += `M${x * C} ${y * C}h${C}v${C}h${-C}z`; s += `<path d="${e}" fill="#fff1b0"/>`; }
  let f = "", u = "";
  for(let y = 0; y < H; y++) for(let x = 0; x < W; x++) if(B.g[y][x]){ const d = `M${x * C} ${y * C}h${C}v${C}h${-C}z`; if(B.edit && B.edit(x, y)) u += d; else f += d; }
  s += `<path d="${f}" fill="${B.col}" stroke="${B.col}" stroke-width="1"/><path class="u" d="${u}" fill="${B.col}" stroke="${B.col}" stroke-width="1" opacity="${B.solid ? 1 : .82}"/>`;
  let gl = ""; for(let x = 1; x < W; x++) gl += `M${x * C} 0V${h}`; for(let y = 1; y < H; y++) gl += `M0 ${y * C}H${w}`;
  s += `<path d="${gl}" stroke="#b9ad8a" stroke-width="1" opacity=".55" fill="none"/><rect x="0" y="0" width="${w}" height="${h}" fill="none" stroke="${K}" stroke-width="2.5"/>`;
  (B.folds || []).forEach(a => { s += a.d === "v" ? `<path d="M${a.p * C} ${-P + 3}V${h + P - 3}" stroke="#e8790c" stroke-width="5" stroke-dasharray="3 7" stroke-linecap="round"/>` : `<path d="M${-P + 3} ${a.p * C}H${w + P - 3}" stroke="#e8790c" stroke-width="5" stroke-dasharray="3 7" stroke-linecap="round"/>`; });
  (B.axes || []).forEach(a => { s += a.d === "v" ? `<path d="M${a.p * C} ${-P + 2}V${h + P - 2}" stroke="#1b3a8a" stroke-width="3.5" stroke-dasharray="9 6" stroke-linecap="round"/>` : `<path d="M${-P + 2} ${a.p * C}H${w + P - 2}" stroke="#1b3a8a" stroke-width="3.5" stroke-dasharray="9 6" stroke-linecap="round"/>`; });
  (B.rows || []).forEach(y => { s += `<path d="M${-P + 2} ${y * C + 6}l11 ${C / 2 - 6}l-11 ${C / 2 - 6}z" fill="#ff7a1a" stroke="${K}" stroke-width="1.5" stroke-linejoin="round"/>`; });
  (B.cols || []).forEach(x => { s += `<path d="M${x * C + 6} ${-P + 2}l${C / 2 - 6} 11l${C / 2 - 6} -11z" fill="#ff7a1a" stroke="${K}" stroke-width="1.5" stroke-linejoin="round"/>`; });
  return s + `<g id="fx"></g></svg>`;
}
function draw(B){ B.el.innerHTML = boardSvg(B); B.el.style.maxWidth = Math.round((B.W * C + 2 * P) * (B.k || 1.2)) + "px"; }
function markCells(B, cells){
  B.el.querySelector("#fx").insertAdjacentHTML("beforeend", cells.map(([x, y]) => `<g><rect x="${x * C + 3}" y="${y * C + 3}" width="${C - 6}" height="${C - 6}" rx="4" fill="rgba(255,255,255,.75)" stroke="#e5243b" stroke-width="3"/><path d="M${x * C + 10} ${y * C + 10}l${C - 20} ${C - 20}m0 ${20 - C}l${20 - C} ${C - 20}" stroke="#e5243b" stroke-width="3" stroke-linecap="round"/></g>`).join(""));
}
const quick = () => window.__mkFast || (window.matchMedia && matchMedia("(prefers-reduced-motion:reduce)").matches);
/* Lapo lankstymas: side „a“ – kairė / viršus persilenkia į kitą pusę, „b“ – atvirkščiai. */
function fold(B, ax, side){
  const fx = B.el.querySelector("#fx"); let s = "";
  B.g.forEach((r, y) => r.forEach((v, x) => { const q = ax.d === "v" ? x : y; if(v && (side === "a" ? q < ax.p : q >= ax.p)) s += `M${x * C} ${y * C}h${C}v${C}h${-C}z`; }));
  fx.insertAdjacentHTML("beforeend", `<g><path d="${s}" fill="rgba(47,107,255,.5)" stroke="#2f6bff" stroke-width="2" stroke-linejoin="round"/></g>`);
  const gh = fx.lastElementChild, o = ax.p * C, D = quick() ? 1 : 950;
  MK.sfx.whoosh();
  return new Promise(res => { const t0 = performance.now(); (function step(){
    const k = Math.min(1, (performance.now() - t0) / D), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2, sc = 1 - 2 * e;
    gh.setAttribute("transform", ax.d === "v" ? `translate(${o} 0) scale(${sc} 1) translate(${-o} 0)` : `translate(0 ${o}) scale(1 ${sc}) translate(0 ${-o})`);
    if(k < 1) requestAnimationFrame(step); else res();
  })(); });
}
function paintable(B, onChange){
  let mode = null;
  const cell = e => { const sv = B.el.querySelector("svg"), r = sv.getBoundingClientRect(), vw = B.W * C + 2 * P, vh = B.H * C + 2 * P;
    return [Math.floor((-P + (e.clientX - r.left) / r.width * vw) / C), Math.floor((-P + (e.clientY - r.top) / r.height * vh) / C)]; };
  const put = e => { const [x, y] = cell(e); if(!inb(B.g, x, y) || !B.edit(x, y) || B.g[y][x] === mode) return; onChange(x, y, mode); };

function genFold(folds, sz){

      const seen = new Set([gkey(ok)]), wrong = []; SH(cand).forEach(c => { const k = gkey(c); if(!seen.has(k) && wrong.length < 3){ seen.add(k); wrong.push(c); } });
      if(wrong.length < 3){ if(d) used.delete(d.id); continue; }

    }

    const ok = joinH(A, mA), cand = [joinH(A, A), joinH(A, mirY(mA)), joinH(A, mirY(A)), joinH(A, toggleNear(mA, 0, hw - 1, 0, A.length - 1) || mA)];
    const seen = new Set([gkey(ok)]), wrong = []; SH(cand).forEach(c => { const k = gkey(c); if(!seen.has(k) && wrong.length < 3){ seen.add(k); wrong.push(c); } });
    if(wrong.length < 3){ if(d) used.delete(d.id); continue; }

      edges: [{ d: tp ? "h" : "v", p: mir ? 0 : hw }], opts, ans: opts.indexOf(all[0]), des: d, col: d ? d.col : PK(COLS), q: T.q.fold1 };

let recentSh = [];
function genAxes(n){

function genPair(kind, dir, dist){

const LV = [
  () => { const k = SH(["yes", "yes", "yes", "yes2", "cell", "trans", "off", "dir"]); k[R(0, 7)] = PK(["yes", "cell", "trans", "off"]); return k.map((x, i) => genJudge(x, i < 3 ? "S" : i < 6 ? "M" : "L")); },
  () => ["S", "S", "M", "M", "M", "L"].map(s => genComp("v", s)),
  () => [genComp("h", "S"), genComp("h", "M"), genComp("h", "M"), genComp("d", "S"), genComp("d", "M"), genComp("d", "L")],
  () => [genFold(1, "S"), genFold(1, "S"), genFold(1, "M"), genFold(2, "S"), genFold(1, "M"), genFold(2, "M"), genFold(1, "L"), genFold(2, "L")],

/* ================= žaidimas ================= */
let L = 0, tasks = [], ti = 0, cur = null, okN = 0, pts = 0, dots = null, fresh = [];
function start(i){
  L = i; used = new Set(); tasks = LV[i]().filter(Boolean); ti = 0; okN = 0; pts = 0; fresh = []; $("pts").textContent = 0;
  menu.hidden = true; free.hidden = true; play.hidden = false; dots = MK.dots($("dots"), tasks.length); show();
}
const say = (h, mood) => MK.say($("guide"), h, mood);
function done(okFirst, p, msg){
  dots.mark(ti, okFirst);
  if(okFirst){ okN++; if(cur.des){ const a = album(); if(!a.includes(cur.des.id)){ a.push(cur.des.id); MK.set(KEY, a); fresh.push(cur.des.id); } } }
  if(p){ pts += p; const c = $("ptsChip"); $("pts").textContent = pts; c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop"); }
  if(p) MK.sfx.good(); else MK.sfx.bad();

  const go = document.createElement("button"); go.type = "button"; go.className = "mk-btn go fade"; go.id = "next"; go.textContent = ti < tasks.length - 1 ? T.next : T.finish;
  go.onclick = () => { MK.sfx.tap(); ti++; ti < tasks.length ? show() : finish(); };
  $("flow").appendChild(go); setTimeout(() => { try{ go.scrollIntoView({ block: "nearest", behavior: "smooth" }); }catch(e){} }, 60);

/* ---- Taip / Ne su lankstymu ---- */
function runJudge(t){
  $("flow").innerHTML = `<div class="card fade"><div class="board lock" id="bd"></div><div class="ans two" id="ans"><button type="button" class="a" data-v="1">${T.yes}</button><button type="button" class="a" data-v="0">${T.no}</button></div></div>`;
  const B = { W: t.W, H: t.H, g: t.g, col: t.col, axes: [t.ax], el: $("bd"), k: t.W > 10 ? 1.05 : 1.2 }; draw(B);

/* ---- karpinio užbaigimas ---- */
function runComp(t){

  const B = { W: t.W, H: t.H, g: copy(t.g0), col: t.col, axes: t.axes, edit: (x, y) => !t.giv(x, y), el: $("bd"), k: t.W > 10 ? 1.05 : 1.2 }; let tries = 0;

    const m = MK.get(KEYM, []); m.push({ g: B.g.map(r => r.map(v => v ? "#" : ".").join("")).join("/"), c: ci }); MK.set(KEYM, m.slice(-12));
    nt.className = "note"; nt.textContent = F.saved; MK.sfx.good(); MK.confetti(24);
  };
  $("fback").onclick = () => { MK.sfx.tap(); showMenu(); };
  window.scrollTo(0, 0); window.__f = { B };
}
