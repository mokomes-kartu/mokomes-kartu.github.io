<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stoties laikrodis – MokomėsKartu.lt</title>
<meta name="description" content="3 klasės matematikos žaidimas: skaityk laikrodį, skaičiuok trukmę pagal tvarkaraštį ir kalendorių, smulkink sekundes, minutes ir valandas.">
<meta name="theme-color" content="#fff9e6">
<link rel="icon" href="/logo/mk-ikona.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800&family=Manrope:wght@600;700;800&display=swap">
<script src="/bendra/mk.js"></script>
<script src="/stoties-laikrodis/tekstai.lt.js"></script>
<style>
/* Meniu: stoties vaizdas su tikru dabartiniu laiku, „Mano traukinys“ (vagonai už bilietus), lygiai, „Kaip žaisti?“.
   Žaidimas: užduoties kortelė, scena (laikrodis / lenta / kalendorius), atsakymai, pelėdžiuko paaiškinimas. */
body{--ac:#1b84d8;--ac-ink:#fff;--ac-soft:#d9eefc}
.mk-hero{padding-top:0}
.mk-hero h1{margin-top:8px}
.mk-hero p{font-size:17px}
.hero-art{width:min(100%,480px);border-radius:26px;overflow:hidden;box-shadow:inset 0 0 0 3px var(--ink),0 6px 0 rgba(18,26,51,.15);position:relative}
.hero-art svg{display:block;width:100%;height:auto}
.hero-art::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 3px var(--ink);pointer-events:none}
.train{width:100%;max-width:520px;margin:0 auto 14px;padding:12px 14px 14px;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 2.5px var(--ink),0 5px 0 rgba(18,26,51,.14)}
.train h2{margin:0;font:800 18px/1.2 var(--kid);display:flex;align-items:center;gap:8px}
.train h2 svg{width:28px;height:28px;flex:none}
.train p{margin:4px 0 10px;color:var(--soft);font-weight:700;font-size:14.5px}
.wgs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.wg{position:relative;display:grid;justify-items:center;gap:2px;padding:6px 2px 5px;border-radius:14px;background:#f3f9ff;box-shadow:inset 0 0 0 2px #cfe3f4}
.wg svg{width:100%;max-width:62px;height:auto;display:block}
.wg small{font:800 10.5px/1.15 var(--body);color:var(--soft);text-align:center;min-height:2.3em;display:flex;align-items:center}
.wg.lock svg{filter:grayscale(1);opacity:.3}
.wg .lk{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:24px;height:24px}
.wg.new{animation:mkPop .5s cubic-bezier(.2,1.6,.4,1);box-shadow:inset 0 0 0 3px var(--ac)}
.how{max-width:520px;margin:16px auto 0;padding:10px 14px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 2px var(--ink)}
.how summary{cursor:pointer;font:800 16px/1.2 var(--kid);list-style:none;min-height:36px;display:flex;align-items:center;gap:6px}
.how summary::-webkit-details-marker{display:none}
.how summary::before{content:"▸";color:var(--ac);transition:transform .15s}
.how[open] summary::before{transform:rotate(90deg)}
.how ol{margin:4px 0 4px;padding-left:22px;font-weight:600}
.how li{margin:4px 0}
.note{max-width:520px;margin:10px auto 0;color:var(--soft);font-size:13px;font-weight:600;text-align:center}
@media (hover:none){.note{display:none}}

/* ---------- žaidimas ---------- */
.hud{display:flex;align-items:center;gap:8px;margin:0 0 8px;min-height:36px}
.hud .mk-dots{margin-right:auto;justify-content:flex-start}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 8px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink);font:800 17px/1 var(--kid);white-space:nowrap}
.chip svg{width:24px;height:24px}
.chip.pop{animation:mkPop .35s cubic-bezier(.2,1.6,.4,1)}
.qcard{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:center;width:100%;max-width:560px;margin:0 auto 8px;padding:10px 12px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.12)}
.qic{width:48px;height:48px;border-radius:14px;background:var(--ac-soft);display:grid;place-items:center}
.qic svg{width:36px;height:36px;display:block}
.qt{font:800 clamp(16px,4.5vw,19px)/1.3 var(--kid)}
.qt b{color:var(--ac);white-space:nowrap}
.stage{width:100%;max-width:560px;margin:0 auto;display:grid;justify-items:center;gap:8px;padding:6px 0}
.stage:empty{display:none}
.clock{display:block;width:min(64vw,250px);height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.clock.mini{width:min(38vw,150px)}
.clock.drag{cursor:grab}
.pair{display:flex;gap:12px;justify-content:center;width:100%}
.pair figure{margin:0;display:grid;justify-items:center;gap:2px}
.pair figcaption{font:800 14px/1 var(--kid);color:var(--soft)}
.legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font:700 12.5px/1.2 var(--body);color:var(--soft)}
.legend i{display:inline-block;width:18px;height:6px;border-radius:3px;vertical-align:middle;margin-right:5px}
.ctl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:min(100%,360px)}
.ctl button{min-height:44px;border:0;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink),0 3px 0 rgba(18,26,51,.16);font:800 15px/1 var(--kid);cursor:pointer;touch-action:manipulation}
.ctl button:active{transform:translateY(2px)}
.hint0{margin:0;text-align:center;color:var(--soft);font-weight:700;font-size:13.5px}
/* lenta */
.bd{width:100%;border-collapse:separate;border-spacing:0;border-radius:16px;overflow:hidden;background:#17254d;color:#ffd23f;font:800 clamp(15px,4.3vw,19px)/1.2 var(--kid);box-shadow:inset 0 0 0 3px var(--ink),0 4px 0 rgba(18,26,51,.2);border:3px solid var(--ink)}
.bd caption{caption-side:top;background:#ffd23f;color:var(--ink);font:800 14px/1 var(--kid);padding:6px;letter-spacing:.08em;text-transform:uppercase}
.bd th{font:700 11.5px/1 var(--body);color:#9fb4e8;text-transform:uppercase;letter-spacing:.06em;padding:7px 6px 3px;text-align:left}
.bd td{padding:7px 6px;border-top:1.5px dashed rgba(255,210,63,.28);white-space:nowrap}
.bd td:nth-child(3),.bd td:nth-child(4),.bd th:nth-child(3),.bd th:nth-child(4){text-align:right}
.bd td:first-child{color:#fff}
/* kalendorius */
.cal{width:min(100%,360px);border-collapse:separate;border-spacing:3px;background:#fff;border-radius:16px;padding:4px 6px 8px;box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.14);table-layout:fixed}
.cal caption{font:800 18px/1.1 var(--kid);padding:8px 0 4px}
.cal th{font:800 12.5px/1 var(--body);color:var(--soft);padding:3px 0}
.cal th.we{color:#d6402e}
.cal td{height:34px;text-align:center;border-radius:10px;font:800 16px/1 var(--kid);background:#f4f8fc}
.cal td.we{background:#fdeeea}
.cal td.e{background:none}
.cal td.m1{background:var(--ac);color:#fff;box-shadow:0 0 0 2px var(--ink)}
.cal td.m2{background:#ff7a1a;color:#fff;box-shadow:0 0 0 2px var(--ink)}
/* atsakymai */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;max-width:560px;margin:8px auto 0}
.opts.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{min-height:60px;border:0;border-radius:18px;background:#fff;cursor:pointer;font:800 clamp(17px,5vw,22px)/1.15 var(--kid);color:var(--ink);padding:6px 8px;display:grid;place-items:center;
  box-shadow:inset 0 0 0 2.5px var(--ink),0 5px 0 rgba(18,26,51,.18);transition:transform .1s;touch-action:manipulation}
.opt:active{transform:translateY(3px)}
.opt.sm{font-size:clamp(14px,3.9vw,17px)}
.opt.clk{padding:4px}
.opt.clk svg{width:min(34vw,128px);height:auto;display:block}
.opt.off{opacity:.38;pointer-events:none;box-shadow:inset 0 0 0 2.5px #b9b2a0}
.opt.ok{background:#c9f5d6;box-shadow:inset 0 0 0 3.5px var(--good),0 5px 0 rgba(18,26,51,.18)}
.opt.no{animation:mkShake .45s}
.go{display:flex;justify-content:center;margin:10px 0 0}
.go .mk-btn{min-width:60%}
.note2{margin:8px auto 0;max-width:560px;padding:8px 12px;border-radius:14px;background:#fff4d6;box-shadow:inset 0 0 0 2px #e8c35a;font:700 15px/1.4 var(--body)}
.fb{width:100%;max-width:560px;margin:4px auto 0}
.fb .mk-why{margin:6px 0}
@media (prefers-reduced-motion:reduce){.wg.new{animation:none}}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <section id="menu">
    <div class="mk-hero">
      <div class="hero-art" id="heroArt"></div>
      <h1 id="heroH"></h1>
      <p id="heroP"></p>
    </div>
    <div class="train" id="train"></div>
    <div id="levels"></div>
    <div id="learn"></div>
    <details class="how" id="how"></details>
    <p class="note" id="note"></p>
  </section>
  <section id="play" hidden>
    <div class="hud"><div id="dots"></div><span class="chip" id="tkChip"></span></div>
    <div class="qcard"><span class="qic" id="qic"></span><div class="qt" id="qt"></div></div>
    <div class="stage" id="stage"></div>
    <div class="opts" id="opts"></div>
    <div class="go" id="go"></div>
    <div class="fb" id="fb"></div>
  </section>
</div>
<script>
(function(){
"use strict";
const T = window.MK_T;
const GAME = "stoties-laikrodis", GRADES = [3], N = 8, N_EXAM = 10;
const TK = "mk-" + GAME + "-bilietai", SEEN = "mk-" + GAME + "-matyta";
const K = "#121a33";
const NEED = [0, 8, 20, 36, 56, 82, 114, 150];
const R = MK.rnd, pick = MK.pick, shuffle = MK.shuffle;
const pad = n => String(n).padStart(2, "0");
const fmtT = m => `${Math.floor(m / 60)}:${pad(m % 60)}`;
const fmtD = m => m < 60 ? `${m} min` : m % 60 === 0 ? `${m / 60} val.` : `${Math.floor(m / 60)} val. ${m % 60} min`;
const mod = (a, n) => ((a % n) + n) % n;
const many = (n, one, few, lots) => { const d = n % 10, h = n % 100; return d === 1 && h !== 11 ? one : d >= 2 && (h < 10 || h >= 20) ? few : lots; };

/* ================= piešiniai ================= */
const S = `stroke="${K}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"`;
function clockSvg(h, m, o){
  o = o || {};
  const hr = (mod(h, 12) + m / 60) * 30, mn = m * 6;
  let ticks = "", nums = "";
  for(let i = 0; i < 60; i++){
    const a = i * 6 * Math.PI / 180, big = i % 5 === 0, r1 = big ? 78 : 83, r2 = 88;
    if(o.mini && !big) continue;
    ticks += `<line x1="${100 + r1 * Math.sin(a)}" y1="${100 - r1 * Math.cos(a)}" x2="${100 + r2 * Math.sin(a)}" y2="${100 - r2 * Math.cos(a)}" stroke="${K}" stroke-width="${big ? 3.2 : 1.4}" stroke-linecap="round"/>`;
  }
  for(let i = 1; i <= 12; i++){
    if(o.mini && i % 3) continue;
    const a = i * 30 * Math.PI / 180, r = 62;
    nums += `<text x="${100 + r * Math.sin(a)}" y="${100 - r * Math.cos(a) + 8}" text-anchor="middle" font-family="Grandstander,Comic Sans MS,sans-serif" font-weight="800" font-size="${o.mini ? 26 : 23}" fill="${K}">${i}</text>`;
  }
  const ghost = o.ghost ? `<g opacity=".4" stroke-dasharray="5 5"><line x1="100" y1="100" x2="100" y2="30" stroke="#ff5a36" stroke-width="5" stroke-linecap="round" transform="rotate(${o.ghost.m * 6} 100 100)"/><line x1="100" y1="100" x2="100" y2="54" stroke="#1d2c5e" stroke-width="8" stroke-linecap="round" transform="rotate(${(mod(o.ghost.h, 12) + o.ghost.m / 60) * 30} 100 100)"/></g>` : "";
  return `<svg viewBox="0 0 200 200" class="clock ${o.cls || ""}" ${o.id ? `id="${o.id}"` : ""} role="img" aria-label="${o.aria || "Laikrodis"}">
  <circle cx="100" cy="100" r="96" fill="#fff" stroke="${K}" stroke-width="5"/><circle cx="100" cy="100" r="90" fill="#f2f9ff"/>
  ${ticks}${nums}${ghost}
  <g class="hH" transform="rotate(${hr} 100 100)"><line x1="100" y1="112" x2="100" y2="52" stroke="${K}" stroke-width="10.5" stroke-linecap="round"/><line x1="100" y1="112" x2="100" y2="52" stroke="#1d2c5e" stroke-width="7.5" stroke-linecap="round"/></g>
  <g class="mH" transform="rotate(${mn} 100 100)"><line x1="100" y1="116" x2="100" y2="26" stroke="${K}" stroke-width="7.5" stroke-linecap="round"/><line x1="100" y1="116" x2="100" y2="26" stroke="#ff5a36" stroke-width="4.6" stroke-linecap="round"/>${o.drag ? `<circle cx="100" cy="26" r="9" fill="#ffc61a" stroke="${K}" stroke-width="2.4"/>` : ""}</g>
  <circle cx="100" cy="100" r="7.5" fill="#ffc61a" stroke="${K}" stroke-width="2.4"/></svg>`;
}
const ICONS = {
  train: `<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="6" width="22" height="16" rx="5" fill="#2f8bff" ${S}/><rect x="9" y="10" width="6" height="6" rx="1.5" fill="#fff" stroke="${K}" stroke-width="1.8"/><rect x="17" y="10" width="6" height="6" rx="1.5" fill="#fff" stroke="${K}" stroke-width="1.8"/><circle cx="11" cy="25" r="3" fill="#ffc61a" ${S}/><circle cx="21" cy="25" r="3" fill="#ffc61a" ${S}/></svg>`,
  bus: `<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="7" width="26" height="16" rx="4" fill="#ffc61a" ${S}/><rect x="6" y="10" width="5" height="5" rx="1" fill="#fff" stroke="${K}" stroke-width="1.8"/><rect x="13" y="10" width="5" height="5" rx="1" fill="#fff" stroke="${K}" stroke-width="1.8"/><rect x="20" y="10" width="6" height="5" rx="1" fill="#fff" stroke="${K}" stroke-width="1.8"/><circle cx="9" cy="24" r="3" fill="#555" ${S}/><circle cx="23" cy="24" r="3" fill="#555" ${S}/></svg>`,
  boat: `<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4v16M16 5l9 13H16" fill="#fff" ${S}/><path d="M4 21h24l-4 6H8z" fill="#ef3b4f" ${S}/><path d="M2 29q3-2 6 0t6 0 6 0 6 0" fill="none" stroke="#2f8bff" stroke-width="2.2" stroke-linecap="round"/></svg>`,
  film: `<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="12" width="24" height="15" rx="2.5" fill="#fff" ${S}/><path d="M4 12l3-7 5 2-3 5M13 8l5 2-3 5M21 10l5 2" fill="#121a33" stroke="${K}" stroke-width="2" stroke-linejoin="round"/><path d="M13 17l7 4-7 4z" fill="#ef3b4f"/></svg>`,
  note: `<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M12 24V7l14-3v17" fill="none" ${S}/><circle cx="9" cy="24" r="4" fill="#8b5cf6" ${S}/><circle cx="23" cy="21" r="4" fill="#8b5cf6" ${S}/></svg>`,
  pot: `<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 14h22l-2 12H7z" fill="#f4a63c" ${S}/><path d="M5 14q0-6 11-6t11 6z" fill="#ffd89a" ${S}/><path d="M12 5q2-2 0-4M18 5q2-2 0-4" fill="none" stroke="#9aa" stroke-width="2" stroke-linecap="round"/></svg>`,
  ball: `<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="#fff" ${S}/><path d="M16 10l5 3.5-2 5.5h-6l-2-5.5z" fill="${K}"/><path d="M16 10V4M21 13.5l6-2M19 19l4 5M13 19l-4 5M11 13.5l-6-2" stroke="${K}" stroke-width="2" stroke-linecap="round"/></svg>`,
  book: `<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 7q7-3 13 1v19q-6-4-13-1z" fill="#fff" ${S}/><path d="M29 7q-7-3-13 1v19q6-4 13-1z" fill="#ffd0d6" ${S}/><path d="M7 12q3-1 6 1M7 17q3-1 6 1M19 13q3-2 6-1M19 18q3-2 6-1" stroke="${K}" stroke-width="1.6" stroke-linecap="round" opacity=".5"/></svg>`,
  brush: `<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M22 4l6 6-12 12-6-6z" fill="#e0a66b" ${S}/><path d="M10 16l6 6q-1 6-8 6q2-4-1-6q2-3 3-6z" fill="#ef3b4f" ${S}/></svg>`,
  cal: `<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="6" width="24" height="22" rx="4" fill="#fff" ${S}/><path d="M4 12h24" stroke="${K}" stroke-width="2.4"/><rect x="4" y="6" width="24" height="6" rx="3" fill="#ef3b4f" ${S}/><path d="M10 3v5M22 3v5" ${S}/><circle cx="11" cy="19" r="2" fill="${K}"/><circle cx="16" cy="19" r="2" fill="${K}"/><circle cx="21" cy="19" r="2" fill="${K}"/><circle cx="11" cy="24" r="2" fill="${K}"/><circle cx="16" cy="24" r="2" fill="#ef3b4f"/></svg>`,
  clock: `<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="#fff" ${S}/><path d="M16 9v7l5 3" fill="none" ${S}/></svg>`,
  sand: `<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 4h16M8 28h16M10 4q0 9 6 12-6 3-6 12M22 4q0 9-6 12 6 3 6 12" fill="none" ${S}/><path d="M12 24q4-4 8 0v3H12z" fill="#ffc61a"/></svg>`
};
const LOCK = `<svg class="lk" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="#fff" stroke="${K}" stroke-width="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="${K}" stroke-width="2"/><circle cx="12" cy="15.5" r="1.6" fill="${K}"/></svg>`;
const TICKET = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v3.2a2 2 0 0 0 0 3.6V17H3v-3.2a2 2 0 0 0 0-3.6z" fill="#ffc61a" stroke="${K}" stroke-width="2" stroke-linejoin="round"/><path d="M14 8v8" stroke="${K}" stroke-width="1.8" stroke-dasharray="2 2"/></svg>`;
const WHEEL = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r || 5.5}" fill="#3a3f55" ${S} stroke-width="2"/><circle cx="${x}" cy="${y}" r="1.8" fill="#ffc61a"/>`;
/* vagonai: viewBox 64×44; 0 – garvežys */
function wagonSvg(i){
  const body = (c, extra) => `<path d="M2 30h60" stroke="${K}" stroke-width="2.6" stroke-linecap="round"/><rect x="4" y="9" width="56" height="25" rx="4" fill="${c}" ${S}/>${extra}${WHEEL(16, 37)}${WHEEL(48, 37)}`;
  const parts = [
    `<path d="M2 32h60" stroke="${K}" stroke-width="2.6"/><rect x="6" y="14" width="34" height="19" rx="9" fill="#2f8bff" ${S}/><rect x="36" y="6" width="22" height="28" rx="3" fill="#ef3b4f" ${S}/><rect x="40" y="10" width="13" height="11" rx="2" fill="#fff" stroke="${K}" stroke-width="2"/><rect x="12" y="4" width="8" height="12" rx="2" fill="#555d78" ${S}/><path d="M10 4h12" stroke="${K}" stroke-width="3" stroke-linecap="round"/><path d="M2 34l5-5v5z" fill="#ffc61a" ${S}/><circle cx="8" cy="23" r="3" fill="#ffe27a" stroke="${K}" stroke-width="1.8"/>${WHEEL(16, 37, 6)}${WHEEL(30, 37, 5)}${WHEEL(48, 37, 6.5)}`,
    body("#ef3b4f", `<rect x="18" y="14" width="28" height="16" rx="2" fill="#fff" stroke="${K}" stroke-width="2.2"/><path d="M18 14l14 9 14-9" fill="none" stroke="${K}" stroke-width="2.2" stroke-linejoin="round"/>`),
    body("#3fae5a", `<circle cx="20" cy="22" r="6" fill="#ef3b4f" stroke="${K}" stroke-width="2"/><circle cx="33" cy="25" r="6" fill="#ffd23f" stroke="${K}" stroke-width="2"/><circle cx="45" cy="21" r="6" fill="#ef3b4f" stroke="${K}" stroke-width="2"/><path d="M20 16q1-3 3-3M45 15q1-3 3-3" stroke="#2c7a3b" stroke-width="2" fill="none" stroke-linecap="round"/>`),

  const o = build(a, [mod(wd + q7, 7), mod(wd + r + 1, 7), mod(wd + r - 1, 7), mod(a + 1, 7), mod(a - 1, 7)], [mod(a + 2, 7), mod(a - 2, 7), mod(a + 3, 7)], v => T.weekdays[mod(v, 7)], v => true);
  return { key: `cwp${wd}-${nn}`, ic: "cal", q: qhtml(T.calWdPlusQ(T.weekdays[wd], nn)), stage: "", mode: "choice", cls: "sm", opts: o.opts, ans: o.ans, hint: T.explain.wdMod, why: `${T.explain.wdMod} ${nn} = ${q7 * 7}${r ? " + " + r : ""}. Po ${q7 * 7} d. – vėl ${T.weekdays[wd]}, dar ${r} ${many(r, "diena", "dienos", "dienų")} → ${T.weekdays[a]}.`, raw: { wd, n: nn, ans: a } };
};

const POOLS = [
  ["read", "read", "read", "which", "which", "set", "set", "set24", "conv24"],
  ["dur2c", "dur2c", "durD", "durD", "durD", "left", "left", "cmp"],
  ["endD", "endD", "endSet", "startD", "startD", "two", "ready", "ready"],
  ["bFirst", "bFirst", "bWait", "bExt", "bExt", "bDur", "bBoth", "bBoth", "bHome", "bAfter"],
  ["unitFit", "unitFit", "toSec", "toMinSec", "toMin", "toHourMin", "whole", "whole", "cmpU"],
  ["calWd", "calWd", "calBetween", "calWeeks", "calCount", "calLeft", "calCross", "calWdPlus"]
];
POOLS.push(POOLS.flat().filter((v, i, a) => a.indexOf(v) === i));

function planFor(L, n){
  const pool = POOLS[L], base = [];
  const uniq = pool.filter((v, i, a) => a.indexOf(v) === i);
  while(base.length < n) base.push(...shuffle(uniq).slice(0, Math.min(uniq.length, n - base.length)));
  for(let i = 1; i < base.length; i++) if(base[i] === base[i - 1]){ const j = base.findIndex((v, k) => k > i && v !== base[i] && v !== base[i - 1]); if(j > 0) [base[i], base[j]] = [base[j], base[i]]; }
  return base;
}
function makeRound(L){
  const n = L === 6 ? N_EXAM : N, seen = new Set(MK.get(SEEN, [])), used = new Set(), plan = planFor(L, n), out = [];
  plan.forEach((g, i) => {
    const d = L === 6 ? Math.min(1, .35 + i / (n - 1) * .65) : i / (n - 1);
    let t, tries = 0;
    do { t = G[g](d); t.g = g; tries++; } while((seen.has(t.key) || used.has(t.key)) && tries < 30);
    used.add(t.key); out.push(t);
  });
  const hist = Array.from(used).concat(MK.get(SEEN, [])).slice(-220); MK.set(SEEN, hist);
  return out;
}

/* ================= vartotojo sąsaja ================= */
const $ = id => document.getElementById(id);
const app = $("app"), menu = $("menu"), play = $("play"), stageEl = $("stage"), optsEl = $("opts"), goEl = $("go"), fbEl = $("fb");
const saved = MK.get("mokomeskartu-klase", 0);
app.prepend(MK.top({ title: T.title, grade: GRADES.includes(saved) ? saved : GRADES[0] }));
$("heroH").innerHTML = `${T.heroA} <em>${T.heroB}</em>`; $("heroP").textContent = T.hero; $("note").textContent = T.keys;
$("how").innerHTML = `<summary>${T.howH}</summary><ol>${T.how.map(x => `<li>${x}</li>`).join("")}</ol>`;
let tickets = Math.max(0, +MK.get(TK, 0) || 0);
const wagonsNow = () => NEED.filter(n => tickets >= n).length - 1;

const LART = ["🕒", "", "", "", "", "", ""];
const LEVEL_ART = [
  `<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16" fill="#fff" ${S}/><path d="M20 9v11l7 4" fill="none" ${S} stroke="#ff5a36" stroke-width="3"/><circle cx="20" cy="20" r="2.6" fill="#ffc61a" stroke="${K}" stroke-width="1.6"/></svg>`,
  `<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 25h30" ${S}/><path d="M8 25V14M32 25V14" ${S}/><path d="M8 17h24" stroke="#ff5a36" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 6"/><circle cx="8" cy="12" r="4" fill="#fff" ${S}/><circle cx="32" cy="12" r="4" fill="#ffc61a" ${S}/><rect x="11" y="28" width="18" height="6" rx="3" fill="#2f8bff" ${S}/></svg>`,
  `<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="16" cy="22" r="12" fill="#fff" ${S}/><path d="M16 14v8l5 3" fill="none" ${S}/><path d="M29 9l7 5-7 5" fill="none" stroke="#2fb36b" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  `<svg viewBox="0 0 40 40" aria-hidden="true"><rect x="4" y="7" width="32" height="26" rx="4" fill="#17254d" ${S}/><path d="M9 14h8M9 20h8M9 26h8M22 14h9M22 20h9M22 26h9" stroke="#ffd23f" stroke-width="3" stroke-linecap="round"/></svg>`,
  `<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M11 5h18M11 35h18M13 5q0 12 7 15-7 3-7 15M27 5q0 12-7 15 7 3 7 15" fill="none" ${S}/><path d="M15 31q5-5 10 0v4H15z" fill="#ffc61a"/></svg>`,
  `<svg viewBox="0 0 40 40" aria-hidden="true"><rect x="5" y="8" width="30" height="27" rx="4" fill="#fff" ${S}/><rect x="5" y="8" width="30" height="8" rx="4" fill="#ef3b4f" ${S}/><path d="M12 4v7M28 4v7" ${S}/><path d="M11 22h4M18 22h4M25 22h4M11 29h4M18 29h4" stroke="${K}" stroke-width="3" stroke-linecap="round"/></svg>`,
  `<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4l4.5 10 11 1-8.3 7.2 2.6 10.8L20 27.4 10.2 33l2.6-10.8L4.5 15l11-1z" fill="#ffc61a" ${S}/></svg>`
];
const LEVELS = T.levels.map((l, i) => ({ id: "l" + (i + 1), name: l[0], sub: l[1], art: LEVEL_ART[i] }));

function renderTrain(fresh){
  $("train").innerHTML = `<h2>${wagonSvg(0)}${T.trainH}</h2><p>${T.trainP(tickets)}</p><div class="wgs">${T.wagons.map((nm, i) => {
    const lock = tickets < NEED[i];
    return `<div class="wg${lock ? " lock" : ""}${fresh === i ? " new" : ""}">${wagonSvg(i)}${lock ? LOCK : ""}<small>${lock ? `${NEED[i]} ${TICKET.replace("<svg", '<svg style="width:12px;height:12px;display:inline;vertical-align:-2px"')}` : nm}</small></div>`;
  }).join("")}</div>`;
}
function showMenu(fresh){
  play.hidden = true; menu.hidden = false;
  $("heroArt").innerHTML = heroSvg(wagonsNow()); renderTrain(fresh);
  MK.levels($("levels"), { game: GAME, levels: LEVELS, onPick: start });
  MK.learn($("learn"), { topics: T.topics, onPlay: start });
  window.scrollTo(0, 0);
}

/* ---------- žaidimo būsena ---------- */
let L = 0, round = [], ti = 0, cur = null, okN = 0, got = 0, dots = null, tries = 0, clk = null, answered = false;
$("tkChip").innerHTML = "";
function chip(){ $("tkChip").innerHTML = `${TICKET}<span id="tkN">${got}</span>`; }

function start(l){
  L = l; round = makeRound(L); ti = 0; okN = 0; got = 0;
  menu.hidden = true; play.hidden = false; window.scrollTo(0, 0);
  dots = MK.dots($("dots"), round.length); chip();
  loadTask();
}
function loadTask(){
  cur = round[ti]; tries = 0; answered = false; clk = null;
  dots.cur(ti); fbEl.innerHTML = ""; goEl.innerHTML = ""; optsEl.innerHTML = "";
  $("qic").innerHTML = ICONS[cur.ic] || ICONS.clock; $("qt").innerHTML = cur.q;
  if(cur.mode === "set"){
    stageEl.innerHTML = clockSvg(0, 0, { cls: "drag", drag: true, id: "setClk", aria: T.dragAria }) + `<div class="legend"><span><i style="background:#1d2c5e"></i>${T.shortHand}</span><span><i style="background:#ff5a36"></i>${T.longHand}</span></div>` +
      `<div class="ctl"><button type="button" data-d="-60">${T.hourMinus}</button><button type="button" data-d="60">${T.hourPlus}</button><button type="button" data-d="-1">${T.minMinus}</button><button type="button" data-d="1">${T.minPlus}</button></div><p class="hint0">${T.setHint0}</p>`;
    clk = { total: cur.start, el: $("setClk") }; drawClk(); bindClk();
    goEl.innerHTML = `<button type="button" class="mk-btn" id="chk">${T.check}</button>`;
  } else {
    stageEl.innerHTML = cur.stage || "";
    optsEl.className = "opts" + (cur.c3 || cur.opts.length === 3 ? " c3" : "");
    optsEl.innerHTML = cur.opts.map((o, i) => `<button type="button" class="opt${cur.cls === "clk" ? " clk" : ""}${cur.cls === "sm" || (cur.opts.some(x => String(x).length > 14) && cur.cls !== "clk") ? " sm" : ""}" data-i="${i}">${o}</button>`).join("");
    if(cur.c3 || cur.opts.length === 3) optsEl.classList.add("c3");
    if(cur.cls === "sm" || cur.cls === "clk" || cur.opts.some(x => String(x).length > 14)) optsEl.classList.remove("c3"), (cur.opts.length === 3 && cur.c3) && optsEl.classList.add("c3");
  }
}
/* laikrodžio valdymas */
function drawClk(){
  const t = mod(clk.total, 720), h = t / 60, m = t % 60;
  clk.el.querySelector(".hH").setAttribute("transform", `rotate(${(Math.floor(h) % 12 + (m / 60)) * 30} 100 100)`);
  clk.el.querySelector(".mH").setAttribute("transform", `rotate(${m * 6} 100 100)`);
}
function bindClk(){
  const el = clk.el; let prev = null, active = false;
  const mm = e => { const r = el.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2); let a = Math.atan2(dx, -dy) * 180 / Math.PI; if(a < 0) a += 360; return Math.round(a / 6) % 60; };
  const move = e => {
    if(!active || answered) return; const m = mm(e), t = mod(clk.total, 720);
    if(prev == null) prev = t % 60;
    let hh = Math.floor(t / 60);
    if(prev > 45 && m < 15) hh++; else if(prev < 15 && m > 45) hh--;
    prev = m; clk.total = mod(hh * 60 + m, 720); drawClk();
  };
  el.addEventListener("pointerdown", e => { if(answered) return; active = true; prev = mod(clk.total, 720) % 60; try{ el.setPointerCapture(e.pointerId); }catch(_){} MK.unlock(); move(e); e.preventDefault(); });
  el.addEventListener("pointermove", move);
  const end = () => { if(active){ active = false; MK.sfx.tap(); } };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
}
stageEl.addEventListener("click", e => {
  const b = e.target.closest(".ctl button"); if(!b || !clk || answered) return;
  MK.unlock(); MK.sfx.tap(); clk.total = mod(clk.total + +b.dataset.d, 720); drawClk();
});
optsEl.addEventListener("click", e => { const b = e.target.closest(".opt"); if(b && !answered) pickOpt(+b.dataset.i, b); });
goEl.addEventListener("click", e => {
  if(e.target.closest("#chk")) checkSet();
  else if(e.target.closest("#nextBtn")) next();
});
document.addEventListener("keydown", e => {
  if(play.hidden || document.querySelector(".mk-ov")) return;
  if(clk && !answered){
    const k = { ArrowLeft: -1, ArrowDown: -1, ArrowRight: 1, ArrowUp: 1 }[e.key];
    if(k){ e.preventDefault(); clk.total = mod(clk.total + k * (e.shiftKey ? 60 : 1), 720); drawClk(); }
  }
});

function fb(ok, body){
  fbEl.innerHTML = MK.why({ ok, head: ok ? MK.praise() : T.bad, body });
}
function finishTask(ok, firstTry){
  answered = true;
  dots.mark(ti, ok && firstTry);
  const pts = ok ? (firstTry ? 2 : 1) : 0;
  if(ok && firstTry) okN++;
  got += pts; chip(); if(pts){ const c = $("tkChip"); c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop"); }
  goEl.innerHTML = `<button type="button" class="mk-btn" id="nextBtn">${ti >= round.length - 1 ? "Baigti" : T.nextBtn}</button>`;
  setTimeout(() => { const b = $("nextBtn"); if(b) b.scrollIntoView({ block: "nearest", behavior: "smooth" }); }, 80);
}
function pickOpt(i, btn){
  MK.unlock();
  tries++;
  if(i === cur.ans){
    btn.classList.add("ok"); MK.sfx.good(); optsEl.querySelectorAll(".opt").forEach(b => { if(b !== btn) b.classList.add("off"); });
    fb(true, cur.why); finishTask(true, tries === 1);
  } else {
    btn.classList.add("off", "no"); MK.sfx.bad();
    if(tries >= 2){
      optsEl.querySelectorAll(".opt").forEach(b => { if(+b.dataset.i === cur.ans) b.classList.add("ok"); else b.classList.add("off"); });
      fb(false, cur.why); finishTask(false, false);
    } else {
      fbEl.innerHTML = `<div class="note2">${T.tryAgain}<br>${cur.hint}</div>`;
    }
  }
}
function checkSet(){
  MK.unlock(); tries++;
  const t = mod(clk.total, 720), ok = t === mod(cur.target, 720);
  if(ok){ MK.sfx.good(); fb(true, cur.why); finishTask(true, tries === 1); return; }
  MK.sfx.bad(); clk.el.classList.remove("mk-shake"); void clk.el.getBoundingClientRect(); clk.el.classList.add("mk-shake");
  const th = Math.floor(mod(cur.target, 720) / 60), tm = mod(cur.target, 720) % 60, ch = Math.floor(t / 60), cm = t % 60;
  if(tries >= 2){
    const g = clockSvg(th, tm, { cls: "drag", ghost: { h: th, m: tm }, aria: "Teisingas laikas" });
    stageEl.innerHTML = clockSvg(Math.floor(mod(cur.target, 720) / 60), tm, { aria: "Teisingas laikrodis" });
    fb(false, cur.why); finishTask(false, false); return;
  }
  let hint;
  if(ch !== th && cm !== tm) hint = "Pasitikrink ir trumpąją (valandų), ir ilgąją (minučių) rodyklę.";
  else if(ch !== th) hint = "Minutės geros, bet trumpoji rodyklė rodo ne tą valandą. Naudok „± val.“ mygtukus.";
  else { const q = Math.floor(tm / 5), r = tm % 5; hint = `Valanda gera, bet ilgoji (minučių) rodyklė rodo ne tą vietą. Ji turi rodyti ${tm === 0 ? "ties 12" : r === 0 ? `ties skaičiumi ${q} (${tm} min)` : `už skaičiaus ${q || 12} dar ${r} ${many(r, "brūkšnelį", "brūkšnelius", "brūkšnelių")} (${tm} min)`}.`; }
  fbEl.innerHTML = `<div class="note2">${T.tryAgain}<br>${hint}</div>`;
}
function next(){
  ti++;
  if(ti >= round.length){ finish(); return; }
  loadTask(); window.scrollTo({ top: 0, behavior: "smooth" });
}
function finish(){
  const before = tickets; tickets += got; MK.set(TK, tickets);
  const fresh = NEED.findIndex((n, i) => n > before && n <= tickets);
  const stars = MK.starsFor(okN, round.length); MK.best(GAME, LEVELS[L].id, stars);
  MK.result({ stars, title: T.resTitle(okN, round.length), text: T.resText(okN, round.length, got) + (fresh >= 0 ? `<br><b>${T.unlocked(T.wagons[fresh])}</b>` : ""),
    next: L < LEVELS.length - 1 ? () => start(L + 1) : null, again: () => start(L), menu: () => showMenu(fresh >= 0 ? fresh : null) });
}

window.__GT = { G, POOLS, makeRound, planFor, fmtT, fmtD, YEAR, mlen, wdOf, N, N_EXAM };
Object.defineProperty(window, "__cur", { get: () => cur });
showMenu();
})();
</script>
