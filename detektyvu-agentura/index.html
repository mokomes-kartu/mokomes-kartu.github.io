<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Detektyvų agentūra – MokomėsKartu.lt</title>
<meta name="description" content="Anglų kalbos žaidimas 8 klasei: skaityk įkalčius, rink teisingą laiką ir sąlygos sakinį, gaudyk nusikaltėlius.">
<meta name="theme-color" content="#f5f1e6">
<link rel="icon" href="/logo/mk-ikona.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@600;700;800&display=swap">
<script src="/bendra/mk.js"></script>
<script src="tekstai.lt.js"></script>
<style>
/* Detektyvų agentūra: bylos lapai, laiko juostos įkalčiai, nusikaltėlių galerija. */
body{--paper:#f6f1e4;--grid:#e8e0c8;--soft:#4f5a63;--kid:"Unbounded","Arial Black",system-ui,sans-serif;--ac:#127a8c;--ac-ink:#fff;--ac-soft:#d6eef2;--red:#d6402e;--good:#2fa66b}
.mk-ico[data-k="music"]{display:none}
.mk-lvl{border-radius:12px;box-shadow:inset 0 0 0 2.5px var(--ink),5px 5px 0 var(--ink)}
.mk-lvl-art{border-radius:10px;background:var(--ac-soft)}
.mk-lvl-art svg{width:50px;height:50px}
.mk-lvl-t b{font-size:16px;letter-spacing:-.02em}
.mk-lvl-t small{font-size:13.5px}
.mk-hero h1{letter-spacing:-.04em;font-size:clamp(30px,8vw,50px)}
.mk-hero p{max-width:42ch}
.mk-btn{border-radius:12px;font-size:17px}
.mk-res{border-radius:16px;box-shadow:inset 0 0 0 3px var(--ink),8px 8px 0 var(--ink)}
.mk-res .mk-owl{display:none}
.mk-res h2{font-size:23px;letter-spacing:-.03em}
.mk-sec{font-size:16px}
.mk-hero-art{width:min(460px,100%)}
.hero-card{background:#fff;border-radius:18px;padding:6px;box-shadow:inset 0 0 0 3px var(--ink),6px 6px 0 var(--ink)}
.hero-card svg{display:block;width:100%;height:auto;border-radius:12px}
.note{max-width:520px;margin:14px auto 0;color:var(--soft);font-size:13px;text-align:center}

/* galerija */
.gal{max-width:520px;margin:0 auto}
.rogues{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px;padding:12px 8px 8px;background:#fff;border-radius:12px;box-shadow:inset 0 0 0 2.5px var(--ink)}
.rg{display:grid;justify-items:center;gap:3px;text-align:center}
.rg svg{width:100%;max-width:64px;height:auto;display:block}
.rg span{font:800 10.5px/1.15 var(--body);color:var(--ink);overflow-wrap:anywhere}
.rg.lock span{color:var(--soft);font-weight:700}
.rg.fresh svg{animation:mkPop .6s cubic-bezier(.2,1.6,.4,1)}
.sbar{height:10px;border-radius:6px;background:#e3ecee;box-shadow:inset 0 0 0 2px var(--ink);margin:10px 0 4px;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--ac)}
.stext{margin:0;font:700 14px/1.4 var(--body);color:var(--soft)}

/* žaidimo kortelė */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:baseline;gap:6px;padding:7px 12px;border-radius:10px;background:#fff;font:800 17px/1 var(--kid);box-shadow:inset 0 0 0 2.5px var(--ink),3px 3px 0 var(--ink)}
.chip small{font:800 11px/1 var(--body);color:var(--soft);letter-spacing:.06em;text-transform:uppercase}
.card{background:#fff;border-radius:14px;padding:14px 12px 16px;box-shadow:inset 0 0 0 3px var(--ink),6px 6px 0 var(--ink)}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chead small{display:block;font:800 12px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ac)}
.mini{width:54px;height:54px;flex:none}
.task{font:800 clamp(15.5px,4.3vw,18px)/1.35 var(--body);margin:6px 0 8px}
.scene{background:#fffdf5;border-radius:10px;box-shadow:inset 0 0 0 2.5px var(--ink);overflow:hidden}
.scene svg{display:block;width:100%;height:auto}
.nb{padding:12px 12px 12px 34px;background:#fffbe8;border-radius:10px;box-shadow:inset 0 0 0 2.5px var(--ink);position:relative;font:700 16px/1.5 var(--body);background-image:linear-gradient(#e7dca8 1px,transparent 1px);background-size:100% 26px;background-position:0 7px}
.nb::before{content:"";position:absolute;left:22px;top:0;bottom:0;width:2px;background:#e98c85}
.nb .pin{position:absolute;left:5px;width:12px;height:12px;border-radius:50%;background:#d6402e;box-shadow:inset 0 0 0 2px var(--ink)}
.nb p{margin:0;min-height:26px}
.nb .ttl{font:800 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ac);min-height:0;margin-bottom:4px}
.sit{display:flex;align-items:flex-start;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.cp{padding:6px 10px;border-radius:8px;background:#fff;font:800 13.5px/1.2 var(--body);box-shadow:inset 0 0 0 2px var(--ink)}
.cp b{color:var(--ac)}
.sent{font:800 clamp(17px,4.9vw,21px)/1.4 var(--body);margin:12px 2px 4px;color:var(--ink)}
.sent u{display:inline-block;min-width:3.2em;text-decoration:none;border-bottom:3.5px solid var(--ink);text-align:center;color:var(--ac)}
.opts{display:grid;gap:9px;margin-top:12px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;text-align:left;padding:11px 12px;border:0;border-radius:12px;background:#fff;cursor:pointer;font:800 clamp(15.5px,4.3vw,18px)/1.35 var(--body);box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 var(--ink);touch-action:manipulation;min-height:52px}
.opt:not(:disabled):active{transform:translateY(3px);box-shadow:inset 0 0 0 2.5px var(--ink),0 1px 0 var(--ink)}
.opt .lt{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--ac-soft);font:800 14px/1 var(--kid);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.opt.pic{grid-template-columns:30px minmax(0,1fr);padding:8px}
.opt.pic svg{display:block;width:100%;height:auto;border-radius:8px;background:#fffdf5}
.opt.short{grid-template-columns:30px 1fr;justify-items:start}
.opt.ok{background:#e7f8ef;box-shadow:inset 0 0 0 3px var(--good),0 4px 0 var(--good)}
.opt.ok .lt{background:var(--good);color:#fff}
.opt.no{background:#fff0ec;color:#7a3a30;box-shadow:inset 0 0 0 3px var(--red),0 4px 0 var(--red)}
.opt.no .lt{background:var(--red);color:#fff}
.opt:disabled{cursor:default}
.opt.dim{opacity:.55}
.mk-why-m b,.mk-why-t p b{font-weight:800}
.mk-why-t p i{font-style:italic}
.meter{margin:10px 0 2px}
.meter svg{display:block;width:100%;max-width:320px;height:auto}
.go{width:100%;margin-top:6px}
.cl{display:block;margin-top:2px}
.ans{display:block;margin:6px 0;padding:8px 10px;border-radius:8px;background:#fff;font:800 16px/1.35 var(--body);box-shadow:inset 0 0 0 2px var(--good)}
@media (max-width:380px){.opt{padding:10px}.mini{width:46px;height:46px}}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <section id="menu">
    <div class="mk-hero">
      <div class="mk-hero-art" id="heroArt"></div>
      <h1 id="h1"></h1>
      <p id="heroP"></p>
    </div>
    <div id="levels"></div>
    <div class="gal" id="gal"></div>
    <div id="learn"></div>
    <p class="note" id="note"></p>
  </section>
  <section id="play" hidden>
    <div class="bar"><div id="dots"></div><span class="chip"><small id="ptsL"></small><span id="pts">0</span></span></div>
    <div id="board"></div>
    <div id="why"></div>
  </section>
</div>
<script>
(function(){
"use strict";
const GAME = "detektyvu-agentura", GRADES = [8], N = 8, INK = "#121a33";
const T = window.MK_T, E = T.en, SH = MK.shuffle, PK = MK.pick, RN = MK.rnd;
const $ = id => document.getElementById(id);
const esc = MK.esc;

/* ============================== piešiniai ============================== */
/* Detektyvas: pilnas žmogeliukas su lietpalčiu, skrybėle ir didinamuoju stiklu */
function detective(){
  return `<g>
  <ellipse cx="0" cy="118" rx="26" ry="5" fill="rgba(18,26,51,.18)"/>
  <rect x="-15" y="84" width="12" height="32" rx="4" fill="#2e3a63" stroke="${INK}" stroke-width="2.5"/>
  <rect x="3" y="84" width="12" height="32" rx="4" fill="#2e3a63" stroke="${INK}" stroke-width="2.5"/>
  <path d="M-20 117h18v-5h-18zM2 117h18v-5H2z" fill="#4a2c17" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M-23 40q-4 24-5 52h56q-1-28-5-52z" fill="#d9b77a" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
  <path d="M0 42v50" stroke="${INK}" stroke-width="2.4"/>
  <path d="M-23 66h46" stroke="#8f6b33" stroke-width="5"/><rect x="-4" y="62" width="8" height="8" rx="2" fill="#f2c94c" stroke="${INK}" stroke-width="2"/>
  <circle cx="-5" cy="74" r="1.8" fill="${INK}"/><circle cx="5" cy="74" r="1.8" fill="${INK}"/><circle cx="-5" cy="84" r="1.8" fill="${INK}"/><circle cx="5" cy="84" r="1.8" fill="${INK}"/>
  <path d="M-14 38l14 14 14-14-6-6h-16z" fill="#c9a460" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M-24 48l-12 24" stroke="${INK}" stroke-width="13" stroke-linecap="round"/><path d="M-24 48l-12 24" stroke="#d9b77a" stroke-width="8.5" stroke-linecap="round"/>
  <circle cx="-37" cy="75" r="6.5" fill="#f5c9a0" stroke="${INK}" stroke-width="2.4"/>
  <path d="M24 46l16-8" stroke="${INK}" stroke-width="13" stroke-linecap="round"/><path d="M24 46l16-8" stroke="#d9b77a" stroke-width="8.5" stroke-linecap="round"/>
  <circle cx="42" cy="37" r="6.5" fill="#f5c9a0" stroke="${INK}" stroke-width="2.4"/>
  <path d="M46 34l10-12" stroke="#7a4b2a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="60" cy="14" r="13" fill="#bfe9f3" fill-opacity=".75" stroke="${INK}" stroke-width="3.5"/>
  <path d="M53 9q4-4 9-3" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="0" cy="22" r="17" fill="#f5c9a0" stroke="${INK}" stroke-width="3"/>
  <circle cx="-6" cy="23" r="2.4" fill="${INK}"/><circle cx="6" cy="23" r="2.4" fill="${INK}"/>
  <path d="M0 24q-2 4 1 5" fill="none" stroke="#c98d68" stroke-width="2" stroke-linecap="round"/>
  <path d="M-6 31q6 4 12 0" fill="none" stroke="${INK}" stroke-width="2.4" stroke-linecap="round"/>
  <ellipse cx="0" cy="12" rx="29" ry="5.5" fill="#6b4a2b" stroke="${INK}" stroke-width="3"/>
  <path d="M-16 11q-1-18 16-18t16 18z" fill="#7d5733" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
  <path d="M-16 8h32" stroke="#d6402e" stroke-width="5"/>
  </g>`;
}
function heroSvg(){
  return `<svg viewBox="0 0 360 214" role="img" aria-label="Detektyvas su didinamuoju stiklu agentūros kabinete prie įkalčių lentos">
  <rect width="360" height="214" fill="#e9e3d0"/>
  <rect y="170" width="360" height="44" fill="#b99663"/><path d="M0 170h360" stroke="${INK}" stroke-width="2.5"/>
  <path d="M0 184h360M0 198h360" stroke="#a5834f" stroke-width="2"/>
  <!-- langas -->
  <rect x="244" y="22" width="92" height="104" rx="4" fill="#8fcbe4" stroke="${INK}" stroke-width="3"/>
  <path d="M290 22v104M244 74h92" stroke="${INK}" stroke-width="3"/>
  <circle cx="268" cy="46" r="9" fill="#fff3a0"/><path d="M302 48q6-10 14-4t4 10h-22z" fill="#fff"/>
  <rect x="240" y="124" width="100" height="8" rx="2" fill="#a56a3a" stroke="${INK}" stroke-width="2.5"/>
  <!-- įkalčių lenta -->
  <rect x="14" y="20" width="200" height="118" rx="5" fill="#c99a62" stroke="${INK}" stroke-width="3"/>
  <rect x="22" y="28" width="184" height="102" rx="3" fill="#f0d9a5" stroke="#8a6a38" stroke-width="2"/>
  <g stroke="#d6402e" stroke-width="2" fill="none" stroke-linecap="round"><path d="M52 52L112 82 170 48M112 82L74 108M112 82L172 108M170 48L172 108"/></g>
  <g><rect x="38" y="36" width="30" height="34" fill="#fff" stroke="${INK}" stroke-width="2" transform="rotate(-5 52 52)"/><circle cx="52" cy="47" r="7" fill="#b9b2a0" transform="rotate(-5 52 52)"/><path d="M42 66q10-12 20 0z" fill="#b9b2a0" transform="rotate(-5 52 52)"/>
  <rect x="96" y="66" width="32" height="30" fill="#fffbd0" stroke="${INK}" stroke-width="2" transform="rotate(4 112 82)"/><path d="M101 76h22M101 83h18M101 90h12" stroke="#7b7550" stroke-width="2" stroke-linecap="round" transform="rotate(4 112 82)"/>
  <rect x="154" y="34" width="32" height="28" fill="#fff" stroke="${INK}" stroke-width="2" transform="rotate(6 170 48)"/><path d="M162 54l8-14 8 14z" fill="#e8b84a" stroke="${INK}" stroke-width="1.6" transform="rotate(6 170 48)"/>
  <rect x="58" y="96" width="30" height="26" fill="#fff" stroke="${INK}" stroke-width="2" transform="rotate(-6 74 108)"/><path d="M64 112l8-8 6 6 6-9" fill="none" stroke="#127a8c" stroke-width="2.4" stroke-linecap="round" transform="rotate(-6 74 108)"/>
  <rect x="156" y="94" width="34" height="28" fill="#fff" stroke="${INK}" stroke-width="2" transform="rotate(5 172 108)"/><text x="173" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="14" fill="#d6402e" transform="rotate(5 172 108)">?</text></g>
  <g fill="#d6402e" stroke="${INK}" stroke-width="1.6"><circle cx="52" cy="37" r="3.4"/><circle cx="112" cy="68" r="3.4"/><circle cx="170" cy="35" r="3.4"/><circle cx="74" cy="97" r="3.4"/><circle cx="172" cy="95" r="3.4"/></g>
  <!-- stalas ir lempa -->
  <rect x="230" y="148" width="116" height="10" rx="3" fill="#7d5733" stroke="${INK}" stroke-width="3"/>
  <rect x="238" y="158" width="10" height="30" fill="#6b4a2b" stroke="${INK}" stroke-width="2.5"/><rect x="328" y="158" width="10" height="30" fill="#6b4a2b" stroke="${INK}" stroke-width="2.5"/>
  <path d="M272 148v-26l22-10" fill="none" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/><path d="M286 102l22 8-8 14-22-8z" fill="#2d9e9e" stroke="${INK}" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M290 126l-8 22h36z" fill="#fff3a0" opacity=".55"/>
  <rect x="302" y="132" width="34" height="16" rx="2" fill="#fff" stroke="${INK}" stroke-width="2.4"/><path d="M308 138h22M308 143h14" stroke="#127a8c" stroke-width="2" stroke-linecap="round"/>
  <g transform="translate(112 94)">${detective()}</g>
  </svg>`;
}
function miniDet(){
  return `<svg class="mini" viewBox="0 0 54 54" aria-hidden="true"><circle cx="27" cy="29" r="14" fill="#f5c9a0" stroke="${INK}" stroke-width="2.6"/><circle cx="22" cy="30" r="2" fill="${INK}"/><circle cx="32" cy="30" r="2" fill="${INK}"/><path d="M22 36q5 3 10 0" fill="none" stroke="${INK}" stroke-width="2.2" stroke-linecap="round"/><ellipse cx="27" cy="19" rx="22" ry="4.6" fill="#6b4a2b" stroke="${INK}" stroke-width="2.6"/><path d="M14 18q0-14 13-14t13 14z" fill="#7d5733" stroke="${INK}" stroke-width="2.6" stroke-linejoin="round"/><path d="M14 15h26" stroke="#d6402e" stroke-width="4"/></svg>`;
}
/* nusikaltėlis – pilnas kūnas, žaidimo pradžioje pagal numerį */
const COAT = ["#6b3fa0", "#c0392b", "#2c3e50", "#1f7a5a", "#b9770e", "#34495e", "#8e44ad", "#a04000", "#117a65", "#6c7a89", "#7d3c98", "#aa3d3d"];
const SKIN = ["#f5c9a0", "#e0ac86", "#c68642", "#f2d0b5", "#d9a066", "#8d5524"];
function villain(i, locked){
  if(locked) return `<svg viewBox="0 0 80 112" aria-hidden="true"><path d="M40 12a14 14 0 0 1 0 28 14 14 0 0 1 0-28zM18 104q-2-42 8-56 6-6 14-6t14 6q10 14 8 56z" fill="#dfe5e7" stroke="#b4bfc3" stroke-width="2.5" stroke-dasharray="5 4"/><text x="40" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="26" fill="#b4bfc3">?</text></svg>`;
  const c = COAT[i % 12], s = SKIN[i % 6], hat = i % 6, acc = i % 4, mask = i % 3 !== 0;
  let hatSvg = "";
  switch(hat){
    case 0: hatSvg = `<rect x="27" y="2" width="26" height="20" rx="2" fill="#23233a" stroke="${INK}" stroke-width="2.4"/><rect x="21" y="19" width="38" height="6" rx="3" fill="#23233a" stroke="${INK}" stroke-width="2.4"/><rect x="27" y="14" width="26" height="4" fill="${c}"/>`; break;
    case 1: hatSvg = `<path d="M24 22q0-14 16-14t16 14z" fill="${c}" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/><path d="M52 22h14q2 0 0 3H52z" fill="${c}" stroke="${INK}" stroke-width="2.2"/>`; break;
    case 2: hatSvg = `<path d="M26 22q0-16 14-16t14 16z" fill="#3b2f2f" stroke="${INK}" stroke-width="2.4"/><rect x="22" y="20" width="36" height="5" rx="2.5" fill="#3b2f2f" stroke="${INK}" stroke-width="2.2"/>`; break;
    case 3: hatSvg = `<path d="M22 40q-2-30 18-30t18 30l-8-12q-10-8-20 0z" fill="${c}" stroke="${INK}" stroke-width="2.6" stroke-linejoin="round"/>`; break;
    case 4: hatSvg = `<path d="M26 22q0-16 14-16t14 16z" fill="#8a6a3a" stroke="${INK}" stroke-width="2.4"/><path d="M16 24q24 -8 48 0q-24 5-48 0z" fill="#8a6a3a" stroke="${INK}" stroke-width="2.4"/><rect x="27" y="15" width="26" height="4" fill="#d6402e"/>`; break;
    default: hatSvg = `<path d="M24 21q16-9 32 0v5q-16-6-32 0z" fill="#d6402e" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/><circle cx="58" cy="25" r="3.2" fill="#d6402e" stroke="${INK}" stroke-width="2"/>`;
  }
  let accSvg = "";
  switch(acc){
    case 0: accSvg = `<path d="M58 70q-12 2-10 18 2 10 12 10t14-10q2-14-10-18z" fill="#c9a460" stroke="${INK}" stroke-width="2.4"/><path d="M54 70l4-6 4 6" fill="#c9a460" stroke="${INK}" stroke-width="2.2"/><text x="60" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="14" fill="${INK}">$</text>`; break;
    case 1: accSvg = `<path d="M64 62v44" stroke="${INK}" stroke-width="5" stroke-linecap="round"/><path d="M64 62v44" stroke="#8a6a3a" stroke-width="2.4" stroke-linecap="round"/><circle cx="64" cy="60" r="5" fill="#f2c94c" stroke="${INK}" stroke-width="2.2"/>`; break;
    case 2: accSvg = `<path d="M62 56v44" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/><path d="M44 62q18-18 36 0z" fill="#d6402e" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>`; break;
    default: accSvg = `<rect x="50" y="76" width="26" height="20" rx="3" fill="#7a4b2a" stroke="${INK}" stroke-width="2.4"/><path d="M58 76v-4h10v4" fill="none" stroke="${INK}" stroke-width="2.2"/><rect x="60" y="83" width="6" height="5" fill="#f2c94c" stroke="${INK}" stroke-width="1.6"/>`;
  }
  return `<svg viewBox="0 0 80 112" aria-hidden="true">
  <ellipse cx="40" cy="108" rx="22" ry="3.5" fill="rgba(18,26,51,.2)"/>
  <rect x="26" y="88" width="10" height="18" rx="3" fill="#2e2e44" stroke="${INK}" stroke-width="2.2"/><rect x="44" y="88" width="10" height="18" rx="3" fill="#2e2e44" stroke="${INK}" stroke-width="2.2"/>
  <path d="M18 62q0-18 22-18t22 18v32H18z" fill="${c}" stroke="${INK}" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M40 46v48" stroke="${INK}" stroke-width="2"/><path d="M30 46l10 12 10-12" fill="#fff" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M18 66l-6 20" stroke="${INK}" stroke-width="9" stroke-linecap="round"/><path d="M18 66l-6 20" stroke="${c}" stroke-width="5.4" stroke-linecap="round"/><circle cx="11" cy="88" r="4.6" fill="${s}" stroke="${INK}" stroke-width="2"/>
  ${accSvg}
  <circle cx="40" cy="34" r="14" fill="${s}" stroke="${INK}" stroke-width="2.8"/>
  ${mask ? `<path d="M26 32q14-6 28 0v7q-14 5-28 0z" fill="#1d1d2e" stroke="${INK}" stroke-width="1.8"/><circle cx="34" cy="35" r="2.2" fill="#fff"/><circle cx="46" cy="35" r="2.2" fill="#fff"/>` : `<circle cx="34" cy="34" r="2.3" fill="${INK}"/><circle cx="46" cy="34" r="2.3" fill="${INK}"/><path d="M30 29l8 2M50 29l-8 2" stroke="${INK}" stroke-width="2" stroke-linecap="round"/>`}
  <path d="M34 43q6 4 12 0" fill="none" stroke="${INK}" stroke-width="2.2" stroke-linecap="round"/>

/* ---------- raundų sudarymas ---------- */
const LEVELS = T.levels.map((l, i) => ({ id: "l" + (i + 1), name: l[0], sub: l[1], art: lvlIcon(i) }));
const seenGet = () => MK.get("mk-" + GAME + "-matyta", {});
function takeIdx(prefix, pool, n, seen, used){
  const fresh = SH(pool.filter(i => !seen.has(prefix + i) && !used.has(prefix + i)));
  const old = SH(pool.filter(i => seen.has(prefix + i) && !used.has(prefix + i)));
  return fresh.concat(old).slice(0, n);
}
function dedPick(n, seen, used){
  const by = { must: [], cant: [], might: [] };
  E.ded.forEach((d, i) => by[d[2]].push(i));
  const want = n === 8 ? ["must", "must", "cant", "cant", "might", "might", "must", "might"].slice(0, 8) : SH(["must", "cant", "might"]).slice(0, n);
  const out = [];
  want.forEach(k => { const idx = takeIdx("d", by[k], 1, seen, used)[0]; if(idx != null){ used.add("d" + idx); out.push(idx); } });
  return out;
}
function condPick(n, seen, used){
  const by = { zero: [], first: [], second: [], third: [] };
  E.cond.forEach((c, i) => by[c[0]].push(i));
  const kinds = n === 8 ? ["zero", "first", "second", "third", "first", "second", "third", "zero"] : SH(["zero", "first", "second", "third"]).slice(0, n);
  const out = [];
  kinds.forEach(k => { const idx = takeIdx("c", by[k], 1, seen, used)[0]; if(idx != null){ used.add("c" + idx); out.push(idx); } });
  return out;
}
function buildRound(i){
  const all = seenGet(), seen = new Set(all.a || []), used = new Set(), items = [], keys = new Set();
  const add = it => { if(keys.has(it.key)) return false; keys.add(it.key); items.push(it); return true; };
  const timeFmts = SH(["pick", "gap", "pic", "pick", "gap", "pic", "pick", "pic"]);
  if(i === 0 || i === 1){
    let rels = i === 0 ? SH(["INT", "SEQ", "INT", "SEQ", "INT", "SEQ", "INT", "SEQ"]) : SH(["INT", "SEQ", "PERF", "PERF", "INT", "PERF", "SEQ", "PERF"]);
    let tries = 0;
    for(let k = 0; items.length < N && tries++ < 200; k++) add(genTime(i, timeFmts[items.length], rels[items.length]));
  } else if(i === 2){
    const kinds = SH(["ps", "ps", "since", "since", "sofar", "ps", "since", "sofar"]), fm = SH(["pick", "gap", "pick", "gap", "pick", "pick", "gap", "pick"]);
    let tries = 0; while(items.length < N && tries++ < 200) add(genPP(fm[items.length], kinds[items.length]));
  } else if(i === 3){
    dedPick(N, seen, used).forEach(x => add(genDed(x)));
  } else if(i === 4){
    condPick(N, seen, used).forEach(x => add(genCond(x)));
  } else {
    let tries = 0;
    const L = [[() => genTime(RN(0, 1) ? 1 : 0, PK(["pick", "gap", "pic"]), null), 2], [() => genPP(PK(["pick", "gap"])), 2]];
    L.forEach(([f, n]) => { let c = 0; while(c < n && tries++ < 200){ if(add(f())) c++; } });
    dedPick(3, seen, used).forEach(x => add(genDed(x)));
    condPick(3, seen, used).forEach(x => add(genCond(x)));
  }
  items.forEach(it => { if(it.idx != null) used.add((it.kind === "ded" ? "d" : "c") + it.idx); });
  const keep = (all.a || []).concat([...used]);
  all.a = keep.slice(-70); MK.set("mk-" + GAME + "-matyta", all);
  return SH(items);
}

  $("gal").innerHTML = `<h2 class="mk-sec" style="margin-left:0">${T.galTitle}</h2>
    <div class="rogues">${T.villains.map((v, i) => `<div class="rg${i < have ? "" : " lock"}${i === fresh ? " fresh" : ""}">${i < have ? caughtBars(villain(i)) : villain(i, true)}<span>${i < have ? v : T.locked}</span></div>`).join("")}</div>
    <div class="sbar" aria-hidden="true"><i style="width:${nxt ? Math.round((n - prev) / (nxt - prev) * 100) : 100}%"></i></div>
    <p class="stext">${T.galText(n, nxt ? nxt - n : 0, T.villains[have], rankOf(have))}</p>`;
}

/* ============================== žaidimo eiga ============================== */
const app = $("app"), menu = $("menu"), play = $("play"), board = $("board"), why = $("why");
const saved = MK.get("mokomeskartu-klase", 0);
app.prepend(MK.top({ title: T.title, grade: GRADES.includes(saved) ? saved : GRADES[0] }));
$("h1").innerHTML = T.h1; $("heroP").textContent = T.hero; $("note").textContent = T.note; $("ptsL").textContent = T.points;
$("heroArt").innerHTML = `<div class="hero-card">${heroSvg()}</div>`;

let lvl = 0, Lv = null, ti = 0, round = [], cur = null, pts = 0, okN = 0, dots = null, tries = 0, locked = false, wrong = new Set();
function showMenu(fresh){ play.hidden = true; menu.hidden = false; MK.levels($("levels"), { game: GAME, levels: LEVELS, onPick: start }); drawGal(fresh); MK.learn($("learn"), { topics: T.learn, onPlay: start }); window.scrollTo(0, 0); }
function start(i){
  lvl = i; Lv = LEVELS[i]; ti = 0; pts = 0; okN = 0; $("pts").textContent = 0; why.innerHTML = "";
  round = buildRound(i); menu.hidden = true; play.hidden = false; dots = MK.dots($("dots"), N);
  next(); window.scrollTo(0, 0);
}
function next(){
  if(ti >= N) return finish();
  cur = round[ti]; tries = 0; locked = false; wrong = new Set(); why.innerHTML = ""; dots.cur(ti); draw();
}
function draw(state){
  const c = cur, picMode = c.opts.some(o => o.pic);
  const opts = c.opts.map((o, i) => {
    let cls = "opt" + (o.pic ? " pic" : "") + (o.short ? " short" : "");
    if(state === "done"){ cls += o.ok ? " ok" : (wrong.has(i) ? " no" : " dim"); }
    else if(wrong.has(i)) cls += " no";
    const dis = state === "done" || wrong.has(i);
    return `<button type="button" class="${cls}" data-i="${i}" ${dis ? "disabled" : ""}><span class="lt">${LETTERS[i]}</span>${o.pic ? o.pic : `<span>${o.h}</span>`}</button>`;
  }).join("");
  board.innerHTML = `<div class="card"><div class="chead"><div><small>${ti + 1} / ${N} · ${Lv.name}</small></div>${miniDet()}</div>
    <div class="task">${c.q}</div>
    ${picMode ? `<div class="sent">${c.sent}</div>` : `${c.scene}${c.sent ? `<div class="sent">${c.sent}</div>` : ""}`}
    <div class="opts">${opts}</div></div>`;
}
board.addEventListener("click", e => {
  MK.unlock();
  const b = e.target.closest(".opt"); if(!b || locked) return;
  const i = +b.dataset.i, o = cur.opts[i]; if(wrong.has(i)) return;
  tries++;
  if(o.ok){
    locked = true; dots.mark(ti, tries === 1); MK.sfx.good();
    if(tries === 1){ okN++; pts += 10; MK.set("mk-" + GAME + "-tiksliai", exactN() + 1); } else pts += 5;
    $("pts").textContent = pts;
    draw("done"); why.innerHTML = explain(true) + goBtn(ti < N - 1 ? T.next : T.results);
  } else {
    wrong.add(i); MK.sfx.bad();
    if(tries === 1){
      draw(); why.innerHTML = MK.why({ ok: false, head: T.retryHead });
    } else {
      locked = true; dots.mark(ti, false); draw("done"); why.innerHTML = explain(false) + goBtn(ti < N - 1 ? T.next : T.results);
    }
  }
  setTimeout(() => why.scrollIntoView({ behavior: "smooth", block: "nearest" }), 80);
});
const goBtn = label => `<button type="button" class="mk-btn go" id="go">${label}</button>`;
function explain(ok){
  const w = cur.why(ok);
  return MK.why({ ok, head: ok ? T.okHead(MK.praise(), tries === 1 ? 10 : 5) : T.failHead, body: w.body, more: w.more, sum: T.explain, open: !ok });
}
why.addEventListener("click", e => { if(!e.target.closest("#go")) return; MK.sfx.tap(); ti++; next(); window.scrollTo(0, 0); });
function finish(){
  const stars = MK.starsFor(okN, N); MK.best(GAME, Lv.id, stars);
  const n = exactN(), have = caughtN(n), startN = n - okN, had = caughtN(startN);
  const name = have > had ? T.villains[have - 1] : "";
  MK.result({ stars, title: T.resTitle(okN, N), text: T.resText(pts, name),
    next: lvl < LEVELS.length - 1 ? () => start(lvl + 1) : null, again: () => start(lvl), menu: () => showMenu(name ? have - 1 : -1) });
}
window.MK_DET = { genTime, genPP, genDed, genCond, geo, relOf, buildRound, tl, ppPic, villain, N };
showMenu();
})();
</script>
