<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MokomėsKartu">
<link rel="apple-touch-icon" href="/logo/mk-ikona-180.png">
<title>Rozetės meistras – MokomėsKartu.lt</title>
<meta name="description" content="9 klasės matematikos žaidimas: centriniai ir įbrėžtiniai kampai, lankai, liestinės ir susikertančios stygos. Spręsk apskritimo brėžinių galvosūkius ir sudėk katedros rozetės vitražą.">
<meta name="theme-color" content="#fff9e6">
<link rel="icon" href="/logo/mk-ikona.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800&family=Manrope:wght@600;700;800&display=swap">
<script src="/bendra/mk.js"></script>
<script src="/rozetes-meistras/tekstai.lt.js"></script>
<script src="/rozetes-meistras/uzduotys.js"></script>
<style>
/* Meniu: dirbtuvės piešinys, „Katedros rozetė“ (kolekcija), lygiai, „Noriu pasimokyti“.
   Užduotis: tikslus apskritimo brėžinys, atsakymo langeliai (x, y, P …), skaičių klaviatūra, 3 bandymai. */
body{--ac:#7a3fb8;--ac-ink:#fff;--ac-soft:#eadffa}
.mk-title{font-size:clamp(16px,4.4vw,24px)}
.mk-hero{padding-top:0}
.mk-hero h1{margin-top:8px;font-size:clamp(32px,8.4vw,52px)}
.mk-hero p{max-width:46ch;font-size:16px}
.art{width:min(100%,480px);border-radius:24px;overflow:hidden;position:relative;box-shadow:0 6px 0 rgba(18,26,51,.15);background:#efe3cf}
.art svg{display:block;width:100%;height:auto}
.art::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 3px var(--ink);pointer-events:none}
.col{width:100%;max-width:520px;margin:0 auto 14px;padding:12px 14px 14px;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 2.5px var(--ink),0 5px 0 rgba(18,26,51,.14)}
.col h2{margin:0;font:800 18px/1.2 var(--kid)}
.col p{margin:4px 0 8px;color:var(--soft);font-weight:700;font-size:14.5px}
.col p b{color:var(--ink)}
.rose{display:block;width:min(100%,300px);height:auto;margin:0 auto}
.rose .new{animation:glassIn .9s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes glassIn{from{opacity:0;transform:scale(.6)}}
.rose .pane{transform-box:fill-box;transform-origin:center}
.mk-lvl-t b{font-size:19px}

.hud{display:flex;align-items:center;gap:8px;margin:0 0 8px;min-height:36px}
.hud .mk-dots{margin-right:auto;justify-content:flex-start}
.chip{display:inline-flex;align-items:baseline;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink);font:800 17px/36px var(--kid);white-space:nowrap}
.chip small{font:800 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.chip.pop{animation:mkPop .35s cubic-bezier(.2,1.6,.4,1)}
.card{width:100%;max-width:560px;margin:0 auto 10px;padding:12px 14px 14px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.12)}
.fade{animation:mkIn .35s backwards}
.txt{margin:0 0 8px;font:700 16px/1.45 var(--body)}
.txt .mk-fr{font-family:var(--body);margin:0 .2em}
.ex{display:block;margin:6px 0;padding:6px 10px;border-radius:9px;background:var(--ac-soft);font:800 15.5px/1.45 var(--body)}
.fig{margin:0 auto 10px;border-radius:14px;overflow:hidden;box-shadow:0 0 0 2.5px var(--ink);background:#fbf7ec;max-width:400px}
.fig svg{display:block;width:100%;height:auto}
.fig .glass{transition:fill .6s}
.fig.done .shine{animation:shine 1.1s ease-out .15s backwards}
@keyframes shine{from{opacity:.9;transform:translate(-40%,-40%)}to{opacity:0;transform:translate(40%,40%)}}
.lfig{max-width:260px;margin:8px auto;border-radius:12px;overflow:hidden;box-shadow:0 0 0 2px var(--ink);background:#fbf7ec}
.lfig svg{display:block;width:100%;height:auto}
.boxes{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 8px}
.bx{display:inline-flex;align-items:center;gap:6px;height:52px;padding:0 12px 0 14px;border:0;border-radius:14px;background:#fff7d6;cursor:pointer;
  box-shadow:inset 0 0 0 2.5px var(--ink);font:800 20px/1 var(--body);touch-action:manipulation}
.bx i{font-style:italic;color:#b9360c}
.bx output{display:inline-block;min-width:58px;height:36px;padding:0 6px;border-radius:9px;background:#fff;box-shadow:inset 0 0 0 2px #cbbf9a;font:800 22px/36px var(--kid);text-align:center}
.bx.on{background:#ffe88a}.bx.on output{box-shadow:inset 0 0 0 2.5px var(--ac)}
.bx.on output::after{content:"";display:inline-block;width:2px;height:20px;margin-left:2px;background:var(--ac);vertical-align:-3px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.bx.no{background:#ffe1da}.bx.no output{box-shadow:inset 0 0 0 2.5px #e5484d;color:#b3261e}
.bx.ok{background:#dff7e8;pointer-events:none}.bx.ok output{box-shadow:inset 0 0 0 2.5px var(--good);color:#17703f}
.bx.shown{background:#eef1f6;pointer-events:none}.bx.shown output{color:#17703f}
.bx[disabled]{pointer-events:none}
.pad{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:0 0 6px}
.pad button{height:48px;border:0;border-radius:12px;background:#fff;cursor:pointer;font:800 22px/1 var(--kid);box-shadow:inset 0 0 0 2.5px var(--ink),0 3px 0 rgba(18,26,51,.16);touch-action:manipulation;padding:0}
.pad button:active{transform:translateY(2px);box-shadow:inset 0 0 0 2.5px var(--ink)}
.pad .del{background:#f4f1e8}
.pad .del svg{width:26px;height:26px;display:block;margin:0 auto}
.pad .go{background:var(--ac);color:#fff;box-shadow:0 3px 0 rgba(18,26,51,.3);font-size:15px;font-family:var(--body)}
.pad .go svg{width:26px;height:26px;display:block;margin:0 auto}
.pad button[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;font:800 13.5px/1.2 var(--body);color:var(--soft)}
.note{margin:0 0 8px;min-height:22px;font:700 15px/1.4 var(--body);text-align:center}
.note:empty{min-height:0;margin:0}
.note.bad{color:#b3261e}.note.ok{color:#17703f}
.note i{display:block;font-style:normal;color:var(--ink);margin-top:3px;text-align:left;padding:7px 10px;border-radius:10px;background:#fff7d6}
#flow .mk-btn{width:100%;max-width:560px;display:flex;margin:0 auto 14px}
.mk-why-t p{line-height:1.55}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <section id="menu">
    <div class="mk-hero">
      <div class="art" id="heroArt"></div>
      <h1 id="heroH"></h1>
      <p id="heroP"></p>
    </div>
    <div class="col" id="col"></div>
    <div id="levels"></div>
    <div id="learn"></div>
  </section>
  <section id="play" hidden>
    <div class="hud"><div id="dots"></div><span class="chip" id="ptsChip"><small id="ptsL"></small><span id="pts">0</span></span></div>
    <div id="stage"></div>
  </section>
</div>
<script>
(function(){
"use strict";
const T = window.MK_T, U = window.MK_RZ, GAME = "rozetes-meistras", GRADES = [9];
const $ = id => document.getElementById(id), K = "#121a33", f1 = x => Math.round(x * 10) / 10;
const rad = d => d * Math.PI / 180;
const FT = `font-family="Manrope,system-ui,sans-serif" font-weight="800"`;
const LC = ["#e5484d", "#f08c1a", "#d9a400", "#2fb36b", "#2f8fe5", "#8b5cf6"];           /* lygių (žiedlapių) spalvos */
const TINT = ["#ffe1e2", "#ffe9cf", "#fff2bf", "#d9f5e4", "#d8ebfd", "#e8e0fe"];

/* ================= brėžinys ================= */
const dSeg = (p, s) => { const vx = s[2] - s[0], vy = s[3] - s[1], l2 = vx * vx + vy * vy; let t = l2 ? ((p[0] - s[0]) * vx + (p[1] - s[1]) * vy) / l2 : 0; t = Math.max(0, Math.min(1, t)); return Math.hypot(p[0] - s[0] - t * vx, p[1] - s[1] - t * vy); };
function draw(t, solved, lvl, mini){
  const d = t.d, pad = 31, W = 340, P = d.P;
  const segs = d.seg.filter(s => solved || s.k !== "s").map(s => { const A = P[s.a], B = P[s.b], L = Math.hypot(B[0] - A[0], B[1] - A[1]), ux = (B[0] - A[0]) / L, uy = (B[1] - A[1]) / L; return { k: s.k, p: [A[0] - ux * s.e1, A[1] - uy * s.e1], q: [B[0] + ux * s.e2, B[1] + uy * s.e2] }; });
  let x0 = -1, x1 = 1, y0 = -1, y1 = 1;
  const ext = q => { x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]); };
  Object.values(P).forEach(ext); segs.forEach(s => { ext(s.p); ext(s.q); });
  const sc = Math.min((W - 2 * pad) / (x1 - x0), 250 / (y1 - y0), 106), H = Math.round((y1 - y0) * sc + 2 * pad);
  const X = x => W / 2 + (x - (x0 + x1) / 2) * sc, Y = y => pad + (y1 - y) * sc, XY = q => [X(q[0]), Y(q[1])], C = XY([0, 0]), Rp = sc;
  const obs = segs.map(s => XY(s.p).concat(XY(s.q))), lab = [];
  const score = q => { let m = 99; for(const s of obs) m = Math.min(m, dSeg(q, s)); m = Math.min(m, Math.abs(Math.hypot(q[0] - C[0], q[1] - C[1]) - Rp)); for(const l of lab) m = Math.min(m, Math.hypot(q[0] - l[0], q[1] - l[1]) - l[2]); return m; };
  const cl = k => k === "q" ? (solved ? "#17703f" : "#b9360c") : K;
  const lt = (o, deg) => o.k === "q" ? (solved ? o.val + deg : o.id) : o.val + deg;
  const txt = (q, s, col, it, size) => `<text x="${f1(q[0])}" y="${f1(q[1])}" text-anchor="middle" dominant-baseline="central" ${FT} font-size="${size || 13}" fill="${col}"${it ? ` font-style="italic"` : ""} stroke="#fbf7ec" stroke-width="3.2" paint-order="stroke" stroke-linejoin="round">${s}</text>`;
  let under = "", over = "", labels = "";
  /* nuspalvinta išpjova */
  d.sec.forEach(s => { const a = XY(P[s.a]), b = XY(P[s.b]), v = (d.th[s.b] - d.th[s.a] + 360) % 360; under += `<path d="M${f1(C[0])} ${f1(C[1])}L${f1(a[0])} ${f1(a[1])}A${f1(Rp)} ${f1(Rp)} 0 ${v > 180 ? 1 : 0} 0 ${f1(b[0])} ${f1(b[1])}Z" fill="#c9b4ee"/>`; });
  /* kampai */
  const grp = {}, rOf = v => v < 30 ? 31 : v < 60 ? 23 : v <= 110 ? 18 : 14;
  d.ang.forEach(o => { if(o.k !== "s" && o.k !== "r") (grp[o.v] = grp[o.v] || []).push(o); });
  d.ang.forEach(o => {
    if(o.k === "s" && !solved) return;
    const V = XY(P[o.v]), A = XY(P[o.a]), B = XY(P[o.b]), a1 = Math.atan2(A[1] - V[1], A[0] - V[0]), a2 = Math.atan2(B[1] - V[1], B[0] - V[0]);
    let df = a2 - a1; while(df > Math.PI) df -= 2 * Math.PI; while(df <= -Math.PI) df += 2 * Math.PI;
    if(o.k === "s" || o.k === "r"){ const u = 9, c1 = Math.cos(a1), s1 = Math.sin(a1), c2 = Math.cos(a2), s2 = Math.sin(a2);
      under += `<path d="M${f1(V[0] + u * c1)} ${f1(V[1] + u * s1)}L${f1(V[0] + u * (c1 + c2))} ${f1(V[1] + u * (s1 + s2))}L${f1(V[0] + u * c2)} ${f1(V[1] + u * s2)}" fill="none" stroke="${o.k === "s" ? "#17703f" : K}" stroke-width="1.6"/>`;
      lab.push([V[0] + u * (c1 + c2) * .6, V[1] + u * (s1 + s2) * .6, 8]); return; }
    const g = grp[o.v], mid = a1 + df * (o.lf || .5); let r = rOf(o.val), lr = r + 12.5;
    if(g.length >= 3){ r = 20; lr = 40; }
    else if(g.length === 2){ const w = g[0] === o ? g[1] : g[0]; if(o.val > w.val){ const b1 = Math.atan2(XY(P[w.a])[1] - V[1], XY(P[w.a])[0] - V[0]), b2 = Math.atan2(XY(P[w.b])[1] - V[1], XY(P[w.b])[0] - V[0]); let e = b2 - b1; while(e > Math.PI) e -= 2 * Math.PI; while(e <= -Math.PI) e += 2 * Math.PI;
      let dm = Math.abs(a1 + df / 2 - (b1 + e / 2)) % (2 * Math.PI); if(dm > Math.PI) dm = 2 * Math.PI - dm; if(dm <= rad((o.val - w.val) / 2 + 1)){ r = rOf(w.val) + 14; lr = r + 12.5; } } }
    const fill = o.k === "q" ? (solved ? "#bdeccd" : "#ffd95e") : "#cfe6f7";
    under += `<path d="M${f1(V[0])} ${f1(V[1])}L${f1(V[0] + r * Math.cos(a1))} ${f1(V[1] + r * Math.sin(a1))}A${r} ${r} 0 0 ${df > 0 ? 1 : 0} ${f1(V[0] + r * Math.cos(a2))} ${f1(V[1] + r * Math.sin(a2))}Z" fill="${fill}" stroke="${K}" stroke-width="1.2" stroke-linejoin="round"/>`;
    const q = [V[0] + lr * Math.cos(mid), V[1] + lr * Math.sin(mid)];
    labels += txt(q, lt(o, "°"), cl(o.k), o.k === "q" && !solved, o.k === "q" && !solved ? 15 : 12.5);
    lab.push([q[0], q[1], 11], [V[0] + r * .6 * Math.cos(mid), V[1] + r * .6 * Math.sin(mid), r * .5]);
  });
  /* lankai */
  d.arc.forEach(o => { const a = XY(P[o.a]), b = XY(P[o.b]), m = rad(d.th[o.a] + o.val / 2), col = o.k === "q" ? (solved ? "#2fb36b" : "#f59e0b") : "#2f8fe5";
    over += `<path d="M${f1(a[0])} ${f1(a[1])}A${f1(Rp)} ${f1(Rp)} 0 ${o.val > 180 ? 1 : 0} 0 ${f1(b[0])} ${f1(b[1])}" fill="none" stroke="${col}" stroke-width="5.5" stroke-linecap="round"/>`;
    const q = [C[0] + (Rp + 17) * Math.cos(m), C[1] - (Rp + 17) * Math.sin(m)]; labels += txt(q, lt(o, "°"), o.k === "q" ? cl("q") : "#175fa8", o.k === "q" && !solved, o.k === "q" && !solved ? 15 : 12.5); lab.push([q[0], q[1], 12]); });
  /* atkarpos */
  let lines = "";
  segs.forEach(s => { const a = XY(s.p), b = XY(s.q); lines += `<path d="M${f1(a[0])} ${f1(a[1])}L${f1(b[0])} ${f1(b[1])}" stroke="${s.k === "s" ? "#17703f" : K}" stroke-width="${s.k === "r" ? 1.9 : 2.3}" stroke-linecap="round"${s.k === "s" ? ` stroke-dasharray="5 4"` : ""}/>`; });
  d.tk.forEach(o => { const a = XY(P[o.a]), b = XY(P[o.b]), mx = a[0] + (b[0] - a[0]) * .3, my = a[1] + (b[1] - a[1]) * .3, L = Math.hypot(b[0] - a[0], b[1] - a[1]), ux = (b[0] - a[0]) / L, uy = (b[1] - a[1]) / L;
    for(let i = 0; i < o.n; i++){ const o2 = (i - (o.n - 1) / 2) * 4; lines += `<path d="M${f1(mx + ux * o2 - uy * 5)} ${f1(my + uy * o2 + ux * 5)}L${f1(mx + ux * o2 + uy * 5)} ${f1(my + uy * o2 - ux * 5)}" stroke="#e5484d" stroke-width="2.2" stroke-linecap="round"/>`; }
    lab.push([mx, my, 6]); });
  /* ilgiai */
  d.len.forEach(o => { const a = XY(P[o.a]), b = XY(P[o.b]), mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, L = Math.hypot(b[0] - a[0], b[1] - a[1]), nx = -(b[1] - a[1]) / L, ny = (b[0] - a[0]) / L;
    const c = [[mx + nx * 12, my + ny * 12], [mx - nx * 12, my - ny * 12]], q = score(c[0]) >= score(c[1]) ? c[0] : c[1];
    labels += txt(q, o.k === "q" ? (solved ? o.val : o.id) : o.val, cl(o.k), o.k === "q" && !solved, o.k === "q" && !solved ? 15 : 13); lab.push([q[0], q[1], 10]); });
  /* taškai ir jų raidės */
  let pts = d.dots.map(q => { const a = XY(q); return `<circle cx="${f1(a[0])}" cy="${f1(a[1])}" r="2.6" fill="#fff" stroke="${K}" stroke-width="1.6"/>`; }).join("");
  Object.keys(P).forEach(n => { const a = XY(P[n]), onC = Math.abs(Math.hypot(P[n][0], P[n][1]) - 1) < 1e-6, pr = n === "O" ? null : Math.atan2(a[1] - C[1], a[0] - C[0]);
    pts += `<circle cx="${f1(a[0])}" cy="${f1(a[1])}" r="${n === "O" ? 2.8 : 3.3}" fill="${K}"/>`;
    let best = null, bs = -1e9; for(let i = 0; i < 24; i++){ const g = i * Math.PI / 12, q = [a[0] + 14 * Math.cos(g), a[1] + 14 * Math.sin(g)]; if(q[0] < 9 || q[0] > W - 9 || q[1] < 9 || q[1] > H - 9) continue;
      const s = Math.min(score(q), 13) + (pr == null ? 0 : Math.cos(g - pr) * (onC ? 5 : 2)); if(s > bs){ bs = s; best = q; } }
    labels += txt(best, n, K, false, 13.5); lab.push([best[0], best[1], 9]); });
  const tint = solved && lvl != null ? TINT[lvl] : "#fff";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${T.figAria}">${mini ? "" : `<defs><clipPath id="cc"><circle cx="${f1(C[0])}" cy="${f1(C[1])}" r="${f1(Rp)}"/></clipPath></defs>`}
    <circle class="glass" cx="${f1(C[0])}" cy="${f1(C[1])}" r="${f1(Rp)}" fill="${tint}"/>
    ${solved && !mini ? `<g clip-path="url(#cc)"><rect class="shine" x="${f1(C[0] - Rp)}" y="${f1(C[1] - Rp)}" width="${f1(2 * Rp)}" height="${f1(2 * Rp)}" fill="url(#sh)" opacity="0" style="transform-box:fill-box"/></g><defs><linearGradient id="sh" x1="0" y1="0" x2="1" y2="1"><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset=".65" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>` : ""}
    ${under}<circle cx="${f1(C[0])}" cy="${f1(C[1])}" r="${f1(Rp)}" fill="none" stroke="${K}" stroke-width="2.6"/>${over}${lines}${pts}${labels}</svg>`;
}

/* ================= piešiniai ================= */
const ring = (cx, cy, r0, r1, a0, a1) => { const p = (r, a) => `${f1(cx + r * Math.sin(rad(a)))} ${f1(cy - r * Math.cos(rad(a)))}`; return `M${p(r0, a0)}L${p(r1, a0)}A${r1} ${r1} 0 0 1 ${p(r1, a1)}L${p(r0, a1)}A${r0} ${r0} 0 0 0 ${p(r0, a0)}Z`; };
function roseSvg(st, prev){
  const B = [[33, 62], [66, 96], [100, 128]], OP = [.55, .78, 1]; let s = "", n = 0, tot = st.reduce((a, b) => a + b, 0);
  for(let i = 0; i < 6; i++) for(let j = 0; j < 3; j++){ const on = st[i] > j, fresh = on && prev && prev[i] <= j;
    s += `<path class="pane${fresh ? " new" : ""}" d="${ring(150, 150, B[j][0], B[j][1], i * 60 + 3.5 - j, i * 60 + 56.5 + j)}" fill="${on ? LC[i] : "#e6e0d0"}" fill-opacity="${on ? OP[j] : 1}" stroke="${K}" stroke-width="2.2" stroke-linejoin="round"${fresh ? ` style="animation-delay:${.25 + n++ * .25}s"` : ""}/>`;
    if(on) s += `<path d="${ring(150, 150, B[j][0] + 5, B[j][0] + 9, i * 60 + 10, i * 60 + 30)}" fill="#fff" opacity=".55"/>`; }
  let knobs = ""; for(let i = 0; i < 12; i++) knobs += `<circle cx="${f1(150 + 139 * Math.sin(rad(i * 30)))}" cy="${f1(150 - 139 * Math.cos(rad(i * 30)))}" r="4.2" fill="#f4ecd9" stroke="${K}" stroke-width="1.6"/>`;
  let fl = ""; for(let i = 0; i < 6; i++) fl += `<ellipse cx="150" cy="136" rx="6.5" ry="12" fill="${tot >= 18 ? "#ffc61a" : tot ? "#f6e3a1" : "#efe9da"}" stroke="${K}" stroke-width="1.6" transform="rotate(${i * 60} 150 150)"/>`;

let L = 0, tasks = [], ti = 0, cur = null, okN = 0, pts = 0, dots = null, st0 = null, tries = 0, locked = true, vals = {}, done = {}, stale = {}, act = null;
