<style>
/* Laiko juosta: sąsiuvinio stilius 5–8 klasėms. Viršuje nauja įvykio kortelė, žemiau – laiko juosta su tarpais, į kuriuos ją galima įstatyti. */
body{--paper:#fbf7ef;--grid:#ece2cf;--soft:#6b5f4b;--kid:"Unbounded","Arial Black",system-ui,sans-serif;--ac:#d9480f;--ac-ink:#fff;--ac-soft:#ffe3d3}
.mk-lvl{border-radius:12px;box-shadow:inset 0 0 0 2.5px var(--ink),6px 6px 0 var(--ink)}
.mk-lvl-art{border-radius:10px;font-size:15px}
.mk-lvl-t b{font-size:19px;letter-spacing:-.02em}
.mk-hero h1{letter-spacing:-.04em;font-size:clamp(32px,8vw,52px)}
.mk-btn{border-radius:12px;font-size:18px}
.mk-res{border-radius:16px;box-shadow:inset 0 0 0 3px var(--ink),8px 8px 0 var(--ink)}
.mk-res .mk-owl{display:none}
.mk-res h2{font-size:26px;letter-spacing:-.03em}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 10px}
.chip{display:inline-flex;align-items:baseline;gap:6px;padding:7px 12px;border-radius:10px;background:#fff;font:800 18px/1 var(--kid);box-shadow:inset 0 0 0 2.5px var(--ink),3px 3px 0 var(--ink)}
.chip small{font:800 11px/1 var(--body);color:var(--soft);letter-spacing:.06em;text-transform:uppercase}
.hearts{font-size:20px;letter-spacing:2px}
.hearts .off{filter:grayscale(1);opacity:.3}
.new{position:sticky;top:6px;z-index:5;background:#fff;border-radius:12px;padding:12px 14px;box-shadow:inset 0 0 0 3px var(--ac),5px 5px 0 var(--ink);margin-bottom:14px}
.new small,.q small{display:block;font:800 12px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ac)}
.new b{display:block;font:800 clamp(17px,4.6vw,21px)/1.25 var(--kid);letter-spacing:-.02em;margin-top:4px;text-wrap:balance}
.new.pop{animation:mkIn .4s cubic-bezier(.2,1.4,.4,1)}
.line{position:relative;display:grid;gap:0;padding-left:26px}
.line::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:4px;border-radius:2px;background:var(--ink)}
.ev{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;background:#fff;border-radius:10px;padding:10px 12px;margin:4px 0;
  box-shadow:inset 0 0 0 2px var(--ink);font:700 15.5px/1.3 var(--body)}
.ev::before{content:"";position:absolute;left:-23px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px var(--ink)}
.ev .y{font:800 18px/1 var(--kid);letter-spacing:-.03em;min-width:3.2em}
.ev.w{background:#eef5ff}
.ev.w .y::after{content:" 🌍";font-size:13px}
.ev.just{animation:mkIn .45s cubic-bezier(.2,1.4,.4,1);box-shadow:inset 0 0 0 3px var(--good)}
.ev.just::before{background:var(--good)}
.ev.wrong{box-shadow:inset 0 0 0 3px var(--bad)}
.ev.wrong::before{background:var(--bad)}
.slot{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;margin:2px 0;padding:0 12px;border:2.5px dashed #c8b996;border-radius:10px;background:transparent;cursor:pointer;
  font:800 14px/1 var(--kid);color:var(--soft);letter-spacing:-.01em}
.slot::before{content:"+";font-size:20px;color:var(--ac)}
@media (hover:hover){.slot:hover{border-color:var(--ac);background:var(--ac-soft);color:var(--ink)}}
.slot:active{background:var(--ac-soft)}
.busy .slot{display:none}
.q{margin:6px 0 0}
.q b{display:block;font:800 clamp(20px,5.4vw,28px)/1.2 var(--kid);letter-spacing:-.03em;text-wrap:balance;margin-top:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opts button{min-height:64px;border:0;border-radius:10px;cursor:pointer;background:#fff;font:800 clamp(22px,6vw,28px)/1 var(--kid);letter-spacing:-.03em;
  box-shadow:inset 0 0 0 2.5px var(--ink),4px 4px 0 var(--ink)}
.opts button:active{transform:translate(2px,2px);box-shadow:inset 0 0 0 2.5px var(--ink),2px 2px 0 var(--ink)}
.opts button.ok{background:#7ee08a}
.opts button.no{background:#ffb4a2;opacity:.75;pointer-events:none}
.msg{margin:12px 0;min-height:48px;padding:10px 14px;border-radius:10px;background:#fff;border:2px dashed #d7c9a8;font:700 16px/1.35 var(--body)}
.msg.ok{border-color:var(--good);background:#effcf6}
.msg.bad{border-color:#ff8a7a;background:#fff4f1}
#why .mk-btn{width:100%;margin-top:2px}
.note{max-width:520px;margin:14px auto 0;color:var(--soft);font-size:13px;text-align:center}
</style>

    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <div id="why"></div>
  </section>
</div>
<script>
(function(){
"use strict";
const GAME = "laiko-juosta", GRADES = [5, 6, 7, 8];
/* [metai, įvykis, "lt" – Lietuvos / "w" – pasaulio] */
const EV = [
  [1009, "Lietuvos vardas pirmą kartą paminėtas Kvedlinburgo analuose", "lt", "Kvedlinburgo analuose rašoma apie misionieriaus šv. Brunono žūtį „Rusios ir Lietuvos pasienyje“. Tai seniausias žinomas rašytinis Lietuvos vardo paminėjimas."],
  [1236, "Saulės mūšis", "lt", "Žemaičiai ir žiemgaliai sumušė Kalavijuočių ordiną. Po šio pralaimėjimo ordino likučiai prisijungė prie Kryžiuočių ordino ir tapo Livonijos ordinu."],
  [1253, "Mindaugo karūnavimas", "lt", "Mindaugas buvo karūnuotas Lietuvos karaliumi. Tai vienintelis karūnuotas Lietuvos karalius; karūnacija reiškė, kad Lietuvą kaip valstybę pripažino Europa."],
  [1260, "Durbės mūšis", "lt", "Prie Durbės ežero žemaičiai sumušė Livonijos ir Kryžiuočių ordinų kariuomenę. Po mūšio prieš ordinus sukilo prūsai, kuršiai ir kitos baltų gentys."],
  [1323, "Gedimino laiškai – Vilnius pirmą kartą paminėtas kaip sostinė", "lt", "Didysis kunigaikštis Gediminas laiškuose Vakarų Europos miestams kvietė į Lietuvą pirklius ir amatininkus. Šiuose laiškuose Vilnius minimas kaip jo sostinė."],
  [1385, "Krėvos sutartis", "lt", "Jogaila susitarė vesti Lenkijos karalaitę Jadvygą, tapti Lenkijos karaliumi ir pakrikštyti Lietuvą. Taip prasidėjo ilgi Lietuvos ir Lenkijos ryšiai."],
  [1387, "Lietuvos (Aukštaitijos) krikštas", "lt", "Po Krėvos sutarties Jogaila Vilniuje pradėjo krikštyti aukštaičius, įkurta Vilniaus vyskupija. Lietuva tapo katalikiška valstybe."],
  [1410, "Žalgirio mūšis", "lt", "Jungtinė Lietuvos ir Lenkijos kariuomenė, vadovaujama Vytauto ir Jogailos, sumušė Kryžiuočių ordiną. Po šio mūšio ordino galia ėmė silpti."],
  [1413, "Žemaitijos krikštas", "lt", "Vytautas ir Jogaila pradėjo krikštyti žemaičius. Žemaitija buvo paskutinė apkrikštyta Lietuvos žemė."],
  [1529, "Pirmasis Lietuvos Statutas", "lt", "Pirmasis Lietuvos Statutas – LDK įstatymų rinkinys. Vėliau buvo priimti dar du – 1566 ir 1588 m."],
  [1547, "Martyno Mažvydo „Katekizmas“ – pirmoji lietuviška knyga", "lt", "Karaliaučiuje išspausdintas Martyno Mažvydo „Katekizmas“ – pirmoji spausdinta lietuviška knyga. Joje yra ir elementorius skaityti mokytis."],
  [1569, "Liublino unija – įkurta Abiejų Tautų Respublika", "lt", "Liublino unija sujungė Lietuvos Didžiąją Kunigaikštystę ir Lenkijos Karalystę į Abiejų Tautų Respubliką su bendru valdovu ir seimu."],
  [1579, "Įkurtas Vilniaus universitetas", "lt", "Valdovas Steponas Batoras jėzuitų kolegiją Vilniuje pavertė universitetu. Vilniaus universitetas – vienas seniausių Vidurio ir Rytų Europoje."],
  [1791, "Gegužės 3-iosios konstitucija", "lt", "Abiejų Tautų Respublikos Seimas priėmė Gegužės 3-iosios konstituciją – pirmąją rašytinę konstituciją Europoje. Ja bandyta sustiprinti silpstančią valstybę."],
  [1795, "Trečiasis padalijimas – Lietuva prijungta prie Rusijos imperijos", "lt", "Rusija, Prūsija ir Austrija trečią kartą pasidalijo Abiejų Tautų Respubliką, ir ji išnyko iš žemėlapio. Didžioji Lietuvos dalis atiteko Rusijos imperijai."],
  [1863, "Prasidėjo Sausio sukilimas prieš carinę Rusiją", "lt", "Sukilimas prieš Rusijos valdžią Lenkijoje ir Lietuvoje. Jį numalšinus, nuo 1864 m. buvo uždrausta lietuviška spauda lotyniškais rašmenimis."],
  [1883, "Pradėta leisti „Aušra“", "lt", "„Aušra“ – pirmasis lietuviškas tautinio atgimimo laikraštis. Jis buvo leidžiamas Mažojoje Lietuvoje, nes Rusijos imperijoje spauda buvo uždrausta; susijęs su Jonu Basanavičiumi."],
  [1904, "Panaikintas lietuviškos spaudos draudimas", "lt", "Po 40 metų draudimo (1864–1904) vėl leista leisti lietuviškas knygas lotyniškais rašmenimis. Daug prie to prisidėjo knygnešiai, slapta gabenę knygas."],
  [1918, "Vasario 16-osios Nepriklausomybės Aktas", "lt", "Lietuvos Taryba Vilniuje paskelbė atkurianti nepriklausomą Lietuvos valstybę. Aktą pasirašė 20 Tarybos narių; vasario 16-oji – Valstybės atkūrimo diena."],
  [1923, "Klaipėdos kraštas prijungtas prie Lietuvos", "lt", "Po Klaipėdos sukilimo Klaipėdos kraštas prijungtas prie Lietuvos. Lietuva gavo uostą ir išėjimą į jūrą."],
  [1933, "Dariaus ir Girėno skrydis per Atlantą", "lt", "Steponas Darius ir Stasys Girėnas lėktuvu „Lituanica“ perskrido Atlanto vandenyną, bet žuvo netoli Soldino (dabar Lenkija), nepasiekę Kauno."],
  [1937, "Lietuva laimėjo Europos krepšinio čempionatą", "lt", "Rygoje vykusiame Europos krepšinio čempionate laimėjo Lietuvos rinktinė. 1939 m. Kaune ji čempionatą laimėjo dar kartą."],
  [1940, "Sovietų Sąjunga okupavo Lietuvą", "lt", "Birželio 15 d. Sovietų Sąjungos kariuomenė įžengė į Lietuvą. Prasidėjo okupacija, Lietuva neteko nepriklausomybės, prasidėjo represijos."],
  [1988, "Įkurtas Sąjūdis", "lt", "Įkurtas Lietuvos persitvarkymo sąjūdis. Jis vadovavo taikiam tautos judėjimui už laisvę ir nepriklausomybę."],
  [1990, "Kovo 11-oji – atkurta Lietuvos nepriklausomybė", "lt", "Aukščiausioji Taryba, vadovaujama Vytauto Landsbergio, priėmė Aktą dėl Lietuvos nepriklausomos valstybės atstatymo. Lietuva pirmoji iš sovietinių respublikų paskelbė nepriklausomybę."],
  [1991, "Sausio 13-osios įvykiai prie Vilniaus televizijos bokšto", "lt", "Sovietų kariuomenė puolė Vilniaus televizijos bokštą ir Radijo ir televizijos komitetą. Žuvo 14 beginklių žmonių, bet žmonės apgynė Aukščiausiąją Tarybą."],
  [2004, "Lietuva įstojo į NATO ir Europos Sąjungą", "lt", "Kovą Lietuva tapo NATO nare, o gegužės 1 d. – Europos Sąjungos nare."],
  [2015, "Lietuva įsivedė eurą", "lt", "Sausio 1 d. euras pakeitė litą. Lietuva tapo 19-ąja euro zonos šalimi."],
  [476, "Žlugo Vakarų Romos imperija", "w", "Germanų vadas Odoakras nuvertė paskutinį Vakarų Romos imperatorių. Šie metai dažnai laikomi Antikos pabaiga ir viduramžių pradžia."],
  [1096, "Prasidėjo pirmasis kryžiaus žygis", "w", "Popiežiui Urbonui II paraginus, Europos riteriai išsiruošė atsikovoti Jeruzalės. 1099 m. kryžiuočiai Jeruzalę užėmė."],
  [1453, "Osmanai užėmė Konstantinopolį", "w", "Osmanų turkai užėmė Bizantijos sostinę Konstantinopolį. Bizantijos imperija žlugo; miestas vėliau pavadintas Stambulu."],
  [1492, "Kristupas Kolumbas pasiekė Ameriką", "w", "Ispanijos remiamas Kolumbas plaukė į vakarus ieškoti kelio į Indiją, o pasiekė Amerikos salas. Tai vienas svarbiausių Didžiųjų geografinių atradimų."],
  [1517, "Martynas Liuteris paskelbė 95 tezes – Reformacijos pradžia", "w", "Martynas Liuteris kritikavo atlaidų pardavinėjimą. Prasidėjo Reformacija, atsirado protestantų bažnyčios."],
  [1776, "JAV Nepriklausomybės deklaracija", "w", "Liepos 4 d. trylika Amerikos kolonijų paskelbė nepriklausomybę nuo Didžiosios Britanijos. Taip susikūrė Jungtinės Amerikos Valstijos."],
  [1789, "Prasidėjo Prancūzijos revoliucija", "w", "Paryžiečiai užėmė Bastilijos tvirtovę. Revoliucijos šūkis „Laisvė, lygybė, brolybė“ paveikė visą Europą."],
  [1903, "Broliai Raitai pakilo lėktuvu", "w", "Orvilis ir Vilburas Raitai atliko pirmąjį valdomą skrydį lėktuvu su varikliu. Pirmasis skrydis truko vos 12 sekundžių."],
  [1914, "Prasidėjo Pirmasis pasaulinis karas", "w", "Karas prasidėjo po Austrijos-Vengrijos sosto įpėdinio nužudymo Sarajeve. Jis truko iki 1918 m.; po jo atsikūrė Lietuvos valstybė."],
  [1939, "Prasidėjo Antrasis pasaulinis karas", "w", "Rugsėjo 1 d. nacistinė Vokietija užpuolė Lenkiją. Tai didžiausias karas žmonijos istorijoje."],
  [1945, "Baigėsi Antrasis pasaulinis karas", "w", "Gegužę kapituliavo Vokietija, o rugsėjį – Japonija. Lietuva po karo liko okupuota Sovietų Sąjungos."],
  [1961, "Jurijus Gagarinas – pirmasis žmogus kosmose", "w", "Balandžio 12 d. Jurijus Gagarinas erdvėlaiviu „Vostok 1“ apskriejo Žemę. Skrydis truko apie 108 minutes."],
  [1969, "Žmogus pirmą kartą išlipo Mėnulyje", "w", "Erdvėlaivio „Apollo 11“ astronautai Neilas Armstrongas ir Buzzas Aldrinas pirmieji žengė Mėnulio paviršiumi."],
  [1989, "Griuvo Berlyno siena", "w", "Lapkričio 9 d. atverta Berlyno siena, skyrusi Rytų ir Vakarų Berlyną. Netrukus, 1990 m., Vokietija susivienijo."]
].map(([y, t, k, x]) => ({ y, t, k, x }));
const LEVELS = [
  { id: "simtmeciai", name: "Šimtmečiai", sub: "Lietuva · įvykiai toli vienas nuo kito", art: "XIII", mode: "line", pool: e => e.k === "lt", spread: true },
  { id: "lietuva", name: "Lietuvos istorija", sub: "Visi įvykiai · artimi metai", art: "1410", mode: "line", pool: e => e.k === "lt" },
  { id: "metai", name: "Kurie metai?", sub: "Pasirink tikslius metus", art: "?", mode: "year", pool: e => e.k === "lt" },
  { id: "pasaulis", name: "Lietuva ir pasaulis", sub: "Visi įvykiai kartu", art: "🌍", mode: "line", pool: () => true }
];
const PLACE = 8, START = 2, YEARQ = 10;
const $ = id => document.getElementById(id);
const app = $("app"), menu = $("menu"), play = $("play"), board = $("board"), msg = $("msg");
const saved = MK.get("mokomeskartu-klase", 0);
app.prepend(MK.top({ title: "Laiko juosta", grade: GRADES.includes(saved) ? saved : GRADES[0] }));
$("heroArt").innerHTML = `<svg viewBox="0 0 260 90" aria-hidden="true" style="width:100%">
  <line x1="10" y1="50" x2="250" y2="50" stroke="#121a33" stroke-width="4" stroke-linecap="round"/>
  ${[[30, "1253"], [100, "1410"], [170, "1918"], [235, "1990"]].map(([x, y], i) => `<circle cx="${x}" cy="50" r="7" fill="${i === 2 ? "#d9480f" : "#fff"}" stroke="#121a33" stroke-width="3"/>
  <text x="${x}" y="${i % 2 ? 84 : 30}" text-anchor="middle" font-family="Unbounded,Arial Black,sans-serif" font-weight="800" font-size="15" fill="#121a33">${y}</text>`).join("")}</svg>`;
const taskai = n => n % 10 === 1 && n % 100 !== 11 ? "taškas" : n % 10 >= 2 && (n % 100 < 10 || n % 100 > 20) ? "taškai" : "taškų";

let lvl = 0, L = null, deck = [], placed = [], cur = null, lives = 3, pts = 0, streak = 0, okCount = 0, total = 0, busy = false, tries = 0;
const ERAS = [["Viduramžiai (iki 1500 m.)", 0, 1500], ["1500–1800 m.", 1500, 1800], ["XIX a. ir XX a. pradžia", 1800, 1918], ["1918–1945 m.", 1918, 1946], ["1946 m. – dabartis", 1946, 3000]];
function showMenu(){ play.hidden = true; menu.hidden = false; $("why").innerHTML = ""; MK.levels($("levels"), { game: GAME, levels: LEVELS, onPick: start });
  MK.learn($("learn"), { topics: ERAS.map(([name, a, b]) => ({ name, level: 3,
    html: EV.filter(e => e.y >= a && e.y < b).sort((x, y) => x.y - y.y).map(e => `<p><b>${e.y} m. ${e.k === "w" ? "🌍 " : ""}${MK.esc(e.t)}.</b> ${MK.esc(e.x)}</p>`).join("") })), onPlay: start });
  window.scrollTo(0, 0); }
function pickDeck(n){
  let pool = MK.shuffle(EV.filter(L.pool));
  const out = [], years = new Set(), cents = new Set();
  for(const e of pool){
    if(out.length >= n) break;
    const c = Math.floor((e.y - 1) / 100);
    if(years.has(e.y) || (L.spread && cents.has(c))) continue;
    out.push(e); years.add(e.y); cents.add(c);
  }
  return out;
}
function start(i){
  lvl = i; L = LEVELS[i]; lives = 3; pts = 0; streak = 0; okCount = 0; busy = false;
  menu.hidden = true; play.hidden = false; window.scrollTo(0, 0);
  if(L.mode === "year"){ deck = pickDeck(YEARQ); total = YEARQ; }
  else { deck = pickDeck(START + PLACE); placed = deck.splice(0, START).sort((a, b) => a.y - b.y); total = deck.length; }
  hud(); next();
}
function hud(){
  $("hearts").innerHTML = [0, 1, 2].map(i => `<span class="${i < lives ? "" : "off"}">❤️</span>`).join("");
  $("pts").textContent = pts;
}
function say(html, cls){ msg.className = "msg" + (cls ? " " + cls : ""); msg.innerHTML = html; }
function next(){
  busy = false; tries = 0; $("why").innerHTML = "";
  if(lives <= 0 || !deck.length) return finish();
  cur = deck.shift();
  if(L.mode === "year") return drawYear();
  drawLine();
  say(`Kur šis įvykis? Paspausk tarpą <b>+</b> laiko juostoje.`);
}
function drawLine(mark){
  const rows = [];
  rows.push(`<div class="new pop"><small>Naujas įvykis${cur.k === "w" ? " · 🌍 pasaulis" : ""}</small><b>${MK.esc(cur.t)}</b></div><div class="line" id="line">`);
  placed.forEach((e, i) => {
    rows.push(`<button type="button" class="slot" data-i="${i}">${i === 0 ? "Anksčiau už viską" : "Čia"}</button>`);
    rows.push(`<div class="ev${e.k === "w" ? " w" : ""}${mark && mark.e === e ? " " + mark.cls : ""}"><span class="y">${e.y}</span><span>${MK.esc(e.t)}</span></div>`);
  });
  rows.push(`<button type="button" class="slot" data-i="${placed.length}">Vėliau už viską</button></div>`);
  board.innerHTML = rows.join("");
}
function why(e, ok, extra){
  $("why").innerHTML = MK.why({ ok, head: `${e.y} m. – ${MK.esc(e.t)}`, body: extra || "", more: MK.esc(e.x), sum: "Daugiau apie įvykį", open: !ok })
    + `<button type="button" class="mk-btn" id="go">${lives > 0 && deck.length ? "Toliau →" : "Rezultatai"}</button>`;
  $("go").scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function placeAt(i){
  busy = true; board.classList.add("busy");
  const before = placed[i - 1], after = placed[i];
  const ok = (!before || before.y < cur.y) && (!after || cur.y < after.y);
  const e = cur;
  placed.push(e); placed.sort((a, b) => a.y - b.y);
  let extra = "";
  if(ok){
    streak++; okCount++; const gain = 10 + Math.min(streak - 1, 5) * 2; pts += gain;
    MK.sfx.good(); say(`<b>${MK.praise()}</b> +${gain}${streak > 1 ? ` (serija ${streak})` : ""}`, "ok");
  } else {
    streak = 0; lives--; MK.sfx.bad();
    const k = placed.indexOf(e), pb = placed[k - 1], pa = placed[k + 1];
    extra = pb && pa ? `Jo vieta – tarp ${pb.y} m. ir ${pa.y} m.` : pb ? `Jis įvyko vėliau už visus kitus – po ${pb.y} m.` : `Jis įvyko anksčiau už visus kitus – prieš ${pa.y} m.`;
    say(`Ne ten. Šis įvykis – <b>${e.y} m.</b> Žiūrėk, kur jo vieta.`, "bad");
  }
  hud(); drawLine({ e, cls: ok ? "just" : "wrong" });
  board.querySelector(".new").hidden = true;
  why(e, ok, extra);
}
board.addEventListener("click", e => {
  const s = e.target.closest(".slot"); if(s && !busy){ MK.unlock(); return placeAt(+s.dataset.i); }
  const b = e.target.closest(".opts button"); if(b && !busy){ MK.unlock(); return pickYear(b); }
});
/* ---------- „Kurie metai?“ ---------- */
$("why").addEventListener("click", e => { if(e.target.closest("#go")){ board.classList.remove("busy"); window.scrollTo({ top: 0, behavior: "smooth" }); next(); } });
function drawYear(){
  const ys = new Set([cur.y]);
  while(ys.size < 4){ const d = MK.pick([1, 2, 3, 5, 7, 10, 13, 20, 25, 30]) * (Math.random() < .5 ? -1 : 1); const y = cur.y + d; if(y > 0 && y <= 2025) ys.add(y); }
  board.innerHTML = `<div class="q"><small>Kuriais metais?</small><b>${MK.esc(cur.t)}</b></div>
    <div class="opts">${MK.shuffle([...ys]).map(y => `<button type="button" data-y="${y}">${y}</button>`).join("")}</div>`;
  say("Pasirink teisingus metus. Dvi klaidos tame pačiame klausime – minus gyvybė.");
}
function pickYear(b){
  const y = +b.dataset.y;
  if(y === cur.y){
    busy = true; b.classList.add("ok"); streak = tries === 0 ? streak + 1 : 0; if(tries === 0) okCount++;
    const gain = tries === 0 ? 10 + Math.min(streak - 1, 5) * 2 : 4; pts += gain; hud(); MK.sfx.good();
    say(`<b>${MK.praise()}</b> +${gain}`, "ok");
    return why(cur, true);
  }
  tries++; b.classList.add("no"); MK.sfx.bad(); streak = 0;
  say(`Ne ${y}-ieji. ${y < cur.y ? "Vėliau!" : "Anksčiau!"}`, "bad");
  if(tries >= 2){
    busy = true; lives--; hud();
    board.querySelectorAll(".opts button").forEach(x => { if(+x.dataset.y === cur.y) x.classList.add("ok"); });
    say(`Teisingai – <b>${cur.y} m.</b> Įsimink!`, "bad");
    why(cur, false);
  }
}
function finish(){
  busy = true;
  const stars = lives <= 0 ? 1 : MK.starsFor(okCount, total);
  MK.best(GAME, L.id, stars);
  MK.result({ stars, title: `${pts} ${taskai(pts)}`,
    text: lives <= 0 ? `Gyvybės baigėsi. Teisingai: ${okCount}. Pabandyk dar kartą!` : `Teisingai iš pirmo karto: ${okCount} iš ${total}.`,
    next: lvl < LEVELS.length - 1 ? () => start(lvl + 1) : null, again: () => start(lvl), menu: showMenu });
}
showMenu();
})();
</script>
</body>
