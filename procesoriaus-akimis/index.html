<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Procesoriaus akimis – MokomėsKartu.lt</title>
<meta name="description" content="8–10 klasių informatikos žaidimas: skaityk Python arba C++ programas taip, kaip jas vykdo kompiuteris – sek kintamųjų reikšmes, pasirinkimo ir kartojimo komandas, dėliok programas, ieškok sintaksės ir loginių klaidų, nagrinėk paprogrames.">
<meta name="theme-color" content="#fff9e6">
<link rel="icon" href="/logo/mk-ikona.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@600;700;800&display=swap">
<script src="/bendra/mk.js"></script>
<script src="/procesoriaus-akimis/tekstai.lt.js"></script>
<script src="/procesoriaus-akimis/programos.js"></script>
<style>
/* Meniu: piešinys su Čipu, kalbos jungiklis, „Mikroschemų plokštė“ (kolekcija), lygiai, „Noriu pasimokyti“.
   Užduotis: programos tekstas (Python / C++), atsakymo klaviatūra arba eilučių dėliojimas, vykdymo eiga pažingsniui. */
body{--ac:#3b5bdb;--ac-ink:#fff;--ac-soft:#e3e9ff;--mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.mk-title{font-size:clamp(14px,3.9vw,24px)}
.mk-hero{padding-top:0}
.mk-hero h1{margin-top:8px;font-size:clamp(31px,8.2vw,52px)}
.mk-hero p{max-width:46ch;font-size:16px}
.art{width:min(100%,480px);border-radius:24px;overflow:hidden;position:relative;box-shadow:0 6px 0 rgba(18,26,51,.15);background:#eef2ff}
.art svg{display:block;width:100%;height:auto}
.art::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 3px var(--ink);pointer-events:none}
.art .blink{animation:cur 1.1s steps(2) infinite}
@keyframes cur{50%{opacity:.25}}
.col{width:100%;max-width:520px;margin:0 auto 14px;padding:12px 14px 14px;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 2.5px var(--ink),0 5px 0 rgba(18,26,51,.14)}
.col h2{margin:0;font:800 18px/1.2 var(--kid)}
.col p{margin:4px 0 8px;color:var(--soft);font-weight:700;font-size:14.5px}
.col p b{color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.seg button{min-height:48px;border:0;border-radius:14px;background:#fff;cursor:pointer;box-shadow:inset 0 0 0 2.5px var(--ink);font:700 18px/1 var(--mono)}
.seg button[aria-pressed=true]{background:var(--ac);color:#fff;box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.25)}
.board{display:block;width:100%;height:auto;border-radius:12px}
.board .new{animation:chipIn .8s cubic-bezier(.2,1.6,.4,1) backwards;transform-box:fill-box;transform-origin:center}
@keyframes chipIn{from{opacity:0;transform:scale(.2)}}
.mk-lvl-t b{font-size:19px}

.hud{display:flex;align-items:center;gap:8px;margin:0 0 8px;min-height:36px}
.hud .mk-dots{margin-right:auto;justify-content:flex-start}
.chip{display:inline-flex;align-items:baseline;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink);font:800 17px/36px var(--kid);white-space:nowrap}
.chip small{font:800 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.chip.lang{font:700 13px/36px var(--mono);background:var(--ac-soft)}
.chip.pop{animation:mkPop .35s cubic-bezier(.2,1.6,.4,1)}
.card{width:100%;max-width:560px;margin:0 auto 10px;padding:12px 14px 14px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.12)}
.fade{animation:mkIn .35s backwards}
.txt{margin:0 0 8px;font:700 16px/1.45 var(--body)}
code{font:700 .95em/1.2 var(--mono);background:var(--ac-soft);padding:1px 5px;border-radius:6px;white-space:nowrap}
.goal{margin:0 0 8px;padding:8px 10px;border-radius:12px;background:#fff7d6;box-shadow:inset 0 0 0 2px #e2cf8a;font:700 15px/1.45 var(--body)}
.goal b{display:block;font:800 11px/1.2 var(--body);letter-spacing:.07em;text-transform:uppercase;color:#8a6d00;margin-bottom:2px}

/* programos tekstas */
.code{margin:0 0 10px;padding:6px 0;border-radius:14px;background:#f6f8ff;box-shadow:inset 0 0 0 2.5px var(--ink);font:500 clamp(12.6px,3.55vw,15px)/1.5 var(--mono);overflow:hidden}
.ln{display:grid;grid-template-columns:30px minmax(0,1fr);align-items:start;width:100%;min-height:28px;padding:2px 8px 2px 0;border:0;background:none;text-align:left;font:inherit;color:inherit;position:relative}
button.ln{cursor:pointer;min-height:36px;padding-block:6px;touch-action:manipulation}
button.ln:hover{background:#e9eeff}
.ln .no{color:#9aa3c2;text-align:right;padding-right:8px;font-size:.85em;line-height:1.75;user-select:none}
.ln .tx{white-space:pre-wrap;overflow-wrap:anywhere;padding-left:calc(var(--d,0) * 2.1ch + 1.4ch);text-indent:-1.4ch;border-left:0}
.ln .tx{background-image:repeating-linear-gradient(90deg,#d4dbf5 0 1.5px,transparent 1.5px 2.1ch);background-size:calc(var(--d,0) * 2.1ch) 100%;background-repeat:no-repeat}
.ln.cur{background:#ffe88a}
.ln.cur::before{content:"";position:absolute;left:2px;top:50%;border:6px solid transparent;border-left-color:#e8590c;transform:translateY(-50%)}
.ln.cur .no{color:transparent}
.ln.sel{background:#dbe4ff;box-shadow:inset 4px 0 0 var(--ac)}
.ln.no{background:#ffe1da;box-shadow:inset 4px 0 0 #e5484d}
.ln.yes{background:#dff7e8;box-shadow:inset 4px 0 0 var(--good)}
.ln.ask{box-shadow:inset 4px 0 0 #f59e0b;background:#fff4d6}
.ln.lock{color:#5b6485}
.ln.auto{color:#9aa3c2}
.ln.slot{min-height:30px}
.ln.slot .tx{background:none;border:2px dashed #c2cbea;border-radius:8px;min-height:22px;margin-right:4px;padding:0;text-indent:0}
.kw{color:#3b3fd8;font-weight:700}.nm{color:#c2410c}.st{color:#17803d}.fnn{color:#8a2be2}
.plabel{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 4px;font:800 12px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.plabel span{letter-spacing:0;text-transform:none;font-weight:700}
.pool{display:grid;gap:6px;margin:0 0 10px}
.pool button{display:block;width:100%;min-height:42px;padding:8px 10px 8px calc(var(--d,0) * 2.1ch + 12px);border:0;border-radius:12px;background:#fff;cursor:pointer;text-align:left;
  box-shadow:inset 0 0 0 2.5px var(--ink),0 3px 0 rgba(18,26,51,.16);font:500 clamp(12.6px,3.55vw,15px)/1.4 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;touch-action:manipulation}
.pool button:active{transform:translateY(2px)}
.pool .emp{margin:0;color:var(--soft);font:700 14px/1.4 var(--body);text-align:center;padding:6px}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:-4px 0 10px}
.tools button{min-height:42px;border:0;border-radius:12px;background:var(--ac-soft);cursor:pointer;box-shadow:inset 0 0 0 2px var(--ink);font:800 14px/1 var(--body)}
.tools button[disabled]{opacity:.4}

/* atsakymas */
.ansrow{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.ansrow label{font:800 13px/1.2 var(--body);color:var(--soft)}
.ans{flex:1;min-height:50px;padding:6px 12px;border-radius:14px;background:#fff7d6;box-shadow:inset 0 0 0 2.5px var(--ink);font:700 24px/38px var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.ans::after{content:"";display:inline-block;width:2px;height:24px;margin-left:2px;background:var(--ac);vertical-align:-4px;animation:cur 1s steps(2) infinite}
.ans.off::after{display:none}
.ans.bad{background:#ffe1da}.ans.good{background:#dff7e8}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:0 0 10px}
.pad button{min-height:48px;border:0;border-radius:12px;background:#fff;cursor:pointer;box-shadow:inset 0 0 0 2.5px var(--ink),0 3px 0 rgba(18,26,51,.18);font:800 21px/1 var(--kid);touch-action:manipulation}
.pad button:active{transform:translateY(2px);box-shadow:inset 0 0 0 2.5px var(--ink)}
.pad .wide{grid-column:span 6;font:800 15px/1 var(--body);min-height:42px;background:var(--ac-soft)}
.opts{display:grid;gap:8px;margin:0 0 10px}
.opts button{min-height:50px;padding:8px 14px;border:0;border-radius:14px;background:#fff;cursor:pointer;text-align:left;box-shadow:inset 0 0 0 2.5px var(--ink),0 3px 0 rgba(18,26,51,.16);font:700 17px/1.3 var(--mono)}
.opts button.no{background:#ffe1da;opacity:.6;pointer-events:none;text-decoration:line-through}
.opts button.yes{background:#dff7e8}
.opts.off button{pointer-events:none}
.go{width:100%}
.note{margin:0 0 10px;padding:8px 12px;border-radius:12px;background:#fff4d6;box-shadow:inset 0 0 0 2px #f0c45c;font:700 15px/1.45 var(--body)}
.note:empty{display:none}
.note.bad{background:#fff0ec;box-shadow:inset 0 0 0 2px #ff8a7a}

/* vykdymo eiga */
.run{margin:0 0 10px;padding:10px 12px 12px;border-radius:14px;background:#f1f4ff;box-shadow:inset 0 0 0 2px #b9c4ee}
.run h3{margin:0 0 6px;font:800 13px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:#3b4a8a}
.run .say{min-height:44px;margin:0 0 8px;font:700 15px/1.45 var(--body)}
.mem{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;min-height:50px;align-items:flex-start}
.mem small,.scr small{flex-basis:100%;font:800 11px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.mem i{font:700 13px/1.6 var(--body);color:var(--soft);font-style:normal}
.var{display:grid;justify-items:center;min-width:48px;border-radius:10px;overflow:hidden;border:2px solid var(--ink);background:#fff}
.var b{width:100%;padding:1px 8px;background:#ffe9c7;font:700 12.5px/1.5 var(--mono);text-align:center;border-bottom:2px solid var(--ink)}
.var span{padding:2px 8px;font:700 17px/1.4 var(--mono)}
.var.ch{background:#fff3a6}
.var.ch b{background:#ffc94d}
.var.ch span{animation:mkPop .3s}
.scr{margin:0 0 8px}
.scr pre{margin:3px 0 0;min-height:34px;padding:6px 10px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 2px var(--ink);font:700 16px/1.4 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.ctl{display:grid;grid-template-columns:1fr 1.5fr;gap:8px}
.ctl button{min-height:46px;border:0;border-radius:999px;cursor:pointer;font:800 16px/1 var(--kid);background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink),0 3px 0 rgba(18,26,51,.18)}
.ctl button.main{background:var(--ac);color:#fff}
.ctl button[disabled]{opacity:.4;pointer-events:none}
.ctl .cnt{grid-column:span 2;text-align:center;font:700 13px/1.2 var(--body);color:var(--soft)}
.fix{margin:6px 0 0}
.fix .code{margin:4px 0 0}
.mk-why-t .code{margin:6px 0 0}
/* teorija */
.lc2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.lc2 small{display:block;font:800 11px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-bottom:2px}
.lc2 pre{margin:0;padding:8px;border-radius:10px;background:#f6f8ff;box-shadow:inset 0 0 0 2px var(--ink);font:500 12.5px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:480px){.lc2{grid-template-columns:1fr}.card{padding:12px 11px 13px}}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <section id="menu">
    <div class="mk-hero">
      <div class="art" id="heroArt"></div>
      <h1 id="heroH"></h1>
      <p id="heroP"></p>
    </div>
    <div class="col" id="langBox"></div>
    <div class="col" id="col"></div>
    <div id="levels"></div>
    <div id="learn"></div>
  </section>
  <section id="play" hidden>
    <div class="hud"><div id="dots"></div><span class="chip lang" id="langChip"></span><span class="chip" id="ptsChip"><small id="ptsL"></small><span id="pts">0</span></span></div>
    <div id="stage"></div>
  </section>
</div>
<script>
(function(){
"use strict";
const T = window.MK_T, E = window.MK_PA, GAME = "procesoriaus-akimis", GRADES = [8, 9, 10], K = "#121a33";
const $ = id => document.getElementById(id), esc = MK.esc;
const LEVELS = T.levels, LC = { k: "#3b5bdb", p: "#e8590c", c: "#0f9b8e", d: "#8b5cf6", e: "#e5484d", f: "#d9a400" };
let lang = MK.get("mk-" + GAME + "-kalba", "py"); if(lang !== "cpp") lang = "py";

/* ================= programos teksto rodymas ================= */
const KW = { py: /^(if|elif|else|for|in|while|def|return|and|or|not)$/, cpp: /^(int|void|if|else|for|while|return)$/ }, FN = /^(print|range|cout|endl)$/;
function hl(s, L){
  let out = "", last = 0; const re = /("[^"]*")|(\b\d+\b)|([A-Za-z_]\w*)/g; let m;
  while((m = re.exec(s))){
    out += esc(s.slice(last, m.index)); last = re.lastIndex;
    out += m[1] ? `<span class="st">${esc(m[1])}</span>` : m[2] ? `<span class="nm">${m[2]}</span>` : KW[L].test(m[3]) ? `<span class="kw">${m[3]}</span>` : FN.test(m[3]) ? `<span class="fnn">${m[3]}</span>` : m[3];
  }
  return out + esc(s.slice(last));
}
/* rows – E.render rezultatas; o: { tap, cls: { src: klasė }, cur: src, L } */
function listing(rows, o){
  o = o || {}; const L = o.L || lang;
  return rows.map((r, i) => {
    const tap = o.tap && r.src >= 0 && (!o.tapFrom || r.src >= o.tapFrom), cl = ["ln"];
    if(r.src < 0) cl.push("auto"); if(o.cur != null && r.src === o.cur) cl.push("cur"); if(o.cls && r.src >= 0 && o.cls[r.src]) cl.push(o.cls[r.src]);
    const inner = `<span class="no">${i + 1}</span><span class="tx" style="--d:${r.d}">${hl(r.t, L)}</span>`;
    return tap ? `<button type="button" class="${cl.join(" ")}" data-src="${r.src}" aria-label="${T.ui.lineAria(i + 1)}: ${esc(r.t)}">${inner}</button>` : `<div class="${cl.join(" ")}">${inner}</div>`;
  }).join("");
}
const rowNo = (rows, src) => rows.findIndex(r => r.src === src) + 1;

/* ================= vykdymo eiga pažingsniui ================= */
/* host – valdiklių vieta, codeEl – programos tekstas (jame žymima vykdoma eilutė) */
function stepper(host, codeEl, rows, res, o){
  o = o || {}; const n = Math.min(o.max || res.steps.length, res.steps.length); let k = o.at || 0;
  host.innerHTML = `<div class="run fade"><h3>${o.title || T.ui.trace}</h3><p class="say" aria-live="polite"></p><div class="mem"></div><div class="scr"><small>${T.ui.scr}</small><pre></pre></div>
    <div class="ctl"><button type="button" data-a="prev">← ${T.ui.prev}</button><button type="button" class="main" data-a="fwd">${T.ui.fwd} →</button><span class="cnt"></span></div></div>`;
  const say = host.querySelector(".say"), mem = host.querySelector(".mem"), scr = host.querySelector("pre"), cnt = host.querySelector(".cnt"), bp = host.querySelector("[data-a=prev]"), bf = host.querySelector("[data-a=fwd]");
  function draw(){
    const s = k ? res.steps[k - 1] : null;
    codeEl.innerHTML = listing(rows, { cur: s ? s.i : null, cls: o.cls });
    say.innerHTML = s ? T.note(s) + (k === n && o.max && n < res.steps.length ? ` <b>${T.ui.hintEnd}</b>` : "") : T.ui.start;
    const vs = s ? Object.keys(s.vars) : [], ch = s && (s.n.k === "set" || s.n.k === "for") ? s.n.v : null;
    mem.innerHTML = `<small>${s && s.fn ? T.ui.memFn(s.fn) : T.ui.mem}</small>` + (vs.length ? vs.map(v => `<span class="var${v === ch ? " ch" : ""}"><b>${v}</b><span>${s.vars[v]}</span></span>`).join("") : `<i>${T.ui.memEmpty}</i>`);
    scr.textContent = s && s.out.length ? s.out.join("\n") : T.ui.scrEmpty;
    cnt.textContent = k ? T.ui.step(k, n) : ""; bp.disabled = k === 0; bf.disabled = k === n;
  }
  host.onclick = e => { const b = e.target.closest("[data-a]"); if(!b) return; MK.sfx.tap(); k = Math.max(0, Math.min(n, k + (b.dataset.a === "fwd" ? 1 : -1))); draw(); };
  draw();
}

/* ================= piešiniai ================= */
const MF = `font-family="JetBrains Mono,ui-monospace,Menlo,Consolas,monospace" font-weight="700"`;
function heroSvg(){
  const bar = (x, y, w, c) => `<rect x="${x}" y="${y}" width="${w}" height="9" rx="4.5" fill="${c}"/>`;
  const drawer = (y, n, v) => `<rect x="342" y="${y}" width="106" height="38" rx="6" fill="#fff6e3" stroke="${K}" stroke-width="2.6"/><rect x="350" y="${y + 9}" width="30" height="20" rx="4" fill="#ffc94d" stroke="${K}" stroke-width="2"/><text x="365" y="${y + 24}" text-anchor="middle" ${MF} font-size="14" fill="${K}">${n}</text><text x="412" y="${y + 26}" text-anchor="middle" ${MF} font-size="19" fill="${K}">${v}</text><circle cx="438" cy="${y + 19}" r="3.2" fill="${K}"/>`;
  const pin = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="#f2b632" stroke="${K}" stroke-width="2"/>`;
  return `<svg viewBox="0 0 480 240" role="img" aria-label="${T.artAria}">
    <rect width="480" height="240" fill="#eef2ff"/><circle cx="92" cy="40" r="70" fill="#e0e7ff"/><circle cx="420" cy="210" r="80" fill="#e6ecff"/>
    <path d="M0 204h480v36H0z" fill="#d7dffb"/><path d="M0 204h480" stroke="${K}" stroke-width="3"/>
    <!-- programos lapas -->
    <rect x="20" y="24" width="172" height="158" rx="13" fill="#fff" stroke="${K}" stroke-width="3"/><path d="M20 48h172" stroke="${K}" stroke-width="2.4"/>
    <circle cx="36" cy="36" r="4" fill="#ff6b6b"/><circle cx="50" cy="36" r="4" fill="#ffc94d"/><circle cx="64" cy="36" r="4" fill="#51cf66"/>
    ${bar(40, 60, 22, "#3b3fd8")}${bar(68, 60, 12, "#9aa3c2")}${bar(86, 60, 16, "#e8590c")}
    ${bar(40, 79, 22, "#3b3fd8")}${bar(68, 79, 12, "#9aa3c2")}${bar(86, 79, 30, "#e8590c")}
    <rect x="23" y="94" width="166" height="19" fill="#ffe88a"/><path d="M27 97.500l9 6-9 6z" fill="#e8590c" class="blink"/>
    ${bar(40, 99, 30, "#8a2be2")}${bar(76, 99, 40, "#9aa3c2")}${bar(122, 99, 20, "#e8590c")}
    ${bar(56, 119, 26, "#3b3fd8")}${bar(88, 119, 44, "#9aa3c2")}
    ${bar(56, 138, 40, "#17803d")}${bar(102, 138, 18, "#e8590c")}
    ${bar(40, 157, 34, "#8a2be2")}${bar(80, 157, 26, "#9aa3c2")}
    <!-- atminties stalčiai -->
    <rect x="334" y="34" width="122" height="150" rx="10" fill="#e9b872" stroke="${K}" stroke-width="3"/>
    ${drawer(44, "a", 7)}${drawer(90, "b", 12)}${drawer(136, "s", 19)}
    <path d="M346 184v20M444 184v20" stroke="${K}" stroke-width="5" stroke-linecap="round"/>
    <!-- Čipas -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <path d="M244 166v26M286 166v26" stroke="${K}" stroke-width="7"/>
      <path d="M228 198q2-12 16-10 10 2 10 10z" fill="#ff6b6b" stroke="${K}" stroke-width="2.6"/><path d="M276 198q0-8 10-10 14-2 16 10z" fill="#ff6b6b" stroke="${K}" stroke-width="2.6"/>
      <path d="M226 198h30M274 198h30" stroke="#fff" stroke-width="3"/><path d="M226 200h30M274 200h30" stroke="${K}" stroke-width="2.4"/>
      <path d="M226 118Q208 112 197 104" fill="none" stroke="${K}" stroke-width="7"/><circle cx="195" cy="103" r="7.500" fill="#ffd8a8" stroke="${K}" stroke-width="2.6"/>
      <path d="M304 124q14 6 22-8" fill="none" stroke="${K}" stroke-width="7"/><circle cx="327" cy="113" r="7.500" fill="#ffd8a8" stroke="${K}" stroke-width="2.6"/>
      ${pin(216, 96, 10, 9)}${pin(216, 114, 10, 9)}${pin(216, 132, 10, 9)}${pin(216, 150, 10, 9)}
      ${pin(304, 96, 10, 9)}${pin(304, 114, 10, 9)}${pin(304, 132, 10, 9)}${pin(304, 150, 10, 9)}
      ${pin(240, 76, 9, 10)}${pin(260.500, 76, 9, 10)}${pin(281, 76, 9, 10)}
      <rect x="224" y="84" width="82" height="84" rx="12" fill="#3b5bdb" stroke="${K}" stroke-width="3"/>
      <rect x="234" y="94" width="62" height="64" rx="8" fill="#5c7cfa" stroke="${K}" stroke-width="2.4"/>
      <circle cx="251" cy="118" r="9" fill="#fff" stroke="${K}" stroke-width="2.2"/><circle cx="279" cy="118" r="9" fill="#fff" stroke="${K}" stroke-width="2.2"/>

    b = t.closest("#pool [data-id]"); if(b){ if(placed.length >= cur.need) return note("bad", T.ui.need(placed.length, cur.need)); MK.sfx.tap(); placed.push(+b.dataset.id); sel = -1; note("", ""); return drawPars(); }
    b = t.closest("#code [data-src]"); if(b){ MK.sfx.tap(); const i = +b.dataset.src - cur.lock; sel = sel === i ? -1 : i; return drawPars(); }
    b = t.closest("[data-t]"); if(b && sel >= 0){ MK.sfx.tap(); const a = b.dataset.t, j = a === "up" ? sel - 1 : sel + 1;
      if(a === "rm"){ placed.splice(sel, 1); sel = -1; } else if(j >= 0 && j < placed.length){ [placed[sel], placed[j]] = [placed[j], placed[sel]]; sel = j; }
      note("", ""); return drawPars(); }
  } else if(cur.kind !== "trace"){
    b = t.closest("#code [data-src]"); if(b){ MK.sfx.tap(); sel = +b.dataset.src; drawCode(); $("chk").disabled = false; note("", ""); }
  }
});
document.addEventListener("keydown", e => {
  if(play.hidden || !cur || e.ctrlKey || e.metaKey || e.altKey) return;
  if(/^\d$/.test(e.key)) key(e.key); else if(e.key === "-") key("-"); else if(e.key === " "){ if(cur.kind === "trace" && cur.type === "seq" && !locked){ e.preventDefault(); key(" "); } }
  else if(e.key === "Backspace") key("del");
  else if(e.key === "Enter"){ const c = $("next") || $("chk"); if(c && !c.disabled && !c.hidden && document.activeElement.tagName !== "BUTTON") c.click(); }
});
window.__mk = { E, T, get cur(){ return cur; }, get lang(){ return lang; } };
showMenu();
})();
