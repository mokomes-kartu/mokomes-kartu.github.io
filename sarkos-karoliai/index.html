<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MokomėsKartu">
<link rel="apple-touch-icon" href="/logo/mk-ikona-180.png">
<title>Šarkos karoliai – MokomėsKartu.lt</title>
<meta name="description" content="1 klasės matematikos žaidimas apie dėsningumus: pratęsk karolių vėrinį, surask trūkstamą karoliuką, pasikartojančią grupę, suverk pagal taisyklę ir sukurk savo vėrinį.">
<meta name="theme-color" content="#fff9e6">
<link rel="icon" href="/logo/mk-ikona.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800&family=Manrope:wght@600;700;800&display=swap">
<script src="/bendra/mk.js"></script>
<script src="/sarkos-karoliai/tekstai.lt.js"></script>
<style>
/* Meniu: šarka ant šakos, lobis (karoliukų formos), mano vėriniai, lygiai.
   Užduotis: pelėdžiuko klausimas, šaka su vėriniu, taisyklės kortelė / variantai, karoliukų padėklas, mygtukas „Toliau“. */
body{--ac:#1f7a8c;--ac-ink:#fff;--ac-soft:#d6f0f3}
@media (max-width:380px){.mk-title{font-size:17px}}
.mk-hero{padding-top:0}
.mk-hero h1{margin-top:8px;font-size:clamp(34px,8.6vw,54px)}
.mk-hero p{max-width:40ch;font-size:16.5px}
.art{width:min(100%,480px);border-radius:24px;overflow:hidden;position:relative;box-shadow:0 6px 0 rgba(18,26,51,.15);background:#dff3fb}
.art svg{display:block;width:100%;height:auto}
.art::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 3px var(--ink);pointer-events:none}
.col{width:100%;max-width:520px;margin:0 auto 14px;padding:12px 14px 14px;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 2.5px var(--ink),0 5px 0 rgba(18,26,51,.14)}
.col h2{margin:0;font:800 19px/1.2 var(--kid)}
.col p{margin:4px 0 10px;color:var(--soft);font-weight:700;font-size:14.5px}
.shelf{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
@media (max-width:460px){.shelf{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}}
.gd{position:relative;border-radius:12px;background:#f1fbfc;box-shadow:inset 0 0 0 2px var(--ink);padding:3px;aspect-ratio:1;display:grid;place-items:center}
.gd svg{display:block;width:100%;height:auto}
.gd.off{background:#f3efe2;box-shadow:inset 0 0 0 2px #cfc4a2}
.gd.off svg{opacity:.2;filter:grayscale(1)}
.gd.off small{position:absolute;inset:auto 0 3px 0;text-align:center;font:800 10.5px/1 var(--body);color:var(--soft)}
.gd.new{animation:mkPop .6s cubic-bezier(.2,1.6,.4,1)}
.gal{display:grid;gap:6px}
.gal .row{justify-content:flex-start}
.gal .row svg{width:24px;height:24px}

.hud{display:flex;align-items:center;gap:8px;margin:0 0 8px;min-height:36px}
.hud .mk-dots{margin-right:auto;justify-content:flex-start}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink);font:800 17px/36px var(--kid);white-space:nowrap}
.chip small{font:800 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.chip.pop{animation:mkPop .35s cubic-bezier(.2,1.6,.4,1)}
.wrap{width:100%;max-width:520px;margin:0 auto}
.wrap .mk-guide{margin-bottom:8px}
.wrap .mk-bubble{font-size:17.5px}
.art.scn{margin:0 auto 10px;width:100%;max-width:520px}
.fade{animation:mkFade .3s}

/* vėrinys */
.bd-in{transform-box:fill-box;transform-origin:center}
.b-drop .bd-in{animation:bDrop .45s cubic-bezier(.2,1.5,.4,1)}
.b-ping .bd-in{animation:bPing .3s}
.slot-cur{transform-box:fill-box;transform-origin:center;animation:mkPulse 1s infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:mkPulse .9s infinite}
.bird{transform-box:fill-box;transform-origin:50% 100%}
.bird.joy{animation:mkHop .5s cubic-bezier(.3,1.6,.5,1) 2}
@keyframes bDrop{from{transform:translateY(-26px) scale(.5);opacity:0}}
@keyframes bPing{50%{transform:scale(1.28)}}

/* taisyklės kortelė */
.rule{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 10px;margin:0 0 10px;padding:8px 12px;border-radius:18px;background:#fff8d9;box-shadow:inset 0 0 0 2.5px var(--ink)}
.rule>b{font:800 16px/1 var(--kid)}
.rule>small{font:800 13px/1.2 var(--body);color:var(--soft)}
.row{display:inline-flex;align-items:center;justify-content:center;gap:2px;vertical-align:middle}
.row svg{width:34px;height:34px;display:block;flex:none}
.row.sm svg{width:26px;height:26px}
.row i{font:800 20px/1 var(--kid);font-style:normal;margin:0 1px 0 6px}
.row i:first-child{margin-left:0}
.row em{font:800 14px/1 var(--body);font-style:normal;color:var(--soft);margin:0 4px}
.rep{width:24px;height:24px;flex:none}

/* padėklas ir variantai */
.box{position:relative;margin:4px 0 10px;padding:18px 8px 10px;border-radius:18px;background:#f4e2c4;box-shadow:inset 0 0 0 2.5px var(--ink),inset 0 -6px 0 #dcc194}
.box h3{position:absolute;left:12px;top:-9px;margin:0;padding:1px 10px;border-radius:999px;background:var(--ink);color:#fff;font:800 12.5px/1.5 var(--body)}
.tray{display:flex;justify-content:center;gap:10px}
.bd{width:64px;height:64px;flex:none;border:0;border-radius:18px;background:#fff;padding:6px;cursor:pointer;touch-action:manipulation;
  box-shadow:inset 0 0 0 2.5px var(--ink),0 5px 0 rgba(18,26,51,.22);transition:transform .1s,box-shadow .1s}
.bd svg{display:block;width:100%;height:100%}
.bd:active{transform:translateY(4px);box-shadow:inset 0 0 0 2.5px var(--ink),0 1px 0 rgba(18,26,51,.22)}
.bd.no,.bd[disabled]{opacity:.32;cursor:default;box-shadow:inset 0 0 0 2.5px #9a947e}
@media (max-width:350px){.bd{width:58px;height:58px}.tray{gap:7px}}
.opts{display:grid;gap:8px}
.opts.u{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{min-height:62px;border:0;border-radius:16px;background:#fff;padding:8px 4px;cursor:pointer;touch-action:manipulation;display:grid;place-items:center;
  box-shadow:inset 0 0 0 2.5px var(--ink),0 5px 0 rgba(18,26,51,.22);transition:transform .1s}
.opt:active{transform:translateY(3px)}
.opt.ok{background:#e3f9ec;box-shadow:inset 0 0 0 3.5px var(--good),0 5px 0 rgba(18,26,51,.12)}
.opt.no{opacity:.4;box-shadow:inset 0 0 0 2.5px #9a947e}
.opt[disabled]{cursor:default}
.opts.u .row svg{width:clamp(22px,7.6vw,34px);height:clamp(22px,7.6vw,34px)}
.opts.p .row svg{width:clamp(30px,10.5vw,44px);height:clamp(30px,10.5vw,44px)}
.acts{display:flex;justify-content:center;gap:10px;margin-top:10px}
.sbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 16px;border:0;border-radius:999px;background:#fff;cursor:pointer;
  font:800 16px/1 var(--kid);box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.2);touch-action:manipulation}
.sbtn svg{width:20px;height:20px}
.sbtn:active{transform:translateY(3px)}
.sbtn[disabled]{opacity:.4;pointer-events:none}
.tools{display:flex;justify-content:flex-end;margin:-4px 0 8px}
#flow{display:grid;margin-top:4px}
#flow .mk-btn{width:100%}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <section id="menu">
    <div class="mk-hero">
      <div class="art" id="heroArt"></div>
      <h1 id="heroH"></h1>
      <p id="heroP"></p>
    </div>
    <div id="levels"></div>
    <div class="col" id="col" style="margin-top:16px"></div>
    <div class="col" id="gal"></div>
  </section>
  <section id="play" hidden>
    <div class="hud"><div id="dots"></div><span class="chip" id="bChip"><small id="bL"></small><span id="bN">0</span></span></div>
    <div class="wrap" id="stage"></div>
  </section>
</div>
<script>
(function(){
"use strict";
const T = window.MK_T, GAME = "sarkos-karoliai", GRADES = [1];
const R = MK.rnd, P = MK.pick, SH = MK.shuffle, $ = id => document.getElementById(id);
const K = "#121a33";

/* ================= karoliukai ================= */
const COL = { r: "#ef4056", y: "#ffc928", b: "#2f8fe8", g: "#3fbf6b", v: "#9a5be0" }, CK = Object.keys(COL);
const star = (() => { let d = ""; for(let i = 0; i < 10; i++){ const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 7.6 : 16.5; d += (i ? "L" : "M") + (r * Math.cos(a)).toFixed(1) + " " + (r * Math.sin(a) + 1).toFixed(1); } return d + "Z"; })();
const SHP = {
  ci: f => `<circle r="14.5" fill="${f}"/>`,
  sq: f => `<rect x="-13" y="-13" width="26" height="26" rx="5.5" fill="${f}"/>`,
  tr: f => `<path d="M0-15.5 15.5 12H-15.5Z" fill="${f}"/>`,
  he: f => `<path d="M0 14C-19 1-16-14-7-13.5-3-13.3 0-10 0-7.5 0-10 3-13.3 7-13.5 16-14 19 1 0 14Z" fill="${f}"/>`,
  st: f => `<path d="${star}" fill="${f}"/>`,
  fl: f => [0, 1, 2, 3, 4].map(i => { const a = -Math.PI / 2 + i * 2 * Math.PI / 5; return `<circle cx="${(9 * Math.cos(a)).toFixed(1)}" cy="${(9 * Math.sin(a)).toFixed(1)}" r="6.8" fill="${f}"/>`; }).join("") + `<circle r="5.6" fill="#fff6c4"/>`,
  dr: f => `<path d="M0-16.5C7-6 13 0 13 6A13 13 0 0 1-13 6C-13 0-7-6 0-16.5Z" fill="${f}"/>`,
  mo: f => `<path d="M6-13.7A15 15 0 1 0 6 13.7 14 14 0 0 1 6-13.7Z" fill="${f}"/>`,
  di: f => `<path d="M0-16.5 13 0 0 16.5-13 0Z" fill="${f}"/>`
};
const SHK = Object.keys(SHP), NEED = [0, 0, 0, 4, 9, 15, 22, 30, 40];   /* kiek vėrinių be klaidų reikia formai atrakinti */
const GLOSS = { mo: [-9.5, -6], tr: [-3, -3], st: [-3, -4], he: [-7, -6], dr: [-4.5, 2], di: [-4, -5], fl: [-2, -10] };
function bead(b){
  const g = GLOSS[b.s] || [-5.5, -6];
  return `<g${b.z ? ' transform="scale(.6)"' : ""} stroke="${K}" stroke-width="${b.z ? 3 : 2}" stroke-linejoin="round">${SHP[b.s](COL[b.c])}<ellipse cx="${g[0]}" cy="${g[1]}" rx="3.6" ry="2.2" fill="#fff" opacity=".65" stroke="none" transform="rotate(-35 ${g[0]} ${g[1]})"/></g>`;
}
const key = b => b.s + b.c + (b.z ? 1 : 0), same = (a, b) => key(a) === key(b);
const unkey = k => ({ s: k.slice(0, 2), c: k[2], z: +k[3] });
function bname(b){ const s = T.shapes[b.s]; return (b.z ? T.small[s[1]] + " " : "") + T.colors[b.c][s[1]] + " " + s[0]; }
const bsvg = b => `<svg viewBox="-19 -19 38 38" role="img" aria-label="${bname(b)}">${bead(b)}</svg>`;
const row = (bs, cls) => `<span class="row ${cls || ""}">${bs.map(bsvg).join("")}</span>`;

/* ================= piešiniai: šarka, šaka, vėrinys ================= */
const S2 = `stroke="${K}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"`;
const BIRD = `
  <path d="M50 92 16 127 31 129 64 102Z" fill="#1d4f91" ${S2}/>
  <path d="M40 104 24 121" stroke="#7fb2ee" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  <path d="M51 106v14M69 106v14" stroke="#4a4f63" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M44 123q6.5-6 13 0M63 123q6.5-6 13 0" fill="none" stroke="#4a4f63" stroke-width="4.5" stroke-linecap="round"/>
  <ellipse cx="60" cy="80" rx="27" ry="31" fill="#262b40" ${S2}/>
  <ellipse cx="60" cy="89" rx="17.5" ry="20" fill="#fff"/>
  <path d="M35 64Q20 84 33 106 45 92 43 70Z" fill="#2466c2" ${S2}/>
  <path d="M85 64Q100 84 87 106 75 92 77 70Z" fill="#2466c2" ${S2}/>
  <path d="M36 70q-5 8-4 17M84 70q5 8 4 17" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M55 17q3-9 6-1 4-8 5 2" fill="#262b40" ${S2}/>
  <circle cx="60" cy="38" r="23" fill="#262b40" ${S2}/>
  <circle cx="50" cy="36" r="7.5" fill="#fff"/><circle cx="70" cy="36" r="7.5" fill="#fff"/>
  <circle cx="51.5" cy="37" r="3.9" fill="${K}"/><circle cx="68.5" cy="37" r="3.9" fill="${K}"/>
  <circle cx="53" cy="35.4" r="1.4" fill="#fff"/><circle cx="70" cy="35.4" r="1.4" fill="#fff"/>
  <path d="M53.5 45h13L60 56Z" fill="#b9c2da" ${S2}/>
  <circle cx="41" cy="46" r="4" fill="#ff8aa0" opacity=".6"/><circle cx="79" cy="46" r="4" fill="#ff8aa0" opacity=".6"/>
  <path d="M40 59Q60 76 80 59" fill="none" stroke="#8a5a33" stroke-width="1.6"/>
  ${[[44, 62.5, "r"], [51.5, 66.3, "y"], [60, 67.6, "b"], [68.5, 66.3, "y"], [76, 62.5, "r"]].map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3.6" fill="${COL[p[2]]}" stroke="${K}" stroke-width="1.3"/>`).join("")}`;
const leaf = (x, y, r, s) => `<path d="M0 0Q9-12 22-4 12 8 0 0Z" fill="#6cc24a" ${S2} stroke-width="2" transform="translate(${x} ${y}) rotate(${r}) scale(${s || 1})"/>`;
const AY = 64, SAG = 56, HX = 166;   /* vėrinio kabinimo aukštis, įlinkis, pusplotis */
const pos = (i, n) => { const st = Math.min(36, 300 / Math.max(1, n - 1)), x = 180 + (i - (n - 1) / 2) * st, u = (x - 180) / HX; return [x, AY + SAG * (1 - u * u)]; };

/* o: { beads:[karoliukas|null], cur, p (grupės ilgis juostoms), bands, ring, drop, hero, joy } */
function scene(o){
  const n = o.beads.length, pts = o.beads.map((_, i) => pos(i, n)), s = o.hero ? .8 : .62;
  let bands = "";
  if(o.bands && o.p) for(let g = 0; g * o.p < n; g++){
    const seg = pts.slice(g * o.p, g * o.p + o.p);
    bands += `<polyline points="${seg.map(p => p.join(",")).join(" ") + (seg.length === 1 ? " " + (seg[0][0] + .1) + "," + seg[0][1] : "")}" fill="none" stroke="${g % 2 ? "#ffc4d6" : "#ffe27a"}" stroke-width="37" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  const items = o.beads.map((b, i) => {
    const [x, y] = pts[i];
    if(!b) return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><g class="${i === o.cur ? "slot-cur" : ""}"><circle r="12.5" fill="#fff" fill-opacity=".85" stroke="${K}" stroke-width="2" stroke-dasharray="4 4"/>${i === o.cur ? `<text y="6" text-anchor="middle" font-family="Grandstander,Comic Sans MS,sans-serif" font-weight="800" font-size="17" fill="${K}">?</text>` : ""}</g></g>`;
    return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})" data-i="${i}" class="${i === o.drop ? "b-drop" : ""}"><g class="bd-in">${bead(b)}</g>${i === o.ring ? `<circle class="ring" r="19.5" fill="none" stroke="#ff7a1a" stroke-width="3.5" stroke-dasharray="6 5"/>` : ""}</g>`;
  }).join("");
  const label = o.beads.map(b => b ? bname(b) : T.blank).join(", ");
  return `<svg viewBox="${o.hero ? "0 -52 360 202" : "14 -26 332 172"}" role="img" aria-label="${(o.hero ? T.heroAria : T.sceneAria) + ": " + label}">
    <rect x="0" y="-52" width="360" height="202" fill="#dff3fb"/>
    <circle cx="44" cy="${o.hero ? -8 : 8}" r="17" fill="#ffe27a" opacity=".9"/>
    <path d="M96 ${o.hero ? -14 : 12}q8-11 20-5 12-7 20 5z" fill="#fff" opacity=".9"/>
    <path d="M196 ${o.hero ? -30 : 2}q7-9 17-4 10-6 17 4z" fill="#fff" opacity=".75"/>
    ${bands}
    <path d="M14 ${AY - 6}Q180 ${AY + 2 * SAG} 346 ${AY - 6}" fill="none" stroke="#8a5a33" stroke-width="2.2"/>
    ${leaf(64, 50, -160)}${leaf(118, 50, -25, .9)}${leaf(232, 51, -150, .85)}${leaf(20, 52, -30, .8)}
    <path d="M-6 58Q90 50 180 55T366 54" fill="none" stroke="${K}" stroke-width="15" stroke-linecap="round"/>
    <path d="M-6 58Q90 50 180 55T366 54" fill="none" stroke="#9a6a3c" stroke-width="10.5" stroke-linecap="round"/>
    <path d="M30 55q40-4 80-2M210 54q50 2 90 0" fill="none" stroke="#c08c55" stroke-width="2.4" stroke-linecap="round"/>
    <g transform="translate(${(306 - 60 * s).toFixed(1)} ${(50 - 122 * s).toFixed(1)}) scale(${s})"><g class="bird${o.joy ? " joy" : ""}">${BIRD}</g></g>
    ${items}
    ${o.tag ? `<g transform="translate(180 ${AY + 22})"><rect x="-44" y="-12" width="88" height="24" rx="12" fill="${K}"/><text y="5" text-anchor="middle" font-family="Manrope,system-ui,sans-serif" font-weight="800" font-size="13.5" fill="#fff">${o.tag}</text></g>` : ""}
  </svg>`;
}

/* ================= garsas: vėrinys „dainuoja“ ================= */
let actx = null;
function note(i, len){
  if(MK.get("mk-garsas", {}).sfx === false) return;
  try{
    const C = window.AudioContext || window.webkitAudioContext; if(!C) return;
    actx = actx || new C(); if(actx.state === "suspended") actx.resume();
    const t = actx.currentTime + .01, o = actx.createOscillator(), g = actx.createGain(), f = [523.25, 659.25, 783.99, 392][i] || 440;
    o.type = "triangle"; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.16, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + (len || .28));
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + (len || .28) + .05);
  }catch(e){}
}
let singId = 0;
function sing(tones){
  const id = ++singId; let i = 0;
  (function step(){
    if(id !== singId || i >= tones.length) return;
    const el = document.querySelector(`#scn [data-i="${i}"]`);
    if(el && tones[i] != null){ note(tones[i]); el.classList.remove("b-ping"); void el.getBoundingClientRect(); el.classList.add("b-ping"); }
    i++; setTimeout(step, 330);
  })();
}

/* ================= užduočių kūrimas ================= */
const UNITS = { AB: [0, 1], AAB: [0, 0, 1], ABB: [0, 1, 1], ABA: [0, 1, 0], ABC: [0, 1, 2] };
/* klaidinančios grupės variantams (ne tos pačios grupės „pasukimai“) */
const ALT = { AB: [[0, 0, 1], [0, 1, 1], [0, 1, 0]], AAB: [[0, 1], [0, 1, 1]], ABB: [[0, 1], [0, 0, 1], [0, 1, 0]], ABA: [[0, 1], [0, 1, 1]], ABC: [[0, 1], [0, 2, 1], [1, 0, 2]] };
const KEYL = "mk-" + GAME + "-lobis", KEYG = "mk-" + GAME + "-veriniai";
const lobis = () => MK.get(KEYL, 0) | 0;
const pool = n => SHK.filter((_, i) => NEED[i] <= (n == null ? lobis() : n));
function colors(n){ let c; do{ c = SH(CK).slice(0, n); }while(c.includes("r") && c.includes("g")); return c; }   /* raudonos ir žalios kartu neimame */

/* k skirtingų karoliukų + klaidinantys; mode: color | shape | size | both | trick */
function mkTypes(k, mode){
  const sh = SH(pool()); let ty, dis;
  if(mode === "size" && k === 2){ const c = colors(2), s = sh[0]; ty = [{ s, c: c[0], z: 0 }, { s, c: c[0], z: 1 }]; dis = SH([{ s, c: c[1], z: 0 }, { s, c: c[1], z: 1 }]); }
  else if(mode === "trick" && k === 3){ const c = colors(2); ty = [{ s: sh[0], c: c[0], z: 0 }, { s: sh[0], c: c[1], z: 0 }, { s: sh[1], c: c[0], z: 0 }]; dis = [{ s: sh[1], c: c[1], z: 0 }]; }
  else if(mode === "shape"){ const c = colors(2); ty = sh.slice(0, k).map(s => ({ s, c: c[0], z: 0 })); dis = sh.slice(k, k + 2).map(s => ({ s, c: c[0], z: 0 })); dis.push({ s: sh[0], c: c[1], z: 0 }, { s: sh[1], c: c[1], z: 0 }); }
  else if(mode === "both"){ const c = colors(k); ty = c.map((x, i) => ({ s: sh[i], c: x, z: 0 })); dis = SH([{ s: sh[0], c: c[1], z: 0 }, { s: sh[1], c: c[0], z: 0 }]); }

/* Ar tuščias vietas galima užpildyti tik vienu būdu, kai kartojasi 1, 2 arba 3 karoliukų grupė? Grąžina užpildytą seką arba null. */

const eq = (a, b) => a.join("") === b.join("");

  mini(`<path d="M4 28h48" stroke="#8a5a33" stroke-width="2"/>${mb("sq", "y", 10, 28)}${hole(28, 28)}${mb("sq", "y", 46, 28)}<text x="28" y="33" text-anchor="middle" font-family="Grandstander,sans-serif" font-weight="800" font-size="13" fill="${K}">?</text>`),

/* ================= meniu, lobis, mano vėriniai ================= */

app.prepend(MK.top({ title: T.title, grade: GRADES.includes(saved) ? saved : GRADES[0] }));

/* ================= žaidimas ================= */
let L = 0, tasks = [], ti = 0, cur = null, okN = 0, dots = null, seq = [], bi = 0, miss = 0, slotMiss = 0, hint = 0, locked = false, lobis0 = 0, ringAt = -1;

const say = (h, mood) => MK.say($("guide"), h, mood);

const REP = `<svg class="rep" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.2-5.1" fill="none" stroke="${K}" stroke-width="2.6" stroke-linecap="round"/><path d="M17.5 2.5v5h-5" fill="none" stroke="${K}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

}
function finish(){

}
window.__mk = { LV, solve, judge, minPeriod, unique, UNITS, ALT, key, same, pool, NEED, SHK, genExt, genGap, genUnit, genPick, genRule, genMake,
  get cur(){ return cur; }, get seq(){ return seq; }, get bi(){ return bi; }, get locked(){ return locked; } };
showMenu();
})();
