<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MokomėsKartu">
<link rel="apple-touch-icon" href="/logo/mk-ikona-180.png">
<title>Trajektorijų laboratorija – MokomėsKartu.lt</title>
<meta name="description" content="11–12 klasės fizikos žaidimas (kinematika, VBE kartojimas): tolygiai kintamas judėjimas, greičio grafikai, laisvasis kritimas, horizontaliai ir kampu į horizontą mestas kūnas. Pirma apskaičiuok, tada paleisk bandymą.">
<meta name="theme-color" content="#fff9e6">
<link rel="icon" href="/logo/mk-ikona.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800&family=Manrope:wght@600;700;800&display=swap">
<script src="/bendra/mk.js"></script>
<script src="/trajektoriju-laboratorija/tekstai.lt.js"></script>
<style>
/* Meniu: poligono piešinys, bandymų žurnalas (ženkleliai), lygiai, „Noriu pasimokyti“.
   Užduotys: „nustatyk ir paleisk“ (parametras − / +, bandymo animacija, 3 bandymai) ir pasirinkimo (4 variantai, po atsakymo – animacija). */
body{--ac:#3b5bdb;--ac-ink:#fff;--ac-soft:#e1e8ff}
.mk-title{font-size:clamp(15px,4.2vw,24px)}
@media (max-width:520px){.mk-title{white-space:normal;font-size:15px;line-height:1.08;text-wrap:balance}}
.mk-hero{padding-top:0}
.mk-hero h1{margin-top:8px;font-size:clamp(30px,8vw,52px)}
.mk-hero p{max-width:46ch;font-size:16px}
.art{width:min(100%,480px);border-radius:24px;overflow:hidden;position:relative;box-shadow:0 6px 0 rgba(18,26,51,.15);background:#dff1fb}
.art svg{display:block;width:100%;height:auto}
.art::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 3px var(--ink);pointer-events:none}
.col{width:100%;max-width:520px;margin:0 auto 14px;padding:12px 14px 14px;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 2.5px var(--ink),0 5px 0 rgba(18,26,51,.14)}
.col h2{margin:0;font:800 18px/1.2 var(--kid)}
.col p{margin:4px 0 10px;color:var(--soft);font-weight:700;font-size:14.5px}
.bds{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.bd{text-align:center}
.bd svg{display:block;width:78%;margin:0 auto;height:auto}
.bd small{display:block;font:800 9.5px/1.15 var(--body);color:var(--soft);min-height:22px}
.bd.off svg{opacity:.25;filter:grayscale(1)}
.bd.new svg{animation:mkPop .6s cubic-bezier(.2,1.6,.4,1)}
.mk-lvl-t b{font-size:19px}

.hud{display:flex;align-items:center;gap:8px;margin:0 0 8px;min-height:36px}
.hud .mk-dots{margin-right:auto;justify-content:flex-start}
.chip{display:inline-flex;align-items:baseline;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink);font:800 17px/36px var(--kid);white-space:nowrap}
.chip small{font:800 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.chip.pop{animation:mkPop .35s cubic-bezier(.2,1.6,.4,1)}
.card{width:100%;max-width:560px;margin:0 auto 10px;padding:12px 14px 14px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.12)}
.txt{margin:0 0 6px;font:700 16px/1.5 var(--body)}
.txt small{display:block;color:var(--soft);font-size:13.5px;font-weight:700}
.ex{display:inline-block;padding:1px 10px;border-radius:9px;background:var(--ac-soft);font:800 17px/1.5 var(--body);white-space:nowrap}
.gn{margin:0 0 8px;color:var(--soft);font:700 13.5px/1.4 var(--body)}
.sim{margin:0 auto 10px;border-radius:14px;overflow:hidden;box-shadow:0 0 0 2.5px var(--ink);background:#eaf6fd;max-width:520px}
.sim svg{display:block;width:100%;height:auto}
.ctl{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;gap:8px;align-items:center;margin:0 0 8px}
.ctl button{height:52px;border:0;border-radius:14px;background:#fff;cursor:pointer;font:800 28px/1 var(--kid);box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.16);touch-action:manipulation}
.ctl button:active{transform:translateY(3px)}
.ctl button[disabled]{opacity:.35;pointer-events:none}
.ctl output{display:block;text-align:center;padding:5px 6px;border-radius:14px;background:var(--ac-soft);font:800 22px/1.15 var(--kid)}
.ctl output small{display:block;font:800 11.5px/1.2 var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}
.note{margin:0 0 8px;min-height:22px;font:700 15px/1.45 var(--body)}
.note.ok{color:#177245}.note.bad{color:#b3261e}
.note i{font-style:normal;color:var(--ink);display:block}
.row{display:flex;align-items:center;gap:10px}
.row .mk-btn{flex:1}
.row span{font:800 13px/1.2 var(--body);color:var(--soft);white-space:nowrap}
.ans{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.ans.one{grid-template-columns:1fr}
.a{min-height:52px;padding:8px 10px;border:0;border-radius:14px;background:#fff;cursor:pointer;text-align:center;font:800 17.5px/1.25 var(--body);color:var(--ink);
  box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.16);transition:transform .1s;touch-action:manipulation}
.a:active{transform:translateY(3px)}
.a.ok{background:#d9f7e6;box-shadow:inset 0 0 0 3px var(--good),0 4px 0 rgba(18,26,51,.1)}
.a.no{background:#ffe6df;box-shadow:inset 0 0 0 3px var(--bad);opacity:.75}
.a[disabled]{pointer-events:none}
.go{width:100%}
.mk-why{max-width:560px;margin-inline:auto}
.mk-why sub,.txt sub,.mk-lt sub,.note sub{font-size:.7em}
.fade{animation:mkIn .35s backwards}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <section id="menu">
    <div class="mk-hero">
      <div class="art" id="heroArt"></div>
      <h1 id="heroH"></h1>
      <p id="heroP"></p>
    </div>
    <div class="col" id="col"></div>
    <div id="levels"></div>
    <div id="learn"></div>
  </section>
  <section id="play" hidden>
    <div class="hud"><div id="dots"></div><span class="chip" id="ptsChip"><small id="ptsL"></small><span id="pts">0</span></span></div>
    <div id="stage"></div>
  </section>
</div>
<script>
(function(){
"use strict";
const T = window.MK_T, GAME = "trajektoriju-laboratorija", GRADES = [11, 12], nf = T.nf;
const R = MK.rnd, P = MK.pick, SH = MK.shuffle, $ = id => document.getElementById(id);
const K = "#121a33", S = `stroke="${K}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"`;
const U = (x, u) => nf(x) + " " + u, r1 = x => Math.round(x * 10) / 10;
const FT = `font-family="Manrope,Arial,sans-serif" font-weight="800"`;

/* ================= bandymo schema ================= */
const PL = { l: 34, r: 332, t: 14, b: 186 };
function geo(sp){ const k = Math.min((PL.r - PL.l) / sp.W, (PL.b - PL.t) / sp.H), ox = sp.xc ? (PL.l + PL.r) / 2 : PL.l; return { k, X: x => ox + x * k, Y: y => PL.b - y * k }; }
const posAt = (sp, t) => ({ x: sp.x0 + sp.vx * t + (sp.ax || 0) * t * t / 2, y: sp.y0 + sp.vy * t - sp.g * t * t / 2 });
const flight = sp => sp.T != null ? sp.T : (sp.vy + Math.sqrt(sp.vy * sp.vy + 2 * sp.g * sp.y0)) / sp.g;
function droneSvg(x, y){ return `<g transform="translate(${r1(x)} ${r1(y)})"><path d="M-13-13h26M-9-13v5M9-13v5" ${S} stroke-width="1.6"/><ellipse cx="-13" cy="-14" rx="7" ry="1.8" fill="#9aa3b5"/><ellipse cx="13" cy="-14" rx="7" ry="1.8" fill="#9aa3b5"/><rect x="-10" y="-9" width="20" height="7" rx="3.5" fill="#3b5bdb" ${S} stroke-width="1.6"/></g>`; }
function bodySvg(b, x, y){
  x = r1(x); y = r1(y);
  if(b === "cart") return `<g transform="translate(${x} ${y})"><rect x="-11" y="-13" width="22" height="9" rx="2.5" fill="#ff8a1f" ${S} stroke-width="1.6"/><circle cx="-6" cy="-3" r="3" fill="${K}"/><circle cx="6" cy="-3" r="3" fill="${K}"/></g>`;
  if(b === "box") return `<g transform="translate(${x} ${y})"><rect x="-5.5" y="-5.5" width="11" height="11" rx="1.5" fill="#c98d4b" ${S} stroke-width="1.6"/><path d="M-5.5 0h11M0-5.5v11" stroke="${K}" stroke-width="1.2"/></g>`;
  return `<circle cx="${x}" cy="${y}" r="5.5" fill="#ff8a1f" ${S} stroke-width="1.6"/>`;
}
function simSvg(sp, ghosts){
  const g = geo(sp), M = Math.max(sp.W, sp.H), st = [1, 2, 5, 10, 20, 25, 50, 100, 200].find(s => M / s <= 7) || 500;
  let grid = "", lab = "";
  const xa = sp.xc ? -Math.floor(sp.W / 2 / st) * st : 0, xb = sp.xc ? -xa : sp.W;
  for(let x = xa; x <= xb + 1e-9; x += st){ const X = r1(g.X(x)); if(X > PL.r + 1) break; grid += `<path d="M${X} ${PL.t}V${PL.b}"/>`; if(!sp.xc && X < 316) lab += `<text x="${X}" y="200" text-anchor="middle">${x}</text>`; }
  for(let y = 0; y <= sp.H + 1e-9; y += st){ const Y = r1(g.Y(y)); if(Y < PL.t - 1) break; grid += `<path d="M${PL.l} ${Y}H${PL.r}"/>`; if(y > 0) lab += `<text x="${PL.l - 5}" y="${Y + 4}" text-anchor="end">${y}</text>`; }
  let tg = "";
  if(sp.target){ const tx = r1(g.X(sp.target.x)), ty = r1(g.Y(sp.target.y || 0));
    if(sp.target.type === "gate") tg = `<path d="M${tx} ${PL.b}v-30" stroke="${K}" stroke-width="2.4"/><path d="M${tx} ${PL.b - 30}h14l-4 5 4 5h-14z" fill="#e5243b" ${S} stroke-width="1.6"/>`;
    else if(sp.target.type === "ring") tg = `<path d="M${tx + 16} ${ty}h14" stroke="${K}" stroke-width="2.4"/><ellipse cx="${tx}" cy="${ty}" rx="16" ry="4.5" fill="none" stroke="#e5243b" stroke-width="3.2"/>`;
    else tg = `<ellipse cx="${tx}" cy="${PL.b}" rx="13" ry="4.5" fill="#fff" ${S} stroke-width="1.6"/><ellipse cx="${tx}" cy="${PL.b}" rx="8" ry="2.8" fill="#e5243b"/><ellipse cx="${tx}" cy="${PL.b}" rx="3" ry="1.1" fill="#fff"/>`; }
  let ln = "";
  if(sp.launcher === "machine"){ const a = sp.ang || 45; ln = `<g transform="translate(${g.X(0)} ${PL.b})"><g transform="rotate(${-a})"><rect x="-3" y="-4.5" width="24" height="9" rx="3" fill="#3b5bdb" ${S} stroke-width="1.6"/></g><path d="M-11 0q0-11 11-11t11 11z" fill="#9aa3b5" ${S} stroke-width="1.6"/></g>`; }
  if(sp.launcher === "pad") ln = `<rect x="${g.X(0) - 9}" y="${PL.b - 4}" width="18" height="4" rx="1.5" fill="#3b5bdb" ${S} stroke-width="1.4"/>`;
  return `<svg viewBox="0 0 340 208" role="img" aria-label="${T.simAria}"><defs><clipPath id="cp"><rect x="${PL.l - 14}" y="0" width="${PL.r - PL.l + 22}" height="${PL.b + 1}"/></clipPath></defs>
    <rect width="340" height="208" fill="#eaf6fd"/><rect y="${PL.b}" width="340" height="22" fill="#cfe6b8"/>
    <g fill="none" stroke="#b9d3e6" stroke-width="1">${grid}</g><path d="M${PL.l - 14} ${PL.b}H340" stroke="${K}" stroke-width="2"/>
    <g ${FT} font-size="9.5" fill="#5f5a45">${lab}<text x="336" y="200" text-anchor="end">${T.unitM}</text></g>
    ${tg}${ln}<g clip-path="url(#cp)"><g fill="none" stroke="#e5243b" stroke-width="1.8" stroke-dasharray="4 4" opacity=".65">${(ghosts || []).map(p => `<polyline points="${p}"/>`).join("")}</g><g id="dyn"></g></g>
    <text id="tm" x="330" y="26" text-anchor="end" ${FT} font-size="12.5" fill="${K}"></text></svg>`;
}
function trail(sp, t){ const g = geo(sp), n = 28, a = []; for(let i = 0; i <= n; i++){ const p = posAt(sp, t * i / n); a.push(r1(g.X(p.x)) + "," + r1(g.Y(p.y))); } return a.join(" "); }
function frame(sp, t){
  const g = geo(sp), p = posAt(sp, t), d = $("dyn"); if(!d) return;
  d.innerHTML = (t > 0 ? `<polyline points="${trail(sp, t)}" fill="none" stroke="#3b5bdb" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 5"/>` : "")
    + (sp.launcher === "drone" ? droneSvg(g.X(sp.x0 + sp.vx * t), g.Y(sp.y0) - 8) : "") + bodySvg(sp.body, g.X(p.x), g.Y(Math.max(0, p.y)));
  const tm = $("tm"); if(tm) tm.textContent = T.timer(Math.round(t * 10) / 10);
}
let animId = 0;
function playSim(sp){
  const Tt = flight(sp), dur = Math.max(1100, Math.min(3200, Tt * 650)), id = ++animId;
  return new Promise(res => { const t0 = performance.now();
    (function step(now){ if(id !== animId) return res(); const u = Math.min(1, (now - t0) / dur); frame(sp, Tt * u); u < 1 ? requestAnimationFrame(step) : res(); })(t0); });
}
/* schemų ruošiniai */
const cart = (v0, a, Tt, W, gate) => ({ W, H: W * .34, x0: 0, y0: 0, vx: v0, vy: 0, ax: a, g: 0, T: Tt, body: "cart", target: gate != null ? { type: "gate", x: gate } : null });
const fall = (h, Hm) => ({ xc: 1, W: (Hm || h) * .9, H: (Hm || h) * 1.18, x0: 0, y0: h, vx: 0, vy: 0, g: 10, body: "ball", launcher: "drone" });
const upS = (v0, Hm, ring) => ({ xc: 1, W: Hm * .9, H: Hm * 1.15, x0: 0, y0: 0, vx: 0, vy: v0, g: 10, T: v0 / 5, body: "ball", launcher: "pad", target: ring != null ? { type: "ring", x: 0, y: ring } : null });
const hor = (v, h, W, Hm, tx) => ({ W, H: (Hm || h) * 1.2, x0: 0, y0: h, vx: v, vy: 0, g: 10, body: "box", launcher: "drone", target: tx != null ? { type: "pad", x: tx } : null });
const ang = (vx, vy, W, H, tx) => ({ W, H, x0: 0, y0: 0, vx, vy, g: 10, T: vy / 5, body: "ball", launcher: "machine", ang: Math.atan2(vy, vx) * 180 / Math.PI, target: tx != null ? { type: "pad", x: tx } : null });
const angAuto = (vx, vy) => { const L = vx * vy / 5, H = vy * vy / 20; return ang(vx, vy, Math.max(L * 1.15, H * .8), Math.max(H * 1.3, L * .3)); };

/* ================= v(t) grafikas ================= */
function mkGraph(){
  for(;;){
    const kinds = SH([0, 1, 2]), pts = [[0, 0]]; let v = P([0, 2, 4, 6, 8]), t = 0, ok = true; pts[0][1] = v;
    for(const k of kinds){ const dt = P([2, 2, 3, 4]), a = k === 0 ? P([1, 2, 3]) : k === 1 ? 0 : -P([1, 2, 3]); v += a * dt; t += dt; if(v < 0 || v > 14 || (k === 1 && v === 0)) ok = false; pts.push([t, v]); }
    if(ok) return { pts, kinds, tt: t, seg: i => ({ v1: pts[i][1], v2: pts[i + 1][1], dt: pts[i + 1][0] - pts[i][0], a: (pts[i + 1][1] - pts[i][1]) / (pts[i + 1][0] - pts[i][0]), s: (pts[i][1] + pts[i + 1][1]) / 2 * (pts[i + 1][0] - pts[i][0]) }) };
  }
}
function graphSvg(G){
  const vm = Math.max(8, Math.ceil((Math.max(...G.pts.map(p => p[1])) + 1) / 2) * 2), X = t => 40 + t * 280 / G.tt, Y = v => 172 - v * 150 / vm;
  let grid = "", lab = "";
  for(let t = 0; t <= G.tt; t++){ grid += `<path d="M${r1(X(t))} 22V172"/>`; lab += `<text x="${r1(X(t))}" y="186" text-anchor="middle">${t}</text>`; }
  for(let v = 0; v <= vm; v += 2){ grid += `<path d="M40 ${r1(Y(v))}H320"/>`; lab += `<text x="34" y="${r1(Y(v)) + 4}" text-anchor="end">${v}</text>`; }
  let segs = "";
  for(let i = 0; i < 3; i++){ const a = G.pts[i], b = G.pts[i + 1]; segs += `<text x="${r1((X(a[0]) + X(b[0])) / 2)}" y="16" text-anchor="middle" ${FT} font-size="12" fill="#3b5bdb">${T.ROM[i]}</text>`; if(i) segs += `<path d="M${r1(X(a[0]))} 8V172" stroke="#3b5bdb" stroke-width="1.4" stroke-dasharray="4 4"/>`; }
  return `<div class="sim"><svg viewBox="0 0 340 204" role="img" aria-label="${T.graphAria}"><rect width="340" height="204" fill="#fff"/><g fill="none" stroke="#d5dfea" stroke-width="1">${grid}</g>
    <path d="M40 10V172H330" fill="none" stroke="${K}" stroke-width="2"/><g ${FT} font-size="10" fill="#5f5a45">${lab}<text x="332" y="200" text-anchor="end">${T.axT}</text><text x="6" y="12">${T.axV}</text></g>${segs}
    <polyline points="${G.pts.map(p => r1(X(p[0])) + "," + r1(Y(p[1]))).join(" ")}" fill="none" stroke="#e8590c" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>
    ${G.pts.map(p => `<circle cx="${r1(X(p[0]))}" cy="${r1(Y(p[1]))}" r="3.6" fill="#fff" stroke="#e8590c" stroke-width="2.4"/>`).join("")}</svg></div>`;
}

/* ================= užduočių generatoriai ================= */
function choice(text, c, wrong, why, o){
  const opts = [c]; for(const w of wrong) if(w != null && !opts.includes(w) && opts.length < 4) opts.push(w);
  if(opts.length < 3) return null;
  return Object.assign({ kind: "choice", text, opts: o && o.keep ? o.keep : SH(opts), ans: c, why }, o || {});
}
const pos = (a, u) => a.filter(x => x > 0 && Number.isFinite(x) && Math.abs(x * 100 - Math.round(x * 100)) < 1e-6).map(x => U(x, u));
function vals(ansA, traps, pool, n){
  const s = new Set(ansA), cap = Math.max(...ansA) * 1.7; for(const x of traps) if(x > 0 && x <= cap && s.size < (n || 7) - 1 && Math.abs(x * 2 - Math.round(x * 2)) < 1e-9) s.add(x);
  for(const x of SH(pool)) if(s.size < (n || 7) && x > 0) s.add(x);
  return [...s].sort((a, b) => a - b);
}
const around = (x, st) => [-3, -2, -1, 1, 2, 3, 4].map(k => x + k * st);
function setT(text, par, unit, vs, ans, build, res, why, hint, o){
  let i0; do i0 = R(0, vs.length - 1); while(ans.includes(vs[i0]));
  return Object.assign({ kind: "set", text, par, unit, vals: vs, ans, i0, build, res, why, hint }, o || {});
}
const FALL = [[5, 1], [20, 2], [45, 3], [80, 4], [125, 5]], FALL2 = FALL.concat([[180, 6], [245, 7]]), HS = [5, 10, 20, 30, 45, 60, 80, 100, 125];
const win = (list, a, n) => { const i = list.indexOf(a), s = Math.max(0, Math.min(list.length - n, i - R(0, n - 1))); return list.slice(s, s + n); };
const ANG = { 37: [.6, .8], 53: [.8, .6], 30: [.5, Math.sqrt(3) / 2] };
const GN = { gn: 1 };
const G = {
  v(){ const v0 = P([0, 0, 2, 4, 6, 8]), a = R(1, 4), t = R(2, 6), v = v0 + a * t, s = v0 * t + a * t * t / 2;
    return choice(T.q.v(v0, a, t), U(v, "m/s"), pos([v0 ? a * t : 0, v0 + a, v0 * t + a, s, v + a, v * 2], "m/s"), T.w.v(v0, a, t, v), { sim: cart(v0, a, t, s * 1.15) }); },
  acc(){ const v1 = R(1, 10) * 2, t = P([2, 4, 5]), a = P([-3, -2, -1, 1, 2, 3, 4]), v2 = v1 + a * t, s = v1 * t + a * t * t / 2; if(v2 < 0 || s <= 0) return null;
    return choice(T.q.acc(v1, v2, t), U(a, "m/s²"), [U(-a, "m/s²"), U(v2 - v1, "m/s²"), U((v1 + v2) / t, "m/s²"), U(a * 2, "m/s²")], T.w.acc(v1, v2, t, a), { sim: cart(v1, a, t, s * 1.15) }); },
  pos(m){ const v0 = m ? P([2, 4, 6]) : 0, a = R(1, 4), t = R(2, 5), s = v0 * t + a * t * t / 2; if(s > 80 || s < 4) return null;

    <g transform="translate(66 226) scale(1.22)"><ellipse rx="24" ry="4.5" fill="#000" opacity=".13"/>
      <path d="M-8-38v34M8-38v34" stroke="#2b3350" stroke-width="10" stroke-linecap="round"/><path d="M-15-2h11M4-2h11" stroke="${K}" stroke-width="6.5" stroke-linecap="round"/>
      <path d="M-15-76q15-7 30 0l3 42h-36z" fill="#fff" ${S}/><path d="M0-78v44M-6-70l6 8 6-8" fill="none" ${S} stroke-width="1.5"/>
      <path d="M-15-70q-9 12-4 26" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/><path d="M-15-70q-9 12-4 26" fill="none" stroke="${K}" stroke-width="1"/><path d="M15-70q10 8 16 22" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
      <rect x="14" y="-58" width="26" height="18" rx="3" fill="#2b3350" ${S} transform="rotate(-12 27 -49)"/><path d="M19-48q6-10 14 0" fill="none" stroke="#7bd13a" stroke-width="2" transform="rotate(-12 27 -49)"/>
      <circle cx="-19" cy="-43" r="5" fill="#f6c9a0" ${S}/><circle cx="31" cy="-47" r="5" fill="#f6c9a0" ${S}/>
      <path d="M-17-92q-6 22 2 32M17-92q6 22-2 32" fill="none" stroke="#7a4b2a" stroke-width="9" stroke-linecap="round"/>
      <circle cy="-93" r="16" fill="#f6c9a0" ${S}/><path d="M-16-94q-1-18 16-18t16 18q-8-10-16-10t-16 10z" fill="#7a4b2a" ${S}/>
      <path d="M-13-103h26l3 5h-32z" fill="#ffc61a" ${S}/><path d="M-10-103q10-13 20 0z" fill="#ffc61a" ${S}/>
      <circle cx="-5.5" cy="-92" r="1.9" fill="${K}"/><circle cx="5.5" cy="-92" r="1.9" fill="${K}"/><path d="M-5-86q5 5 10 0" fill="none" ${S}/></g></svg>`;
}

/* ================= meniu ir žurnalas ================= */
const menu = $("menu"), play = $("play"), stage = $("stage"), app = $("app");
const saved = MK.get("mokomeskartu-klase", 0), KEY = "mk-" + GAME + "-taskai", TH = [10, 60, 130, 220, 330, 460, 620, 800, 1000, 1250];
app.prepend(MK.top({ title: T.title, grade: GRADES.includes(saved) ? saved : GRADES[0] }));
$("heroH").innerHTML = `${T.heroA} <em>${T.heroB}</em>`; $("heroP").textContent = T.hero; $("ptsL").textContent = T.pts;
const total = () => MK.get(KEY, 0), gotN = n => TH.filter(t => n >= t).length;
function renderCol(prev){
  const n = total(), got = gotN(n), rank = T.ranks[got >= 10 ? 4 : got >= 7 ? 3 : got >= 4 ? 2 : got >= 2 ? 1 : 0];
  $("col").innerHTML = `<h2>${T.colH}</h2><p>${T.colP(n, got, TH.length, rank, got < TH.length ? TH[got] - n : 0)}</p>
    <div class="bds">${TH.map((t, i) => `<div class="bd${i < got ? (prev != null && i >= prev ? " new" : "") : " off"}">${badge(i)}<small>${i < got ? T.badges[i] : t + " tšk."}</small></div>`).join("")}</div>`;
}
function showMenu(prev){
  animId++; play.hidden = true; menu.hidden = false; $("heroArt").innerHTML = heroSvg(); renderCol(prev);
  MK.levels($("levels"), { game: GAME, levels: LEVELS, onPick: start });
  MK.learn($("learn"), { topics: T.learn, onPlay: start });
  window.scrollTo(0, 0);
}

/* ================= žaidimas ================= */
let L = 0, tasks = [], ti = 0, cur = null, okN = 0, pts = 0, dots = null, got0 = 0, tries = 0, locked = false, idx = 0, ghosts = [];
function start(i){
  L = i; tasks = LV[i](); ti = 0; okN = 0; pts = 0; $("pts").textContent = 0; got0 = gotN(total());
  menu.hidden = true; play.hidden = false; dots = MK.dots($("dots"), tasks.length); show();
}
function award(n){ if(n){ pts += n; MK.set(KEY, total() + n); const c = $("ptsChip"); $("pts").textContent = pts; c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop"); } }
function close(ok, p){
  locked = true; const first = ok && tries === 0; dots.mark(ti, first); if(first) okN++;
  if(ok){ award(p); MK.sfx.good(); } else MK.sfx.bad();
  const d = document.createElement("div"); d.innerHTML = MK.why({ ok, head: ok ? MK.praise() : cur.kind === "set" ? T.shown : T.bad2(cur.ans), body: cur.why });
  $("flow").appendChild(d.firstElementChild);
  const go = document.createElement("button"); go.type = "button"; go.className = "mk-btn go"; go.id = "next"; go.textContent = ti < tasks.length - 1 ? T.next : T.finish;
  go.onclick = () => { MK.sfx.tap(); animId++; ti++; ti < tasks.length ? show() : finish(); };
  $("flow").appendChild(go); setTimeout(() => go.scrollIntoView({ behavior: "smooth", block: "nearest" }), 120);
}
function note(cls, s){ const n = $("note"); if(n){ n.className = "note " + (cls || ""); n.innerHTML = s; } }
function show(){
  cur = tasks[ti]; dots.cur(ti); tries = 0; locked = false; ghosts = []; animId++; window.scrollTo({ top: 0 });
  cur.kind === "set" ? showSet() : showChoice();
}
const head = () => `<p class="txt">${cur.text}</p>${cur.gn ? `<p class="gn">${T.gnote}</p>` : ""}`;
function drawSet(){ const sp = cur.build(cur.vals[idx]); $("sim").innerHTML = simSvg(sp, ghosts); frame(sp, 0); $("tm").textContent = "";
  $("val").innerHTML = `<small>${cur.par}</small>${nf(cur.vals[idx])}${cur.unit === "°" ? "°" : " " + cur.unit}`; $("dec").disabled = locked || idx === 0; $("inc").disabled = locked || idx === cur.vals.length - 1; }
function showSet(){
  idx = cur.i0;
  stage.innerHTML = `<div class="card fade">${head()}<div class="sim" id="sim"></div>
    <div class="ctl"><button type="button" id="dec" aria-label="−">−</button><output id="val"></output><button type="button" id="inc" aria-label="+">+</button></div>
    <p class="note" id="note" role="status" aria-live="polite"></p>
    <div class="row"><button type="button" class="mk-btn" id="run">${T.launch}</button><span id="tr">${T.tries(0)}</span></div></div><div id="flow"></div>`;
  $("dec").onclick = () => { if(!locked && idx > 0){ idx--; MK.sfx.tap(); drawSet(); } };
  $("inc").onclick = () => { if(!locked && idx < cur.vals.length - 1){ idx++; MK.sfx.tap(); drawSet(); } };
  $("run").onclick = run; drawSet();
}
async function run(){
  if(locked) return; locked = true; let my; const v = cur.vals[idx], sp = cur.build(v), hit = cur.ans.includes(v);
  $("run").disabled = true; drawSet(); note("", ""); MK.sfx.whoosh(); const p1 = playSim(sp); my = animId; await p1; if(my !== animId) return;
  if(hit){ note("ok", `${T.hit} <i>${cur.res(v)}</i>`); $("run").hidden = true; $("tr").hidden = true; locked = false; return close(true, [10, 6, 3][tries]); }
  tries++; $("tr").textContent = T.tries(tries); ghosts.push(trail(sp, flight(sp))); MK.sfx.bad();
  if(tries >= 3){
    note("bad", `${T.miss} <i>${cur.res(v)}</i>`); await MK.wait(900); if(my !== animId) return;
    idx = cur.vals.indexOf(cur.ans[0]); drawSet(); const p2 = playSim(cur.build(cur.vals[idx])); my = animId; await p2; if(my !== animId) return;
    $("run").hidden = true; return close(false, 0);
  }
  note("bad", `${T.miss} <i>${cur.res(v)}</i>` + (tries === 2 ? `<i><b>${T.hint}</b> ${cur.hint}</i>` : ""));
  locked = false; $("run").disabled = false; $("run").textContent = T.again; drawSet(); frame(sp, flight(sp));
}
function showChoice(){
  stage.innerHTML = `<div class="card fade">${head()}${cur.graph ? graphSvg(cur.graph) : cur.sim ? `<div class="sim" id="sim">${simSvg(cur.sim)}</div>` : ""}
    <div class="ans${cur.one ? " one" : ""}" id="ans">${cur.opts.map((o, i) => `<button type="button" class="a" data-i="${i}">${o}</button>`).join("")}</div>
    <p class="note" id="note" role="status" aria-live="polite" style="margin-top:8px"></p></div><div id="flow"></div>`;
  if(cur.sim){ frame(cur.sim, 0); $("tm").textContent = ""; }
  $("ans").onclick = e => {
    const b = e.target.closest(".a"); if(!b || locked || b.disabled) return;
    const ok = cur.opts[+b.dataset.i] === cur.ans;
    if(!ok){ b.classList.add("no"); b.disabled = true; tries++; if(tries < 2){ MK.sfx.bad(); note("bad", T.bad); return; } }
    [...$("ans").children].forEach(x => { x.disabled = true; if(cur.opts[+x.dataset.i] === cur.ans) x.classList.add("ok"); });
    note("", ""); if(cur.sim) playSim(cur.sim);
    ok ? close(true, tries ? 4 : 10) : close(false, 0);
  };
}
function finish(){
  const n = tasks.length, stars = MK.starsFor(okN, n); MK.best(GAME, LEVELS[L].id, stars);
  MK.result({ stars, title: `${okN} / ${n}`, text: T.res(okN, n, pts), next: L < LV.length - 1 ? () => start(L + 1) : null, again: () => start(L), menu: () => showMenu(got0) });
}
window.__mk = { G, LV, mk, posAt, flight, get cur(){ return cur; }, get idx(){ return idx; } };
showMenu();
})();
</script>
