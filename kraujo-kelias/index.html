<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kraujo kelias – MokomėsKartu.lt</title>
<meta name="description" content="Biologijos žaidimas 9 klasei: valdyk eritrocitą, leukocitą, trombocitą ar kraujo plazmos lašą ir nuplauk kraujagyslėmis iki reikiamo organo – širdis, vožtuvai, mažasis ir didysis kraujo apytakos ratai.">
<meta name="theme-color" content="#f5f1e8">
<link rel="icon" href="/logo/mk-ikona.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="/bendra/mk.js"></script>
<script src="tekstai.lt.js"></script>
<script src="zemelapis.js"></script>
<style>
/* Kraujo kelias: šviesus anatomijos atlaso ir klinikinio monitoriaus stilius – popierius, tušas, arterijų raudona ir venų mėlyna. */
body{--paper:#f5f1e8;--ink:#1c2540;--soft:#5d6477;--line:#cfc8b8;--art:#bf3a2d;--ven:#2f5aa8;--ac:#0f766e;--warn:#b4231a;
  --kid:"IBM Plex Sans",system-ui,sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  background:#f5f1e8;background-image:none;color:var(--ink);font-weight:400}
.mk-app{max-width:760px;padding-block:6px 14px}
.mk-top{padding-bottom:8px}
.mk-back,.mk-ico{border-radius:6px;border-width:1.5px;box-shadow:none;height:40px}
.mk-ico{width:40px}.mk-ico[data-k="music"]{display:none}
.mk-title{font:600 15px/1.1 var(--body);letter-spacing:.1em;text-transform:uppercase}
.kick{font:600 11px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
h1{margin:4px 0 6px;font:700 clamp(30px,8vw,42px)/1.02 var(--body);letter-spacing:-.02em}
.lead{margin:0 0 14px;font-size:15.5px;line-height:1.5;max-width:62ch}
.hero{display:block;width:100%;height:auto;border:1.5px solid var(--ink);border-radius:6px;background:#fbf8f1;margin-bottom:12px}
.card{background:#fffdf8;border:1.5px solid var(--ink);border-radius:6px;padding:12px 14px;margin:0 0 12px}
.card h2,.sec{margin:0 0 6px;font:600 11px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.sec{margin:16px 0 8px}
.rank{font:700 20px/1.2 var(--body)}
.sm{font-size:12.5px;color:var(--soft);line-height:1.45}
.sh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;width:100%;text-align:left;background:#fffdf8;border:1.5px solid var(--ink);border-radius:6px;padding:11px 12px;margin:0 0 8px;cursor:pointer;font:inherit;color:inherit}
.sh:hover{background:#fbf6ea}.sh:active{transform:translateY(1px)}
.sh b{font:700 17px/1.2 var(--body)}
.sh span{grid-column:1;font-size:13.5px;line-height:1.35}
.sh code{grid-column:1;font:500 11px/1.35 var(--mono);color:var(--soft);text-transform:uppercase;letter-spacing:.05em}
.sh .stars{grid-row:1/span 3;grid-column:2;font:600 16px/1 var(--mono);letter-spacing:2px;color:#d3ccbc}
.stars u,.big u{text-decoration:none;color:var(--art)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chips i{font:500 11px/1 var(--mono);font-style:normal;border:1px solid var(--line);border-radius:3px;padding:4px 6px;background:#fbf8f1}
.meter{height:6px;background:#e6dfd0;border-radius:3px;overflow:hidden;margin:8px 0 2px}.meter i{display:block;height:100%;background:var(--art)}
details.man{background:#fffdf8;border:1.5px solid var(--line);border-radius:6px;padding:0 14px;margin:0 0 6px}
details.man summary{cursor:pointer;font-weight:600;font-size:15px;padding:12px 0;list-style:none}
details.man summary::-webkit-details-marker{display:none}
details.man summary::before{content:"+ ";font-family:var(--mono);color:var(--art)}
details.man[open] summary::before{content:"− "}
details.man p{margin:0 0 10px;font-size:14.5px;line-height:1.5}
.ex{background:#f7ebe6;border-left:3px solid var(--art);padding:8px 10px;font-family:var(--mono);font-size:12.5px;line-height:1.6}
.note{color:var(--soft);font-size:12.5px;line-height:1.45;margin:12px 0 0}

#game{user-select:none;-webkit-user-select:none}
.goalbar{display:flex;gap:10px;align-items:baseline;border:1.5px solid var(--ink);border-bottom:0;border-radius:6px 6px 0 0;background:#fffdf8;padding:7px 10px;min-height:38px}
.goalbar code{font:600 11px/1.2 var(--mono);color:var(--soft);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.goalbar b{font:600 14.5px/1.25 var(--body)}
.stage{position:relative;border:1.5px solid var(--ink);background:#f8f4ea;overflow:hidden;touch-action:none}
#cv{display:block;width:100%;touch-action:none;cursor:grab}
.chip{position:absolute;left:8px;top:8px;display:flex;gap:8px;align-items:center;background:rgba(255,253,248,.93);border:1.5px solid var(--ink);border-radius:6px;padding:5px 9px 5px 6px;pointer-events:none}
.chip svg{width:30px;height:30px;flex:none}
.chip b{display:block;font:600 13px/1.15 var(--body)}
.chip span{display:block;font:500 11px/1.25 var(--mono);color:var(--soft)}
.ecg{position:absolute;left:8px;top:58px;background:rgba(255,253,248,.93);border:1.5px solid var(--ink);border-radius:6px;padding:3px 7px;display:flex;gap:6px;align-items:center;pointer-events:none}
.ecg canvas{width:74px;height:22px}
.ecg span{font:600 11px/1 var(--mono)}
#mini{position:absolute;right:8px;top:8px;width:66px;height:128px;background:rgba(255,253,248,.93);border:1.5px solid var(--ink);border-radius:6px;pointer-events:none}
.toast{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(28,37,64,.94);color:#fff;border-radius:6px;padding:9px 12px;font-size:13.5px;line-height:1.4;pointer-events:none;opacity:0;transition:opacity .25s}
.toast.on{opacity:1}
.toast code{font:600 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#f3b9a9;display:block;margin-bottom:3px}
.ovl{position:absolute;inset:0;background:rgba(245,241,232,.82);display:none;align-items:center;justify-content:center;padding:10px;overflow:auto}
.ovl.on{display:flex}
.box{background:#fffdf8;border:1.5px solid var(--ink);border-radius:8px;padding:14px;max-width:440px;width:100%;max-height:100%;overflow:auto;box-shadow:0 10px 30px rgba(28,37,64,.16)}
.box h3{margin:0 0 6px;font:600 11px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--art)}
.box p{margin:0 0 10px;font-size:15px;line-height:1.45}
.box .q{font-weight:600}
.box .route{background:#f7ebe6;border-left:3px solid var(--art);padding:8px 10px;font:500 12.5px/1.6 var(--mono);margin:0 0 10px}
.box .why{font-size:14px;color:#2b3350}
.box .warn{color:var(--warn);font-weight:600}
.big{font:700 26px/1.1 var(--mono);letter-spacing:3px;color:#d3ccbc;margin:2px 0 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border:1.5px solid var(--ink);border-radius:6px;background:var(--ink);color:#fff;font:600 15px/1 var(--body);cursor:pointer}
.btn.sec2{background:#fffdf8;color:var(--ink)}
.btn:active{transform:translateY(1px)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.cars{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.cars button{display:flex;gap:8px;align-items:center;text-align:left;border:1.5px solid var(--ink);border-radius:6px;background:#fffdf8;padding:8px;min-height:56px;font:600 13.5px/1.2 var(--body);color:var(--ink);cursor:pointer}
.cars button svg{width:34px;height:34px;flex:none}
.cars button:disabled{opacity:.35;cursor:default;text-decoration:line-through}
.cars button:not(:disabled):active{transform:translateY(1px)}
.step{display:flex;align-items:center;gap:14px;margin:0 0 12px}.step output{font:600 30px/1 var(--mono);min-width:36px;text-align:center}.step .btn{min-width:52px;font-size:22px}
.foot{display:flex;gap:8px;align-items:center;border:1.5px solid var(--ink);border-top:0;border-radius:0 0 6px 6px;background:#fffdf8;padding:6px 8px}
.foot .btn{min-height:38px;padding:0 12px;font-size:13.5px}
.foot span{margin-left:auto;font:600 11.5px/1.2 var(--mono);color:var(--soft);text-align:right}
@media (max-width:380px){.cars button{font-size:12.5px;padding:6px}.goalbar b{font-size:13.5px}}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <main id="menu">
    <svg class="hero" viewBox="0 0 560 190" role="img" id="hero">
      <defs><pattern id="gr" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#ece5d6" stroke-width="1"/></pattern></defs>
      <rect width="560" height="190" fill="url(#gr)"/>
      <path id="lpS" d="M262 100C262 30 120 20 96 80S190 150 262 110" fill="none" stroke="#2f5aa8" stroke-width="9" stroke-linecap="round" opacity=".35"/>
      <path id="lpB" d="M298 100C298 20 470 10 486 90S380 170 298 112" fill="none" stroke="#bf3a2d" stroke-width="9" stroke-linecap="round" opacity=".35"/>
      <path id="mS" d="M262 100C262 30 120 20 96 80S190 150 262 110" fill="none"/>
      <path id="mB" d="M298 100C298 20 470 10 486 90S380 170 298 112" fill="none"/>
      <g stroke="#1c2540" stroke-width="2" stroke-linejoin="round">
        <ellipse cx="96" cy="78" rx="34" ry="44" fill="#f6dfd9"/><path d="M84 58v40M108 58v40M84 78h24" fill="none" stroke-width="1.3"/>
        <rect x="452" y="50" width="64" height="84" rx="14" fill="#f1cdbd"/><path d="M466 70h36M466 92h36M466 114h36" fill="none" stroke-width="1.3"/>
        <path d="M280 62c-30-22-62 4-48 40 8 22 30 38 48 54 18-16 40-32 48-54 14-36-18-62-48-40z" fill="#f1c6bd"/>
        <path d="M280 62v94M236 104h88" fill="none" stroke-width="1.5"/>
      </g>
      <g><circle r="5" fill="#7d2634"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#mS"/></animateMotion></circle>
        <circle r="5" fill="#7d2634"><animateMotion dur="6s" begin="-2s" repeatCount="indefinite"><mpath href="#mS"/></animateMotion></circle>
        <circle r="5" fill="#7d2634"><animateMotion dur="6s" begin="-4s" repeatCount="indefinite"><mpath href="#mS"/></animateMotion></circle>
        <circle r="5" fill="#d8392b"><animateMotion dur="8s" repeatCount="indefinite"><mpath href="#mB"/></animateMotion></circle>
        <circle r="5" fill="#d8392b"><animateMotion dur="8s" begin="-2.7s" repeatCount="indefinite"><mpath href="#mB"/></animateMotion></circle>
        <circle r="5" fill="#d8392b"><animateMotion dur="8s" begin="-5.4s" repeatCount="indefinite"><mpath href="#mB"/></animateMotion></circle></g>
    </svg>
    <div class="kick" id="kick"></div><h1 id="h1"></h1><p class="lead" id="lead"></p>
    <div class="card"><h2 id="rankT"></h2><div class="rank" id="rank"></div><div class="meter"><i id="rankM"></i></div><div class="sm" id="rankS"></div></div>
    <div class="sec" id="shT"></div><div id="shifts"></div>
    <div class="card"><h2 id="atT"></h2><div class="sm" id="atS"></div><div class="meter"><i id="atM"></i></div><div class="chips" id="atC"></div></div>
    <div class="sec" id="manT"></div><div id="manual"></div>
    <p class="note" id="note"></p>
  </main>
  <section id="game" hidden>
    <div class="goalbar"><code id="gNo"></code><b id="gTxt"></b></div>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="chip" id="chip"></div>
      <div class="ecg"><canvas id="ecg" width="148" height="44"></canvas><span id="bpm"></span></div>
      <canvas id="mini" width="132" height="256"></canvas>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="ovl" id="ovl"><div class="box" id="box"></div></div>
    </div>
    <div class="foot"><button class="btn sec2" id="bMan" type="button"></button><button class="btn sec2" id="bQuit" type="button"></button><span id="fErr"></span></div>
  </section>
</div>
<script>
"use strict";
const T = window.MK_T, K = window.MK_KK, GAME = "kraujo-kelias";
const $ = id => document.getElementById(id);
const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (m, k) => o[k] != null ? o[k] : m);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const sn = (s, i) => T.site[s][i];
const INK = "#1c2540";
const ICON = {
  E: '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="#d8392b" stroke="#1c2540" stroke-width="2"/><ellipse cx="20" cy="20" rx="7.5" ry="6" fill="#b72c22"/></svg>',
  P: '<svg viewBox="0 0 40 40"><path d="M20 4c8 11 12 17 12 22a12 12 0 0 1-24 0c0-5 4-11 12-22z" fill="#eccd62" stroke="#1c2540" stroke-width="2"/><circle cx="16" cy="25" r="2.4" fill="#fff8d8"/><circle cx="24" cy="28" r="1.8" fill="#fff8d8"/></svg>',
  L: '<svg viewBox="0 0 40 40"><path d="M20 4c7 0 10 4 14 8s3 12-1 17-11 8-18 5S4 24 5 17 13 4 20 4z" fill="#ece6f7" stroke="#1c2540" stroke-width="2"/><path d="M14 17c2-4 7-4 8 0s5 3 5 7-6 5-9 2-6-5-4-9z" fill="#7a5cc0"/></svg>',
  T: '<svg viewBox="0 0 40 40"><g fill="#e7c9ef" stroke="#1c2540" stroke-width="2"><ellipse cx="13" cy="14" rx="6" ry="4.5"/><ellipse cx="27" cy="18" rx="6.5" ry="4.5" transform="rotate(25 27 18)"/><ellipse cx="17" cy="28" rx="6" ry="4.5" transform="rotate(-20 17 28)"/></g></svg>'
};
const EL = K.EL, E = K.E;
if(!CanvasRenderingContext2D.prototype.roundRect) CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h){ this.rect(x, y, w, h); };
EL.forEach(e => { let a = 1e9, b = 1e9, c = -1e9, d = -1e9; e.pts.forEach(p => { a = Math.min(a, p[0]); b = Math.min(b, p[1]); c = Math.max(c, p[0]); d = Math.max(d, p[1]); }); e.bb = [a - 20, b - 20, c + 20, d + 20]; e.mid = K.at(e, e.len / 2); });
const ATLAS_ALL = (() => { const s = {}; EL.forEach(e => e.nm.forEach(n => s["v:" + n] = 1)); K.SITES.forEach(x => s["s:" + x] = 1); return Object.keys(s); })();
let atlas = MK.get("mk-" + GAME + "-atlasas", []);
let seen = MK.get("mk-" + GAME + "-matyta", {});
function atlasAdd(k){ if(atlas.indexOf(k) < 0){ atlas.push(k); MK.set("mk-" + GAME + "-atlasas", atlas); } }

/* ---------- meniu ---------- */
function starsTxt(n){ return [0,1,2].map(i => i < n ? "<u>★</u>" : "★").join(""); }
function showMenu(){
  $("game").hidden = true; $("menu").hidden = false; S = null;
  const best = MK.best(GAME), tot = K.SHIFTS.reduce((a, s) => a + (best[s.id] || 0), 0);
  let ri = 0; T.ranks.forEach((r, i) => { if(tot >= r[0]) ri = i; });
  $("rank").textContent = T.ranks[ri][1]; $("rankM").style.width = Math.round(tot / 15 * 100) + "%";
  $("rankS").textContent = "★ " + tot + " / 15" + (T.ranks[ri + 1] ? " · " + T.ranks[ri + 1][1] + ": ★ " + T.ranks[ri + 1][0] : "");
  $("shifts").innerHTML = K.SHIFTS.map(s => `<button class="sh" type="button" data-s="${s.id}"><b>${T.shifts[s.id].n}</b><span>${T.shifts[s.id].d}</span><code>${T.shifts[s.id].tag}</code><i class="stars">${starsTxt(best[s.id] || 0)}</i></button>`).join("");
  const got = atlas.filter(k => ATLAS_ALL.indexOf(k) >= 0);
  $("atS").textContent = T.atlasSub + " · " + got.length + " / " + ATLAS_ALL.length;
  $("atM").style.width = Math.round(got.length / ATLAS_ALL.length * 100) + "%";
  $("atC").innerHTML = got.length ? got.map(k => `<i>${k[0] === "v" ? T.ves[k.slice(2)] : sn(k.slice(2), 0)}</i>`).join("") : `<span class="sm">${T.atlasEmpty}</span>`;
  window.scrollTo(0, 0);
}

/* ---------- būsena ---------- */
let S = null, cv = $("cv"), ctx = cv.getContext("2d"), cw = 300, ch = 400, dpr = 1, kz = 0.75, miniBase = null;
let phase = 0, tAll = 0, joy = { on:false, ox:0, oy:0, x:0, y:0, vx:0, vy:0 }, keys = {}, toastT = 0, lastHint = {};
function resize(){
  const w = $("stage").clientWidth || 360;
  const h = Math.max(380, Math.min(window.innerHeight - 178, Math.round(w * 1.5), 760));
  dpr = Math.min(2, window.devicePixelRatio || 1); cw = w; ch = h;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); cv.style.height = h + "px";
  kz = Math.max(0.7, Math.min(1.15, w / 520));
}
window.addEventListener("resize", () => { if(S) resize(); });

function startShift(id){
  const sh = K.SHIFTS.find(s => s.id === id);
  S = { sh, calls: K.makeShift(sh, seen), ci: -1, pos: { e: E.v_s2, s: 8 }, car: "E", oxy: 0, co2: 1, atJ: null, jT: 0, errs: 0, pts: 0, bedFired: false, cam: { x: 440, y: 470 }, paused: true, scene: null, fx: [], moved: false, mission: null, cargo: null, callErr: { car: 0, turn: 0, plan: 0 }, fast: false, sel: null };
  $("menu").hidden = true; $("game").hidden = false; resize(); buildMini(); window.scrollTo(0, 0);
  $("bMan").textContent = T.btn.manual; $("bQuit").textContent = T.btn.quit;
  nextCall();
}
function curGoal(){ const m = S.mission, st = m.steps[m.i]; return (st.needOxy && !S.oxy) ? K.LUNGS : st.edges; }
function nominal(){ const m = S.mission; return m.steps[Math.min(m.i, m.steps.length - 1)].edges; }
function leadName(e){ return e.site ? fmt(T.capOf, { gen: sn(e.site, 1) }) : T.ves[e.nm[e.nm.length - 1]]; }
function routeEdges(){
  let cur = S.pos.e, node = cur.to, ox = S.oxy; const list = [cur];
  const walk = goal => { K.pathFrom(node, goal).forEach(id => { cur = E[id]; list.push(cur); }); node = cur.to; };
  S.mission.steps.forEach(st => { if(st.needOxy && !ox){ walk(K.LUNGS); ox = 1; } walk(st.edges); if(S.car === "E") ox = K.LUNGS.indexOf(cur.id) >= 0 ? 1 : 0; });
  return list;
}
function chain(list){
  const names = [], push = n => { if(n && names[names.length - 1] !== n) names.push(n); };
  list.forEach(e => { if(e.site) push(sn(e.site, 0)); else e.nm.forEach(n => push(T.ves[n])); });
  return names.join(" → ");
}
function nextCall(){
  S.ci++; if(S.ci >= S.calls.length) return endShift();
  const c = S.calls[S.ci]; S.call = c; S.callErr = { car: 0, turn: 0, plan: 0 }; S.mission = { steps: c.steps, i: 0 }; S.fast = !!c.fast; S.cargo = null;
  if(c.start){ S.pos = { e: E[c.start[0]], s: E[c.start[0]].len * c.start[1] }; S.atJ = null; S.bedFired = true; const p = K.at(S.pos.e, S.pos.s); S.cam.x = p.x; S.cam.y = p.y; }
  else if(c.type === "tour"){ S.pos = { e: E.v_s2, s: 8 }; S.atJ = null; }
  seen[c.id] = 1; MK.set("mk-" + GAME + "-matyta", seen);
  $("gNo").textContent = T.hud.call + " " + (S.ci + 1) + " " + T.hud.of + " " + S.calls.length;
  $("gTxt").textContent = "…"; S.car = null; hud();
  const txt = T.calls[c.id] || fmt(T.calls[c.type], { Loc: cap(sn(c.place, 4)) });
  if(S.sh.pick) pickCard(txt); else { setCar(c.car); card(`<h3>${T.callT} ${S.ci + 1}</h3><p>${txt}</p><div class="row"><button class="btn" data-a="go">${T.go}</button></div>`, { go: planCard }); }
}
function pickCard(txt){
  const c = S.call, dis = {};
  const draw = warn => card(`<h3>${T.callT} ${S.ci + 1}</h3><p>${txt}</p>${warn ? `<p class="warn">${warn}</p>` : ""}<p class="q">${T.pickQ}</p><div class="cars">${["E","L","T","P"].map(k => `<button type="button" data-a="c${k}" ${dis[k] ? "disabled" : ""}>${ICON[k]}<span>${T.car[k].n}</span></button>`).join("")}</div>`,
    { cE: () => pick("E"), cL: () => pick("L"), cT: () => pick("T"), cP: () => pick("P") });
  const pick = k => {
    if(k === c.car){ MK.sfx.good(); setCar(k); card(`<h3>${T.car[k].n} · ${T.car[k].f}</h3><p>${T.carWhy[k]}</p><div class="row"><button class="btn" data-a="go">${T.go}</button></div>`, { go: planCard }); }
    else { MK.sfx.bad(); dis[k] = 1; S.callErr.car++; S.errs++; draw(fmt(T.carWrong, { n: T.car[k].n }) + " " + T.carWhy[c.car]); }
  };
  draw("");
}
function setCar(k){
  S.car = k;
  if(k === "E"){

function update(dt){

  if(S.scene){ sceneUpdate(dt); return; }

  const j = inputVec(), jl = Math.hypot(j[0], j[1]);
  if(S.atJ){
    S.jT += dt; const outs = K.OUT[S.atJ]; let b = null, bd = -2, sd = -2;
    if(jl > 0.3) outs.forEach(o => { const d = (j[0] * o.dir[0] + j[1] * o.dir[1]) / jl; if(d > bd){ sd = bd; bd = d; b = o; } else if(d > sd) sd = d; });
    S.sel = (b && bd > 0.5 && bd - sd > 0.12) ? b : null;

  if(!drive) return;
  S.moved = true;
  let ns = S.pos.s + drive * (e.kind === "c" ? 95 : e.kind === "h" ? 150 : 235) * dt;
  if(e.valve && S.pos.s < e.valveS && ns >= e.valveS - 9 && !valveOpen(e)){ ns = Math.min(ns, e.valveS - 9); hint("v", T.valveHint); }
