/* Meniu: bebras Rimas, „Bebro kaimas“ (kolekcija), lygiai, „Noriu pasimokyti“.
   Užduotys: pasirinkimas su brėžiniu, lysvės braižymas tempiant, sklypų galvosūkis (Shikaku tipo), sudėtinės figūros. */
body{--ac:#2f9e5b;--ac-ink:#fff;--ac-soft:#dff5e4}
.mk-hero{padding-top:0}
.mk-hero h1{margin-top:8px;font-size:clamp(34px,8.6vw,56px)}
.mk-hero p{max-width:42ch;font-size:16.5px}
.hero-art{width:min(100%,480px);border-radius:26px;overflow:hidden;position:relative;box-shadow:0 6px 0 rgba(18,26,51,.15)}
.hero-art svg{display:block;width:100%;height:auto}
.hero-art::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 3px var(--ink);pointer-events:none}
.col{width:100%;max-width:520px;margin:0 auto 14px;padding:12px 14px 14px;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 2.5px var(--ink),0 5px 0 rgba(18,26,51,.14)}
.col h2{margin:0;font:800 18px/1.2 var(--kid);display:flex;gap:8px;align-items:center}
.col h2 svg{width:30px;height:30px;flex:none}
.col p{margin:4px 0 10px;color:var(--soft);font-weight:700;font-size:14.5px}
.vill{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:8px;border-radius:14px;background:#8a5a33;box-shadow:inset 0 0 0 2px #121a33}
.vill svg{display:block;width:100%;height:auto;border-radius:6px}
.vill .new{animation:mkPop .6s cubic-bezier(.2,1.6,.4,1)}
.hud{display:flex;align-items:center;gap:8px;margin:0 0 8px;min-height:36px}
.hud .mk-dots{margin-right:auto;justify-content:flex-start}
.chip{display:inline-flex;align-items:baseline;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink);font:800 17px/36px var(--kid);white-space:nowrap}
.chip small{font:800 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.chip.pop{animation:mkPop .35s cubic-bezier(.2,1.6,.4,1)}
.card{width:100%;max-width:600px;margin:0 auto 10px;padding:12px 14px 14px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.12)}
.txt{margin:0 0 10px;font:700 16px/1.5 var(--body)}
.txt b{font-weight:800}
.figw{margin:0 0 10px;border-radius:14px;overflow:hidden;box-shadow:0 0 0 2.5px var(--ink);background:#eaf7dc}
.figw svg{display:block;width:100%;height:auto}
.ans{display:grid;gap:8px}
.ans.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.a{min-height:52px;padding:10px 12px;border:0;border-radius:14px;background:#fff;cursor:pointer;text-align:center;font:800 18px/1.3 var(--body);color:var(--ink);
  box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.16);transition:transform .1s;touch-action:manipulation}
.a:active{transform:translateY(3px)}
.a.ok{background:#dff7e6;box-shadow:inset 0 0 0 3.5px var(--good),0 4px 0 rgba(18,26,51,.16)}
.a.no{background:#ffe6df;box-shadow:inset 0 0 0 3.5px var(--bad),0 4px 0 rgba(18,26,51,.16)}
.ans.done .a{pointer-events:none}
.ans.done .a:not(.ok):not(.no){opacity:.5}
.go{display:flex;width:100%;max-width:600px;margin:4px auto 0}
.mk-why{max-width:600px;margin-inline:auto}
.mk-why-m p{margin:4px 0}
.fade{animation:mkIn .4s cubic-bezier(.2,1.2,.4,1)}
.note{min-height:24px;margin:8px 0;text-align:center;font:800 15.5px/1.35 var(--body)}
.note.good{color:#1c8a52}.note.warn{color:#b8531a}
.bar{display:flex;justify-content:space-between;gap:8px;margin:8px 0 0;font:800 14px/1.2 var(--body);color:var(--soft)}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0 0}
.tools .mk-btn{min-height:44px;padding:8px 16px;font-size:16px}
.board{margin:0 auto;max-width:460px;border-radius:14px;overflow:hidden;box-shadow:0 0 0 2.5px var(--ink);background:#8ccf66;touch-action:none}
.board svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;touch-action:none}
.board.shake{animation:mkShake .45s}
.legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0 0;font:700 13px/1.3 var(--body);color:var(--soft)}
@media (max-width:420px){.vill{gap:3px;padding:6px}}

<script>
(function(){
"use strict";
const T = window.MK_T, GAME = "bebro-sklypai", GRADES = [3, 4];
const R = MK.rnd, P = MK.pick, SH = MK.shuffle;
const K = "#121a33", S = `stroke="${K}" stroke-width="2.4" stroke-linejoin="round"`;
const $ = id => document.getElementById(id);
const f1 = x => +x.toFixed(1);
const CROPS = ["carrot", "cabbage", "berry", "sun", "wheat", "tomato", "pumpkin", "tulip", "tree", "grape"];
const CROPBG = ["#f6d9a8", "#d4f0b0", "#ffd3d6", "#fff0a6", "#f8e7ac", "#ffd9cf", "#ffe2b8", "#ffe0ee", "#d8f1c9", "#e6dcfb"];
const fmt = (v, u) => `${v} ${u}²`;
const pairs = A => { const r = []; for(let w = 1; w * w <= A; w++) if(A % w === 0) r.push([w, A / w]); return r; };
const pairsTxt = A => pairs(A).map(p => `${p[0]} × ${p[1]}`).join(", ");

/* ================= Shikaku: generatorius ir sprendiklis ================= */
function tiling(W, H, maxA, maxSide){
  const g = new Int16Array(W * H).fill(-1), rects = [];
  for(let y = 0; y < H; y++) for(let x = 0; x < W; x++){
    if(g[y * W + x] >= 0) continue;
    const opts = [];
    let mw = 0; while(x + mw < W && g[y * W + x + mw] < 0 && mw < maxSide) mw++;
    for(let w = 1; w <= mw; w++){
      let mh = 0;
      for(let h = 1; y + h <= H && h <= maxSide; h++){
        let ok = true; for(let xx = x; xx < x + w; xx++) if(g[(y + h - 1) * W + xx] >= 0){ ok = false; break; }
        if(!ok) break; mh = h;
      }
      for(let h = 1; h <= mh; h++){ const a = w * h; if(a <= maxA) opts.push({ w, h, wt: a === 1 ? 0.12 : a <= 3 ? 0.7 : 1 + Math.min(a, 8) * 0.15 }); }
    }
    let tot = 0; opts.forEach(o => tot += o.wt); let r = Math.random() * tot, pick = opts[0];
    for(const o of opts){ r -= o.wt; if(r <= 0){ pick = o; break; } }
    const id = rects.length; rects.push({ x, y, w: pick.w, h: pick.h });
    for(let yy = y; yy < y + pick.h; yy++) for(let xx = x; xx < x + pick.w; xx++) g[yy * W + xx] = id;
  }
  return rects;
}
function countSol(W, H, clues, limit){
  const N = W * H, at = new Int16Array(N).fill(-1); clues.forEach((c, i) => at[c.y * W + c.x] = i);
  const cands = clues.map((c, i) => {
    const res = [];
    for(let w = 1; w <= c.n; w++){
      if(c.n % w) continue; const h = c.n / w; if(w > W || h > H) continue;
      for(let x0 = Math.max(0, c.x - w + 1); x0 <= Math.min(c.x, W - w); x0++) for(let y0 = Math.max(0, c.y - h + 1); y0 <= Math.min(c.y, H - h); y0++){
        const cells = []; let ok = true;
        for(let yy = y0; yy < y0 + h && ok; yy++) for(let xx = x0; xx < x0 + w; xx++){ const k = yy * W + xx; if(at[k] >= 0 && at[k] !== i){ ok = false; break; } cells.push(k); }
        if(ok) res.push(cells);
      }
    }
    return res;
  });
  const used = new Uint8Array(N), placed = new Uint8Array(clues.length); let sols = 0;
  (function rec(n){
    if(sols >= limit) return;
    if(n === clues.length){ sols++; return; }
    let best = -1, bestList = null;
    for(let i = 0; i < clues.length; i++){
      if(placed[i]) continue;
      const list = cands[i].filter(cs => { for(let j = 0; j < cs.length; j++) if(used[cs[j]]) return false; return true; });
      if(best < 0 || list.length < bestList.length){ best = i; bestList = list; if(list.length <= 1) break; }
    }
    if(!bestList.length) return;
    placed[best] = 1;
    for(const cs of bestList){ cs.forEach(k => used[k] = 1); rec(n + 1); cs.forEach(k => used[k] = 0); if(sols >= limit) break; }
    placed[best] = 0;
  })(0);
  return sols;
}
function genPuzzle(W, H, maxA, o){
  o = o || {}; const maxSide = o.maxSide || Math.max(W, H);
  for(let t = 0; t < 400; t++){
    const rects = tiling(W, H, maxA, maxSide);
    const ones = rects.filter(r => r.w * r.h === 1).length, areas = new Set(rects.map(r => r.w * r.h));
    if(ones > Math.max(1, Math.round(W * H / 14)) || areas.size < (W >= 6 ? 4 : 3) || rects.length < (W * H) / (maxA * 0.8)) continue;
    const clues = rects.map(r => ({ x: r.x + R(0, r.w - 1), y: r.y + R(0, r.h - 1), n: r.w * r.h }));
    if(countSol(W, H, clues, 2) === 1) return { W, H, clues, sol: rects.map((r, i) => Object.assign({ ci: i }, r)) };
  }
  return null;
}
const rectCells = r => { const a = []; for(let y = r.y; y < r.y + r.h; y++) for(let x = r.x; x < r.x + r.w; x++) a.push([x, y]); return a; };
const inRect = (r, x, y) => x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h;
const overlap = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;

/* ================= lentos piešimas (Shikaku ir braižymo užduotys) ================= */
const C = 40, PAD = 6;
function boardSvg(st){
  const W = st.W, H = st.H, vw = W * C + PAD * 2, vh = H * C + PAD * 2; let h = "";
  h += `<rect x="0" y="0" width="${vw}" height="${vh}" fill="#6fb552"/>`;
  for(let y = 0; y < H; y++) for(let x = 0; x < W; x++) h += `<rect x="${PAD + x * C}" y="${PAD + y * C}" width="${C}" height="${C}" fill="${(x + y) % 2 ? "#a3dc7a" : "#98d46f"}"/>`;
  (st.obst || []).forEach(o => { h += `<use href="#g-${o.t}" x="${PAD + o.x * C + 2}" y="${PAD + o.y * C + 2}" width="${C - 4}" height="${C - 4}"/>`; });
  (st.plots || []).forEach((p, i) => {
    const px = PAD + p.x * C, py = PAD + p.y * C, cr = p.crop != null ? p.crop : (p.ci != null ? p.ci : i) % CROPS.length;
    h += `<rect x="${px}" y="${py}" width="${p.w * C}" height="${p.h * C}" fill="${CROPBG[cr]}"/>`;
    for(let yy = 0; yy < p.h; yy++) for(let xx = 0; xx < p.w; xx++){
      const isClue = (st.clues || []).some(c => c.x === p.x + xx && c.y === p.y + yy);
      if(!isClue || st.plotGlyphOnClue) h += `<use href="#g-${CROPS[cr]}" x="${px + xx * C + 6}" y="${py + yy * C + 6}" width="${C - 12}" height="${C - 12}" opacity=".95"/>`;
    }
    h += `<rect x="${px + 1.5}" y="${py + 1.5}" width="${p.w * C - 3}" height="${p.h * C - 3}" fill="none" stroke="#8a5a33" stroke-width="3.4" rx="3"/>`;
    [[px, py], [px + p.w * C, py], [px, py + p.h * C], [px + p.w * C, py + p.h * C]].forEach(q => { h += `<rect x="${q[0] - 4}" y="${q[1] - 4}" width="8" height="8" rx="2" fill="#6b3f1d" stroke="${K}" stroke-width="1.4"/>`; });
  });
  if(st.flag){
    const fx = PAD + st.flag.x * C + C / 2, fy = PAD + st.flag.y * C + C / 2;
    h += `<path d="M${fx - 8} ${fy + 14}V${fy - 14}" stroke="${K}" stroke-width="3" stroke-linecap="round"/><path d="M${fx - 8} ${fy - 14}h18l-5 7 5 7h-18z" fill="#ff4f5e" stroke="${K}" stroke-width="2" stroke-linejoin="round"/><ellipse cx="${fx - 8}" cy="${fy + 15}" rx="8" ry="3" fill="#121a33" opacity=".25"/>`;
  }
  (st.clues || []).forEach(c => {
    const cx = PAD + c.x * C + C / 2, cy = PAD + c.y * C + C / 2, fs = c.n >= 100 ? 14 : c.n >= 10 ? 19 : 22;
    h += `<rect x="${cx - 14}" y="${cy - 13}" width="28" height="26" rx="6" fill="#fff4d6" stroke="${K}" stroke-width="2.2"/>
      <path d="M${cx - 5} ${cy + 13}v4M${cx + 5} ${cy + 13}v4" stroke="${K}" stroke-width="2.2" stroke-linecap="round"/>
      <text x="${cx}" y="${cy + 1}" text-anchor="middle" dominant-baseline="middle" font-family="Grandstander,Chalkboard SE,sans-serif" font-weight="800" font-size="${fs}" fill="${K}">${c.n}</text>`;
  });

    ans.classList.add("done"); MK.unlock(); const ok = +b.dataset.i === cur.right;
    b.classList.add(ok ? "ok" : "no"); if(!ok) ans.children[cur.right].classList.add("ok");
    first(ok); if(ok){ award(10); MK.sfx.good(); } else MK.sfx.bad();
    addWhy(ok, cur.why, cur.ans); nextBtn();
  };
}
function boardUI(st, o){
  const host = $("bd"); const draw = () => { host.innerHTML = boardSvg(st); };
  draw(); attachBoard({ st, host, draw, onCommit: o.onCommit, onTapPlot: o.onTapPlot, onTapCell: o.onTapCell, locked: o.locked });

}
function showPuzzle(){
  let pz = null; const t = cur;
  for(let k = 0; k < 6 && !pz; k++) pz = genPuzzle(t.W, t.H, t.maxA);
  if(!pz) pz = genPuzzle(t.W, t.H, Math.max(4, t.maxA - 2)) || genPuzzle(5, 5, 8);
  const st = { W: pz.W, H: pz.H, clues: pz.clues, plots: [], prev: null, pend: null, flash: null, obst: [] };
  let invalid = 0, hints = 0, done = false; const undo = [];
  stage.innerHTML = `<div class="card fade"><p class="txt">${T.q3.intro(pz.W * pz.H, pz.clues.length)}</p><div class="board" id="bd"></div>
    <p class="note" id="note" role="status" aria-live="polite">${T.q3.help}</p>
    <div class="tools" id="tools"><button type="button" class="mk-btn alt" id="bU">↶ ${T.q3.undo}</button><button type="button" class="mk-btn alt" id="bH">💡 ${T.q3.hint}</button><button type="button" class="mk-btn ghost" id="bR">${T.q3.reset}</button></div></div><div id="flow"></div>`;
  const note = $("note"), say = (m, c) => { note.className = "note" + (c ? " " + c : ""); note.textContent = m; };
  const covered = () => st.plots.reduce((s, p) => s + p.w * p.h, 0);
  let ui;
  const complete = () => {
    done = true; $("tools").hidden = true; st.plotGlyphOnClue = false; ui.draw(); const ok = hints === 0 && invalid <= 3;
    first(ok); award(hints ? 4 : ok ? 10 : 6); MK.sfx.good(); say(T.q3.solved, "good");
    const list = pz.sol.map(r => `${r.w * r.h} = ${r.w} × ${r.h}`).join(", ");
    addWhy(true, { body: T.w3(list), more: `<p>${T.w3more}</p>` }); nextBtn();
  };
  const commit = r => {
    if(done) return;
    const ins = pz.clues.map((c, i) => ({ c, i })).filter(q => inRect(r, q.c.x, q.c.y));
    let msg = "";
    if(ins.length === 0) msg = T.q3.bad0; else if(ins.length > 1) msg = T.q3.bad2; else if(ins[0].c.n !== r.w * r.h) msg = T.q3.badA(r.w, r.h, r.w * r.h, ins[0].c.n);
    if(msg){ invalid++; st.flash = r; ui.draw(); ui.shake(); MK.sfx.bad(); say(msg, "warn"); setTimeout(() => { st.flash = null; ui.draw(); }, 700); return; }
    undo.push(st.plots.slice()); st.plots = st.plots.filter(p => !overlap(p, r)); st.plots.push(Object.assign({ ci: ins[0].i }, r));
    MK.sfx.tap(); ui.draw(); const left = st.W * st.H - covered(); say(left ? T.q3.open(left) : "", "");
    if(left === 0) complete();
  };
  ui = boardUI(st, { onCommit: commit, onTapCell: c => { if(done) return false; const q = pz.clues.find(z => z.x === c.x && z.y === c.y && z.n === 1); if(!q) return false; commit({ x: c.x, y: c.y, w: 1, h: 1 }); return true; }, onTapPlot: p => { if(done) return; undo.push(st.plots.slice()); st.plots = st.plots.filter(q => q !== p); MK.sfx.tap(); ui.draw(); say(T.q3.open(st.W * st.H - covered())); }, locked: () => done });
  $("bU").onclick = () => { if(done || !undo.length) return; st.plots = undo.pop(); st.pend = null; ui.draw(); MK.sfx.tap(); };
  $("bR").onclick = () => { if(done) return; undo.push(st.plots.slice()); st.plots = []; st.pend = null; ui.draw(); MK.sfx.tap(); say(T.q3.help); };
  $("bH").onclick = () => {
    if(done) return; MK.sfx.tap(); hints++;
    const same = (a, b) => a.x === b.x && a.y === b.y && a.w === b.w && a.h === b.h, wrong = st.plots.find(p => !pz.sol.some(s => same(s, p)));
    undo.push(st.plots.slice());
    if(wrong){ st.plots = st.plots.filter(p => p !== wrong); }
    else { const todo = pz.sol.filter(s => !st.plots.some(p => same(p, s))); if(!todo.length) return; const s = P(todo); st.plots = st.plots.filter(p => !overlap(p, s)); st.plots.push(Object.assign({}, s)); }
    ui.draw(); say(T.q3.hinted, "warn"); const left = st.W * st.H - covered(); if(left === 0) complete();
  };
  window.__pz = { pz, st, commit, get done(){ return done; } };
}
function showDraw(){
  const t = cur, A = t.A, B = t.B; let tries = 0, totalWrong = 0, phase = 0, done = false;
  const st = { W: t.W, H: t.H, obst: t.obst, flag: t.flag, clues: [], plots: [], prev: null, pend: null, flash: null, ghost: null };
  const q = T.q2, txt = () => t.kind === "two" ? (phase ? q.twoSecond(B) : q.two(A, B)) : t.kind === "free" ? q.free(A) : t.kind === "anchor" ? q.anchor(A) : t.kind === "width" ? q.width(A, t.wReq) : q.square(A);
  stage.innerHTML = `<div class="card fade"><p class="txt" id="qt">${txt()}</p><div class="board" id="bd"></div><p class="note" id="note" role="status" aria-live="polite">${T.hint2}</p></div><div id="flow"></div>`;
  const note = $("note"), say = (m, c) => { note.className = "note" + (c ? " " + c : ""); note.textContent = m; };
  let ui;
  const finishTask = ok => {
    done = true; const first1 = totalWrong === 0; first(first1); ui.draw();
    const body = (t.kind === "square" ? T.w2.sq(A, Math.sqrt(A)) + " " : "") + T.w2.pairs(A, pairsTxt(A)) + (B ? " " + T.w2.pairs(B, pairsTxt(B)) : "");
    if(ok){ award(totalWrong === 0 ? 10 : totalWrong <= 2 ? 6 : 3); MK.sfx.good(); say("", ""); addWhy(true, { body, more: "" }); }
    else { MK.sfx.bad(); say(T.fail2, "warn"); addWhy(false, { body, more: "" }, ""); }
    nextBtn();
  };
  const commit = r => {
    if(done) return; const res = checkDraw(t, r, phase ? st.plots[0] : null);
    if(!res.ok){
      tries++; totalWrong++; st.flash = r; ui.draw(); ui.shake(); MK.sfx.bad(); say(res.msg, "warn"); setTimeout(() => { st.flash = null; ui.draw(); }, 700);
      if(tries >= 3){ setTimeout(() => { const sol = t.sol; if(phase === 0){ st.plots = [Object.assign({ crop: 0 }, sol[0])]; if(sol[1]) st.plots.push(Object.assign({ crop: 3 }, sol[1])); } else st.plots.push(Object.assign({ crop: 3 }, sol[1])); st.flash = null; finishTask(false); }, 760); }
      return;
    }
    st.plots.push(Object.assign({ crop: phase ? 3 : 0 }, r)); MK.sfx.tap(); ui.draw();
    if(t.kind === "two" && phase === 0){ phase = 1; tries = 0; $("qt").textContent = txt(); say(q.twoSecond(B), "good"); return; }
    finishTask(true);
  };
  ui = boardUI(st, { onCommit: commit, locked: () => done });
  window.__dr = { t, st, commit, get done(){ return done; } };
}
function finish(){
  const total = tasks.length, stars = MK.starsFor(okN, total); MK.best(GAME, LEVELS[L].id, stars);
  const gain = villGot(solvedN()) - vill0;
  MK.result({ stars, title: `${okN} / ${total}`, text: T.res(okN, total, pts, gain),
    next: L < LEVELS.length - 1 ? () => start(L + 1) : null, again: () => start(L), menu: () => showMenu(gain ? vill0 : null) });
}
Object.defineProperty(window, "__cur", { get: () => cur });
window.__MK_TEST = { LV, t1, compTask, cmpTask, genDraw, checkDraw, genPuzzle, countSol, pairs, T, decomp, buildShape, loopsOf };
showMenu();
})();
