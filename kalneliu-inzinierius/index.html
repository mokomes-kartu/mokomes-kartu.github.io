<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MokomėsKartu">
<link rel="apple-touch-icon" href="/logo/mk-ikona-180.png">
<title>Kalnelių inžinierius – MokomėsKartu.lt</title>
<meta name="description" content="Matematikos žaidimas 12 klasei (VBE): išvestinės, liestinė, ekstremumai, didžiausioji ir mažiausioji reikšmės, optimizavimo uždaviniai – projektuok amerikietiškus kalnelius.">
<meta name="theme-color" content="#f2f5fb">
<link rel="icon" href="/logo/mk-ikona.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@600;700;800&display=swap">
<script src="/bendra/mk.js"></script>
<script src="tekstai.lt.js"></script>
<script src="uzduotys.js"></script>
<style>
/* Kalnelių inžinierius: brėžinių lentos stilius. Trasa = funkcijos grafikas, vagonėlio polinkis = išvestinė. */
body{--paper:#f2f5fb;--grid:#dde4f3;--soft:#4a5370;--kid:"Unbounded","Arial Black",system-ui,sans-serif;--ac:#e0422f;--ac-ink:#fff;--ac-soft:#ffe4dc;--blue:#2b59d9;--ok:#1f8a52}
.mk-ico[data-k="music"]{display:none}
.mk-lvl{border-radius:12px;box-shadow:inset 0 0 0 2.5px var(--ink),5px 5px 0 var(--ink);grid-template-columns:58px minmax(0,1fr) auto;gap:12px}
.mk-lvl-art{width:58px;height:58px;border-radius:10px;background:#e6edff}
.mk-lvl-art svg{width:50px;height:50px}
.mk-lvl-t b{font-size:15.5px;letter-spacing:-.02em}
.mk-lvl-t small{font-size:13px}
.mk-hero h1{letter-spacing:-.04em;font-size:clamp(28px,7.6vw,48px)}
.mk-hero p{max-width:44ch}
.mk-btn{border-radius:12px;font-size:16px}
.mk-res{border-radius:16px;box-shadow:inset 0 0 0 3px var(--ink),8px 8px 0 var(--ink)}
.mk-res .mk-owl{display:none}
.mk-res h2{font-size:22px;letter-spacing:-.03em}
.mk-sec{font-size:16px}
.mk-hero-art{width:min(460px,100%)}
.hero-card{background:#fff;border-radius:18px;padding:6px;box-shadow:inset 0 0 0 3px var(--ink),6px 6px 0 var(--ink)}
.hero-card svg{display:block;width:100%;height:auto;border-radius:12px}
.note{max-width:520px;margin:14px auto 0;color:var(--soft);font-size:13px;text-align:center}
i{font-family:Georgia,"Times New Roman",serif;font-style:italic}
sup,sub{font-size:.68em;line-height:0}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;font-size:.86em;line-height:1.1}
.fr>span{padding:0 .2em;white-space:nowrap}
.fr>span+span{border-top:.1em solid currentColor;padding-top:.06em}
.fn{display:block;margin:6px 0 2px;padding:8px 10px;border-radius:8px;background:#eef2ff;font:800 clamp(16px,4.6vw,19px)/1.5 var(--body);box-shadow:inset 0 0 0 2px #c9d4f5;overflow-wrap:anywhere}

/* parkas */
.park{max-width:520px;margin:0 auto}
.atts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px;padding:14px 10px 10px;background:#fff;border-radius:12px;box-shadow:inset 0 0 0 2.5px var(--ink)}
.att{display:grid;justify-items:center;gap:4px;text-align:center}
.att svg{width:100%;max-width:60px;height:auto;display:block}
.att span{font:800 11px/1.15 var(--body);overflow-wrap:anywhere}
.att.lock span{color:var(--soft);font-weight:700}
.att.fresh svg{animation:mkPop .6s cubic-bezier(.2,1.6,.4,1)}
.sbar{height:10px;border-radius:6px;background:#e5eafb;box-shadow:inset 0 0 0 2px var(--ink);margin:10px 0 4px;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--ac)}
.stext{margin:0;font:700 14px/1.4 var(--body);color:var(--soft)}

/* žaidimas */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:baseline;gap:6px;padding:7px 12px;border-radius:10px;background:#fff;font:800 16px/1 var(--kid);box-shadow:inset 0 0 0 2.5px var(--ink),3px 3px 0 var(--ink)}
.chip small{font:800 11px/1 var(--body);color:var(--soft);letter-spacing:.06em;text-transform:uppercase}
.card{background:#fff;border-radius:14px;padding:14px 12px 16px;box-shadow:inset 0 0 0 3px var(--ink),6px 6px 0 var(--ink)}
.chead small{display:block;font:800 12px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ac)}
.head{font:700 clamp(15px,4.2vw,17px)/1.45 var(--body);margin-top:6px}
.gwrap{margin:10px 0 2px;border-radius:10px;background:#fbfcff;box-shadow:inset 0 0 0 2px var(--ink);overflow:hidden}
.gwrap svg{display:block;width:100%;height:auto}
.done{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.done li{padding:7px 10px;border-radius:8px;background:#effcf6;box-shadow:inset 0 0 0 2px #9fdcbb;font:700 14px/1.4 var(--body)}
.done li.miss{background:#fff4f1;box-shadow:inset 0 0 0 2px #ffb3a6}
.done li b{font-weight:800}
.step{margin-top:12px;padding-top:12px;border-top:2px dashed #cfd6ea}
.step small{display:block;font:800 11.5px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-bottom:4px}
.q{font:800 clamp(15.5px,4.3vw,17.5px)/1.4 var(--body)}
.flds{display:flex;flex-wrap:wrap;align-items:center;gap:8px 6px;margin:12px 0 4px;font:800 clamp(17px,4.8vw,20px)/1.2 var(--body)}
.fg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.fld{min-width:52px;height:46px;padding:0 8px;border:0;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 2.5px #9aa5c4;font:800 19px/1 var(--body);cursor:pointer;color:var(--ink)}
.fld.act{box-shadow:inset 0 0 0 3px var(--blue);background:#eef2ff}
.fld.act:empty::after{content:"";display:inline-block;width:2px;height:20px;background:var(--blue);animation:blink 1s steps(2) infinite;vertical-align:middle}
.fld.bad{box-shadow:inset 0 0 0 3px var(--ac);background:#fff1ee}
.fld.good{box-shadow:inset 0 0 0 3px var(--ok);background:#effcf6}
@keyframes blink{50%{opacity:0}}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px;max-width:340px}
.pad button{height:46px;border:0;border-radius:9px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink),0 3px 0 var(--ink);font:800 19px/1 var(--body);cursor:pointer;touch-action:manipulation;color:var(--ink)}
.pad button:active{transform:translateY(2px);box-shadow:inset 0 0 0 2.5px var(--ink),0 1px 0 var(--ink)}
.pad .fnk{background:#e6edff}
.pad .wide{grid-column:span 2}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;align-items:center;gap:10px;min-height:50px;padding:8px 12px;border:0;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink);font:800 clamp(15.5px,4.4vw,18px)/1.35 var(--body);text-align:left;cursor:pointer;color:var(--ink)}
.opt::before{content:"";flex:none;width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 2.5px var(--ink);background:#fff}
.opt.sel{background:#eef2ff;box-shadow:inset 0 0 0 3px var(--blue)}
.opt.sel::before{background:var(--blue);box-shadow:inset 0 0 0 2.5px var(--ink),inset 0 0 0 5px #fff}
.opt.x{opacity:.45;text-decoration:line-through;pointer-events:none}
.gopts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.gopt{position:relative;padding:0;border:0;border-radius:10px;background:#fbfcff;box-shadow:inset 0 0 0 2.5px var(--ink);cursor:pointer;overflow:hidden}
.gopt svg{display:block;width:100%;height:auto}
.gopt b{position:absolute;left:6px;top:5px;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:#fff;box-shadow:inset 0 0 0 2px var(--ink);font:800 13px/1 var(--body)}
.gopt.sel{box-shadow:inset 0 0 0 4px var(--blue)}
.gopt.sel b{background:var(--blue);color:#fff}
.gopt.x{opacity:.4;pointer-events:none}
.signs{display:flex;align-items:stretch;margin:14px 0 4px}
.sgc{flex:1 1 0;min-width:0;display:grid;justify-items:center;gap:5px}
.sgb{width:min(100%,64px);height:48px;border:0;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink),0 3px 0 var(--ink);font:800 24px/1 var(--body);cursor:pointer;color:var(--ink);touch-action:manipulation}
.sgb.p{background:#dff6e8;color:var(--ok)}
.sgb.m{background:#ffe4dc;color:var(--ac)}
.sgb.z{background:#eef2ff;color:var(--blue)}
.sgl{font:800 12.5px/1.2 var(--body);color:var(--soft);text-align:center}
.sgl.big{font-size:16px;color:var(--ink)}
.sgp{flex:none;width:30px;display:grid;justify-items:center;align-content:end;gap:3px;padding-bottom:0}
.sgp i{display:block;width:3px;height:54px;background:var(--ink);border-radius:2px}
.sgp span{font:800 13px/1.2 var(--body)}
.hint{margin:6px 0 0;font:700 13px/1.4 var(--body);color:var(--soft)}
.go{width:100%;margin-top:12px}
.mk-why-m p{margin:5px 0}
.mk-why-m b,.mk-why-t p b{font-weight:800}
.mk-why-m{overflow-wrap:anywhere}
.cartg{transition:none}
@media (max-width:380px){.fld{min-width:46px}.flds{gap:8px 4px}}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <section id="menu">
    <div class="mk-hero">
      <div class="mk-hero-art" id="heroArt"></div>
      <h1 id="h1"></h1>
      <p id="heroP"></p>
    </div>
    <div id="levels"></div>
    <div class="park" id="park"></div>
    <div id="learn"></div>
    <p class="note" id="note"></p>
  </section>
  <section id="play" hidden>
    <div class="bar"><div id="dots"></div><span class="chip"><small id="ptsL"></small><span id="pts">0</span></span></div>
    <div id="board"></div>
    <div id="why"></div>
  </section>
</div>
<script>
(function(){
"use strict";
const GAME = "kalneliu-inzinierius", GRADES = [12], INK = "#121a33";
const T = window.MK_T, K = window.MK_KI, ev = K.ev, deriv = K.deriv;
const $ = id => document.getElementById(id);
const M = "−";
const num = K.num;

/* =================== grafikai =================== */
let gid = 0; const GEO = {};
function niceStep(range, n){ const raw = range / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function graphSvg(spec){
  const small = !!spec.small, W = small ? 170 : 340, H = small ? 128 : 230, mL = small ? 6 : 10, mR = small ? 6 : 10, mT = small ? 6 : 12, mB = small ? 6 : 12;
  const [xa, xb] = spec.x; let ya, yb;
  if(spec.small || (xa === -5 && xb === 5 && !spec.auto)){ ya = -6; yb = 6; }
  else {
    let lo = Infinity, hi = -Infinity; const see = y => { if(y < lo) lo = y; if(y > hi) hi = y; };
    spec.curves.forEach(c => { const [a, b] = c.dom || [xa, xb]; for(let i = 0; i <= 80; i++) see(ev(c.P, a + (b - a) * i / 80)); });
    (spec.pts || []).forEach(p => see(p.y)); see(0);
    if(spec.ymin != null) lo = Math.min(spec.ymin, lo);
    const pad = (hi - lo || 2) * 0.12; ya = lo - pad; yb = hi + pad;
  }
  const sx = x => mL + (x - xa) / (xb - xa) * (W - mL - mR), sy = y => H - mB - (y - ya) / (yb - ya) * (H - mT - mB);
  const id = "g" + (++gid); GEO[id] = { sx, sy, spec, xa, xb, ya, yb };
  let s = `<svg id="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${T.graphLabel}"><defs><clipPath id="${id}c"><rect x="${mL}" y="${mT}" width="${W - mL - mR}" height="${H - mT - mB}"/></clipPath></defs>`;
  /* tinklelis */
  const gx = niceStep(xb - xa, small ? 10 : 10), gy = niceStep(yb - ya, small ? 12 : 8);
  let grid = "";
  for(let x = Math.ceil(xa / gx) * gx; x <= xb + 1e-9; x += gx) grid += `M${sx(x).toFixed(1)} ${mT}V${H - mB}`;
  for(let y = Math.ceil(ya / gy) * gy; y <= yb + 1e-9; y += gy) grid += `M${mL} ${sy(y).toFixed(1)}H${W - mR}`;
  s += `<path d="${grid}" stroke="#dbe2f2" stroke-width="1" fill="none"/>`;
  /* ašys */
  const ax0 = Math.min(Math.max(0, xa), xb), ay0 = Math.min(Math.max(0, ya), yb), X0 = sx(ax0), Y0 = sy(ay0), an = spec.ax || ["x", "y"];
  s += `<path d="M${mL} ${Y0}H${W - mR - 1}M${X0} ${H - mB}V${mT + 1}" stroke="${INK}" stroke-width="${small ? 1.4 : 1.8}" fill="none"/>`;
  s += `<path d="M${W - mR} ${Y0}l-7-3.5v7zM${X0} ${mT}l-3.5 7h7z" fill="${INK}"/>`;
  if(!small){
    s += `<text x="${W - mR - 4}" y="${Y0 + 14 > H - 2 ? Y0 - 6 : Y0 + 14}" text-anchor="end" font-family="Georgia,serif" font-style="italic" font-size="13" fill="${INK}">${an[0]}</text><text x="${X0 + 8 > W - 12 ? X0 - 12 : X0 + 8}" y="${mT + 10}" font-family="Georgia,serif" font-style="italic" font-size="13" fill="${INK}">${an[1]}</text>`;
    if(!spec.plain){
      let lab = "";
      for(let x = Math.ceil(xa / gx) * gx; x <= xb - gx * 0.4; x += gx){ if(Math.abs(x) < 1e-9 || x <= xa + gx * 0.2) continue; lab += `<text x="${sx(x).toFixed(1)}" y="${Math.min(Y0 + 12, H - 2)}" text-anchor="middle">${num(x)}</text>`; }
      for(let y = Math.ceil(ya / gy) * gy; y <= yb - gy * 0.5; y += gy){ if(Math.abs(y) < 1e-9 || y <= ya + gy * 0.3) continue; lab += `<text x="${X0 - 4 < 16 ? X0 + 5 : X0 - 4}" y="${(sy(y) + 3.5).toFixed(1)}" text-anchor="${X0 - 4 < 16 ? "start" : "end"}">${num(y)}</text>`; }
      s += `<g font-family="Manrope,Arial,sans-serif" font-weight="700" font-size="9.5" fill="#6b7493">${lab}</g>`;
    }
  } else {
    let tk = ""; for(let x = Math.ceil(xa); x <= xb; x++) if(x) tk += `M${sx(x).toFixed(1)} ${Y0 - 2.5}v5`; for(let y = Math.ceil(ya); y <= yb; y++) if(y) tk += `M${X0 - 2.5} ${sy(y).toFixed(1)}h5`;
    s += `<path d="${tk}" stroke="${INK}" stroke-width="1"/><text x="${sx(1)}" y="${Y0 + 12}" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="9" fill="#6b7493">1</text>`;
  }
  s += `<g clip-path="url(#${id}c)">`;
  (spec.vl || []).forEach(x => { s += `<path d="M${sx(x)} ${mT}V${H - mB}" stroke="#8a93ad" stroke-width="1.6" stroke-dasharray="5 4"/>`; });
  (spec.lines || []).forEach(l => { s += `<path d="M${sx(xa)} ${sy(l.k * xa + l.b)}L${sx(xb)} ${sy(l.k * xb + l.b)}" stroke="${l.color}" stroke-width="2.2" ${l.dash ? 'stroke-dasharray="6 5"' : ""} fill="none"/>`; });
  spec.curves.forEach(c => {
    const [a, b] = c.dom || [xa, xb]; let d = "";
    for(let i = 0; i <= 140; i++){ const x = a + (b - a) * i / 140, y = Math.max(ya - 50 * (yb - ya), Math.min(yb + 50 * (yb - ya), ev(c.P, x))); d += (i ? "L" : "M") + sx(x).toFixed(1) + " " + sy(y).toFixed(1); }
    if(spec.track && c.color !== "#b9c2dc") s += `<path d="${d}" stroke="${INK}" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
    s += `<path d="${d}" stroke="${c.color}" stroke-width="${small ? 2.6 : spec.track ? 3.4 : 3}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  });
  if(spec.tan){ const t = spec.tan; s += `<path d="M${sx(xa)} ${sy(t.y0 + t.k * (xa - t.x0))}L${sx(xb)} ${sy(t.y0 + t.k * (xb - t.x0))}" stroke="#e0422f" stroke-width="2.4" stroke-dasharray="7 5" fill="none"/>`; }
  s += `</g>`;
  (spec.pts || []).forEach(p => {
    const px = sx(p.x), py = sy(p.y); if(py < mT - 2 || py > H - mB + 2) return;
    s += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${small ? 3.5 : 5}" fill="${p.color || "#ffd84d"}" stroke="${INK}" stroke-width="2"/>`;
    if(p.label){ const w = String(p.label).length * 6.4 + 8, lx = Math.min(Math.max(px, mL + w / 2 + 2), W - mR - w / 2 - 2), ly = py - 12 < mT + 10 ? py + 22 : py - 10;
      s += `<rect x="${(lx - w / 2).toFixed(1)}" y="${(ly - 11).toFixed(1)}" width="${w.toFixed(1)}" height="15" rx="4" fill="#fff" stroke="${INK}" stroke-width="1.2"/><text x="${lx.toFixed(1)}" y="${ly}" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-weight="800" font-size="11" fill="${INK}">${p.label}</text>`; }
  });
  if(spec.label){ const txt = spec.label.replace(/<\/?i>/g, ""); s += `<rect x="${mL + 4}" y="${mT + 2}" width="${txt.length * 7 + 12}" height="19" rx="5" fill="#fff" stroke="${INK}" stroke-width="1.4"/><text x="${mL + 10}" y="${mT + 16}" font-family="Georgia,serif" font-style="italic" font-weight="700" font-size="13" fill="${spec.curves[0].color}">${txt}</text>`; }
  if(spec.cart) s += `<g class="cartg" id="${id}k" opacity="0"><g transform="translate(0 -9)"><rect x="-11" y="-7" width="22" height="11" rx="3" fill="#ffd84d" stroke="${INK}" stroke-width="2"/><circle cx="-5" cy="-10" r="3.6" fill="#f5c9a0" stroke="${INK}" stroke-width="1.6"/><circle cx="4" cy="-10" r="3.6" fill="#f5c9a0" stroke="${INK}" stroke-width="1.6"/><circle cx="-6" cy="5.5" r="3.2" fill="#fff" stroke="${INK}" stroke-width="2"/><circle cx="6" cy="5.5" r="3.2" fill="#fff" stroke="${INK}" stroke-width="2"/></g></g>`;
  return s + `</svg>`;
}
function runCart(root){
  const svg = root.querySelector("svg[id]"); if(!svg) return; const g = GEO[svg.id]; if(!g || !g.spec.cart) return;
  const el = document.getElementById(svg.id + "k"), c = g.spec.cart, P = c.P, d = deriv(P);
  let a = (c.dom || [g.xa, g.xb])[0], b = c.at != null ? c.at : (c.dom || [g.xa, g.xb])[1];
  /* važiuojame tik matoma grafiko dalimi */
  const vis = x => { const y = ev(P, x); return y >= g.ya && y <= g.yb; };
  if(c.at != null){ let x = c.at; while(x > g.xa && vis(x - 0.05)) x -= 0.05; a = x; }
  else { while(a < b && !vis(a)) a += 0.05; while(b > a && !vis(b)) b -= 0.05; }
  const kx = g.sx(1) - g.sx(0), ky = g.sy(0) - g.sy(1), t0 = performance.now(), dur = c.at != null ? 1400 : 2600;
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion:reduce)").matches;
  const place = x => { const ang = Math.atan2(-ev(d, x) * ky, kx) * 180 / Math.PI; el.setAttribute("transform", `translate(${g.sx(x).toFixed(1)} ${g.sy(ev(P, x)).toFixed(1)}) rotate(${ang.toFixed(1)})`); };
  el.setAttribute("opacity", 1);
  if(reduce){ place(b); return; }
  (function tick(now){ if(!el.isConnected) return; const u = Math.min(1, (now - t0) / dur), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; place(a + (b - a) * e); if(u < 1) requestAnimationFrame(tick); })(t0);
}

/* =================== piešiniai =================== */
function heroSvg(){
  const P = [0, 3 * 1.2 * 2 * 6.2 * 0.05, -1.5 * 0.05 * 8.2 * 1.2, 0.05 * 1.2];   // dekoratyvi kubinė trasa
  const X = x => 30 + x * 34, Y = x => 150 - (ev(P, x) * 26 + 10);
  let d = ""; for(let i = 0; i <= 60; i++){ const x = i / 60 * 8.6; d += (i ? "L" : "M") + X(x).toFixed(1) + " " + Y(x).toFixed(1); }
  let sup = ""; for(let x = 0.4; x <= 8.4; x += 0.8) sup += `M${X(x).toFixed(1)} ${Y(x).toFixed(1)}V184`;
  const cx = 2.0, k = ev(deriv(P), cx), ang = Math.atan2(-k * 26, 34) * 180 / Math.PI;
  return `<svg viewBox="0 0 360 214" role="img" aria-label="Inžinierė su brėžiniu stovi prie amerikietiškų kalnelių trasos">

  const sum = scores.reduce((a, b) => a + b, 0), p = Math.round(10 * sum / scores.length), first = scores.every(s => s === 1), solved = scores.every(s => s > 0);
  pts += p; $("pts").textContent = pts; dots.mark(ti, first);
  if(first){ okN++; MK.set("mk-" + GAME + "-parkas", parkN() + 1); }
  draw(true);
  why.innerHTML = MK.why({ ok: solved, head: first ? T.okHead(MK.praise(), p) : solved ? T.partHead(p) : T.failHead, more: cur.sol, sum: T.solution, open: !first })
    + `<button type="button" class="mk-btn go" id="go">${ti < N - 1 ? T.next : T.results}</button>`;
  setTimeout(() => (cur.reveal ? board : why).scrollIntoView({ behavior: "smooth", block: cur.reveal ? "start" : "nearest" }), 80);
}
why.addEventListener("click", e => { if(!e.target.closest("#go")) return; MK.sfx.tap(); ti++; next(); window.scrollTo(0, 0); });
function finish(){
  const stars = MK.starsFor(okN, N); MK.best(GAME, Lv.id, stars);
  const have = attOwned(parkN()), had = attOwned(startPark), att = have > had ? T.park[have - 1] : "";
  MK.result({ stars, title: T.resTitle(okN, N), text: T.resText(pts, att),
    next: lvl < LEVELS.length - 1 ? () => start(lvl + 1) : null, again: () => start(lvl), menu: () => showMenu(att ? have - 1 : -1) });
}
window.__ki = { get cur(){ return cur; }, get si(){ return si; } };   // automatiniam testui
showMenu();
})();
</script>
