<script type="module">
import * as THREE from '/slibino-sala/three.module.min.js'; const { make: makeMouse, animate, DANCE } = window.MK_PELE; const { build, ITEMS } = window.MK_NAMAS;
const q = new URLSearchParams(location.search), W = innerWidth, H = innerHeight, r = new THREE.WebGLRenderer({ canvas: c, antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); r.setPixelRatio(2); r.shadowMap.enabled = true;
