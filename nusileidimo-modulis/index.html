<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nusileidimo modulis – MokomėsKartu.lt</title>
<meta name="description" content="Fizikos žaidimas 11 klasei (VBE): valdyk nusileidimo modulį Mėnulyje, Marse, Europoje, Titane, Ijo ir Ganimede – Niutono dėsniai, svoris, visuotinė trauka, judesio kiekis, energija, darbas, galia.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#eef0ec">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Nusileidimo modulis: šviesus techninio brėžinio stilius – popieriaus fonas, tušo linijos, oranžiniai akcentai. */
body{--paper:#eef0ec;--ink:#1c2330;--soft:#59636f;--kid:"Space Grotesk",system-ui,sans-serif;--body:"Space Grotesk",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --ac:#d9480f;--ac2:#1f5fbf;--line:#c2c8c3;--okc:#1b7a43;--warn:#c62828;background:#eef0ec;background-image:none;font-weight:500;color:var(--ink)}
.mk-app{max-width:760px;padding-block:6px 16px}
.mk-top{padding-bottom:8px}
.mk-back,.mk-ico{border-radius:4px;border-width:1.5px;box-shadow:none;height:40px}
.mk-ico{width:40px}.mk-ico[data-k="music"]{display:none}
.mk-title{font:700 15px/1.1 var(--body);letter-spacing:.08em;text-transform:uppercase}
.kick{font:700 11px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
h1{margin:6px 0;font:700 clamp(30px,8vw,42px)/1.02 var(--body);letter-spacing:-.02em}
.lead{margin:0 0 14px;font-size:15.5px;line-height:1.5;color:#2a3340;max-width:60ch}
.hero{display:block;width:100%;height:auto;border:1.5px solid var(--ink);border-radius:4px;background:#f7f8f5;margin-bottom:12px}
.card{background:#fff;border:1.5px solid var(--ink);border-radius:4px;padding:12px 14px;margin:0 0 12px}
.card h2{margin:0 0 6px;font:700 11px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.card p{margin:0 0 4px;font-size:14px;line-height:1.45}
.rank{font:700 20px/1.2 var(--body)}
.bars{display:inline-flex;gap:3px;vertical-align:middle;margin-left:8px}
.bars i{width:8px;height:14px;background:#d5dad5}.bars i.on{background:var(--ac)}
.smp{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:8px 0 6px}
.smp i{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:4px;display:grid;place-items:center;font:700 10px/1 var(--mono);color:#aab1ab;font-style:normal}
.smp i.on{border:1.5px solid var(--ink);color:var(--ink)}
.smp i.on span{width:58%;height:58%;border-radius:50% 46% 54% 48%;border:1.5px solid var(--ink);display:block}
.sm{font-size:12.5px;color:var(--soft);line-height:1.45}
.mis{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:2px 12px;align-items:center;width:100%;text-align:left;background:#fff;border:1.5px solid var(--ink);border-radius:4px;padding:11px 12px;margin:0 0 8px;cursor:pointer;font:inherit;color:inherit}
.mis:hover{background:#fafbf8}.mis:active{transform:translateY(1px)}
.mis svg{grid-row:1/span 3;width:54px;height:54px}
.mis b{font:700 17px/1.2 var(--body)}
.mis b small{font:700 10.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--soft);margin-left:6px}
.mis span{grid-column:2;font-size:13.5px;line-height:1.35;color:#2a3340}
.mis code{grid-column:2;font:500 11px/1.35 var(--mono);color:var(--soft)}
.mis .stars{grid-row:1/span 3;grid-column:3;font:700 15px/1 var(--mono);letter-spacing:2px;color:#c5cbc5}
.mis .stars u,.big u{text-decoration:none;color:var(--ac)}
.tag{display:inline-block;font:700 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.05em;border:1.5px solid var(--ink);border-radius:2px;padding:2px 5px;margin-left:6px;vertical-align:2px}
details.man{background:#fff;border:1.5px solid var(--line);border-radius:4px;padding:0 14px;margin:0 0 6px}
details.man summary{cursor:pointer;font-weight:700;font-size:15px;padding:12px 0;list-style:none}
details.man summary::-webkit-details-marker{display:none}
details.man summary::before{content:"+ ";font-family:var(--mono);color:var(--ac)}
details.man[open] summary::before{content:"− "}
details.man p,.intro p{margin:0 0 10px;font-size:14.5px;line-height:1.5}
.ex{background:#fbefe6;border-left:3px solid var(--ac);padding:8px 10px;font-family:var(--mono);font-size:12.5px;line-height:1.6}
.note{color:var(--soft);font-size:12.5px;line-height:1.45;margin:12px 0 0}

#game{position:relative;user-select:none;-webkit-user-select:none}
.sbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:6px}
.sbar button{width:38px;height:38px;border:1.5px solid var(--ink);border-radius:4px;background:#fff;font:700 14px/1 var(--mono);cursor:pointer;padding:0;color:var(--ink)}
.sbar .m{font:500 11px/1.3 var(--mono);color:#2a3340;overflow:hidden}
.sbar .m b{display:block;font:700 13px/1.2 var(--body);color:var(--ink);letter-spacing:.04em;text-transform:uppercase}
#cv{display:block;width:100%;border:1.5px solid var(--ink);border-radius:4px;background:#f4f5f2;touch-action:none}
.tip{min-height:34px;display:flex;align-items:center;font:500 12px/1.3 var(--mono);color:#2a3340;padding:4px 2px}
.ctl{display:grid;grid-template-columns:68px 68px minmax(0,1fr) minmax(118px,150px);gap:8px;touch-action:none}
.cb{height:68px;border:1.5px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);font:700 22px/1 var(--mono);cursor:pointer;touch-action:none;padding:0;-webkit-tap-highlight-color:transparent}
.cb.on{background:#e3e8e3;transform:translateY(1px)}
.cb.eng{grid-column:4;background:var(--ac);color:#fff;border-color:var(--ink);font:700 15px/1.15 var(--body);letter-spacing:.06em}
.cb.eng small{display:block;font:500 10.5px/1.2 var(--mono);opacity:.85;letter-spacing:.03em;margin-top:3px}
.cb.eng.on{background:#b53a08}
.cb.eng.rel{background:var(--ink)}
.keys{font:500 11px/1.4 var(--mono);color:var(--soft);margin-top:8px;display:none}
@media (hover:hover) and (pointer:fine){.keys{display:block}}

#ov:empty{display:none}
#ov{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(28,35,48,.32)}
#ov.clear{background:transparent;pointer-events:none}
#ov.clear>*{pointer-events:auto}
.sheet{width:min(100%,560px);max-height:94dvh;overflow:auto;background:#fff;border:1.5px solid var(--ink);border-bottom:0;border-radius:6px 6px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
@media (min-width:700px){#ov{align-items:center}.sheet{border-bottom:1.5px solid var(--ink);border-radius:6px}}
.ch{font:700 10.5px/1.4 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--soft);display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.ch b{color:var(--ac)}
.qq{margin:0 0 6px;font-size:15.5px;line-height:1.5}
.rnd{margin:0 0 10px;font:500 12px/1.4 var(--mono);color:var(--soft)}
.ansrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;margin-bottom:8px}
.disp{height:48px;border:1.5px solid var(--ink);border-radius:4px;background:#f7f8f5;font:700 24px/46px var(--mono);padding:0 12px;overflow:hidden;white-space:nowrap}
.disp:empty::before{content:attr(data-ph);color:#aab1ab;font-weight:500;font-size:15px}
.disp.cur::after{content:"";display:inline-block;width:2px;height:24px;background:var(--ac);vertical-align:-4px;margin-left:2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.unit{font:700 17px/1 var(--mono);min-width:44px}
.fb{font-size:14.5px;line-height:1.5;margin:0 0 10px;padding:9px 11px;border-left:3px solid var(--line);background:#f4f5f2}
.fb:empty{display:none}
.fb.ok{border-color:var(--okc);background:#e9f5ee}.fb.bad{border-color:var(--warn);background:#fbecec}
.fb b{font-weight:700}
.fb .sol{display:block;margin-top:6px;font:500 13px/1.6 var(--mono)}
.pad{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-bottom:10px}
.pad button{height:46px;border:1.5px solid var(--ink);border-radius:4px;background:#fff;font:700 19px/1 var(--mono);cursor:pointer;color:var(--ink);padding:0}
.pad button:active{background:#e3e8e3}
.btn{display:block;width:100%;min-height:50px;border:1.5px solid var(--ink);border-radius:4px;background:var(--ink);color:#fff;font:700 15.5px/1.2 var(--body);letter-spacing:.03em;cursor:pointer;padding:8px 12px}
.btn.sec{background:#fff;color:var(--ink)}
.btn.or{background:var(--ac)}
.btn+.btn,.row2+.btn{margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .btn+.btn{margin-top:0}
.rw{margin:10px 0 0;font:500 11.5px/1.45 var(--mono);color:var(--soft)}
.peek{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:auto;min-height:44px;z-index:31}
.rep h3,.outc h3{margin:0 0 2px;font:700 22px/1.15 var(--body)}
.rep .who{font:700 11px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-bottom:6px}
.big{font:700 30px/1 var(--mono);letter-spacing:6px;color:#c5cbc5;margin:6px 0 8px}
.rep ul{list-style:none;margin:8px 0 12px;padding:0;border-top:1.5px solid var(--line)}
.rep li{padding:7px 0;border-bottom:1.5px solid var(--line);font-size:14px;line-height:1.4}
.rep li small{display:block;font:500 11.5px/1.4 var(--mono);color:var(--soft)}
.outc p{margin:6px 0 10px;font-size:14.5px;line-height:1.5}
sup,sub{font-size:.72em;line-height:0}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <main id="menu">
    <svg class="hero" viewBox="0 0 560 200" role="img" aria-label="Nusileidimo modulio brėžinys">
      <defs><pattern id="gr" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dfe3de" stroke-width="1"/></pattern></defs>
      <rect width="560" height="200" fill="url(#gr)"/>
      <path d="M0 168q60-14 120-4t110-6 120 6 110-8 100 6v38H0z" fill="#d7dbd6" stroke="#1c2330" stroke-width="1.5"/>
      <g stroke="#1c2330" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
        <path d="M248 118l-26 40M312 118l26 40M262 124l-34 30M298 124l34 30" fill="none"/>
        <path d="M214 158h16M330 158h16" stroke-width="3"/>
        <path d="M244 96h72l8 10v18l-8 8h-72l-8-8v-18z" fill="#e2b04a"/>

      <g font-family="JetBrains Mono,monospace" font-size="10.5" font-weight="700" fill="#1c2330" stroke="#1c2330" stroke-width="1">
        <path d="M356 96v62M352 96h8M352 158h8" fill="none"/><text x="364" y="131" stroke="none">mg ↓</text>

        <text x="386" y="60" stroke="none">ma = F − mg</text><text x="386" y="78" stroke="none" fill="#59636f">h = v² / 2a</text>

    <div class="kick" id="kick"></div>
    <h1 id="h1"></h1>
    <p class="lead" id="lead"></p>
    <section class="card" id="lic"></section>
    <div class="kick" id="misT" style="margin:14px 0 8px"></div>
    <div id="mlist"></div>
    <div class="kick" id="manT" style="margin:16px 0 8px"></div>

  </main>
  <main id="game" hidden>
    <div class="sbar"><button type="button" id="quit" aria-label="Nutraukti misiją">✕</button><div class="m" id="minfo"></div><button type="button" id="bPause" aria-label="Pauzė">II</button></div>

      <button type="button" class="cb" id="bL">◀</button>

<div id="ov"></div>
<script>
"use strict";
const T = window.MK_T, U = window.NM_U, n = T.n, GAME = "nusileidimo-modulis", CKEY = "mk-nusileidimo-modulis-karjera", SKEY = "mk-nusileidimo-modulis-matyta", $ = id => document.getElementById(id);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x)), mix = (a, b, t) => a + (b - a) * t, sstep = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const hsh = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

/* ---------- misijos: tikri g, M, R; modulio parametrai parinkti patogiam skrydžiui ---------- */
const MIS = [
  { g: 1.62, m: 2000, F: 8000, u: 2500, M: 7.35e22, R: 1737, H: 300, vx: 5, padA: 150, padB: -280, burn: 25, amp: 13, seed: 3, pools: ["N"], nT: 4, pre: 2, th: "moon" },
  { g: 3.71, m: 1500, F: 12000, u: 3000, M: 6.42e23, R: 3390, H: 280, vx: -5, padA: -160, padB: 300, burn: 24, amp: 17, seed: 8, pools: ["S"], nT: 4, pre: 2, th: "mars" },
  { g: 1.31, m: 2400, F: 7200, u: 2400, M: 4.80e22, R: 1561, H: 280, vx: 6, padA: 190, padB: -300, burn: 32, amp: 7, seed: 14, pools: ["J"], nT: 4, pre: 2, th: "europa" },
  { g: 1.35, m: 1800, F: 5400, u: 2700, M: 1.345e23, R: 2575, H: 320, vx: -4, padA: -170, padB: 280, burn: 24, amp: 9, seed: 21, pools: ["E"], nT: 4, pre: 2, th: "titan", vt: 16 },
  { g: 1.80, m: 2500, F: 10000, u: 2500, M: 8.93e22, R: 1821.5, H: 300, vx: 6, padA: 230, padB: -300, burn: 32, amp: 15, seed: 29, pools: ["K", "M"], nT: 5, pre: 2, th: "io", mesa: 36 },
  { g: 1.43, m: 3000, F: 9000, u: 3000, M: 1.482e23, R: 2631, H: 320, vx: -7, padA: -300, padB: 380, burn: 38, amp: 15, seed: 37, pools: ["N", "S", "J", "E", "K", "M"], nT: 6, pre: 3, th: "gany", hard: 1 }
];
const TH = {
  moon: { sky: ["#f5f6f3", "#dde2e6"], far: ["#d3d8dc", "#c2c8cd"], gr: ["#cdd1d3", "#a9afb4"], dust: "#b4b9bd", body: "earth", stars: 1 },
  mars: { sky: ["#faf1e8", "#f0dcc9"], far: ["#e6c5ab", "#d9ad8e"], gr: ["#d6a07e", "#b97b5b"], dust: "#d9ab8c", body: "sun" },
  europa: { sky: ["#f4f7f9", "#dce8ef"], far: ["#d3e0e8", "#c0d2dd"], gr: ["#eaf1f5", "#c2d3dd"], dust: "#e3ecf1", body: "jupiter", stars: 1, cracks: 1 },
  titan: { sky: ["#fcf3de", "#f1dcae"], far: ["#e8cc92", "#dbb977"], gr: ["#cca562", "#aa8446"], dust: "#d9b97f", body: "saturn" },
  io: { sky: ["#f8f6e6", "#ede8c0"], far: ["#e2d894", "#d4c672"], gr: ["#dccb66", "#b9a843"], dust: "#e4da8e", body: "jupiter", stars: 1, volcano: 1 },
  gany: { sky: ["#f3f3f0", "#dfded7"], far: ["#ccc9be", "#bab6a8"], gr: ["#bab4a5", "#989182"], dust: "#c3bdaf", body: "jupiter", stars: 1, cracks: 2 }
};
const INK = "#1c2330", AC = "#d9480f", FEET = 4;

/* ---------- reljefas ---------- */
function mkGround(c){
  const ws = [[0.0105, 1], [0.0233, 0.55], [0.0471, 0.28], [0.0983, 0.11]], ph = ws.map((_, i) => hsh(c.seed + i) * 6.283);
  const raw = x => { let y = 0; for(let i = 0; i < 4; i++) y += ws[i][1] * Math.sin(ws[i][0] * x + ph[i]); y *= c.amp; if(c.mesa){ const d = (x - c.padA) / 135; y += c.mesa * Math.exp(-d * d); } return y; };
  const pads = [{ x: c.padA, w: 21, k: "A" }, { x: c.padB, w: 13, k: "B" }]; pads.forEach(p => p.y = raw(p.x));
  const f = x => { for(const p of pads){ const d = Math.abs(x - p.x); if(d < p.w + 34) return d <= p.w ? p.y : mix(p.y, raw(x), sstep((d - p.w) / 34)); } return raw(x); };
  f.pads = pads; return f;
}

/* ---------- būsena ---------- */
if(!CanvasRenderingContext2D.prototype.roundRect) CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h){ this.rect(x, y, w, h); };
let S = null, cv = $("cv"), cx = cv.getContext("2d"), W = 360, Hh = 480, DPR = 1, raf = 0, last = 0;
const key = { l: 0, r: 0, e: 0 };
const career = () => Object.assign({ land: 0, soft: 0, ok: 0, all: 0, smp: {}, intro: 0 }, MK.get(CKEY, {}));

function newMission(mi){
  const c = MIS[mi], seen = MK.get(SKEY, {});
  const ids = U.choose(c.pools, c.nT, seen, { hard: c.hard });
  /* viena „gyva“ užduotis skrydžio metu: jei tarp parinktų yra tokia, ji eina į vidurį */
  const li = ids.findIndex((id, i) => i >= 1 && U.byId[id].live); if(li >= 0){ const [x] = ids.splice(li, 1); ids.splice(c.pre, 0, x); }
  const tasks = ids.map((id, i) => ({ id, phase: i < c.pre ? "pre" : i === c.pre ? "mid" : "post", res: null }));
  ids.forEach(id => seen[id] = (seen[id] || 0) + 1); MK.set(SKEY, seen);
  const s = { mi, c, t: T.missions[mi], th: TH[c.th], gnd: mkGround(c), tasks, ti: 0, bonus: 0, okN: 0, retries: 0, marker: false, mode: "pre", crashes: 0, midDone: false, auto: false, parts: [], time: 0, shake: 0, out: null };
  resetFlight(s); return s;
}
function resetFlight(s){
  const c = s.c; s.x = 0; s.y = s.gnd(0) + c.H + FEET; s.vx = 0; s.vy = 0; s.ang = 0; s.thr = 0; s.fuel = c.burn * (1 + s.bonus); s.fuel0 = s.fuel;
  s.cam = { x: 0, y: s.gnd(0) + 120, hm: 450 }; s.car = { x: 0, y: s.y + 13, vy: 0, away: 0 }; s.parts = []; s.landed = null; s.beeped = false; s.touch = null; s.ign = 0;
  camUpdate(s, 1);
}
const alt = s => s.y - FEET - s.gnd(s.x);
const ctxOf = (s, live) => ({ g: s.c.g, m: s.c.m, F: s.c.F, u: s.c.u, M: s.c.M, R: s.c.R, live });

/* ---------- fizika ---------- */
function autopilot(s){
  const p = s.gnd.pads[0], a = alt(s), dx = p.x - s.x, an = s.c.F / s.c.m - s.c.g, far = Math.abs(dx) > 16;

/* ---------- borto kompiuteris: skaičiavimai ---------- */
let task = null;

  task = { tk, t, txt, tries: 0, val: "", done: false, at: performance.now() }; if(s.mode === "fly") s.mode = "task"; key.l = key.r = key.e = 0;
  $("ov").className = ""; $("ov").innerHTML = `<div class="sheet" id="sheet"><div class="ch"><span>${C.head} · <b>${C[tk.phase]}</b></span><span>${C.of(k, s.tasks.length)}</span></div>
    <p class="qq">${txt.q}</p><p class="rnd">${C.round[t.dec]}</p>
    <div class="ansrow"><div class="disp cur" id="disp" data-ph="${C.ans}"></div><span class="unit">${t.unit}</span></div>
    <div class="fb" id="fb"></div>
    <div class="pad" id="pad">${["1", "2", "3", "4", "5", "⌫", "6", "7", "8", "9", "0", ","].map(k => `<button type="button" data-k="${k}">${k}</button>`).join("")}</div>
    <button type="button" class="btn or" id="chk">${C.check}</button>
    ${tk.phase === "mid" ? `<button type="button" class="btn sec" id="peek">${C.peek}</button>` : ""}

}

    let msg; if(tk.phase === "post") msg = C.okPost; else { const f = task.tries === 1 ? 15 : 7; s.bonus += f / 100; s.fuel += s.c.burn * f / 100; s.fuel0 = Math.max(s.fuel0, s.fuel); msg = (task.tries === 1 ? C.ok1 : C.ok2)(f); if(s.okN >= 2 && !s.marker){ s.marker = true; msg += " " + C.marker; } }

$("ov").addEventListener("click", e => {

/* ---------- tūpimo baigtis, ataskaita ---------- */
function outcome(s){

    const why = tc.sl >= 14 && tc.vv <= 6 && tc.vh <= 4 && tc.ad <= 25 ? O.crashS : tc.ad > 25 && tc.vv <= 6 && tc.vh <= 4 ? O.crashA(Math.round(tc.ad)) : O.crashV(n(tc.vv, 1), n(tc.vh, 1));
    $("ov").className = ""; $("ov").innerHTML = `<div class="sheet outc"><div class="ch"><span>${T.comp.head}</span></div><h3>${tc.ad > 25 || tc.sl >= 14 ? O.tip : O.crash}</h3><p>${why} ${O.crashWhy}</p>
      <button type="button" class="btn or" data-a="retry">${O.retry}</button>${s.crashes >= 2 ? `<button type="button" class="btn sec" data-a="auto">${O.auto1}</button>` : ""}<p class="rw">${O.retryNote}${s.crashes >= 2 ? " " + O.autoNote : ""}</p></div>`;
    return;
  }
  $("ov").className = "clear"; $("ov").innerHTML = `<div class="sheet outc"><div class="ch"><span>${T.comp.head}</span></div><h3>${tc.auto ? O.auto : (tc.kind === "soft" ? O.soft : O.hard) + " – " + where}</h3><p>${T.rep.touch(n(tc.vv, 1), n(tc.vh, 1), Math.round(tc.ad))}. ${tc.auto ? "" : tc.kind === "soft" ? O.softD : O.hardD}</p><button type="button" class="btn" data-a="post">${T.comp.cont}</button></div>`;
}
function report(){
  const s = S, c = s.c, tc = s.touch, R = T.rep, O = T.out;
  const landPts = tc.auto ? 0 : Math.max(0, (tc.kind === "soft" ? (tc.pad ? 30 : 15) : (tc.pad ? 18 : 8)) + Math.round(10 * clamp(tc.fuel / c.burn, 0, 1)) - 5 * s.retries);
  const taskPts = s.tasks.reduce((a, t) => a + (t.res === 1 ? 15 : t.res === 2 ? 8 : 0), 0), max = 15 * s.tasks.length + 40, pts = landPts + taskPts, fr = pts / max;
  const stars = fr >= 0.85 ? 3 : fr >= 0.6 ? 2 : fr >= 0.3 ? 1 : 0, first = s.tasks.filter(t => t.res === 1).length;
  MK.best(GAME, s.t.id, stars);
  const C = career(); C.land++; if(tc.kind === "soft" && !tc.auto) C.soft++; C.ok += first; C.all += s.tasks.length;
  let smp = R.noSample; if(tc.kind === "soft" && tc.pad && !tc.auto){ const i = tc.pad === "B" ? 1 : 0, have = (C.smp[s.t.id] || [0, 0]); smp = have[i] ? R.sampleHave(s.t.sample[i]) : R.sample(s.t.sample[i]); have[i] = 1; C.smp[s.t.id] = have; }

  $("ov").className = ""; $("ov").innerHTML = `<div class="sheet rep"><div class="ch"><span>${R.head}</span></div><div class="who">${s.t.name} · ${s.t.site}</div><div class="big">${[0, 1, 2].map(i => i < stars ? "<u>★</u>" : "★").join("")}</div><h3>${R.pts(pts, max)}</h3><p class="qq">${R.stars[stars]}</p>
    <ul><li>${R.landing}: ${tc.auto ? O.auto : (tc.kind === "soft" ? O.soft : O.hard) + " – " + where}<small>${R.touch(n(tc.vv, 1), n(tc.vh, 1), Math.round(tc.ad))} · ${R.fuel(Math.round(tc.fuel / c.burn * 100))}${s.retries ? " · " + R.retries(s.retries) : ""}</small></li>

  else beginTasks();
}
const disc = (th, i) => { const t = TH[th]; return `<svg viewBox="0 0 54 54" aria-hidden="true"><circle cx="27" cy="27" r="23" fill="${t.gr[0]}" stroke="#1c2330" stroke-width="1.5"/><path d="M8 ${20 + i}q19 ${6 - i} 38 0M6 ${31 - i}q21 -7 42 2" fill="none" stroke="${t.gr[1]}" stroke-width="3"/><circle cx="${18 + i * 3}" cy="${36 - i * 2}" r="4" fill="${t.far[1]}" stroke="#1c2330" stroke-width="1"/><path d="M27 4a23 23 0 0 1 0 46a30 30 0 0 0 0-46z" fill="rgba(28,35,48,.14)"/></svg>`; };
function showMenu(){
  S = null; task = null; $("ov").innerHTML = ""; $("game").hidden = true; $("menu").hidden = false;
  const best = MK.best(GAME), tot = Object.values(best).reduce((a, b) => a + (+b || 0), 0), rk = T.ranks[tot >= 17 ? 4 : tot >= 12 ? 3 : tot >= 7 ? 2 : tot >= 3 ? 1 : 0], C = career();
  const got = T.missions.reduce((a, m) => a + ((C.smp[m.id] || [0, 0])[0] ? 1 : 0) + ((C.smp[m.id] || [0, 0])[1] ? 1 : 0), 0);
  $("lic").innerHTML = `<h2>${T.logT}</h2><p class="rank">${rk}<span class="bars">${Array.from({ length: 18 }, (_, i) => `<i${i < tot ? ' class="on"' : ""}></i>`).join("")}</span></p><p>${T.career(C)}</p>
    <h2 style="margin-top:12px">${T.samplesT} · ${T.sampleN(got, 12)}</h2><div class="smp">${T.missions.map((m, i) => [0, 1].map(k => { const on = (C.smp[m.id] || [0, 0])[k]; return `<i class="${on ? "on" : ""}" title="${on ? m.sample[k] : ""}">${on ? `<span style="background:${TH[MIS[i].th].gr[k]}"></span>` : m.name.slice(0, 2).toUpperCase() + (k ? "·B" : "·A")}</i>`; }).join("")).join("")}</div><p class="sm">${T.sampleHint}</p>`;
  $("mlist").innerHTML = T.missions.map((m, i) => { const c = MIS[i]; return `<button type="button" class="mis" data-i="${i}">${disc(c.th, i)}<b>${m.name}<small>${m.site}</small>${c.hard ? `<span class="tag">${T.exam}</span>` : ""}</b><span>${m.sub}</span><code>g = ${n(c.g)} m/s² · ${T.tasksN(c.nT)}</code><span class="stars" aria-label="${best[m.id] || 0} iš 3">${[0, 1, 2].map(k => k < (best[m.id] || 0) ? "<u>★</u>" : "★").join("")}</span></button>`; }).join("");
  window.scrollTo(0, 0);
}
$("mlist").addEventListener("click", e => { const b = e.target.closest("[data-i]"); if(b) start(+b.dataset.i); });
$("quit").onclick = () => { MK.sfx.tap(); showMenu(); };
window.addEventListener("resize", () => { if(S){ fit(); draw(S); } });
$("app").prepend(MK.top({ title: T.title, grade: 11 }));
$("kick").textContent = T.kicker; $("h1").textContent = T.h1; $("lead").textContent = T.lead; $("note").textContent = T.note; $("misT").textContent = T.missionsT; $("manT").textContent = T.manualT;
$("manual").innerHTML = T.manual.map(m => `<details class="man"><summary>${m.name}</summary>${m.html}</details>`).join("");
$("bL").setAttribute("aria-label", T.ctl.left); $("bR").setAttribute("aria-label", T.ctl.right);
window.__nm = { get S(){ return S; }, get task(){ return task; }, MIS, key, step, alt, autopilot };
showMenu(); raf = requestAnimationFrame(loop);
</script>
