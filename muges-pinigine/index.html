<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mugės piniginė – MokomėsKartu.lt</title>
<meta name="description" content="2 klasės matematikos žaidimas apie pinigus: sumokėk tiksliai monetomis ir banknotais, sudėk tą pačią sumą kitaip, apskaičiuok naują kainą, dviejų pirkinių kainą ir grąžą.">
<meta name="theme-color" content="#fff9e6">
<link rel="icon" href="/logo/mk-ikona.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800&family=Manrope:wght@600;700;800&display=swap">
<script src="/bendra/mk.js"></script>
<script src="/muges-pinigine/tekstai.lt.js"></script>
<style>
/* Meniu: mugės prekystalis, pirkinių kolekcija, lygiai. Užduotis: prekystalio scena, klausimas, padėklas „Ant prekystalio“,
   piniginė (baigtiniai pinigai) arba kasa (neriboti pinigai), pelėdžiuko užuomina ir mygtukas. */
body{--ac:#e8590c;--ac-ink:#fff;--ac-soft:#ffe8d6}
@media (max-width:380px){.mk-title{font-size:17px}}
.mk-hero{padding-top:0}
.mk-hero h1{margin-top:8px;font-size:clamp(34px,8.6vw,54px)}
.mk-hero p{max-width:40ch;font-size:16.5px}
.art{width:min(100%,480px);border-radius:24px;overflow:hidden;position:relative;box-shadow:0 6px 0 rgba(18,26,51,.15);background:#cfeefc}
.art svg{display:block;width:100%;height:auto}
.art::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 3px var(--ink);pointer-events:none}
.col{width:100%;max-width:520px;margin:0 auto 14px;padding:12px 14px 14px;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 2.5px var(--ink),0 5px 0 rgba(18,26,51,.14)}
.col h2{margin:0;font:800 19px/1.2 var(--kid)}
.col p{margin:4px 0 10px;color:var(--soft);font-weight:700;font-size:14.5px}
.shelf{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.gd{border-radius:12px;background:#fff6ea;box-shadow:inset 0 0 0 2px var(--ink);padding:3px;aspect-ratio:1;display:grid;place-items:center}
.gd svg{display:block;width:100%;height:auto}
.gd.off{background:#f3efe2;box-shadow:inset 0 0 0 2px #cfc4a2}
.gd.off svg{opacity:.22;filter:grayscale(1)}
.gd.new{animation:mkPop .6s cubic-bezier(.2,1.6,.4,1)}

.hud{display:flex;align-items:center;gap:8px;margin:0 0 8px;min-height:36px}
.hud .mk-dots{margin-right:auto;justify-content:flex-start}
.chip{display:inline-flex;align-items:baseline;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink);font:800 17px/36px var(--kid);white-space:nowrap}
.chip small{font:800 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.chip.pop{animation:mkPop .35s cubic-bezier(.2,1.6,.4,1)}
.wrap{width:100%;max-width:520px;margin:0 auto}
.scn{margin-bottom:8px}
.q{margin:0 0 8px;padding:10px 14px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink);font:800 18px/1.35 var(--kid)}
.q b{color:var(--ac);white-space:nowrap}
.box{position:relative;margin:0 0 8px;padding:20px 8px 8px;border-radius:18px;min-height:86px}
.box h3{position:absolute;left:12px;top:-9px;margin:0;padding:1px 10px;border-radius:999px;background:var(--ink);color:#fff;font:800 12.5px/1.5 var(--body)}
.tray{background:#f4e2c4;box-shadow:inset 0 0 0 2.5px var(--ink),inset 0 -6px 0 #dcc194}
.wal{background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink)}
.ms{display:flex;flex-wrap:wrap;gap:3px 4px;align-items:center;justify-content:center;min-height:54px}
.ms i{font:700 14.5px/1.3 var(--body);color:var(--soft);font-style:normal;text-align:center;padding:0 6px}
.info{margin:6px 4px 0;font:800 15.5px/1.3 var(--body);text-align:center;color:var(--ink)}
.info b{color:var(--ac)}
.m{border:0;background:none;padding:2px;margin:0;cursor:pointer;border-radius:50%;touch-action:manipulation;transition:transform .1s;animation:mIn .25s backwards}
.m.n{border-radius:8px}
.m:active{transform:scale(.9)}
.m svg{display:block;filter:drop-shadow(0 2.5px 0 rgba(18,26,51,.25))}
.m[disabled]{cursor:default}
.m.gone{visibility:hidden;animation:none}
.c1 svg{width:40px}.c2 svg{width:43px}.c5 svg{width:47px}.c10 svg{width:44px}.c20 svg{width:48px}.c50 svg{width:52px}.c100 svg{width:50px}.c200 svg{width:54px}
.n svg{width:86px}
@keyframes mIn{from{transform:scale(.6);opacity:0}}
.piles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.pile{position:relative;padding:20px 4px 8px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink);min-height:120px}
.pile h3{position:absolute;left:12px;top:-9px;margin:0;padding:1px 10px;border-radius:999px;background:var(--ink);color:#fff;font:800 12.5px/1.5 var(--body)}
.pile .m{animation:none;cursor:default}
.ans{display:grid;gap:8px;margin-bottom:8px}
.ans.r3{grid-template-columns:repeat(3,minmax(0,1fr))}
.ans.r4{grid-template-columns:repeat(4,minmax(0,1fr))}
.a{min-height:58px;padding:8px 6px;border:0;border-radius:16px;background:#fff;cursor:pointer;font:800 19px/1.2 var(--kid);color:var(--ink);
  box-shadow:inset 0 0 0 2.5px var(--ink),0 5px 0 rgba(18,26,51,.16);transition:transform .1s;touch-action:manipulation}
.a:active{transform:translateY(3px)}
.a.ok{background:#d9f7e6;box-shadow:inset 0 0 0 3px var(--good),0 5px 0 rgba(18,26,51,.1)}
.a.no{background:#ffe6df;box-shadow:inset 0 0 0 3px var(--bad);opacity:.7}
.a[disabled]{pointer-events:none}
.mk-guide{margin:2px 0 10px}
.mk-guide .mk-owl{width:60px;height:62px}
.mk-guide{grid-template-columns:60px minmax(0,1fr)}
.mk-bubble{font-size:16.5px}
.mk-bubble b{color:var(--ac)}
.go{width:100%}
.fly{animation:fly .7s cubic-bezier(.3,.8,.4,1) forwards}
@keyframes fly{40%{transform:translate(-20px,-34px) scale(1.25)}100%{transform:translate(-128px,6px) scale(.5);opacity:.2}}
.fade{animation:mkIn .35s backwards}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <section id="menu">
    <div class="mk-hero">
      <div class="art" id="heroArt"></div>
      <h1 id="heroH"></h1>
      <p id="heroP"></p>
    </div>
    <div class="col" id="col"></div>
    <div id="levels"></div>
  </section>
  <section id="play" hidden>
    <div class="hud"><div id="dots"></div><span class="chip" id="bChip"><small id="bL"></small><span id="bN">0</span></span></div>
    <div class="wrap" id="stage"></div>
  </section>
</div>
<script>
(function(){
"use strict";
const T = window.MK_T, GAME = "muges-pinigine", GRADES = [2], fmt = T.fmt;
const R = MK.rnd, P = MK.pick, SH = MK.shuffle, $ = id => document.getElementById(id);
const K = "#121a33", S = `stroke="${K}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"`;

/* ================= piešiniai: prekės ================= */
const ICON = {
  obuolys: `<path d="M0-8c-9-6-16 2-13 11 2 8 8 12 13 9 5 3 11-1 13-9 3-9-4-17-13-11z" fill="#e5243b" ${S}/><path d="M0-8q1-6 5-8" fill="none" ${S}/><path d="M2-12q6-4 9 0-5 4-9 0z" fill="#5cc65a" ${S}/>`,
  morka: `<path d="M-5-7 7-2-11 16z" fill="#ff8a1f" ${S}/><path d="M1-5q-3-9-8-9M2-5q1-10 6-11M3-4q6-6 11-4" fill="none" stroke="#2fa84f" stroke-width="2.6" stroke-linecap="round"/>`,
  riestainis: `<circle r="13" fill="#e5a14a" ${S}/><circle r="5" fill="#fff6ea" ${S}/><path d="M-8-6l2 1M6-9l1 2M9 4l-2 1M-6 8l1-2" ${S}/>`,
  saldainis: `<path d="M-8-5-17-9v14l9-4zM8-5l9-4v14l-9-4z" fill="#ffc61a" ${S}/><ellipse cy="-2" rx="9" ry="7" fill="#ff4f5e" ${S}/><path d="M-3-8q4 6 0 12" fill="none" stroke="#fff" stroke-width="2"/>`,
  piestukas: `<path d="M-13 9 8-12l6 6-21 21-8 2z" fill="#ffc61a" ${S}/><path d="M8-12l3-3q3-1 5 1t1 5l-3 3z" fill="#ff8ab0" ${S}/><path d="M-15 17l2-8 6 6z" fill="#f6dcae" ${S}/>`,
  balionas: `<ellipse cy="-4" rx="11" ry="13" fill="#6b4dff" ${S}/><path d="M-2 9h4l-2-3z" fill="#6b4dff" ${S}/><path d="M0 9q-4 5 1 9" fill="none" ${S}/><path d="M-5-10q2-4 6-4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>`,
  svilpukas: `<path d="M-13 4q0-10 10-10 4 0 6-4 3-5 8-3l5 4-6 1q0 14-12 16-11 1-11-4z" fill="#d98a4a" ${S}/><circle cx="9" cy="-9" r="1.3" fill="${K}"/><path d="M-13 4l-5 4" ${S}/><circle cx="-3" cy="3" r="2" fill="${K}"/><path d="M-9 9q5 3 10 0" fill="none" stroke="#fff" stroke-width="1.4"/>`,
  pienas: `<path d="M-8-8l4-7h8l4 7v22h-16z" fill="#fff" ${S}/><path d="M-8-8h16" ${S}/><rect x="-8" y="-1" width="16" height="8" fill="#13a8d6" ${S}/>`,
  ledai: `<path d="M-8-2 0 17 8-2z" fill="#e5a14a" ${S}/><circle cy="-7" r="9" fill="#ff8ab0" ${S}/><circle cx="-3" cy="-10" r="1.6" fill="#fff"/>`,
  duona: `<path d="M-15 10v-12q0-10 15-10t15 10v12z" fill="#d9a05b" ${S}/><path d="M-7-9l3 5M0-10l3 5M7-9l3 5" fill="none" ${S}/>`,
  gele: `<path d="M0 2v15" ${S}/><path d="M0 12q-7-1-8-7 7 0 8 7z" fill="#5cc65a" ${S}/><g fill="#ff8ab0" ${S}><circle cy="-13" r="5"/><circle cx="7" cy="-8" r="5"/><circle cx="5" cy="0" r="5"/><circle cx="-5" cy="0" r="5"/><circle cx="-7" cy="-8" r="5"/></g><circle cy="-6" r="4" fill="#ffc61a" ${S}/>`,
  kojines: `<path d="M-13-14h9v13l7 5q3 3 0 6t-7 1l-9-7z" fill="#ff8a1f" ${S}/><path d="M3-12h9v13l4 4q3 3 0 6t-7 1l-6-6z" fill="#ffc61a" ${S}/><path d="M-13-9h9M3-7h9" ${S}/>`,
  suris: `<path d="M-15 8v-9l22-11 8 11v9z" fill="#ffc61a" ${S}/><path d="M-15-1h30" ${S}/><circle cx="-5" cy="4" r="2.2" fill="#e8a400"/><circle cx="6" cy="3" r="3" fill="#e8a400"/><circle cx="4" cy="-6" r="2" fill="#e8a400"/>`,
  puodelis: `<path d="M-11-8h18v14q0 7-7 7h-4q-7 0-7-7z" fill="#ff3d9a" ${S}/><path d="M7-4h3q5 0 5 5t-5 5h-3" fill="none" ${S}/><path d="M-6-12q2-2 0-5M0-12q2-2 0-5" fill="none" ${S}/>`,
  masinele: `<path d="M-16 6v-7l6-1 4-7h11l5 7 6 2v6z" fill="#e5243b" ${S}/><path d="M-5-7h4v5h-6zM2-7h3l3 5h-6z" fill="#bfe9ff" ${S}/><circle cx="-8" cy="7" r="4" fill="${K}"/><circle cx="9" cy="7" r="4" fill="${K}"/>`,
  pyragas: `<path d="M-15 12v-12l30-6v18z" fill="#f6dcae" ${S}/><path d="M-15 0l30-6-12-7z" fill="#ff8ab0" ${S}/><path d="M-15 6l30-3" ${S}/><circle cx="4" cy="-9" r="2.5" fill="#e5243b" ${S}/>`,
  laivelis: `<path d="M-16 5h32l-5 9h-22z" fill="#a8693a" ${S}/><path d="M0 5v-21l11 16z" fill="#fff" ${S}/><path d="M-2 3v-14l-8 14z" fill="#ffc61a" ${S}/>`,
  kamuolys: `<circle r="14" fill="#fff" ${S}/><path d="M0-6l6 4-2 7h-8l-2-7z" fill="${K}"/><path d="M0-6v-8M6-2l7-3M4 5l5 7M-4 5l-5 7M-6-2l-7-3" ${S}/>`,
  medus: `<rect x="-10" y="-8" width="20" height="23" rx="5" fill="#ffb41f" ${S}/><rect x="-11" y="-14" width="22" height="7" rx="2" fill="#fff" ${S}/><rect x="-6" y="-1" width="12" height="8" rx="2" fill="#fff6ea" ${S}/>`,
  knyga: `<path d="M-14-12h24q4 0 4 4v20h-24q-4 0-4-4z" fill="#2f6bff" ${S}/><path d="M-14 8q0-4 4-4h24" fill="none" ${S}/><path d="M-6-6h12M-6-1h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>`,
  kepure: `<path d="M-12 6q-2-18 12-18t12 18z" fill="#2fa84f" ${S}/><rect x="-14" y="5" width="28" height="7" rx="3.5" fill="#fff" ${S}/><circle cy="-14" r="3.5" fill="#fff" ${S}/>`,
  aitvaras: `<path d="M0-17 11-3 0 9-11-3z" fill="#13a8d6" ${S}/><path d="M0-17v26M-11-3h22" ${S}/><path d="M0 9q-5 4 0 7t-2 3" fill="none" ${S}/>`,
  meskiukas: `<circle cx="-9" cy="-11" r="5" fill="#a8693a" ${S}/><circle cx="9" cy="-11" r="5" fill="#a8693a" ${S}/><ellipse cy="9" rx="10" ry="9" fill="#a8693a" ${S}/><circle cy="-5" r="10" fill="#a8693a" ${S}/><ellipse cy="-2" rx="4.5" ry="3.5" fill="#f6dcae"/><circle cx="-4" cy="-7" r="1.3" fill="${K}"/><circle cx="4" cy="-7" r="1.3" fill="${K}"/><circle cy="-3" r="1.4" fill="${K}"/>`,
  bugnelis: `<path d="M-13-4v12q0 5 13 5t13-5v-12" fill="#e5243b" ${S}/><ellipse cy="-4" rx="13" ry="5" fill="#fff6ea" ${S}/><path d="M-9 2l5 9 4-9 4 9 5-9" fill="none" stroke="#ffc61a" stroke-width="1.6"/><path d="M-4-6-14-16M4-6l10-10" ${S}/>`
};
const GOODS = T.goods.map(g => ({ id: g[0], nom: g[1], acc: g[2], lo: g[3], hi: g[4] }));
const gsvg = id => `<svg viewBox="-20 -20 40 40" aria-hidden="true">${ICON[id]}</svg>`;

/* ================= piešiniai: pinigai (savi, apibendrinti) ================= */
const NOTE = { 500: ["#c3cdb8", "#8f9d80"], 1000: ["#f6b1a6", "#d9756a"], 2000: ["#a9cbf2", "#5d93d6"], 5000: ["#f7c98a", "#de9a3c"] };
function msvg(v){
  if(v >= 500){
    const c = NOTE[v], e = v / 100;
    return `<svg viewBox="0 0 90 48" aria-hidden="true"><rect x="1.5" y="1.5" width="87" height="45" rx="6" fill="${c[0]}" stroke="${K}" stroke-width="2.4"/><rect x="6" y="6" width="78" height="36" rx="3" fill="none" stroke="${c[1]}" stroke-width="1.6"/>
      <path d="M58 40v-14q0-8 8-8t8 8v14" fill="none" stroke="${c[1]}" stroke-width="3"/><circle cx="18" cy="14" r="4" fill="${c[1]}"/>
      <text x="34" y="33" text-anchor="middle" font-family="Grandstander,Arial,sans-serif" font-weight="800" font-size="24" fill="${K}">${e}</text><text x="34" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="8.5" fill="${K}">Eur</text></svg>`;
  }
  const eur = v >= 100, n = eur ? v / 100 : v;
  const [o, i] = v === 100 ? ["#e8b93a", "#e3e7ee"] : v === 200 ? ["#dfe3ea", "#f0c64a"] : v >= 10 ? ["#f0c64a", "#f0c64a"] : ["#d58f5c", "#d58f5c"];
  return `<svg viewBox="0 0 50 50" aria-hidden="true"><circle cx="25" cy="25" r="23" fill="${o}" stroke="${K}" stroke-width="2.4"/><circle cx="25" cy="25" r="${eur ? 15.5 : 19}" fill="${i}" stroke="${eur ? K : "rgba(18,26,51,.3)"}" stroke-width="${eur ? 1.4 : 1.2}"/>
    <text x="25" y="${eur ? 29 : 28}" text-anchor="middle" font-family="Grandstander,Arial,sans-serif" font-weight="800" font-size="${n >= 10 ? 18 : 20}" fill="${K}">${n}</text><text x="25" y="${eur ? 38 : 38.5}" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="${eur ? 7.5 : 8.5}" fill="${K}">${eur ? "Eur" : "ct"}</text></svg>`;
}
const mbtn = (v, attr, cls) => `<button type="button" class="m ${v >= 500 ? "n" : "c" + v} ${cls || ""}" ${attr || ""} aria-label="${v >= 500 ? T.aria.note(fmt(v)) : T.aria.coin(fmt(v))}">${msvg(v)}</button>`;

/* ================= piešiniai: žmogeliukai ir prekystalis ================= */
function person(o){
  const sk = o.skin || "#f6c9a0", girl = o.girl;
  const arm = o.up ? "M14-64q14-6 17-22" : "M14-64q10 12 7 28", hand = o.up ? [31, -88] : [21, -35];
  return `<g transform="translate(${o.x} ${o.y}) scale(${o.s || 1})">
    <ellipse rx="22" ry="4.5" fill="#000" opacity=".13"/>
    <path d="M-8-36v32M8-36v32" stroke="${o.pants}" stroke-width="10" stroke-linecap="round"/>
    <path d="M-15-2h11M4-2h11" stroke="${K}" stroke-width="6.5" stroke-linecap="round"/>
    ${girl ? `<path d="M-13-70q13-7 26 0l9 44h-44z" fill="${o.shirt}" ${S}/>` : `<path d="M-14-70q14-7 28 0l2 38h-32z" fill="${o.shirt}" ${S}/>`}
    <path d="M-14-64q-10 12-7 28" fill="none" stroke="${o.shirt}" stroke-width="8.5" stroke-linecap="round"/><path d="${arm}" fill="none" stroke="${o.shirt}" stroke-width="8.5" stroke-linecap="round"/>
    <circle cx="-21" cy="-35" r="5" fill="${sk}" ${S}/><circle cx="${hand[0]}" cy="${hand[1]}" r="5" fill="${sk}" ${S}/>
    ${girl ? `<path d="M-17-84q-5 22 3 30M17-84q5 22-3 30" fill="none" stroke="${o.hair}" stroke-width="9" stroke-linecap="round"/>` : ""}
    <circle cy="-86" r="15.5" fill="${sk}" ${S}/>
    <path d="${girl ? "M-16-86q-1-18 16-18t16 18q-8-10-16-10t-16 10z" : "M-15-88q-2-15 15-16t15 16q-6-8-15-7t-15 7z"}" fill="${o.hair}" ${S}/>
    ${o.hat ? `<path d="M-17-97h34l-4-9h-26z" fill="${o.hat}" ${S}/>` : ""}
    <circle cx="-5.5" cy="-85" r="1.9" fill="${K}"/><circle cx="5.5" cy="-85" r="1.9" fill="${K}"/><path d="M-5-79q5 5 10 0" fill="none" ${S}/>
    <circle cx="-10" cy="-80" r="2.6" fill="#ff8aa0" opacity=".6"/><circle cx="10" cy="-80" r="2.6" fill="#ff8aa0" opacity=".6"/>
    ${o.extra || ""}</g>`;
}
const SELLERS = [
  { girl: 1, shirt: "#2fa84f", pants: "#6b4b2a", hair: "#7a4b2a", hat: "" },
  { girl: 0, shirt: "#2f6bff", pants: "#3b3f55", hair: "#3a2a1c", hat: "#ffc61a" },
  { girl: 1, shirt: "#b04dff", pants: "#3b3f55", hair: "#e0a23a", hat: "" },
  { girl: 0, shirt: "#e5243b", pants: "#6b4b2a", hair: "#c9c9c9", hat: "#2fa84f", skin: "#eab98c" }
];
const tag = (x, y, s, o) => { o = o || {}; const w = Math.max(44, s.length * 7.4 + 14);
  return `<g transform="translate(${x} ${y})"><path d="M0 12v10" stroke="${K}" stroke-width="1.6"/><rect x="${-w / 2}" y="-12" width="${w}" height="24" rx="6" fill="${o.acc ? "#e8590c" : "#fff"}" stroke="${K}" stroke-width="2"/>
    <text y="5" text-anchor="middle" font-family="Grandstander,Arial,sans-serif" font-weight="800" font-size="13.5" fill="${o.acc ? "#fff" : K}">${s}</text>${o.old ? `<path d="M${-w / 2 + 5} 4L${w / 2 - 5}-4" stroke="#e5243b" stroke-width="2.4" stroke-linecap="round"/>` : ""}</g>`; };
/* sc: { items:[{id, tag, old}], newTag, paid, seller, hero } */
function scene(sc){
  const n = sc.items.length, xs = n === 1 ? [186] : n === 2 ? [150, 222] : [128, 186, 244], sel = SELLERS[sc.seller || 0];
  let it = "";
  sc.items.forEach((g, i) => {
    it += `<g class="it" transform="translate(${xs[i]} 100)"><g transform="scale(${n === 3 ? 1.15 : 1.4})">${ICON[g.id]}</g></g>`;
    if(g.tag) it += tag(xs[i] + (sc.newTag && n === 1 ? -36 : 0), 50, g.tag, { old: g.old });
