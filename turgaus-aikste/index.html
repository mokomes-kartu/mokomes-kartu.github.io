<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MokomėsKartu">
<link rel="apple-touch-icon" href="/logo/mk-ikona-180.png">
<title>Turgaus aikštė – MokomėsKartu.lt</title>
<meta name="description" content="10 klasės ekonomikos ir verslumo žaidimas: paklausa ir pasiūla, rinkos pusiausvyra, stygius ir perteklius, paklausos ir pasiūlos veiksniai, pelnas ir lūžio taškas.">
<meta name="theme-color" content="#fff9e6">
<link rel="icon" href="/logo/mk-ikona.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800&family=Manrope:wght@600;700;800&display=swap">
<script src="/bendra/mk.js"></script>
<script src="/turgaus-aikste/tekstai.lt.js"></script>
<style>
/* Meniu: turgaus piešinys, „Mano turgus“ (12 prekystalių), lygiai, „Noriu pasimokyti“.
   Užduotys: kainos / kiekio nustatymas ir „Atidaryti turgų“ (lentelė, grafikas, funkcijos, verslas), pasirinkimas iš 4, veiksniai (du žingsniai su kreivės poslinkiu). */
body{--ac:#0f8a5f;--ac-ink:#fff;--ac-soft:#d9f5e8;--dc:#2f6bff;--sc:#ff7a1a}
@media (max-width:380px){.mk-title{font-size:17px}}
.mk-hero{padding-top:0}
.mk-hero h1{margin-top:8px;font-size:clamp(32px,8.4vw,54px)}
.mk-hero p{max-width:46ch;font-size:16.5px}
.hero-art{width:min(100%,480px);border-radius:26px;overflow:hidden;position:relative;box-shadow:0 6px 0 rgba(18,26,51,.15)}
.hero-art svg{display:block;width:100%;height:auto}
.hero-art::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 3px var(--ink);pointer-events:none}
.col{width:100%;max-width:520px;margin:0 auto 14px;padding:12px 12px 10px;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 2.5px var(--ink),0 5px 0 rgba(18,26,51,.14)}
.col h2{margin:0;font:800 18px/1.2 var(--kid);display:flex;gap:8px;align-items:center}
.col h2 svg{width:30px;height:30px;flex:none}
.col p{margin:4px 0 8px;color:var(--soft);font-weight:700;font-size:14px}
.col p b{color:var(--ink)}
.col>svg{display:block;width:100%;height:auto}
.st-new{animation:mkPop .8s cubic-bezier(.2,1.6,.4,1);transform-box:fill-box;transform-origin:center}

.hud{display:flex;align-items:center;gap:8px;margin:0 0 8px;min-height:36px}
.hud .mk-dots{margin-right:auto;justify-content:flex-start}
.chip{display:inline-flex;align-items:baseline;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink);font:800 17px/36px var(--kid);white-space:nowrap}
.chip small{font:800 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.chip.pop{animation:mkPop .35s cubic-bezier(.2,1.6,.4,1)}
.card{width:100%;max-width:560px;margin:0 auto;padding:10px 12px 14px;border-radius:24px;background:var(--card);box-shadow:inset 0 0 0 2.5px var(--ink),0 6px 0 rgba(18,26,51,.15)}
.scene{border-radius:16px;overflow:hidden;background:#e8f6ff;box-shadow:inset 0 0 0 2px var(--ink)}
.scene svg{display:block;width:100%;height:auto}
.cap{min-height:22px;margin:6px 2px 0;font:800 14.5px/1.3 var(--body);text-align:center;color:var(--soft)}
.cap.eq{color:#0b7a4b}.cap.short,.cap.surplus{color:#c2410c}
.q{margin:8px 2px 10px;font:800 17px/1.35 var(--body)}
.pers .bag,.pers .m2,.pers .xm{opacity:0;transition:opacity .25s}
.pers.got .bag{opacity:1}
.pers.sad{opacity:.75}.pers.sad .m1{opacity:0}.pers.sad .m2,.pers.sad .xm{opacity:1}
.crate{transition:opacity .25s}.crate.gone{opacity:.12}
.crate .lf{opacity:0}.crate.left .lf{opacity:1}

.tb{display:grid;gap:5px;margin:0 0 10px}
.tr{display:grid;grid-template-columns:.8fr 1fr 1fr;align-items:center;min-height:42px;padding:0 6px;border:0;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 2px var(--ink);font:800 17px/1 var(--kid);text-align:center;color:var(--ink);margin:0;width:100%}
.tr.c4{grid-template-columns:.7fr 1fr 1fr .9fr}.tr.c2{grid-template-columns:1fr 1fr}.tr.c3b{grid-template-columns:.8fr 1fr 1fr}
.tr.h{min-height:34px;background:var(--ac-soft);font:800 12.5px/1.15 var(--body);box-shadow:none}
.tr.h span:nth-child(2){color:var(--dc)}.tr.h span:nth-child(3){color:#c2560a}
.tr.h.plain span{color:var(--ink)}
button.tr{cursor:pointer;touch-action:manipulation}
.tr.sel{background:#ffe27a;box-shadow:inset 0 0 0 3px var(--ink)}
.tr.ok{background:#b9efcd;box-shadow:inset 0 0 0 3px var(--good)}
.tr.no{background:#ffe1d9;box-shadow:inset 0 0 0 2px #ff8a7a;color:#9a8f86}
.tr[disabled]{pointer-events:none}
.gr{margin:0 0 8px;border-radius:14px;background:#fffdf5;box-shadow:inset 0 0 0 2px var(--ink);overflow:hidden}
.gr svg{display:block;width:100%;height:auto}
.fx{margin:0 0 10px;padding:10px 12px;border-radius:14px;background:#fffdf5;box-shadow:inset 0 0 0 2px var(--ink);font:800 19px/1.5 var(--kid)}
.fx b.d{color:#1c4fd1}.fx .s{color:#c2560a}
.fx small{display:block;font:700 12.5px/1.3 var(--body);color:var(--soft);margin-top:2px}
.fx span{font:700 13px/1 var(--body);color:var(--soft);margin-right:4px}
.stp{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;gap:8px;align-items:center;margin:0 0 10px}
.stp button{height:52px;border:0;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.2);font:800 28px/1 var(--kid);cursor:pointer;touch-action:manipulation;color:var(--ink)}
.stp button:active{transform:translateY(3px);box-shadow:inset 0 0 0 2.5px var(--ink)}
.stp button[disabled]{opacity:.35;pointer-events:none}
.stp div{height:52px;border-radius:16px;background:#ffe27a;box-shadow:inset 0 0 0 2.5px var(--ink);display:grid;place-items:center;font:800 24px/1 var(--kid)}
.stp div{text-align:center}.stp div small{display:block;font:800 10px/1 var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--soft);margin-bottom:3px}.stp div #val{display:block;font:800 22px/1 var(--kid)}
.stp.done button{visibility:hidden}.stp.ok div{background:#b9efcd}
.go{width:100%}
.note{margin:10px 2px 0;min-height:20px;font:700 14.5px/1.4 var(--body);color:#9a3412}
.note:empty{display:none}
.opts{display:grid;gap:8px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{min-height:52px;padding:8px 12px;border:0;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.18);font:800 16.5px/1.25 var(--body);cursor:pointer;touch-action:manipulation;color:var(--ink)}
.opt:active{transform:translateY(3px)}
.opt.ok{background:#b9efcd;box-shadow:inset 0 0 0 3px var(--good)}
.opt.no{background:#ffd3c8;box-shadow:inset 0 0 0 3px var(--bad)}
.opt[disabled]{pointer-events:none}
.opt.dim{opacity:.55}
.q2{margin:12px 2px 8px;font:800 16.5px/1.35 var(--body)}
#flow .mk-btn{width:100%;margin-top:4px}
.sh1{animation:shIn .7s ease-out}
@keyframes shIn{from{opacity:0}}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <main id="menu">
    <section class="mk-hero"><div class="hero-art" id="heroArt"></div><h1 id="heroH"></h1><p id="heroP"></p></section>
    <section class="col" id="col"></section>
    <div id="levels"></div>
    <section id="learn"></section>
  </main>
  <main id="play" hidden>
    <div class="hud"><div id="dots"></div><span class="chip" id="ptsChip"><small id="ptsL"></small><span id="pts">0</span></span></div>
    <div class="card" id="stage"></div>
  </main>
</div>
<script>
(function(){
"use strict";
const T = window.MK_T, GAME = "turgaus-aikste", GRADES = [10];
const $ = id => document.getElementById(id), R = MK.rnd, P = MK.pick, SH = MK.shuffle, eur = T.eur;
const uniq = a => a.filter((v, i) => a.indexOf(v) === i), cl = s => String(s).replace(/vnt\.\./g, "vnt.");
const GOODS = T.goods.map((g, i) => ({ i, n: g[0], g: g[1], u: g[2], col: g[3], aw: g[4], lo: g[5], hi: g[6] }));
const goodOf = gen => GOODS.find(g => g.g === gen) || { g: gen, col: "#ffc61a", aw: "#bfe3ff", u: "vnt." };

/* ================= piešiniai ================= */
const SKIN = ["#f6c9a0", "#e9b48a", "#f9d7b5", "#d99e73"], HAIR = ["#5a3a1e", "#2b2118", "#c98a2b", "#8a4b2a", "#6b6b6b"],
  SHIRT = ["#2f6bff", "#e5243b", "#12b886", "#ff8a1f", "#6b4dff", "#ff3d9a", "#0fa3b1", "#b9772c"], PANTS = ["#39446b", "#5b4636", "#2d5d4b", "#444"];
function person(x, y, s, o){
  o = o || {}; const sk = o.skin || SKIN[0], sh = o.shirt || SHIRT[0], pa = o.pants || PANTS[0], ha = o.hair || HAIR[0];
  return `<g class="pers ${o.cls || ""}" transform="translate(${x} ${y}) scale(${s})">
  <rect x="7" y="37" width="4.2" height="15" rx="2" fill="${pa}"/><rect x="12.8" y="37" width="4.2" height="15" rx="2" fill="${pa}"/>
  <ellipse cx="8.2" cy="53.4" rx="4" ry="2.2" fill="#121a33"/><ellipse cx="15.8" cy="53.4" rx="4" ry="2.2" fill="#121a33"/>
  <path d="M6 22 2.5 33M18 22 21.5 33" stroke="${sh}" stroke-width="4.4" stroke-linecap="round"/>
  <circle cx="2.5" cy="34" r="2.3" fill="${sk}"/><circle cx="21.5" cy="34" r="2.3" fill="${sk}"/>
  <rect x="5" y="17" width="14" height="23" rx="6" fill="${sh}"/>
  ${o.apron ? `<path d="M7.6 24h8.8v15.5H7.6z" fill="#fff"/><path d="M9 24v-6M15 24v-6" stroke="#fff" stroke-width="1.6"/>` : ""}
  <circle cx="12" cy="9.5" r="7.5" fill="${sk}"/>
  <path d="${o.long ? "M4.2 13C2.6 3 8 1 12 1s9.4 2 7.8 12c-1-4.6-3-7-7.8-7s-6.8 2.4-7.8 7Z" : "M4.6 8.6C5 3 9 1.4 12 1.4s7 1.6 7.4 7.2c-2-2.5-4.5-3.3-7.4-3.3S6.6 6.1 4.6 8.6Z"}" fill="${ha}"/>
  ${o.bun ? `<circle cx="12" cy="1.4" r="3.3" fill="${ha}"/>` : ""}
  <circle cx="9.3" cy="10" r="1.1" fill="#121a33"/><circle cx="14.7" cy="10" r="1.1" fill="#121a33"/>
  <path class="m1" d="M9.4 13q2.6 2.2 5.2 0" fill="none" stroke="#121a33" stroke-width="1.2" stroke-linecap="round"/>
  <path class="m2" d="M9.6 14.6q2.4-2 4.8 0" fill="none" stroke="#121a33" stroke-width="1.2" stroke-linecap="round"/>
  <g class="bag"><rect x="17.5" y="34" width="9" height="8.5" rx="1.6" fill="${o.bag || "#ffc61a"}" stroke="#121a33" stroke-width="1"/><path d="M19.6 34q2.4-4.6 4.8 0" fill="none" stroke="#121a33" stroke-width="1"/></g>
  <g class="xm"><circle cx="12" cy="-6" r="5.2" fill="#ff6b4a"/><path d="M9.8-8.2l4.4 4.4M14.2-8.2l-4.4 4.4" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></g>
  </g>`;
}
function stall(x, y, w, h, aw, col){
  const n = Math.max(3, Math.round(w / 12)), sw = w / n, ah = h * .2; let st = "";
  for(let i = 0; i < n; i++) st += `<path d="M${x + i * sw} ${y}h${sw}v${ah}a${sw / 2} ${sw / 2} 0 0 1-${sw} 0z" fill="${i % 2 ? "#fff" : aw}" stroke="#121a33" stroke-width="1.2"/>`;
  const cy = y + h * .58, items = [0, 1, 2, 3].map(i => `<circle cx="${x + w * (.2 + i * .2)}" cy="${cy - h * .05}" r="${Math.min(w * .085, h * .08)}" fill="${col}" stroke="#121a33" stroke-width="1"/>`).join("");
  return `<g><path d="M${x + 3} ${y + ah}V${y + h}M${x + w - 3} ${y + ah}V${y + h}" stroke="#7a4b2a" stroke-width="3"/>
    ${items}<rect x="${x}" y="${cy}" width="${w}" height="${h - h * .58}" rx="2.5" fill="#d9a066" stroke="#121a33" stroke-width="1.4"/>
    <path d="M${x} ${cy + (h * .42) * .5}h${w}" stroke="#121a33" stroke-width="1" opacity=".35"/>${st}</g>`;
}
function crate(x, y, col, i){
  return `<g class="crate" data-i="${i}"><circle cx="${x + 4.5}" cy="${y + 3}" r="3.6" fill="${col}" stroke="#121a33" stroke-width=".9"/><circle cx="${x + 10}" cy="${y + 2.2}" r="3.6" fill="${col}" stroke="#121a33" stroke-width=".9"/><circle cx="${x + 15}" cy="${y + 3.2}" r="3.4" fill="${col}" stroke="#121a33" stroke-width=".9"/>
    <rect x="${x}" y="${y + 4}" width="19" height="12" rx="1.6" fill="#c98f52" stroke="#121a33" stroke-width="1.2"/><path d="M${x} ${y + 10}h19" stroke="#121a33" stroke-width=".9" opacity=".45"/>
    <rect class="lf" x="${x - 1.5}" y="${y - 2.5}" width="22" height="20" rx="3" fill="none" stroke="#ff6b4a" stroke-width="1.8" stroke-dasharray="3 2.5"/></g>`;
}
const buyerLook = i => ({ skin: SKIN[i % 4], hair: HAIR[(i * 3 + 1) % 5], shirt: SHIRT[(i * 5 + 2) % 8], pants: PANTS[i % 4], long: i % 2 === 0, bag: ["#ffc61a", "#9bd0ff", "#b9efcd"][i % 3] });
function sceneSvg(g, crates, buyers){
  let c = "", b = "";
  for(let i = 0; i < crates; i++){ const colN = Math.floor(i / 2), row = i % 2; c += crate(112 + colN * 21, row ? 49 : 68, g.col, i); }
  const step = buyers > 8 ? 15 : 17;
  for(let i = 0; i < buyers; i++) b += person(202 + i * step, 40, .82, Object.assign(buyerLook(i), { cls: "buyer" }));
  return `<svg viewBox="0 0 340 96" role="img" aria-label="${T.heroAria}">
    <rect width="340" height="96" fill="#e8f6ff"/><path d="M0 60h340v36H0z" fill="#efe2c2"/>
    <path d="M0 60h340" stroke="#121a33" stroke-width="1" opacity=".25"/>
    <g fill="#e2d1a8">${[14, 60, 150, 190, 250, 300].map((x, i) => `<ellipse cx="${x + 12}" cy="${72 + (i % 3) * 8}" rx="9" ry="2.6"/>`).join("")}</g>
    ${stall(30, 14, 76, 72, g.aw, g.col)}${person(2, 30, 1, { shirt: "#0f8a5f", hair: "#8a4b2a", bun: true, apron: true, long: true })}${c}${b}</svg>`;
}
function heroSvg(){
  const g = GOODS[0], g2 = GOODS[1];
  return `<svg viewBox="0 0 480 210" role="img" aria-label="${T.heroAria}">
    <rect width="480" height="210" fill="#cfeaff"/><circle cx="420" cy="42" r="22" fill="#ffd84d"/>
    <g fill="#fff" opacity=".9"><ellipse cx="90" cy="38" rx="34" ry="11"/><ellipse cx="118" cy="30" rx="22" ry="10"/><ellipse cx="300" cy="26" rx="28" ry="9"/></g>
    <g stroke="#121a33" stroke-width="2" stroke-linejoin="round">
      <path d="M0 150V84l34-26 34 26v66z" fill="#ffd9b0"/><path d="M68 150V70h56v80z" fill="#ffe9a8"/><path d="M62 70l34-24 34 24z" fill="#d9480f"/>
      <path d="M124 150V92l30-20 30 20v58z" fill="#d6f0c4"/>
      <path d="M352 150V78h44v72z" fill="#ffe3e6"/><path d="M346 78l28-30 28 30z" fill="#6b4dff"/><path d="M396 150V96l42-22 42 22v54z" fill="#ffe9a8"/>
      <path d="M214 150V60h52v90z" fill="#fff4d6"/><path d="M206 60l34-34 34 34z" fill="#b9772c"/>
    </g>
    <circle cx="240" cy="78" r="10" fill="#fff" stroke="#121a33" stroke-width="2"/><path d="M240 72v6l4 3" fill="none" stroke="#121a33" stroke-width="2" stroke-linecap="round"/>
    <g fill="#bfe3ff" stroke="#121a33" stroke-width="1.5"><rect x="12" y="98" width="14" height="16"/><rect x="42" y="98" width="14" height="16"/><rect x="80" y="86" width="12" height="16"/><rect x="100" y="86" width="12" height="16"/><rect x="146" y="104" width="14" height="14"/><rect x="366" y="92" width="14" height="16"/><rect x="418" y="108" width="14" height="14"/><rect x="448" y="108" width="14" height="14"/></g>
    <path d="M0 150h480v60H0z" fill="#efe2c2"/><path d="M0 150h480" stroke="#121a33" stroke-width="2"/>
    <g fill="#e2d1a8">${[20, 90, 170, 250, 330, 410, 60, 210, 380].map((x, i) => `<ellipse cx="${x + 14}" cy="${166 + (i % 4) * 11}" rx="15" ry="4"/>`).join("")}</g>
    ${stall(96, 74, 150, 126, g.aw, g.col)}${stall(300, 96, 104, 100, g2.aw, g2.col)}
    <g transform="translate(196 126)"><rect x="-34" y="-10" width="68" height="20" rx="5" fill="#fff" stroke="#121a33" stroke-width="2"/><text y="5" text-anchor="middle" font-family="Grandstander,system-ui,sans-serif" font-weight="800" font-size="13" fill="#121a33">6 € / kg</text></g>
    ${person(40, 86, 2.05, { shirt: "#0f8a5f", hair: "#8a4b2a", bun: true, apron: true, long: true })}
    ${person(250, 104, 1.75, Object.assign(buyerLook(1), { cls: "got" }))}${person(416, 110, 1.6, Object.assign(buyerLook(4), { cls: "got" }))}${person(446, 116, 1.5, buyerLook(2))}
    <g transform="translate(262 166) scale(1.5)">${crate(0, 0, g.col, 0)}</g><g transform="translate(232 174) scale(1.5)">${crate(0, 0, g.col, 0)}</g></svg>`;
}
/* lygių piktogramos */
const ic = s => `<svg viewBox="0 0 56 56" aria-hidden="true">${s}</svg>`;
const LART = [
  ic(`<rect x="8" y="9" width="40" height="38" rx="6" fill="#fff" stroke="#121a33" stroke-width="2.5"/><path d="M8 21h40M8 30h40M8 39h40M22 9v38M35 9v38" stroke="#121a33" stroke-width="1.8"/><rect x="9.5" y="22" width="37" height="7.5" fill="#ffe27a"/>`),
  ic(`<path d="M11 8v38h38" fill="none" stroke="#121a33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 15l26 24" stroke="#2f6bff" stroke-width="4" stroke-linecap="round"/><path d="M17 39l26-24" stroke="#ff7a1a" stroke-width="4" stroke-linecap="round"/><circle cx="30" cy="27" r="4.5" fill="#fff" stroke="#121a33" stroke-width="2.4"/>`),
  ic(`<path d="M10 8v38h38" fill="none" stroke="#121a33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 16l20 22" stroke="#2f6bff" stroke-width="3.4" stroke-linecap="round" opacity=".4"/><path d="M26 14l20 22" stroke="#2f6bff" stroke-width="4" stroke-linecap="round"/><path d="M24 30h9m-4-4 4 4-4 4" fill="none" stroke="#121a33" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`),
  ic(`<rect x="6" y="14" width="44" height="28" rx="8" fill="#fff" stroke="#121a33" stroke-width="2.5"/><text x="28" y="34" text-anchor="middle" font-family="Grandstander,system-ui,sans-serif" font-weight="800" font-size="15" fill="#121a33">Q = P</text>`),
  ic(`<ellipse cx="22" cy="42" rx="13" ry="5" fill="#ffc61a" stroke="#121a33" stroke-width="2.2"/><path d="M9 42v-7a13 5 0 0 0 26 0v7" fill="#ffc61a" stroke="#121a33" stroke-width="2.2"/><ellipse cx="22" cy="35" rx="13" ry="5" fill="#ffe27a" stroke="#121a33" stroke-width="2.2"/><path d="M9 35v-7a13 5 0 0 0 26 0v7" fill="#ffc61a" stroke="#121a33" stroke-width="2.2"/><ellipse cx="22" cy="28" rx="13" ry="5" fill="#ffe27a" stroke="#121a33" stroke-width="2.2"/><path d="M38 30l5-16 5 5m-5-5-5 4" fill="none" stroke="#0f8a5f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`),

    const o = strOpts(right, [r > 0 ? T.o.loss(a) : T.o.profit(a), T.o.profit(n * z.mg), T.o.loss(z.F), T.o.profit(n * z.p - z.F), T.o.loss(a + z.F), T.o.profit(a + z.F), T.o.loss(a * 2)]);
    return ch("pl", z, "none", T.q.pl(z.g.g, n, z.u, z.p, z.v, z.F), o, T.w.profit(n, z.p, z.v, z.F), { _b: { n } });
  },
  be(){
    const z = G.biz(), vals = range(1, 20).map(i => i * 5), ok = v => v === z.n0, un = q => Math.max(1, Math.round(q / 12.5));
    return { type: "set", id: "be", view: "none", m: z, text: T.q.be(z.g.g, z.u, z.p, z.v, z.F), values: vals, start: z.n0 === 50 ? 40 : 50, unit: z.u, qty: true, ok, target: z.n0, ans: `${z.n0} ${z.u}`,
      fb: v => T.fb.be(v, z.u, v * z.p, v * z.v + z.F), sim: v => { const pr = z.mg * (v - z.n0), a = un(v); return { buyers: a, crates: a, sold: a, cls: pr === 0 ? "eq" : "short", cap: pr > 0 ? T.cap.profit(pr) : pr < 0 ? T.cap.loss(-pr) : T.cap.zero }; },
      why: T.w.be(z.p, z.v, z.F, z.n0, z.u) };
  },
  best(){
    for(let k = 0; k < 5000; k++){
      const g = P(GOODS), s = R(g.lo, g.hi - 4), b = P([5, 10, 15, 20]), q0 = 10 * R(2, 9) + b * 4, v = R(1, Math.max(1, s)), F = 10 * R(2, 12);
      const rows = [0, 1, 2, 3, 4].map(i => s + i), qd = p => q0 - b * (p - s), pr = p => (p - v) * qd(p) - F, prs = rows.map(pr), mx = Math.max.apply(null, prs), bi = prs.indexOf(mx);
      const rev = rows.map(p => p * qd(p)), ri = rev.indexOf(Math.max.apply(null, rev));
      if(prs.filter(x => x === mx).length !== 1 || bi === 0 || bi === 4 || bi === ri || mx <= 0) continue;
      const z = { g, u: g.u, rows, qd, v, F, pr, best: rows[bi] }, ok = x => x === z.best, un = q => Math.max(1, Math.round(q / (q0 / 8)));
      return { type: "set", id: "best", view: "best", m: z, text: T.q.best(g.g, v, F), values: rows, start: null, unit: "€", ok, target: z.best, ans: eur(z.best),
        fb: x => T.fb.best(x, qd(x), v, F, pr(x)), sim: x => { const a = un(qd(x)), e = pr(x); return { buyers: a, crates: a, sold: a, cls: x === z.best ? "eq" : "short", cap: e >= 0 ? T.cap.profit(e) : T.cap.loss(-e) }; },
        why: T.w.best(rows.map(p => T.w.bestRow(p, v, qd(p), F, pr(p))), z.best) };
    }
  },
  cost(){
    const g = P(GOODS), n = 10 * R(2, 8), r = R(1, 6); let f = R(1, 3); if(f === r) f = r + 1; const raw = r * n, F = f * n, s = r + f;
    return ch("cost", { g, u: g.u }, "none", T.q.cost(g.g, n, g.u, raw, F), numOpts(s, [r, f, raw + F, s + 1, s * 2, Math.abs(r - f)], eur), T.w.cost(raw, F, n, s), { two: true, _c: { n, raw, F } });
  },
  priceFor(){

    return ch("priceFor", { g, u: g.u }, "none", T.q.priceFor(g.g, n, g.u, s, tp), numOpts(p, [s, t, s + 2 * t, s * t, p + 1, p - 1, s + tp / 10], eur), T.w.priceFor(s, n, tp, p), { two: true, _c: { n, s, tp } });
  },
  alt(){
    const who = P(T.people), a = SH(T.acts).slice(0, 3); let v = uniq([5 * R(6, 20), 5 * R(6, 20), 5 * R(6, 20)]); while(v.length < 3){ const x = 5 * R(6, 20); if(!v.includes(x)) v.push(x); }
    const pi = Math.random() < .7 ? v.indexOf(Math.max.apply(null, v)) : R(0, 2), others = [0, 1, 2].filter(i => i !== pi), bo = v[others[0]] > v[others[1]] ? others[0] : others[1], right = v[bo];
    return ch("alt", { g: GOODS[1], u: "" }, "none", T.q.alt(who, a.map((x, i) => T.actItem(x[0], v[i])).join("; "), a[pi][0]), numOpts(right, [v[others[0]], v[others[1]], v[others[0]] + v[others[1]], v[pi], Math.abs(v[pi] - right)], eur), T.w.alt(right, a[bo][1]), { two: true, _a: { v, pi } });
  }
};
function range(a, b){ const r = []; for(let i = a; i <= b; i++) r.push(i); return r; }
function funcVals(m){ return range(1, m.g.hi + 3).filter(p => m.qd(p) >= 0 && m.qs(p) >= 0); }
function sub(f, p){ return f.replace("P", " · " + p); }
function funcWhy(m){ return T.w.func(m.fD, m.fS, m.b + m.d, m.a + m.c, m.P, `Q = ${sub(m.fD, m.P)} = ${m.Q} ${m.u}`); }
const one = (...f) => P(f)();
let used = [];
const LV = [
  () => [G.setEq("table"), G.state("table"), G.law(), G.sold("table"), G.setGap("table"), G.spend("table"), one(G.law, () => G.state("table")), G.setEq("table")],
  () => [G.which(), G.setEq("graph"), G.read(), G.state("graph"), G.setGap("graph"), G.spend("graph"), G.sold("graph"), G.setGap("graph")],
  () => SH([G.shift("D", 1), G.shift("D", -1), G.shift("S", 1), G.shift("S", -1), G.shift("D", P([1, -1])), G.shift("S", P([1, -1])), G.shiftAny(), G.shiftAny()]),
  () => [G.setEq("func"), G.qEq(), G.state("func"), G.setEq("func"), G.shiftF(), G.spend("func"), G.setGap("func"), G.shiftF()],
  () => [G.profit(), G.be(), G.pl(), G.best(), one(G.cost, G.priceFor), G.alt(), G.be(), G.best()],
  () => [G.setGap("table")].concat(SH([G.setGap("graph"), G.shiftAny(), G.shiftAny(), G.setEq("func"), G.shiftF(), G.be(), G.best(), G.pl(), one(() => G.sold("graph"), () => G.spend("func"), G.alt)]))
];
const LEVELS = T.levels.map((l, i) => ({ id: "l" + (i + 1), name: l[0], sub: l[1], art: LART[i] }));

/* ================= meniu ir „Mano turgus“ ================= */
const menu = $("menu"), play = $("play"), stage = $("stage"), app = $("app");
const saved = MK.get("mokomeskartu-klase", 0), KEY = "mk-" + GAME + "-kasa", SEEN = "mk-" + GAME + "-matyta";
const TH = [30, 80, 150, 240, 350, 480, 630, 800, 990, 1200, 1430, 1700];
const stallsFor = p => TH.filter(t => p >= t).length;
app.prepend(MK.top({ title: T.title, grade: GRADES.includes(saved) ? saved : GRADES[0] }));
$("heroH").innerHTML = `${T.heroA} <em>${T.heroB}</em>`; $("heroP").textContent = T.hero; $("ptsL").textContent = T.pts;
function squareSvg(open, fresh){
  let s = `<svg viewBox="0 0 360 172" role="img" aria-label="${T.colH}"><rect width="360" height="172" rx="14" fill="#efe2c2"/>`;
  for(let i = 0; i < 12; i++){
    const x = 8 + (i % 6) * 58, y = 8 + Math.floor(i / 6) * 82, g = GOODS[i];
    if(i < open) s += `<g class="${fresh && i >= open - fresh ? "st-new" : ""}">${stall(x + 2, y, 50, 56, g.aw, g.col)}<text x="${x + 27}" y="${y + 70}" text-anchor="middle" style="font:800 8.6px Manrope,system-ui,sans-serif" fill="#121a33">${g.n.replace(/^(gėlių |moliniai |vilnonės )/, "")}</text></g>`;
    else s += `<rect x="${x + 2}" y="${y + 2}" width="50" height="54" rx="8" fill="#f8efd8" stroke="#b9a877" stroke-width="1.6" stroke-dasharray="5 4"/><text x="${x + 27}" y="${y + 34}" text-anchor="middle" style="font:800 12px Manrope,system-ui,sans-serif" fill="#a2915f">${TH[i]}</text><text x="${x + 27}" y="${y + 70}" text-anchor="middle" style="font:700 8.6px Manrope,system-ui,sans-serif" fill="#a2915f">tšk.</text>`;
  }

}
function renderCol(fresh){
  const pts = MK.get(KEY, 0), open = stallsFor(pts), ri = Math.min(4, Math.floor(open / 3));
  $("col").innerHTML = `<h2>${COLICON}${T.colH}</h2><p>${T.colP(pts, open, 12, T.ranks[ri], open < 12 ? TH[open] - pts : 0)}</p>${squareSvg(open, fresh || 0)}`;
}
function showMenu(fresh){
  play.hidden = true; menu.hidden = false; $("heroArt").innerHTML = heroSvg(); renderCol(fresh);
  MK.levels($("levels"), { game: GAME, levels: LEVELS, onPick: start });
  MK.learn($("learn"), { topics: T.learn, onPlay: start });
  window.scrollTo(0, 0);
}

/* ================= žaidimas ================= */
let L = 0, tasks = [], ti = 0, cur = null, okN = 0, pts = 0, dots = null, stalls0 = 0, busy = false;
function start(i){
  used = []; L = i; tasks = LV[i](); ti = 0; okN = 0; pts = 0; $("pts").textContent = 0; stalls0 = stallsFor(MK.get(KEY, 0));
  menu.hidden = true; play.hidden = false; dots = MK.dots($("dots"), tasks.length); show();
}
function award(n){ if(n){ pts += n; MK.set(KEY, MK.get(KEY, 0) + n); const c = $("ptsChip"); $("pts").textContent = pts; c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop"); } }
function first(ok){ dots.mark(ti, ok); if(ok) okN++; }
function addWhy(ok, w, ans){ const d = document.createElement("div"); d.innerHTML = MK.why({ ok, head: ok ? MK.praise() : (ans ? T.bad(ans) : T.badPlain), body: cl(w.body), more: cl(w.more), sum: T.rule, open: !ok }); $("flow").appendChild(d.firstElementChild); }
function nextBtn(){
  const b = document.createElement("button"); b.type = "button"; b.className = "mk-btn"; b.id = "next"; b.textContent = ti < tasks.length - 1 ? T.next + " →" : T.finish;
  b.onclick = () => { MK.sfx.tap(); ti++; if(ti < tasks.length) show(); else finish(); };
  $("flow").appendChild(b); setTimeout(() => b.scrollIntoView({ block: "nearest", behavior: "smooth" }), 60);
}
function close(ok, w, ans){ if(ok) MK.sfx.good(); else MK.sfx.bad(); addWhy(ok, w, ans); nextBtn(); }
function viewHtml(c, o){
  o = o || {}; const m = c.m;
  if(c.view === "table") return `<div class="tb" id="tb"><div class="tr h"><span>${T.priceE}</span><span>${T.demQ}, ${m.u}</span><span>${T.supQ}, ${m.u}</span></div>${m.rows.map(p => `<${c.type === "set" ? "button type=\"button\"" : "div"} class="tr" data-v="${p}"><span>${p}</span><span>${m.qd(p)}</span><span>${m.qs(p)}</span></${c.type === "set" ? "button" : "div"}>`).join("")}</div>`;
  if(c.view === "best") return `<div class="tb" id="tb"><div class="tr h plain ${o.profit ? "c3b" : "c2"}"><span>${T.priceE}</span><span>${T.demQ}, ${m.u}</span>${o.profit ? `<span>${T.profitCol}</span>` : ""}</div>${m.rows.map(p => `<button type="button" class="tr ${o.profit ? "c3b" : "c2"}" data-v="${p}"><span>${p}</span><span>${m.qd(p)}</span>${o.profit ? `<span>${String(m.pr(p)).replace("-", "−")}</span>` : ""}</button>`).join("")}</div>`;
  if(c.view === "graph") return `<div class="gr" id="gr">${graph(m, { price: o.price, eq: o.eq, ab: c.ab })}</div>`;
  if(c.view === "func") return `<div class="fx"><span>${T.dem}:</span><b class="d">Q = ${m.fD}</b><br><span>${T.sup}:</span><b class="s">Q = ${m.fS}</b><small>${T.funcNote(m.u)}</small></div>`;
  return "";
}
function show(){
  cur = tasks[ti]; dots.cur(ti); busy = false; const c = cur, g = c.g || c.m.g;
  stage.innerHTML = `<div class="scene" id="scene">${sceneSvg(g, c.type === "shift" ? 3 : 4, c.type === "shift" ? 3 : 4)}</div><div class="cap" id="cap">&nbsp;</div>
    <p class="q" id="q">${cl(c.text)}</p><div id="view"></div><div id="ctl"></div><div class="note" id="note"></div><div id="flow"></div>`;
  ({ choice: showChoice, set: showSet, shift: showShift })[c.type](c);
  window.scrollTo(0, 0);
}
function optsHtml(opts, two, id){ return `<div class="opts${two ? " two" : ""}" id="${id}">${opts.map((o, i) => `<button type="button" class="opt" data-i="${i}">${o}</button>`).join("")}</div>`; }
function lockOpts(box, pick, right){ box.querySelectorAll(".opt").forEach((b, i) => { b.disabled = true; if(i === right) b.classList.add("ok"); else if(i === pick) b.classList.add("no"); else b.classList.add("dim"); }); }
function showChoice(c){
  $("view").innerHTML = viewHtml(c); $("ctl").innerHTML = optsHtml(c.opts, c.two, "opts");
  $("opts").onclick = e => {
    const b = e.target.closest(".opt"); if(!b || b.disabled) return; const i = +b.dataset.i, ok = i === c.right;
    lockOpts($("opts"), i, c.right);
    if(c.after && c.view === "graph") $("view").innerHTML = viewHtml(c, c.after);
    if(c.view === "table" && c.after && c.after.price != null){ const r = $("tb").querySelector(`[data-v="${c.after.price}"]`); if(r) r.classList.add("sel"); }
    if(c.view === "table" && c.after && c.after.eq){ const r = $("tb").querySelector(`[data-v="${c.m.P}"]`); if(r) r.classList.add("ok"); }
    first(ok); award(ok ? 10 : 0); close(ok, c.why, c.opts[c.right]);
  };
}
async function runSim(c, v){
  const s = c.sim(v), g = c.m.g; $("scene").innerHTML = sceneSvg(g, s.crates, s.buyers); const cap = $("cap"); cap.className = "cap"; cap.innerHTML = "&nbsp;";
  const cr = $("scene").querySelectorAll(".crate"), bu = $("scene").querySelectorAll(".buyer");
  MK.sfx.whoosh(); await MK.wait(350);
  for(let i = 0; i < s.sold; i++){ if(cr[i]) cr[i].classList.add("gone"); if(bu[i]) bu[i].classList.add("got"); if(i % 2 === 0) MK.sfx.tap(); await MK.wait(130); }
  for(let i = s.sold; i < bu.length; i++) bu[i].classList.add("sad");
  for(let i = s.sold; i < cr.length; i++) cr[i].classList.add("left");
  cap.className = "cap " + s.cls; cap.textContent = cl(s.cap); await MK.wait(350);
}
function showSet(c){
  let v = c.start, tries = 0; const tbl = c.view === "table" || c.view === "best", idx = () => c.values.indexOf(v);
  const lab = c.qty ? T.yourQty : T.yourPrice, fmt = x => c.qty ? `${x} ${c.unit}` : eur(x);
  $("view").innerHTML = viewHtml(c, { price: v });
  $("ctl").innerHTML = (tbl ? "" : `<div class="stp" id="stp"><button type="button" id="mn" aria-label="−">−</button><div><span><small>${lab}</small><span id="val"></span></span></div><button type="button" id="pl" aria-label="+">+</button></div>`)
    + `<button type="button" class="mk-btn go" id="go">${T.open}</button>`;
  const note = h => { $("note").innerHTML = cl(h); };

    $("go").disabled = v == null;
  };
  if(tbl) $("tb").onclick = e => { const r = e.target.closest("button.tr"); if(!r || busy || r.disabled) return; v = +r.dataset.v; MK.sfx.tap(); upd(); };
  else { $("mn").onclick = () => { if(busy) return; v = c.values[idx() - 1]; MK.sfx.tap(); upd(); }; $("pl").onclick = () => { if(busy) return; v = c.values[idx() + 1]; MK.sfx.tap(); upd(); }; }
  upd();
  const end = ok => {
    $("go").remove();
    if(tbl){ if(c.view === "best"){ $("view").innerHTML = viewHtml(c, { profit: true }); } $("tb").querySelectorAll("button.tr").forEach(r => { r.disabled = true; r.classList.remove("sel"); if(+r.dataset.v === c.target) r.classList.add("ok"); }); }
    else { $("stp").classList.add("done"); if(ok) $("stp").classList.add("ok"); if(c.view === "graph") $("view").innerHTML = viewHtml(c, { price: c.target, eq: c.id.indexOf("setEq") === 0 }); }
  };
  $("go").onclick = async () => {
    if(busy || v == null) return; busy = true; MK.unlock(); tries++; $("go").disabled = true; note("");
    await runSim(c, v);
    if(c.ok(v)){ first(tries === 1); award([10, 6, 3][tries - 1]); end(true); close(true, c.why); }
    else if(tries < 3){
      MK.sfx.bad(); note(c.fb(v) + " " + T.tries(3 - tries));
      if(tbl){ const r = $("tb").querySelector(`button[data-v="${v}"]`); r.classList.remove("sel"); r.classList.add("no"); r.disabled = true; v = null; }

      note(c.fb(v)); v = c.target; if(!tbl) $("val").textContent = fmt(v);

    }
  };
}
function showShift(c){

  $("ctl").innerHTML = optsHtml(T.o.s1, true, "o1") + `<div id="s2"></div>`;
  $("o1").onclick = e => {
    const b = e.target.closest(".opt"); if(!b || b.disabled) return; const i = +b.dataset.i; ok1 = i === c.r1; lockOpts($("o1"), i, c.r1);

    $("o2").onclick = e2 => {
      const b2 = e2.target.closest(".opt"); if(!b2 || b2.disabled) return; const j = +b2.dataset.i, ok2 = j === c.r2; lockOpts($("o2"), j, c.r2);
      $("gr").innerHTML = shiftSvg(c.c, c.d, 2);
      const seen = MK.get(SEEN, []); seen.push(c.si); MK.set(SEEN, seen.slice(-40));

    setTimeout(() => $("o2").scrollIntoView({ block: "nearest", behavior: "smooth" }), 60);
  };
}
function finish(){
  const total = tasks.length, stars = MK.starsFor(okN, total); MK.best(GAME, LEVELS[L].id, stars);
  const now = stallsFor(MK.get(KEY, 0)), fresh = now - stalls0, names = GOODS.slice(stalls0, now).map(g => g.n);
  MK.result({ stars, title: `${okN} / ${total}`, text: T.res(okN, total, pts, names),
    next: L < LEVELS.length - 1 ? () => start(L + 1) : null, again: () => start(L), menu: () => showMenu(fresh) });
}
Object.defineProperty(window, "__cur", { get: () => cur });
window.__MK_TEST = { LV, G, T, GOODS, market, TH, stallsFor };
showMenu();
})();
