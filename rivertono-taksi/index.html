<!doctype html>
<html lang="lt">
<head>

<meta name="theme-color" content="#fff1cf">

<style>
/* Rivertono taksi: komiksų / miesto žemėlapio stilius – stori kontūrai, geltona taksi spalva, kalbos burbulai. */
body{--ink:#1d2433;--paper:#fff1cf;--taxi:#ffc928;--soft:#5d6477;--kid:"Rubik",system-ui,sans-serif;--body:"Rubik",system-ui,sans-serif;background:#fff1cf;background-image:radial-gradient(#f3dfae 1.2px,transparent 1.3px);background-size:14px 14px;color:var(--ink)}
.mk-app{max-width:720px;padding-block:6px 14px}
.mk-top{padding-bottom:8px}
.mk-back,.mk-ico{border-radius:10px;box-shadow:3px 3px 0 var(--ink);height:40px}.mk-ico{width:40px}
.mk-ico[data-k="music"]{display:none}
.mk-title{font:italic 800 21px/1.1 var(--kid);letter-spacing:.01em}
.kick{display:inline-block;background:var(--ink);color:#fff;font:800 11.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:6px 9px;border-radius:6px;transform:rotate(-1.5deg)}
h1{margin:10px 0 6px;font:italic 900 clamp(34px,10vw,52px)/.98 var(--kid);letter-spacing:-.01em;text-shadow:3px 3px 0 var(--taxi)}
.lead{margin:0 0 14px;font:500 15.5px/1.5 var(--body)}
#hero{display:block;width:100%;aspect-ratio:1.9;border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);margin-bottom:16px;background:#cfe8a9}
.panel{background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:12px 14px;margin:0 0 14px;font:500 14.5px/1.45 var(--body)}
.lic{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;background:#fffbe9}
.lic svg{grid-row:1/span 3;width:54px;height:92px}
.lic h2{margin:0;font:800 11.5px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.lic b{font:italic 800 21px/1.15 var(--kid)}.lic span{font:700 14px/1.3 var(--body)}
.sec{margin:18px 0 9px;font:italic 800 20px/1.1 var(--kid)}
.shift{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;width:100%;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:10px 12px;margin:0 0 11px;cursor:pointer;font:inherit;color:inherit}
.shift:hover{background:#fff8dd}.shift:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.shift i{grid-row:1/span 2;width:40px;height:40px;border-radius:50%;background:var(--taxi);border:3px solid var(--ink);display:grid;place-items:center;font:italic 900 19px/1 var(--kid)}
.shift b{font:800 17.5px/1.2 var(--kid)}.shift span{grid-column:2;font:500 13px/1.35 var(--body);color:#3b4254}
.shift .st{grid-row:1/span 2;grid-column:3;font-size:17px;letter-spacing:1px;color:#d8d2bf}.shift .st u{text-decoration:none;color:#f0a400}
.guide{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.gp{background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:7px 4px 6px;text-align:center;font:700 12px/1.2 var(--body)}
.gp svg{width:34px;height:34px;display:block;margin:0 auto 3px}.gp small{display:block;font:500 11px/1.2 var(--body);color:var(--soft)}
.gp.no{background:#f4ecd6;border-style:dashed;color:#a59c84}.gp.no svg{opacity:.28}
details.bk{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:0 13px;margin:0 0 8px;font:500 14.5px/1.5 var(--body)}
details.bk summary{cursor:pointer;font:800 16.5px/1.3 var(--kid);padding:11px 0;list-style:none}
details.bk summary::before{content:"▸ ";color:#f0a400}details.bk[open] summary::before{content:"▾ "}
details.bk summary::-webkit-details-marker{display:none}
details.bk p{margin:8px 0 12px}
.rows{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px;border-top:2px solid var(--ink)}
.rows span{padding:6px 0;border-bottom:1.5px dashed #c9c2ad}.rows .en{font-weight:800}
.note{color:var(--soft);font:500 12.5px/1.45 var(--body);margin:14px 0 0}
/* ---- žaidimas ---- */
#game{flex:1;display:flex;flex-direction:column;min-height:0}
.radio{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 10px;align-items:start;margin-bottom:8px}
.radio .who{width:46px;text-align:center;font:800 10px/1.1 var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}
.radio .who svg{width:44px;height:74px;display:block;margin:0 auto 1px}
.bub{position:relative;background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:9px 12px 9px;min-height:66px;font:500 14px/1.4 var(--body)}
.bub::before{content:"";position:absolute;left:-13px;top:20px;border:8px solid transparent;border-right-color:var(--ink);border-left:0}
.bub::after{content:"";position:absolute;left:-8px;top:22px;border:6px solid transparent;border-right-color:#fff;border-left:0}
.bub .en{font:800 clamp(16px,4.5vw,19px)/1.35 var(--kid);margin:0}
.bub .tip{margin:5px 0 0;font:500 12px/1.35 var(--body);color:var(--soft)}
.acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border:2.5px solid var(--ink);border-radius:10px;background:#fff;box-shadow:2px 2px 0 var(--ink);font:800 13.5px/1 var(--body);cursor:pointer;color:var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:none}.btn svg{width:18px;height:18px}
.btn.y{background:var(--taxi)}.btn.big{min-height:48px;padding:0 20px;font-size:16px}
.stage{position:relative;flex:1;min-height:300px;border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);overflow:hidden;background:#cfe8a9;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.chip{position:absolute;top:8px;left:8px;display:flex;gap:6px;align-items:center;font:800 12.5px/1 var(--body)}
.chip span,.chip button{background:#fff;border:2.5px solid var(--ink);border-radius:9px;padding:7px 9px;box-shadow:2px 2px 0 var(--ink)}
.chip button{cursor:pointer;font:inherit;color:inherit}
.tr{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.tr .btn{min-height:38px;padding:0 10px}
@media (max-width:520px){.tr .btn span{display:none}}
#joy{position:absolute;right:12px;bottom:12px;width:136px;height:136px;border-radius:50%;background:rgba(255,255,255,.74);border:3px solid var(--ink);touch-action:none}
#joy::before{content:"";position:absolute;inset:18px;border:2px dashed rgba(29,36,51,.35);border-radius:50%}
#joy b{position:absolute;font:900 13px/1 var(--kid);color:rgba(29,36,51,.5);pointer-events:none}
#joy b:nth-of-type(1){left:50%;top:5px;transform:translateX(-50%)}#joy b:nth-of-type(2){left:50%;bottom:5px;transform:translateX(-50%)}
#joy b:nth-of-type(3){left:6px;top:50%;transform:translateY(-50%)}#joy b:nth-of-type(4){right:6px;top:50%;transform:translateY(-50%)}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:var(--taxi);border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink);pointer-events:none}
#here{position:absolute;right:36px;bottom:160px;width:88px;height:88px;border-radius:50%;background:var(--taxi);border:3.5px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font:italic 900 22px/1 var(--kid);color:var(--ink);cursor:pointer;touch-action:manipulation}
#here:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
#here:disabled{background:#eee6cf;color:#a59c84;border-color:#a59c84;box-shadow:none}
#toast{position:absolute;left:50%;top:56px;transform:translateX(-50%);max-width:88%;background:var(--ink);color:#fff;border-radius:10px;padding:9px 13px;font:700 13.5px/1.35 var(--body);text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}#toast.bad{background:#c2331f}
#maphint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#fff;border:2.5px solid var(--ink);border-radius:9px;padding:7px 10px;font:700 12.5px/1.3 var(--body);white-space:nowrap}
.stage.map #joy,.stage.map #here{display:none}
#mon{background:#e9f8e0}#mon.neg{background:#ffe1dc;color:#b3261a}
#wait{position:absolute;left:8px;right:8px;top:50px;height:12px;background:#fff;border:2.5px solid var(--ink);border-radius:7px;overflow:hidden}#wait[hidden]{display:none}
#waitBar{height:100%;width:100%;background:var(--taxi)}#wait.low #waitBar{background:#e5533d}
.gp.car{display:grid;gap:5px;justify-items:center}.gp.car svg{width:56px;height:32px;margin:0}.gp.car.on{background:#fff8dd}.gp.car .btn{min-height:32px;font-size:12px;padding:0 8px}.gp.car .btn:disabled{box-shadow:none;background:#f4ecd6;color:var(--soft)}
.mbox h2 small{font:800 15px/1 var(--body);font-style:normal}.bub .en small{font:800 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:2px}
#modal{position:fixed;inset:0;z-index:50;background:rgba(29,36,51,.55);display:grid;place-items:center;padding:14px;overflow:auto}
#modal[hidden]{display:none}
.mbox{width:min(520px,100%);background:#fff;border:3.5px solid var(--ink);border-radius:16px;box-shadow:6px 6px 0 var(--ink);padding:16px 16px 14px;font:500 14.5px/1.5 var(--body);animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.92) rotate(-1deg);opacity:0}to{transform:none;opacity:1}}
.mbox h2{margin:0 0 8px;font:italic 900 24px/1.1 var(--kid)}
.mbox h2.bad{color:#c2331f}.mbox h2.ok{color:#1c7c3c}
.mbox p{margin:0 0 8px}.mbox .lab{font:800 11px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:10px 0 2px}
.mbox .en{font:800 17px/1.4 var(--kid);background:#fff8dd;border:2px solid var(--ink);border-radius:10px;padding:8px 10px;margin:0 0 6px}
.mbox ul{margin:0 0 8px;padding-left:18px}.mbox li{margin:3px 0}
.mbox .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.rec{border-top:2px dashed var(--ink);border-bottom:2px dashed var(--ink);padding:6px 0;margin:8px 0;font:700 13.5px/1.6 ui-monospace,Menlo,Consolas,monospace}
.rec div{display:flex;justify-content:space-between;gap:10px}
.stars{font-size:34px;letter-spacing:4px;color:#d8d2bf;text-align:center;margin:4px 0}.stars u{text-decoration:none;color:#f0a400}
@media (min-width:700px){.bub{font-size:15px}.pad{opacity:.6}}
@media (prefers-reduced-motion:reduce){.mbox{animation:none}}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <main id="menu">
    <canvas id="hero" aria-hidden="true"></canvas>
    <div class="kick" id="kick"></div><h1 id="h1"></h1><p class="lead" id="lead"></p>
    <section class="panel lic" id="lic"></section>
    <h2 class="sec" id="shT"></h2><div id="shifts"></div>
    <h2 class="sec" id="spT"></h2><div class="guide" id="shop"></div>
    <h2 class="sec" id="gdT"></h2><div class="guide" id="guide"></div><p class="note" id="gdN" style="margin-top:8px"></p>
    <h2 class="sec" id="bkT"></h2><div id="book"></div>
    <p class="note" id="note"></p>

  <main id="game" hidden>
    <div class="radio"><div class="who" id="who"></div><div class="bub" id="bub" role="status" aria-live="polite"></div></div>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>

      <div id="wait" hidden><div id="waitBar"></div></div>
      <div class="tr"><button type="button" class="btn" id="mapB"></button></div>
      <div id="joy" role="application"><b>▲</b><b>▼</b><b>◀</b><b>▶</b><i></i></div>
      <button type="button" id="here"></button>
      <div id="toast" role="status"></div>
      <div id="maphint" hidden></div>
    </div>
  </main>
</div>
<div id="modal" hidden><div class="mbox" id="mbox" role="dialog" aria-modal="true"></div></div>

function input(){
  let thr = 0, st = 0;

  if(joy.id != null && Math.hypot(joy.x, joy.y) > 0.18){
    st = Math.abs(joy.x) > 0.15 ? Math.sign(joy.x) * Math.pow(Math.abs(joy.x), 1.4) : 0;          /* švelnus vairas, kaip 2 versijoje */
    thr = joy.y < -0.2 ? 0.35 + 0.65 * Math.min(1, -joy.y * 1.15) : joy.y > 0.5 ? -1 : Math.abs(joy.x) > 0.3 ? 0.45 : 0;   /* tik į šoną – lėtas važiavimas sukant */

}

  if(G.gps && G.fare){ const l = lots[G.fare.stops[G.fare.stopIdx]]; edgeArrow(ctx, w2s, l.cx, l.cy, "#3ad06a"); }
  if(!G.map){ const a = view.a; ctx.save(); ctx.translate(W - 28, 72); ctx.fillStyle = "#fff"; ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 17, 0, 7); ctx.fill(); ctx.stroke(); ctx.rotate(a); ctx.fillStyle = "#e5533d"; ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(5, 0); ctx.lineTo(-5, 0); ctx.closePath(); ctx.fill(); ctx.fillStyle = "#9aa1b3"; ctx.beginPath(); ctx.moveTo(0, 13); ctx.lineTo(5, 0); ctx.lineTo(-5, 0); ctx.closePath(); ctx.fill(); ctx.fillStyle = INK; ctx.font = "800 9px Rubik,sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("N", 0, -6); ctx.restore(); }

function drawHero(){
