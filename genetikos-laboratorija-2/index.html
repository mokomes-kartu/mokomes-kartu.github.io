<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Genetikos konsultacija – MokomėsKartu.lt</title>
<meta name="description" content="Biologijos žaidimas 11–12 klasei (VBE): tirk genealoginius medžius, nustatyk paveldėjimo tipą ir genotipus, skaičiuok riziką; dihibridinis kryžminimas, sukibę genai, analizuojamasis kryžminimas.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f3f6f7">
<link rel="icon" href="/logo/mk-ikona.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="/bendra/mk.js"></script>
<script src="tekstai.lt.js"></script>
<script src="genetika.js"></script>
<style>
/* Genetikos konsultacija: santūrus klinikos kortelės stilius – balti lapai, plonos linijos, žalsvai mėlynas akcentas. */
body{--paper:#f3f6f7;--ink:#1d2b3a;--soft:#5b6b7a;--kid:"Public Sans",system-ui,sans-serif;--body:"Public Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --ac:#0f766e;--ac-soft:#dff1ee;--line:#cdd6dd;--warn:#b42318;--warn-soft:#fbe9e7;background:#f3f6f7;background-image:none;font-weight:500;color:var(--ink)}
.mk-app{max-width:600px;padding-block:6px 20px}
.mk-top{padding-bottom:8px}
.mk-back,.mk-ico{border-radius:8px;border-width:1.5px;box-shadow:none;height:40px}
.mk-ico{width:40px}.mk-ico[data-k="music"]{display:none}
.mk-title{font:700 15px/1.1 var(--body);letter-spacing:.02em}
.kick{font:600 11px/1.3 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}
h1{margin:6px 0;font:700 clamp(28px,7.5vw,38px)/1.05 var(--body);letter-spacing:-.02em}
.lead{margin:0 0 14px;font-size:15px;line-height:1.5;color:#2b3a49}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 10px}
.card h2{margin:0 0 6px;font:600 11px/1.2 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--soft)}
.card p{margin:0 0 6px;font-size:14.5px;line-height:1.5}
.rank{font:700 19px/1.2 var(--body)}
.bars{display:inline-flex;gap:3px;vertical-align:middle;margin-left:8px}
.bars i{width:9px;height:13px;background:#dbe2e7;border-radius:1px}.bars i.on{background:var(--ac)}
.day{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left:4px solid var(--ac);border-radius:8px;padding:11px 14px;margin:0 0 8px;cursor:pointer;font:inherit;color:inherit}
.day:hover{background:#f9fbfb}.day b{font:700 16.5px/1.2 var(--body)}
.day span{grid-column:1;font-size:13.5px;line-height:1.4;color:#2b3a49}
.day code{grid-column:1;font:500 11px/1.3 var(--mono);color:var(--soft);text-transform:uppercase;letter-spacing:.04em}
.day .stars{grid-row:1/span 3;grid-column:2;align-self:center;font:600 15px/1 var(--mono);letter-spacing:2px;color:#cbd4db}
.stars u,.big u{text-decoration:none;color:var(--ac)}
details.man{background:#fff;border:1px solid var(--line);border-radius:8px;padding:0 14px;margin:0 0 6px}
details.man summary{cursor:pointer;font-weight:700;font-size:15px;padding:12px 0;list-style:none}
details.man summary::-webkit-details-marker{display:none}
details.man summary::before{content:"+ ";font-family:var(--mono);color:var(--ac)}
details.man[open] summary::before{content:"− "}
details.man p{margin:0 0 10px;font-size:14.5px;line-height:1.5}
.ex{background:var(--ac-soft);border-left:3px solid var(--ac);padding:8px 10px;font:500 12.5px/1.6 var(--mono)}
.note{color:var(--soft);font-size:12.5px;line-height:1.45;margin:12px 0 0}
.hero{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:12px}

.bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;margin-bottom:8px}
.bar button{width:38px;height:38px;border:1.5px solid var(--ink);border-radius:8px;background:#fff;font:600 14px/1 var(--mono);cursor:pointer;color:var(--ink);padding:0}
.bar .m{font:600 11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--soft)}
.bar .m b{display:block;font:700 14px/1.2 var(--body);color:var(--ink);text-transform:none;letter-spacing:0}
.bar .pt{font:600 13px/1 var(--mono)}
.tabs{display:flex;gap:4px;margin:0 0 8px}
.tabs i{flex:1;font:600 10.5px/1.2 var(--mono);font-style:normal;text-transform:uppercase;letter-spacing:.03em;padding:6px 4px;text-align:center;border-bottom:3px solid var(--line);color:var(--soft)}
.tabs i.cur{border-color:var(--ac);color:var(--ink)}.tabs i.done{border-color:var(--ac);color:var(--ac)}
#ped{display:block;width:100%;height:auto;touch-action:manipulation}
#ped .p{cursor:pointer}
#ped .sym{fill:#fff;stroke:#1d2b3a;stroke-width:2}
#ped .aff .sym{fill:#1d2b3a}
#ped .ring{fill:none;stroke:#0f766e;stroke-width:2;stroke-dasharray:4 3}
#ped .sel .ring{stroke-dasharray:none;stroke-width:3}
#ped .bad .ring{stroke:#b42318;stroke-dasharray:none;stroke-width:3}
#ped .ev .ring{stroke:#d97706;stroke-dasharray:none;stroke-width:3}
#ped text{font-family:"IBM Plex Mono",monospace;font-weight:600}
#ped .code{font-size:8.5px;fill:#5b6b7a}
#ped .gt{font-size:9.5px;fill:#0f766e}
#ped .bad .gt{fill:#b42318}
#ped .qm{font-size:13px;fill:#0f766e}
#ped .aff .qm{fill:#fff}
#ped .ln{stroke:#1d2b3a;stroke-width:1.5;fill:none}
.qq{margin:0 0 8px;font-size:15.5px;line-height:1.5}
.sm{font-size:12.5px;line-height:1.45;color:var(--soft);margin:0 0 8px}
.opt{display:block;width:100%;text-align:left;min-height:46px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font:600 14.5px/1.3 var(--body);color:var(--ink);padding:8px 12px;margin:0 0 6px;cursor:pointer}
.opt.on{border-color:var(--ac);background:var(--ac-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.chip{min-height:44px;min-width:64px;border:1.5px solid var(--ink);border-radius:8px;background:#fff;font:600 14px/1.2 var(--mono);color:var(--ink);padding:6px 10px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.evbox{font:600 12.5px/1.4 var(--mono);color:var(--ac);margin:2px 0 8px;min-height:18px}
.btn{display:block;width:100%;min-height:50px;border:1.5px solid var(--ink);border-radius:8px;background:var(--ink);color:#fff;font:700 15.5px/1.2 var(--body);cursor:pointer;padding:8px 12px}
.btn.sec{background:#fff;color:var(--ink)}.btn.ac{background:var(--ac);border-color:var(--ac)}
.btn+.btn{margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.row2 .btn+.btn{margin-top:0}
.fb{font-size:14.5px;line-height:1.5;margin:0 0 10px;padding:9px 11px;border-left:3px solid var(--line);background:#f3f6f7;border-radius:0 6px 6px 0}
.fb:empty{display:none}.fb.ok{border-color:var(--ac);background:var(--ac-soft)}.fb.bad{border-color:var(--warn);background:var(--warn-soft)}
.fb ul{margin:6px 0 0;padding-left:18px}.fb li{margin:0 0 3px;font-size:13.5px}
.fb code{font:600 13px/1 var(--mono)}
.ansrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;margin-bottom:8px}
.disp{height:48px;border:1.5px solid var(--ink);border-radius:8px;background:#f9fbfb;font:600 24px/46px var(--mono);padding:0 12px;overflow:hidden;white-space:nowrap}
.disp:empty::before{content:attr(data-ph);color:#a9b4bd;font-size:15px}
.unit{font:600 16px/1 var(--mono);min-width:26px}
.pad{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-bottom:10px}
.pad button{height:46px;border:1.5px solid var(--ink);border-radius:8px;background:#fff;font:600 19px/1 var(--mono);cursor:pointer;color:var(--ink);padding:0}
.pad button:active{background:#e6ecef}
table.cnt{width:100%;border-collapse:collapse;margin:0 0 8px;font:600 13.5px/1.3 var(--mono)}
table.cnt td{padding:6px 8px;border-bottom:1px solid var(--line)}table.cnt td:last-child{text-align:right}
table.cnt i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:-1px}
#dots{display:block;width:100%;height:92px;border:1px solid var(--line);border-radius:8px;background:#f9fbfb;margin:0 0 8px}
.big{font:600 30px/1 var(--mono);letter-spacing:6px;color:#cbd4db;margin:6px 0 8px}
.rep h3{margin:0 0 4px;font:700 22px/1.15 var(--body)}
sup,sub{font-size:.72em;line-height:0}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <main id="menu">
    <svg class="hero" viewBox="0 0 560 170" role="img" aria-label="Genealoginis medis">
      <g stroke="#1d2b3a" stroke-width="2" fill="none"><path d="M236 40h88M280 40v34M130 74h300M130 74v22M280 74v22M430 74v22M142 108h52M168 108v30M118 138h100M118 138v10M218 138v10M168 138v10M378 108h40M398 108v30M358 138h80M358 138v10M438 138v10"/></g>
      <g stroke="#1d2b3a" stroke-width="2"><rect x="212" y="28" width="24" height="24" fill="#fff"/><circle cx="336" cy="40" r="12" fill="#fff"/>
        <circle cx="130" cy="108" r="12" fill="#1d2b3a"/><rect x="194" y="96" width="24" height="24" fill="#fff"/><rect x="268" y="96" width="24" height="24" fill="#fff"/><rect x="354" y="96" width="24" height="24" fill="#fff"/><circle cx="430" cy="108" r="12" fill="#fff"/>
        <rect x="106" y="148" width="20" height="20" fill="#fff"/><circle cx="168" cy="158" r="10" fill="#fff"/><rect x="208" y="148" width="20" height="20" fill="#fff"/><circle cx="358" cy="158" r="10" fill="#fff"/><rect x="428" y="148" width="20" height="20" fill="#1d2b3a"/></g>
      <circle cx="130" cy="108" r="18" fill="none" stroke="#d97706" stroke-width="3"/>
      <g font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600" fill="#0f766e"><text x="204" y="22">Aa</text><text x="328" y="22">Aa</text><text x="92" y="100">aa</text><text x="470" y="62" fill="#5b6b7a">P = 2/3 · 1/4</text></g>
    </svg>
    <div class="kick" id="kick"></div><h1 id="h1"></h1><p class="lead" id="lead"></p>
    <section class="card" id="file"></section>
    <div class="kick" id="shT" style="margin:14px 0 8px"></div><div id="days"></div>
    <div class="kick" id="manT" style="margin:16px 0 8px"></div><div id="manual"></div>
    <p class="note" id="note"></p>
  </main>
  <main id="play" hidden>
    <div class="bar"><button type="button" id="quit" aria-label="Baigti">✕</button><div class="m" id="minfo"></div><div class="pt" id="pts">0</div></div>
    <div id="stage"></div>
  </main>
</div>
<script>
"use strict";
const T = window.MK_T, G = window.GK, GAME = "genetikos-laboratorija-2", CKEY = "mk-genetikos-laboratorija-2-karjera", $ = id => document.getElementById(id);
const SHORT = Object.assign({}, T.GT, { "A?": "AA/Aa", "XA?": "XᴬX?" });
const career = () => Object.assign({ cases: 0, bench: 0, ok: 0, all: 0 }, MK.get(CKEY, {}));
let S = null, C = null;      /* S – darbo diena, C – dabartinė šeima arba stalo užduotis */

/* ---------- genealoginio medžio piešimas ---------- */
function layout(t){
  const ppl = t.ppl, II = t.II.map(i => ppl[i]), units = II.map(c => ({ c, k: c.sp >= 0 ? c.kids.map(i => ppl[i]) : [], w: c.sp >= 0 ? Math.max(2, c.kids.length) : 1 }));
  const tot = units.reduce((a, u) => a + u.w, 0), W = 340, sw = Math.min(64, W / tot), x0 = (W - sw * tot) / 2, pos = {}, Y = [0, 34, 112, 190];
  let s = 0;
  units.forEach(u => { const cx = x0 + (s + u.w / 2) * sw;
    if(u.c.sp >= 0){ const sp = ppl[u.c.sp], [l, r] = u.c.sex === "M" ? [u.c, sp] : [sp, u.c]; pos[l.id] = [cx - sw / 2, Y[2]]; pos[r.id] = [cx + sw / 2, Y[2]]; u.k.forEach((k, j) => pos[k.id] = [x0 + (s + (u.w - u.k.length) / 2 + j + 0.5) * sw, Y[3]]); }
    else pos[u.c.id] = [cx, Y[2]];
    s += u.w; });
  const xs = II.map(c => pos[c.id][0]), mid = Math.max(sw / 2 + 16, Math.min(W - sw / 2 - 16, (Math.min(...xs) + Math.max(...xs)) / 2));
  pos[0] = [mid - sw / 2, Y[1]]; pos[1] = [mid + sw / 2, Y[1]];
  return { pos, units, mid, W, H: 226 };
}
function pedSvg(){
  const t = C.t, ppl = t.ppl, L = C.L || (C.L = layout(t)), pos = L.pos, r = 12; let ln = "", sy = "";
  const sib = (mx, y, kids) => { if(!kids.length) return; const ky = pos[kids[0].id][1], sy2 = ky - 30, xs = kids.map(k => pos[k.id][0]).concat(mx); ln += `<path class="ln" d="M${mx} ${y}V${sy2}M${Math.min(...xs)} ${sy2}H${Math.max(...xs)}${kids.map(k => `M${pos[k.id][0]} ${sy2}V${ky - r}`).join("")}"/>`; };
  ln += `<path class="ln" d="M${pos[0][0] + r} ${pos[0][1]}H${pos[1][0] - r}"/>`; sib(L.mid, pos[0][1], t.II.map(i => ppl[i]));
  L.units.forEach(u => { if(u.c.sp < 0) return; const a = pos[u.c.id], b = pos[u.c.sp], x1 = Math.min(a[0], b[0]), x2 = Math.max(a[0], b[0]); ln += `<path class="ln" d="M${x1 + r} ${a[1]}H${x2 - r}"/>`; sib((x1 + x2) / 2, a[1], u.k); });
  ppl.forEach(p => { const [x, y] = pos[p.id], ask = C.step === 1 && t.ask.includes(p.id), g = C.gt[p.id], cls = ["p", p.aff ? "aff" : "", C.step === 0 && C.ev === p.id ? "sel" : "", C.step === 1 && C.cur === p.id ? "sel" : "", C.bad && C.bad.includes(p.id) ? "bad" : "", C.showEv && t.evid.includes(p.id) ? "ev" : ""].join(" ");
    const ring = (ask || /sel|bad|ev/.test(cls)) ? (p.sex === "M" ? `<rect class="ring" x="${x - r - 5}" y="${y - r - 5}" width="${2 * r + 10}" height="${2 * r + 10}" rx="3"/>` : `<circle class="ring" cx="${x}" cy="${y}" r="${r + 5}"/>`) : "";
    sy += `<g class="${cls}" data-id="${p.id}"><rect x="${x - 22}" y="${y - 24}" width="44" height="56" fill="transparent"/>${ring}${p.sex === "M" ? `<rect class="sym" x="${x - r}" y="${y - r}" width="${2 * r}" height="${2 * r}"/>` : `<circle class="sym" cx="${x}" cy="${y}" r="${r}"/>`}
      ${ask && !g ? `<text class="qm" x="${x}" y="${y + 4.5}" text-anchor="middle">?</text>` : ""}<text class="code" x="${x}" y="${y - r - 8}" text-anchor="middle">${p.code}</text>${g ? `<text class="gt" x="${x}" y="${y + r + 15}" text-anchor="middle">${SHORT[g]}</text>` : ""}</g>`; });
  return `<svg id="ped" viewBox="0 0 ${L.W} ${L.H}" role="img" aria-label="Genealoginis medis">${ln}${sy}</svg>`;
}

/* ---------- bendri elementai ---------- */
const padHtml2 = () => `<div class="pad">${["1", "2", "3", "4", "5", "⌫", "6", "7", "8", "9", "0", C.kind === "num" ? "," : "/"].map(k => `<button type="button" data-k="${k}">${k}</button>`).join("")}${C.kind === "num" ? "" : `<button type="button" data-k="," style="grid-column:6">,</button>`}</div>`;
function score(tries){ const p = tries === 1 ? 10 : tries === 2 ? 5 : 0; S.pts += p; S.steps++; if(tries === 1) S.first++; $("pts").textContent = S.pts; }
function head(){ const it = S.items[S.i], n = S.items.length; $("minfo").innerHTML = `${T.shifts[S.si].name}<b>${it.type === "case" ? T.caseN(S.i + 1, n) : T.taskN(S.i + 1, n)}</b>`; }
function nextItem(){ S.i++; if(S.i >= S.items.length) return report(); open(); }
function open(){
  const it = S.items[S.i]; head(); window.scrollTo(0, 0);
  if(it.type === "case"){ const t = G.tree(it.mode); C = { type: "case", t, step: 0, tries: 0, gt: {}, ev: null, sel: null, cur: null, val: "", q: G.question(t, S.used, it.hard) || G.question(t, new Set(), null) }; S.used.add(C.q.id); C.kind = "frac"; renderCase(); }
  else { const b = G.bench(it.id); C = { type: "bench", b, kind: b.kind, tries: 0, val: "", done: false, grown: 0, cnt: { hit: 0, miss: 0 }, geno: ["", ""] }; renderBench(); }
}

/* ---------- šeimos byla ---------- */
function renderCase(){
  const t = C.t, st = C.step; let panel = "";
  if(st === 0) panel = `<p class="qq">${T.s1q}</p>${Object.keys(T.modes).map(m => `<button type="button" class="opt${C.sel === m ? " on" : ""}" data-m="${m}">${T.modes[m]}</button>`).join("")}<div class="evbox" id="evb">${C.ev == null ? T.s1pick : T.s1sel(t.ppl[C.ev].code)}</div>`;
  else if(st === 1){ const p = C.cur != null ? t.ppl[C.cur] : null, opts = p ? (t.mode === "XR" ? G.OPTS[p.sex === "M" ? "XRM" : "XRF"] : G.OPTS[t.mode]) : [];
    panel = `<p class="qq">${T.s2q}</p><p class="sm">${T.s2legend[t.mode]}</p><div class="evbox">${p ? T.s2pick(p.code) : T.s2none}</div><div class="chips">${opts.map(o => `<button type="button" class="chip${C.gt[p.id] === o ? " on" : ""}" data-g="${o}">${T.GT[o]}</button>`).join("")}</div>`; }
  else { const x = T.q[C.q.id](C.q.who); panel = `<p class="qq">${x.q}</p><p class="sm">${T.s3q}</p><div class="ansrow"><div class="disp" id="disp" data-ph="${T.ans}">${C.val}</div><span class="unit"></span></div>${C.done ? "" : padHtml2()}`; }
  $("stage").innerHTML = `<div class="tabs">${T.step.map((s, i) => `<i class="${i < st ? "done" : i === st ? "cur" : ""}">${s}</i>`).join("")}</div>
    <div class="card"><p class="sm">${T.caseIntro}</p>${pedSvg()}</div><div class="card" id="panel">${panel}<div class="fb ${C.fbc || ""}" id="fb">${C.fb || ""}</div>${C.done ? `<button type="button" class="btn" id="go">${st < 2 ? T.next : S.i < S.items.length - 1 ? T.nextCase : T.finish}</button>` : `<button type="button" class="btn ac" id="chk">${T.check}</button>`}</div>`;
}
function fb(cls, html){ C.fbc = cls; C.fb = html; }
function checkCase(){
  const t = C.t;
  if(C.step === 0){
    if(!C.sel || C.ev == null){ fb("", T.s1need); return renderCase(); }
    const tOk = C.sel === t.mode, eOk = t.evid.includes(C.ev); C.tries++;
    if(tOk && eOk){ MK.sfx.good(); score(C.tries); C.done = true; C.showEv = true; fb("ok", `<b>${T.s1ok}</b> ${T.s1why[t.mode](t.ppl[C.ev].code)}`); }
    else if(C.tries === 1){ MK.sfx.bad(); fb("bad", tOk ? T.s1badEv[t.mode] : T.s1badType); }
    else { MK.sfx.bad(); score(3); C.done = true; C.showEv = true; C.sel = t.mode; C.ev = t.evid[0]; fb("bad", `<b>${T.modes[t.mode]}.</b> ${T.s1why[t.mode](t.ppl[t.evid[0]].code)}`); }
  } else if(C.step === 1){
    if(t.ask.some(i => !C.gt[i])){ fb("", T.s2need); return renderCase(); }
    const bad = t.ask.filter(i => C.gt[i] !== t.ppl[i].gt); C.tries++;
    const list = () => `<ul>${t.ask.map(i => `<li><code>${t.ppl[i].code}: ${T.GT[t.ppl[i].gt]}</code> – ${T.why[t.ppl[i].why]}</li>`).join("")}</ul>`;
    if(!bad.length){ MK.sfx.good(); score(C.tries); C.done = true; C.bad = null; C.cur = null; fb("ok", `<b>${T.s2ok}</b>${list()}`); }
    else if(C.tries === 1){ MK.sfx.bad(); C.bad = bad; fb("bad", T.s2bad(bad.length)); }
    else { MK.sfx.bad(); score(3); C.done = true; C.bad = null; C.cur = null; t.ask.forEach(i => C.gt[i] = t.ppl[i].gt); fb("bad", `<b>${T.s2show}</b>${list()}`); }
  } else {
    if(!C.val){ fb("", T.empty); return renderCase(); }
    const x = T.q[C.q.id](C.q.who), ok = G.okFrac(C.q.ans, C.val); C.tries++;
    if(ok){ MK.sfx.good(); score(C.tries); C.done = true; fb("ok", `<b>${C.tries === 1 ? T.ok1 : T.ok2}</b> ${x.s}`); }
    else if(C.tries === 1){ MK.sfx.bad(); C.val = ""; fb("bad", `<b>${T.hintT}</b> ${x.h}`); }
    else { MK.sfx.bad(); score(3); C.done = true; fb("bad", `<b>${T.solT}</b> ${x.s} <b>${T.right} ${T.fr(C.q.ans)}</b>`); }
  }
  renderCase();
}
function goCase(){
  if(C.step < 2){ C.step++; C.tries = 0; C.done = false; C.fb = ""; C.fbc = ""; C.showEv = false; C.ev = null; if(C.step === 1) C.cur = C.t.ask[0]; renderCase(); $("panel").scrollIntoView({ block: "nearest", behavior: "smooth" }); }
  else { const c = career(); c.cases++; MK.set(CKEY, c); nextItem(); }
}

/* ---------- kryžminimų stalas ---------- */
const COLS = ["#0f766e", "#d97706", "#7c3aed", "#64748b"];
function renderBench(){
  const b = C.b, x = T.b[b.id](b.v); let mid = "";
  if(b.cnt){ const ks = Object.keys(b.cnt); mid = `<canvas id="dots"></canvas><table class="cnt">${ks.map((k, i) => `<tr><td><i style="background:${COLS[i]}"></i>${k}</td><td>${b.cnt[k]}</td></tr>`).join("")}</table>`; }
  let inp;
  if(b.kind === "geno") inp = `<p class="sm">${T.genoPick}</p><div class="row2">${[["AA", "Aa"], ["BB", "Bb"]].map((pr, i) => `<div class="chips" style="margin:0">${pr.map(o => `<button type="button" class="chip${C.geno[i] === o ? " on" : ""}" data-gi="${i}" data-go="${o}">${o}</button>`).join("")}</div>`).join("")}</div>`;
  else inp = `<div class="ansrow"><div class="disp" id="disp" data-ph="${b.kind === "num" ? T.numAns : T.ans}">${C.val}</div><span class="unit">${b.id === "B6" ? "%" : ""}</span></div>${C.done ? "" : padHtml2()}`;
  const lab = C.done && b.kind === "frac" ? `<canvas id="dots"></canvas><p class="sm" id="gtxt">${C.grown ? T.grown(C.grown) + " · " + T.hit + ": " + C.cnt.hit + " · " + T.expect(T.fr(b.ans), Math.round(C.grown * b.p)) : T.benchTry}</p><button type="button" class="btn sec" id="grow">${C.grown ? T.growMore : T.grow}</button>` : "";
  $("stage").innerHTML = `<div class="card"><h2>${T.benchIntro}</h2><p class="qq">${x.q}</p>${mid}${b.kind === "frac" ? `<p class="sm">${T.s3q}</p>` : ""}${inp}<div class="fb ${C.fbc || ""}" id="fb">${C.fb || ""}</div>
    ${C.done ? "" : `<button type="button" class="btn ac" id="chk">${T.check}</button>`}${lab}${C.done ? `<button type="button" class="btn" id="go" style="margin-top:8px">${S.i < S.items.length - 1 ? T.nextTask : T.finish}</button>` : ""}</div>`;
  if(b.cnt) drawDots(Object.keys(b.cnt).flatMap((k, i) => Array(b.cnt[k]).fill(i)), false); else if(C.done && C.dots) drawDots(C.dots, false);
}
function drawDots(arr, anim){
  const cv = $("dots"); if(!cv) return; const w = cv.clientWidth, h = cv.clientHeight, d = Math.min(2, devicePixelRatio || 1); cv.width = w * d; cv.height = h * d; const g = cv.getContext("2d"); g.setTransform(d, 0, 0, d, 0, 0);
  const n = arr.length, cols = Math.ceil(Math.sqrt(n * w / h)), rows = Math.ceil(n / cols), cw = w / cols, ch = h / rows, r = Math.max(1.5, Math.min(cw, ch) * 0.36), t0 = performance.now(), from = anim ? C.shown || 0 : n;
  const sh = arr.shuffled || (arr.shuffled = G.SH(arr));
  (function fr(now){ const k = anim ? Math.min(n, from + Math.floor((now - t0) / 12)) : n; g.clearRect(0, 0, w, h); for(let i = 0; i < k; i++){ g.fillStyle = COLS[sh[i]]; g.beginPath(); g.arc((i % cols + 0.5) * cw, (Math.floor(i / cols) + 0.5) * ch, r, 0, 6.283); g.fill(); } if(k < n && $("dots") === cv) requestAnimationFrame(fr); else if(C) C.shown = n; })(t0);
}
function checkBench(){
  const b = C.b, x = T.b[b.id](b.v); let ok, right;
  if(b.kind === "geno"){ if(!C.geno[0] || !C.geno[1]){ fb("", T.empty); return renderBench(); } ok = C.geno.join("") === b.ans; right = b.ans; }
  else { if(!C.val){ fb("", T.empty); return renderBench(); } if(b.kind === "num"){ const v = G.parse(C.val); ok = isFinite(v) && Math.abs(v - b.exact) <= (b.dec ? 0.06 : 0.001); right = String(b.ans).replace(".", ",") + (b.id === "B6" ? " %" : ""); } else { ok = G.okFrac(b.ans, C.val); right = T.fr(b.ans); } }
  C.tries++;
  if(ok){ MK.sfx.good(); score(C.tries); C.done = true; fb("ok", `<b>${C.tries === 1 ? T.ok1 : T.ok2}</b> ${x.s}`); }
  else if(C.tries === 1){ MK.sfx.bad(); C.val = ""; fb("bad", `<b>${T.hintT}</b> ${x.h}`); }
  else { MK.sfx.bad(); score(3); C.done = true; fb("bad", `<b>${T.solT}</b> ${x.s} <b>${T.right} ${right}</b>`); }
  if(C.done){ const c = career(); c.bench++; MK.set(CKEY, c); }
  renderBench();
}
function grow(){
  const b = C.b, c = b.grow(80); C.cnt.hit += c.hit || 0; C.cnt.miss += c.miss || 0; C.grown += 80;
  C.dots = (C.dots || []).concat(G.SH(Array(c.hit || 0).fill(0).concat(Array(c.miss || 0).fill(3)))); C.dots.shuffled = C.dots; MK.sfx.tap();
  $("gtxt").textContent = T.grown(C.grown) + " · " + T.hit + ": " + C.cnt.hit + " · " + T.expect(T.fr(b.ans), Math.round(C.grown * b.p)); $("grow").textContent = T.growMore; drawDots(C.dots, true);
}

/* ---------- įvykiai ---------- */
function key(k){ if(!C || C.done || (C.type === "case" && C.step !== 2) || C.kind === "geno") return; let v = C.val; if(k === "⌫") v = v.slice(0, -1); else if(k === "/" || k === ","){ if(v && !/[\/,]/.test(v)) v += k; } else if(v.length < 9) v += k; C.val = v; $("disp").textContent = v; }
$("stage").addEventListener("click", e => {
  const q = s => e.target.closest(s); let el;
  if(el = q("[data-k]")){ MK.sfx.tap(); return key(el.dataset.k); }
  if(q("#chk")) return C.type === "case" ? checkCase() : checkBench();
  if(q("#go")){ MK.sfx.tap(); return C.type === "case" ? goCase() : nextItem(); }
  if(q("#grow")) return grow();
  if(el = q("[data-gi]")){ if(C.done) return; C.geno[+el.dataset.gi] = el.dataset.go; MK.sfx.tap(); return renderBench(); }
  if(!C || C.type !== "case" || C.done) return;
  if(el = q("[data-m]")){ C.sel = el.dataset.m; MK.sfx.tap(); return renderCase(); }
  if(el = q("[data-g]")){ if(C.cur == null) return; C.gt[C.cur] = el.dataset.g; if(C.bad) C.bad = C.bad.filter(i => i !== C.cur); const nx = C.t.ask.find(i => !C.gt[i]); if(nx != null) C.cur = nx; MK.sfx.tap(); return renderCase(); }
  if(el = q("#ped .p")){ const id = +el.dataset.id; if(C.step === 0){ C.ev = id; MK.sfx.tap(); renderCase(); } else if(C.step === 1 && C.t.ask.includes(id)){ C.cur = id; MK.sfx.tap(); renderCase(); } }
});
window.addEventListener("keydown", e => { if(!C || $("play").hidden) return; if(/^[0-9]$/.test(e.key)) key(e.key); else if(e.key === "/" ) { e.preventDefault(); key("/"); } else if(e.key === "," || e.key === ".") key(","); else if(e.key === "Backspace") key("⌫"); else if(e.key === "Enter"){ const b = $("chk") || $("go"); if(b) b.click(); } });

/* ---------- diena, ataskaita, meniu ---------- */
function start(si){
  const mk = (modes, hard) => modes.map(mode => ({ type: "case", mode, hard })), bn = n => G.SH(G.BIDS).slice(0, n).map(id => ({ type: "bench", id }));
  const items = si === 0 ? mk(G.SH(["AR", "AD", "AR", "AD"]), false) : si === 1 ? mk(G.SH(["XR", "XR", "AR", "AD"]), true) : si === 2 ? bn(6) : [...mk(["XR", G.P(["AR", "AD"])], true), ...bn(4)];
  S = { si, items, i: 0, pts: 0, steps: 0, first: 0, used: new Set() }; $("menu").hidden = true; $("play").hidden = false; $("pts").textContent = 0; open();
}
function report(){
  const max = S.items.reduce((a, it) => a + (it.type === "case" ? 30 : 10), 0), fr = S.pts / max, stars = fr >= 0.85 ? 3 : fr >= 0.6 ? 2 : fr >= 0.3 ? 1 : 0, R = T.rep;
  MK.best(GAME, T.shifts[S.si].id, stars); const c = career(); c.ok += S.first; c.all += S.steps; MK.set(CKEY, c); if(stars >= 2) MK.sfx.win(); C = null;
  $("minfo").innerHTML = `${T.shifts[S.si].name}<b>${R.head}</b>`;
  $("stage").innerHTML = `<div class="card rep"><h2>${R.head}</h2><div class="big">${[0, 1, 2].map(i => i < stars ? "<u>★</u>" : "★").join("")}</div><h3>${R.pts(S.pts, max)}</h3><p class="qq">${R.stars[stars]}</p><p class="sm">${R.first(S.first, S.steps)}</p>
    <div class="row2">${S.si < 3 ? `<button type="button" class="btn" data-a="next">${R.next}</button>` : ""}<button type="button" class="btn sec" data-a="again">${R.again}</button></div><button type="button" class="btn sec" data-a="menu">${R.menu}</button></div>`;
}
$("stage").addEventListener("click", e => { const a = e.target.closest("[data-a]"); if(!a) return; MK.sfx.tap(); a.dataset.a === "next" ? start(S.si + 1) : a.dataset.a === "again" ? start(S.si) : showMenu(); });
function showMenu(){
  S = null; C = null; $("play").hidden = true; $("menu").hidden = false;
  const best = MK.best(GAME), tot = Object.values(best).reduce((a, b) => a + (+b || 0), 0), rk = T.ranks[tot >= 11 ? 4 : tot >= 8 ? 3 : tot >= 5 ? 2 : tot >= 2 ? 1 : 0], c = career();
  $("file").innerHTML = `<h2>${T.fileT}</h2><p class="rank">${rk}<span class="bars">${Array.from({ length: 12 }, (_, i) => `<i${i < tot ? ' class="on"' : ""}></i>`).join("")}</span></p><p>${T.career(c)}</p>`;
  $("days").innerHTML = T.shifts.map((s, i) => `<button type="button" class="day" data-i="${i}"><b>${s.name}</b><span>${s.sub}</span><code>${s.code}</code><span class="stars" aria-label="${best[s.id] || 0} iš 3">${[0, 1, 2].map(k => k < (best[s.id] || 0) ? "<u>★</u>" : "★").join("")}</span></button>`).join("");
  window.scrollTo(0, 0);
}
$("days").addEventListener("click", e => { const b = e.target.closest("[data-i]"); if(b) start(+b.dataset.i); });
$("quit").onclick = () => { MK.sfx.tap(); showMenu(); };
$("app").prepend(MK.top({ title: T.title, grade: 12 }));
$("kick").textContent = T.kicker; $("h1").textContent = T.h1; $("lead").textContent = T.lead; $("note").textContent = T.note; $("shT").textContent = T.shiftsT; $("manT").textContent = T.manualT;
$("manual").innerHTML = T.manual.map(m => `<details class="man"><summary>${m.name}</summary>${m.html}</details>`).join("");
window.__gk = { get S(){ return S; }, get C(){ return C; } };
showMenu();
</script>
