<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skaičių gyvatėlė – MokomėsKartu.lt</title>
<meta name="description" content="5–6 klasių matematikos žaidimas: vesk gyvatėlę ir rink kartotinius, daliklius, pirminius skaičius bei skaičius pagal dalumo požymius.">
<meta name="theme-color" content="#f6f4ff">
<link rel="icon" href="/logo/mk-ikona.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@600;700;800&display=swap">
<script src="/bendra/mk.js"></script>
<script src="tekstai.lt.js"></script>
<style>
/* Skaičių gyvatėlė: arkadinis 5–6 kl. matematikos žaidimas. Viršuje taisyklė, gyvybės ir pažanga, viduryje laukas (canvas), apačioje krypčių mygtukai. */
body{--paper:#f6f4ff;--grid:#e6e0fb;--soft:#57507a;--kid:"Unbounded","Arial Black",system-ui,sans-serif;--ac:#6741d9;--ac-ink:#fff;--ac-soft:#e5dbff}
html.playing,body.playing{overflow:hidden;height:100%;overscroll-behavior:none}
body.playing .mk-app{min-height:0;height:100vh;height:100dvh;padding-bottom:10px}
.mk-lvl{border-radius:12px;box-shadow:inset 0 0 0 2.5px var(--ink),5px 5px 0 var(--ink)}
.mk-lvl-art{border-radius:10px;font:800 19px/1 var(--kid);letter-spacing:-.04em}
.mk-lvl-t b{font-size:17px;letter-spacing:-.02em}
.mk-lvl-t i{display:block;font:800 12.5px/1.2 var(--body);color:var(--ac);margin-top:3px;font-style:normal}
.mk-hero h1{letter-spacing:-.04em;font-size:clamp(30px,8vw,50px)}
.mk-btn{border-radius:12px;font-size:17px}
.mk-res{border-radius:16px;box-shadow:inset 0 0 0 3px var(--ink),8px 8px 0 var(--ink)}
.mk-res .mk-owl{display:none}
.mk-res h2{font-size:24px;letter-spacing:-.03em}
.mk-res p{font-size:16px}
.mk-sec{font-size:16px}
.errs{width:100%;margin:6px 0 0;padding:10px 12px;border-radius:10px;background:#fff4f1;border:2px dashed #ff8a7a;text-align:left;font:600 14.5px/1.4 var(--body);color:var(--ink)}
.errs b.h{display:block;font-weight:800;margin-bottom:4px}
.errs ul{margin:0;padding-left:18px}
.errs li+li{margin-top:4px}
.errs.ok{background:#effcf6;border-color:var(--good);text-align:center;font-weight:800}
.hero-card{background:#fff;border-radius:18px;padding:8px;box-shadow:inset 0 0 0 3px var(--ink),6px 6px 0 var(--ink);display:grid;place-items:center}
.hero-card canvas{display:block;border-radius:10px}
.mk-hero-art{width:min(420px,100%)}
.note{max-width:520px;margin:14px auto 0;color:var(--soft);font-size:13px;text-align:center}

#play{display:flex;flex-direction:column;flex:1;min-height:0;touch-action:none;user-select:none;-webkit-user-select:none}
.hud{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:stretch;margin:0 0 8px}
.rule{background:#fff;border-radius:12px;padding:6px 12px 7px;box-shadow:inset 0 0 0 2.5px var(--ink),3px 3px 0 var(--ink);min-height:50px;display:grid;align-content:center}
.rule small{font:800 10.5px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ac)}
.rule div{font:800 clamp(15px,4.3vw,18px)/1.2 var(--body)}
.rule b,.rbig b{color:var(--ac);font-family:var(--kid);font-size:1.08em}
.rule.flash{animation:mkPop .4s cubic-bezier(.2,1.6,.4,1)}
.pbtn{width:50px;border:0;border-radius:12px;background:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:inset 0 0 0 2.5px var(--ink),3px 3px 0 var(--ink);padding:0}
.pbtn svg{width:22px;height:22px}
.pbtn:disabled{opacity:.4}
.stat{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 3px 10px 0}
.lives{display:inline-flex;gap:3px}
.lives svg{width:24px;height:22px;display:block}
.pips{display:inline-flex;gap:3px;align-items:center}
.pips i{width:9px;height:14px;border-radius:3px;background:#fff;box-shadow:inset 0 0 0 2px #cfc5f1}
.pips i.on{background:#37b24d;box-shadow:inset 0 0 0 2px var(--ink)}
.pips i:nth-child(4n+1):not(:first-child){margin-left:5px}
.chip{display:inline-flex;align-items:baseline;gap:5px;padding:6px 10px;border-radius:10px;background:#fff;font:800 16px/1 var(--kid);box-shadow:inset 0 0 0 2.5px var(--ink),3px 3px 0 var(--ink)}
.chip small{font:800 10.5px/1 var(--body);color:var(--soft);letter-spacing:.06em;text-transform:uppercase}
.chip i{font:800 12px/1 var(--kid);color:#e8590c;font-style:normal}
.stage{position:relative;margin:0 auto;border-radius:14px;overflow:hidden;box-shadow:0 0 0 3px var(--ink),5px 5px 0 3px var(--ink);background:#f7f4ff;flex:none}
.stage canvas{display:block}
.stage.shake{animation:mkShake .45s}
.ovl{position:absolute;inset:0;display:grid;place-items:center;padding:10px;background:rgba(246,244,255,.82);overflow:auto;animation:mkFade .2s}
.ovl.cnt{background:rgba(246,244,255,.5);align-items:start;padding-top:14%}
.ocard{width:min(330px,100%);background:#fff;border-radius:14px;padding:12px 12px 14px;box-shadow:inset 0 0 0 3px var(--ink),5px 5px 0 var(--ink);text-align:center;display:grid;gap:8px;justify-items:center}
.ocard>b{font:800 17px/1.25 var(--kid);letter-spacing:-.02em}
.ocard .rbig{font:800 17px/1.3 var(--body);padding:8px 12px;border-radius:10px;background:var(--ac-soft);width:100%}
.ocard .num{font:800 58px/1 var(--kid);color:var(--ac);min-height:58px}
.ocard .num.tick{animation:mkPop .3s cubic-bezier(.2,1.6,.4,1)}
.ocard .mk-why{margin:0;width:100%}
.ocard .mk-btn{width:100%}
.dpad{display:grid;grid-template-columns:repeat(3,68px);grid-template-rows:54px 54px;gap:8px;justify-content:center;margin:14px auto 0;flex:none}
.dpad button{border:0;border-radius:14px;background:#fff;cursor:pointer;display:grid;place-items:center;padding:0;box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 var(--ink);touch-action:none}
.dpad button:active,.dpad button.dn{transform:translateY(3px);box-shadow:inset 0 0 0 2.5px var(--ink),0 1px 0 var(--ink);background:var(--ac-soft)}
.dpad svg{width:26px;height:26px}
.dpad .u{grid-column:2}
.dpad .l{grid-column:1;grid-row:2}.dpad .d{grid-column:2;grid-row:2}.dpad .r{grid-column:3;grid-row:2}
.keys{margin:12px auto 0;color:var(--soft);font-size:13.5px;font-weight:700;text-align:center;display:none}
@media (hover:hover) and (pointer:fine){.dpad{display:none}.keys{display:block}}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <section id="menu">
    <div class="mk-hero">
      <div class="mk-hero-art"><div class="hero-card"><canvas id="heroCv" role="img"></canvas></div></div>
      <h1 id="heroT"></h1>
      <p id="heroP"></p>
    </div>
    <div id="levels"></div>
    <div id="learn"></div>
    <p class="note" id="note"></p>
  </section>
  <section id="play" hidden>
    <div class="hud"><div class="rule" id="ruleBox"><small id="ruleL"></small><div id="rule"></div></div>
      <button type="button" class="pbtn" id="pauseB"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5" fill="#121a33"/><rect x="14" y="4" width="5" height="16" rx="1.5" fill="#121a33"/></svg></button></div>
    <div class="stat"><span class="lives" id="lives" role="img"></span><span class="pips" id="pips" role="img"></span><span class="chip"><small id="ptsL"></small><span id="pts">0</span><i id="mult"></i></span></div>
    <div class="stage" id="stage"><canvas id="cv" role="img"></canvas><div class="ovl" id="ovl" hidden></div></div>
    <div class="dpad" id="dpad"></div>
    <p class="keys" id="keys"></p>
  </section>
</div>
<script>
(function(){
"use strict";
const T = window.MK_T, GAME = "skaiciu-gyvatele", GRADES = [5, 6], REC = "mk-" + GAME + "-rekordai";
const COLS = 8, ROWS = 10, GOAL = 12, PER = 4, FIELD = 5, INK = "#121a33";

/*LOGIKA-START*/
/* Grynoji žaidimo matematika (be DOM): taisyklės, skaičių parinkimas, tikrinimas ir paaiškinimų duomenys. Tikrinama atskiru node testu. */
const LG = (function(){
  const shuffle = (a, r) => { a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const isPrime = n => { if(n < 2) return false; for(let d = 2; d * d <= n; d++) if(n % d === 0) return false; return true; };
  const SETS = { kartotiniai: [2, 3, 4, 5, 6, 9, 10], dalikliai: [12, 18, 24, 30, 36, 48, 60], dalumas: [2, 3, 5, 9, 10] };
  /* Raundo taisyklės: trys iš eilės. */
  function makeRules(level, r){
    r = r || Math.random;
    if(level === "kartotiniai") return shuffle(SETS.kartotiniai, r).slice(0, 3).sort((a, b) => a - b).map(k => ({ type: "mult", k }));
    if(level === "dalikliai") return shuffle(SETS.dalikliai, r).slice(0, 3).sort((a, b) => a - b).map(N => ({ type: "div", N }));
    if(level === "pirminiai") return [{ type: "prime" }, { type: "comp" }, { type: "prime" }];
    return shuffle(SETS.dalumas, r).slice(0, 3).map(k => ({ type: "dvs", k }));
  }
  /* Skaičių, kurie gali atsirasti lauke, rėžiai (1 rodomas tik daliklių lygyje). */
  function range(rule){
    if(rule.type === "mult") return [2, rule.k <= 6 ? 60 : 100];
    if(rule.type === "div") return [1, rule.N + 6];
    if(rule.type === "dvs") return [100, 999];
    return [2, 60];
  }
  function isOk(rule, n){
    if(rule.type === "mult" || rule.type === "dvs") return n % rule.k === 0;
    if(rule.type === "div") return rule.N % n === 0;
    if(rule.type === "prime") return isPrime(n);
    return n > 3 && !isPrime(n);
  }
  function pickNumber(rule, wantOk, exclude, r){
    const [a, b] = range(rule), ex = new Set(exclude), c = [];
    for(let n = a; n <= b; n++) if(isOk(rule, n) === wantOk && !ex.has(n)) c.push(n);
    return c.length ? c[Math.floor(r() * c.length)] : null;
  }
  /* Naujas skaičius į lauką: lauke visada lieka bent 2 tinkami ir bent 2 netinkami, tinkamų – ne daugiau kaip 3. */
  function nextNumber(rule, field, recent, r){
    r = r || Math.random;
    const okN = field.filter(n => isOk(rule, n)).length, noN = field.length - okN;
    const want = okN < 2 ? true : noN < 2 || okN >= 3 ? false : r() < 0.45;
    let n = pickNumber(rule, want, field.concat(recent || []), r);
    if(n == null) n = pickNumber(rule, want, field, r);
    return n;
  }
  function fillField(rule, count, r){
    r = r || Math.random; const f = [];
    while(f.length < count) f.push(nextNumber(rule, f, [], r));
    return shuffle(f, r);
  }
  /* Paaiškinimo duomenys: { ok, key, d } – tekstą iš jų sudaro tekstų failas (T.why[key](d)). */
  function explain(rule, n){
    const ok = isOk(rule, n); if(ok) return { ok, key: null, d: { n } };
    if(rule.type === "mult") return { ok, key: "mult", d: { n, k: rule.k, q: Math.floor(n / rule.k), r: n % rule.k } };
    if(rule.type === "div") return n > rule.N ? { ok, key: "divBig", d: { n, N: rule.N } } : { ok, key: "div", d: { n, N: rule.N, q: Math.floor(rule.N / n), r: rule.N % n } };
    if(rule.type === "prime"){ let a = 2; while(n % a) a++; return { ok, key: "prime", d: { n, a, b: n / a } }; }
    if(rule.type === "comp") return { ok, key: "comp", d: { n } };
    const digits = String(n).split("").map(Number), last = digits[digits.length - 1];
    if(rule.k === 3 || rule.k === 9) return { ok, key: "dvsS", d: { n, k: rule.k, digits, s: digits.reduce((x, y) => x + y, 0) } };
    return { ok, key: "dvs" + rule.k, d: { n, k: rule.k, last } };
  }
  return { SETS, makeRules, range, isOk, isPrime, nextNumber, fillField, explain };
})();
/*LOGIKA-END*/

const LEVELS = [{ id: "kartotiniai", art: "3×", base: 330 }, { id: "dalikliai", art: "24:", base: 330 }, { id: "pirminiai", art: "17", base: 330 }, { id: "dalumas", art: ":9", base: 390 }]
  .map((l, i) => Object.assign(l, T.levels[i]));
const ruleHtml = r => T.rule[r.type](r);

/* ---------- piešimas (canvas) ---------- */
const FONT = getComputedStyle(document.body).getPropertyValue("--body") || "system-ui,sans-serif";
function fit(cv, cols, rows, cell){
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  cv.width = Math.round(cols * cell * dpr); cv.height = Math.round(rows * cell * dpr);
  cv.style.width = cols * cell + "px"; cv.style.height = rows * cell + "px";
  const c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0); return c;
}
function rr(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function token(c, x, y, cell, n, scale, bad){
  const p = 1.5, w = cell - 2 * p - 2, cx = x + cell / 2, cy = y + cell / 2;
  c.save(); c.translate(cx, cy); c.scale(scale, scale); c.translate(-w / 2 - 1, -w / 2 - 1);
  rr(c, 2, 2, w, w, cell * 0.24); c.fillStyle = INK; c.fill();
  rr(c, 0, 0, w, w, cell * 0.24); c.fillStyle = bad ? "#ffb4a2" : "#fff"; c.fill(); c.lineWidth = 2; c.strokeStyle = INK; c.stroke();
  const fs = n >= 100 ? Math.max(16, Math.round(cell * 0.42)) : Math.round(cell * 0.5);
  c.font = `800 ${fs}px ${FONT}`; c.textAlign = "center"; c.textBaseline = "middle"; c.fillStyle = INK; c.fillText(String(n), w / 2, w / 2 + 1, w - 5);
  c.restore();
}
/* S: { cols, rows, segs, prev, dir, items, fx, hurt } ; t – judesio tarp langelių dalis (0–1). */
function drawScene(c, S, cell, t, now){
  const W = S.cols * cell, H = S.rows * cell;
  c.clearRect(0, 0, W, H);
  for(let y = 0; y < S.rows; y++) for(let x = 0; x < S.cols; x++){ c.fillStyle = (x + y) % 2 ? "#ece6ff" : "#f7f4ff"; c.fillRect(x * cell, y * cell, cell, cell); }
  for(const it of S.items){ const k = Math.min(1, (now - (it.born || 0)) / 200); token(c, it.x * cell, it.y * cell, cell, it.n, 0.55 + 0.45 * k); }
  for(const f of S.fx) if(f.eat){ const k = (now - f.born) / f.dur; if(k < 1) token(c, f.x * cell, f.y * cell, cell, f.eat, 1 - k * 0.8, f.bad); }
  const pts = S.segs.map((s, i) => { const p = S.prev[i] || s; return [(p.x + (s.x - p.x) * t + 0.5) * cell, (p.y + (s.y - p.y) * t + 0.5) * cell]; });
  if(pts.length){
    const w = cell * 0.72, body = S.hurt ? "#ff8a7a" : "#40c057", dark = S.hurt ? "#e8590c" : "#2f9e44";
    const path = () => { c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for(let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); if(pts.length === 1) c.lineTo(pts[0][0] + 0.01, pts[0][1]); };
    c.lineJoin = "round"; c.lineCap = "round";
    path(); c.lineWidth = w + 5; c.strokeStyle = INK; c.stroke();
    path(); c.lineWidth = w; c.strokeStyle = body; c.stroke();
    path(); c.lineWidth = w * 0.3; c.strokeStyle = S.hurt ? "#ffc9c0" : "#b2f2bb"; c.setLineDash([w * 0.3, w * 0.62]); c.stroke(); c.setLineDash([]);
    const [hx, hy] = pts[0], d = S.dir, r = cell * 0.47, px = -d.y, py = d.x;
    if(!S.hurt && Math.sin(now / 170) > 0.2){ c.beginPath(); const tx = hx + d.x * (r + cell * 0.2), ty = hy + d.y * (r + cell * 0.2);
      c.moveTo(hx + d.x * r * 0.8, hy + d.y * r * 0.8); c.lineTo(tx, ty); c.moveTo(tx, ty); c.lineTo(tx + d.x * 4 + px * 3, ty + d.y * 4 + py * 3); c.moveTo(tx, ty); c.lineTo(tx + d.x * 4 - px * 3, ty + d.y * 4 - py * 3);
      c.lineWidth = 2.4; c.strokeStyle = "#e03131"; c.stroke(); }
    c.beginPath(); c.arc(hx, hy, r, 0, 7); c.fillStyle = dark; c.fill(); c.lineWidth = 2.5; c.strokeStyle = INK; c.stroke();
    for(const s of [1, -1]){
      const ex = hx + d.x * r * 0.22 + px * r * 0.46 * s, ey = hy + d.y * r * 0.22 + py * r * 0.46 * s;
      c.beginPath(); c.arc(ex, ey, r * 0.36, 0, 7); c.fillStyle = "#fff"; c.fill(); c.lineWidth = 1.6; c.strokeStyle = INK; c.stroke();
      if(S.hurt){ const q = r * 0.2; c.beginPath(); c.moveTo(ex - q, ey - q); c.lineTo(ex + q, ey + q); c.moveTo(ex + q, ey - q); c.lineTo(ex - q, ey + q); c.lineWidth = 2; c.stroke(); }
      else { c.beginPath(); c.arc(ex + d.x * r * 0.12, ey + d.y * r * 0.12, r * 0.18, 0, 7); c.fillStyle = INK; c.fill(); }
    }
  }
  for(const f of S.fx) if(f.text){ const k = (now - f.born) / 750; if(k < 1){ c.globalAlpha = 1 - k * k; c.font = `800 ${Math.round(cell * 0.46)}px ${FONT}`; c.textAlign = "center"; c.textBaseline = "middle";
    const x = Math.max(cell * 0.7, Math.min(W - cell * 0.7, (f.x + 0.5) * cell)), y = (f.y + 0.5) * cell - cell * 0.5 - k * cell * 0.9;
    c.lineWidth = 4; c.strokeStyle = "#fff"; c.strokeText(f.text, x, y); c.fillStyle = "#2b8a3e"; c.fillText(f.text, x, y); c.globalAlpha = 1; } }
}

/* ---------- elementai ---------- */
const $ = id => document.getElementById(id);
const app = $("app"), menu = $("menu"), play = $("play"), stage = $("stage"), cv = $("cv"), ovl = $("ovl"), dpad = $("dpad");
const saved = MK.get("mokomeskartu-klase", 0);
app.prepend(MK.top({ title: T.title, grade: GRADES.includes(saved) ? saved : GRADES[0] }));
$("heroT").innerHTML = T.heroTitle; $("heroP").textContent = T.hero; $("note").textContent = T.note; $("heroCv").setAttribute("aria-label", T.heroLabel);
$("ruleL").textContent = T.ruleLabel; $("ptsL").textContent = T.points; $("pauseB").setAttribute("aria-label", T.pauseBtn); $("keys").textContent = T.keysHint; cv.setAttribute("aria-label", T.boardLabel);
const ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l8 10h-5v6H9v-6H4z" fill="#121a33"/></svg>';
const DIRS = { u: { x: 0, y: -1 }, d: { x: 0, y: 1 }, l: { x: -1, y: 0 }, r: { x: 1, y: 0 } };
dpad.innerHTML = [["u", 0, T.dpad.up], ["l", -90, T.dpad.left], ["d", 180, T.dpad.down], ["r", 90, T.dpad.right]]
  .map(([k, a, lab]) => `<button type="button" class="${k}" data-d="${k}" aria-label="${lab}"><span style="display:grid;transform:rotate(${a}deg)">${ARROW}</span></button>`).join("");
const HEART = on => `<svg viewBox="0 0 24 22" aria-hidden="true"><path d="M12 20.5C5 15 1.500 11.500 1.500 7A5.200 5.200 0 0 1 12 4.800 5.200 5.200 0 0 1 22.500 7c0 4.500-3.500 8-10.500 13.500z" fill="${on ? "#fa5252" : "#fff"}" stroke="${on ? INK : "#cfc5f1"}" stroke-width="2" stroke-linejoin="round"/></svg>`;

function drawHero(){
  const hc = $("heroCv"), w = Math.min(404, hc.parentElement.clientWidth - 16), cell = Math.floor(w / 9), c = fit(hc, 9, 4, cell);
  const segs = [[5, 2], [4, 2], [3, 2], [3, 1], [2, 1], [1, 1], [1, 2]].map(([x, y]) => ({ x, y }));
  drawScene(c, { cols: 9, rows: 4, segs, prev: segs, dir: DIRS.r, fx: [], items: [{ x: 7, y: 2, n: 12 }, { x: 5, y: 0, n: 7 }, { x: 8, y: 0, n: 20 }, { x: 0, y: 3, n: 9 }, { x: 6, y: 3, n: 15 }] }, cell, 1, 1e6);
}

/* ---------- būsena ---------- */
let lvl = 0, Lv = null, rules = [], ri = 0, rule = null, segs = [], prev = [], dir = DIRS.r, queue = [], grow = 0, items = [], fx = [], recent = [];
let phase = "menu", acc = 0, last = 0, stepMs = 330, lives = 3, score = 0, streak = 0, collected = 0, crashes = 0, mistakes = [], cell = 40, ctx = null, timer = 0, raf = 0, hurtT = 0, resumeCb = null;
const HOOK = window.__gyv = { fast: 1, get s(){ return { phase, cols: COLS, rows: ROWS, segs: segs.map(s => ({ x: s.x, y: s.y })), dir, grow, lives, score, collected, level: Lv && Lv.id, rule,
  items: items.map(it => ({ x: it.x, y: it.y, n: it.n, ok: LG.isOk(rule, it.n) })) }; } };
const later = (fn, ms) => { clearTimeout(timer); timer = setTimeout(fn, ms / HOOK.fast); };
const mult = () => Math.min(4, 1 + Math.floor(streak / 3));
const copy = a => a.map(s => ({ x: s.x, y: s.y }));
function freeze(){ prev = copy(segs); acc = 0; }

function layout(){
  const W = play.clientWidth - 11, top = stage.getBoundingClientRect().top, ctl = dpad.offsetHeight ? dpad.offsetHeight + 14 : $("keys").offsetHeight + 12;
  const availH = window.innerHeight - top - ctl - 18;
  cell = Math.max(22, Math.min(52, Math.floor(W / COLS), Math.floor(availH / ROWS)));
  ctx = fit(cv, COLS, ROWS, cell); stage.style.width = COLS * cell + "px"; stage.style.height = ROWS * cell + "px";
}
function hud(){
  $("rule").innerHTML = ruleHtml(rule);
  $("lives").innerHTML = [0, 1, 2].map(i => HEART(i < lives)).join(""); $("lives").setAttribute("aria-label", T.livesLabel(lives));
  $("pips").innerHTML = Array.from({ length: GOAL }, (_, i) => `<i class="${i < collected ? "on" : ""}"></i>`).join(""); $("pips").setAttribute("aria-label", T.pipsLabel(collected, GOAL));
  $("pts").textContent = score; $("mult").textContent = mult() > 1 ? "×" + mult() : "";
  $("pauseB").disabled = !(phase === "run" || phase === "count");
}
function showOvl(html){ if(!/id="cnt"/.test(html)) ovl.classList.remove("cnt"); ovl.innerHTML = html; ovl.hidden = false; ovl.scrollTop = 0; }
function hideOvl(){ ovl.classList.remove("cnt"); ovl.hidden = true; ovl.innerHTML = ""; }

/* ---------- laukas ---------- */
function resetSnake(){
  const len = segs.length + grow, cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
  segs = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }]; grow = Math.max(0, len - 3); dir = DIRS.r; queue = []; freeze();
}
const onSnake = (x, y) => segs.some(s => s.x === x && s.y === y);
const itemAt = (x, y) => items.findIndex(it => it.x === x && it.y === y);
/* Pavojinga vieta naujam skaičiui: per arti galvos arba tiesiai priešais ją. */
function risky(x, y){
  const h = segs[0], dx = x - h.x, dy = y - h.y;
  if(Math.abs(dx) + Math.abs(dy) < 3) return true;
  return dir.x ? dy === 0 && dx * dir.x > 0 && Math.abs(dx) <= 4 : dx === 0 && dy * dir.y > 0 && Math.abs(dy) <= 4;
}
function freeCell(skip){
  for(let pass = 0; pass < 3; pass++) for(let k = 0; k < 80; k++){
    const x = MK.rnd(0, COLS - 1), y = MK.rnd(0, ROWS - 1);
    if(onSnake(x, y) || items.some(it => it !== skip && it.x === x && it.y === y)) continue;
    if(pass < 2 && risky(x, y)) continue;
    if(pass < 1 && items.some(it => it !== skip && Math.abs(it.x - x) <= 1 && Math.abs(it.y - y) <= 1)) continue;
    return { x, y };
  }
  for(let y = 0; y < ROWS; y++) for(let x = 0; x < COLS; x++) if(!onSnake(x, y) && itemAt(x, y) < 0) return { x, y };
  return { x: 0, y: 0 };
}
function addItem(n){ const c = freeCell(); items.push({ x: c.x, y: c.y, n, born: performance.now() }); }
function newField(){ items = []; LG.fillField(rule, FIELD).forEach(addItem); }
function replaceItem(){ addItem(LG.nextNumber(rule, items.map(it => it.n), recent)); }
function relocate(){ items.forEach(it => { if(onSnake(it.x, it.y) || risky(it.x, it.y)){ const c = freeCell(it); it.x = c.x; it.y = c.y; it.born = performance.now(); } }); }

/* ---------- eiga ---------- */
function showMenu(){
  phase = "menu"; clearTimeout(timer); cancelAnimationFrame(raf); raf = 0; hideOvl();
  document.documentElement.classList.remove("playing"); document.body.classList.remove("playing");
  play.hidden = true; menu.hidden = false;
  const recs = MK.get(REC, {});
  MK.levels($("levels"), { game: GAME, levels: LEVELS.map(l => Object.assign({}, l, { sub: l.sub + (recs[l.id] ? `<i>${T.record(recs[l.id])}</i>` : "") })), onPick: start });
  MK.learn($("learn"), { topics: T.learn, onPlay: start });
  drawHero(); window.scrollTo(0, 0);
}
function start(i){
  lvl = i; Lv = LEVELS[i]; rules = LG.makeRules(Lv.id); ri = 0; rule = rules[0];
  lives = 3; score = 0; streak = 0; collected = 0; crashes = 0; mistakes = []; recent = []; fx = []; segs = []; grow = 0; stepMs = Lv.base; hurtT = 0;
  menu.hidden = true; play.hidden = false; window.scrollTo(0, 0);
  document.documentElement.classList.add("playing"); document.body.classList.add("playing");
  layout(); resetSnake(); newField(); phase = "count"; hud();
  if(!raf){ last = performance.now(); raf = requestAnimationFrame(frame); }
  countdown(T.ready, ruleHtml(rule));
}
function run(){ hideOvl(); phase = "run"; acc = 0; last = performance.now(); hud(); }
function countdown(title, sub){
  phase = "count"; resumeCb = () => countdown(title, sub); hud();
  ovl.classList.add("cnt"); showOvl(`<div class="ocard">${title ? `<b>${title}</b>` : ""}${sub ? `<div class="rbig">${sub}</div>` : ""}<span class="num" id="cnt" aria-live="assertive"></span></div>`);
  let n = 3;
  (function tick(){
    const el = $("cnt"); if(!el) return;
    if(n === 0){ MK.sfx.beep(true); return run(); }
    el.textContent = n; el.classList.remove("tick"); void el.offsetWidth; el.classList.add("tick"); MK.sfx.beep(false); n--; later(tick, 800);
  })();
}
function pause(){
  if(phase !== "run" && phase !== "count") return;
  if(phase === "run") resumeCb = () => countdown("", ruleHtml(rule));
  clearTimeout(timer); freeze(); phase = "pause"; hud();
  showOvl(`<div class="ocard"><b>${T.pause}</b><div class="rbig">${ruleHtml(rule)}</div><button type="button" class="mk-btn" data-a="resume">${T.resume}</button><button type="button" class="mk-btn ghost" data-a="quit">${T.quit}</button></div>`);
}
function enqueue(d){
  if(phase !== "run" && phase !== "count") return;
  const l = queue.length ? queue[queue.length - 1] : dir;
  if((d.x === -l.x && d.y === -l.y) || (d.x === l.x && d.y === l.y) || queue.length >= 2) return;
  queue.push(d);
}
function step(){
  if(queue.length) dir = queue.shift();
  const h = segs[0], nx = h.x + dir.x, ny = h.y + dir.y;
  const wall = nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS;
  const self = !wall && segs.some((s, i) => s.x === nx && s.y === ny && !(i === segs.length - 1 && grow === 0));
  if(wall || self) return crash(wall);
  prev = copy(segs); segs.unshift({ x: nx, y: ny });
  if(grow > 0) grow--; else segs.pop();
  const k = itemAt(nx, ny); if(k < 0) return;
  const it = items[k]; items.splice(k, 1);
  if(LG.isOk(rule, it.n)) collect(it); else wrong(it);
}
function collect(it){
  const now = performance.now(), gain = 10 * mult();
  collected++; streak++; score += gain; grow++; recent.push(it.n); if(recent.length > 3) recent.shift();
  fx.push({ x: it.x, y: it.y, eat: it.n, born: now, dur: stepMs * 0.9 }, { x: it.x, y: it.y, text: "+" + gain, born: now });
  stepMs = Math.max(235, Lv.base - collected * 6);
  $("pts").textContent = score;
  if(collected >= GOAL){ MK.sfx.good(); hud(); phase = "end"; later(() => { freeze(); finish(true); }, 650); return; }
  if(collected % PER === 0){
    ri++; rule = rules[ri]; recent = []; MK.sfx.good(); phase = "end"; hud();
    later(() => { freeze(); newField(); $("ruleBox").classList.remove("flash"); void $("ruleBox").offsetWidth; $("ruleBox").classList.add("flash"); hud(); countdown(T.newRule, ruleHtml(rule)); }, 450);
    return;
  }
  MK.sfx.hop(collected); replaceItem(); hud();
}
function hurt(){ hurtT = performance.now() + 700; stage.classList.remove("shake"); void stage.offsetWidth; stage.classList.add("shake"); MK.sfx.bad(); }
function wrong(it){
  lives--; streak = 0; freeze(); hurt();
  const ex = LG.explain(rule, it.n), text = T.why[ex.key](ex.d);
  mistakes.push({ rule: ruleHtml(rule), text });
  const okNow = items.filter(x => LG.isOk(rule, x.n)).map(x => x.n).sort((a, b) => a - b);
  phase = "why"; hud();
  showOvl(`<div class="ocard">${MK.why({ ok: false, head: T.wrongHead(it.n), body: text, more: T.hint[rule.type](rule) + " " + T.okOnField(okNow), sum: T.hintSum, open: true })}
    <button type="button" class="mk-btn" data-a="next">${lives > 0 ? T.next : T.results}</button></div>`);
  setTimeout(() => { const b = ovl.querySelector("[data-a=next]"); if(b) b.focus({ preventScroll: true }); }, 60);
}
function afterWhy(){
  if(phase !== "why") return;
  if(lives <= 0){ hideOvl(); return finish(false); }
  replaceItem(); relocate(); countdown("", ruleHtml(rule));
}
function crash(wall){
  lives--; streak = 0; crashes++; freeze(); hurt(); phase = "end"; hud();
  later(() => { if(lives <= 0) return finish(false); resetSnake(); relocate(); countdown(wall ? T.crashWall : T.crashSelf, ruleHtml(rule)); }, 800);
}
function finish(win){
  phase = "over"; clearTimeout(timer); hideOvl(); hud();
  const stars = win ? (3 - lives <= 1 ? 3 : 2) : 1; MK.best(GAME, Lv.id, stars);
  const recs = MK.get(REC, {}), old = recs[Lv.id] || 0, isNew = score > old; if(isNew){ recs[Lv.id] = score; MK.set(REC, recs); }
  const errs = mistakes.length ? `<div class="errs"><b class="h">${T.resErrs}</b><ul>${mistakes.map(m => `<li>${m.text}</li>`).join("")}</ul></div>` : `<div class="errs ok">${T.resClean}</div>`;
  MK.result({ stars, title: win ? T.winTitle : T.loseTitle,
    text: `<b>${T.resPts(score)}</b> · ${isNew ? T.resNewRec : T.resRec(old)}<br>${T.resGot(collected, GOAL)}${crashes ? " " + T.resCrash(crashes) : ""}</p>${errs}<p hidden>`,
    next: win && lvl < LEVELS.length - 1 ? () => start(lvl + 1) : null, again: () => start(lvl), menu: showMenu });
}
function frame(ts){
  raf = requestAnimationFrame(frame);
  const dt = Math.min(120, ts - last); last = ts;
  if(phase === "run"){ acc += dt * HOOK.fast; while(phase === "run" && acc >= stepMs){ acc -= stepMs; step(); } }
  const now = performance.now(); fx = fx.filter(f => now - f.born < 800);
  drawScene(ctx, { cols: COLS, rows: ROWS, segs, prev, dir, items, fx, hurt: now < hurtT }, cell, phase === "run" ? Math.min(1, acc / stepMs) : 1, now);
}

/* ---------- valdymas ---------- */
const KEYS = { ArrowUp: "u", ArrowDown: "d", ArrowLeft: "l", ArrowRight: "r", w: "u", s: "d", a: "l", d: "r", W: "u", S: "d", A: "l", D: "r" };
window.addEventListener("keydown", e => {
  if(play.hidden) return;
  if(KEYS[e.key]){ if(e.key.startsWith("Arrow")) e.preventDefault(); MK.unlock(); enqueue(DIRS[KEYS[e.key]]); }
  else if(e.key === " " || e.key === "p" || e.key === "P" || e.key === "Escape"){ if(phase === "run" || phase === "count"){ e.preventDefault(); pause(); } }
});
dpad.addEventListener("pointerdown", e => { const b = e.target.closest("[data-d]"); if(!b) return; e.preventDefault(); MK.unlock(); enqueue(DIRS[b.dataset.d]); b.classList.add("dn"); setTimeout(() => b.classList.remove("dn"), 120); });
let sw = null;
play.addEventListener("pointerdown", e => { if(e.target.closest("button,summary,a")) return; sw = { x: e.clientX, y: e.clientY }; });
play.addEventListener("pointermove", e => {
  if(!sw) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if(Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
  MK.unlock(); enqueue(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? DIRS.r : DIRS.l) : (dy > 0 ? DIRS.d : DIRS.u)); sw = { x: e.clientX, y: e.clientY };
});
["pointerup", "pointercancel"].forEach(ev => play.addEventListener(ev, () => { sw = null; }));
$("pauseB").addEventListener("click", () => { MK.sfx.tap(); pause(); });
ovl.addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if(!b) return; MK.unlock(); MK.sfx.tap();
  if(b.dataset.a === "next") afterWhy();
  else if(b.dataset.a === "resume"){ if(resumeCb) resumeCb(); else countdown("", ruleHtml(rule)); }
  else if(b.dataset.a === "quit") showMenu();
});
document.addEventListener("visibilitychange", () => { if(document.hidden) pause(); });
window.addEventListener("resize", () => { if(play.hidden) drawHero(); else layout(); });
showMenu();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if(!menu.hidden) drawHero(); });
})();
</script>
