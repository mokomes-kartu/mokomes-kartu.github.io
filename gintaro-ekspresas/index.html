<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MokomėsKartu">
<link rel="apple-touch-icon" href="/logo/mk-ikona-180.png">
<title>Gintaro ekspresas – MokomėsKartu.lt</title>
<meta name="description" content="Gamtos mokslų žaidimas 6 klasei: vairuok traukinį pagal dispečerio nurodymus – apskaičiuok greitį, kelią ir laiką, skaityk kelio priklausomybės nuo laiko grafikus, stabdyk slidžiais bėgiais.">
<meta name="theme-color" content="#f6efe0">
<link rel="icon" href="/logo/mk-ikona.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<script src="/bendra/mk.js"></script>
<script src="tekstai.lt.js"></script>
<script src="uzduotys.js"></script>
<style>
/* Gintaro ekspresas: geležinkelio plakato ir linijų žemėlapio stilius – kreminis popierius, tušo kontūrai, gintaro, žalsvai mėlyna ir signalinė raudona. */
body{--paper:#f6efe0;--ink:#1d2433;--soft:#5b6170;--line:#d5c9ad;--amb:#e39a12;--teal:#0f7c82;--red:#c8442f;--ac:#0f7c82;
  --kid:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:#f6efe0;background-image:none;color:var(--ink);font-weight:400}
.mk-app{max-width:900px;padding-block:6px 14px}
.mk-top{padding-bottom:8px}
.mk-back,.mk-ico{border-radius:8px;border-width:2px;box-shadow:2px 2px 0 var(--ink);height:40px}
.mk-ico{width:40px}.mk-ico[data-k="music"]{display:none}
.mk-title{font:800 22px/1 var(--kid);letter-spacing:.06em;text-transform:uppercase}
.kick{font:700 13px/1.2 var(--kid);letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
h1{margin:2px 0 6px;font:800 clamp(40px,11vw,64px)/.92 var(--kid);letter-spacing:.01em;text-transform:uppercase}
h1 em{font-style:normal;color:var(--amb);-webkit-text-stroke:1.5px var(--ink)}
.lead{margin:0 0 12px;font-size:16px;line-height:1.45;max-width:60ch}
#hero{display:block;width:100%;height:170px;border:2px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink);margin:0 0 14px;background:#cfe6ea}
.sec{margin:20px 0 4px;font:800 24px/1 var(--kid);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.sec::before{content:"";width:22px;height:8px;background:repeating-linear-gradient(90deg,var(--ink) 0 4px,transparent 4px 8px);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.secp{margin:0 0 10px;color:var(--soft);font-size:14.5px}
#map{display:block;width:100%;height:auto;background:#fbf6ea;border:2px solid var(--ink);border-radius:10px;margin-bottom:10px}
#map .ln{cursor:pointer}
#map text{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
.lines{display:grid;gap:9px}
@media(min-width:700px){.lines{grid-template-columns:1fr 1fr}}
.lb{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:2px 12px;align-items:center;text-align:left;background:#fffaf0;border:2px solid var(--ink);border-radius:10px;padding:10px 12px 10px 0;cursor:pointer;font:inherit;color:inherit;box-shadow:3px 3px 0 var(--ink);overflow:hidden}
.lb:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.lb i{grid-row:1/span 3;align-self:stretch;margin:-10px 0;background:var(--c)}
.lb b{font:800 23px/1 var(--kid);text-transform:uppercase;letter-spacing:.03em}
.lb code{grid-column:2;font:700 13px/1.2 var(--kid);letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.lb span{grid-column:2;font-size:13.5px;line-height:1.35;color:var(--soft)}
.lb .st{grid-row:1/span 3;grid-column:3;font-size:19px;letter-spacing:1px;color:#d9ceb4}.st u{text-decoration:none;color:var(--amb)}
.card{background:#fffaf0;border:2px solid var(--ink);border-radius:10px;padding:12px 14px;margin:0 0 10px}
.rank{font:800 26px/1 var(--kid);text-transform:uppercase}
.sm{font-size:13.5px;color:var(--soft);line-height:1.4}
.meter{height:8px;border:2px solid var(--ink);border-radius:5px;overflow:hidden;margin:8px 0 4px;background:#fff}.meter i{display:block;height:100%;background:var(--amb)}
.stamps{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stamps i{font:700 12px/1 var(--kid);font-style:normal;letter-spacing:.05em;text-transform:uppercase;border:2px dashed #cdbf9f;color:#bcae90;border-radius:50px;padding:6px 9px}
.stamps i.on{border:2px solid var(--c);color:var(--c);transform:rotate(-3deg);background:#fff}
.stamps i.on:nth-child(2n){transform:rotate(2deg)}
details.man{background:#fffaf0;border:2px solid var(--ink);border-radius:10px;padding:0 14px;margin:0 0 7px}
details.man summary{cursor:pointer;font:700 19px/1.2 var(--kid);letter-spacing:.02em;padding:12px 0;list-style:none}
details.man summary::-webkit-details-marker{display:none}
details.man summary::before{content:"▸ ";color:var(--amb)}
details.man[open] summary::before{content:"▾ "}
details.man p,details.man ul{margin:0 0 10px;font-size:15px;line-height:1.5}details.man ul{padding-left:20px}
.ex{background:#fdf0cf;border-left:4px solid var(--amb);padding:8px 10px;font-size:14.5px;line-height:1.55;margin:0 0 10px;font-weight:500}
.note{color:var(--soft);font-size:13px;line-height:1.45;margin:12px 0 0}

#game{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.obar{display:flex;gap:10px;align-items:center;border:2px solid var(--ink);border-bottom:0;border-radius:10px 10px 0 0;background:#fffaf0;padding:6px 10px;min-height:40px}
.obar code{font:800 13px/1.1 var(--kid);letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--c,var(--teal));border-radius:4px;padding:4px 6px;white-space:nowrap}
.obar b{font:600 14.5px/1.2 var(--body);flex:1;min-width:0}
.stage{position:relative;border:2px solid var(--ink);background:#cfe6ea;overflow:hidden;touch-action:none}
#cv{display:block;width:100%;touch-action:none}
#dash{display:block;width:100%;border:2px solid var(--ink);border-top:0;background:#2a3040;touch-action:none}
#toast{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);max-width:92%;background:rgba(29,36,51,.92);color:#fff;font:600 14px/1.3 var(--body);padding:7px 12px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .25s;text-align:center}
#toast.on{opacity:1}
.ctrl{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;border:2px solid var(--ink);border-top:0;border-radius:0 0 10px 10px;background:#3a4152;padding:8px}
.big{min-height:76px;border:2px solid var(--ink);border-radius:10px;font:800 21px/1 var(--kid);letter-spacing:.04em;cursor:pointer;touch-action:none;box-shadow:0 5px 0 #151a26;color:#fff;padding:0 2px;min-width:0}
.big.on{transform:translateY(4px);box-shadow:0 1px 0 #151a26}
#bBrk{background:var(--red)}#bAcc{background:#1f8a4c}
.big small{display:block;font:600 11px/1.2 var(--body);letter-spacing:.02em;opacity:.85;margin-top:5px;text-transform:none}
.mid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;width:230px}
.mid button{min-height:35px;border:2px solid var(--ink);border-radius:7px;background:#e9e0cc;font:700 13.5px/1 var(--kid);letter-spacing:.04em;text-transform:uppercase;cursor:pointer;padding:0 4px;color:var(--ink)}
.mid button:active{background:#fff}
#bSand.on{background:var(--amb)}#bSand[disabled]{opacity:.35}
@media(max-width:480px){.mid{grid-template-columns:1fr;width:96px;gap:4px}.mid button{min-height:30px;font-size:13px}.big{font-size:19px;min-height:132px}}
@media(max-width:380px){.big{font-size:17px;letter-spacing:.02em}}
#game{overflow:hidden}

#ovl{position:fixed;inset:0;z-index:40;background:rgba(246,239,224,.9);display:none;overflow:auto;padding:14px 12px 24px;-webkit-overflow-scrolling:touch;user-select:text;-webkit-user-select:text}
#ovl.on{display:block}
.pp{max-width:520px;margin:0 auto;background:#fffaf0;border:2px solid var(--ink);border-radius:12px;box-shadow:5px 5px 0 var(--ink);padding:0 0 14px;overflow:hidden;animation:ppIn .25s}
@keyframes ppIn{from{opacity:0;transform:translateY(10px)}}
.pp header{background:var(--c,var(--teal));color:#fff;padding:9px 14px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;border-bottom:2px solid var(--ink)}
.pp header b{font:800 20px/1 var(--kid);letter-spacing:.06em;text-transform:uppercase}
.pp header span{font:600 12.5px/1.2 var(--body);opacity:.92;text-align:right}
.pp .bd{padding:12px 14px 0}
.pp p{margin:0 0 10px;font-size:16px;line-height:1.5}
.pp .ask{font-weight:600;color:var(--teal)}
.pp .why{background:#fdf0cf;border-left:4px solid var(--amb);padding:9px 11px;font-size:15px;line-height:1.5}
.pp .why b{white-space:nowrap}
.pp h4{margin:12px 0 4px;font:800 15px/1 var(--kid);letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.vl{display:grid;grid-template-columns:24px 1fr;gap:4px 6px;margin:0 0 10px;font-size:15.5px;line-height:1.4}
.vl i{font-style:normal;font-weight:700;text-align:center}.vl .m2{color:#1f8a4c}.vl .m1{color:#b77700}.vl .m0{color:var(--red)}
.pts{font:800 22px/1 var(--kid);letter-spacing:.04em;text-transform:uppercase;margin:4px 0 8px}
.pts u{text-decoration:none;color:var(--amb)}
.stampNew{display:inline-block;border:2px solid var(--c,var(--teal));color:var(--c,var(--teal));border-radius:50px;padding:5px 12px;font:700 14px/1 var(--kid);letter-spacing:.06em;text-transform:uppercase;transform:rotate(-3deg);margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{flex:1;min-height:50px;border:2px solid var(--ink);border-radius:10px;background:var(--amb);color:var(--ink);font:800 20px/1 var(--kid);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:3px 3px 0 var(--ink);padding:0 14px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:#fffaf0}
.gr{display:block;width:100%;max-width:360px;height:auto;margin:0 auto 10px;background:#fff;border:1.5px solid var(--line);border-radius:6px}
.gr text{font-family:"Barlow",system-ui,sans-serif}
table.tb{border-collapse:collapse;margin:8px 0 2px;font-size:14px;width:100%}
table.tb th,table.tb td{border:1.5px solid var(--ink);padding:5px 6px;text-align:center}
table.tb th{background:#efe6d0;font-weight:600}table.tb td:first-child,table.tb th:first-child{text-align:left}
.inp{display:flex;align-items:center;gap:4px;justify-content:center;margin:4px 0 10px;flex-wrap:wrap}
.inp button{width:42px;height:46px;padding:0;font-size:19px;border:2px solid var(--ink);border-radius:8px;background:#e9e0cc;font:800 22px/1 var(--kid);cursor:pointer}
.inp input{width:70px;height:52px;border:2px solid var(--ink);border-radius:8px;text-align:center;font:800 30px/1 var(--kid);background:#fff;color:var(--ink);-moz-appearance:textfield}
.inp input::-webkit-outer-spin-button,.inp input::-webkit-inner-spin-button{-webkit-appearance:none}
.inp span{font:800 26px/1 var(--kid)}
.msg{font-weight:600}.msg.bad{color:var(--red)}.msg.good{color:#1f8a4c}
.legs{display:grid;gap:4px;margin:0 0 10px;font-size:14.5px}
.legs div{display:grid;grid-template-columns:1fr auto;gap:8px;border-bottom:1px dashed var(--line);padding:3px 0}
.legs u{text-decoration:none;color:var(--amb);letter-spacing:2px;font-size:16px}.legs u s{text-decoration:none;color:#d9ceb4}
.bigst{font-size:44px;letter-spacing:6px;color:#d9ceb4;text-align:center;margin:2px 0 6px}.bigst u{text-decoration:none;color:var(--amb)}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <main id="menu">
    <div class="kick" id="kick"></div>
    <h1 id="h1"></h1>
    <canvas id="hero"></canvas>
    <p class="lead" id="lead"></p>
    <div class="card" id="rankCard"></div>
    <h2 class="sec" id="mapT"></h2><p class="secp" id="mapP"></p>
    <svg id="map" viewBox="0 0 560 250" role="img"></svg>
    <div class="lines" id="lines"></div>
    <h2 class="sec" id="stT"></h2><div class="card" id="stCard"></div>
    <h2 class="sec" id="learnT"></h2><p class="secp" id="learnP"></p><div id="learn"></div>
    <h2 class="sec" id="ctrlT"></h2><div class="card"><p class="sm" id="ctrlP" style="margin:0;font-size:14.5px;color:var(--ink)"></p></div>
    <p class="note" id="note"></p>
  </main>
  <main id="game" hidden>
    <div class="obar" id="obar"><code id="legNo"></code><b id="need"></b></div>
    <div class="stage"><canvas id="cv"></canvas><div id="toast" role="status" aria-live="polite"></div></div>
    <canvas id="dash"></canvas>
    <div class="ctrl">
      <button type="button" class="big" id="bBrk"></button>
      <div class="mid"><button type="button" id="bSand"></button><button type="button" id="bOrder"></button><button type="button" id="bBook"></button><button type="button" id="bPause"></button></div>
      <button type="button" class="big" id="bAcc"></button>
    </div>
  </main>
</div>
<div id="ovl"></div>
<script>
(function(){
"use strict";
const T = window.MK_T, GE = window.GE, PH = GE.PH, fmt = GE.fmt, nf = GE.nf, GAME = "gintaro-ekspresas";
const $ = id => document.getElementById(id);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const LC = { l1: "#0f7c82", l2: "#2f7d3b", l3: "#2b62b0", l4: "#b5571b", l5: "#c8442f" };
const hash = (i, s) => { const x = Math.sin(i * 127.1 + (s || 0) * 311.7) * 43758.5453; return x - Math.floor(x); };
const mmss = sec => { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); };

/* ================= saugykla ================= */
let seen = MK.get("mk-" + GAME + "-matyta", {});
let stamps = MK.get("mk-" + GAME + "-knygele", {});
const totalStars = () => { const b = MK.best(GAME); return GE.LINES.reduce((a, l) => a + (b[l.id] || 0), 0); };
const rankOf = st => { let r = T.ranks[0], nx = null; T.ranks.forEach(x => { if(st >= x[0]) r = x; }); nx = T.ranks.find(x => x[0] > st) || null; return { r, nx }; };
const starStr = (n, m) => { let s = ""; for(let i = 0; i < (m || 3); i++) s += i < n ? "<u>★</u>" : "★"; return s; };

/* ================= paletės ================= */
const PAL = {
  sea:    { sky: ["#bfe3ec", "#eaf6f3"], far: "#6fb4c4", far2: "#4f9db3", mid: "#8fbf8a", ground: "#e9d9a6", ground2: "#dcc98c", tree: "#3f7f5a", loco: "#e39a12", car: "#f3ead2", stripe: "#0f7c82" },
  forest: { sky: ["#cfe8d8", "#f1f6e4"], far: "#8db79a", far2: "#6b9d80", mid: "#4f8a5e", ground: "#cfd9a0", ground2: "#b8c686", tree: "#2c6444", loco: "#e39a12", car: "#f3ead2", stripe: "#2f7d3b" },
  lake:   { sky: ["#c6dcf2", "#f0f4ec"], far: "#7fa6d2", far2: "#5d8cc4", mid: "#86b58c", ground: "#d5dfa8", ground2: "#bfcd8c", tree: "#3d7a56", loco: "#e39a12", car: "#f3ead2", stripe: "#2b62b0" },
  hill:   { sky: ["#f1dcc0", "#f8f1df"], far: "#c9a57c", far2: "#b08a5f", mid: "#c98b3e", ground: "#dfc98e", ground2: "#cdb372", tree: "#b5571b", loco: "#e39a12", car: "#f3ead2", stripe: "#b5571b" },
  eve:    { sky: ["#f3b48a", "#fbe6c4"], far: "#b9788a", far2: "#8f5d80", mid: "#6d5a78", ground: "#d6c08e", ground2: "#c2a972", tree: "#4a4763", loco: "#e39a12", car: "#f3ead2", stripe: "#c8442f" }
};

/* ================= piešimas: pasaulis ================= */
function rr(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r); g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath(); }
function hills(g, W, base, amp, off, f, seed, col){
  g.fillStyle = col; g.beginPath(); g.moveTo(0, base + 200);
  for(let x = 0; x <= W + 8; x += 8){ const u = (x + off) * f; g.lineTo(x, base - amp * (0.55 + 0.3 * Math.sin(u + seed) + 0.15 * Math.sin(u * 2.3 + seed * 2))); }
  g.lineTo(W, base + 200); g.closePath(); g.fill();
}
function pine(g, x, y, h, col){ g.fillStyle = col; g.beginPath(); g.moveTo(x, y - h); g.lineTo(x + h * 0.26, y - h * 0.45); g.lineTo(x + h * 0.14, y - h * 0.45); g.lineTo(x + h * 0.34, y); g.lineTo(x - h * 0.34, y); g.lineTo(x - h * 0.14, y - h * 0.45); g.lineTo(x - h * 0.26, y - h * 0.45); g.closePath(); g.fill(); }
function leafy(g, x, y, h, col){ g.fillStyle = "#6b4a2e"; g.fillRect(x - 1.5, y - h * 0.4, 3, h * 0.4); g.fillStyle = col; g.beginPath(); g.arc(x, y - h * 0.62, h * 0.36, 0, 7); g.arc(x - h * 0.2, y - h * 0.45, h * 0.24, 0, 7); g.arc(x + h * 0.2, y - h * 0.45, h * 0.24, 0, 7); g.fill(); }
function each(off, W, sp, fn){ const i0 = Math.floor(off / sp) - 1, i1 = Math.floor((off + W) / sp) + 1; for(let i = i0; i <= i1; i++) fn(i, i * sp - off); }

function drawWorld(g, W, H, V){
  const P = PAL[V.theme], gy = Math.round(H * 0.76), ppk = V.ppk, nx = V.nx, L = V.L, t = V.time;
  const sx = km => nx + (km - V.x) * ppk, px = V.x * ppk, seed = V.seed || 1;
  const th = clamp(ppk * 0.3 * 0.15, 30, 52), ink = "#1d2433";
  /* dangus */
  const sk = g.createLinearGradient(0, 0, 0, gy); sk.addColorStop(0, P.sky[0]); sk.addColorStop(1, P.sky[1]); g.fillStyle = sk; g.fillRect(0, 0, W, gy);
  g.fillStyle = V.theme === "eve" ? "#f6d27a" : "#fff6cf"; g.beginPath(); g.arc(W * 0.8, V.theme === "eve" ? gy * 0.62 : gy * 0.3, V.theme === "eve" ? 26 : 18, 0, 7); g.fill();
  g.fillStyle = "rgba(255,255,255,.75)";
  each(px * 0.03 + t * 4, W, 230, (i, x) => { const y = 46 + hash(i, seed) * gy * 0.25, s = 0.7 + hash(i, 3) * 0.7; g.beginPath(); g.ellipse(x, y, 34 * s, 9 * s, 0, 0, 7); g.ellipse(x + 20 * s, y - 6 * s, 20 * s, 8 * s, 0, 0, 7); g.fill(); });
  /* tolimas planas */
  if(V.theme === "sea"){
    g.fillStyle = P.far; g.fillRect(0, gy - 52, W, 60); g.strokeStyle = "rgba(255,255,255,.6)"; g.lineWidth = 1.5;
    each(px * 0.06 + t * 6, W, 46, (i, x) => { const y = gy - 46 + hash(i, 5) * 34; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 7, y - 3, x + 14, y); g.stroke(); });
    each(px * 0.06, W, 900, (i, x) => { if(hash(i, 9) > 0.4){ g.fillStyle = "#fff"; g.fillRect(x, gy - 92, 8, 42); g.fillStyle = "#c8442f"; g.fillRect(x, gy - 80, 8, 8); g.fillRect(x - 2, gy - 98, 12, 7); } });
    hills(g, W, gy + 4, 22, px * 0.2, 0.012, seed, P.ground2);
  } else if(V.theme === "lake"){
    hills(g, W, gy - 34, 34, px * 0.05, 0.006, seed, P.tree + "88");
    g.fillStyle = P.far; g.fillRect(0, gy - 36, W, 40); g.strokeStyle = "rgba(255,255,255,.55)"; g.lineWidth = 1.2;
    each(px * 0.1 + t * 3, W, 60, (i, x) => { const y = gy - 30 + hash(i, 5) * 22; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 16, y); g.stroke(); });

  if(S.started && S.v > 10 && !S.acc && !S.brk) tipOnce("coast", T.tip1, 4);
  if(sl && S.v > 5) tipOnce("sl" + (sl > 0 ? "u" : "d"), sl > 0 ? T.tipSlopeUp : T.tipSlopeDn, 3.5);
  const z = limAt(S.x);
  if(z && !z.quiet){ if(S.zone !== z){ S.zone = z; toast(fmt(T.tipLimit, { v: z.ms ? z.ms + " m/s" : z.v + " km/h" }), 3); } if(S.v * 3.6 > z.v + 7){ S.violT += dt; if(S.violT > 14 && !S.viol){ S.viol = z; toast(T.tipOver, 3); MK.sfx.bad(); } } else S.violT = Math.max(0, S.violT - dt); }
  else if(S.zone && !z){ S.zone = null; }
  else if(S.zone && z && z.quiet){ S.zone = null; toast(T.tipLimitEnd, 2.5); }
  if(L.mode !== "fog" && S.x > L.s - 1.05 && S.x < L.s - 0.9) tipOnce("boards", T.tipBoards, 4);
  /* tarpinė stotelė */
  if(L.mid){
    const m = L.mid;
    if(S.midArr == null && !S.midMiss){ if(S.v === 0 && Math.abs(S.x - m.km) <= 0.4 && S.x <= m.km + 0.22){ S.midArr = S.tG; MK.sfx.beep(); toast(fmt(T.tipMidWait, { t: m.t0 + m.wait }), 5); } else if(S.x > m.km + 0.3){ S.midMiss = true; } }
    else if(S.midArr != null && S.midLeft == null && S.v > 0.5) S.midLeft = S.tG;
  }
  /* atvykimas */
  if(S.v === 0 && S.started){
    S.stopT += dtR;
    if(S.x >= L.s - 0.38 && S.x <= L.s + 0.24){ if(S.stopT > 0.45) arrive(); }
    else if(L.mode !== "fog" && S.x > L.s - 1.2 && S.x < L.s - 0.38 && S.stopT > 0.6 && !(L.mid && S.midLeft == null)) toast(T.tipShort, 2);
  } else S.stopT = 0;
  if(S.x > L.s + 0.32 && !S.arrived){ S.over = true; S.tG += 120; S.x = L.s; S.v = 0; MK.sfx.bad(); arrive(); }
}
function arrive(){
  if(S.arrived) return; S.arrived = true; release(); S.phase = "arrive"; S.trace.push([S.tG / 60, S.x]);
  const L = S.L; if(!S.over) MK.sfx.good();
  if(L.meet && !S.over){ S.meetX = S.x + 1.2; S.meetV = 1; setTimeout(() => { toast(T.tipMeet, 2.5); }, 1800); setTimeout(report, 3200); }
  else setTimeout(report, 900);
}
function report(){
  const L = S.L, tArr = S.tG / 60; S.phase = "report";
  let tp = GE.judgeTime(L, tArr), lines = [], clean = 1;
  const edge = !S.over && (S.x < L.s - 0.2 || S.x > L.s + 0.14);
  const p = { p: L.T + ":00", a: mmss(S.tG) }, d = tArr - L.T;
  if(L.soft){
    if(S.over){ lines.push([0, fmt(T.vOverFog, L.p)]); tp = 0; clean = 0; }
    else lines.push([tp, tp === 2 ? T.vFog2 : tp === 1 ? T.vFog1 : T.vFog0]);
  } else {
    const msg = tp === 2 ? T.vt2 : tp === 1 ? (d > 0 ? T.vt1late : T.vt1early) : fmt(d > 0 ? T.vt0late : T.vt0early, { d: nf(Math.max(1, Math.round(Math.abs(d)))) });
    lines.push([tp, fmt(T.vTime[tp], p) + " " + msg]);
    if(S.over){ lines.push([0, T.vOver]); clean = 0; }
    else lines.push([edge ? 1 : 2, edge ? T.vStopEdge : T.vStopOk]);
    if(tp < 2 && !L.mid && !L.sw && L.lim.filter(z => !z.quiet).length === 0 && S.cruise.length > 20){ const cs = S.cruise.slice().sort((a, b) => a - b), med = cs[Math.floor(cs.length / 2)]; if(Math.abs(med - L.v) > 4) lines.push([0, fmt(T.vSpeed, { a: Math.round(med / 5) * 5 === L.v ? Math.round(med) : Math.round(med / 5) * 5, v: nf(L.v) })]); }
  }
  if(S.viol){ lines.push([0, fmt(T.vLimit, { v: S.viol.ms ? S.viol.ms + " m/s" : S.viol.v + " km/h" })]); clean = 0; }
  if(L.input && !S.inputOk){ lines.push([0, T.vInput]); clean = 0; }
  if(L.mid){ const ok = S.midArr != null && S.midLeft != null && Math.abs(S.midLeft / 60 - (L.mid.t0 + L.mid.wait)) <= 1.2; if(!ok){ lines.push([0, T.vMid]); clean = 0; } }
  let pts = L.soft ? (S.over ? 0 : Math.max(1, tp + clean)) : tp + clean;
  if(L.soft && !S.over && tp === 2 && clean) pts = 3;
  S.results.push({ L, pts, tp });
  let stampH = "";
  if(tp === 2 && !S.over){ const k = S.line.id + ":" + L.B; if(!stamps[k]){ stamps[k] = 1; MK.set("mk-" + GAME + "-knygele", stamps); S.newStamps.push(L.B); stampH = `<div class="stampNew" style="--c:${LC[S.line.id]}">${fmt(T.stamp, { B: L.B })}</div>`; MK.sfx.star(1); } }
  const gr = L.graph && !L.graph.others.length && L.mode !== "fog" ? L.graph : GE.graphOf([[0, 0], [L.T, L.s]]);
  const g2x = Object.assign({}, gr, { tMax: Math.max(gr.tMax, Math.ceil(Math.min(tArr, gr.tMax * 1.6))) }); g2x.tStep = g2x.tMax <= 10 ? 1 : g2x.tMax <= 20 ? 2 : 4;
  const last = S.i === S.legs.length - 1;
  openOvl(`<div class="pp">${hdr(T.repT, legHead())}<div class="bd"><div class="vl">${lines.map(l => `<i class="m${l[0]}">${T.marks[l[0]]}</i><span>${l[1]}</span>`).join("")}</div>
    <div class="pts">${fmt(T.pts, { a: "<u>" + pts + "</u>" })}</div>${stampH}
    <h4>${T.sol}</h4><p class="why">${fmt(T.w[L.type], L.p)}</p>${svgGraph(g2x, S.trace)}
    <div class="row"><button type="button" class="btn" data-a="go">${T.cont}</button></div></div></div>`, { go: () => { closeOvl(); if(last) finishRun(); else { S.i++; beginLeg(); } } });
}
function finishRun(){
  S.phase = "done"; const tot = S.results.reduce((a, r) => a + r.pts, 0), max = S.results.length * 3, pct = tot / max, stars = pct >= 0.85 ? 3 : pct >= 0.6 ? 2 : tot > 0 ? 1 : 0;
  MK.best(GAME, S.line.id, stars); MK.sfx.win();
  const rk = rankOf(totalStars()).r[1], idx = GE.LINES.indexOf(S.line), nx = GE.LINES[idx + 1];
  openOvl(`<div class="pp">${hdr(T.runT, T.lines[S.line.id].n)}<div class="bd"><div class="bigst">${starStr(stars)}</div><p>${fmt(T.runP, { n: T.lines[S.line.id].n, a: tot, b: max })}</p>
    ${rk !== S.rank0 ? `<p class="msg good">${fmt(T.runRank, { n: rk })}</p>` : ""}${S.newStamps.length ? `<p>${fmt(T.runStamps, { a: S.newStamps.join(", ") })}</p>` : ""}
    <h4>${T.runLegs}</h4><div class="legs">${S.results.map(r => `<div><span>${r.L.A} → ${r.L.B}</span><u>${"●".repeat(r.pts)}<s>${"●".repeat(3 - r.pts)}</s></u></div>`).join("")}</div>
    <div class="row">${nx ? `<button type="button" class="btn" data-a="next">${T.nextLine}</button>` : ""}<button type="button" class="btn alt" data-a="again">${T.again}</button><button type="button" class="btn alt" data-a="menu">${T.depot}</button></div></div></div>`,
    { next: () => { closeOvl(); startRun(nx.id); }, again: () => { closeOvl(); startRun(S.line.id); }, menu: showMenu });
}

/* ================= valdymas ================= */
function release(){ S.acc = S.brk = false; $("bAcc").classList.remove("on"); $("bBrk").classList.remove("on"); }
function hold(btn, key){
  const on = e => { e.preventDefault(); if(S.phase !== "drive" || S.paused) return; S[key] = true; btn.classList.add("on"); try{ btn.setPointerCapture(e.pointerId); }catch(_){ } MK.unlock(); MK.music.stop(); };
  const off = e => { S[key] = false; btn.classList.remove("on"); };
  btn.addEventListener("pointerdown", on); btn.addEventListener("pointerup", off); btn.addEventListener("pointercancel", off); btn.addEventListener("lostpointercapture", off); btn.addEventListener("contextmenu", e => e.preventDefault());
}
hold($("bAcc"), "acc"); hold($("bBrk"), "brk");
function toggleSand(){ if(S.phase !== "drive" || !S.L.sand || S.sand <= 0) return; S.sandOn = !S.sandOn; $("bSand").classList.toggle("on", S.sandOn); MK.sfx.tap(); }
$("bSand").addEventListener("click", toggleSand); $("bOrder").addEventListener("click", reviewOrder); $("bBook").addEventListener("click", bookCard); $("bPause").addEventListener("click", pauseCard);
const KA = { ArrowUp: "acc", ArrowRight: "acc", KeyD: "acc", KeyW: "acc", ArrowDown: "brk", ArrowLeft: "brk", KeyA: "brk" };
document.addEventListener("keydown", e => {
  if(e.target && e.target.tagName === "INPUT"){ if(e.key === "Enter" && ovlActs && ovlActs.send) ovlActs.send(); return; }
  if($("ovl").classList.contains("on")){ if(e.key === "Enter" || e.code === "Space"){ const b = $("ovl").querySelector(".btn"); if(b){ e.preventDefault(); b.click(); } } return; }
  if(S.phase !== "drive") return;
  const k = KA[e.code]; if(k){ e.preventDefault(); if(!S.paused){ S[k] = true; $(k === "acc" ? "bAcc" : "bBrk").classList.add("on"); } return; }
  if(e.code === "KeyS"){ toggleSand(); } else if(e.code === "KeyN"){ reviewOrder(); } else if(e.code === "KeyP" || e.code === "Escape"){ pauseCard(); }
});
document.addEventListener("keyup", e => { const k = KA[e.code]; if(k){ S[k] = false; $(k === "acc" ? "bAcc" : "bBrk").classList.remove("on"); } });
window.addEventListener("blur", release);
$("lines").addEventListener("click", e => { const b = e.target.closest("[data-l]"); if(b){ MK.sfx.tap(); startRun(b.dataset.l); } });
$("map").addEventListener("click", e => { const b = e.target.closest("[data-l]"); if(b){ MK.sfx.tap(); startRun(b.dataset.l); } });

/* ================= ciklas ================= */
const HV = { x: 0, v: 22, theme: "sea", seed: 4, L: null, plats: [], ka: 0 };
let prev = 0;
function frame(ts){
  const dtR = Math.min(0.05, (ts - prev) / 1000 || 0); prev = ts; S.time += dtR;
  if(toastT && S.time > toastT){ $("toast").classList.remove("on"); toastT = 0; }
  if(!$("menu").hidden){
    HV.x += dtR * 0.09; HV.time = S.time; HV.theme = ["sea", "forest", "lake", "hill", "eve"][Math.floor(S.time / 9) % 5];
    HV.ppk = clamp(HW * 1.5, 620, 1000); HV.nx = HW * 0.62; gh.setTransform(DPR, 0, 0, DPR, 0, 0); drawWorld(gh, HW, 170, HV);
  } else if(S.L){
    if(S.phase === "drive" && !S.paused) update(dtR);
    if(S.meetX != null) S.meetX -= dtR * 1.1;
    const L = S.L, ppk = clamp(W * 1.9, 720, 1250), V = { x: S.x, v: S.v, L, theme: S.line.theme, seed: S.i * 7 + GE.LINES.indexOf(S.line) * 3 + 1, time: S.time, ppk, nx: W >= 700 ? W * 0.5 : W * 0.6, ka: L.ka, plats: S.plats, fog: L.mode === "fog", sanding: S.sandOn && S.sand > 0 && (S.v > 0 || S.acc), slip: S.slip, skid: S.skid, brk: S.brk, meetX: S.meetX };
    g2.setTransform(DPR, 0, 0, DPR, 0, 0); g2.clearRect(0, 0, W, H); g2.save(); g2.translate(0, 22); drawWorld(g2, W, H - 22, V); g2.restore(); drawStrip(g2, W, V);
    if(L.live && L.graph){ const gw = Math.min(W * 0.56, 250), ghh = Math.min(H * 0.52, 150); drawLive(g2, 8, 52, gw, ghh, L.graph, S.trace, S.tG / 60, S.x); }
    gd.setTransform(DPR, 0, 0, DPR, 0, 0); drawDash(gd, DW, DH);
  }
  requestAnimationFrame(frame);
}

/* ================= pradžia ================= */
$("bAcc").innerHTML = T.bAcc + "<small>↑</small>"; $("bBrk").innerHTML = T.bBrk + "<small>↓</small>"; $("bSand").textContent = T.bSand; $("bOrder").textContent = T.bOrder; $("bBook").textContent = T.bBook; $("bPause").textContent = T.bPause;
$("app").prepend(MK.top({ title: T.title, grade: 6 }));
window.__GE = { S, startRun, showMenu };
showMenu(); requestAnimationFrame(frame);
})();
</script>
