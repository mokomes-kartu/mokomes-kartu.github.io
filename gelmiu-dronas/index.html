<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gelmių dronas – MokomėsKartu.lt</title>
<meta name="description" content="6 klasės matematikos žaidimas: neigiamieji ir teigiamieji sveikieji skaičiai, priešingi skaičiai, veiksmai su sveikaisiais skaičiais ir koordinačių plokštuma – valdyk tyrimų droną virš jūros ir po vandeniu.">
<meta name="theme-color" content="#fff9e6">
<meta name="robots" content="noindex">
<link rel="icon" href="/logo/mk-ikona.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800&family=Manrope:wght@600;700;800&display=swap">
<script src="/bendra/mk.js"></script>
<script src="/gelmiu-dronas/tekstai.lt.js"></script>
<style>
/* Meniu: laivas su operatoriumi ir dronu, radinių kolekcija, lygiai, „Noriu pasimokyti“.
   Užduotys: vertikali skaičių tiesė (jūros lygis = 0) – padalos pasirinkimas ir „Skristi čia“; pasirinkimo užduotys;
   rikiavimas; maršrutai su komandų kortelėmis (ribotas kuras, raudonos juostos); koordinačių plokštuma (sonaras). */
body{--ac:#0a7abf;--ac-ink:#fff;--ac-soft:#d9f0fb}
@media (max-width:380px){.mk-title{font-size:17px}}
.mk-hero{padding-top:0}
.mk-hero h1{margin-top:8px;font-size:clamp(32px,8.4vw,54px)}
.mk-hero p{max-width:44ch;font-size:16.5px}
.hero-art{width:min(100%,480px);border-radius:26px;overflow:hidden;position:relative;box-shadow:0 6px 0 rgba(18,26,51,.15)}
.hero-art svg{display:block;width:100%;height:auto}
.hero-art::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 3px var(--ink);pointer-events:none}
.col{width:100%;max-width:520px;margin:0 auto 14px;padding:12px 14px 14px;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 2.5px var(--ink),0 5px 0 rgba(18,26,51,.14)}
.col h2{margin:0;font:800 18px/1.2 var(--kid);display:flex;gap:8px;align-items:center}
.col h2 svg{width:30px;height:30px;flex:none}
.col p{margin:4px 0 10px;color:var(--soft);font-weight:700;font-size:14.5px}
.finds{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.find{border-radius:14px;background:#eef8fd;box-shadow:inset 0 0 0 2px #121a33;padding:4px 2px 5px;text-align:center}
.find svg{display:block;width:74%;margin:0 auto;height:auto}
.find small{display:block;font:800 9.5px/1.15 var(--body);color:var(--soft);min-height:22px;padding:0 2px}
.find.off{background:#f3efe2;box-shadow:inset 0 0 0 2px #cfc4a2}
.find.off svg{opacity:.28;filter:grayscale(1)}
.find.new{animation:mkPop .6s cubic-bezier(.2,1.6,.4,1)}

.hud{display:flex;align-items:center;gap:8px;margin:0 0 8px;min-height:36px}
.hud .mk-dots{margin-right:auto;justify-content:flex-start}
.chip{display:inline-flex;align-items:baseline;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink);font:800 17px/36px var(--kid);white-space:nowrap}
.chip small{font:800 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.chip.pop{animation:mkPop .35s cubic-bezier(.2,1.6,.4,1)}
.card{width:100%;max-width:560px;margin:0 auto 10px;padding:12px 14px 14px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.12)}
.txt{margin:0 0 10px;font:700 16px/1.5 var(--body)}
.txt b{font-weight:800}
.cmd{display:inline-block;padding:1px 10px;border-radius:9px;background:#fff3c4;box-shadow:inset 0 0 0 2px var(--ink);font:800 17px/1.5 var(--kid);white-space:nowrap}
.ex{display:inline-block;padding:2px 10px;border-radius:9px;background:var(--ac-soft);font:800 19px/1.5 var(--kid);white-space:nowrap}
.hzl{color:#b3261e;font-weight:800}
.scn{max-width:350px;margin:0 auto 10px;border-radius:16px;overflow:hidden;box-shadow:0 0 0 2.5px var(--ink);background:#bfe6fb;touch-action:manipulation}
.scn svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.scn .hit{fill:transparent;cursor:pointer}
.dr{transition:transform .7s cubic-bezier(.45,0,.2,1)}
.rot{animation:rot .5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes rot{50%{transform:scaleX(.25)}}
.sig{animation:sig 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes sig{from{transform:scale(.5);opacity:1}to{transform:scale(1.5);opacity:0}}
.ans{display:grid;gap:8px}
.ans.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.a{min-height:52px;padding:10px 12px;border:0;border-radius:14px;background:#fff;cursor:pointer;text-align:left;font:800 16.5px/1.3 var(--body);color:var(--ink);
  box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.16);transition:transform .1s;touch-action:manipulation}
.ans.two .a{text-align:center;font:800 20px/1.2 var(--kid)}
.a:active{transform:translateY(3px)}
.a.ok{background:#dff7e6;box-shadow:inset 0 0 0 3.5px var(--good),0 4px 0 rgba(18,26,51,.16)}
.a.no{background:#ffe6df;box-shadow:inset 0 0 0 3.5px var(--bad),0 4px 0 rgba(18,26,51,.16)}
.ans.done .a{pointer-events:none}
.ans.done .a:not(.ok):not(.no){opacity:.5}
.go{display:flex;width:100%;max-width:560px;margin:4px auto 0}
.mk-why{max-width:560px;margin-inline:auto}
.mk-why-m p{margin:4px 0}
.fade{animation:mkIn .4s cubic-bezier(.2,1.2,.4,1)}
.note{min-height:24px;margin:8px 0;text-align:center;font:800 15.5px/1.35 var(--body);color:var(--soft)}
.note.good{color:#1c8a52}.note.warn{color:#b8531a}
.bigbtn{display:flex;width:100%;min-height:54px;font-size:19px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 8px;font:800 14px/1.2 var(--body);color:var(--soft)}
.fuel{display:inline-flex;gap:5px;align-items:center}
.fuel i{width:16px;height:16px;border-radius:50%;background:#ffc61a;box-shadow:inset 0 0 0 2.5px var(--ink)}
.fuel i.e{background:#fff;box-shadow:inset 0 0 0 2.5px #cfc4a2}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cd{min-height:52px;padding:6px 4px;border:0;border-radius:14px;background:#fff3c4;cursor:pointer;font:800 19px/1.1 var(--kid);color:var(--ink);white-space:nowrap;
  box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.2);transition:transform .1s;touch-action:manipulation}
.cd:active{transform:translateY(3px)}
.cd.used{opacity:.32;pointer-events:none;box-shadow:inset 0 0 0 2.5px var(--ink)}
.cd.sol{background:#dff7e6;opacity:1}
.log{display:flex;flex-wrap:wrap;gap:6px;min-height:30px;margin:10px 0 0;font:700 13.5px/1.3 var(--body);color:var(--soft);align-items:center}
.log span{padding:3px 9px;border-radius:9px;background:var(--ac-soft);font:800 15px/1.4 var(--kid);color:var(--ink);white-space:nowrap}
.pool,.seq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:56px;align-items:center}
.seq{margin:10px 0;padding:8px;border-radius:14px;background:var(--ac-soft);box-shadow:inset 0 0 0 2px #9fcfe8}
.seq em{font:700 14px/1.3 var(--body);font-style:normal;color:var(--soft);text-align:center}
.nb{min-width:56px;height:48px;padding:0 10px;border:0;border-radius:13px;background:#fff;cursor:pointer;font:800 21px/1 var(--kid);color:var(--ink);
  box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.18);touch-action:manipulation}
.nb.ok{background:#dff7e6;box-shadow:inset 0 0 0 3px var(--good)}
.nb.no{background:#ffe6df;box-shadow:inset 0 0 0 3px var(--bad)}
.rst{display:flex;width:100%;font-size:16px;margin-top:2px}
.lt{color:var(--soft);font:800 18px/1 var(--kid)}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <section id="menu">
    <div class="mk-hero">
      <div class="hero-art" id="heroArt"></div>
      <h1 id="heroH"></h1>
      <p id="heroP"></p>
    </div>
    <div class="col" id="col"></div>
    <div id="levels"></div>
    <div id="learn"></div>
  </section>
  <section id="play" hidden>
    <div class="hud"><div id="dots"></div><span class="chip" id="ptsChip"><small id="ptsL"></small><span id="pts">0</span></span></div>
    <div id="stage"></div>
  </section>
</div>
<script>
(function(){
"use strict";
const T = window.MK_T, GAME = "gelmiu-dronas", GRADES = [6];
const R = MK.rnd, P = MK.pick, SH = MK.shuffle, f = T.f, p = T.p;
const K = "#121a33", S = `stroke="${K}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"`;
const $ = id => document.getElementById(id);
const r1 = x => +x.toFixed(1);
const FT = `font-family="Manrope,sans-serif" font-weight="800"`;

/* ================= piešiniai ================= */
const droneSvg = () => `<path d="M-10-7v-6M10-7v-6" stroke="${K}" stroke-width="2.4" stroke-linecap="round"/>
  <ellipse class="rot" cx="-10" cy="-14" rx="9" ry="2.6" fill="#9aa7c7" stroke="${K}" stroke-width="1.4"/><ellipse class="rot" cx="10" cy="-14" rx="9" ry="2.6" fill="#9aa7c7" stroke="${K}" stroke-width="1.4"/>
  <path d="M-12 8l-4 6M12 8l4 6M-19 14h7M12 14h7" stroke="${K}" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <rect x="-19" y="-8" width="38" height="17" rx="8.5" fill="#ffc61a" ${S}/><rect x="-13" y="-3.5" width="11" height="7" rx="3.5" fill="#ff5a3c" stroke="${K}" stroke-width="1.4"/>
  <circle cx="8" cy=".5" r="5.2" fill="#bfe9ff" stroke="${K}" stroke-width="1.8"/><circle cx="9.6" cy="-1" r="1.6" fill="#fff"/>`;
/* operatorius: pilnas žmogeliukas su valdymo pulteliu; (x; y) – pėdų vieta */
function operatorSvg(x, y, s){
  return `<g transform="translate(${x} ${y}) scale(${s})">
    <path d="M-6 0v-15M6 0v-15" stroke="#26335c" stroke-width="6.5" stroke-linecap="round"/><path d="M-10 0h7M3 0h8" stroke="${K}" stroke-width="4.5" stroke-linecap="round"/>
    <rect x="-11" y="-36" width="22" height="23" rx="7" fill="#ff8a1f" ${S}/><path d="M-4-36v23M4-36v23" stroke="#fff" stroke-width="2"/>
    <path d="M-9-31l-13 9M9-31l-24 12" stroke="#ffd9b3" stroke-width="5.5" stroke-linecap="round"/><path d="M-9-31l-6 4M9-31l-10 5" stroke="#2f6bff" stroke-width="6" stroke-linecap="round"/>
    <rect x="-30" y="-25" width="17" height="10" rx="3" fill="#3a4466" ${S}/><path d="M-27-25v-13" stroke="${K}" stroke-width="1.8" stroke-linecap="round"/><circle cx="-27" cy="-39" r="2" fill="#ff5a3c"/>
    <path d="M-33-43q-5 4 0 9M-37-46q-8 7 0 15" fill="none" stroke="#ff5a3c" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="0" cy="-45" r="9.5" fill="#ffd9b3" ${S}/><path d="M-10-47q1-10 10-10t10 10z" fill="#2f6bff" ${S}/><path d="M-10-47h-7" stroke="${K}" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-4" cy="-44" r="1.3" fill="${K}"/><path d="M-6-40q3 2.5 6 0" fill="none" stroke="${K}" stroke-width="1.5" stroke-linecap="round"/>
  </g>`;
}
function shipSvg(y0){
  return `<g>
    <path d="M258 ${y0 - 54}V${y0 - 96}" stroke="${K}" stroke-width="2.4"/><rect x="258" y="${y0 - 96}" width="17" height="4" fill="#fdb913"/><rect x="258" y="${y0 - 92}" width="17" height="4" fill="#006a44"/><rect x="258" y="${y0 - 88}" width="17" height="4" fill="#c1272d"/><rect x="258" y="${y0 - 96}" width="17" height="12" fill="none" stroke="${K}" stroke-width="1.2"/>
    <rect x="232" y="${y0 - 48}" width="52" height="29" rx="4" fill="#fff" ${S}/><rect x="228" y="${y0 - 55}" width="60" height="9" rx="3" fill="#e63946" ${S}/>
    <circle cx="246" cy="${y0 - 34}" r="5.5" fill="#8fd3f4" ${S}/><circle cx="264" cy="${y0 - 34}" r="5.5" fill="#8fd3f4" ${S}/>
    ${operatorSvg(207, y0 - 20, .92)}
    <path d="M166 ${y0 - 21}H310L297 ${y0 + 11}H183Z" fill="#1d3557" ${S}/><path d="M169 ${y0 - 14}H307" stroke="#e63946" stroke-width="4"/><path d="M166 ${y0 - 21}H310" stroke="#fff" stroke-width="2"/>
  </g>`;
}
const MARK = {
  fish: `<path d="M-10 0q6-7 14 0q-8 7-14 0z" fill="#ffb347" ${S}/><path d="M3 0l8-5v10z" fill="#ff8a1f" ${S}/><circle cx="-5" cy="-1" r="1.2" fill="${K}"/>`,
  gull: `<path d="M-12 3q4-10 12-3q8-7 12 3q-7-4-12 2q-5-6-12-2z" fill="#fff" ${S}/>`,
  anchor: `<circle cx="0" cy="-8" r="3" fill="none" stroke="${K}" stroke-width="2.2"/><path d="M0-5V9M-5-1H5M-9 3q1 7 9 7t9-7" fill="none" stroke="${K}" stroke-width="2.4" stroke-linecap="round"/>`,
  balloon: `<circle cx="0" cy="-3" r="8" fill="#ff5a3c" ${S}/><path d="M-3-10q3 7 0 14M3-10q-3 7 0 14" stroke="#fff" stroke-width="1.5" fill="none"/><path d="M-3 5l1 4h4l1-4" fill="none" stroke="${K}" stroke-width="1.4"/><rect x="-2.5" y="9" width="5" height="4" fill="#a5642e" stroke="${K}" stroke-width="1.2"/>`
};
function geo(Rg){ const rh = 372 / (2 * Rg + 1); return { rh, y: n => 14 + (Rg - n + .5) * rh }; }
/* o: { R, drone, target, haz: [], marks: [{ n, k }], tap, x } */
function scene(o){
  const Rg = o.R || 10, g = geo(Rg), y0 = g.y(0), fs = Rg > 10 ? 11 : 12.5, ds = Rg > 10 ? .82 : 1;
  let h = `<svg viewBox="0 0 320 400" id="scn" role="img" aria-label="${T.sceneAria}"><defs>
    <linearGradient id="gsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd8fb"/><stop offset="1" stop-color="#e8f7ff"/></linearGradient>
    <linearGradient id="gsea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4bbde8"/><stop offset=".55" stop-color="#1479b8"/><stop offset="1" stop-color="#0a3f73"/></linearGradient>
    <pattern id="hz" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#fff"/><rect width="5" height="10" fill="#e5383b"/></pattern></defs>
    <rect width="320" height="${r1(y0)}" fill="url(#gsky)"/><circle cx="286" cy="34" r="17" fill="#ffd84d" stroke="#f5a700" stroke-width="2"/>
    <path d="M178 62q4-11 15-7q8-9 18 0q11-1 11 9h-46q-5-1 2-2z" fill="#fff" opacity=".9"/><path d="M96 30q3-8 11-5q7-6 13 1q8 0 7 7H94q-3-2 2-3z" fill="#fff" opacity=".85"/>
    <rect y="${r1(y0)}" width="320" height="${r1(400 - y0)}" fill="url(#gsea)"/>
    <path d="M190 ${r1(y0)}l-22 190h50l-10-190zM262 ${r1(y0)}l14 190h36l-26-190z" fill="#fff" opacity=".06"/>
    <path d="M0 400V388q40-9 84-3t92-2t84 3t60-4v18z" fill="#e6c98a"/><path d="M0 400V394q60-6 120-2t110-1t90-1v10z" fill="#d2ad63"/>
    <path d="M214 388q-6-16 2-26q-2 13 4 26M226 388q4-12-1-22q7 8 5 22M288 386q-5-12 1-20q-1 10 3 20" fill="#2e9e6a"/>
    <circle cx="232" cy="${r1(y0 + 74)}" r="3" fill="none" stroke="#fff" stroke-width="1.3" opacity=".6"/><circle cx="240" cy="${r1(y0 + 58)}" r="2" fill="none" stroke="#fff" stroke-width="1.2" opacity=".6"/><circle cx="286" cy="${r1(y0 + 120)}" r="2.6" fill="none" stroke="#fff" stroke-width="1.2" opacity=".5"/>
    <path d="M250 ${r1(y0 + 96)}q7-8 16 0q-9 8-16 0zM266 ${r1(y0 + 96)}l8-5v10z" fill="#ffd9a0" opacity=".75"/>
    <path d="M48 ${r1(y0)}q9-5 18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0" fill="none" stroke="#fff" stroke-width="2.2" opacity=".9"/>
    ${shipSvg(y0)}
    <rect x="4" y="5" width="44" height="390" rx="11" fill="#fff" ${S}/><path d="M48 ${r1(g.y(Rg) - 5)}V${r1(g.y(-Rg) + 5)}" stroke="${K}" stroke-width="2.4"/>`;
  for(let n = Rg; n >= -Rg; n--){
    const y = r1(g.y(n));
    h += `<path d="M${n === 0 ? 34 : 41} ${y}H56" stroke="${K}" stroke-width="${n === 0 ? 3 : 1.8}" stroke-linecap="round"/>`;
    if(n === 0) h += `<rect x="9" y="${r1(y - 9)}" width="25" height="18" rx="9" fill="${K}"/><text x="21.5" y="${r1(y + 4.6)}" text-anchor="middle" ${FT} font-size="13" fill="#fff">0</text>`;
    else h += `<text x="37" y="${r1(y + fs * .36)}" text-anchor="end" ${FT} font-size="${fs}" fill="${n < 0 ? "#0a5c94" : "#b8531a"}">${f(n)}</text>`;
  }
  (o.haz || []).forEach(n => { const y = g.y(n); h += `<rect x="58" y="${r1(y - g.rh / 2 + 1)}" width="100" height="${r1(g.rh - 2)}" rx="4" fill="url(#hz)" stroke="${K}" stroke-width="1.6" opacity=".9"/>`; });
  h += `<g id="bandG"></g>`;
  if(o.target != null){ const y = r1(g.y(o.target)); h += `<g transform="translate(104 ${y})"><circle class="sig" r="15" fill="none" stroke="#ff3d9a" stroke-width="2.5"/><circle r="10.5" fill="#ffe3f1" stroke="#ff3d9a" stroke-width="2.5"/><path d="M0-6.5L5.5 0L0 6.5L-5.5 0Z" fill="#ff3d9a" stroke="${K}" stroke-width="1.5" stroke-linejoin="round"/></g>`; }
  h += `<g id="marksG">${marksSvg(o.marks || [], g, o.pre)}</g>`;
  if(o.drone != null) h += `<g id="dr" class="dr" style="transform:translateY(${r1(g.y(o.drone))}px)"><g transform="translate(104 0) scale(${ds})">${droneSvg()}</g>
    <g transform="translate(${Rg > 10 ? 127 : 131} 0)"><rect x="0" y="-10" width="34" height="20" rx="10" fill="#fff" stroke="${K}" stroke-width="1.8"/><text id="drT" x="17" y="4.6" text-anchor="middle" ${FT} font-size="13" fill="${K}">${f(o.drone)}</text></g></g>`;
  h += `<g id="selG"></g>`;
  if(o.tap) for(let n = Rg; n >= -Rg; n--) h += `<rect class="hit" data-n="${n}" x="0" y="${r1(g.y(n) - g.rh / 2)}" width="168" height="${r1(g.rh)}"/>`;
  return h + `</svg>`;
}
function marksSvg(marks, g, pre){
  return marks.map(m => m.k === "num"
    ? `<g transform="translate(104 ${r1(g.y(m.n))})"><rect x="-19" y="-8.5" width="38" height="17" rx="8.5" fill="${m.hi ? "#dff7e6" : "#fff"}" stroke="${m.hi ? "#1c8a52" : K}" stroke-width="${m.hi ? 2.6 : 1.8}"/><text y="4.6" text-anchor="middle" ${FT} font-size="12.5" fill="${K}">${f(m.n)}</text></g>`
    : `<g transform="translate(70 ${r1(g.y(m.n))}) scale(.9)">${MARK[m.k]}</g>`).join("");
}
function band(g, n, col){ return `<rect x="50" y="${r1(g.y(n) - g.rh / 2)}" width="118" height="${r1(g.rh)}" fill="${col}"/>`; }

/* koordinačių plokštuma (sonaras); o: { pts: [{ x, y, l, c }], drone: [x, y], tap } */
const GX = x => 160 + 26 * x, GY = y => 160 - 26 * y;
function gridSvg(o){
  let h = `<svg viewBox="0 0 320 320" id="grd" role="img" aria-label="${T.gridAria}"><rect width="320" height="320" fill="#e4f6f4"/>`;
  [52, 104, 156].forEach(r => h += `<circle cx="160" cy="160" r="${r}" fill="none" stroke="#a9ded8" stroke-width="1.4" stroke-dasharray="3 5"/>`);
  for(let i = -5; i <= 5; i++) h += `<path d="M${GX(i)} 22V298M22 ${GY(i)}H298" stroke="#b9dcd7" stroke-width="1"/>`;
  h += `<path d="M14 160H306M160 306V14" stroke="${K}" stroke-width="2.2"/><path d="M306 160l-9-5v10zM160 14l-5 9h10z" fill="${K}"/>
    <text x="304" y="178" text-anchor="middle" ${FT} font-size="14" font-style="italic" fill="${K}">x</text><text x="146" y="20" text-anchor="middle" ${FT} font-size="14" font-style="italic" fill="${K}">y</text>`;
  for(let i = -5; i <= 5; i++) if(i){
    h += `<path d="M${GX(i)} 156v8M156 ${GY(i)}h8" stroke="${K}" stroke-width="1.6"/>

function solve(c){

      const u = used.concat(i); if(nx === c.T){ out.push(u); continue; } if(c.haz.includes(nx) || u.length >= c.M) continue; rec(nx, u);
    }

}

  if(t === ":") return { t, v: P([-4, -3, -2, -2, 2, 2, 3, 4]) };

}

    for(let k = 0; k < 200 && cards.length < cfg.H; k++){ const o = randOp(cfg); if(labs.has(opL(o))) continue; labs.add(opL(o)); cards.push(o); }
    if(cards.length < cfg.H) return null;
    const c = { type: "route", R: Rg, S: S0, T: x, cards: SH(cards), M: cfg.M, haz: [] };
    let sols = solve(c); if(!sols.length || sols.some(s => s.length < cfg.M)) return null;
    if(cfg.haz){

      const pr = [], oth = [];
      sols.forEach(s => { let z = S0; s.slice(0, -1).forEach(i => { z = ap(z, c.cards[i]); if(z !== S0 && !path.includes(z) && !pr.includes(z)) pr.push(z); }); });

    if(gok && gx === c.T) return null; /* kortelės iš eilės neturi būti sprendimas */

}
function showOrder(){
  const c = cur, n = c.nums.length; let seq = [], tries = 0, done = false;
  stage.innerHTML = `<div class="card fade"><p class="txt">${c.text}</p><div class="pool" id="pool"></div><div class="seq" id="seq"></div>
    <p class="note" id="note" role="status" aria-live="polite">${T.ordHint}</p><button type="button" class="mk-btn bigbtn" id="goB" disabled>${T.check}</button></div><div id="flow"></div>`;
  const draw = res => {
    $("pool").innerHTML = c.nums.map((v, i) => seq.includes(i) ? "" : `<button type="button" class="nb" data-i="${i}">${f(v)}</button>`).join("");
    $("seq").innerHTML = seq.length ? seq.map((i, k) => (k ? `<span class="lt">${c.asc ? "&lt;" : ">"}</span>` : "") + `<button type="button" class="nb${res ? (c.nums[i] === c.sorted[k] ? " ok" : " no") : ""}" data-k="${k}">${f(c.nums[i])}</button>`).join("") : `<em>${T.ordHint}</em>`;
    $("goB").disabled = seq.length < n;
  };
  draw();
  $("pool").onclick = e => { const b = e.target.closest(".nb"); if(!b || done) return; MK.unlock(); MK.sfx.tap(); seq.push(+b.dataset.i); draw(); };
  $("seq").onclick = e => { const b = e.target.closest(".nb"); if(!b || done) return; MK.sfx.tap(); seq.splice(+b.dataset.k, 1); draw(); };
  $("goB").onclick = () => {
    if(done || seq.length < n) return; MK.unlock(); tries++; const ok = seq.every((i, k) => c.nums[i] === c.sorted[k]);
    if(ok || tries >= 2){ done = true; draw(true); $("goB").hidden = true; note("", "&nbsp;"); close(ok, tries, c.why, c.sorted.map(f).join(c.asc ? " < " : " > ")); }
    else { draw(true); MK.sfx.bad(); note("warn", T.againOrd); setTimeout(() => { if(!done){ seq = []; draw(); } }, 1100); }
  };
}
function showRoute(){
  const c = cur; let pos = c.S, used = [], tries = 0, done = false, busy = false, log = [];
  stage.innerHTML = `<div class="card fade"><p class="txt">${T.routeQ(f(c.S), f(c.T), c.M, c.haz.length)}</p><div class="scn" id="scw">${scene({ R: c.R, drone: c.S, target: c.T, haz: c.haz })}</div>
    <div class="bar"><span>${T.cards}</span><span class="fuel" id="fuel"></span></div><div class="cards" id="cards"></div><div class="log" id="log"></div>
    <p class="note" id="note" role="status" aria-live="polite">&nbsp;</p><button type="button" class="mk-btn ghost rst" id="rstB" hidden>${T.resetBtn}</button></div><div id="flow"></div>`;
  const draw = sol => {
    $("rstB").hidden = done || !used.length;
    $("cards").innerHTML = c.cards.map((o, i) => `<button type="button" class="cd${used.includes(i) ? " used" : ""}${sol && c.sol.includes(i) ? " sol" : ""}" data-i="${i}">${opL(o)}</button>`).join("");
    $("fuel").innerHTML = T.fuel + ": " + Array.from({ length: c.M }, (_, i) => `<i${i < c.M - used.length ? "" : ' class="e"'}></i>`).join("");
    $("log").innerHTML = log.length ? log.map(s => `<span>${s}</span>`).join("") : T.logEmpty;
  };
  const step = async i => { const o = c.cards[i], nx = ap(pos, o); used.push(i); log.push(`${f(pos)} ${opL(o)} = ${f(nx)}`); draw(); await fly(nx, c.R); pos = nx; };
  const fail = async msg => {
    tries++; MK.sfx.bad();
    if(tries >= 3){
      done = true; note("warn", msg + " " + T.failEnd); await MK.wait(1100); used = []; log = []; pos = c.S; draw(); await fly(c.S, c.R);
      for(const i of c.sol) await step(i);
      draw(true); close(false, tries, { body: T.wRoute(log), more: T.wRouteMore[c.lv] });
    } else { note("warn", msg + T.retry(3 - tries)); await MK.wait(1300); used = []; log = []; pos = c.S; draw(); await fly(c.S, c.R); busy = false; }
  };
  draw();
  $("cards").onclick = async e => {
    const b = e.target.closest(".cd"); if(!b || done || busy) return; MK.unlock(); const i = +b.dataset.i, o = c.cards[i], nx = ap(pos, o);
    if(nx === null){ MK.sfx.bad(); return note("warn", T.notDiv(f(pos), p(o.v))); }
    if(Math.abs(nx) > c.R){ MK.sfx.bad(); return note("warn", T.outOf); }
    busy = true; note("", "&nbsp;"); await step(i);
    if(pos === c.T){
      done = true; first(tries === 0); award([10, 6, 3][tries]); MK.sfx.good(); note("good", T.win); draw();
      addWhy(true, { body: T.wRoute(log), more: T.wRouteMore[c.lv] }); nextBtn();
    } else if(c.haz.includes(pos)) await fail(T.hitHaz(f(pos)));
    else if(used.length >= c.M) await fail(T.noFuel);
    else if(!c.cards.some((q, k) => { const z = ap(pos, q); return !used.includes(k) && z !== null && Math.abs(z) <= c.R; })) await fail(T.dead);
    else busy = false;
  };
  $("rstB").onclick = () => { if(done || busy || !used.length) return; busy = true; fail(T.gaveUp); };
}
function finish(){
  const total = tasks.length, stars = MK.starsFor(okN, total); MK.best(GAME, LEVELS[L].id, stars);
  const g1 = gotN(solved()), gain = T.finds.slice(got0, g1);
  MK.result({ stars, title: `${okN} / ${total}`, text: T.res(okN, total, pts, gain),
    next: L < LEVELS.length - 1 ? () => start(L + 1) : null, again: () => start(L), menu: () => showMenu(gain.length ? got0 : null) });
}
Object.defineProperty(window, "__cur", { get: () => cur });
window.__MK_TEST = { LV, G, RC, genRoute, solve, ap, opL, T };
showMenu();
})();
</script>
