<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">

<meta name="description" content="Fizikos žaidimas: elektros grandinės, nuoseklusis ir lygiagretusis jungimas, Omo dėsnis ir gedimų paieška.">
<meta name="theme-color" content="#f6f8ee">
<link rel="icon" href="/logo/mk-ikona.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="/bendra/mk.js"></script>
<style>
/* Grandinės dirbtuvės: inžinieriaus sąsiuvinis 8 klasei. Viršuje schema, žemiau – užduotis ir pelėdžiuko paaiškinimas. */
body{--paper:#f6f8ee;--grid:#e1e7cf;--soft:#5a6147;--kid:"Unbounded","Arial Black",system-ui,sans-serif;--ac:#2b8a3e;--ac-ink:#fff;--ac-soft:#d3f9d8}
.mk-ico[data-k="music"]{display:none}
.mk-lvl{border-radius:12px;box-shadow:inset 0 0 0 2.5px var(--ink),5px 5px 0 var(--ink)}
.mk-lvl-art{border-radius:10px;font-size:22px}
.mk-lvl-t b{font-size:17px;letter-spacing:-.02em}
.mk-hero h1{letter-spacing:-.04em;font-size:clamp(30px,8vw,50px)}
.mk-btn{border-radius:12px;font-size:17px}
.mk-res{border-radius:16px;box-shadow:inset 0 0 0 3px var(--ink),8px 8px 0 var(--ink)}
.mk-res .mk-owl{display:none}
.mk-res h2{font-size:26px;letter-spacing:-.03em}
.mk-sec{font-size:16px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:baseline;gap:6px;padding:7px 12px;border-radius:10px;background:#fff;font:800 17px/1 var(--kid);box-shadow:inset 0 0 0 2.5px var(--ink),3px 3px 0 var(--ink)}
.chip small{font:800 11px/1 var(--body);color:var(--soft);letter-spacing:.06em;text-transform:uppercase}
.card{background:#fff;border-radius:14px;padding:14px 14px 16px;box-shadow:inset 0 0 0 3px var(--ink),6px 6px 0 var(--ink)}
.card>small{display:block;font:800 12px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ac)}
.sch{display:block;width:100%;max-height:300px;margin:8px 0 4px}
.sch .glow{animation:glow 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes glow{50%{opacity:.6}}
.mk-hero-art{width:min(420px,100%)}
.hero-card{background:#fff;border-radius:18px;padding:10px 14px 4px;box-shadow:inset 0 0 0 3px var(--ink),6px 6px 0 var(--ink);
  background-image:linear-gradient(#eef3e2 1px,transparent 1px),linear-gradient(90deg,#eef3e2 1px,transparent 1px);background-size:16px 16px}
.mk-lvl-art svg{width:44px;height:44px}
.lt-ic{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--ac-soft);flex:none}
.lt-ic svg{width:22px;height:22px}
.sch text{font:800 13px var(--body);fill:var(--ink)}
.sch .sw{cursor:pointer}

.task{font:700 clamp(17px,4.6vw,20px)/1.45 var(--body);margin-top:6px}
.task b{font-weight:800}
.task .ord{display:block;font:800 12px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:#1971c2;margin-bottom:2px}
.hint{color:var(--soft);font-size:14px;font-weight:700;margin-top:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opts button{min-height:56px;border:0;border-radius:10px;cursor:pointer;background:#fff;font:800 17px/1.2 var(--body);padding:8px;
  box-shadow:inset 0 0 0 2.5px var(--ink),4px 4px 0 var(--ink)}
.opts button:active{transform:translate(2px,2px);box-shadow:inset 0 0 0 2.5px var(--ink),2px 2px 0 var(--ink)}
.opts button.ok{background:#7ee08a}
.opts button.no{background:#ffb4a2}
.opts button:disabled{cursor:default}
.ansrow{display:flex;gap:10px;margin-top:14px}
.ansrow input{flex:1;min-width:0;height:54px;border-radius:10px;border:0;box-shadow:inset 0 0 0 2.5px var(--ink);padding:0 14px;font:800 21px/1 var(--kid);color:var(--ink);background:#fbfcf7}
.ansrow input:focus{outline:3px solid var(--ac);outline-offset:2px}
.ansrow .u{align-self:center;font:800 18px var(--kid)}
.check{width:100%;margin-top:12px}
.go{width:100%}
.note{max-width:520px;margin:14px auto 0;color:var(--soft);font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <section id="menu">
    <div class="mk-hero">
      <div class="mk-hero-art" id="heroArt"></div>
      <h1>Grandinės <em>dirbtuvės</em></h1>
      <p>Jungik jungiklius, uždek lemputes, skaičiuok srovę ir varžą, surask gedimą. Kiekviename lygyje grandinės vis sudėtingesnės.</p>
    </div>
    <div id="levels"></div>
    <div id="learn"></div>
    <p class="note">Schemose lemputės ir rezistoriai laikomi idealiais, o laidų varža – lygi nuliui. Rezultatai saugomi tik šiame įrenginyje.</p>
  </section>
  <section id="play" hidden>
    <div class="bar"><div id="dots"></div><span class="chip"><small>Taškai</small><span id="pts">0</span></span></div>
    <div id="board"></div>
    <div id="why"></div>
  </section>
</div>
<script>
(function(){
"use strict";
const GAME = "grandines-dirbtuves", GRADES = [8], N = 10, INK = "#121a33";
const R = MK.rnd, P = MK.pick;
const num = v => String(Math.round(v * 100) / 100).replace(".", ",");
const val = s => +String(s).trim().replace(/\s+/g, "").replace(",", ".");

/* ---------- grandinės modelis ----------
   grandinė – nuosekliai sujungtų elementų masyvas; elementas: { t:"L"|"S"|"R", id, v } arba { par: [[...], [...]] } (lygiagrečios šakos).
   Šakose gali būti dar vienas lygiagretus blokas (mišrusis jungimas). */
const L = n => ({ t: "L", id: "L" + n }), S = n => ({ t: "S", id: "J" + n }), Rz = (n, v) => ({ t: "R", id: "R" + n, v });
const Pr = (...b) => ({ par: b });
/* perjungiklis: blokas { par: [b0, b1], sel: "P1" } – srovė eina tik pasirinkta šaka (išjungtas = viršutinė, įjungtas = apatinė);
   laiptinės jungimas: { par: [b0, b1], sel: "P1", selR: "P2" } – grandinė uždara, kai abu perjungikliai rodo tą pačią šaką.
   "X" – nutrūkęs laidas (srovė nepraeina). */
const selIdx = (it, st) => { const a = st.sw[it.sel] ? 1 : 0; if(it.selR){ const b = st.sw[it.selR] ? 1 : 0; return a === b ? a : -1; } return a; };
const conducts = (items, st) => items.every(it => it.par ? (it.sel ? (k => k >= 0 && conducts(it.par[k], st))(selIdx(it, st)) : it.par.some(b => conducts(b, st))) : it.t === "X" ? false : it.t === "S" ? !!st.sw[it.id] : st.broken !== it.id);
function lightUp(items, st, lit){ for(const it of items){ if(it.par){ if(it.sel){ const k = selIdx(it, st); if(k >= 0 && conducts(it.par[k], st)) lightUp(it.par[k], st, lit); } else for(const b of it.par) if(conducts(b, st)) lightUp(b, st, lit); } else if(it.t === "L") lit.add(it.id); } }
function sels(items, o){ o = o || []; items.forEach(it => { if(it.par){ if(it.sel) o.push(it.sel); if(it.selR) o.push(it.selR); it.par.forEach(b => sels(b, o)); } }); return o; }
function litSet(main, st){ const lit = new Set(); if(conducts(main, st)) lightUp(main, st, lit); return lit; }
function walk(items, f){ for(const it of items){ if(it.par) it.par.forEach(b => walk(b, f)); else f(it); } }
const all = (main, t) => { const o = []; walk(main, c => c.t === t && o.push(c.id)); return o; };
function seqs(items, isMain, out){ out.push({ seq: items, main: isMain }); items.forEach(it => it.par && it.par.forEach(b => seqs(b, false, out))); return out; }
const seqOf = (main, id) => seqs(main, true, []).find(s => s.seq.some(c => c.id === id));
const list = ids => { ids = [...ids].sort((a, b) => a.localeCompare(b, "lt", { numeric: true })); return !ids.length ? "nė viena" : ids.length === 1 ? "tik " + ids[0] : ids.slice(0, -1).join(", ") + " ir " + ids[ids.length - 1]; };
const cap = s => s[0].toUpperCase() + s.slice(1);
const keyOf = items => items.map(it => it.par ? (it.sel ? "<" : "") + (it.selR ? ">" : "") + "(" + (it.sel ? it.par.map(keyOf) : it.par.map(keyOf).sort()).join("|") + ")" : it.t).join("");

/* ---------- schemos piešimas ---------- */
const CW = 66, BR = 66, TOP = 40;
const W = (x1, y1, x2, y2) => `<path d="M${x1} ${y1}L${x2} ${y2}" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`;
const padL = it => it.sel ? 46 : 20, padR = it => it.selR ? 46 : 20;
function sz(items){ let w = 0, h = 1; for(const it of items){ if(it.par){ const s = it.par.map(sz); w += Math.max(30, ...s.map(q => q.w)) + padL(it) + padR(it); h = Math.max(h, s.reduce((a, q) => a + q.h, 0)); } else w += CW; } return { w, h }; }
function comp(it, x, y, st){
  const cx = x + CW / 2; let g = "";
  if(it.t === "L"){
    const on = st.lit.has(it.id), br = st.show && st.broken === it.id;
    g += W(x, y, cx - 14, y) + W(cx + 14, y, x + CW, y);
    if(on) g += `<g class="glow"><circle cx="${cx}" cy="${y}" r="25" fill="#ffe066" opacity=".5"/>${[0, 45, 90, 135, 180, 225, 270, 315].map(a => { const c = Math.cos(a * Math.PI / 180), s = Math.sin(a * Math.PI / 180); return `<path d="M${cx + c * 19} ${y + s * 19}L${cx + c * 26} ${y + s * 26}" stroke="#f59f00" stroke-width="2.5" stroke-linecap="round"/>`; }).join("")}</g>`;
    g += `<circle cx="${cx}" cy="${y}" r="14" fill="${on ? "#fff3a8" : br ? "#e9ecef" : "#fff"}" stroke="${INK}" stroke-width="3"/>
      <path d="M${cx - 10} ${y - 10}L${cx + 10} ${y + 10}M${cx + 10} ${y - 10}L${cx - 10} ${y + 10}" stroke="${INK}" stroke-width="2.5"/>`;
    if(br) g += `<path d="M${cx - 6} ${y - 28}l5 7-4 3 6 8" fill="none" stroke="#e03131" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
    g += `<text x="${cx}" y="${y - 22}" text-anchor="middle">${it.id}${br ? " ✗" : ""}</text>`;
  } else if(it.t === "X"){
    g += W(x, y, cx - 11, y) + W(cx + 11, y, x + CW, y) + `<circle cx="${cx - 11}" cy="${y}" r="3.5" fill="#fff" stroke="${INK}" stroke-width="2.5"/><circle cx="${cx + 11}" cy="${y}" r="3.5" fill="#fff" stroke="${INK}" stroke-width="2.5"/>
      <path d="M${cx - 4} ${y - 9}l8 18" stroke="#e03131" stroke-width="2.5" stroke-linecap="round"/>`;
  } else if(it.t === "R"){
    g += W(x, y, cx - 18, y) + W(cx + 18, y, x + CW, y) + `<rect x="${cx - 18}" y="${y - 8}" width="36" height="16" fill="#fff" stroke="${INK}" stroke-width="3"/>
      <text x="${cx}" y="${y - 16}" text-anchor="middle">${it.id}${it.v != null ? " = " + it.v + " Ω" : ""}</text>`;
  } else {
    const on = !!st.sw[it.id];
    g += `<g class="sw" data-id="${it.id}" role="button" aria-label="Jungiklis ${it.id}: ${on ? "įjungtas" : "išjungtas"}"><rect class="hit" x="${x}" y="${y - 36}" width="${CW}" height="56" rx="8" fill="transparent"/>`
      + W(x, y, cx - 14, y) + W(cx + 14, y, x + CW, y)
      + `<path d="M${cx - 14} ${y}L${on ? cx + 14 : cx + 10} ${on ? y : y - 18}" stroke="${on ? "#2b8a3e" : INK}" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="${cx - 14}" cy="${y}" r="4" fill="#fff" stroke="${INK}" stroke-width="2.5"/><circle cx="${cx + 14}" cy="${y}" r="4" fill="#fff" stroke="${INK}" stroke-width="2.5"/>
      <text x="${cx}" y="${y - 26}" text-anchor="middle">${it.id}</text></g>`;
  }
  return g;
}
function series(items, x, y, st){
  let g = "";
  for(const it of items){
    if(it.par){
      const s = it.par.map(sz), inner = Math.max(30, ...s.map(q => q.w)), bw = inner + padL(it) + padR(it), xl = x + padL(it), xr = xl + inner, ys = [];
      let yy = y;
      it.par.forEach((b, k) => { ys.push(yy); g += series(b, xl, yy, st) + W(xl + s[k].w, yy, xr, yy); yy += s[k].h * BR; });
      const yl = ys[ys.length - 1];
      if(it.sel) g += selSw(it.sel, x, xl, y, ys, false, st);
      else { g += W(x, y, xl, y) + W(xl, y, xl, yl); ys.slice(0, -1).forEach(v => { g += `<circle cx="${xl}" cy="${v}" r="4.5" fill="${INK}"/>`; }); }
      if(it.selR) g += selSw(it.selR, x + bw, xr, y, ys, true, st);
      else { g += W(xr, y, x + bw, y) + W(xr, y, xr, yl); ys.slice(0, -1).forEach(v => { g += `<circle cx="${xr}" cy="${v}" r="4.5" fill="${INK}"/>`; }); }
      x += bw;
    } else { g += comp(it, x, y, st); x += CW; }
  }
  return g;
}
/* perjungiklio piešinys: ašis ant pagrindinės linijos, du kontaktai – prie šakų */
function selSw(id, xe, xc, y, ys, right, st){
  const k = st.sw[id] ? 1 : 0, px = right ? xe - 9 : xe + 9, d = right ? 1 : -1;
  let g = `<g class="sw" data-id="${id}" role="button" aria-label="Perjungiklis ${id}: ${k ? "apatinė" : "viršutinė"} padėtis">`
    + `<rect class="hit" x="${Math.min(xe, xc) - 4}" y="${y - 30}" width="${Math.abs(xc - xe) + 8}" height="${ys[1] - y + 46}" rx="8" fill="transparent"/>`
    + W(xe, y, px, y) + ys.map(v => `<circle cx="${xc + d * 2}" cy="${v}" r="4" fill="#fff" stroke="${INK}" stroke-width="2.5"/>`).join("")
    + `<path d="M${px} ${y}L${xc + d * 6} ${ys[k]}" stroke="#1971c2" stroke-width="3.8" stroke-linecap="round"/><circle cx="${px}" cy="${y}" r="4.5" fill="#1971c2"/>`
    + `<text x="${right ? px - 4 : px + 4}" y="${y - 12}" text-anchor="${right ? "end" : "start"}" style="fill:#1971c2">${id}</text></g>`;
  return g;
}
function schema(main, st){
  st.lit = st.hide ? new Set() : litSet(main, st);
  const s = sz(main), x0 = 50, xe = x0 + s.w, yb = TOP + (s.h - 1) * BR + 52, mid = (TOP + yb) / 2, bx = 22, wd = xe + 22;
  let g = W(bx, TOP, x0, TOP) + series(main, x0, TOP, st) + W(xe, TOP, wd - 4, TOP) + W(wd - 4, TOP, wd - 4, yb) + W(wd - 4, yb, bx, yb)
    + W(bx, TOP, bx, mid - 6) + W(bx, mid + 6, bx, yb)
    + `<path d="M${bx - 14} ${mid - 6}h28" stroke="${INK}" stroke-width="3.5"/><path d="M${bx - 7} ${mid + 6}h14" stroke="${INK}" stroke-width="6"/>
       <text x="${bx + 13}" y="${mid - 9}" font-size="14">+</text><text x="${bx + 13}" y="${mid + 20}" font-size="14">−</text>`;
  if(st.U != null) g += `<text x="${(bx + wd) / 2}" y="${yb + 22}" text-anchor="middle">U = ${num(st.U)} V${st.I != null ? ` · I = ${num(st.I)} A` : ""}</text>`;
  return `<svg class="sch" viewBox="0 0 ${wd + 4} ${yb + (st.U != null ? 32 : 12)}" role="img" aria-label="Elektros grandinės schema">${g}</svg>`;
}

/* ---------- atsitiktinės grandinės ----------
   Sudaroma iš nuoseklių dalių ir lygiagrečių blokų (šakose gali būti dar vienas blokas). Sudėtingumas – pakopa 0, 1, 2. */
const CFG = [
  { minL: 2, maxL: 4, units: 2, pPar: .55, maxBr: 2, nest: 0, maxW: 320, maxH: 2 },
  { minL: 3, maxL: 5, units: 3, pPar: .6, maxBr: 3, nest: .25, maxW: 380, maxH: 3 },
  { minL: 4, maxL: 7, units: 3, pPar: .65, maxBr: 3, nest: .5, maxW: 440, maxH: 4 }
];
const E = () => ({ t: "L" });
function branch(c, depth){
  const n = R(1, 2), b = [];
  for(let i = 0; i < n; i++) b.push(depth < 2 && Math.random() < c.nest ? parBlock(c, 2) : E());
  if(!b.some(x => !x.par)) b.push(E());
  return MK.shuffle(b);
}
const parBlock = (c, depth) => ({ par: Array.from({ length: R(2, depth === 1 ? c.maxBr : 2) }, () => branch(c, depth)) });
function randTree(tier, needPar){
  const c = CFG[tier];
  for(let t = 0; t < 800; t++){
    const main = Array.from({ length: R(1, c.units) }, () => Math.random() < c.pPar ? parBlock(c, 1) : E());
    let n = 0; walk(main, () => n++);
    if(n < c.minL || n > c.maxL) continue;
    if(needPar !== false && !main.some(it => it.par)) { if(needPar || tier > 0 || Math.random() < .6) continue; }
    const s = sz(main); if(s.w > c.maxW || s.h > c.maxH) continue;
    return main;
  }
  return [E(), Pr([E()], [E()])];
}
function numberAll(main){ const k = { L: 0, S: 0, R: 0 }; walk(main, c => { k[c.t]++; c.id = (c.t === "S" ? "J" : c.t) + k[c.t]; }); return main; }
function addSwitches(main, n){
  const ss = MK.shuffle(seqs(main, true, [])).slice(0, n);
  ss.forEach(s => s.seq.splice(R(0, s.seq.length), 0, { t: "S" }));
  return ss.length;
}
function swSets(main){ const ids = all(main, "S"); return Array.from({ length: 1 << ids.length }, (_, m) => { const sw = {}; ids.forEach((id, i) => sw[id] = !!(m >> i & 1)); return sw; }); }
const setKey = s => [...s].sort().join(",");

/* kartojimosi vengimas: įsimenamos neseniai matytos schemos (tik šiame įrenginyje) */
const SEENK = "mk-grandines-dirbtuves-matyta";
let seen = MK.get(SEENK, {}); if(typeof seen !== "object" || !seen) seen = {};
function fresh(lv, fn){
  const arr = seen[lv] || (seen[lv] = []);
  let t, k;
  for(let i = 0; i < 60; i++){ t = fn(); k = t.key; if(!arr.includes(k)) break; }
  arr.push(k); if(arr.length > 150) arr.splice(0, arr.length - 150); MK.set(SEENK, seen);
  return t;
}
function litChoices(correct, pool){
  const out = [], ks = new Set(), add = s => { const k = setKey(s); if(!ks.has(k) && out.length < 4){ ks.add(k); out.push([...s]); } };
  const tog = (s, l) => { const n = new Set(s); n.has(l) ? n.delete(l) : n.add(l); return n; };
  add(correct);
  MK.shuffle(pool).forEach(l => add(tog(correct, l)));
  add(pool); add([]);
  MK.shuffle(pool).forEach(l => add(tog(tog(correct, l), P(pool))));
  const ck = setKey(correct);
  return MK.shuffle(out).map(s => ({ label: cap(list(s)), ok: setKey(s) === ck }));
}

/* ---------- 1. Uždek lemputę ----------
   Jungikliai J, perjungikliai P (taip pat laiptinės pora), apgaulingos lemputės nutrūkusioje šakoje.
   Tikslas niekada nepasiekiamas paprasčiausiai įjungus visus jungiklius; 2–3 užsakymai toje pačioje schemoje. */
function numberSel(main){ let n = 0; (function f(items){ items.forEach(it => { if(it.par){ if(it.sel) it.sel = "P" + (++n); if(it.selR) it.selR = "P" + (++n); it.par.forEach(f); } }); })(main); }
function blocksOf(main){ const o = []; (function f(items){ items.forEach(it => { if(it.par){ o.push(it); it.par.forEach(f); } }); })(main); return o; }
function solTxt(sw, J, Ps){
  const on = J.filter(id => sw[id]);
  return (on.length ? `įjungti ${list(on).replace("tik ", "")}` : "neįjungti nė vieno jungiklio") + (Ps.length ? "; " + Ps.map(id => `${id} – ${sw[id] ? "apatinė" : "viršutinė"} padėtis`).join(", ") : "");
}
function genSwitch(tier){
  const nG = [1, 2, 3][tier];
  return fresh("sw2-" + tier, () => {
    for(;;){
      const main = randTree(tier, tier > 0), blocks = blocksOf(main);
      const two = blocks.filter(x => x.par.length === 2);
      if(two.length && Math.random() < [.45, .6, .7][tier]) P(two).sel = true;
      if(tier > 0 && Math.random() < .35) main.splice(R(0, main.length), 0, { par: [[], []], sel: true, selR: true });
      addSwitches(main, [R(1, 2), R(2, 3), R(2, 4)][tier]);
      if(tier > 0 && Math.random() < .45){
        const nb = blocks.filter(x => !x.sel);
        if(nb.length){ const br = [E()]; if(Math.random() < .5) br.push({ t: "S" }); br.splice(R(0, br.length), 0, { t: "X" }); P(nb).par.push(br); }
      }
      numberAll(main); numberSel(main);
      const zs = sz(main); if(zs.w > 430 || zs.h > 5) continue;

        const main = [Rz(1, r1), Pr([Rz(2, r2)], [Rz(3, r3)]), Rz(4, r4)];
        return { key: "w:" + [r1, r2, r3, r4, i].join(","), kind: "num", main, st: { sw: {}, U: u }, q: "Kokio stiprumo srovė teka per šaltinį?", unit: "A", ans: i,
          ex: `<span class="mk-ex">R23 = ${r2} · ${r3} / (${r2} + ${r3}) = ${num(rp)} Ω</span> Kitos dalys sujungtos nuosekliai: <span class="mk-ex">R = ${r1} + ${num(rp)} + ${r4} = ${num(rt)} Ω</span> <span class="mk-ex">I = U / R = ${num(u)} / ${num(rt)} = ${num(i)} A</span>` };
      }
      /* (R1 + R2) ∥ R3 */
      const [a, r3, rp] = P(PAIRS); if(a < 3) continue;
      const r1 = R(1, a - 1), r2 = a - r1, main = [Pr([Rz(1, r1), Rz(2, r2)], [Rz(3, r3)])], key = "n" + k + ":" + [r1, r2, r3].join(",");
      const fx = `Viršutinė šaka – nuoseklioji: <span class="mk-ex">R12 = ${r1} + ${r2} = ${a} Ω</span> Ji lygiagreti su R3: <span class="mk-ex">R = ${a} · ${r3} / (${a} + ${r3}) = ${num(rp)} Ω</span>`;
      if(k === 4) return { key, kind: "num", main, st: { sw: {} }, q: "Kokia visos grandinės varža?", unit: "Ω", ans: rp, ex: fx };
      const us = [1, 2, 3, 4, 6, 12].map(m => a * m).filter(u => u <= 60 && nice(u / r3)); if(!us.length) continue;
      const u = P(us);
      return { key: key + ":" + u, kind: "num", main, st: { sw: {}, U: u }, q: "Kokia įtampa rezistoriuje R1?", unit: "V", ans: u / a * r1,
        ex: `Abiejų šakų įtampa lygi šaltinio įtampai ${u} V. Šakoje R1 ir R2 sujungti nuosekliai: <span class="mk-ex">I12 = ${u} / (${r1} + ${r2}) = ${num(u / a)} A</span> <span class="mk-ex">U1 = I12 · R1 = ${num(u / a)} · ${r1} = ${num(u / a * r1)} V</span>` };
    }
  });
}

/* ---------- 6. Rask gedimą ---------- */
function genFault(tier){
  return fresh("fault" + tier, () => {
    for(;;){
      const main = numberAll(randTree(tier ? 2 : 1, true)), lamps = all(main, "L"); if(lamps.length < 3) continue;
      const kb = b => setKey(litSet(main, { sw: {}, broken: b }));
      const uniq = lamps.filter(b => lamps.filter(c => kb(c) === kb(b)).length === 1);
      if(!uniq.length) continue;
      const b = P(uniq), lit = litSet(main, { sw: {}, broken: b }), s = seqOf(main, b), dark = lamps.filter(l => !lit.has(l));
      return { key: keyOf(main) + ":" + b, kind: "opt", main, st: { sw: {}, broken: b }, q: `Viena lemputė perdegė. Dega: <b>${list(lit)}</b>. Kuri lemputė sugedo?`,
        choices: MK.shuffle(lamps).map(l => ({ label: l, ok: l === b })),
        ex: (s.main ? `Nedega nė viena lemputė – nutrūko vieta, per kurią teka visa srovė. Tokia yra tik ${b}: ji sujungta nuosekliai su visa grandine.`
                    : `Nedega ${list(dark).replace("tik ", "")}. Tai lemputės, per kurias srovė teka tik ta šaka, kurioje yra ${b}.`)
          + ` Jei būtų perdegusi kita lemputė, užgestų kitos, todėl atsakymas vienas: <b>${b}</b>.` };
    }
  });
}
const I = {

  mix: `<svg viewBox="0 0 44 44"><path d="M2 22h4M14 22h4M38 22h4M18 12v20M38 12v20M18 12h4M32 12h6M18 32h4M32 32h6" fill="none" stroke="${INK}" stroke-width="2.5"/><rect x="6" y="18" width="8" height="8" fill="#fff" stroke="${INK}" stroke-width="2.2"/><rect x="22" y="8" width="10" height="8" fill="#fff" stroke="${INK}" stroke-width="2.2"/><rect x="22" y="28" width="10" height="8" fill="#fff" stroke="${INK}" stroke-width="2.2"/><circle cx="18" cy="22" r="2.6" fill="${INK}"/><circle cx="38" cy="22" r="2.6" fill="${INK}"/></svg>`,
  bat: `<svg viewBox="0 0 44 44"><rect x="8" y="12" width="26" height="20" rx="4" fill="#fff" stroke="${INK}" stroke-width="2.5"/><rect x="34" y="18" width="4" height="8" fill="${INK}"/><path d="M13 22h6M16 19v6M24 22h5" stroke="${INK}" stroke-width="2.5"/></svg>`
};
const lt = (ic, t) => `<span class="lt-ic">${I[ic]}</span>${t}`;
const LEVELS = [
  { id: "jungikliai", name: "Uždek lemputę", sub: "Jungikliai, perjungikliai ir apgaulingos šakos", art: I.bulb, gen: genSwitch },
  { id: "jungimas", name: "Nuoseklusis ar lygiagretusis", sub: "Jungimo būdas, perdegusi lemputė, jungikliai", art: I.series, gen: genSeries },
  { id: "omas", name: "Omo dėsnis", sub: "I = U / R · nuoseklusis jungimas", art: I.ohm, gen: genOhm },
  { id: "lygiagretus", name: "Lygiagretusis jungimas", sub: "Bendra varža ir šakų srovės", art: I.par, gen: genPar },
  { id: "misrus", name: "Mišrusis jungimas", sub: "Nuoseklioji ir lygiagrečioji dalys kartu", art: I.mix, gen: genMix },
  { id: "gedimas", name: "Rask gedimą", sub: "Kuri lemputė perdegė?", art: I.fault, gen: genFault }
];
const LEARN = [
  { name: lt("bat", "Elektros grandinė"), level: 0, html: `<p>Srovė teka tik <b>uždara</b> grandine: nuo šaltinio per laidus ir prietaisus atgal į šaltinį.</p><p><b>Jungiklis</b> uždaro arba nutraukia grandinę. Išjungtas jungiklis – tai tarsi nutrūkęs laidas.</p><span class="mk-ex">Schemoje: ⊗ – lemputė, ▭ – rezistorius, ilgas ir trumpas brūkšniai – šaltinis.</span>` },
  { name: lt("bulb", "Jungiklis ir perjungiklis"), level: 0, html: `<p><b>Jungiklis</b> (J) grandinę uždaro arba nutraukia.</p><p><b>Perjungiklis</b> (P) turi dvi padėtis: srovė eina <b>tik viena</b> iš dviejų šakų – įjungus vieną, kita atjungiama.</p><p>Du perjungikliai, sujungti dviem laidais, valdo lemputę iš dviejų vietų (kaip laiptinėje): lemputė dega, kai abu rodo į tą patį laidą.</p><span class="mk-ex">Tarpas laide su raudonu brūkšniu – nutrūkęs laidas: ta šaka niekada nepraleidžia srovės.</span>` },
  { name: lt("series", "Nuoseklusis jungimas"), level: 1, html: `<p>Prietaisai sujungti <b>viena paskui kitą</b>, srovė teka vienu keliu.</p><ul><li>Srovė visur ta pati: I = I1 = I2</li><li>Įtampos sudedamos: U = U1 + U2</li><li>Varžos sudedamos: R = R1 + R2</li></ul><p>Nutrūkus vienai vietai, nedega visos lemputės.</p>` },
  { name: lt("par", "Lygiagretusis jungimas"), level: 3, html: `<p>Prietaisai sujungti <b>atskiromis šakomis</b> tarp tų pačių dviejų taškų.</p><ul><li>Įtampa visose šakose ta pati: U = U1 = U2</li><li>Srovės sudedamos: I = I1 + I2</li><li>1/R = 1/R1 + 1/R2, dviem rezistoriams R = R1·R2 / (R1 + R2)</li></ul><p>Nutrūkus vienai šakai, kitos veikia. Taip sujungti prietaisai namuose.</p>` },
  { name: lt("ohm", "Omo dėsnis"), level: 2, html: `<p>Srovės stipris tiesiogiai proporcingas įtampai ir atvirkščiai proporcingas varžai:</p><span class="mk-ex">I = U / R</span><p>Iš jo: U = I · R ir R = U / I. Vienetai: srovė – amperai (A), įtampa – voltai (V), varža – omai (Ω).</p><span class="mk-ex">Pvz.: U = 12 V, R = 4 Ω → I = 12 / 4 = 3 A</span>` },
  { name: lt("mix", "Mišrusis jungimas"), level: 4, html: `<p>Grandinėje yra ir nuosekliai, ir lygiagrečiai sujungtų dalių.</p><ul><li>Pirmiausia apskaičiuok kiekvienos lygiagrečiosios dalies varžą (dviem: R = R1·R2 / (R1 + R2)).</li><li>Tada ją sudėk su nuosekliai prijungtomis varžomis.</li><li>Iš bendros varžos rask srovę, o tada – kiekvienos dalies įtampą ir šakų sroves.</li></ul><span class="mk-ex">Pvz.: R1 = 4 Ω ir (6 Ω ∥ 3 Ω = 2 Ω) → R = 6 Ω</span>` },
  { name: lt("fault", "Kaip ieškoti gedimo"), level: 5, html: `<p>Pažiūrėk, kurios lemputės <b>dega</b>. Jei nedega niekas – nutrūko vieta, per kurią teka visa srovė (nuoseklioji dalis).</p><p>Jei nedega tik vienos šakos lemputės – gedimas toje šakoje.</p>` }
];

const $ = id => document.getElementById(id);
const app = $("app"), menu = $("menu"), play = $("play"), board = $("board");
const saved = MK.get("mokomeskartu-klase", 0);
app.prepend(MK.top({ title: "Grandinės dirbtuvės", grade: GRADES.includes(saved) ? saved : GRADES[0] }));
$("heroArt").innerHTML = `<div class="hero-card">${schema([S(1), L(1), Pr([L(2)], [Rz(1, 6)])], { sw: { J1: true }, U: 12 })}</div>`;
const taskai = n => n % 10 === 1 && n % 100 !== 11 ? "taškas" : n % 10 >= 2 && (n % 100 < 10 || n % 100 > 20) ? "taškai" : "taškų";

let lvl = 0, Lv = null, ti = 0, cur = null, pts = 0, okN = 0, dots = null, answered = false;
function showMenu(){ play.hidden = true; menu.hidden = false; MK.levels($("levels"), { game: GAME, levels: LEVELS, onPick: start }); MK.learn($("learn"), { topics: LEARN, onPlay: start }); window.scrollTo(0, 0); }
function start(i){
  lvl = i; Lv = LEVELS[i]; ti = 0; pts = 0; okN = 0; $("pts").textContent = 0;
  menu.hidden = true; play.hidden = false; dots = MK.dots($("dots"), N); next();
}
function draw(){
  const c = cur;
  const ans = c.kind === "sw" ? `<button type="button" class="mk-btn check" id="chk">Tikrinti</button>`
    : c.kind === "opt" ? `<div class="opts">${c.choices.map((o, k) => `<button type="button" data-k="${k}">${o.label}</button>`).join("")}</div>`
    : `<form class="ansrow" id="f" autocomplete="off"><input id="inp" inputmode="decimal" enterkeyhint="done" placeholder="Atsakymas" aria-label="Atsakymas"><span class="u">${c.unit}</span><button class="mk-btn" type="submit">Tikrinti</button></form>`;
  board.innerHTML = `<div class="card"><small>${ti + 1} / ${N} · ${Lv.name}</small><div id="sch">${schema(c.main, c.st)}</div><div class="task">${c.kind === "sw" ? swQ(c) : c.q}</div>${c.hint ? `<div class="hint">${c.hint}</div>` : ""}${ans}</div>`;
}
function next(){
  $("why").innerHTML = "";
  if(ti >= N) return finish();
  cur = Lv.gen(ti < 3 ? 0 : ti < 7 ? 1 : 2); answered = false; dots.cur(ti); draw(); window.scrollTo(0, 0);
}
function result(ok, extra){
  answered = true; dots.mark(ti, ok);
  if(ok){ okN++; pts += 10; MK.sfx.good(); } else MK.sfx.bad();
  $("pts").textContent = pts;
  $("why").innerHTML = MK.why({ ok, head: ok ? MK.praise() + " +10" : "Neteisingai." + (extra ? " " + extra : ""), more: cur.ex, open: !ok })
    + `<button type="button" class="mk-btn go" id="go">${ti < N - 1 ? "Toliau →" : "Rezultatai"}</button>`;
  $("go").scrollIntoView({ block: "nearest", behavior: "smooth" });
}
board.addEventListener("click", e => {
  MK.unlock();
  const sw = e.target.closest(".sw");
  if(sw && !answered && cur.kind === "sw"){ const id = sw.dataset.id; cur.st.sw[id] = !cur.st.sw[id]; MK.sfx.tap(); $("sch").innerHTML = schema(cur.main, cur.st); return; }
  if(e.target.closest("#chk") && !answered){
    const g = cur.goals[cur.gi], lit = litSet(cur.main, cur.st), ok = setKey(lit) === g.key, onN = cur.J.filter(id => cur.st.sw[id]).length, eco = ok && onN === g.min;
    const last = cur.gi === cur.goals.length - 1;
    $("chk").disabled = true; answered = true; if(!ok) cur.allOk = false;
    if(ok){ pts += 10 + (eco ? 5 : 0); MK.sfx.good(); } else MK.sfx.bad();
    if(last){ dots.mark(ti, cur.allOk); if(cur.allOk) okN++; }
    $("pts").textContent = pts;
    if(!ok){ cur.st.sw = Object.assign({}, g.best); $("sch").innerHTML = schema(cur.main, cur.st); }
    $("why").innerHTML = MK.why({ ok, head: ok ? MK.praise() + " +10" + (eco ? " · taupiai +5" : "") : `Neteisingai. Degė: ${list(lit)}. Schemoje parodytas teisingas sprendimas.`,
        more: g.ex + (ok && !eco ? ` Tavo sprendimas teisingas, bet įjungta ${onN} – užtenka ${g.min}.` : ""), open: !ok || !eco })
      + `<button type="button" class="mk-btn go" id="${last ? "go" : "go2"}">${last ? (ti < N - 1 ? "Toliau →" : "Rezultatai") : "Kitas užsakymas →"}</button>`;
    return $(last ? "go" : "go2").scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
  const b = e.target.closest(".opts button");
  if(b && !answered){
    const o = cur.choices[+b.dataset.k];
    if(cur.st.hide){ cur.st.hide = false; $("sch").innerHTML = schema(cur.main, cur.st); }
    board.querySelectorAll(".opts button").forEach((x, k) => { x.disabled = true; if(cur.choices[k].ok) x.classList.add("ok"); else if(x === b) x.classList.add("no"); });
    return result(o.ok);
  }
});
board.addEventListener("submit", e => {
  e.preventDefault(); if(answered) return;
  const raw = $("inp").value; if(!raw.trim()) return;
  const v = val(raw), ok = Math.abs(v - cur.ans) < 0.011;
  $("inp").readOnly = true; $("f").querySelector("button").disabled = true;
  result(ok, ok ? "" : `Teisingas atsakymas: <b>${num(cur.ans)} ${cur.unit}</b>.`);
});
$("why").addEventListener("click", e => { if(e.target.closest("#go")){ ti++; next(); } else if(e.target.closest("#go2")){ cur.gi++; answered = false; $("why").innerHTML = ""; draw(); board.scrollIntoView({ block: "start", behavior: "smooth" }); } });
function finish(){
  const stars = MK.starsFor(okN, N); MK.best(GAME, Lv.id, stars);
  MK.result({ stars, title: `${okN} iš ${N}`, text: `${pts} ${taskai(pts)}.`,
    next: lvl < LEVELS.length - 1 ? () => start(lvl + 1) : null, again: () => start(lvl), menu: showMenu });
}
window.__GD = { LEVELS, litSet, all, keyOf, sz, PAIRS, TRIPLES, schema };
showMenu();
})();
