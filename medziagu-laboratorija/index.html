<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Medžiagų laboratorija – MokomėsKartu.lt</title>
<meta name="description" content="Gamtos mokslų žaidimas 3–4 klasėms: medžiagų būsenos, vandens apytakos ratas, tirpumas, mišinių atskyrimas ir medžiagų kitimai.">
<meta name="theme-color" content="#eef8f6">
<link rel="icon" href="/logo/mk-ikona.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;800&family=Manrope:wght@600;700;800&display=swap">
<script src="/bendra/mk.js"></script>
<script src="tekstai.lt.js"></script>
<style>
/* Medžiagų laboratorija: laboratorijos stalas – šildyk, šaldyk, tirpink, atskirk. */
body{--paper:#eef8f6;--grid:#d5ece7;--soft:#45615c;--ac:#0f9b8e;--ac-ink:#fff;--ac-soft:#d3f3ee;--heat:#ff7a2f;--cold:#3c8ff0}
.mk-hero-art{width:min(440px,100%)}
.hero-card{background:#fff;border-radius:24px;padding:6px;box-shadow:inset 0 0 0 3px var(--ink),0 6px 0 rgba(18,26,51,.18)}
.hero-card svg{display:block;width:100%;height:auto;border-radius:19px}
.mk-lvl-art{background:#e2f6f2}
.note{max-width:520px;margin:14px auto 0;color:var(--soft);font-size:13px;text-align:center}
/* lentyna */
.shelf{max-width:520px;margin:0 auto}
.stick{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;padding:12px;background:#fff;border-radius:20px;box-shadow:inset 0 0 0 2.5px var(--ink)}
.stick span{display:grid;place-items:center;aspect-ratio:1;border-radius:14px;background:#f2fbf9;box-shadow:inset 0 0 0 2px #bfe3dc}
.stick span.on{background:#fff;box-shadow:inset 0 0 0 2px var(--ink),0 3px 0 rgba(18,26,51,.15)}
.stick svg{width:82%;height:82%;display:block}
.stick span:not(.on) svg{opacity:.18;filter:grayscale(1)}
.stext{margin:8px 0 0;font:700 14px/1.4 var(--body);color:var(--soft)}
/* žaidimas */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:baseline;gap:6px;padding:7px 14px;border-radius:999px;background:#fff;font:800 18px/1 var(--kid);box-shadow:inset 0 0 0 2.5px var(--ink)}
.chip small{font:800 11px/1 var(--body);color:var(--soft);letter-spacing:.06em;text-transform:uppercase}
.card{background:#fff;border-radius:24px;padding:12px 12px 16px;box-shadow:inset 0 0 0 3px var(--ink),0 6px 0 rgba(18,26,51,.16)}
.card>small{display:block;font:800 12px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ac);margin:2px 4px 6px}
.scene{border-radius:18px;background:#f4fbfa;box-shadow:inset 0 0 0 2px #bfe3dc;overflow:hidden}
.scene svg{display:block;width:100%;height:auto}
.q{font:800 clamp(18px,5vw,22px)/1.3 var(--kid);margin:12px 4px 4px;text-align:center}
.q b{color:var(--ac)}
.hint{margin:4px 4px 0;text-align:center;font:700 14px/1.35 var(--body);color:var(--soft)}
.ans{display:grid;gap:10px;margin-top:12px}
.ans.c2{grid-template-columns:1fr 1fr}.ans.c3{grid-template-columns:repeat(3,1fr)}
.ab{display:grid;justify-items:center;align-content:center;gap:4px;min-height:60px;padding:10px 8px;border:0;border-radius:18px;background:#fff;cursor:pointer;
  box-shadow:inset 0 0 0 2.5px var(--ink),0 5px 0 rgba(18,26,51,.2);font:800 16px/1.2 var(--kid);color:var(--ink);text-align:center;touch-action:manipulation;transition:transform .1s}
.ab:active{transform:translateY(3px)}
.ab svg{width:40px;height:40px;display:block}
.ab.heat{background:#fff0e5}.ab.cold{background:#e7f1ff}
.ab.ok{background:#c9f2db;box-shadow:inset 0 0 0 3px var(--good),0 5px 0 rgba(18,26,51,.2)}
.ab.no{background:#ffe3dc;box-shadow:inset 0 0 0 3px var(--bad),0 5px 0 rgba(18,26,51,.2);opacity:.7}
.ab:disabled{cursor:default}
.ab small{font:700 12.5px/1.2 var(--body);color:var(--soft)}
.log{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px}
.log span{font:800 13px/1 var(--body);padding:6px 10px;border-radius:999px;background:var(--ac-soft);box-shadow:inset 0 0 0 2px var(--ac)}
.log span.x{background:#fff2e8;box-shadow:inset 0 0 0 2px #f0a060}
.cyc{display:grid;gap:8px;margin-top:12px}
.cyc .ab{grid-template-columns:44px 1fr;justify-items:start;text-align:left;font:700 15px/1.3 var(--body);min-height:56px}
.cyc .ab b{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--ac-soft);font:800 18px/1 var(--kid);box-shadow:inset 0 0 0 2px var(--ac)}
.cyc .ab.ok b{background:var(--good);color:#fff;box-shadow:none}
.piles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.pile{display:grid;justify-items:center;gap:2px;padding:6px 8px 8px;border-radius:14px;background:#f4fbfa;box-shadow:inset 0 0 0 2px var(--ac);font:800 12px/1.15 var(--body);max-width:110px;text-align:center;animation:mkPop .4s cubic-bezier(.2,1.6,.4,1)}
.pile svg{width:44px;height:44px}
.go{width:100%;margin-top:4px}
.mk-why{font-size:15px}
.flame{animation:fl .5s infinite alternate;transform-origin:50% 100%;transform-box:fill-box}
@keyframes fl{to{transform:scaleY(1.15) scaleX(.92)}}
.rise{animation:rise 1.6s infinite}
@keyframes rise{0%{transform:translateY(6px);opacity:0}40%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
.fade{animation:fd 1.4s forwards}
@keyframes fd{to{opacity:0;transform:scale(.4)}}
.sink{animation:sk 1.4s forwards}
@keyframes sk{to{transform:translateY(34px)}}
@media (max-width:370px){.ab{font-size:14.5px;padding:8px 6px}.ab svg{width:34px;height:34px}}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <section id="menu">
    <div class="mk-hero">
      <div class="mk-hero-art" id="heroArt"></div>
      <h1 id="h1"></h1>
      <p id="heroP"></p>
    </div>
    <div id="levels"></div>
    <div class="shelf" id="shelf"></div>
    <div id="learn"></div>
    <p class="note" id="note"></p>
  </section>
  <section id="play" hidden>
    <div class="bar"><div id="dots"></div><span class="chip"><small id="ptsL"></small><span id="pts">0</span></span></div>
    <div id="board"></div>
    <div id="why"></div>
  </section>
</div>

const PROP = { /* big – sulaiko sietas; mag – traukia magnetas; sol – tirpsta vandenyje */
  akmenukai: { big: 1 }, kruopos: { big: 1 }, zirniai: { big: 1 }, vinutes: { big: 1, mag: 1 }, rutuliukai: { big: 1, mag: 1 }, savarzeles: { big: 1, mag: 1 },

  ["druska", "smelis", "drozles"], ["kreida", "cukrus", "vinutes"], ["druska", "kruopos", "miltai", "rutuliukai"], ["cukrus", "zirniai", "smelis", "savarzeles"]

/* krūvelė: { c: [medžiagos], w: vanduo yra?, wo: vanduo buvo mišinio dalis?, d: [ištirpusios] } */
function mkPiles(mix){ const c = mix.filter(x => x !== "vanduo"), w = mix.includes("vanduo"); return [{ c, w, wo: w, d: w ? c.filter(x => PROP[x].sol) : [] }]; }
const solids = p => p.c.filter(x => !p.d.includes(x));
const pileDone = p => (p.c.length === 1 && !p.w) || (p.c.length === 0 && p.w) || (p.c.length === 1 && p.w && false);
function curPile(piles){ return piles.find(p => !(p.c.length === 1 && !p.w) && !(p.c.length === 0)); }
function applyTool(piles, tool){
  const p = curPile(piles); if(!p) return null;
  const sol = solids(p), other = (arr) => p.c.filter(x => !arr.includes(x));
  const split = (take, keepW) => { const rest = { c: p.c.filter(x => !take.includes(x)), w: p.w, wo: p.wo, d: p.d.filter(x => !take.includes(x)) };
    const out = { c: take, w: false, wo: false, d: [] };
    const np = piles.filter(x => x !== p); np.push(out); if(rest.c.length || (rest.w && rest.wo)) np.push(rest); return { piles: np, got: take }; };
  if(tool === "magnetas"){ const m = sol.filter(x => PROP[x].mag); if(!m.length || (m.length === p.c.length && !p.w)) return { err: "magnetas" }; return split(m); }
  if(tool === "sietas"){ const b = sol.filter(x => PROP[x].big); if(!b.length || (b.length === p.c.length && !p.w)) return { err: "sietas" }; return split(b); }
  if(tool === "vanduo"){ const s = sol.filter(x => PROP[x].sol); if(p.w || !s.length || s.length === p.c.length) return { err: "vanduo" };
    const np = piles.filter(x => x !== p); np.push({ c: p.c, w: true, wo: false, d: s }); return { piles: np, got: s, dis: 1 }; }
  if(tool === "filtras"){ if(!p.w || !sol.length) return { err: "filtras" }; return split(sol); }
  if(tool === "garinti"){ if(!p.w || sol.length || !p.d.length) return { err: "garinti" };
    const np = piles.filter(x => x !== p); np.push({ c: p.d.slice(), w: false, wo: false, d: [] }); return { piles: np, got: p.d.slice(), evap: 1 }; }
  return { err: "mix" };
}
const allDone = piles => !curPile(piles);
/* trumpiausias sprendimas (patikrai ir užuominai) */
function solve(piles, depth){
  if(allDone(piles)) return [];
  if(depth > 6) return null;
  let best = null;
  for(const t of ["magnetas", "sietas", "vanduo", "filtras", "garinti"]){
    const r = applyTool(piles, t); if(!r || r.err) continue;
    const s = solve(r.piles, depth + 1); if(s && (!best || s.length + 1 < best.length)) best = [t].concat(s);
  }
  return best;
}

function buildRound(li){
  const R = [];
  const add = (type, data) => R.push({ type, data });
  const st4 = pickN(T.sortItems, 4), ch4 = pickN(CHAIN_TASKS, 4);
  if(li === 0){ for(let i = 0; i < 4; i++){ add("state", st4[i]); add("chain", ch4[i]); } }
  if(li === 1){ const s = pickN(T.situations, 5), w = pickN(T.waterQ, 2); add("sit", s[0]); add("sit", s[1]); add("cycle", MK.rnd(0, 3)); add("sit", s[2]); add("wq", w[0]); add("sit", s[3]); add("sit", s[4]); add("wq", w[1]); }
  if(li === 2){ const d = pickN(T.dissItems, 5); const f = pickN(["temp", "stir", "size"].flatMap(k => [[k, "cukrus"], [k, "druska"]]), 3);
    [d[0], d[1], f[0], d[2], d[3], f[1], d[4], f[2]].forEach(x => add(x.length === 2 && T.fast[x[0]] ? "fast" : "diss", x)); }
  if(li === 3){ const easy = MIXES.slice(0, 13), mid = MIXES.slice(13, 16), hard = MIXES.slice(16);
    pickN(easy, 3).concat(pickN(mid, 2), pickN(hard, 3)).forEach(m => add("mix", m)); }
  if(li === 4){ const c = pickN(T.changes.map((x, i) => i), 7); c.slice(0, 5).forEach(i => add("ch", i));
    const k = pickN(KIND_OK.filter(i => !c.slice(0, 5).includes(i)), 2);
    add("kind", k[0]); add("rust", 0); add("kind", k[1]); }
  if(li === 5){
    add("state", st4[0]); add("chain", ch4[0]); add("sit", pickN(T.situations, 1)[0]); add("cycle", MK.rnd(0, 3));
    add("diss", pickN(T.dissItems, 1)[0]); add("fast", pickN(["temp", "stir", "size"], 1).concat([MK.pick(["cukrus", "druska"])]));
    add("mix", pickN(MIXES.slice(0, 13), 1)[0]); add("mix", pickN(MIXES.slice(13), 1)[0]);
    const ci = pickN(T.changes.map((x, i) => i), 2); add("ch", ci[0]); add("kind", pickN(KIND_OK, 1)[0]);
  }
  return R;
}

      ${small ? [0, 1, 2, 3, 4].map(j => `<rect x="${32 + j * 7}" y="${108 - (j % 2) * 5}" width="5" height="5" fill="#fff" ${st} stroke-width="1.4"/>`).join("") : `<rect x="40" y="96" width="20" height="20" rx="2" fill="#fff" ${st}/>`}
      ${stir ? `<path d="M64 6l-14 104" stroke="${INK}" stroke-width="6" stroke-linecap="round"/><path d="M64 6l-14 104" stroke="#c7cfdb" stroke-width="3" stroke-linecap="round"/><path d="M30 70q20 10 40 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>` : ""}
      ${warm ? `<path d="M36 14q-4-6 0-12M50 14q-4-6 0-12M64 14q-4-6 0-12" fill="none" stroke="#ff7a2f" stroke-width="3" stroke-linecap="round"/>` : ""}
      ${cold ? `<g transform="translate(34 -4) scale(.5)">${FLAKE}</g>` : ""}
      <path d="M10 20h80l-6 100q0 6-6 6H22q-6 0-6-6z" fill="none" ${st}/>
      <circle cx="50" cy="140" r="0"/>${mark === i ? `<path d="M30 70l14 14 26-30" fill="none" stroke="#2fb36b" stroke-width="8" stroke-linecap="round"/>` : ""}</g>`; };
  return `<svg viewBox="0 0 320 150" aria-hidden="true"><rect width="320" height="150" fill="#f4fbfa"/>${g(40, 0)}${g(180, 1)}
    <text x="90" y="146" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="15" fill="${INK}">A</text><text x="230" y="146" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="15" fill="${INK}">B</text></svg>`;
}
function mixScene(piles){
  const p = curPile(piles);
  const items = p ? p.c.filter(x => !p.d.includes(x)) : [];
  const dis = p ? p.d : [];
  const tint = p && p.w ? (dis.length ? "#cfe8ff" : "#bfe6ff") : "#efe3c8";
  return `<svg viewBox="0 0 320 150" aria-hidden="true"><rect width="320" height="150" fill="#f4fbfa"/><rect y="128" width="320" height="22" fill="#cfece6"/>
    <path d="M70 60h180q0 70-90 70t-90-70z" fill="#fff" ${st}/><path d="M76 66h168q-6 58-84 58t-84-58z" fill="${tint}"/>
    ${items.map((k, i) => `<g transform="translate(${100 + i * 34 - (items.length - 1) * 4} ${70 + (i % 2) * 6}) scale(.62)">${ICON[k]}</g>`).join("")}
    ${dis.length ? `<text x="160" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="12" fill="#2a5a8a">${MK.esc(T.dissolved(list(dis)))}</text>` : ""}
    <path d="M70 60h180q0 70-90 70t-90-70z" fill="none" ${st}/>${!p ? `<path d="M130 90l20 20 40-44" fill="none" stroke="#2fb36b" stroke-width="10" stroke-linecap="round"/>` : ""}</svg>`;
}
const TOOL_ICON = {
  sietas: ico(`<ellipse cx="30" cy="30" rx="22" ry="22" fill="#fff" ${st}/><path d="M14 22h32M10 30h40M14 38h32M22 12v36M30 8v44M38 12v36" stroke="#9aa3b5" stroke-width="1.8"/><circle cx="30" cy="30" r="22" fill="none" ${st}/>`),
  magnetas: ico(`<path d="M10 14h12v16a8 8 0 0 0 16 0V14h12v16a20 20 0 0 1-40 0z" fill="#e5543b" ${st}/><path d="M10 14h12v8H10zM38 14h12v8H38z" fill="#c7cfdb" ${st}/>`),
  vanduo: ico(`<path d="M30 8q14 18 14 28a14 14 0 0 1-28 0q0-10 14-28z" fill="#69c3ff" ${st}/>`),
  filtras: ico(`<path d="M10 12h40L34 34v16l-8 4V34z" fill="#fff" ${st}/><path d="M14 16h32" stroke="#d8cbaa" stroke-width="5"/>`),
  garinti: ico(`<g transform="translate(0 18) scale(.7)">${FLAME}</g><path d="M30 26q-4-6 0-12M40 26q-4-6 0-12" fill="none" stroke="#9fb3c8" stroke-width="3" stroke-linecap="round" transform="translate(-6 -4)"/><path d="M28 30h24v8q0 6-6 6H34q-6 0-6-6z" fill="#c7cfdb" ${st}/>`)
};

/* ---------- piešimas ---------- */
function draw(){
  const c = cur, d = c.data;
  let html = "";
  if(c.type === "state"){
    html = `<div class="scene">${benchScene(d[0])}</div><div class="q">${T.stateQ(nm(d[0]))}</div>
      <div class="ans c3">${["k", "s", "d"].map(k => `<button type="button" class="ab" data-a="${k}">${icon(k === "k" ? "akmuo" : k === "s" ? "vanduo" : "balionas")}${T.states[k]}</button>`).join("")}</div>`;
  }
  if(c.type === "chain"){
    if(!S.at){ S.at = d[0]; S.log = []; S.extra = 0; S.mode = ""; }
    html = `<div class="scene">${chainScene(S.at, S.mode)}</div><div class="q">${T.chainQ(nm(d[0]), nm(d[1]))}</div><p class="hint">${T.chainHint}</p>
      ${S.log.length ? `<div class="log">${S.log.map(x => `<span class="${x[1] ? "" : "x"}">${x[0]}</span>`).join("")}</div>` : ""}
      ${S.done ? "" : `<div class="ans c2"><button type="button" class="ab heat" data-a="heat">${ico(FLAME)}${T.heat}</button><button type="button" class="ab cold" data-a="cool">${ico(FLAKE)}${T.cool}</button></div>`}`;
  }
  if(c.type === "sit"){
    const opts = ["lyd", "kiet", "gar", "kond"];
    html = `<div class="scene">${benchScene(d[2])}</div><div class="q">${MK.esc(d[0])}<br><span style="font-size:.85em">${T.sitQ}</span></div>
      <div class="ans c2">${opts.map(k => `<button type="button" class="ab" data-a="${k}">${T.proc[k]}</button>`).join("")}</div>`;
  }
  if(c.type === "cycle"){
    if(!S.order){ S.order = T.cycle.map((x, i) => (i + d) % 4); S.placed = 0; S.cards = SH([0, 1, 2, 3]); }
    const first = S.order[0];
    html = `<div class="scene">${cycleScene(S.placed)}</div><div class="q" style="font-size:17px">${T.cycleQ}</div>
      <p class="hint">${T.cycleStart} ${MK.esc(T.cycle[first][0])}</p>
      <div class="cyc">${S.cards.map(i => { const pos = S.order.indexOf(i), done = pos < S.placed;
        return `<button type="button" class="ab${done ? " ok" : ""}" data-a="${i}" ${done ? "disabled" : ""}><b>${done ? pos + 1 : "?"}</b><span>${MK.esc(T.cycle[i][0])}</span></button>`; }).join("")}</div>`;
  }
  if(c.type === "wq" || c.type === "rust"){
    const q = c.type === "rust" ? T.rustQ : d;
    if(!S.perm) S.perm = SH(q[1].map((x, i) => i));
    const ic = c.type === "rust" ? "vinis" : q[0].includes("debes") ? "debesis" : q[0].includes("kamino") ? "debesis" : q[0].includes("bal") ? "bala" : q[0].includes("žiem") ? "sniegas" : "vanduo";
    html = `<div class="scene">${benchScene(ic)}</div><div class="q">${MK.esc(q[0])}</div>
      <div class="ans">${S.perm.map(i => `<button type="button" class="ab" data-a="${i}">${MK.esc(q[1][i])}</button>`).join("")}</div>`;
  }
  if(c.type === "diss"){
    html = `<div class="scene">${glassScene(d[0], S.res)}</div><div class="q">${T.dissQ(nm(d[0]))}</div>
      <div class="ans c2"><button type="button" class="ab" data-a="1">${T.diss.yes}</button><button type="button" class="ab" data-a="0">${T.diss.no}</button></div>`;
  }
  if(c.type === "fast"){
    if(S.flip == null) S.flip = Math.random() < .5;
    const f = T.fast[d[0]], lab = S.flip ? [f[1], f[0]] : [f[0], f[1]];
    html = `<div class="scene">${twoGlass(d[0], S.flip ? 1 : 0, S.mark)}</div><div class="q">${T.fastQ(T.fastName[d[1]])}</div>
      <div class="ans c2"><button type="button" class="ab" data-a="0"><b>A</b><small>${lab[0]}</small></button><button type="button" class="ab" data-a="1"><b>B</b><small>${lab[1]}</small></button></div>`;
    if(S.flip && !S.swapped){ S.swapped = 1; }
  }
  if(c.type === "mix"){
    if(!S.piles){ S.piles = mkPiles(d); S.err = 0; S.steps = []; }
    const out = S.piles.filter(p => p !== curPile(S.piles) && ((p.c.length === 1 && !p.w) || (!p.c.length && p.wo)));
    html = `<div class="scene">${mixScene(S.piles)}</div><div class="q" style="font-size:18px">${S.steps.length ? T.mixNext : T.mixQ(list(d))}</div>
      ${out.length ? `<div class="piles">${out.map(p => p.c.length ? `<span class="pile">${icon(p.c[0])}${MK.esc(nm(p.c[0]))}</span>` : `<span class="pile">${icon("vanduo")}${MK.esc(nm("vanduo"))}</span>`).join("")}</div>` : ""}
      ${allDone(S.piles) ? "" : `<div class="ans c3">${Object.keys(T.tools).map(k => `<button type="button" class="ab" data-a="${k}">${TOOL_ICON[k]}${T.tools[k]}</button>`).join("")}</div>`}`;
  }
  if(c.type === "ch"){
    const x = T.changes[d];
    html = `<div class="scene">${benchScene(CH_ICON[d])}</div><div class="q">${T.chQ(MK.esc(x[0]))}</div>
      <div class="ans">${["rev", "irr"].map((k, i) => `<button type="button" class="ab" data-a="${i === 0 ? 1 : 0}">${T.ch[k]}</button>`).join("")}</div>`;
  }
  if(c.type === "kind"){
    const x = T.changes[d];
    if(!S.opts){ const pool = Object.keys(T.kinds).filter(k => k !== x[2]); S.opts = SH([x[2]].concat(pickN(pool, 3))); }
    html = `<div class="scene">${benchScene(CH_ICON[d])}</div><div class="q">${T.kindQ(MK.esc(x[0]))}</div>
      <div class="ans c2">${S.opts.map(k => `<button type="button" class="ab" data-a="${k}">${T.kinds[k]}</button>`).join("")}</div>`;
  }
  board.innerHTML = `<div class="card">${head()}${html}</div>`;
  if(S.lock) board.querySelectorAll(".ab").forEach(b => b.disabled = true);
}

/* ---------- atsakymai ---------- */
function correct(head, body, keys){
  S.lock = true; if(tries === 0){ okN++; pts += 10; fresh += addStick(keys || []); } else pts += 5;
  $("pts").textContent = pts; dots.mark(ti, tries === 0); MK.sfx.good();
  why.innerHTML = MK.why({ ok: true, head: `${MK.praise()} +${tries === 0 ? 10 : 5}`, body: (head ? head + " " : "") + (body || "") }) + goBtn();
  board.querySelectorAll(".ab").forEach(b => b.disabled = true);
  setTimeout(() => why.scrollIntoView({ behavior: "smooth", block: "nearest" }), 80);
}
function wrongOnce(btn, text){
  tries++; MK.sfx.bad(); if(btn){ btn.classList.add("no"); btn.disabled = true; }
  why.innerHTML = MK.why({ ok: false, head: T.tryAgain, body: text || "" });
}
function failShow(text){
  S.lock = true; dots.mark(ti, false); MK.sfx.bad();
  why.innerHTML = MK.why({ ok: false, head: T.shown, body: text }) + goBtn();
  board.querySelectorAll(".ab").forEach(b => b.disabled = true);
  setTimeout(() => why.scrollIntoView({ behavior: "smooth", block: "nearest" }), 80);
}
function markOk(a){ const b = board.querySelector(`.ab[data-a="${a}"]`); if(b) b.classList.add("ok"); }
/* paprastas pasirinkimas: 2 bandymai */
function choice(btn, a, right, okText, badText, keys){
  if(String(a) === String(right)){ markOk(a); correct("", okText, keys); return; }
  if(tries === 0){ wrongOnce(btn, badText); return; }
  btn.classList.add("no"); markOk(right); failShow(okText);
}

board.addEventListener("click", e => {
  MK.unlock();
  const b = e.target.closest(".ab"); if(!b || b.disabled || S.lock) return;
  const a = b.dataset.a, c = cur, d = c.data;
  if(c.type === "state"){
    const txt = (d[2] ? d[2] + " " : "") + T.stateWhy[d[1]];
    return choice(b, a, d[1], txt, T.stateWhy[a] ? `${T.states[a]}? ${T.stateWhy[a]}` : "", [d[0] === "vaskas" ? "zvake" : d[0]]);
  }
  if(c.type === "chain"){
    MK.sfx.tap();
    const step = CHAINS[S.at], heat = a === "heat", nxt = heat ? step[0] : step[1], pr = heat ? step[2] : step[3];
    S.mode = heat ? "heat" : "cool";
    if(!nxt){ S.extra++; S.log.push([heat ? T.heat : T.cool, 0]); draw(); why.innerHTML = MK.why({ ok: false, head: heat ? (S.at === "sokoladasS" ? T.noChange.chocHot : T.noChange.hot) : T.noChange.cold }); return; }
    S.log.push([`${T.proc[pr]} → ${nm(nxt)}`, 1]);
    if(chainLen(nxt, d[1]) > chainLen(S.at, d[1])) S.extra++;
    S.at = nxt;
    if(S.at === d[1]){
      S.done = true; draw();
      const used = [...new Set(S.log.filter(x => x[1]).map(x => x[0].split(" →")[0]))];
      const ex = Object.keys(T.proc).filter(k => used.includes(T.proc[k])).map(k => T.procWhy[k]).join(" ");
      tries = S.extra ? 1 : 0;
      if(S.extra){ S.lock = true; pts += 5; $("pts").textContent = pts; dots.mark(ti, false); MK.sfx.good();
        why.innerHTML = MK.why({ ok: true, head: T.chainExtra(S.extra), body: ex }) + goBtn(); }
      else correct(T.chainOk, ex, [d[0].replace(/S$/, ""), d[1].replace(/S$/, "")].map(k => k === "vaskas" ? "zvake" : k));
      return;
    }
    why.innerHTML = ""; draw(); return;
  }
  if(c.type === "sit") return choice(b, a, d[1], T.procWhy[d[1]], T.procWhy[a] ? T.procWhy[a] : "", [d[2]]);
  if(c.type === "cycle"){
    const want = S.order[S.placed];
    if(+a === want){ S.placed++; MK.sfx.tap(); why.innerHTML = "";
      if(S.placed >= 4){ draw(); correct("", T.cycleWhy, ["debesis", "jura"]); return; }
      draw(); return; }
    tries++; MK.sfx.bad(); why.innerHTML = MK.why({ ok: false, head: T.cycleWrong });
    if(tries >= 3){ S.placed = 4; draw(); failShow(T.cycleWhy); }
    return;
  }
  if(c.type === "wq" || c.type === "rust"){ const q = c.type === "rust" ? T.rustQ : d; return choice(b, a, q[2], q[3], "", [c.type === "rust" ? "vinis" : "vanduo"]); }
  if(c.type === "diss"){
    S.res = d[1] ? "diss" : ["aliejus", "pjuvenos"].includes(d[0]) ? "float" : "sink";
    if(String(a) === String(d[1]) || tries > 0){ draw(); }
    return choice(board.querySelector(`.ab[data-a="${a}"]`), a, d[1], d[2], "", [d[0]]);
  }
  if(c.type === "fast"){
    const right = S.flip ? 1 : 0;
    if(+a === right || tries > 0){ S.mark = right; draw(); }
    return choice(board.querySelector(`.ab[data-a="${a}"]`), a, right, T.fast[d[0]][2], "", [d[1]]);
  }
  if(c.type === "mix"){
    const r = applyTool(S.piles, a);
    if(!r || r.err){ S.err++; tries = 1; MK.sfx.bad(); b.classList.add("no");
      const best = solve(S.piles, 0);
      why.innerHTML = MK.why({ ok: false, head: T.tryAgain, body: T.toolNo[r ? r.err : "mix"] + (S.err >= 2 && best ? ` 💡 ${T.tools[best[0]]}` : "") });
      setTimeout(() => b.classList.remove("no"), 900); return; }
    S.piles = r.piles; S.steps.push(a); MK.sfx.tap();
    const msg = T.toolDo[a](list(r.got));
    draw();
    if(allDone(S.piles)){
      const keys = d.filter(x => x !== "vanduo");
      if(S.err){ tries = 1; S.lock = true; pts += 5; $("pts").textContent = pts; dots.mark(ti, false); MK.sfx.good();
        why.innerHTML = MK.why({ ok: true, head: T.mixDone + " +5", body: msg + " " + T.mixWhy }) + goBtn(); board.querySelectorAll(".ab").forEach(x => x.disabled = true); }
      else correct(T.mixDone, msg + " " + T.mixWhy, keys);
      return;
    }
    why.innerHTML = MK.why({ ok: true, head: msg }); return;
  }
  if(c.type === "ch"){ const x = T.changes[d]; return choice(b, a, x[1], x[3], "", [CH_ICON[d]]); }
  if(c.type === "kind"){ const x = T.changes[d]; return choice(b, a, x[2], `${T.kinds[x[2]]}. ${x[3]}`, "", [CH_ICON[d]]); }
});
why.addEventListener("click", e => { if(!e.target.closest("#go")) return; MK.sfx.tap(); ti++; next(); window.scrollTo(0, 0); });
function finish(){
  const stars = MK.starsFor(okN, round.length); MK.best(GAME, Lv.id, stars);
  MK.result({ stars, title: T.resTitle(okN, round.length), text: T.resText(fresh),
    next: lvl < LEVELS.length - 1 ? () => start(lvl + 1) : null, again: () => start(lvl), menu: showMenu });
}
window.__mkTest = { MIXES, mkPiles, applyTool, solve, allDone, buildRound, CHAINS, CHAIN_TASKS, cur: () => cur, S: () => S };
showMenu();
})();
</script>
</body>
