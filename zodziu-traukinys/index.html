<style>
/* Žodžių traukinys: viršuje bėgiai su 8 tuščiomis vagonų vietomis, žemiau užduoties kortelė ir atsakymų mygtukai. */
body{--ac:#13a8d6;--ac-ink:#fff;--ac-soft:#d8f2fb}
.track{width:100%;max-width:560px;margin:4px auto 0;display:block;overflow:hidden}
.track svg{width:100%;height:auto;display:block}
.train{transition:transform 2.2s cubic-bezier(.5,0,.8,.6)}
.wagon{transform-box:fill-box;transform-origin:50% 100%;animation:wIn .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes wIn{from{transform:translateX(-30px) scale(.4);opacity:0}}
.puff{animation:puff 1.2s ease-out infinite}
.puff:nth-child(2){animation-delay:.4s}.puff:nth-child(3){animation-delay:.8s}
@keyframes puff{from{transform:translate(0,0) scale(.5);opacity:.9}to{transform:translate(-14px,-26px) scale(1.4);opacity:0}}
.task{display:grid;justify-items:center;gap:8px;max-width:560px;margin:12px auto 0;padding:16px 14px 18px;background:var(--card);border-radius:26px;
  box-shadow:inset 0 0 0 3px var(--ink),0 6px 0 rgba(18,26,51,.16);text-align:center}
.task .pic{font-size:64px;line-height:1}
.task .q{font:800 15px/1.2 var(--body);color:var(--soft);letter-spacing:.06em;text-transform:uppercase}
.task .txt{font:800 clamp(28px,8vw,44px)/1.2 var(--kid);text-wrap:balance}
.task .txt.sent{font-size:clamp(22px,6vw,32px)}
.gap{display:inline-grid;place-items:center;min-width:1.1em;height:1.15em;margin:0 .04em;padding:0 .08em;border-radius:.22em;background:#fff3b0;
  box-shadow:inset 0 0 0 .06em var(--ink);vertical-align:-.12em;color:var(--ac)}
.gap.ok{background:#c9f5c0;color:#127a3c}
.opts{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:10px;max-width:560px;margin:14px auto 0}
.opts.words{grid-template-columns:1fr 1fr}
.opts button{min-height:68px;border:0;border-radius:20px;cursor:pointer;background:var(--card);font:800 clamp(28px,8vw,40px)/1 var(--kid);
  box-shadow:inset 0 0 0 3px var(--ink),0 5px 0 rgba(18,26,51,.2)}
.opts.words button{font-size:clamp(18px,5vw,24px);min-height:60px}
.opts button.ok{background:#7ee08a}
.opts button.no{background:#ffb4a2;opacity:.75;pointer-events:none}
.why{font:700 16px/1.3 var(--body);color:var(--soft)}
#guideBox{margin-top:12px}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <section id="menu">
    <div class="mk-hero">
      <div class="mk-hero-art" id="heroArt"></div>
      <h1>Žodžių <em>traukinys</em></h1>
      <p>Kiekvienas teisingas atsakymas prikabina vagonėlį. Surink visą traukinį!</p>
    </div>
    <div id="levels"></div>
  </section>
  <section id="play" hidden>
    <div class="track" id="track"></div>
    <div class="task" id="task"></div>
    <div class="opts" id="opts"></div>
    <div id="guideBox"></div>
  </section>
</div>
<script>
(function(){
"use strict";
const GAME = "zodziu-traukinys", ROUND = 8, GRADES = [1, 2, 3, 4];
/* 1 klasė: first letter of a picture word. */
const FIRST = ["🍎 obuolys", "🐟 žuvis", "🏠 namas", "🌞 saulė", "🐱 katė", "🐶 šuo", "🌳 medis", "🐸 varlė", "🦊 lapė", "🐻 meška", "🍐 kriaušė",
  "🥕 morka", "🐝 bitė", "🌙 mėnulis", "⭐ žvaigždė", "🐭 pelė", "🦆 antis", "🐮 karvė", "🍋 citrina", "🎈 balionas", "🦔 ežys", "🐘 dramblys",
  "🦁 liūtas", "🐰 kiškis", "🍓 braškė", "🌷 tulpė", "🚂 traukinys", "✏️ pieštukas", "📚 knyga", "🧀 sūris", "🦉 pelėda", "🐌 sraigė",
  "🐞 boružė", "🔥 ugnis", "🎁 dovana", "⚽ kamuolys", "🦒 žirafa", "🦓 zebras", "🎸 gitara", "🍄 grybas", "🦋 drugelis", "🚲 dviratis",
  "✈️ lėktuvas", "🚀 raketa", "⛵ laivas", "🏰 pilis", "🔑 raktas", "🎂 tortas", "🐺 vilkas", "🦢 gulbė", "🦜 papūga", "🌲 eglė",
  "❄️ snaigė", "🍉 arbūzas", "🥔 bulvė", "🐔 višta", "🐑 avis", "🐐 ožka", "☂️ skėtis", "🍯 medus", "🥒 agurkas", "🐢 vėžlys", "✂️ žirklės", "🕯️ žvakė"]
  .map(s => { const [e, w] = s.split(" "); return { e, w }; });
const LETTERS = "abcčdeėgijklmnoprsštuvzž".split("");
const PAIRS = { s: "š", š: "s", z: "ž", ž: "z", c: "č", č: "c", e: "ė", ė: "e", u: "ū", i: "y", p: "b", b: "p", d: "t", t: "d", k: "g", g: "k" };
/* 2 klasė: i or y, u or ū. Word with "_" marks the gap; the letter after "=" is the answer. */
const VOWELS = ["🐈 kat_nas=i", "🏰 p_lis=i", "🐔 v_šta=i", "🐰 k_škis=i", "🌲 m_škas=i", "☝️ p_rštas=i", "🚲 dv_ratis=i", "· ž_rnis=i", "· l_zdas=i", "· k_biras=i",
  "🥧 p_ragas=y", "🌅 r_tas=y", "👨 v_ras=y", "🐟 l_deka=y", "🌧️ l_ja=y", "🍒 v_šnia=y", "😊 š_psena=y", "· t_la=y", "· d_glys=y", "· l_gus=y",
  "🏞️ _pė=u", "🦢 g_lbė=u", "👄 b_rna=u", "🎒 k_prinė=u", "· m_sė=u", "· k_rmis=u", "· t_rgus=u", "· d_lkės=u",
  "🧀 s_ris=ū", "🥁 b_gnas=ū", "🌫️ r_kas=ū", "👄 l_pa=ū", "💨 d_mai=ū", "👶 k_dikis=ū", "🌨️ p_ga=ū", "· m_ras=ū", "· _sai=ū", "· r_ta=ū", "· pl_dė=ū"]
  .map(s => { const [e, rest] = s.split(" "), [w, a] = rest.split("="); return { e: e === "·" ? "" : e, w, a, opts: "iy".includes(a) ? ["i", "y"] : ["u", "ū"] }; });
/* 3 klasė: endings with or without a nasal letter. */
const NASAL = [
  ["Ant stalo guli knyg_.", "a", "Kas guli? – knyga."], ["Sesė skaito knyg_.", "ą", "Skaito ką? – knygą."],
  ["Mano kat_ miega.", "ė", "Kas miega? – katė."], ["Aš glostau kat_.", "ę", "Glostau ką? – katę."],
  ["Akvariume plaukia žuv_s.", "i", "Kas plaukia? – žuvis."], ["Senelis pagavo žuv_.", "į", "Pagavo ką? – žuvį."],
  ["Močiutė kepa pyrag_.", "ą", "Kepa ką? – pyragą."], ["Ant stalo stovi pyrag_s.", "a", "Kas stovi? – pyragas."],
  ["Krepšelyje daug gryb_.", "ų", "Daug ko? – grybų."], ["Pievoje ganosi daug karvi_.", "ų", "Daug ko? – karvių."],
  ["Vaikas glosto šun_.", "į", "Glosto ką? – šunį."], ["Mergaitė nupiešė saul_.", "ę", "Nupiešė ką? – saulę."],
  ["Danguje šviečia saul_.", "ė", "Kas šviečia? – saulė."], ["Mes puošiame eglut_.", "ę", "Puošiame ką? – eglutę."],
  ["Lentynoje daug knyg_.", "ų", "Daug ko? – knygų."], ["Brolis valgo sūr_.", "į", "Valgo ką? – sūrį."],
  ["Tėtis perka duon_.", "ą", "Perka ką? – duoną."], ["Duon_ labai skani.", "a", "Kas skani? – duona."],
  ["Aš turiu brol_.", "į", "Turiu ką? – brolį."], ["Kieme žaidžia daug vaik_.", "ų", "Daug ko? – vaikų."],
  ["Mama nupirko obuol_.", "į", "Nupirko ką? – obuolį."], ["Ant šakos tupi paukšt_s.", "i", "Kas tupi? – paukštis."]
].map(([w, a, why]) => ({ w, a, why, opts: { a: ["a", "ą"], "ą": ["a", "ą"], "ė": ["ė", "ę"], "ę": ["ė", "ę"], i: ["i", "į"], "į": ["i", "į"], "ų": ["u", "ų"] }[a] }));
/* 4 klasė: parts of speech. */
const POS = { daiktavardis: "kas?", "būdvardis": "koks?", "veiksmažodis": "ką veikia?", skaitvardis: "kiek? kelintas?" };
const WORDS4 = {
  daiktavardis: ["namas", "mokykla", "draugas", "upė", "saulė", "medis", "stalas", "gėlė", "vasara", "miestas", "kamuolys", "debesis"],
  "būdvardis": ["gražus", "didelis", "mažas", "žalias", "linksmas", "greitas", "šiltas", "aukštas", "saldus", "raudonas", "protingas", "tylus"],
  "veiksmažodis": ["bėga", "rašo", "skaito", "dainuoja", "šoka", "žaidžia", "miega", "valgo", "piešia", "plaukia", "skrenda", "juokiasi"],
  skaitvardis: ["penki", "dešimt", "trečias", "pirmas", "du", "septyni", "šimtas", "antras"]
};
const LEVELS = [
  { id: "raide", name: "Pirmoji raidė", sub: "1 klasė · paveikslėlis ir raidė", art: "Aa" },
  { id: "balsiai", name: "i ar y? u ar ū?", sub: "2 klasė · trumpieji ir ilgieji balsiai", art: "y/ū" },
  { id: "nosines", name: "Nosinės raidės", sub: "3 klasė · ą, ę, į, ų galūnėse", art: "ą ę" },
  { id: "kalbos", name: "Kalbos dalys", sub: "4 klasė · kas? koks? ką veikia?", art: "kas?" }
];
const $ = id => document.getElementById(id);
const app = $("app"), menu = $("menu"), play = $("play"), opts = $("opts"), task = $("task");
const savedGrade = MK.get("mokomeskartu-klase", 0);
app.prepend(MK.top({ title: "Žodžių traukinys", grade: GRADES.includes(savedGrade) ? savedGrade : GRADES[0] }));
$("guideBox").innerHTML = MK.guide("");
const guide = $("guideBox").firstElementChild;
const gapHtml = (w, fill, ok) => MK.esc(w).replace("_", `<span class="gap${ok ? " ok" : ""}">${fill || "?"}</span>`);

/* ---------- train ---------- */
const WCOL = ["#ff4f5e", "#ff8a1f", "#ffc61a", "#7bd13a", "#12b886", "#13a8d6", "#6b4dff", "#ff3d9a"];
const LOCO = `<g><rect x="34" y="16" width="44" height="36" rx="6" fill="#e5243b" stroke="#121a33" stroke-width="3"/>
  <rect x="44" y="22" width="22" height="16" rx="3" fill="#bfe9ff" stroke="#121a33" stroke-width="2.5"/>
  <rect x="0" y="30" width="40" height="22" rx="5" fill="#2f6bff" stroke="#121a33" stroke-width="3"/>
  <rect x="8" y="12" width="12" height="20" rx="2" fill="#121a33"/><path d="M-4 52l6 -12h4" fill="#ffc61a" stroke="#121a33" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="14" cy="56" r="9" fill="#121a33"/><circle cx="14" cy="56" r="3.5" fill="#c9cfdb"/><circle cx="60" cy="56" r="9" fill="#121a33"/><circle cx="60" cy="56" r="3.5" fill="#c9cfdb"/>
  <g fill="#fff" opacity=".9"><circle class="puff" cx="14" cy="8" r="6"/><circle class="puff" cx="14" cy="8" r="6"/><circle class="puff" cx="14" cy="8" r="6"/></g></g>`;
const SLOT = 62, TW = 96 + ROUND * SLOT + 12;
function drawTrack(){
  let s = `<svg viewBox="0 0 ${TW} 84" role="img" aria-label="Traukinys: ${ROUND} vagonėlių vietos">
    <path d="M0 76H${TW}" stroke="#8a5a36" stroke-width="5"/>`;
  for(let x = 6; x < TW; x += 18) s += `<rect x="${x}" y="72" width="10" height="8" rx="1.5" fill="#a5642e"/>`;
  for(let k = 0; k < ROUND; k++){ const x = 8 + (ROUND - 1 - k) * SLOT; s += `<rect x="${x}" y="28" width="${SLOT - 10}" height="34" rx="6" fill="none" stroke="#c9b98f" stroke-width="2.5" stroke-dasharray="6 5"/>`; }
  s += `<g class="train" id="train"><g transform="translate(${8 + ROUND * SLOT} 8)">${LOCO}</g><g id="wagons"></g></g></svg>`;
  $("track").innerHTML = s;
}
function addWagon(k, label, first){
  const x = 8 + (ROUND - 1 - k) * SLOT, c = first ? WCOL[k % WCOL.length] : "#c9cfdb";
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g"); g.setAttribute("class", "wagon");
  g.innerHTML = `<rect x="${x + SLOT - 12}" y="50" width="14" height="4" fill="#121a33"/>
    <rect x="${x}" y="28" width="${SLOT - 10}" height="30" rx="6" fill="${c}" stroke="#121a33" stroke-width="3"/>
    <text x="${x + (SLOT - 10) / 2}" y="49" text-anchor="middle" font-family="Grandstander,Comic Sans MS,sans-serif" font-weight="800" font-size="${label.length > 3 ? 13 : 20}" fill="#121a33">${MK.esc(label)}</text>
    <circle cx="${x + 12}" cy="62" r="7" fill="#121a33"/><circle cx="${x + SLOT - 22}" cy="62" r="7" fill="#121a33"/>`;
  $("wagons").appendChild(g);
}
$("heroArt").innerHTML = `<svg viewBox="0 0 260 110" aria-hidden="true"><path d="M0 100H260" stroke="#8a5a36" stroke-width="5"/>
  <g transform="translate(176 32)">${LOCO}</g>
  ${["a", "ą", "y"].map((l, k) => `<g transform="translate(${116 - k * 58} 0)"><rect x="0" y="54" width="52" height="34" rx="6" fill="${WCOL[k * 2]}" stroke="#121a33" stroke-width="3"/>
    <text x="26" y="80" text-anchor="middle" font-family="Grandstander,Comic Sans MS,sans-serif" font-weight="800" font-size="24" fill="#121a33">${l}</text>
    <circle cx="12" cy="90" r="7" fill="#121a33"/><circle cx="40" cy="90" r="7" fill="#121a33"/><rect x="50" y="76" width="10" height="4" fill="#121a33"/></g>`).join("")}</svg>`;

/* ---------- questions ---------- */
function makeTasks(i){
  if(i === 0) return MK.shuffle(FIRST).slice(0, ROUND).map(it => {
    const a = it.w[0], pool = LETTERS.filter(l => l !== a && l !== PAIRS[a]);
    const set = [a, PAIRS[a] && LETTERS.includes(PAIRS[a]) ? PAIRS[a] : MK.pick(pool)];
    while(set.length < 3){ const l = MK.pick(pool); if(!set.includes(l)) set.push(l); }
    return { e: it.e, w: "_" + it.w.slice(1), a, opts: MK.shuffle(set), q: "Kokia raide prasideda žodis?", label: a, full: it.w };
  });
  if(i === 1) return MK.shuffle(VOWELS).slice(0, ROUND).map(it => ({ ...it, q: it.opts[0] === "i" ? "i ar y?" : "u ar ū?", label: it.a, full: it.w.replace("_", it.a) }));
  if(i === 2) return MK.shuffle(NASAL).slice(0, ROUND).map(it => ({ ...it, e: "", sent: true, q: "Kurios raidės trūksta?", label: it.a, full: it.w.replace("_", it.a) }));
  const kinds = Object.keys(WORDS4), list = [];
  kinds.forEach(k => MK.shuffle(WORDS4[k]).slice(0, 2).forEach(w => list.push({ e: "", w, a: k, opts: kinds, words: true, q: "Kokia tai kalbos dalis?", label: k.slice(0, 4) + ".", full: w })));
  return MK.shuffle(list);
}

/* ---------- game flow ---------- */
let lvl = 0, tasks = [], ti = 0, t = null, tries = 0, firstOK = 0, busy = false;
function showMenu(){ play.hidden = true; menu.hidden = false; MK.levels($("levels"), { game: GAME, levels: LEVELS, onPick: start }); window.scrollTo(0, 0); }
function start(i){
  lvl = i; ti = 0; firstOK = 0; tasks = makeTasks(i);
  menu.hidden = true; play.hidden = false; window.scrollTo(0, 0);
  drawTrack(); next();
}
function draw(fill, ok){
  task.innerHTML = `${t.e ? `<div class="pic" aria-hidden="true">${t.e}</div>` : ""}<div class="q">${t.q}</div>
    <div class="txt${t.sent ? " sent" : ""}">${t.words ? `<span class="gap${ok ? " ok" : ""}" style="padding:0 .3em">${MK.esc(t.w)}</span>` : gapHtml(t.w, fill, ok)}</div>
    ${ok && t.why ? `<div class="why">${t.why}</div>` : ""}${ok && t.words ? `<div class="why">${t.a[0].toUpperCase() + t.a.slice(1)} atsako į klausimą <b>${POS[t.a]}</b></div>` : ""}`;
}
function next(){
  if(ti >= ROUND) return finish();
  t = tasks[ti]; tries = 0; busy = false;
  draw();
  opts.className = "opts" + (t.words ? " words" : ""); opts.style.setProperty("--n", t.opts.length);
  opts.innerHTML = t.opts.map(o => `<button type="button" data-o="${MK.esc(o)}">${MK.esc(o)}</button>`).join("");
  MK.say(guide, ti === 0 ? "Rinkis teisingą atsakymą – prikabinsi vagonėlį!" : `Dar ${ROUND - ti} ${ROUND - ti === 1 ? "vagonėlis" : "vagonėliai"} iki pilno traukinio.`);
}
opts.addEventListener("click", async e => {
  const b = e.target.closest("button"); if(!b || busy) return;
  MK.unlock();
  if(b.dataset.o === t.a){
    busy = true; b.classList.add("ok"); if(tries === 0) firstOK++;
    MK.sfx.good(); draw(t.a, true);
    MK.say(guide, `${MK.praise()} <b>${MK.esc(t.full)}</b>`);
    addWagon(ti, t.label, tries === 0); setTimeout(() => MK.sfx.beep(), 200);
    await MK.wait(t.why || t.words ? 1900 : 1300); ti++; next();
    return;
  }
  tries++; b.classList.add("no"); MK.sfx.bad();
  if(lvl === 3) MK.say(guide, `Paklausk: <b>kas? koks? ką veikia? kiek?</b> Kuris klausimas tinka žodžiui „${MK.esc(t.w)}“?`, "bad");
  else if(lvl === 2) MK.say(guide, "Paklausk savęs: <b>kas?</b> ar <b>ką? / ko daug?</b>", "bad");
  else MK.say(guide, "Pabandyk dar kartą! Ištark žodį garsiai.", "bad");
});
async function finish(){
  busy = true; MK.say(guide, "Traukinys pilnas! Tu-tū!");
  MK.sfx.beep(true); setTimeout(() => MK.sfx.vroom(), 300);
  $("train").style.transform = `translateX(${TW + 40}px)`;
  await MK.wait(2000);
  const stars = MK.starsFor(firstOK, ROUND);
  MK.best(GAME, LEVELS[lvl].id, stars);
  MK.result({ stars, text: `Iš pirmo karto teisingai: ${firstOK} iš ${ROUND}.`,
    next: lvl < LEVELS.length - 1 ? () => start(lvl + 1) : null, again: () => start(lvl), menu: showMenu });
}
showMenu();
})();
</script>
</body>
</html>
