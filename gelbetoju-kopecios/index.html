<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="/logo/mk-ikona-180.png">
<title>Gelbėtojų kopėčios – MokomėsKartu.lt</title>
<meta name="description" content="Matematikos žaidimas 9 klasei: vairuok autokopėčias ir gelbėk žmones – sinusas, kosinusas ir tangentas stačiajame trikampyje, aukščio matavimas kampamačiu, atstumas iki neprieinamos vietos.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f2f3ef">

<script src="/bendra/mk.js"></script>
<script src="tekstai.lt.js"></script>
<script src="uzduotys.js"></script>
<style>
/* Gelbėtojų kopėčios: santūrus techninis stilius – šviesus popierius, tušo linijos, signalinė raudona ir gintaro spalva. */
body{--paper:#f2f3ef;--ink:#1d2530;--soft:#5c6873;--line:#c5cbc9;--red:#c8321f;--amb:#e9a23b;--okc:#1b7a43;--card:#fbfbf8;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--kid:var(--body);--mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  background:#f2f3ef;background-image:none;color:var(--ink);font-weight:500}
.mk-app{max-width:780px;padding-block:6px 14px}
.mk-top{padding-bottom:8px}
.mk-back,.mk-ico{border-radius:5px;border-width:1.5px;box-shadow:none;height:40px}
.mk-ico{width:40px}.mk-ico[data-k="music"]{display:none}
.mk-title{font:700 14px/1.1 var(--body);letter-spacing:.09em;text-transform:uppercase}
.kick{font:700 11px/1.3 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}
h1{margin:6px 0;font:800 clamp(30px,8vw,42px)/1.02 var(--body);letter-spacing:-.02em}
.lead{margin:0 0 6px;font-size:15.5px;line-height:1.5;max-width:62ch}
.note{margin:0 0 14px;font:500 13px/1.4 var(--body);color:var(--soft)}
.hero{display:block;width:100%;height:auto;border:1.5px solid var(--ink);border-radius:5px;background:#e8eef2;margin-bottom:12px}
h2{margin:18px 0 8px;font:700 12px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.rank{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 12px;border:1.5px solid var(--ink);border-radius:5px;background:var(--card);font-size:14.5px}
.rank b{font-weight:800}.rank .bar{flex:1 1 90px;height:8px;border:1.5px solid var(--ink);border-radius:2px;background:#fff;overflow:hidden}.rank .bar i{display:block;height:100%;background:var(--red)}
.dl{display:grid;gap:8px}
.dc{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1.5px solid var(--ink);border-radius:5px;background:var(--card);cursor:pointer;width:100%}
.dc:hover{background:#fff}.dc:active{transform:translateY(1px)}
.dc .no{width:44px;height:44px;display:grid;place-items:center;border-radius:4px;background:var(--red);color:#fff;font:800 20px/1 var(--mono)}
.dc b{display:block;font:800 17px/1.15 var(--body)}.dc small{display:block;font:700 11px/1.3 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--red);margin:2px 0}
.dc span.ds{display:block;font-size:13.5px;line-height:1.35;color:#39424d}
.st{display:flex;gap:2px}.st svg{width:17px;height:17px}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:5px}
.al{padding:6px 7px;min-width:0;border:1.5px dashed var(--line);border-radius:4px;font-size:12.5px;line-height:1.2;color:#8a929a;display:flex;gap:5px;align-items:center}
.al.on{border:1.5px solid var(--ink);color:var(--ink);background:var(--card);font-weight:700}
.al i{flex:none;width:10px;height:10px;border-radius:50%;border:1.5px solid currentColor}.al.on i{background:var(--okc);border-color:var(--ink)}
details.man{border:1.5px solid var(--ink);border-radius:5px;background:var(--card);margin-bottom:6px}
details.man summary{padding:10px 12px;font:700 15px/1.2 var(--body);cursor:pointer}
details.man>*:not(summary){margin:0 12px 10px;font-size:14.5px;line-height:1.5}
details.man svg{display:block;max-width:300px;width:100%;margin:6px 0}details.man svg text{font-family:var(--body);font-style:italic;font-weight:700}
details.man table{border-collapse:collapse;font:500 14px/1.2 var(--mono)}details.man td,details.man th{border:1.5px solid var(--line);padding:5px 9px;text-align:center}
/* žaidimo ekranas */
#play{display:flex;flex-direction:column;gap:6px}
.bar1{display:flex;gap:6px;align-items:center}
.bar1 .cl{flex:1;min-width:0;font:700 11.5px/1.2 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--soft);overflow:hidden}
.sb{height:38px;padding:0 11px;border:1.5px solid var(--ink);border-radius:5px;background:var(--card);font:700 13px/1 var(--body);cursor:pointer;white-space:nowrap}
.sb:active{background:#e9ebe6}
#stage{position:relative;border:1.5px solid var(--ink);border-radius:5px;overflow:hidden;background:#dfe7ec;height:min(52vh,460px);height:min(calc(100dvh - 374px),460px);min-height:270px;touch-action:none}
#cv{display:block;width:100%;height:100%}
#toast{position:absolute;left:8px;right:8px;top:8px;text-align:center;pointer-events:none}
#toast span{display:inline-block;padding:5px 10px;border-radius:4px;background:rgba(29,37,48,.88);color:#fff;font:600 13px/1.3 var(--body)}
#inst{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.chip{padding:5px 8px;border:1.5px solid var(--ink);border-radius:5px;background:var(--card);min-width:0}
.chip small{display:block;font:700 9.5px/1.2 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b{display:block;font:700 18px/1.15 var(--mono);white-space:nowrap}
.chip.off{border-style:dashed;border-color:var(--line);background:transparent}.chip.off b{font-size:12px;line-height:1.75;color:#8a929a;font-weight:600}
.chip.lad{background:#fdf1e7}.chip.lim b{color:var(--red)}
.chip .z{float:right;margin:-1px -3px 0 4px;width:30px;height:30px;border:1.5px solid var(--ink);border-radius:4px;background:#fff;font:700 13px/1 var(--mono);cursor:pointer}
#pad{display:grid;gap:6px;user-select:none;-webkit-user-select:none}
.row{display:grid;gap:6px}
.r3{grid-template-columns:1fr 1fr 1.25fr}.r4{grid-template-columns:repeat(4,1fr)}.r2{grid-template-columns:1fr 1.6fr}
.kb{position:relative;height:60px;border:1.5px solid var(--ink);border-radius:6px;background:var(--card);font:800 14px/1.1 var(--body);cursor:pointer;touch-action:none;display:grid;place-items:center;padding:2px;box-shadow:0 3px 0 rgba(29,37,48,.18)}
.kb svg{width:26px;height:26px;display:block}.kb small{display:block;font:700 10px/1.1 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}
.kb.dn,.kb:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(29,37,48,.18);background:#e9ebe6}
.kb.pri{background:var(--red);color:#fff;letter-spacing:.06em}.kb.pri.dn,.kb.pri:active{background:#a82818}
.kb.sec{background:var(--amb)}
.kb:disabled{opacity:.4;cursor:default}
.keys{margin:2px 0 0;font:500 11.5px/1.4 var(--mono);color:var(--soft)}
@media (hover:none),(pointer:coarse){.keys{display:none}}
/* langai */
#ov:empty{display:none}
#ov{position:fixed;inset:0;z-index:50;background:rgba(29,37,48,.42);display:flex;align-items:flex-end;justify-content:center;padding:10px;overflow:auto}
#play.cm #stage{height:20vh;min-height:130px}#play.cm #pad,#play.cm .keys{display:none}
.card{pointer-events:auto;width:100%;max-width:560px;max-height:calc(100dvh - 20px);overflow:auto;background:var(--card);border:1.5px solid var(--ink);border-radius:8px;padding:14px 14px 12px;box-shadow:0 10px 30px rgba(29,37,48,.3)}
@media (min-width:700px){#ov{align-items:center}}
.card .k{font:700 11px/1.2 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--red);display:flex;gap:8px;align-items:center}
.card .k::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--red)}
.card h3{margin:6px 0 8px;font:800 20px/1.15 var(--body)}
.card p{margin:0 0 8px;font-size:15px;line-height:1.48}
.card p.cond{padding-left:10px;border-left:3px solid var(--amb)}
.card p.rules{font-size:12.5px;line-height:1.4;color:var(--soft);margin-top:10px}
.card p.tut{padding:8px 10px;background:#fdf1e7;border-radius:5px;font-size:13.5px}
.card ol{margin:0 0 8px;padding-left:20px;font-size:14.5px;line-height:1.5}.card ol li{margin-bottom:5px}
.card .hint{padding:8px 10px;border:1.5px solid var(--line);border-radius:5px;background:#fff;font-size:14px;line-height:1.45;margin-bottom:8px}
.card .hint b.t{display:block;font:700 10.5px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-bottom:2px}
.btns{display:flex;gap:8px;margin-top:10px}.btns button{flex:1;height:48px;border:1.5px solid var(--ink);border-radius:6px;background:#fff;font:800 15px/1 var(--body);cursor:pointer}
.btns button.pri{background:var(--red);color:#fff}
.big{font:800 26px/1.1 var(--mono);margin:4px 0 8px}
.stars{display:flex;gap:4px;margin:6px 0 10px}.stars svg{width:34px;height:34px}
.calc{border:1.5px solid var(--ink);border-radius:6px;background:var(--card);padding:8px}
.calc .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font:700 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.calc .scr{border:1.5px solid var(--ink);border-radius:5px;background:#fff;padding:4px 9px;margin-bottom:6px;min-height:52px}
.calc .ex{font:500 14px/1.3 var(--mono);color:var(--soft);min-height:18px;word-break:break-all}
.calc .rs{font:700 24px/1.2 var(--mono);text-align:right;min-height:29px}
.calc .ks{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.calc .ks button{height:38px;border:1.5px solid var(--ink);border-radius:5px;background:#fff;font:700 16px/1 var(--mono);cursor:pointer;padding:0}
.calc .ks button.f{background:#eef0ec;font-size:13.5px}.calc .ks button.e{background:var(--red);color:#fff}.calc .ks button:active{background:#dfe2dc}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <main id="menu">
    <svg class="hero" viewBox="0 0 560 190" role="img" aria-label="Autokopėčios prie pastato: kopėčios, siena ir žemė sudaro statųjį trikampį">
      <rect width="560" height="190" fill="#e8eef2"/>
      <path d="M0 150h560v40H0z" fill="#aab2b7"/><path d="M0 150h560" stroke="#1d2530" stroke-width="1.5"/>
      <path d="M0 150V104h28V88h30v36h22V96h36v54z" fill="#d3dade"/>
      <rect x="400" y="14" width="170" height="136" fill="#e9dccb" stroke="#1d2530" stroke-width="1.5"/>
      <g fill="#9fb4c2" stroke="#1d2530" stroke-width="1"><rect x="424" y="30" width="20" height="24"/><rect x="464" y="30" width="20" height="24"/><rect x="504" y="30" width="20" height="24"/><rect x="424" y="72" width="20" height="24"/><rect x="464" y="72" width="20" height="24"/><rect x="504" y="72" width="20" height="24"/><rect x="424" y="112" width="20" height="24"/><rect x="464" y="112" width="20" height="24"/><rect x="504" y="112" width="20" height="24"/></g>
      <g fill="#d9dde0" opacity=".96"><circle cx="420" cy="34" r="30"/><circle cx="462" cy="22" r="34"/><circle cx="512" cy="30" r="36"/><circle cx="548" cy="54" r="30"/><circle cx="440" cy="62" r="24"/></g>
      <path d="M196 126L400 40" stroke="#1d2530" stroke-width="6"/><path d="M196 126L400 40" stroke="#e7e9ea" stroke-width="3" stroke-dasharray="5 5"/>
      <path d="M196 126H400V40" fill="none" stroke="#c8321f" stroke-width="1.5" stroke-dasharray="6 4"/><path d="M388 126v-12h12" fill="none" stroke="#c8321f" stroke-width="1.5"/>
      <path d="M232 126a36 36 0 0 0-3-14" fill="none" stroke="#c8321f" stroke-width="2"/>
      <g font-family="system-ui,sans-serif" font-weight="700" font-style="italic" font-size="15" fill="#c8321f"><text x="240" y="121">α</text><text x="286" y="76">L</text><text x="408" y="90">h</text><text x="292" y="143">d</text></g>
      <g stroke="#1d2530" stroke-width="1.5" stroke-linejoin="round"><rect x="176" y="134" width="118" height="9" fill="#39424d"/><rect x="176" y="124" width="84" height="12" fill="#c8321f"/><path d="M262 143v-27h20l12 10v17z" fill="#c8321f"/><path d="M268 121h13l8 7h-21z" fill="#cfe3ee"/><circle cx="196" cy="126" r="5" fill="#8e979e"/>
      <circle cx="194" cy="146" r="8" fill="#1d2530"/><circle cx="212" cy="146" r="8" fill="#1d2530"/><circle cx="276" cy="146" r="8" fill="#1d2530"/><rect x="270" y="111" width="8" height="5" fill="#2b6fd6"/></g>
      <g fill="#8e979e"><circle cx="194" cy="146" r="3"/><circle cx="212" cy="146" r="3"/><circle cx="276" cy="146" r="3"/></g>
    </svg>
    <div class="kick" id="kick"></div><h1 id="h1"></h1><p class="lead" id="lead"></p><p class="note" id="note"></p>
    <div class="rank" id="rank"></div>
    <h2 id="disT"></h2><div class="dl" id="dl"></div>
    <h2 id="albT"></h2><div class="album" id="album"></div>
    <h2 id="manT"></h2><div id="manual"></div>
  </main>
  <main id="play" hidden>
    <div class="bar1"><div class="cl" id="callL"></div><button class="sb" id="bTask" type="button"></button><button class="sb" id="bCalc" type="button"></button><button class="sb" id="bQuit" type="button" aria-label="">✕</button></div>
    <div id="stage"><canvas id="cv"></canvas><div id="toast"></div></div>
    <div id="inst"></div>
    <div id="pad">
      <div class="row r3" id="padD">
        <button class="kb" type="button" data-h="back"><span><svg viewBox="0 0 24 24"><path d="M15 4L7 12l8 8" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
        <button class="kb" type="button" data-h="fwd"><span><svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
        <button class="kb sec" type="button" id="bLegs"></button>
      </div>
      <div id="padL" hidden>
        <div class="row r4">
          <button class="kb" type="button" data-h="aDn"><span><svg viewBox="0 0 24 24"><path d="M4 9l8 8 8-8" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><small id="lAd"></small></span></button>
          <button class="kb" type="button" data-h="aUp"><span><svg viewBox="0 0 24 24"><path d="M4 15l8-8 8 8" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><small id="lAu"></small></span></button>
          <button class="kb" type="button" data-h="lDn"><span><svg viewBox="0 0 24 24"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg><small id="lLd"></small></span></button>
          <button class="kb" type="button" data-h="lUp"><span><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg><small id="lLu"></small></span></button>
        </div>
        <div class="row r2" style="margin-top:6px">
          <button class="kb" type="button" id="bStow"></button>
          <button class="kb pri" type="button" id="bGo"></button>
        </div>
      </div>
    </div>
    <div id="calc" class="calc" hidden></div>
    <p class="keys" id="keys"></p>
  </main>
</div>
<div id="ov"></div>
<script>
"use strict";
const T = window.MK_T, K = window.MK_GK, GAME = "gelbetoju-kopecios", CKEY = "mk-" + GAME + "-karjera";
const $ = id => document.getElementById(id), n = T.num, f1 = x => n(K.r1(x).toFixed(1));
const cv = $("cv"), g = cv.getContext("2d");
let S = null, W = 0, H = 0, DPR = 1, raf = 0, lastT = 0, toastT = 0;
const career = () => Object.assign({ saved: {}, seen: {}, tut: 0 }, MK.get(CKEY, {}));
const STAR = on => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 6 6.5.9-4.7 4.6 1.1 6.5L12 17.5l-5.8 3.1 1.1-6.5L2.6 9.5l6.5-.9z" fill="${on ? "#e9a23b" : "none"}" stroke="#1d2530" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
const stars3 = k => [0, 1, 2].map(i => STAR(i < k)).join("");

/* ============================== meniu ============================== */
function totalStars(){ const b = MK.best(GAME); return K.DISTRICTS.reduce((a, D) => a + (+b[D.id] || 0), 0); }
const rankOf = s => s >= 14 ? 4 : s >= 10 ? 3 : s >= 6 ? 2 : s >= 2 ? 1 : 0;
function showMenu(){
  S = null; $("calc").hidden = true; $("play").classList.remove("cm"); $("play").hidden = true; $("menu").hidden = false; $("ov").innerHTML = ""; $("ov").className = "";
  const b = MK.best(GAME), tot = totalStars(), C = career();
  $("rank").innerHTML = `<span>${T.rankT}: <b>${T.ranks[rankOf(tot)]}</b></span><span class="bar" aria-hidden="true"><i style="width:${Math.round(tot / 15 * 100)}%"></i></span><span>${T.starsOf(tot, 15)}</span>`;
  $("dl").innerHTML = K.DISTRICTS.map((D, i) => { const d = T.districts[D.id];
    return `<button class="dc" type="button" data-d="${i}"><span class="no">${i + 1}</span><span><b>${d.name}</b><small>${d.sub}</small><span class="ds">${d.desc}</span></span><span class="st" aria-label="${T.starsOf(+b[D.id] || 0, 3)}">${stars3(+b[D.id] || 0)}</span></button>`; }).join("");
  const all = T.who.flat();
  $("album").innerHTML = all.map(w => `<div class="al${C.saved[w[0]] ? " on" : ""}"><i></i>${C.saved[w[0]] ? w[1] : "· · ·"}</div>`).join("");
  window.scrollTo(0, 0);
}
$("dl").addEventListener("click", e => { const b = e.target.closest("[data-d]"); if(!b) return; MK.sfx.tap(); startShift(+b.dataset.d); });

/* ============================== pamaina ============================== */
function startShift(di){
  const D = K.DISTRICTS[di], C = career(), seen = C.seen[D.id] || {};
  let calls = K.round(D, seen);
  const tut = di === 0 && !C.tut;
  if(tut) calls = [K.ALL.find(c => c.id === "110")].concat(calls.filter(c => !(c.h === 1 && c.p === 1)).slice(0, D.n - 1));
  S = { di, D, calls, ci: -1, pts: 0, first: 0, savedN: 0, tut, t: 0 };
  $("menu").hidden = true; $("play").hidden = false; resize(); nextCall(); window.scrollTo(0, 0);
}
function nextCall(){
  if(calcIsOpen()) calcClose();
  S.ci++; const c = S.calls[S.ci], C = career();
  const task = K.gen(c, { clear: S.tut && S.ci === 0 });
  const used = S.usedWho || (S.usedWho = {}), list = T.who[c.t].filter(w => !used[w[0]]);
  const fresh = list.filter(w => !C.saved[w[0]]), who = MK.pick(fresh.length ? fresh : list.length ? list : T.who[c.t]); used[who[0]] = 1;
  Object.assign(S, { sc: 0, task, who, x: task.start, odo0: task.start, a: K.AMIN, L: K.LMIN, mode: "drive", legs: 0, tries: 0, smoke: task.clear ? 0 : 1, reveal: 0, res: null, climb: 0, held: {}, acc: 0, holdT: 0, wheel: 0, seed: 1 + Math.floor(Math.random() * 9999) });
  S.roof = c.t === 1 ? task.mh : Math.ceil((task.mh + 3) / 3) * 3;
  S.fh = task.fh || 3;
  buildSmoke(); ui(); brief(true);
}
function ui(){
  if(!S) return;
  $("callL").textContent = `${T.districts[S.D.id].name} ${S.ci + 1}/${S.calls.length}`;
  const lad = S.mode !== "drive";
  $("padD").hidden = lad; $("padL").hidden = !lad;
  const jam = S.task.p === 2;
  document.querySelectorAll('[data-h="aUp"],[data-h="aDn"]').forEach(b => b.disabled = jam);
}
function toast(m){ $("toast").innerHTML = `<span>${m}</span>`; toastT = 2.2; }

/* dispečerio pranešimas */
function briefHtml(){
  const t = S.task, B = T.b, tg = T.tgtName[t.t], out = [`<p>${S.who[2]}</p>`]; let info;
  if(t.h === 1) info = B.h1[t.t](n(t.mh));
  else if(t.h === 2) info = t.t === 1 ? B.h2[1](t.floors, n(t.fh)) : B.h2[t.t](t.floor, n(t.fh), n(t.sill));
  else info = B["h" + t.h](tg);

function calcShow(){ if($("cEx")){ $("cEx").textContent = cEx; $("cRs").textContent = cRes; } }
function calcEval(src){
