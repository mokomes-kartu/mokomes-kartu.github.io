<style>
/* Meniu: peizažas su jau surinktais gyvūnais, albumo kortelė ir lygiai.
   Žaidimas: viršuje dienos juosta (saulė → mėnulis, 8 pėdutės), po ja – vienas didelis peizažas: gyvūnas stovi viduryje,
   vaikas spaudžia jo namus (arba žiemos užsiėmimą), ir gyvūnas ten nueina. Maisto užduotyje – pieva ir trys patiekalai. */
body{--ac:#2fa84f;--ac-ink:#fff;--ac-soft:#dcf5d9}
.la svg{width:56px;height:47px}
.zl{font:800 14px var(--kid);fill:#121a33}

/* ---------- meniu ---------- */
.mk-hero{padding-top:0}
#heroArt{width:min(100%,46vh)}
.mk-hero h1{margin-top:8px}
.mk-hero p{max-width:32ch;font-size:17px}
.goal{width:100%;max-width:520px;margin:0 auto 14px;padding:12px 14px;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 2.5px var(--ink),0 5px 0 rgba(18,26,51,.14);
  display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;align-items:center}
.goal-who{width:54px;height:54px;border-radius:50%;background:var(--ac-soft);box-shadow:inset 0 0 0 2.5px var(--ink);display:grid;place-items:center}
.goal-who svg{width:32px;height:32px}
.goal p{margin:0 0 6px;font:800 16.5px/1.25 var(--kid)}
.goal-bar{height:14px;border-radius:999px;background:#eadfba;overflow:hidden;box-shadow:inset 0 0 0 2px var(--ink)}
.goal-bar i{display:block;height:100%;background:var(--ac);border-radius:999px 0 0 999px}
.goal .mk-btn{grid-column:1/-1;min-height:46px;font-size:18px}

/* ---------- albumas ---------- */
.alb-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
.alb-head h2{margin:0;font:800 clamp(26px,7vw,36px)/1.1 var(--kid)}
.alb-head span{font:800 18px/1 var(--kid);color:var(--soft);white-space:nowrap}
.alb{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.tile{display:grid;justify-items:center;gap:2px;padding:8px 4px 8px;border:0;border-radius:18px;background:var(--bg,#eef7e6);box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.14);min-width:0}
button.tile{cursor:pointer}
.tile svg{width:100%;max-width:92px;height:auto}
.tile b{font:800 13.5px/1.15 var(--kid);text-align:center;overflow-wrap:anywhere}
.tile.lock{background:#f3ecd6;box-shadow:inset 0 0 0 2px #d8c99a}
.tile.lock svg{filter:brightness(0);opacity:.13}
.tile.lock b{color:#b3a67c}
.card-art{width:190px;height:158px;border-radius:26px;background:var(--bg,#eef7e6);box-shadow:inset 0 0 0 3px var(--ink);display:grid;place-items:center}
.card-art svg{width:164px;height:137px}
.facts{display:grid;gap:4px;margin:2px 0 0;padding:0;list-style:none;font:700 17px/1.3 var(--body);color:var(--ink)}

/* ---------- žaidimas ---------- */
.paws{display:flex;justify-content:center;align-items:center;gap:5px;margin:0 0 10px}
.paws i{width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px #d8c99a;display:grid;place-items:center;transition:transform .2s}
.paws i svg{width:18px;height:18px;opacity:.25}
.paws i.cur{box-shadow:inset 0 0 0 3px var(--ink);transform:translateY(-3px)}
.paws i.got{background:#8fe39b;box-shadow:inset 0 0 0 2.5px var(--ink);animation:mkPop .4s cubic-bezier(.2,1.6,.4,1)}
.paws i.got svg{opacity:1}
.paws i.miss{background:#e6e0cf;box-shadow:inset 0 0 0 2px #b9ad8a}
.paws > svg{width:26px;height:26px;flex:none}
@media (max-width:360px){.paws i{width:26px;height:26px}.paws > svg{width:22px;height:22px}}

.scene{position:relative;width:min(100%,58vh);margin:0 auto;aspect-ratio:1;border-radius:9.5%;overflow:hidden;box-shadow:0 6px 0 rgba(18,26,51,.15)}
.scene.wide{width:min(100%,92vh);aspect-ratio:360/230;border-radius:9.5%/14.8%}
.scene > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 3px var(--ink);pointer-events:none;z-index:5;transition:background 1.6s}
.scene.dusk::after{background:linear-gradient(rgba(255,150,90,.38),rgba(120,90,220,.34))}
.zbtn{position:absolute;border:0;padding:0;background:transparent;border-radius:15%/16.5%;cursor:pointer;z-index:2;transition:background .2s}
.zbtn.wide{border-radius:7.5%/21%}
.zbtn:active{background:rgba(255,255,255,.3)}
.zbtn.no{background:rgba(255,249,230,.62);pointer-events:none}
.zbtn.ok{box-shadow:inset 0 0 0 5px var(--good);animation:mkPulse .6s}
.res{position:absolute;width:15%;transform:translate(-50%,-50%);pointer-events:none;z-index:1;animation:mkPop .4s cubic-bezier(.2,1.6,.4,1)}
.res svg,.who svg{display:block;width:100%;height:auto;filter:drop-shadow(0 2px 0 rgba(18,26,51,.18))}
.who{position:absolute;left:50%;top:49%;width:30%;transform:translate(-50%,-50%);z-index:3;pointer-events:none}
.who.big{top:53%;width:42%}
.who.in svg{animation:mkIn .45s cubic-bezier(.2,1.4,.4,1)}
.who.go{transition:left .6s cubic-bezier(.4,0,.2,1),top .6s cubic-bezier(.4,0,.2,1),width .6s cubic-bezier(.4,0,.2,1)}
.who.happy svg{animation:mkHop .5s cubic-bezier(.3,1.6,.5,1) 2}
.who.bye{transition:opacity .4s,transform .4s;opacity:0;transform:translate(-50%,-50%) scale(.6)}
.nm{display:flex;justify-content:center;margin-top:-2px;transition:opacity .25s}
.nm b{flex:none;padding:3px 10px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2px var(--ink);font:800 clamp(14px,4vw,18px)/1.15 var(--kid);white-space:nowrap}
.who.big .nm b{font-size:clamp(17px,5vw,22px)}
.who.go .nm{opacity:0}
.foods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(100%,92vh);margin:12px auto 0}
.food{display:grid;justify-items:center;align-content:start;gap:2px;min-height:112px;padding:8px 4px 8px;border:0;border-radius:22px;cursor:pointer;background:var(--card);
  box-shadow:inset 0 0 0 2.5px var(--ink),0 6px 0 rgba(18,26,51,.18);transition:transform .1s}
.food:active{transform:translateY(3px)}
.food svg{width:66px;height:66px}
.food b{font:800 clamp(15px,4.4vw,19px)/1.1 var(--kid);text-align:center}
.food.ok{box-shadow:inset 0 0 0 4px var(--good),0 6px 0 rgba(18,26,51,.18);background:#e9fbe9}
.food.no{opacity:.4;pointer-events:none}
.flyf{position:fixed;left:0;top:0;width:66px;height:66px;z-index:40;pointer-events:none}
.mk-guide{margin-top:12px}
</style>
</head>

<div class="mk-app" id="app">

    <div class="mk-hero">
      <div class="mk-hero-art scene" id="heroArt"></div>
      <h1>Miško <em>namai</em></h1>
      <p id="heroP"></p>
    </div>
    <div class="goal" id="goal"></div>
    <div id="levels"></div>
  </section>
  <section id="album" hidden>
    <div class="alb-head"><h2 id="albT"></h2><span id="albN"></span></div>
    <div class="alb" id="alb"></div>
    <div style="display:grid;margin-top:16px"><button type="button" class="mk-btn alt" id="albBack"></button></div>
  </section>
  <section id="play" hidden>
    <div class="paws" id="paws" role="img"></div>
    <div class="scene" id="sc-h" hidden></div>
    <div class="scene" id="sc-w" hidden></div>
    <div class="scene wide" id="sc-f" hidden></div>
    <div class="foods" id="foods" hidden></div>
    <div id="guideBox"></div>
  </section>
</div>

  look: "Žiūrėk:",
  lives: (n, locs) => `${n} gyvena ${locs.join(", o kartais ir ")}.`,
  eats: (n, food) => `${n} mėgsta ${food}.`,
  winter: { isskrenda: n => `${n} rudenį išskrenda į šiltus kraštus, o pavasarį grįžta.`, miega: n => `${n} žiemą miega.`, budrauja: n => `${n} žiemą nemiega – ieško maisto sniege.` },
  newInAlbum: "<b>Naujas gyvūnas albume!</b>",
  done: "Vakaras! Visi gyvūnai rado, ko ieškojo. Labanakt, miške!",
  result: n => `Iš pirmo karto padėjai: ${n} iš ${ROUND}.`,
  resNew: n => `Į albumą pateko ${n} ${many(n, "naujas gyvūnas", "nauji gyvūnai", "naujų gyvūnų")}.`,
  resAlbum: (n, t) => `Albume jau ${n} iš ${t}.`,
  goalEmpty: "Albumas dar tuščias. Padėk gyvūnui iš pirmo karto – ir jis atsiras albume!",
  goal: (n, t) => `Albume ${animals(n)} iš ${t}.`,
  goalAll: "Surinkai visus gyvūnus. Šaunu!",
  openAlbum: "Atversti albumą",
  album: "Mano albumas",
  back: "Grįžti",
  ok: "Gerai",
  pawsLabel: (n, t) => `Padėta gyvūnų: ${n} iš ${t}`,
  heroLabel: n => `Peizažas su miško, vandens, pievos ir ūkio gyvūnais. Albume ${animals(n)}.`
};
const LEVELS = [
  { id: "namai", art: "Lapė", kinds: ["h"] }, { id: "maistas", art: "Kiškis", kinds: ["f"] }, { id: "ziema", art: "Meška", kinds: ["w"] }, { id: "visko", art: "Pelėda", kinds: ["h", "f", "w"] }
].map((l, i) => Object.assign(l, { name: T.levels[i][0], sub: T.levels[i][1], art: `<span class="la"><svg viewBox="0 0 120 100" aria-hidden="true">${ART[l.art]}</svg></span>` }));

/* ---------- scenos (360×360; maisto scena – 360×230) ---------- */
const pill = (x, y, text, end) => { const w = Math.round(text.length * 7.6 + 22), x0 = end ? x - w : x;
  return `<rect x="${x0}" y="${y}" width="${w}" height="24" rx="12" fill="#fff" stroke="${K}" stroke-width="2.2"/><text class="zl" x="${x0 + w / 2}" y="${y + 16.6}" text-anchor="middle">${text}</text>`; };
const fir = (x, y, s, snow) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-3.5" y="-10" width="7" height="12" fill="#8a5a36"/><path d="M0-56l15 26h-30zM0-38l20 30h-40z" fill="#3f9a4a"/>${snow ? '<path d="M0-56l8 14q-8 5-16 0zM0-38l10 15q-10 6-20 0z" fill="#fff"/>' : ""}</g>`;
const leafy = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-4" y="-22" width="8" height="24" fill="#8a5a36"/><circle cx="0" cy="-36" r="20" fill="#58c45a"/><circle cx="-7" cy="-43" r="7" fill="#7ad977" opacity=".7"/></g>`;
const zoneRect = (b, fill) => `<rect x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" rx="26" fill="${fill}" stroke="${K}" stroke-width="3"/>`;
const SCN = {
  h: { el: null, zones: {
    miskas: { box: [8, 8, 164, 148], slots: [[40, 80], [90, 106], [36, 128], [94, 142], [138, 112]] },
    ukis:   { box: [188, 8, 164, 148], slots: [[234, 110], [286, 86], [330, 102], [284, 136], [332, 140]] },
    vanduo: { box: [8, 204, 164, 148], slots: [[40, 236], [94, 228], [44, 288], [102, 282], [138, 320]] },
    pieva:  { box: [188, 204, 164, 148], slots: [[268, 230], [322, 238], [258, 284], [316, 290], [226, 320]] } } },
  w: { el: null, zones: {
    isskrenda: { box: [8, 8, 344, 124], wide: true, slots: [[54, 86], [112, 102], [250, 102], [302, 96], [192, 72]] },
    miega:     { box: [8, 188, 164, 164], slots: [[44, 232], [100, 246], [40, 284], [96, 294], [142, 268]] },
    budrauja:  { box: [188, 188, 164, 164], slots: [[244, 246], [300, 232], [334, 272], [258, 296], [312, 300]] } } },
  f: { el: null, zones: {} }
};
function homeSvg(label, badge){
  const Z = SCN.h.zones;
  return `<svg viewBox="0 0 360 360" ${label ? `role="img" aria-label="${label}"` : 'aria-hidden="true"'}><rect width="360" height="360" fill="#dff1cb"/>
    ${zoneRect(Z.miskas.box, "#b4e09c")}${leafy(96, 64, 0.9)}${fir(124, 66, 0.95)}${fir(152, 76, 1.1)}${pill(18, 18, HOMES.miskas.t)}
    ${zoneRect(Z.ukis.box, "#ffe6c2")}<g transform="translate(200 24)"><path d="M0 24l29-22 29 22v36h-58z" fill="#e5243b" stroke="${K}" stroke-width="2.6" stroke-linejoin="round"/>
      <rect x="19" y="34" width="20" height="26" fill="#fff3d6" stroke="${K}" stroke-width="2"/><path d="M19 34l20 26M39 34l-20 26" stroke="${K}" stroke-width="1.5"/><rect x="23" y="13" width="12" height="9" rx="2" fill="#fff3d6" stroke="${K}" stroke-width="1.8"/></g>
      <path d="M262 66h34M266 60v14M278 60v14M290 60v14" stroke="#c9914a" stroke-width="3.5" stroke-linecap="round"/>${pill(342, 18, HOMES.ukis.t, true)}
    ${zoneRect(Z.vanduo.box, "#a6dffb")}<path d="M22 258q9-6 18 0t18 0M70 250q9-6 18 0t18 0M30 320q9-6 18 0M96 306q9-6 18 0t18 0M118 258q9-6 18 0" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".85"/>
      <path d="M152 346q-2-22 2-34M160 346q2-26-1-40" fill="none" stroke="#3f9a4a" stroke-width="3.4" stroke-linecap="round"/><rect x="150" y="304" width="7" height="16" rx="3.5" fill="#8a5a36"/><rect x="156" y="296" width="7" height="16" rx="3.5" fill="#8a5a36"/>
      ${pill(18, 322, HOMES.vanduo.t)}
    ${zoneRect(Z.pieva.box, "#eef6a6")}${[[206, 250, "#ff7fb0"], [300, 262, "#fff"], [344, 306, "#ff7fb0"], [236, 268, "#fff"], [288, 322, "#ffb21a"], [340, 216, "#fff"], [208, 290, "#ffb21a"]].map(([x, y, c]) =>
      `<path d="M${x} ${y + 9}v-7" stroke="#3f9a4a" stroke-width="2.2" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="4.6" fill="${c}"/><circle cx="${x}" cy="${y}" r="1.8" fill="#ffc61a"/>`).join("")}${pill(342, 322, HOMES.pieva.t, true)}
    <circle cx="180" cy="180" r="66" fill="#fff7dc" stroke="${K}" stroke-width="3"/>${badge || ""}</svg>`;
}
function winterSvg(){
  const Z = SCN.w.zones;
  return `<svg viewBox="0 0 360 360" aria-hidden="true"><rect width="360" height="360" fill="#e3f1ff"/>
    ${[[30, 160], [330, 156], [176, 30], [20, 300], [344, 340]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3" fill="#fff"/>`).join("")}
    ${zoneRect(Z.isskrenda.box, "#bfe3ff")}<circle cx="318" cy="50" r="34" fill="#ffe27a" opacity=".45"/><circle cx="318" cy="50" r="22" fill="#ffd84a"/>
      <path d="M262 30q6-6 12 0q6-6 12 0M236 52q5-5 10 0q5-5 10 0" fill="none" stroke="${K}" stroke-width="2.2" stroke-linecap="round"/>
      <ellipse cx="80" cy="120" rx="50" ry="12" fill="#fff" opacity=".8"/><ellipse cx="240" cy="126" rx="60" ry="10" fill="#fff" opacity=".7"/>${pill(18, 18, WINTER.isskrenda.t)}
    ${zoneRect(Z.miega.box, "#f4f9ff")}<path d="M10 330q60-34 160-12v32h-160z" fill="#dcebfb"/><path d="M112 350a26 26 0 0 1 52 0z" fill="#5a4a3a"/>
      <text x="126" y="320" font-family="Grandstander,Comic Sans MS,sans-serif" font-weight="800" font-size="15" fill="#7a8fb5">Zzz</text>${pill(18, 322, WINTER.miega.t)}
    ${zoneRect(Z.budrauja.box, "#f4f9ff")}<path d="M190 334q70-26 160-6v22h-160z" fill="#dcebfb"/>${fir(204, 318, 0.7, true)}${fir(340, 222, 0.5, true)}${pill(342, 322, WINTER.budrauja.t, true)}
    <circle cx="180" cy="176" r="64" fill="#fff" stroke="${K}" stroke-width="3"/></svg>`;
}
function feedSvg(){
  return `<svg viewBox="0 0 360 230" aria-hidden="true"><rect width="360" height="230" fill="#cfeeff"/><circle cx="52" cy="46" r="22" fill="#ffd84a"/>
    <g fill="#fff" opacity=".95"><ellipse cx="270" cy="44" rx="34" ry="13"/><circle cx="258" cy="35" r="13"/><circle cx="282" cy="32" r="15"/><ellipse cx="150" cy="28" rx="24" ry="9"/><circle cx="144" cy="22" r="9"/></g>
    <ellipse cx="60" cy="186" rx="150" ry="50" fill="#bfe8a8"/><ellipse cx="300" cy="190" rx="160" ry="56" fill="#a9df90"/><rect y="176" width="360" height="60" fill="#9bdc7a"/>
    ${leafy(34, 186, 1.5)}${fir(330, 184, 1.2)}${fir(306, 190, 0.8)}
    ${[[84, 206, "#ff7fb0"], [112, 216, "#fff"], [262, 210, "#ffb21a"], [286, 218, "#fff"], [20, 214, "#ffb21a"]].map(([x, y, c]) => `<path d="M${x} ${y + 9}v-7" stroke="#3f9a4a" stroke-width="2.2" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="4.6" fill="${c}"/>`).join("")}</svg>`;
}
const PAW = `<svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16" rx="6.2" ry="5" fill="${K}"/><circle cx="5" cy="10" r="2.6" fill="${K}"/><circle cx="9.6" cy="6" r="2.7" fill="${K}"/><circle cx="14.6" cy="6" r="2.7" fill="${K}"/><circle cx="19.2" cy="10" r="2.6" fill="${K}"/></svg>`;
const SUN = `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5.5" fill="#ffc61a" stroke="${K}" stroke-width="1.6"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2" stroke="${K}" stroke-width="1.8" stroke-linecap="round"/></svg>`;
const MOON = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3a9 9 0 1 0 4 14A8 8 0 0 1 17 3z" fill="#c9cfe6" stroke="${K}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
const animalSvg = n => `<svg viewBox="0 0 120 100" aria-hidden="true">${ART[n]}</svg>`;
const pct = v => (v / 3.6).toFixed(2) + "%";
function zoneButtons(sc, names){
  return Object.keys(sc.zones).map(id => { const b = sc.zones[id].box;
    return `<button type="button" class="zbtn${sc.zones[id].wide ? " wide" : ""}" data-id="${id}" aria-label="${names[id].t}" style="left:${pct(b[0])};top:${pct(b[1])};width:${pct(b[2])};height:${pct(b[3])}"></button>`; }).join("");
}

/* ---------- elementai ---------- */
const $ = id => document.getElementById(id);
const app = $("app"), menu = $("menu"), play = $("play"), album = $("album"), foods = $("foods"), pawsEl = $("paws");
SCN.h.el = $("sc-h"); SCN.w.el = $("sc-w"); SCN.f.el = $("sc-f");
const saved = MK.get("mokomeskartu-klase", 0);
app.prepend(MK.top({ title: "Miško namai", grade: GRADES.includes(saved) ? saved : GRADES[0] }));
$("heroP").textContent = T.hero; $("albBack").textContent = T.back; $("albT").textContent = T.album;
$("guideBox").innerHTML = MK.guide("");
const guide = $("guideBox").firstElementChild;
const save = Object.assign({ got: [] }, MK.get(STORE, {}));
const got = new Set((save.got || []).filter(n => ART[n]));
const who = document.createElement("div");

/* ---------- meniu ir albumas ---------- */
function drawMenu(){
  /* peizaže apsigyvena jau surinkti gyvūnai (iki penkių kiekvienuose namuose) */
  const used = {}; let res = "";
  A.forEach(a => { if(!got.has(a.n) || !a.h) return; const z = a.h[0], k = used[z] = (used[z] || 0) + 1; if(k > 5) return;
    const [x, y] = SCN.h.zones[z].slots[k - 1]; res += `<div class="res" style="left:${pct(x)};top:${pct(y)};animation:none">${animalSvg(a.n)}</div>`; });
  const badge = `<g transform="translate(166 132) scale(1.15)">${PAW.replace(/<\/?svg[^>]*>/g, "")}</g><text x="180" y="204" text-anchor="middle" font-family="Grandstander,Comic Sans MS,sans-serif" font-weight="800" font-size="46" fill="${K}">${got.size}</text>
    <text class="zl" x="180" y="226" text-anchor="middle" style="font-size:16px">iš ${A.length}</text>`;
  $("heroArt").innerHTML = homeSvg(T.heroLabel(got.size), badge) + res;
  const n = got.size, t = A.length;
  $("goal").innerHTML = `<span class="goal-who" aria-hidden="true">${PAW}</span><div><p>${n === 0 ? T.goalEmpty : n >= t ? T.goalAll : T.goal(n, t)}</p>
    <div class="goal-bar" aria-hidden="true"><i style="width:${Math.max(n ? 4 : 0, Math.round(n / t * 100))}%"></i></div></div><button type="button" class="mk-btn alt" id="albOpen">${T.openAlbum}</button>`;
}
function show(sec){ [menu, play, album].forEach(s => { s.hidden = s !== sec; }); window.scrollTo(0, 0); }
function showMenu(){ drawMenu(); MK.levels($("levels"), { game: GAME, levels: LEVELS, onPick: start }); show(menu); }
const tileBg = a => a.h ? HOMES[a.h[0]].bg : "#e8eefc";
function showAlbum(){
  $("albN").textContent = `${got.size} / ${A.length}`;
  $("alb").innerHTML = A.map((a, i) => got.has(a.n)
    ? `<button type="button" class="tile" data-i="${i}" style="--bg:${tileBg(a)}">${animalSvg(a.n)}<b>${a.n}</b></button>`
    : `<div class="tile lock">${animalSvg(a.n)}<b>?</b></div>`).join("");
  show(album);
}
function factsOf(a){
  const out = [];
  if(a.h) out.push(T.lives(a.n, a.h.map(h => HOMES[h].loc)));
  if(a.f) out.push(T.eats(a.n, FOOD[a.f[0]][1]));
  if(a.w) out.push(T.winter[a.w](a.n));
  return out;
}
function showCard(a){
  const ov = document.createElement("div"); ov.className = "mk-ov";
  ov.innerHTML = `<div class="mk-res" role="dialog" aria-modal="true" aria-labelledby="cT"><div class="card-art" style="--bg:${tileBg(a)}">${animalSvg(a.n)}</div>
    <h2 id="cT">${a.n}</h2><ul class="facts">${factsOf(a).map(f => `<li>${f}</li>`).join("")}</ul><div class="mk-res-b"><button type="button" class="mk-btn">${T.ok}</button></div></div>`;
  document.body.appendChild(ov);
  const btn = ov.querySelector("button");
  ov.addEventListener("click", e => { if(e.target === ov || e.target === btn){ MK.sfx.tap(); ov.remove(); } });
  setTimeout(() => btn.focus({ preventScroll: true }), 60);
}
$("goal").addEventListener("click", e => { if(e.target.closest("#albOpen")){ MK.unlock(); MK.sfx.tap(); showAlbum(); } });
$("alb").addEventListener("click", e => { const b = e.target.closest("button.tile"); if(b){ MK.sfx.tap(); showCard(A[+b.dataset.i]); } });
$("albBack").addEventListener("click", () => { MK.sfx.tap(); showMenu(); });

/* ---------- žaidimo eiga ---------- */
let lvl = 0, L = null, list = [], ti = 0, cur = null, tries = 0, firstOK = 0, newCount = 0, busy = false, marks = [];
const has = (a, kind) => kind === "h" ? a.h : kind === "f" ? a.f : a.w;
function makeList(){
  const out = [], used = new Set();
  for(let i = 0; i < ROUND; i++){
    const kind = MK.pick(L.kinds), pool = A.filter(a => has(a, kind) && !used.has(a.n)), fresh = pool.filter(a => !got.has(a.n));
    const a = fresh.length && Math.random() < 0.7 ? MK.pick(fresh) : MK.pick(pool); // dažniau siūlomi dar nesurinkti gyvūnai
    used.add(a.n); out.push({ a, kind });
  }
  return out;
}
function drawPaws(){
  pawsEl.setAttribute("aria-label", T.pawsLabel(firstOK, ROUND));
  pawsEl.innerHTML = SUN + Array.from({ length: ROUND }, (_, k) => `<i class="${marks[k] || (k === ti ? "cur" : "")}">${PAW}</i>`).join("") + MOON;
}
function start(i){
  lvl = i; L = LEVELS[i]; list = makeList(); ti = 0; firstOK = 0; newCount = 0; marks = [];
  SCN.h.el.innerHTML = homeSvg() + zoneButtons(SCN.h, HOMES); SCN.w.el.innerHTML = winterSvg() + zoneButtons(SCN.w, WINTER); SCN.f.el.innerHTML = feedSvg();
  ["h", "w", "f"].forEach(k => { SCN[k].used = {}; SCN[k].el.classList.remove("dusk"); });
  show(play); next();
}
function next(){
  if(ti >= ROUND) return finish();
  cur = list[ti]; tries = 0; busy = false; drawPaws();
  const k = cur.kind, a = cur.a, sc = SCN[k];
  ["h", "w", "f"].forEach(x => { SCN[x].el.hidden = x !== k; });
  foods.hidden = k !== "f";
  sc.el.querySelectorAll(".zbtn").forEach(b => b.classList.remove("no", "ok"));
  who.className = "who in" + (k === "f" ? " big" : ""); who.removeAttribute("style");
  who.innerHTML = `${animalSvg(a.n)}<span class="nm"><b>${a.n}</b></span>`;
  sc.el.appendChild(who);
  if(k === "f") foods.innerHTML = MK.shuffle([a.f[0], ...MK.shuffle(a.no).slice(0, 2)]).map(id =>
    `<button type="button" class="food" data-id="${id}"><svg viewBox="0 0 60 60" aria-hidden="true">${FOODART[id]}</svg><b>${FOOD[id][0]}</b></button>`).join("");
  const nm = a.n.toLowerCase();
  MK.say(guide, k === "h" ? T.askHome(nm) : k === "f" ? T.askFood(nm) : T.askWinter(nm));
}
function isRight(id){ const a = cur.a; return cur.kind === "h" ? a.h.includes(id) : cur.kind === "f" ? a.f.includes(id) : a.w === id; }
function fact(){ const a = cur.a; return cur.kind === "h" ? T.lives(a.n, a.h.map(h => HOMES[h].loc)) : cur.kind === "f" ? T.eats(a.n, FOOD[a.f[0]][1]) : T.winter[a.w](a.n); }
/* Gyvūnas nueina į pasirinktą vietą ir ten lieka. */
async function settle(sc, id){
  const z = sc.zones[id], k = sc.used[id] = (sc.used[id] || 0) + 1, slot = (k - 1) % z.slots.length, [x, y] = z.slots[slot];
  who.classList.remove("in"); void who.offsetWidth; who.classList.add("go");
  who.style.left = pct(x); who.style.top = pct(y); who.style.width = "15%";
  await MK.wait(640);
  const old = sc.el.querySelector(`.res[data-s="${id}${slot}"]`); if(old) old.remove();
  const r = document.createElement("div"); r.className = "res"; r.dataset.s = id + slot; r.style.left = pct(x); r.style.top = pct(y); r.style.animation = "none";
  r.innerHTML = animalSvg(cur.a.n); sc.el.appendChild(r); who.remove();
}
/* Maistas nuskrenda pas gyvūną, jis pasidžiaugia ir išeina. */
async function feed(btn){
  const from = btn.querySelector("svg").getBoundingClientRect(), to = who.querySelector("svg").getBoundingClientRect();
  const f = document.createElement("div"); f.className = "flyf"; f.innerHTML = btn.querySelector("svg").outerHTML; document.body.appendChild(f);
  const x1 = from.left, y1 = from.top, x2 = to.left + to.width * 0.62 - 33, y2 = to.top + to.height * 0.5 - 33;
  await f.animate([{ transform: `translate(${x1}px,${y1}px) scale(1)` }, { transform: `translate(${(x1 + x2) / 2}px,${Math.min(y1, y2) - 40}px) scale(1.15)`, offset: 0.5 },
    { transform: `translate(${x2}px,${y2}px) scale(.3)`, opacity: 0.4 }], { duration: 520, easing: "ease-in-out" }).finished.catch(() => {});
  f.remove(); who.classList.remove("in"); void who.offsetWidth; who.classList.add("happy"); MK.sfx.coins();
  await MK.wait(1050); who.classList.add("bye"); await MK.wait(380); who.remove();
}
async function right(btn, auto){
  busy = true;
  const a = cur.a, first = tries === 0 && !auto;
  if(first) firstOK++;
  marks[ti] = first ? "got" : "miss";
  btn.classList.add("ok"); MK.sfx.good();
  let fresh = false;
  if(first && !got.has(a.n)){ got.add(a.n); save.got = [...got]; MK.set(STORE, save); fresh = true; newCount++; }
  MK.say(guide, `${auto ? T.look : MK.praise()} ${MK.esc(fact())}${fresh ? " " + T.newInAlbum : ""}`, auto ? "bad" : undefined);
  if(cur.kind === "f") await feed(btn); else await settle(SCN[cur.kind], btn.dataset.id);
  drawPaws();
  await MK.wait(auto ? 1500 : fresh ? 1300 : 900);
  ti++; next();
}
function choose(btn){
  if(!btn || busy) return; MK.unlock();
  if(isRight(btn.dataset.id)) return right(btn);
  tries++; btn.classList.add("no"); MK.sfx.bad();
  if(tries >= 2){ const box = cur.kind === "f" ? foods : SCN[cur.kind].el; return right([...box.querySelectorAll("[data-id]")].find(b => isRight(b.dataset.id)), true); }
  MK.say(guide, T.again, "bad");
}
[SCN.h.el, SCN.w.el].forEach(el => el.addEventListener("click", e => choose(e.target.closest(".zbtn"))));
foods.addEventListener("click", e => choose(e.target.closest(".food")));
async function finish(){
  busy = true; foods.hidden = true;
  const sc = SCN[list[ROUND - 1].kind];
  sc.el.classList.add("dusk");
  MK.say(guide, T.done);
  await MK.wait(2400);
  const stars = MK.starsFor(firstOK, ROUND); MK.best(GAME, L.id, stars);
  MK.result({ stars, text: T.result(firstOK) + "<br>" + (newCount ? T.resNew(newCount) : T.resAlbum(got.size, A.length)),
    next: lvl < LEVELS.length - 1 ? () => start(lvl + 1) : null, again: () => start(lvl), menu: showMenu });
}
showMenu();
})();
</script>
</body>
</html>
