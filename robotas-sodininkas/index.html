<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Robotas sodininkas – MokomėsKartu.lt</title>
<meta name="description" content="5–6 klasių informatikos žaidimas: sudėliok programą iš komandų – komandų seka, kartojimo ir pasirinkimo komandos, paprogramės, programos testavimas ir taisymas.">
<meta name="theme-color" content="#fff9e6">
<meta name="robots" content="noindex">
<link rel="icon" href="/logo/mk-ikona.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800&family=Manrope:wght@600;700;800&display=swap">
<script src="/bendra/mk.js"></script>
<script src="/robotas-sodininkas/tekstai.lt.js"></script>
<style>
/* Meniu: robotas sode, kolekcija (sodas + roboto spalvos), lygiai, „Noriu pasimokyti“.
   Užduotis: sodo žemėlapis → programa iš blokų → „Paleisti“ → robotas vykdo komandas po vieną (vykdomas blokas paryškinamas). */
body{--ac:#1f9d55;--ac-ink:#fff;--ac-soft:#dcf5e5}
.mk-hero{padding-top:0}
.mk-hero h1{margin-top:8px;font-size:clamp(32px,8.4vw,54px)}
.mk-hero p{max-width:40ch;font-size:16.5px}
.hero-art{width:min(100%,480px);border-radius:26px;overflow:hidden;position:relative;box-shadow:0 6px 0 rgba(18,26,51,.15)}
.hero-art svg{display:block;width:100%;height:auto}
.hero-art::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 3px var(--ink);pointer-events:none}
.col{width:100%;max-width:520px;margin:0 auto 14px;padding:12px 14px 14px;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 2.5px var(--ink),0 5px 0 rgba(18,26,51,.14)}
.col h2{margin:0;font:800 18px/1.2 var(--kid);display:flex;gap:8px;align-items:center}
.col h2 svg{width:28px;height:28px;flex:none}
.col p{margin:4px 0 10px;color:var(--soft);font-weight:700;font-size:14.5px}
.bed{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;padding:6px;border-radius:14px;background:#8a5a34;box-shadow:inset 0 0 0 2px #6b4325}
.bed i{display:block;aspect-ratio:1;border-radius:6px;background:#a8754a}
.bed i svg{display:block;width:100%;height:100%}
.bed i.new{animation:mkPop .6s cubic-bezier(.2,1.6,.4,1)}
.cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px;align-items:center}
.cols b{grid-column:1/-1;font:800 14px/1 var(--body)}
.cb{width:100%;height:52px;border:0;border-radius:14px;background:#fff;padding:3px;cursor:pointer;box-shadow:inset 0 0 0 2px #cfd6c8;display:grid;place-items:center;position:relative}
.cb svg{width:40px;height:40px;display:block}
.cb.on{box-shadow:inset 0 0 0 3px var(--ink)}
.cb.lock{cursor:default}
.cb.lock svg{filter:grayscale(1) opacity(.35)}
.cb.lock::after{content:"🔒";position:absolute;font-size:15px;right:2px;bottom:1px}

/* ---------- žaidimas ---------- */
.hud{display:flex;align-items:center;gap:8px;margin:0 0 8px;min-height:36px}
.hud .mk-dots{margin-right:auto;justify-content:flex-start}
.chip{display:inline-flex;align-items:baseline;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink);font:800 17px/36px var(--kid);white-space:nowrap}
.chip small{font:800 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.chip.pop{animation:mkPop .35s cubic-bezier(.2,1.6,.4,1)}
.card{width:100%;max-width:600px;margin:0 auto 10px;padding:12px 12px 12px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.12)}
.goal{margin:0 0 8px;font:800 16.5px/1.35 var(--body)}
.goal small{display:block;font:700 14px/1.35 var(--body);color:var(--soft);margin-top:2px}
.lim{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:800 13.5px/1.3 var(--body);background:#fff4d6;box-shadow:inset 0 0 0 2px #e6b84a;margin:0 0 8px}
.lim.over{background:#ffe6df;box-shadow:inset 0 0 0 2px var(--bad)}
.lim.fine{background:#e3f7ea;box-shadow:inset 0 0 0 2px var(--good)}
.tabs{display:flex;gap:6px;margin:0 0 8px}
.tab{flex:1;min-height:40px;border:0;border-radius:12px;background:#f1f4ee;font:800 15px/1 var(--body);cursor:pointer;box-shadow:inset 0 0 0 2px #cfd6c8;display:flex;align-items:center;justify-content:center;gap:6px}
.tab.on{background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink)}
.tab .st{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;color:#fff;background:#c3cbbd}
.tab .st.ok{background:var(--good)}.tab .st.bad{background:var(--bad)}
.mapw{border-radius:16px;overflow:hidden;box-shadow:0 0 0 2.5px var(--ink);background:#9fd37a;max-width:420px;margin:0 auto}
.mapw svg{display:block;width:100%;height:auto}
.bot{transition:transform var(--sp,.38s) cubic-bezier(.45,.05,.4,1)}
.bot.bump .bb{animation:bump .4s}
@keyframes bump{40%{transform:translateY(-9px)}}
.fl .wet{opacity:0;transition:opacity .4s}
.fl .dry{transition:opacity .4s}
.fl.on .wet{opacity:1}.fl.on .dry{opacity:0}
.drop{opacity:0}
.drop.dgo{animation:drop .6s ease-in}
@keyframes drop{0%{opacity:1;transform:translateY(-10px)}100%{opacity:0;transform:translateY(8px)}}
.note{min-height:24px;margin:8px 0 0;text-align:center;font:800 15px/1.35 var(--body)}
.note.good{color:#1c8a52}.note.warn{color:#b8531a}
.ctl{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;margin:10px 0 0}
.ctl .mk-btn{min-height:50px;font-size:19px;padding:8px 14px}
.sq{width:50px;height:50px;border:0;border-radius:14px;background:#fff;cursor:pointer;box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.16);display:grid;place-items:center;padding:0}
.sq svg{width:26px;height:26px}
.sq.on{background:var(--ac-soft)}
.sq:active{transform:translateY(3px)}
.solb{display:flex;width:100%;margin-top:8px;min-height:46px;font-size:17px}
/* programa */
.prog{width:100%;max-width:600px;margin:0 auto 10px;padding:10px 10px 12px;border-radius:20px;background:#f7f9fc;box-shadow:inset 0 0 0 2.5px var(--ink)}
.prog h3{margin:0 2px 6px;font:800 15px/1.2 var(--body);display:flex;align-items:center;gap:8px}
.prog h3 span{margin-left:auto;color:var(--soft);font-size:13px}
.prog.p2{background:#fbf6ff}
.prog .ph{margin:-2px 2px 6px;font:700 13px/1.35 var(--body);color:var(--soft)}
.lst{display:grid;gap:4px}
.row{display:flex;align-items:center;gap:8px;min-height:42px;padding:4px 4px 4px 6px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 2px var(--bc,#9aa6bf),0 2px 0 rgba(18,26,51,.12);cursor:pointer;font:800 15.5px/1.2 var(--body);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.row .ic{width:30px;height:30px;border-radius:9px;background:var(--bg,#e8edf7);display:grid;place-items:center;flex:none}
.row .ic svg{width:22px;height:22px}
.row .lb{flex:1;min-width:0}
.row .x{width:34px;height:34px;border:0;border-radius:10px;background:transparent;cursor:pointer;display:grid;place-items:center;color:#8a93a8;font:800 20px/1 var(--body);flex:none}
.row .x:active{background:#ffe6df;color:var(--bad)}
.stp{display:inline-flex;align-items:center;gap:2px;margin-left:6px;vertical-align:middle}
.stp button{width:32px;height:32px;border:0;border-radius:9px;background:#fff;box-shadow:inset 0 0 0 2px var(--bc);font:800 18px/1 var(--body);cursor:pointer;padding:0}
.stp output{min-width:26px;text-align:center;font:800 18px/1 var(--kid)}
.box{border-radius:14px;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 2px var(--bc);padding:0 0 5px}
.box>.row{box-shadow:none;background:var(--bg);border-radius:12px 12px 0 0}
.kids{display:grid;gap:4px;margin:5px 5px 0 16px;padding-left:8px;border-left:4px solid var(--bc)}
.els{margin:6px 0 0 8px;font:800 13px/1 var(--body);color:var(--bc2,#555);text-transform:uppercase;letter-spacing:.05em}
.slot{min-height:34px;border-radius:10px;border:2px dashed #c3cbd9;display:flex;align-items:center;padding:0 10px;font:700 13px/1.2 var(--body);color:#8a93a8;cursor:pointer}
.slot.cur{border-color:var(--ac);color:var(--ac);background:var(--ac-soft)}
.caret{height:4px;border-radius:2px;background:var(--ac);margin:-2px 0;box-shadow:0 0 0 2px var(--ac-soft)}
.row.cur{box-shadow:inset 0 0 0 3px #ffb000,0 0 0 3px #ffe08a}
.row.err{box-shadow:inset 0 0 0 3px var(--bad),0 0 0 3px #ffc9bd}
.running .row,.running .slot,.running .stp button{pointer-events:none}
.running .x,.running .slot,.running .caret{visibility:hidden}
.k-F{--bc:#3f7fe0;--bg:#e2ecff}.k-L,.k-R{--bc:#7a5be0;--bg:#ece6ff}.k-W{--bc:#16a0c8;--bg:#ddf4fb}
.k-rep{--bc:#e08a1a;--bg:#fff0d9}.k-if{--bc:#d43f7a;--bg:#ffe3ef;--bc2:#b52e64}.k-P{--bc:#2f9e5b;--bg:#dcf5e5}
/* paletė */
.pal{position:sticky;bottom:0;z-index:5;width:100%;max-width:600px;margin:0 auto;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0;background:#fff9e6;box-shadow:0 -2px 0 #e7d9ad,0 -10px 18px rgba(255,249,230,.9)}
.pal h4{margin:0 2px 6px;font:800 12px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.pb{display:flex;flex-wrap:wrap;gap:6px}
.pk{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:4px 10px 4px 5px;border:0;border-radius:12px;background:#fff;cursor:pointer;font:800 14.5px/1.1 var(--body);box-shadow:inset 0 0 0 2px var(--bc),0 3px 0 rgba(18,26,51,.16);touch-action:manipulation}
.pk .ic{width:30px;height:30px;border-radius:9px;background:var(--bg);display:grid;place-items:center}
.pk .ic svg{width:22px;height:22px}
.pk:active{transform:translateY(2px)}
.pk[disabled]{opacity:.35;pointer-events:none}
.running .pk{opacity:.35;pointer-events:none}
.go{display:flex;width:100%;max-width:600px;margin:4px auto 10px}
.mk-why{max-width:600px;margin-inline:auto}
.code{margin:6px 0;padding:8px 10px;border-radius:10px;background:#f3f6fb;font:800 14px/1.5 var(--body);white-space:pre-wrap}
.fade{animation:mkIn .4s cubic-bezier(.2,1.2,.4,1)}
@media (max-width:380px){.row{font-size:14.5px}.pk{font-size:13.5px;padding-right:8px}.stp button{width:30px}}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <section id="menu">
    <div class="mk-hero">
      <div class="hero-art" id="heroArt"></div>
      <h1 id="heroH"></h1>
      <p id="heroP"></p>
    </div>
    <div class="col" id="col"></div>
    <div id="levels"></div>
    <div id="learn"></div>
  </section>
  <section id="play" hidden>
    <div class="hud"><div id="dots"></div><span class="chip" id="ptsChip"><small id="ptsL"></small><span id="pts">0</span></span></div>
    <div id="stage"></div>
  </section>
</div>
<script>
(function(){
"use strict";
const T = window.MK_T;
const GAME = "robotas-sodininkas", GRADES = [5, 6];
const K = "#121a33";
const R = MK.rnd, P = MK.pick, SH = MK.shuffle;
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
const key = (x, y) => x + "," + y;
const C = 40;                                   // langelio dydis SVG vienetais
const MAXB = 40;                                // daugiausia blokų programoje
const COLORS = [["#5fd3a6", "#2f9e7a"], ["#ffcf4a", "#d99a00"], ["#6db8ff", "#2f7fd6"], ["#ff7a9e", "#d43f6a"], ["#ffd36b", "#c58a12"]];
const COLOR_AT = [0, 3, 6, 10, 14];
const GARDEN_N = 60;
const FLC = ["#ff6b8a", "#ffb02e", "#7a6bff", "#ff5a3c", "#e84fd0"];

/* ================= programos blokai ================= */
let uid = 1;
const nd = (t, o) => Object.assign({ id: uid++, t }, o || {});
const F = () => nd("F"), Lt = () => nd("L"), Rt = () => nd("R"), Wt = () => nd("W"), Pc = () => nd("P");
const rep = (n, body) => nd("rep", { n, body });
const ifn = (c, body, els) => nd("if", { c, body, els: els || [] });
const tok = s => s.split(" ").filter(Boolean).map(c => ({ F, L: Lt, R: Rt, W: Wt, P: Pc })[c]());
function count(list){ let n = 0; for(const b of list){ n++; if(b.body) n += count(b.body); if(b.els) n += count(b.els); } return n; }
function clone(list){ return list.map(b => { const c = nd(b.t, {}); if(b.n != null) c.n = b.n; if(b.c) c.c = b.c; if(b.body) c.body = clone(b.body); if(b.els) c.els = clone(b.els); return c; }); }
function flat(list, proc, out){         // be sąlygų: F L R W (+ „C“ – sąlygos tikrinimo vieta)
  out = out || [];
  for(const b of list){
    if(b.t === "rep") for(let i = 0; i < b.n; i++) flat(b.body, proc, out);
    else if(b.t === "P") flat(proc || [], null, out);
    else if(b.t === "if") out.push("C");
    else out.push(b.t);
  }
  return out;
}
const opp = t => t === "L" ? "R" : "L";

/* ================= žemėlapis ================= */
/* seka → kelias ant begalinės plokštumos → žemėlapis (iki 8 × 8) */
function trace(seq, d){
  let x = 0, y = 0; const cells = [[0, 0]], seen = new Set([key(0, 0)]), wat = [], chk = [];
  for(const c of seq){
    if(c === "F"){ x += DX[d]; y += DY[d]; const k = key(x, y); if(seen.has(k)) return null; seen.add(k); cells.push([x, y]); }
    else if(c === "L") d = (d + 3) % 4;
    else if(c === "R") d = (d + 1) % 4;
    else if(c === "W"){ const k = key(x, y); if(wat.includes(k) || (x === 0 && y === 0)) return null; wat.push(k); }
    else if(c === "C") chk.push(key(x, y));
  }
  return { cells, wat, chk };
}
function mkMap(tr, d0, opt){
  opt = opt || {};
  const { cells } = tr; if(cells.length < 2) return null;
  // kelias neturi liesti savęs (tik gretimi langeliai)
  for(let i = 0; i < cells.length; i++) for(let j = i + 2; j < cells.length; j++)
    if(Math.abs(cells[i][0] - cells[j][0]) + Math.abs(cells[i][1] - cells[j][1]) === 1) return null;
  const xs = cells.map(c => c[0]), ys = cells.map(c => c[1]);
  const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
  const bw = maxx - minx + 1, bh = maxy - miny + 1, lim = opt.max || 6;
  if(bw > lim || bh > lim) return null;
  const w = Math.max(5, bw + 2), h = Math.max(5, bh + 2);
  const ox = Math.floor((w - bw) / 2) - minx, oy = Math.floor((h - bh) / 2) - miny;
  const sh = k => { const [a, b] = k.split(",").map(Number); return key(a + ox, b + oy); };
  const walk = new Set(cells.map(c => key(c[0] + ox, c[1] + oy)));
  const last = cells[cells.length - 1];
  if(tr.wat.includes(key(last[0], last[1]))) return null;   // gėlė ne ant stotelės
  return { w, h, walk, flowers: new Set(tr.wat.map(sh)), chk: tr.chk.map(sh), start: { x: ox, y: oy, d: d0 }, goal: key(last[0] + ox, last[1] + oy) };
}
function addDecoys(m, n){
  const cand = [];
  for(let y = 0; y < m.h; y++) for(let x = 0; x < m.w; x++){
    const k = key(x, y); if(m.walk.has(k)) continue;
    const nb = [0, 1, 2, 3].map(d => key(x + DX[d], y + DY[d])).filter(q => m.walk.has(q));
    if(nb.length === 1 && nb[0] !== m.goal) cand.push(k);
  }
  const used = [];
  for(const k of SH(cand)){
    if(used.length >= n) break;
    const [x, y] = k.split(",").map(Number);
    if(used.some(u => { const [a, b] = u.split(",").map(Number); return Math.abs(a - x) + Math.abs(b - y) <= 1; })) continue;
    used.push(k);
  }
  used.forEach(k => m.walk.add(k));
  return m;
}
const ok = (m, x, y) => m.walk.has(key(x, y));

/* ================= vykdytojas ================= */
/* grąžina žingsnių sąrašą animacijai ir rezultatą: ok | bump | waste | flowers | goal | long */
function exec(main, proc, m, max){
  max = max || 400;
  let x = m.start.x, y = m.start.y, d = m.start.d, steps = 0, res = null, depth = 0;
  const wet = new Set(), tr = []; let act = 0;          // act – roboto veiksmų (žingsnių) skaičius
  const done = () => key(x, y) === m.goal && wet.size === m.flowers.size;
  function list(l){ for(const b of l){ if(res) return; node(b); } }
  function node(b){
    if(++steps > max){ res = { r: "long", id: b.id }; return; }
    switch(b.t){
      case "F": { const nx = x + DX[d], ny = y + DY[d];
        if(!ok(m, nx, ny)){ tr.push({ id: b.id, e: "bump", x, y, d }); res = { r: "bump", id: b.id, s: ++act }; return; }
        act++; x = nx; y = ny; tr.push({ id: b.id, e: "move", x, y, d }); if(done()) res = { r: "ok" }; return; }
      case "L": act++; d = (d + 3) % 4; tr.push({ id: b.id, e: "turn", x, y, d, s: -1 }); return;
      case "R": act++; d = (d + 1) % 4; tr.push({ id: b.id, e: "turn", x, y, d, s: 1 }); return;
      case "W": { const k = key(x, y);
        act++;
        if(m.flowers.has(k) && !wet.has(k)){ wet.add(k); tr.push({ id: b.id, e: "water", x, y, d, k }); if(done()) res = { r: "ok" }; return; }
        tr.push({ id: b.id, e: "waste", x, y, d }); res = { r: "waste", id: b.id, s: act }; return; }
      case "P": if(depth > 3){ res = { r: "long", id: b.id }; return; } tr.push({ id: b.id, e: "call", x, y, d }); depth++; list(proc || []); depth--; return;
      case "rep": tr.push({ id: b.id, e: "loop", x, y, d }); for(let i = 0; i < b.n && !res; i++) list(b.body); return;
      case "if": { const k = key(x, y);
        const v = b.c === "f" ? m.flowers.has(k) && !wet.has(k) : !ok(m, x + DX[d], y + DY[d]);
        tr.push({ id: b.id, e: "cond", x, y, d, v }); list(v ? b.body : b.els); return; }
    }
  }
  if(done()) res = { r: "ok" };
  list(main);
  if(!res) res = done() ? { r: "ok" } : wet.size < m.flowers.size ? { r: "flowers", n: m.flowers.size - wet.size } : { r: "goal" };
  return { tr, res, wet };
}
const solves = (t, main, proc) => t.maps.every(m => exec(main, proc, m).res.r === "ok");
/* ar vieno sodo programa „paeiliui“ (be sąlygų) tinka ir kitam – tada užduotis netinka */
function flatWorksOther(t){
  for(let a = 0; a < t.maps.length; a++) for(let b = 0; b < t.maps.length; b++){
    if(a === b) continue;
    const e = exec(t.sol.main, t.sol.proc, t.maps[a]);
    const seq = e.tr.filter(s => s.e === "move" || s.e === "turn" || s.e === "water").map(s => nd(s.e === "move" ? "F" : s.e === "water" ? "W" : s.s < 0 ? "L" : "R"));
    if(exec(seq, null, t.maps[b]).res.r === "ok") return true;
  }
  return false;
}

/* ================= užduočių generatoriai ================= */
function tryGen(f, n){ for(let i = 0; i < (n || 800); i++){ const t = f(); if(t) return t; } return null; }
const PAL1 = ["F", "L", "R", "W"], PAL2 = ["F", "L", "R", "W", "rep"], PAL3 = ["F", "L", "R", "W", "rep", "ifF", "ifW"], PAL4 = ["F", "L", "R", "W", "rep", "P"];

/* 1 lygis – komandų seka. Sunkėja: ilgesnis kelias, daugiau posūkių ir gėlių, robotas gali žiūrėti ne į kelią. */
function t1(i){
  return tryGen(() => {
    const segs = Math.min(4, 2 + Math.floor((i + R(0, 2)) / 3)), fl = 1 + (i >= 2) + (i >= 5) + (i >= 7 && R(0, 1));
    const seq = [];
    if(i >= 3 && Math.random() < .55) seq.push(P(["L", "R"]));
    for(let s = 0; s < segs; s++){
      const len = R(1, i < 3 ? 2 : 3); for(let k = 0; k < len; k++) seq.push("F");
      if(s < segs - 1) seq.push(P(["L", "R"]));
    }

/* 2 lygis – kartojimo komanda (blokų riba neleidžia rašyti visko paeiliui) */

/* 3 lygis – pasirinkimo komanda. Du sodai, viena programa. */

/* 4 lygis – paprogramė (pasikartojantis gabalas su skirtingais tarpais tarp jų) */

  const p = showed ? 0 : runs === 1 ? 10 : runs === 2 ? 7 : 4; if(p) award(p);
  if(!showed){ const g = MK.get(GK, []); if(g.length < 120){ g.push(L); MK.set(GK, g); } planted++; }
  note(T.r.ok, "good");
  const lvlTip = T.tip[cur.lvl];
  const body = showed ? T.wMiss : T.wUsed(n, cur.best);
  const more = `${T.wSol}${solText()}${cur.bug ? `<p>${T.bugTip[cur.bug]}</p>` : ""}<p>${lvlTip}</p><p>${T.wSame}</p>`;
  const d = document.createElement("div");
  d.innerHTML = MK.why({ ok: !showed, head: showed ? T.wMiss.split(" – ")[0] : P(T.wOk), body: showed ? "" : body, more, sum: T.why, open: showed || n > cur.best });
  $("flow").appendChild(d.firstElementChild);
  const go = document.createElement("button"); go.type = "button"; go.className = "mk-btn go"; go.textContent = ti < tasks.length - 1 ? T.next : T.finish;
  go.onclick = () => { MK.sfx.tap(); ti++; ti < tasks.length ? show() : finish(); };

}
function finish(){
  const total = tasks.length, stars = MK.starsFor(okN, total); MK.best(GAME, LEVELS[L].id, stars);
  const s2 = totalStars(); const newC = COLOR_AT.findIndex((t, j) => j > 0 && starsBefore < t && s2 >= t);
  let txt = T.res(okN, total, pts);
  if(planted) txt += `<br><b>${T.newFlowers(planted)}</b>`;
  if(newC > 0) txt += `<br><b>${T.newColor(T.colorNames[newC])}</b>`;

    next: L < LEVELS.length - 1 ? () => start(L + 1) : null, again: () => start(L), menu: () => showMenu(planted) });
}
