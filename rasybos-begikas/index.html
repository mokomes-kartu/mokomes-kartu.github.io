<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rašybos bėgikas – MokomėsKartu.lt</title>
<meta name="description" content="Lietuvių kalbos rašybos žaidimas 9–12 klasėms: nosinės raidės, i ar y, u ar ū, kartu ar atskirai. Bėk pro vartus su teisinga rašyba.">
<meta name="theme-color" content="#f7f5ef">
<link rel="icon" href="/logo/mk-ikona.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@600;700;800&display=swap">
<script src="/bendra/mk.js"></script>
<script src="/rasybos-begikas/tekstai.lt.js"></script>
<style>
/* Rašybos bėgikas: vaizdas iš viršaus, 2–3 takeliai. Viršuje – žodis su spraga, žemyn slenka vartai su variantais,
   bėgikas apačioje keičia takelį. Suklydus bėgimas sustoja ir apačioje atsiveria taisyklės lapelis. */
body{--paper:#f7f5ef;--grid:#e6e2d3;--soft:#5d5a4c;--kid:"Unbounded","Arial Black",system-ui,sans-serif;--ac:#e03131;--ac-ink:#fff;--ac-soft:#ffe3e3}
.mk-ico[data-k="music"]{display:none}
.mk-lvl{border-radius:12px;box-shadow:inset 0 0 0 2.5px var(--ink),5px 5px 0 var(--ink)}
.mk-lvl-art{border-radius:10px;font:800 17px/1 var(--kid);letter-spacing:-.03em}
.mk-lvl-t b{font-size:16.5px;letter-spacing:-.02em}
.mk-hero h1{letter-spacing:-.04em;font-size:clamp(30px,8vw,50px)}
.mk-btn{border-radius:12px;font-size:17px}
.mk-res{border-radius:16px;box-shadow:inset 0 0 0 3px var(--ink),8px 8px 0 var(--ink)}
.mk-res .mk-owl{display:none}
.mk-res h2{font-size:24px;letter-spacing:-.03em}
.mk-res p{font-size:16px}
.mk-res .rev{display:block;margin-top:10px;text-align:left;color:var(--ink);font-size:14.5px;line-height:1.4}
.mk-res .rev b{display:block;margin-bottom:2px}
.mk-res .rev i{display:block;font-style:normal;padding:6px 0;border-top:1.5px dashed #d7cfb8}
.mk-res .rec{display:block;margin-top:4px;color:var(--ac);font-weight:800}
.mk-sec{font-size:16px}
.note{max-width:520px;margin:14px auto 0;color:var(--soft);font-size:13px;text-align:center}
.recs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:520px;margin:14px auto 0}
.recs span{padding:6px 10px;border-radius:9px;background:#fff;box-shadow:inset 0 0 0 2px var(--ink);font:800 13px/1.2 var(--body)}
.recs span b{color:var(--ac)}

/* ---------- trasa ---------- */
.track{position:relative;overflow:hidden;border-radius:16px;background:#8fd08a;box-shadow:inset 0 0 0 3px var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
.track::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 3px var(--ink);pointer-events:none;z-index:6}
.grass{position:absolute;top:0;bottom:0;width:22px;background-image:radial-gradient(circle at 50% 50%,#3f9a4a 0 6px,transparent 7px),radial-gradient(circle at 30% 20%,#58b85a 0 4px,transparent 5px);background-size:22px 74px,22px 46px}
.grass.l{left:0}.grass.r{right:0}
.road{position:absolute;top:0;bottom:0;left:22px;right:22px;background:#ece7da;background-image:linear-gradient(rgba(18,26,51,.07) 0 2px,transparent 2px);background-size:100% 112px;box-shadow:inset 3px 0 0 var(--ink),inset -3px 0 0 var(--ink);display:grid}
.lane{position:relative}
.lane+.lane{background-image:linear-gradient(#fff 0 26px,transparent 26px);background-size:4px 56px;background-repeat:repeat-y;background-position-x:0}
.lane.on{background-color:rgba(255,255,255,.55)}
.gate{position:absolute;left:22px;right:22px;top:0;height:72px;display:grid;gap:0;z-index:2;will-change:transform}
.gate::before{content:"";position:absolute;left:0;right:0;top:-7px;height:12px;border-radius:6px;background:var(--ink)}
.gp{position:relative;margin:0 6px;border-radius:0 0 12px 12px;background:#fff;box-shadow:inset 0 0 0 3px var(--ink),0 5px 0 rgba(18,26,51,.25);display:grid;place-items:center;
  font:800 30px/1 var(--body);color:var(--ink)}
.gp.w{font-size:clamp(20px,5.6vw,24px)}
.gp.ok{background:#8ce99a}
.gp.no{background:#ffa8a8}
.gate.gone{transition:opacity .35s;opacity:0}
.runner{position:absolute;bottom:9%;width:64px;height:96px;margin-left:-32px;z-index:3;transition:left .13s ease-out;pointer-events:none}
.runner svg{width:100%;height:100%;display:block;overflow:visible}
.run .la{animation:legA .34s linear infinite}
.run .lb{animation:legA .34s linear infinite;animation-delay:-.17s}
.run .aa{animation:armA .34s linear infinite;transform-origin:14px 40px}
.run .ab{animation:armA .34s linear infinite;animation-delay:-.17s;transform-origin:46px 40px}
.run .bd{animation:bob .17s ease-in-out infinite alternate}
@keyframes legA{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes armA{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes bob{to{transform:translateY(-2px)}}
.runner.hit svg{animation:mkShake .45s}
.pop{position:absolute;z-index:5;transform:translate(-50%,0);font:800 20px/1 var(--kid);color:#2b8a3e;text-shadow:0 2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 -2px 0 #fff;pointer-events:none;animation:popUp .8s ease-out forwards;white-space:nowrap}
@keyframes popUp{to{transform:translate(-50%,-46px);opacity:0}}
.tip{position:absolute;left:0;right:0;bottom:8px;text-align:center;z-index:4;pointer-events:none;font:800 12.5px/1.3 var(--body);color:var(--soft);padding:0 30px;transition:opacity .4s}
.veil{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(247,245,239,.86);padding:18px}
.veil>div{display:grid;gap:10px;width:min(280px,100%);text-align:center}
.veil h2{margin:0 0 4px;font:800 26px/1.1 var(--kid);letter-spacing:-.03em}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:7;max-height:100%;overflow:auto;padding:12px 12px 14px;background:#fff;border-radius:16px 16px 14px 14px;box-shadow:0 -3px 0 var(--ink),inset 0 0 0 3px var(--ink);animation:mkIn .3s}
.sheet .mk-why{margin:0 0 10px}
.sheet .mk-btn{width:100%}
.mk-why-t>b b{color:#2b8a3e}

/* ---------- žaidimo ekranas ---------- */
body.playing{overflow:hidden;position:fixed;inset:0;width:100%}
body.playing .mk-app{height:100vh;height:100dvh;min-height:0;padding-bottom:10px}
#play{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.hud{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:8px}
.hearts{display:flex;gap:3px}
.hearts svg{width:26px;height:26px;display:block}
.hearts .off{opacity:.22}
.prog{height:12px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2px var(--ink);overflow:hidden;min-width:40px}
.prog i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.chip{display:inline-flex;align-items:baseline;gap:6px;padding:7px 10px;border-radius:10px;background:#fff;font:800 16px/1 var(--kid);box-shadow:inset 0 0 0 2.5px var(--ink),3px 3px 0 var(--ink)}
.chip small{font:800 10.5px/1 var(--body);color:var(--soft);letter-spacing:.06em;text-transform:uppercase}
.chip em{font-style:normal;color:var(--ac);font-size:13px}
.pbtn{width:40px;height:40px;border-radius:10px;border:0;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink),3px 3px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.pbtn svg{width:18px;height:18px}
.word{background:#fff;border-radius:14px;padding:8px 12px 10px;box-shadow:inset 0 0 0 3px var(--ink),5px 5px 0 var(--ink);text-align:center;margin-right:5px}
.word small{display:block;font:800 11px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ac)}
.word div{min-height:2.3em;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;font:800 clamp(21px,6.2vw,30px)/1.15 var(--body);letter-spacing:.01em;white-space:pre-wrap}
.gap{display:inline-block;min-width:.85em;height:1.05em;margin:0 .06em;border-radius:6px;background:var(--ac-soft);box-shadow:inset 0 0 0 2.5px var(--ac);vertical-align:-.16em}
.gap.sp{min-width:.5em;margin:0 .1em}
.fill{color:#2b8a3e;border-bottom:3px solid #2b8a3e}
.fill.bad{color:var(--ac);border-color:var(--ac)}
#stage{flex:1;min-height:260px}
#stage .track{height:100%}
/* meniu piešinys */
.mk-hero-art{width:min(360px,100%)}
.mk-hero-art .track{height:230px;box-shadow:inset 0 0 0 3px var(--ink),6px 6px 0 var(--ink)}
@media (prefers-reduced-motion:reduce){.run .la,.run .lb,.run .aa,.run .ab,.run .bd{animation:none}}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <section id="menu">
    <div class="mk-hero">
      <div class="mk-hero-art" id="heroArt"></div>
      <h1 id="heroH"></h1>
      <p id="heroP"></p>
    </div>
    <div id="levels"></div>
    <div class="recs" id="recs"></div>
    <div id="learn"></div>
    <p class="note" id="note"></p>
  </section>
  <section id="play" hidden>
    <div class="hud">
      <div class="hearts" id="hearts" role="img"></div>
      <div class="prog" id="prog" role="img"><i></i></div>
      <span class="chip"><small id="ptsL"></small><span id="pts">0</span><em id="mult"></em></span>
      <button type="button" class="pbtn" id="pause"><svg viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="2" width="4.5" height="14" rx="1.5" fill="#121a33"/><rect x="10.500" y="2" width="4.5" height="14" rx="1.5" fill="#121a33"/></svg></button>
    </div>
    <div class="word"><small id="wordL"></small><div id="word" aria-live="polite"></div></div>
    <div id="stage"></div>
  </section>
</div>
<script>
(function(){
"use strict";
const GAME = "rasybos-begikas", GRADES = [9, 10, 11, 12], N = 15, LIVES = 3, REC = "mk-" + GAME + "-rekordai";
const T = window.MK_T, INK = "#121a33";
const $ = id => document.getElementById(id);

/* ---------- užduotys ---------- */
const letter = (kind, a) => ({ kind, w: a[0], o: a[1].split("|"), a: a[2], ex: a[3], fill: a[1].split("|") });
const joined = a => ({ kind: "kartu", w: a[0], o: T.optKartu, a: a[1], ex: a[2], fill: ["", " "] });
const POOL = { nosines: T.tasks.nosines.map(a => letter("nosines", a)), ilgosios: T.tasks.ilgosios.map(a => letter("ilgosios", a)), kartu: T.tasks.kartu.map(joined) };
POOL.misrus = [].concat(POOL.nosines, POOL.ilgosios, POOL.kartu);
const fullOf = (t, k) => t.w.replace("_", t.fill[k == null ? t.a : k]);
const esc = MK.esc;
function wordHTML(t, k){ // k – įrašytas variantas (arba nieko)
  const [a, b] = t.w.split("_");
  if(k == null) return esc(a) + `<span class="gap${t.kind === "kartu" ? " sp" : ""}"></span>` + esc(b);
  const cls = "fill" + (k === t.a ? "" : " bad");
  if(t.kind !== "kartu") return esc(a) + `<span class="${cls}">${esc(t.fill[k])}</span>` + esc(b);
  const p = a.lastIndexOf(" "), q = b.search(/[ ,]/), pre = a.slice(0, p + 1), post = q < 0 ? "" : b.slice(q);
  return esc(pre) + `<span class="${cls}">${esc(a.slice(p + 1) + t.fill[k] + (q < 0 ? b : b.slice(0, q)))}</span>` + esc(post);
}
const LEVELS = [
  { id: "nosines", art: "ą ę", t0: 4.0, dt: 0.1, tmin: 2.7 },
  { id: "ilgosios", art: "y ū", t0: 4.0, dt: 0.1, tmin: 2.7 },
  { id: "kartu", art: "a b", t0: 4.0, dt: 0.1, tmin: 2.7 },
  { id: "misrus", art: "VBE", t0: 3.4, dt: 0.07, tmin: 2.5 }
].map((l, i) => Object.assign(l, { name: T.levels[i][0], sub: T.levels[i][1] }));

/* ---------- piešiniai ---------- */
const RUNNER = `<svg viewBox="0 0 60 90" aria-hidden="true"><ellipse cx="30" cy="84" rx="19" ry="5" fill="#121a33" opacity=".16"/>
  <g class="la"><rect x="19" y="56" width="9" height="20" rx="4.5" fill="#2b3a67"/><path d="M17.500 75h12v6a3 3 0 0 1-3 3h-6a3 3 0 0 1-3-3z" fill="#fff" stroke="${INK}" stroke-width="2"/></g>
  <g class="lb"><rect x="32" y="56" width="9" height="20" rx="4.5" fill="#2b3a67"/><path d="M30.500 75h12v6a3 3 0 0 1-3 3h-6a3 3 0 0 1-3-3z" fill="#fff" stroke="${INK}" stroke-width="2"/></g>
  <g class="bd"><g class="aa"><rect x="8" y="34" width="9" height="24" rx="4.5" fill="#ffd43b" stroke="${INK}" stroke-width="2"/><circle cx="12.500" cy="58" r="4" fill="#f2c9a1" stroke="${INK}" stroke-width="1.6"/></g>
  <g class="ab"><rect x="43" y="34" width="9" height="24" rx="4.5" fill="#ffd43b" stroke="${INK}" stroke-width="2"/><circle cx="47.500" cy="58" r="4" fill="#f2c9a1" stroke="${INK}" stroke-width="1.6"/></g>
  <path d="M16 36q0-8 14-8t14 8v22q0 4-4 4H20q-4 0-4-4z" fill="#ffd43b" stroke="${INK}" stroke-width="2.2"/>
  <rect x="19" y="33" width="22" height="27" rx="7" fill="#e03131" stroke="${INK}" stroke-width="2.2"/><rect x="23" y="45" width="14" height="10" rx="3" fill="#ff8787" stroke="${INK}" stroke-width="1.8"/>
  <path d="M26 33v-3h8v3" fill="none" stroke="${INK}" stroke-width="2.2" stroke-linecap="round"/><path d="M27 49.500h6" stroke="${INK}" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="26" y="23" width="8" height="7" fill="#f2c9a1" stroke="${INK}" stroke-width="1.8"/>
  <circle cx="30" cy="15" r="12" fill="#5c3d2e" stroke="${INK}" stroke-width="2.2"/><path d="M19.500 11q10-8 21 0" fill="none" stroke="#7a5442" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="17.500" cy="16" r="2.6" fill="#f2c9a1" stroke="${INK}" stroke-width="1.5"/><circle cx="42.500" cy="16" r="2.6" fill="#f2c9a1" stroke="${INK}" stroke-width="1.5"/></g></svg>`;
const HEART = on => `<svg viewBox="0 0 24 24" class="${on ? "" : "off"}" aria-hidden="true"><path d="M12 21C5 15.500 2.500 12 2.500 8.500A4.800 4.800 0 0 1 12 6.500 4.800 4.800 0 0 1 21.500 8.500C21.500 12 19 15.500 12 21z" fill="${on ? "#e03131" : "#8a8674"}" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/></svg>`;
const gateHTML = t => `<div class="gate" style="grid-template-columns:repeat(${t.o.length},1fr)">${t.o.map(o => `<div class="gp${o.length > 1 ? " w" : ""}">${esc(o)}</div>`).join("")}</div>`;
const trackHTML = n => `<div class="track"><div class="grass l"></div><div class="grass r"></div><div class="road" style="grid-template-columns:repeat(${n},1fr)">${"<div class=\"lane\"></div>".repeat(n)}</div><div class="runner run">${RUNNER}</div></div>`;

/* ---------- meniu ---------- */
const app = $("app"), menu = $("menu"), play = $("play"), stage = $("stage");
const saved = MK.get("mokomeskartu-klase", 0);
app.prepend(MK.top({ title: T.title, grade: GRADES.includes(saved) ? saved : GRADES[0] }));
$("heroH").innerHTML = `${T.heroA} <em>${T.heroB}</em>`; $("heroP").textContent = T.hero; $("note").textContent = T.note;
$("ptsL").textContent = T.hud.score; $("wordL").textContent = ""; $("pause").setAttribute("aria-label", T.hud.pause);
(function hero(){
  const t = POOL.nosines[0]; $("heroArt").innerHTML = trackHTML(3);
  const tr = $("heroArt").firstElementChild; tr.insertAdjacentHTML("beforeend", gateHTML(t));
  tr.querySelector(".gate").style.transform = "translateY(34px)"; tr.querySelector(".runner").style.left = "calc(22px + (100% - 44px) / 6)";
  tr.querySelector(".runner").style.bottom = "6%"; tr.querySelector(".gp").classList.add("ok");
})();
function showMenu(){
  document.body.classList.remove("playing"); play.hidden = true; menu.hidden = false;
  MK.levels($("levels"), { game: GAME, levels: LEVELS, onPick: start });
  MK.learn($("learn"), { topics: T.learn, onPlay: start });
  const r = MK.get(REC, {});
  $("recs").innerHTML = LEVELS.filter(l => r[l.id]).map(l => `<span>${l.name}: <b>${r[l.id]}</b></span>`).join("");
  window.scrollTo(0, 0);
}

/* ---------- žaidimas ---------- */
let S = null, raf = 0;
const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion:reduce)").matches;
function start(i){
  const L = LEVELS[i];
  S = { i, L, list: MK.shuffle(POOL[L.id]).slice(0, N), idx: -1, lives: LIVES, score: 0, streak: 0, ok: 0, miss: [], lane: 1, n: 0,
        state: "idle", p: 0, T: L.t0, off: 0, last: 0, cur: null, order: null, gate: null, wait: 0 };
  menu.hidden = true; play.hidden = false; document.body.classList.add("playing"); window.scrollTo(0, 0);
  hud(); nextGate(0.7);
  cancelAnimationFrame(raf); S.last = performance.now(); raf = requestAnimationFrame(tick);
}
function hud(){
  $("hearts").innerHTML = [0, 1, 2].map(k => HEART(k < S.lives)).join(""); $("hearts").setAttribute("aria-label", T.hud.lives(S.lives));
  $("pts").textContent = S.score; const m = mult(); $("mult").textContent = m > 1 ? "×" + m : "";
  $("prog").firstElementChild.style.width = Math.round(Math.max(0, S.idx) / N * 100) + "%"; $("prog").setAttribute("aria-label", `${T.hud.gate}: ${Math.max(0, S.idx)} / ${N}`);
}
const mult = () => Math.min(4, 1 + Math.floor(S.streak / 3));
function build(n){ // perstato trasą, kai keičiasi takelių skaičius
  if(S.n === n && stage.firstElementChild) return;
  stage.innerHTML = trackHTML(n); S.n = n; S.lane = Math.min(S.lane, n - 1); if(n === 3 && S.idx === 0) S.lane = 1;
  if(S.idx === 0) stage.firstElementChild.insertAdjacentHTML("beforeend", `<div class="tip" id="tip">${T.help}</div>`);
  place();
}
function place(){
  const tr = stage.firstElementChild; if(!tr) return;
  tr.querySelector(".runner").style.left = `calc(22px + (100% - 44px) * ${(S.lane + 0.5) / S.n})`;
  tr.querySelectorAll(".lane").forEach((l, k) => l.classList.toggle("on", k === S.lane));
}
function nextGate(delay){
  S.idx++; hud();
  if(S.idx >= N || S.lives <= 0) return finish();
  const t = S.list[S.idx], order = MK.shuffle(t.o.map((_, k) => k));
  S.cur = t; S.order = order; S.T = Math.max(S.L.tmin, S.L.t0 - S.L.dt * S.idx); S.p = 0; S.wait = delay == null ? 0.45 : delay; S.state = "wait";
  $("wordL").textContent = `${S.idx + 1} / ${N} · ${S.L.name}`;
}
function spawn(){
  const t = S.cur; build(t.o.length);
  const tr = stage.firstElementChild; tr.querySelectorAll(".gate").forEach(g => g.remove());
  tr.insertAdjacentHTML("beforeend", gateHTML({ o: S.order.map(k => t.o[k]) }));
  S.gate = tr.querySelector(".gate"); $("word").innerHTML = wordHTML(t); S.state = "run"; S.p = 0; move();
  tr.querySelector(".runner").classList.add("run");
}
function geom(){ const tr = stage.firstElementChild, h = tr.clientHeight; return { h, y0: -80, y1: h - h * 0.09 - 96 - 60 }; }
function move(){ const g = geom(); S.gate.style.transform = `translateY(${(g.y0 + (g.y1 - g.y0) * S.p).toFixed(1)}px)`; }
function tick(now){
  raf = requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - S.last) / 1000); S.last = now;
  if(S.state === "wait"){ S.wait -= dt; if(S.wait <= 0) spawn(); }
  if(S.state !== "run" && S.state !== "wait" && S.state !== "pass") return;
  if(!reduce && stage.firstElementChild){
    S.off = (S.off + dt * 300) % (56 * 74 * 46);
    const tr = stage.firstElementChild;
    tr.querySelectorAll(".lane").forEach(l => { l.style.backgroundPositionY = S.off + "px"; }); tr.querySelector(".road").style.backgroundPositionY = S.off + "px";
    tr.querySelectorAll(".grass").forEach(g => { g.style.backgroundPositionY = `${S.off}px,${S.off}px`; });
  }
  if(S.state === "run"){
    S.p += dt / S.T; if(S.p >= 1){ S.p = 1; move(); return hit(); } move();
  } else if(S.state === "pass" && S.gate){
    S.p += dt / S.T; move();
  }
}
function hit(){
  const t = S.cur, pick = S.order[S.lane], ok = pick === t.a, tr = stage.firstElementChild, panels = S.gate.children;
  const tip = $("tip"); if(tip) tip.style.opacity = 0;
  panels[S.order.indexOf(t.a)].classList.add("ok");
  $("word").innerHTML = wordHTML(t, pick);
  if(ok){
    S.ok++; S.streak++; const gain = 10 * mult(); S.score += gain; MK.sfx.good();
    const r = tr.querySelector(".runner"), pop = document.createElement("div"); pop.className = "pop"; pop.textContent = "+" + gain;
    pop.style.left = r.style.left; pop.style.bottom = "calc(9% + 100px)"; tr.appendChild(pop); setTimeout(() => pop.remove(), 820);
    S.state = "pass"; S.gate.classList.add("gone"); hud();
    setTimeout(() => { if(S && S.state === "pass") nextGate(0.2); }, 520);
    return;
  }
  panels[S.lane].classList.add("no"); S.lives--; S.streak = 0; S.miss.push(t); MK.sfx.bad(); S.state = "stop"; hud();
  const r = tr.querySelector(".runner"); r.classList.remove("run"); r.classList.add("hit");
  const last = S.lives <= 0 || S.idx >= N - 1, sh = document.createElement("div"); sh.className = "sheet";
  sh.innerHTML = MK.why({ ok: false, head: T.wrongHead(esc(fullOf(t))), more: esc(t.ex), sum: T.sum, open: true }) + `<button type="button" class="mk-btn" id="go">${last ? T.toResult : T.next}</button>`;
  tr.appendChild(sh); setTimeout(() => { const b = $("go"); if(b) b.focus({ preventScroll: true }); }, 60);
}
function resume(){
  const tr = stage.firstElementChild; tr.querySelectorAll(".sheet,.gate").forEach(x => x.remove());
  tr.querySelector(".runner").classList.remove("hit"); tr.querySelector(".runner").classList.add("run"); S.last = performance.now(); nextGate(0.35);
}
function setLane(k){ if(!S || (S.state !== "run" && S.state !== "wait" && S.state !== "pass")) return; k = Math.max(0, Math.min(S.n - 1, k)); if(k !== S.lane){ S.lane = k; MK.sfx.tap(); place(); } }
function pause(on){
  if(!S || !stage.firstElementChild) return;
  if(on){ if(S.state !== "run" && S.state !== "wait" && S.state !== "pass") return; S.prev = S.state; S.state = "pause";
    stage.firstElementChild.insertAdjacentHTML("beforeend", `<div class="veil" id="veil"><div><h2>${T.paused}</h2><button type="button" class="mk-btn" id="res">${T.resume}</button><button type="button" class="mk-btn alt" id="quit">${T.quit}</button></div></div>`);
    stage.querySelector(".runner").classList.remove("run");
  } else if(S.state === "pause"){ const v = $("veil"); if(v) v.remove(); S.state = S.prev; S.last = performance.now(); stage.querySelector(".runner").classList.add("run");
    if(S.state === "pass") nextGate(0.2); }
}
function finish(){
  cancelAnimationFrame(raf); S.state = "end"; $("prog").firstElementChild.style.width = Math.round(S.idx / N * 100) + "%";
  const done = S.lives > 0, stars = done ? MK.starsFor(S.ok, N) : 1, r = MK.get(REC, {}), best = r[S.L.id] || 0, isRec = S.score > best;
  if(isRec){ r[S.L.id] = S.score; MK.set(REC, r); }
  MK.best(GAME, S.L.id, stars);
  const seen = new Set(), rev = S.miss.filter(t => !seen.has(t.w) && seen.add(t.w)).map(t => `<i><b>${esc(fullOf(t))}</b>${esc(t.ex)}</i>`).join("");
  const i = S.i;
  MK.result({ stars, title: done ? T.resDone : T.resOut,
    text: T.resText(S.ok, N, S.score) + (Math.max(best, S.score) ? `<span class="rec">${isRec ? T.resRecord(S.score) : T.resBest(best)}</span>` : "") + (rev ? `<span class="rev"><b>${T.review}</b>${rev}</span>` : ""),
    next: done && i < LEVELS.length - 1 ? () => start(i + 1) : null, again: () => start(i), menu: showMenu });
}

/* ---------- valdymas ---------- */
let px = null;
stage.addEventListener("pointerdown", e => { if(e.target.closest("button,.sheet,.veil")) return; MK.unlock(); px = e.clientX; });
stage.addEventListener("pointerup", e => {
  if(px == null || !S) return; const dx = e.clientX - px; px = null;
  if(Math.abs(dx) > 28) return setLane(S.lane + (dx > 0 ? 1 : -1));
  const road = stage.querySelector(".road"); if(!road) return; const b = road.getBoundingClientRect();
  setLane(Math.floor((e.clientX - b.left) / b.width * S.n));
});
stage.addEventListener("pointercancel", () => { px = null; });
stage.addEventListener("click", e => {
  if(e.target.closest("#go")){ MK.sfx.tap(); return resume(); }
  if(e.target.closest("#res")){ MK.sfx.tap(); return pause(false); }
  if(e.target.closest("#quit")){ MK.sfx.tap(); cancelAnimationFrame(raf); S = null; return showMenu(); }
});
$("pause").addEventListener("click", () => { if(S) pause(S.state !== "pause"); });
document.addEventListener("keydown", e => {
  if(!S || play.hidden) return; const k = e.key.toLowerCase();
  if(k === "arrowleft" || k === "a"){ e.preventDefault(); setLane(S.lane - 1); }
  else if(k === "arrowright" || k === "d"){ e.preventDefault(); setLane(S.lane + 1); }
  else if(k === "escape" || k === "p") pause(S.state !== "pause");
});
document.addEventListener("visibilitychange", () => { if(document.hidden) pause(true); });
window.addEventListener("resize", () => { if(S && S.gate && S.state === "run") move(); });

/* testams: būsena ir tiesioginis takelio parinkimas */
window.__rb = { get s(){ return S && { state: S.state, lane: S.lane, n: S.n, idx: S.idx, lives: S.lives, score: S.score, p: S.p, right: S.order ? S.order.indexOf(S.cur.a) : -1, word: S.cur && S.cur.w }; }, setLane, POOL, fullOf };
showMenu();
})();
</script>
