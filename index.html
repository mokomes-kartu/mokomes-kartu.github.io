<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MokomėsKartu.lt</title>
<meta name="description" content="Žaidimai ir priemonės mokytis kartu">
<link rel="icon" href="/netaisyklingieji/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Grandstander:wght@800&family=Nunito:wght@500;800&display=swap">
<style>
:root{--bg:#f6faff;--grid:#d3e2f4;--ink:#1b2a4e;--soft:#5b6a8f;--card:#fff;--pen:#d11f3a;--mark:#ffe14d;--mink:#1b2a4e;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0e1630;--grid:#1b2850;--ink:#eef2ff;--soft:#a5b3d8;--card:#16214a;--pen:#ff6b80;--mark:#ffd94a;--mink:#14203f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:17px/1.5 Nunito,system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:48px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
h1{font:800 clamp(40px,11vw,76px)/1 Grandstander,"Comic Sans MS",sans-serif;margin:0}
h1 b{background:var(--mark);color:var(--mink);border-radius:.12em;padding:0 .12em;display:inline-block;transform:rotate(-2deg)}
h1 small{font:700 .55em Caveat,cursive;color:var(--pen)}
p.lead{max-width:34ch;margin:16px 0 34px}
a.card{display:flex;align-items:center;gap:16px;padding:16px;background:var(--card);color:inherit;text-decoration:none;border:2px solid var(--ink);border-radius:8px;box-shadow:5px 5px 0 var(--ink);transition:transform .1s,box-shadow .1s}
a.card:hover,a.card:focus-visible{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
a.card img{width:64px;height:64px;border-radius:14px;flex:none}
.t{font:800 24px/1.1 Grandstander,sans-serif}
.s{color:var(--soft);font-size:15px}
.go{margin-left:auto;font:700 28px Caveat,cursive;color:var(--pen);white-space:nowrap}
footer{margin-top:40px;color:var(--soft);font-size:13px}
</style>
</head>
<body>
<main>
<h1>Mokomės<b>Kartu</b><small>.lt</small></h1>
<p class="lead">Žaidimai ir priemonės, su kuriomis mokytis smagiau.</p>
<a class="card" href="/netaisyklingieji/">
<img src="/netaisyklingieji/icon-192.png" alt="">
<span><span class="t">Netaisyklingieji</span><br><span class="s">Anglų kalbos netaisyklingieji veiksmažodžiai: paveikslėliai, tarimas ir pažymiai</span></span>
<span class="go">Žaisti →</span>
</a>
<footer>MokomėsKartu.lt</footer>
</main>
</body>
</html>
