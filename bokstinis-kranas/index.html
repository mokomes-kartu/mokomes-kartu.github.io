<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bokštinis kranas – MokomėsKartu.lt</title>
<meta name="description" content="3 klasės matematikos žaidimas: valdyk bokštinį kraną ir statyk miestelį – ilgio ir masės matavimo vienetų smulkinimas ir stambinimas (mm, cm, dm, m, kg, t).">
<meta name="theme-color" content="#eaf5fb">
<meta name="robots" content="noindex">
<link rel="icon" href="/logo/mk-ikona.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800&family=Manrope:wght@600;700;800&display=swap">
<script src="/bendra/mk.js"></script>
<script src="/bokstinis-kranas/tekstai.lt.js"></script>
<script src="/bokstinis-kranas/uzduotys.js"></script>
<style>
/* Statybų aikštelės stilius: šviesus dangus, geltonas kranas, brėžinių kortelės. Be languoto fono ir pelėdžiuko. */
body{--ac:#f2a900;--ac-ink:#121a33;--ac-soft:#fff1c9;--blue:#1f6fb5;background:#eaf5fb;background-image:none}
.mk-app{max-width:900px}
.mk-app.play{height:100vh;height:100dvh;min-height:0;overflow:hidden;padding-bottom:8px}
main{display:flex;flex-direction:column;min-height:0}
#game{flex:1}
.hero{display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center;gap:6px;padding:0 0 10px}
.hero h1{margin:6px 0 0;font:800 clamp(34px,8.6vw,54px)/1 var(--kid)}
.hero h1 em{font-style:normal;color:#d98f00}
.hero p{margin:0;max-width:46ch;color:#44506b;font-weight:700;font-size:16px}
.hero-art{width:min(100%,520px);border-radius:22px;overflow:hidden;border:3px solid var(--ink);box-shadow:0 6px 0 rgba(18,26,51,.16);background:#cfeaf7}
.hero-art svg{display:block;width:100%;height:auto}
.panel{width:100%;max-width:560px;margin:0 auto 14px;padding:12px 14px 14px;border-radius:18px;background:#fff;border:2.5px solid var(--ink);box-shadow:0 5px 0 rgba(18,26,51,.14)}
.panel h2{margin:0;font:800 19px/1.2 var(--kid)}
.panel>p{margin:3px 0 10px;color:#44506b;font-weight:700;font-size:14.5px}
.town svg{display:block;width:100%;height:auto;border-radius:12px;border:2px solid var(--ink);background:#d8eefa}
.rank{margin:8px 0 0;font-weight:700;font-size:14.5px;color:#27314d}
.site{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;cursor:pointer;margin:0 0 9px;padding:10px 12px;
  border:2.5px dashed var(--blue);border-radius:14px;background:#f3f9ff;background-image:linear-gradient(#dcecfa 1px,transparent 1px),linear-gradient(90deg,#dcecfa 1px,transparent 1px);background-size:16px 16px;transition:transform .12s}
.site:active{transform:translateY(2px)}
.site:hover{border-style:solid}
.site i{width:46px;height:46px;border-radius:12px;background:var(--ac);border:2.5px solid var(--ink);display:grid;place-items:center;font:800 22px/1 var(--kid);font-style:normal}
.site b{display:block;font:800 19px/1.15 var(--kid)}
.site small{display:block;font-weight:700;font-size:13.5px;color:#44506b}
.nbtn{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 16px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;box-shadow:0 4px 0 rgba(18,26,51,.18);font:800 15.5px/1 var(--body);cursor:pointer}
.nbtn svg{width:22px;height:22px}
.nbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(18,26,51,.18)}
details.nt{border-top:2px dashed #cfd8e6}
details.nt summary{cursor:pointer;font:800 16px/1.3 var(--kid);padding:10px 0;list-style:none;display:flex;gap:8px;align-items:center}
details.nt summary::-webkit-details-marker{display:none}
details.nt summary::before{content:"▸";color:#d98f00;transition:transform .15s}
details.nt[open] summary::before{transform:rotate(90deg)}
details.nt p{margin:0 0 9px;font-weight:600;font-size:15px}
.eq{font:700 15.5px/1.6 ui-monospace,Menlo,Consolas,monospace!important;background:#f3f9ff;border-left:4px solid var(--blue);border-radius:6px;padding:6px 10px;margin:0 0 9px!important;color:#121a33}
.ut{border-collapse:collapse;margin:0 0 9px;font:800 16px/1.3 ui-monospace,Menlo,Consolas,monospace}
.ut td{padding:3px 10px;border:2px solid #cfd8e6;background:#fffdf3}

/* žaidimas */
.hud{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:start;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:7px 10px 8px;margin:0 0 7px;box-shadow:0 4px 0 rgba(18,26,51,.12)}
.hud-t{font:800 12.5px/1.2 var(--body);color:#5b667f;text-transform:uppercase;letter-spacing:.03em}
.hud-t b{color:#b97800}
.hud-a{font:700 15.5px/1.3 var(--body);margin-top:2px}
.hud-a b{font-weight:800;background:#fff1c9;border-radius:6px;padding:0 5px;white-space:nowrap}
.hud-p{grid-column:1/-1;font:700 13.5px/1.3 var(--body);color:#44506b;min-height:18px}
.hud-p span{color:#121a33;font-weight:800}
.hud-b{display:flex;gap:6px}
.sq{width:40px;height:40px;border-radius:11px;border:2.5px solid var(--ink);background:#fff;display:grid;place-items:center;cursor:pointer;padding:0;font:800 18px/1 var(--kid)}
.sq svg{width:22px;height:22px}
.stage{position:relative;flex:1;min-height:240px;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#cfeaf7;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#toast{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:max-content;max-width:92%;background:#121a33;color:#fff;border-radius:10px;padding:7px 12px;font:700 14px/1.3 var(--body);text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:.94}
.ctl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 2px 0}
.joy{position:relative;width:118px;height:118px;border-radius:50%;background:#fff;border:3px solid var(--ink);touch-action:none;box-shadow:inset 0 0 0 10px #eef3f8}
.joy::before{content:"";position:absolute;inset:0;background:
  conic-gradient(from 45deg,transparent 0 0) ,
  linear-gradient(#9aa6ba,#9aa6ba) 50% 9px/3px 12px no-repeat,linear-gradient(#9aa6ba,#9aa6ba) 50% calc(100% - 9px)/3px 12px no-repeat,
  linear-gradient(#9aa6ba,#9aa6ba) 9px 50%/12px 3px no-repeat,linear-gradient(#9aa6ba,#9aa6ba) calc(100% - 9px) 50%/12px 3px no-repeat;border-radius:50%}
.joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:var(--ac);border:3px solid var(--ink);box-shadow:0 3px 0 rgba(18,26,51,.3);pointer-events:none}
.ctl-m{font:700 12.5px/1.3 var(--body);color:#5b667f;text-align:center}
.ctl-m kbd{display:inline-block;border:1.5px solid #9aa6ba;border-radius:5px;padding:0 5px;font:800 12px/1.5 var(--body);background:#fff;color:#121a33}
@media (hover:none){.ctl-m .kb{display:none}}
#act{width:118px;height:118px;border-radius:50%;border:3px solid var(--ink);background:var(--ac);font:800 21px/1.05 var(--kid);color:var(--ink);cursor:pointer;box-shadow:0 5px 0 rgba(18,26,51,.3);touch-action:manipulation;transition:background .15s,opacity .15s}
#act:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(18,26,51,.3)}
#act.idle{background:#e9eef4;color:#7c879c}
#act.carry{background:#59c36a}
@media (max-height:640px){.joy,#act{width:92px;height:92px}.joy i{width:44px;height:44px;margin:-22px}#act{font-size:17px}}
#dlg{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:10px;background:rgba(234,245,251,.8);overflow:auto}
.card{width:min(440px,100%);max-height:100%;overflow:auto;background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 7px 0 rgba(18,26,51,.2);padding:12px 14px 14px;animation:mkIn .3s cubic-bezier(.2,1.3,.4,1)}
.card.ok{border-color:#1e9a52}.card.bad{border-color:#d9482b}.card.hint{border-color:#d98f00}
.card-h{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center;margin-bottom:6px}
.card-h svg{width:64px;height:auto;display:block}
.card-h b{font:800 21px/1.15 var(--kid)}
.card-h small{display:block;font:800 12px/1.2 var(--body);color:#5b667f;text-transform:uppercase;letter-spacing:.03em}
.card p{margin:0 0 8px;font-weight:600;font-size:15px}
.card .rel{font-weight:800;color:#1f6fb5}
.card .mk-btn{width:100%;min-height:50px;font-size:19px;margin-top:4px}
.card .mk-btn.alt{margin-top:8px}
.end{text-align:center}
.end h2{margin:6px 0 2px;font:800 26px/1.1 var(--kid)}
.end .mk-srow{margin:2px 0}
.newr{display:inline-block;background:#fff1c9;border:2px solid var(--ink);border-radius:10px;padding:4px 10px;font-weight:800!important}
#notes{position:fixed;inset:0;z-index:40;background:rgba(234,245,251,.9);display:grid;place-items:center;padding:12px}
#notes .card{width:min(560px,100%);max-height:92vh;background:#fffdf3;background-image:linear-gradient(#ece6cf 1px,transparent 1px);background-size:100% 26px}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <main id="menu"></main>
  <main id="game" hidden>
    <div class="hud">
      <div><div class="hud-t" id="hT"></div><div class="hud-a" id="hA"></div></div>
      <div class="hud-b"><button type="button" class="sq" id="bNotes" aria-label="Meistro užrašai"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2z"/><path d="M9 8h6M9 12h6M9 16h3" stroke-linecap="round"/></svg></button><button type="button" class="sq" id="bQuit" aria-label="Į planą">✕</button></div>
      <div class="hud-p" id="hP"></div>
    </div>
    <div class="stage" id="stage"><canvas id="cv"></canvas><div id="toast" role="status"></div><div id="dlg" hidden></div></div>
    <div class="ctl">
      <div class="joy" id="joy" aria-label="Krano vairalazdė"><i></i></div>
      <div class="ctl-m" id="ctlM"></div>
      <button type="button" id="act" class="idle"></button>
    </div>
  </main>
</div>
<div id="notes" hidden></div>
<script>
(function(){
"use strict";
const T = window.MK_T, K = window.MK_KRANAS, U = K.U, GAME = "bokstinis-kranas";
const $ = id => document.getElementById(id);
const app = $("app"), menu = $("menu"), game = $("game"), cv = $("cv"), cx = cv.getContext("2d");
app.prepend(MK.top({ title: T.title, grade: 3 }));
const INK = "#121a33", FONT = "Manrope,system-ui,sans-serif";
/* pasaulio matmenys */
const W = 1000, H = 600, GY = 560, JY = 52, MASTX = 96, TX0 = 150, TX1 = 930, BX = 690, GAPX = 550, GAPW = 280;
const PAL = [
  { beam: "#d9a066", dark: "#a8713c", col: "#e9dcc3", name: "#8a5a2b" },
  { beam: "#b9c4d0", dark: "#7f8b9a", col: "#dfe5ec", name: "#55606f" },
  { beam: "#7fb2e5", dark: "#3f78b5", col: "#d8e6f4", name: "#2c5f96" },
  { beam: "#e3b778", dark: "#a8743a", col: "#cfd6de", name: "#7a5220" },
  { beam: "#f08a5d", dark: "#b85530", col: "#f1e3d3", name: "#9b4420" },
  { beam: "#6fcf97", dark: "#2e8f5b", col: "#e3efe6", name: "#1f6f44" }
];

/* ================= meniu ================= */
const FOREMAN = `<svg viewBox="0 0 80 120" aria-hidden="true"><ellipse cx="40" cy="115" rx="24" ry="4" fill="#121a33" opacity=".15"/>
<path d="M28 78h10v30H26zM42 78h10l2 30H42z" fill="#2f4a7a" stroke="#121a33" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M22 108h17v6H20zM41 108h17l2 6H41z" fill="#5a3a22" stroke="#121a33" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M22 46q18-8 36 0l3 34H19z" fill="#ff8a1f" stroke="#121a33" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M27 56h26M26 68h28" stroke="#fff3a3" stroke-width="4"/><path d="M40 44v36" stroke="#121a33" stroke-width="2"/>
<path d="M22 50q-9 8-8 22" fill="none" stroke="#ff8a1f" stroke-width="9" stroke-linecap="round"/><path d="M22 50q-9 8-8 22" fill="none" stroke="#121a33" stroke-width="2.5" stroke-linecap="round" transform="translate(-4.6 0)"/>
<circle cx="14" cy="74" r="5" fill="#f6c9a0" stroke="#121a33" stroke-width="2.5"/>
<path d="M58 50q10 2 12-12" fill="none" stroke="#ff8a1f" stroke-width="9" stroke-linecap="round"/>
<circle cx="70" cy="36" r="5" fill="#f6c9a0" stroke="#121a33" stroke-width="2.5"/>
<rect x="63" y="20" width="14" height="18" rx="2" fill="#eaf5fb" stroke="#1f6fb5" stroke-width="2.5" transform="rotate(12 70 29)"/>
<circle cx="40" cy="30" r="13" fill="#f6c9a0" stroke="#121a33" stroke-width="2.5"/>
<circle cx="35" cy="31" r="1.8" fill="#121a33"/><circle cx="45" cy="31" r="1.8" fill="#121a33"/><path d="M35 37q5 4 10 0" fill="none" stroke="#121a33" stroke-width="2.2" stroke-linecap="round"/>
<path d="M25 26q0-16 15-16t15 16z" fill="#ffc61a" stroke="#121a33" stroke-width="2.5" stroke-linejoin="round"/><path d="M22 26h36" stroke="#121a33" stroke-width="4" stroke-linecap="round"/><path d="M40 10v8" stroke="#121a33" stroke-width="2.5"/></svg>`;
function heroArt(){
  return `<svg viewBox="0 0 520 250" aria-hidden="true"><rect width="520" height="250" fill="#cfeaf7"/><circle cx="455" cy="48" r="26" fill="#ffe27a"/>
  <g fill="#fff"><ellipse cx="150" cy="40" rx="38" ry="12"/><ellipse cx="172" cy="32" rx="22" ry="10"/><ellipse cx="350" cy="70" rx="30" ry="9"/></g>
  <path d="M0 196q130-26 260-6t260-10v70H0z" fill="#bfe3a8"/><rect y="214" width="520" height="36" fill="#e3c99a"/><path d="M0 214h520" stroke="#121a33" stroke-width="3"/>
  <g stroke="#121a33" stroke-width="3" stroke-linejoin="round"><rect x="70" y="40" width="16" height="174" fill="#ffc61a"/><path d="M70 60l16 20M86 60l-16 20M70 100l16 20M86 100l-16 20M70 140l16 20M86 140l-16 20M70 180l16 20M86 180l-16 20" stroke-width="2"/>
  <path d="M20 40h420v10H20z" fill="#ffc61a"/><path d="M78 12l-50 28M78 12l230 28M78 12v28" fill="none" stroke-width="2.5"/><rect x="24" y="50" width="30" height="22" fill="#8d99ad"/><rect x="88" y="52" width="24" height="24" rx="3" fill="#fff"/></g>
  <path d="M110 40l12 10 12-10 12 10 12-10 12 10 12-10 12 10 12-10 12 10 12-10 12 10 12-10 12 10 12-10 12 10 12-10 12 10 12-10 12 10 12-10 12 10 12-10 12 10 12-10 12 10 12-10" fill="none" stroke="#121a33" stroke-width="1.6"/>
  <rect x="318" y="50" width="22" height="9" fill="#121a33"/><path d="M329 59v64" stroke="#121a33" stroke-width="2.5"/><path d="M329 123l-52 18M329 123l52 18" stroke="#121a33" stroke-width="2"/>
  <rect x="268" y="141" width="122" height="15" rx="2" fill="#f08a5d" stroke="#121a33" stroke-width="3"/><rect x="298" y="124" width="62" height="16" rx="4" fill="#fff" stroke="#121a33" stroke-width="2"/><text x="329" y="136.500" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="800" font-size="12" fill="#121a33">1 m 5 dm</text>
  <g stroke="#121a33" stroke-width="3"><rect x="400" y="170" width="12" height="44" fill="#e9dcc3"/><rect x="494" y="170" width="12" height="44" fill="#e9dcc3"/><rect x="400" y="156" width="60" height="14" rx="2" fill="#f08a5d"/></g>
  <path d="M414 200h78M414 200l7-4v8zM492 200l-7-4v8z" stroke="#1f6fb5" stroke-width="2" fill="#1f6fb5"/><rect x="433" y="191" width="40" height="17" rx="4" fill="#fff" stroke="#1f6fb5" stroke-width="2"/><text x="453" y="204" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="800" font-size="12.500" fill="#1f6fb5">3 m</text>
  <g transform="translate(176 122) scale(.78)">${FOREMAN.replace(/<svg[^>]*>|<\/svg>/g, "")}</g></svg>`;
}
const TOWN = [
  x => `<g transform="translate(${x} 0)"><path d="M6 86V52l22-18 22 18v34z" fill="#d9a066" stroke="#121a33" stroke-width="2.5" stroke-linejoin="round"/><path d="M2 54l26-22 26 22" fill="none" stroke="#a23b2a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="22" y="62" width="12" height="24" fill="#7a4b2a" stroke="#121a33" stroke-width="2"/><rect x="38" y="58" width="9" height="9" fill="#cfeaf7" stroke="#121a33" stroke-width="2"/></g>`,
  x => `<g transform="translate(${x} 0)"><path d="M4 48h52v6H4z" fill="#7f8b9a" stroke="#121a33" stroke-width="2.5"/><path d="M8 54v32M52 54v32" stroke="#121a33" stroke-width="4"/><rect x="12" y="56" width="36" height="20" fill="#cfeaf7" stroke="#121a33" stroke-width="2" opacity=".9"/><rect x="14" y="78" width="32" height="4" fill="#a8713c" stroke="#121a33" stroke-width="1.5"/><circle cx="30" cy="40" r="7" fill="#1f6fb5" stroke="#121a33" stroke-width="2"/><text x="30" y="44" text-anchor="middle" font-size="10" font-weight="800" fill="#fff" font-family="Manrope,sans-serif">A</text></g>`,
  x => `<g transform="translate(${x} 0)"><path d="M2 86V50l14-10v10l14-10v10l14-10v10l14-10v46z" fill="#7fb2e5" stroke="#121a33" stroke-width="2.5" stroke-linejoin="round"/><rect x="8" y="62" width="16" height="24" fill="#3f78b5" stroke="#121a33" stroke-width="2"/><rect x="32" y="60" width="20" height="10" fill="#fff" stroke="#121a33" stroke-width="2"/><rect x="46" y="24" width="7" height="22" fill="#b9c4d0" stroke="#121a33" stroke-width="2"/></g>`,
  x => `<g transform="translate(${x} 0)"><rect x="2" y="64" width="38" height="12" fill="#8d99ad" stroke="#121a33" stroke-width="2.5"/><path d="M40 52h12l6 12v12H40z" fill="#e3493b" stroke="#121a33" stroke-width="2.5" stroke-linejoin="round"/><rect x="5" y="48" width="14" height="16" fill="#e3b778" stroke="#121a33" stroke-width="2"/><rect x="21" y="48" width="14" height="16" fill="#e3b778" stroke="#121a33" stroke-width="2"/><rect x="13" y="32" width="14" height="16" fill="#e3b778" stroke="#121a33" stroke-width="2"/><circle cx="14" cy="80" r="6" fill="#121a33"/><circle cx="46" cy="80" r="6" fill="#121a33"/></g>`,
  x => `<g transform="translate(${x} 0)"><rect x="2" y="34" width="56" height="52" fill="#f1c9a5" stroke="#121a33" stroke-width="2.5"/><g fill="#cfeaf7" stroke="#121a33" stroke-width="1.8"><rect x="7" y="40" width="9" height="9"/><rect x="20" y="40" width="9" height="9"/><rect x="33" y="40" width="9" height="9"/><rect x="46" y="40" width="9" height="9"/><rect x="7" y="55" width="9" height="9"/><rect x="20" y="55" width="9" height="9"/><rect x="33" y="55" width="9" height="9"/><rect x="46" y="55" width="9" height="9"/></g><rect x="24" y="70" width="12" height="16" fill="#9b4420" stroke="#121a33" stroke-width="2"/><path d="M30 34V14" stroke="#121a33" stroke-width="2.5"/><path d="M30 14h14v4H30zM30 18h14v4H30zM30 22h14v4H30z" fill="#fdb913" stroke="#121a33" stroke-width="1"/><path d="M30 18h14v4H30z" fill="#006a44"/><path d="M30 22h14v4H30z" fill="#c1272d"/></g>`,
  x => `<g transform="translate(${x} 0)"><path d="M20 86l4-62h12l4 62z" fill="#6fcf97" stroke="#121a33" stroke-width="2.5" stroke-linejoin="round"/><path d="M22 60h16M23 44h14" stroke="#121a33" stroke-width="2"/><path d="M12 24h36l-4-12H16z" fill="#fff" stroke="#121a33" stroke-width="2.5" stroke-linejoin="round"/><path d="M14 12l16-10 16 10z" fill="#2e8f5b" stroke="#121a33" stroke-width="2.5" stroke-linejoin="round"/></g>`
];
function townSvg(best){
  let g = "";
  K.LEVELS.forEach((L, i) => {
    const x = 14 + i * 84;

  if(ix || iy) G.moved = true;
  /* vežimėlis ir lynas */
  const tv = ix * 190, acc = (ix === 0 || ix * G.vx < 0 ? 1100 : 520) * dt, dv = Math.max(-acc, Math.min(acc, tv - G.vx)); G.vx += dv;

  if(G.carry){ G.carry.x = h.x; G.carry.y = h.y + 12; G.carry.rot = G.th * 0.5; }
  /* judančios detalės */
  const all = G.items.concat(G.geo.pre);
  all.forEach(it => { const w = it.tw; if(!w) return; w.t += dt / w.d; const q = Math.min(1, w.t), e = w.ease === "in" ? q * q : w.ease === "out" ? 1 - (1 - q) * (1 - q) : q * q * (3 - 2 * q);

    g.ref.forEach(it => { const p = panPos(g, 0, it.slot); it.x = p.x + g.ox; it.y = p.y; }); z.placed.forEach(it => { if(it.state === "placed" || it.state === "built"){ const p = panPos(g, 1, it.slot); it.x = p.x; it.y = p.y; } }); }
  /* kandidatas kabinti */
  G.cand = (!G.carry && !G.dialog && !G.lock) ? findCand(h) : null;
  const a = $("act"), lab = G.carry ? T.drop : T.grab, cls = G.carry ? "carry" : G.cand ? "" : "idle";
  if(a.textContent !== lab) a.textContent = lab; if(a.className !== cls) a.className = cls;
  /* kamera */
  const want = Math.max(0, Math.min(W - vw, h.x - vw / 2 + G.vx * 0.25)); G.camX += (want - G.camX) * Math.min(1, dt * 4); if(vw >= W) G.camX = (W - vw) / 2;
