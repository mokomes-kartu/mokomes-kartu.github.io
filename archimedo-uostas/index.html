<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Archimedo uostas – MokomėsKartu.lt</title>
<meta name="description" content="9 klasės fizikos žaidimas: Archimedo jėga ir kūnų plūduriavimo sąlygos – plauks ar skęs, kiek krovinio galima pakrauti į baržą.">
<meta name="theme-color" content="#fff9e6">
<meta name="robots" content="noindex">
<link rel="icon" href="/logo/mk-ikona.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800&family=Manrope:wght@600;700;800&display=swap">
<script src="/bendra/mk.js"></script>
<script src="/archimedo-uostas/tekstai.lt.js"></script>
<style>
/* Meniu: kapitonas uoste, laivynas (kolekcija), lygiai, „Noriu pasimokyti“.
   Užduotis: vandens baseinas su kūnu → atsakymas → pelėdžiuko paaiškinimas → „Toliau“. 3 lygyje – baržos krovimas kranu. */
body{--ac:#1b84d6;--ac-ink:#fff;--ac-soft:#dcefff}
.mk-hero{padding-top:0}
.mk-hero h1{margin-top:8px;font-size:clamp(32px,8.4vw,54px)}
.mk-hero p{max-width:40ch;font-size:16.5px}
.hero-art{width:min(100%,480px);border-radius:26px;overflow:hidden;position:relative;box-shadow:0 6px 0 rgba(18,26,51,.15)}
.hero-art svg{display:block;width:100%;height:auto}
.hero-art::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 3px var(--ink);pointer-events:none}
.col{width:100%;max-width:520px;margin:0 auto 14px;padding:12px 14px 14px;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 2.5px var(--ink),0 5px 0 rgba(18,26,51,.14)}
.col h2{margin:0;font:800 18px/1.2 var(--kid);display:flex;gap:8px;align-items:center}
.col h2 svg{width:28px;height:28px;flex:none}
.col p{margin:4px 0 10px;color:var(--soft);font-weight:700;font-size:14.5px}
.fleet{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:7px;border-radius:14px;background:#cfe8fb;box-shadow:inset 0 0 0 2px #9ccaf0}
.fleet i{font-style:normal;display:grid;justify-items:center;align-content:start;gap:1px;padding:4px 1px 3px;border-radius:9px;background:rgba(255,255,255,.75);min-width:0}
.fleet i svg{width:100%;height:auto;display:block;max-height:42px}
.fleet i span{font:800 8.6px/1.15 var(--body);letter-spacing:-.01em;color:var(--ink);text-align:center}
.fleet i.lock svg{filter:brightness(0) opacity(.16)}
.fleet i.lock span{color:#7b8aa3}
.fleet i.new{animation:mkPop .5s cubic-bezier(.2,1.6,.4,1)}

/* ---------- žaidimas ---------- */
.hud{display:flex;align-items:center;gap:8px;margin:0 0 8px;min-height:36px}
.hud .mk-dots{margin-right:auto;justify-content:flex-start}
.chip{display:inline-flex;align-items:baseline;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink);font:800 17px/36px var(--kid);white-space:nowrap}
.chip small{font:800 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.chip.pop{animation:mkPop .35s cubic-bezier(.2,1.6,.4,1)}
.card{width:100%;max-width:600px;margin:0 auto 10px;padding:12px 14px 14px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.12)}
.card sub{font-size:.72em}
.txt{margin:0 0 10px;font:700 16px/1.5 var(--body)}
.txt b{font-weight:800}
.scn{display:block;width:100%;height:auto;border-radius:14px;box-shadow:inset 0 0 0 2px #b9d9f2}
.scnw{margin:0 0 10px;border-radius:14px;overflow:hidden;box-shadow:0 0 0 2.5px var(--ink)}
.legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:-2px 0 10px;min-height:28px}
.legend span{display:inline-block;padding:3px 10px;border-radius:999px;font:800 13.5px/1.2 var(--body);background:#fff;box-shadow:inset 0 0 0 2px var(--ink)}
.legend .p{color:#c4301f;box-shadow:inset 0 0 0 2px #e8604b}
.legend .f{color:#1568b8;box-shadow:inset 0 0 0 2px #3f93e0}
.step .qt{margin:0 0 10px;font:800 17.5px/1.35 var(--body)}
.ans{display:grid;gap:8px}
.ans.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.a{min-height:52px;padding:10px 12px;border:0;border-radius:14px;background:#fff;cursor:pointer;text-align:left;font:800 16.5px/1.3 var(--body);color:var(--ink);
  box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.16);transition:transform .1s;touch-action:manipulation}
.ans.two .a{text-align:center}
.a:active{transform:translateY(3px)}
.a.ok{background:#dff7e6;box-shadow:inset 0 0 0 3.5px var(--good),0 4px 0 rgba(18,26,51,.16)}
.a.no{background:#ffe6df;box-shadow:inset 0 0 0 3.5px var(--bad),0 4px 0 rgba(18,26,51,.16)}
.ans.done .a{pointer-events:none}
.ans.done .a:not(.ok):not(.no){opacity:.5}
.go{display:flex;width:100%;max-width:600px;margin:4px auto 0}
.mk-why{max-width:600px;margin-inline:auto}
.mk-why-m p{margin:4px 0}
.mk-why sub,.mk-lt sub{font-size:.72em}
.fade{animation:mkIn .4s cubic-bezier(.2,1.2,.4,1)}
/* 3 lygis: krovimas */
.load{display:grid;grid-template-columns:54px minmax(0,1fr) 54px;align-items:center;gap:10px;margin:2px 0 10px}
.load button{width:54px;height:54px;border:0;border-radius:50%;background:#fff;cursor:pointer;font:800 30px/1 var(--kid);box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.2);touch-action:manipulation}
.load button:active{transform:translateY(3px)}
.load button[disabled]{opacity:.4}
.load div{text-align:center;font:800 15px/1.1 var(--body);color:var(--soft)}
.load output{display:block;font:800 36px/1.1 var(--kid);color:var(--ink)}
.note{min-height:24px;margin:0 0 8px;text-align:center;font:800 15.5px/1.35 var(--body)}
.note.good{color:#1c8a52}.note.warn{color:#b8531a}
.tr{display:block;text-align:center;color:var(--soft);font:700 13.5px/1.3 var(--body);margin:-2px 0 8px}
.bigbtn{display:flex;width:100%;min-height:54px;font-size:19px}
.wave{animation:wv 3.2s linear infinite}
@keyframes wv{to{transform:translateX(-40px)}}
.bub{animation:bu 1.6s ease-in infinite}
@keyframes bu{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-34px);opacity:0}}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <section id="menu">
    <div class="mk-hero">
      <div class="hero-art" id="heroArt"></div>
      <h1 id="heroH"></h1>
      <p id="heroP"></p>
    </div>
    <div class="col" id="col"></div>
    <div id="levels"></div>
    <div id="learn"></div>
  </section>
  <section id="play" hidden>
    <div class="hud"><div id="dots"></div><span class="chip" id="ptsChip"><small id="ptsL"></small><span id="pts">0</span></span></div>
    <div id="stage"></div>
  </section>
</div>
<script>
(function(){
"use strict";
const T = window.MK_T, nf = T.nf;
const GAME = "archimedo-uostas", GRADES = [9];
const K = "#121a33", S = `stroke="${K}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"`;
const R = MK.rnd, P = MK.pick, SH = MK.shuffle;
const G = 10;
const RHO = { water: 1000, sea: 1030, kero: 800, oil: 900 };
const LIQ = { water: ["#7fcdf5", "#2d93d6"], sea: ["#6fd0d8", "#1f9aa8"], kero: ["#f5e6a0", "#d8b94a"], oil: ["#f8d878", "#d9a62a"] };

/* ================= piešiniai ================= */
/* kūnai (viewBox 60 × 60) */
const ITEM = {
  cork:  `<rect x="15" y="8" width="30" height="44" rx="7" fill="#dca865" ${S}/><path d="M22 18h.1M36 24h.1M26 34h.1M38 42h.1M22 44h.1" stroke="#a9753a" stroke-width="4" stroke-linecap="round"/>`,
  pine:  `<rect x="6" y="16" width="42" height="28" rx="5" fill="#e0b070" ${S}/><ellipse cx="48" cy="30" rx="7" ry="14" fill="#f2cf94" ${S}/><ellipse cx="48" cy="30" rx="3.2" ry="7" fill="none" stroke="#b8803c" stroke-width="1.8"/><path d="M12 24h24M12 36h20" stroke="#b8803c" stroke-width="1.8" stroke-linecap="round"/>`,
  oak:   `<rect x="6" y="16" width="42" height="28" rx="5" fill="#9a6a3c" ${S}/><ellipse cx="48" cy="30" rx="7" ry="14" fill="#c99a62" ${S}/><ellipse cx="48" cy="30" rx="3.2" ry="7" fill="none" stroke="#7a4f27" stroke-width="1.8"/><path d="M12 24h24M12 36h20" stroke="#6e4522" stroke-width="1.8" stroke-linecap="round"/>`,
  ice:   `<rect x="10" y="10" width="40" height="40" rx="8" fill="#d8f1ff" ${S}/><path d="M17 20l9-6M16 28l5-4" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><path d="M36 44l8-8" stroke="#9fd2ee" stroke-width="3" stroke-linecap="round"/>`,
  glass: `<rect x="10" y="10" width="40" height="40" rx="6" fill="#bfeadc" ${S}/><path d="M17 20l10-7M16 30l4-3" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>`,
  alu:   `<path d="M8 22l8-10h36l-8 10z" fill="#eef1f6" ${S}/><rect x="8" y="22" width="36" height="28" rx="2" fill="#c9d0dc" ${S}/><path d="M44 22l8-10v28l-8 10z" fill="#a7b0c0" ${S}/>`,
  steel: `<circle cx="30" cy="30" r="21" fill="#7a8599" ${S}/><circle cx="22" cy="22" r="6" fill="#e8edf5" opacity=".85"/>`,
  copper:`<circle cx="30" cy="30" r="21" fill="#d9763a" ${S}/><circle cx="22" cy="22" r="6" fill="#ffd2ae" opacity=".85"/>`,
  lead:  `<path d="M8 22l8-10h36l-8 10z" fill="#6f7686" ${S}/><rect x="8" y="22" width="36" height="28" rx="2" fill="#4c5262" ${S}/><path d="M44 22l8-10v28l-8 10z" fill="#363b49" ${S}/>`,
  plastic:`<rect x="10" y="10" width="40" height="40" rx="6" fill="#ff8a6b" ${S}/><path d="M17 20l10-7" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>`,
  wax:   `<rect x="10" y="10" width="40" height="40" rx="6" fill="#fff0c4" ${S}/><path d="M17 20l10-7" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><path d="M30 22v8" stroke="#8a5a2b" stroke-width="2.6" stroke-linecap="round"/>`,
  box:   `<rect x="9" y="12" width="42" height="36" rx="5" fill="#cfd6e2" ${S}/><path d="M9 24h42M9 36h42" stroke="#7a8599" stroke-width="2.4"/><circle cx="30" cy="30" r="5" fill="#ffd23f" ${S}/>`,
  balloon:`<path d="M30 3C14 3 7 15 8 24c1 10 10 18 18 22h8c8-4 17-12 18-22C53 15 46 3 30 3z" transform="scale(.82) translate(6.5 1)" fill="#ff5a5f" ${S}/><path d="M30 5q-9 12-4 40M30 5q9 12 4 40" transform="scale(.82) translate(6.5 1)" fill="none" stroke="#fff" stroke-width="3" opacity=".8"/><path d="M24 40l3 10M36 40l-3 10" stroke="${K}" stroke-width="1.8" stroke-linecap="round"/><rect x="23" y="49" width="14" height="9" rx="2" fill="#c98a4a" ${S}/>`
};
const DENS = { cork: 240, pine: 500, oak: 700, ice: 900, glass: 2500, alu: 2700, steel: 7800, copper: 8900, lead: 11300, plastic: 600, wax: 900 };
const itemSvg = (k, s) => `<svg width="${s}" height="${s}" viewBox="0 0 60 60" aria-hidden="true">${ITEM[k]}</svg>`;

/* laivai (viewBox 100 × 60) */
const SHIP = [
  `<path d="M10 30H90L78 46Q50 54 22 46Z" fill="#d9563f" ${S}/><path d="M13 36H87" stroke="#fff" stroke-width="3"/><path d="M34 30v-4h32v4" fill="none" ${S}/><path d="M30 20l22 20" stroke="#8a5a2b" stroke-width="3" stroke-linecap="round"/><ellipse cx="30" cy="20" rx="4" ry="2" fill="#c98a4a" ${S} transform="rotate(40 30 20)"/>`,
  `<rect x="12" y="38" width="76" height="9" rx="4.5" fill="#c98a4a" ${S}/><rect x="14" y="29" width="72" height="9" rx="4.5" fill="#dea35c" ${S}/><path d="M50 29V8" stroke="#6e4522" stroke-width="3" stroke-linecap="round"/><path d="M50 8l20 6-20 6z" fill="#ff5a5f" ${S}/>`,
  `<path d="M4 38Q50 24 96 38Q50 52 4 38z" fill="#ffc61a" ${S}/><ellipse cx="46" cy="36" rx="9" ry="4" fill="#3a2d1a" ${S}/><circle cx="46" cy="25" r="5.5" fill="#f1c7a0" ${S}/><path d="M38 24q8-8 16 0" fill="#e8453c" ${S}/><path d="M24 20l44 24" stroke="#6e4522" stroke-width="3" stroke-linecap="round"/><path d="M18 17l12 8M62 40l12 8" stroke="#2d93d6" stroke-width="5" stroke-linecap="round"/>`,
  `<path d="M12 42H88L78 54H22Z" fill="#7a4b2a" ${S}/><path d="M50 8V42" stroke="${K}" stroke-width="3"/><path d="M50 10Q78 22 74 40H50Z" fill="#fff" ${S}/><path d="M46 14Q26 26 28 40H46Z" fill="#ff5a5f" ${S}/><path d="M50 8l10 3-10 3z" fill="#ffc61a" ${S}/>`,
  `<path d="M6 36H94L88 52H12Z" fill="#37506e" ${S}/><rect x="14" y="22" width="18" height="14" rx="1.5" fill="#ff8a1f" ${S}/><rect x="34" y="22" width="18" height="14" rx="1.5" fill="#2fb36b" ${S}/><rect x="54" y="22" width="18" height="14" rx="1.5" fill="#ffc61a" ${S}/><rect x="24" y="10" width="18" height="12" rx="1.5" fill="#e8453c" ${S}/><rect x="44" y="10" width="18" height="12" rx="1.5" fill="#2f8bff" ${S}/>`,
  `<path d="M4 34H92L84 52H14Z" fill="#c8362f" ${S}/><path d="M4 34H92" stroke="#fff" stroke-width="3"/><rect x="58" y="18" width="24" height="16" rx="2" fill="#fff" ${S}/><rect x="64" y="8" width="8" height="10" fill="#2f8bff" ${S}/><path d="M63 24h5M72 24h5" stroke="${K}" stroke-width="3" stroke-linecap="round"/><rect x="14" y="22" width="14" height="12" fill="#ff8a1f" ${S}/><rect x="30" y="22" width="14" height="12" fill="#ffc61a" ${S}/>`,
  `<ellipse cx="46" cy="36" rx="38" ry="14" fill="#ffc61a" ${S}/><path d="M38 24h18v-8h8" fill="none" stroke="${K}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 24h18l-2 6H40z" fill="#ffc61a" ${S}/><circle cx="34" cy="37" r="5" fill="#bfe8ff" ${S}/><circle cx="52" cy="37" r="5" fill="#bfe8ff" ${S}/><path d="M86 28l8-6v28l-8-6z" fill="#e8453c" ${S}/>`,
  `<ellipse cx="50" cy="24" rx="23" ry="22" fill="#ff5a5f" ${S}/><path d="M50 2q-14 14-6 42M50 2q14 14 6 42" fill="none" stroke="#fff" stroke-width="3.2" opacity=".85"/><path d="M42 44l4 6M58 44l-4 6" stroke="${K}" stroke-width="2" stroke-linecap="round"/><rect x="42" y="50" width="16" height="9" rx="2" fill="#c98a4a" ${S}/>`,
  `<path d="M4 34H94L86 52Q50 58 20 52Q10 44 4 34z" fill="#c8362f" ${S}/><path d="M4 34L20 52" stroke="${K}" stroke-width="2"/><rect x="44" y="20" width="26" height="14" rx="2" fill="#fff" ${S}/><rect x="52" y="8" width="10" height="12" fill="#ffc61a" ${S}/><path d="M50 27h4M58 27h4M66 27h2" stroke="${K}" stroke-width="3" stroke-linecap="round"/>`,
  `<path d="M8 36H92L82 52H18Z" fill="#2f6fb8" ${S}/><path d="M12 42H88" stroke="#fff" stroke-width="3"/><rect x="48" y="22" width="24" height="14" rx="2" fill="#fff" ${S}/><path d="M28 36V12L14 24M28 12l16 8" fill="none" stroke="${K}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 24Q22 34 32 30" fill="none" stroke="#9ab0c8" stroke-width="2.4"/>`
];
const shipSvg = i => `<svg viewBox="0 0 100 60" aria-hidden="true">${SHIP[i]}</svg>`;

/* sandėlis: vandens baseinas */
const TX = 24, TW = 272, TY = 24, FL = 196, WY = 104;
let uid = 0;
function tank(inner, liq, extra){
  const c = LIQ[liq || "water"], id = "u" + (++uid);
  return `<svg class="scn" viewBox="0 0 320 220" aria-hidden="true">
    <defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient>
    <clipPath id="c${id}"><rect x="${TX + 2}" y="${TY}" width="${TW - 4}" height="${FL - TY - 2}" rx="8"/></clipPath></defs>
    <rect width="320" height="220" fill="#eaf5ff"/><path d="M0 200h320v20H0z" fill="#c9dff2"/>
    <rect x="${TX}" y="${TY}" width="${TW}" height="${FL - TY}" rx="10" fill="#f8fcff"/>
    <g clip-path="url(#c${id})">${inner}
      <g id="wat"><rect x="${TX}" y="${WY}" width="${TW}" height="${FL - WY}" fill="url(#g${id})" opacity=".55"/>
      <g class="wave"><path d="M${TX - 40} ${WY} q10 -6 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 V${WY + 6} H${TX - 40}z" fill="${c[1]}" opacity=".5"/></g></g>
      ${extra || ""}
    </g>
    <rect x="${TX}" y="${TY}" width="${TW}" height="${FL - TY}" rx="10" fill="none" stroke="${K}" stroke-width="3.2"/>
    <rect x="${TX + 8}" y="${TY + 8}" width="5" height="52" rx="2.5" fill="#fff" opacity=".7"/>
  </svg>`;
}
const arrow = (x, y0, len, up, col, lab) => {
  const y1 = up ? y0 - len : y0 + len, d = up ? 1 : -1;
  return `<g stroke-linecap="round" stroke-linejoin="round"><path d="M${x} ${y0}V${y1}" stroke="#fff" stroke-width="8"/><path d="M${x - 8} ${y1 + 11 * d}L${x} ${y1}L${x + 8} ${y1 + 11 * d}" stroke="#fff" stroke-width="8" fill="none"/>
    <path d="M${x} ${y0}V${y1}" stroke="${col}" stroke-width="4.4"/><path d="M${x - 8} ${y1 + 11 * d}L${x} ${y1}L${x + 8} ${y1 + 11 * d}" stroke="${col}" stroke-width="4.4" fill="none"/>
    <text x="${x + 11}" y="${y1 + (up ? 4 : 2)}" font-family="Grandstander,Arial,sans-serif" font-weight="800" font-size="15" fill="${col}" stroke="#fff" stroke-width="3.4" paint-order="stroke">${lab}</text></g>`;
};

/* ---- pavienis kūnas baseine (1, 2, 4 lygiai) ---- */
const OS = 56;
function topFor(mode, f){            // f – panirusi dalis
  if(mode === "float") return WY - (1 - f) * OS;
  if(mode === "sink") return FL - OS - 3;
  return (WY + FL) / 2 - OS / 2;
}
/* o: {art, liq, start:"drop"|"mid"|"float"|"half", P, F (Archimedo jėga faktiškai), play:"float"|"sink"|"hover", f, air} */
function poolScene(o){
  const x0 = 160 - OS / 2;
  let y;
  if(o.air) return skyScene(o);
  if(o.start === "drop") y = 32; else if(o.start === "half") y = WY - OS / 2; else if(o.start === "float") y = topFor("float", o.f); else y = topFor("hover");
  const fin = o.play ? { y: topFor(o.play, o.f), } : null;
  const yc = (fin ? fin.y : y) + OS / 2, mx = Math.max(o.P || 1, o.F || 1), sc = 24 / mx;
  const arrows = o.P ? arrow(160, yc, Math.max(12, o.P * sc), false, "#e24a32", "P") + arrow(160, yc, Math.max(12, o.F * sc), true, "#1d74d0", "F") : "";
  const inner = `<g id="obj" style="transform:translate(${x0}px,${y}px);transition:transform 1.5s cubic-bezier(.3,.9,.35,1)">${itemSvg(o.art, OS)}</g>`;
  return { html: `<div class="scnw">${tank(inner, o.liq, o.arrows === false ? "" : `<g id="arr" style="opacity:0;transition:opacity .5s">${arrows}</g>`)}</div>`, fin };
}
function skyScene(o){
  const SZ = 66, x0 = 160 - SZ / 2, ground = 168, y0 = ground - SZ, yTop = 50;
  const yFin = o.play === "float" ? yTop : y0;
  const yc = yFin + SZ / 2, mx = Math.max(o.P, o.F), sc = 40 / mx;
  const arrows = arrow(215, yc, Math.max(14, o.P * sc), false, "#e24a32", "P") + arrow(215, yc, Math.max(14, o.F * sc), true, "#1d74d0", "F");
  const html = `<div class="scnw"><svg class="scn" viewBox="0 0 320 220" aria-hidden="true">
    <defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd0f7"/><stop offset="1" stop-color="#e6f6ff"/></linearGradient></defs>
    <rect width="320" height="220" fill="url(#sk)"/>
    <g fill="#fff" opacity=".9"><ellipse cx="66" cy="44" rx="30" ry="11"/><ellipse cx="88" cy="36" rx="20" ry="10"/><ellipse cx="258" cy="70" rx="34" ry="12"/><ellipse cx="240" cy="62" rx="18" ry="9"/></g>

const rnd1 = x => Math.round(x * 1000) / 1000;
const uniqSort = (right, arr) => { const seen = new Set([nf(right)]); const out = [right]; for(const v of arr){ const k = nf(v); if(!seen.has(k) && v > 0){ seen.add(k); out.push(v); if(out.length === 4) break; } } return out; };
function numOpts(right, cands, unit){
  const all = uniqSort(right, SH(cands)).sort((a, b) => a - b);
  return { opts: all.map(v => `${nf(v)} ${unit}`), right: all.indexOf(right) };
}
const lastOf = {};
function pickDiff(key, arr){ let x, t = 0; do{ x = P(arr); t++; }while(x === lastOf[key] && t < 6); lastOf[key] = x; return x; }

/* ---- 1 lygis ---- */
const FLOAT_ITEMS = ["cork", "pine", "oak", "ice", "plastic", "wax"], SINK_ITEMS = ["glass", "alu", "steel", "copper", "lead"];
function t1(outcome){
  const Vd = pickDiff("v1", [0.5, 1, 1.5, 2, 2.5, 3]), V = Vd / 1000;
  if(outcome === "air"){
    const Va = pickDiff("va", [50, 100, 150, 200]), F = rnd1(1.3 * G * Va), up = Math.random() < 0.6;
    const Pw = up ? Math.round(F * P([0.55, 0.6, 0.7, 0.75]) / 10) * 10 : Math.round(F * P([1.2, 1.3, 1.5]) / 10) * 10;
    const w = up ? T.w1up(Pw, F) : T.w1stay(Pw, F);
    const sc2 = skyScene({ P: Pw, F, play: up ? "float" : "sink" });
    return { type: "mc", sc: sc2, text: T.givenAir(Va, Pw), q: T.q1, opts: [T.o1.up, T.o1.stay], right: up ? 0 : 1, why: w, legend: { P: Pw, F } };
  }
  let item, liq = "water";
  if(outcome === "float"){ item = P(FLOAT_ITEMS); liq = item === "wax" || item === "ice" ? P(["water", "water", "sea"]) : P(["water", "sea", "kero", "oil"]); if(RHO[liq] <= DENS[item]) liq = "water"; }
  else if(outcome === "sink"){ item = P(SINK_ITEMS.concat(["ice", "wax", "oak"])); liq = P(["water", "sea", "kero", "oil"]); if(RHO[liq] >= DENS[item]) liq = "kero"; if(RHO[liq] >= DENS[item]) item = "steel"; }
  else { item = "box"; liq = P(["water", "sea", "kero"]); }
  const rhoB = outcome === "hover" ? RHO[liq] : DENS[item];
  const Pw = rnd1(rhoB * G * V), F = rnd1(RHO[liq] * G * V);
  const useMass = Math.random() < 0.4;
  const out = outcome === "hover" ? "hover" : Pw < F ? "float" : "sink";
  const f = Math.min(1, Pw / F);
  const w = out === "float" ? T.w1float(nf(Pw), nf(F), Math.round(f * 100)) : out === "sink" ? T.w1sink(nf(Pw), nf(F)) : T.w1hover(nf(Pw));
  const intro = `<p class="txt">${T.liquid}: <b>${T.liquids[liq]}</b> · ${T.body}: <b>${T.items[item]}</b>.</p><p class="txt">${useMass ? T.givenMass(nf(Pw / G), nf(F)) : T.givenFull(nf(Pw), nf(F))}</p>`;
  const Feff = out === "sink" ? F : Pw;
  const sc = poolScene({ art: item === "box" ? "box" : item, liq, start: "drop", P: Pw, F: Feff, play: out, f });
  return { type: "mc", sc, text: intro, q: T.q1, opts: [T.o1.float, T.o1.sink, T.o1.hover], right: ["float", "sink", "hover"].indexOf(out), why: w, legend: { P: Pw, F: Feff, eq: out !== "sink" } };
}
function gen1(){

}

function t2(type){
  const liq = pickDiff("l2", ["water", "sea", "kero", "oil", "water"]), rho = RHO[liq];
  if(type === "vol"){
    const Vd = pickDiff("v2c", [0.5, 1, 2, 2.5, 4, 5, 8]), F = rnd1(rho * G * Vd / 1000);
    const o = numOpts(Vd, [Vd * 10, Vd / 10, Vd * 1000, Vd * 2, Vd / 2, Vd * 100], "dm³");
    return { type: "mc", sc: poolScene({ art: "steel", liq, start: "mid", P: 1, F: 1, arrows: false }), text: `<p class="txt">${T.q2vol(nf(F), T.liquids[liq], rho)}</p>`, q: "", opts: o.opts, right: o.right, why: T.w2vol(F, rho, Vd) };
  }
  const unitCm = Math.random() < 0.4, half = type === "half";
  let V, Vm;
  if(unitCm){ V = pickDiff("v2cm", [200, 250, 400, 500, 800, 1000, 1500]); Vm = V / 1e6; }
  else { V = pickDiff("v2d", [0.5, 1, 1.5, 2, 2.5, 3, 4, 5]); Vm = V / 1000; }
  const unit = unitCm ? "cm³" : "dm³", Fv = rnd1(rho * G * Vm * (half ? 0.5 : 1));
  const o = numOpts(Fv, [Fv * 10, Fv / 10, Fv * 1000, Fv / 1000, Fv * (half ? 2 : 0.5), Fv * 100], "N");
  const w = (half ? T.w2half : T.w2full)(nf(V), unit, nf(half ? Vm / 2 : Vm), rho, nf(Fv));
  if(half) w.more = `V<sub>panirusio</sub> = ${nf(V)} ${unit} ÷ 2 = ${nf(Vm / 2)} m³; F = ${rho} · 10 · ${nf(Vm / 2)} = <b>${nf(Fv)} N</b>.`;
  return { type: "mc", sc: poolScene({ art: pickDiff("a2", ["steel", "copper", "alu", "glass", "lead"]), liq, start: half ? "half" : "mid", P: 1, F: 1, arrows: false }), text: `<p class="txt">${(half ? T.q2half : T.q2full)(nf(V), unit, T.liquids[liq], rho)}</p>`, q: "", opts: o.opts, right: o.right, why: w };
}

function t3(){
  for(let tries = 0; tries < 400; tries++){
    const rho = P([1000, 1000, 1030]), Vh = P([30, 40, 50, 60, 80, 100, 120]);
    const Fmax = rnd1(rho * G * Vh / 1000), P0 = Math.round(Fmax * P([0.15, 0.2, 0.25, 0.3]) / 5) * 5, w = P([10, 20, 25, 30, 40, 50, 60, 80]);
    const rem = rnd1(Fmax - P0), n = Math.floor(rem / w), frac = rem / w - n;
    if(n < 3 || n > 9 || frac < 0.12 || frac > 0.9) continue;
    const l = rho === 1030 ? T.liquids.sea : T.liquids.water;
    return { type: "barge", rho, Vh, Fmax, P0, w, rem, n, text: `<p class="txt">${T.q3(nf(P0), nf(w), rho, l, Vh, Fmax)}</p>`, why: T.w3(rho, Vh, Fmax, nf(P0), nf(w), rem, n) };
  }
}

  window.scrollTo({ top: 0 });
  if(cur.type === "barge") return showBarge();
  stage.innerHTML = `<div class="card fade step">${cur.sc ? cur.sc.html : ""}<div id="leg"></div>${cur.text}${cur.q ? `<p class="qt">${cur.q}</p>` : ""}
    <div class="ans${cur.opts.length === 2 ? " two" : ""}" id="ans">${cur.opts.map((o, i) => `<button type="button" class="a" data-i="${i}">${o}</button>`).join("")}</div></div><div id="flow"></div>`;
  $("ans").onclick = e => { const b = e.target.closest(".a"); if(!b) return; answer(+b.dataset.i, b); };
}
function whyBlock(ok, w){ return MK.why({ ok, head: w.head, body: w.body, more: w.more, sum: T.why, open: !ok }); }
function nextBtn(){
  const go = document.createElement("button"); go.type = "button"; go.className = "mk-btn go"; go.textContent = ti < tasks.length - 1 ? T.next : T.finish;
  go.onclick = () => { MK.sfx.tap(); ti++; ti < tasks.length ? show() : finish(); };
  $("flow").appendChild(go); setTimeout(() => go.scrollIntoView({ behavior: "smooth", block: "nearest" }), 120);
}
function answer(i, btn){
  const ans = $("ans"); if(ans.classList.contains("done")) return;
  ans.classList.add("done");
  const ok = i === cur.right; MK.unlock();
  btn.classList.add(ok ? "ok" : "no"); if(!ok) ans.children[cur.right].classList.add("ok");
  dots.mark(ti, ok); if(ok){ okN++; award(true, 10); MK.sfx.good(); } else MK.sfx.bad();
  if(cur.sc && cur.sc.fin){ MK.sfx.whoosh(); runScene(cur.sc, cur.sc.fin); if(cur.legend){ $("leg").innerHTML = legendHtml(cur.legend); } }
  const d = document.createElement("div"); d.innerHTML = whyBlock(ok, cur.why); $("flow").appendChild(d.firstElementChild);
  setTimeout(nextBtn, cur.sc && cur.sc.fin ? 700 : 0);
}
/* --- 3 lygis --- */
function showBarge(){
  let n = 0, tries = 0, done = false;
  const cap = 12;
  stage.innerHTML = `<div class="card fade step"><div id="bsc">${bargeScene(0)}</div>${cur.text}
    <div class="load"><button type="button" id="mn" aria-label="−" disabled>−</button><div><output id="nv">0</output>${T.crates}</div><button type="button" id="pl" aria-label="+">+</button></div>
    <span class="tr" id="tot"></span><p class="note" id="note" role="status" aria-live="polite"></p>
    <button type="button" class="mk-btn bigbtn" id="go3">${T.go3}</button></div><div id="flow"></div>`;
  const upd = () => { $("nv").textContent = n; $("mn").disabled = n <= 0 || done; $("pl").disabled = n >= cap || done; $("tot").textContent = `P = ${nf(cur.P0)} + ${n} · ${nf(cur.w)} = ${nf(cur.P0 + n * cur.w)} N`; };
  const redraw = () => { $("bsc").innerHTML = bargeScene(n); };
  $("mn").onclick = () => { if(n > 0){ n--; MK.sfx.tap(); upd(); redraw(); $("note").textContent = ""; } };
  $("pl").onclick = () => { if(n < cap){ n++; MK.sfx.tap(); upd(); redraw(); $("note").textContent = ""; } };
  upd();
  $("go3").onclick = () => {
    if(done) return; MK.unlock(); tries++;
    const tot = cur.P0 + n * cur.w, f = tot / cur.Fmax, sunk = f > 1, right = !sunk && n === cur.n;
    $("mn").disabled = $("pl").disabled = true; $("go3").disabled = true; MK.sfx.whoosh();
    bargeFinal(Math.min(f, 1), sunk);
    const note = $("note");
    setTimeout(() => {
      if(right){
        done = true; note.className = "note good"; note.textContent = T.t3ok(n); MK.sfx.good(); dots.mark(ti, tries === 1);
        if(tries === 1) okN++; award(true, [0, 10, 6, 3][Math.min(tries, 3)]);
        const d = document.createElement("div"); d.innerHTML = whyBlock(true, cur.why); $("flow").appendChild(d.firstElementChild); $("go3").hidden = true; nextBtn();
      } else if(tries >= 3){
        done = true; note.className = "note warn"; note.textContent = sunk ? T.t3sink : T.t3less; MK.sfx.bad(); dots.mark(ti, false);
        const d = document.createElement("div"); d.innerHTML = whyBlock(false, cur.why); $("flow").appendChild(d.firstElementChild); $("go3").hidden = true; nextBtn();
      } else {
        note.className = "note warn"; note.textContent = sunk ? T.t3more : T.t3less; sunk ? MK.sfx.bad() : MK.sfx.tap();
        setTimeout(() => { redraw(); $("go3").disabled = false; upd(); }, 1400);
      }
    }, 1800);
  };
}
function finish(){
  const total = tasks.length, stars = MK.starsFor(okN, total); MK.best(GAME, LEVELS[L].id, stars);
  const now = unlocked(), fresh = [...now].filter(x => !before.has(x));
  MK.result({ stars, title: `${okN} / ${total}`, text: T.res(okN, total, pts) + (fresh.length ? `<br><b>${T.newShip(fresh.map(i => T.ships[i]).join(", "))}</b>` : ""),
    next: L < LEVELS.length - 1 ? () => start(L + 1) : null, again: () => start(L), menu: () => showMenu(fresh) });
}
Object.defineProperty(window, "__cur", { get: () => cur });
window.__MK_TEST = { LV, t1, t2, t3, t4, gen1, gen2, gen3, gen4, gen5 };
showMenu();
})();
</script>
