<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Algebros mozaika – MokomėsKartu.lt</title>
<meta name="description" content="8 klasės matematikos žaidimas: raidinių reiškinių daugyba plotų lentelėje, greitosios daugybos formulės, skaidymas dauginamaisiais (iškėlimas prieš skliaustus, formulės, grupavimas) ir dvinario kvadrato išskyrimas.">
<meta name="theme-color" content="#fff9e6">
<meta name="robots" content="noindex">
<link rel="icon" href="/logo/mk-ikona.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800&family=Manrope:wght@600;700;800&display=swap">
<script src="/bendra/mk.js"></script>
<script src="/algebros-mozaika/tekstai.lt.js"></script>
<style>
/* Meniu: meistrė prie mozaikos sienos, mozaikų galerija, lygiai, „Noriu pasimokyti“.
   Užduotys: plotų lentelė (langeliai + plytelių lentyna), atsakymo eilutė iš plytelių (suma arba sandauga),
   langeliai lygybėje, pasirinkimas iš 4. Jokio laiko spaudimo; 2 bandymai (10 / 5 tšk.). */
body{--ac:#c2410c;--ac-ink:#fff;--ac-soft:#ffe6d6}
@media (max-width:380px){.mk-title{font-size:17px}}
.mk-hero{padding-top:0}
.mk-hero h1{margin-top:8px;font-size:clamp(32px,8.4vw,54px)}
.mk-hero p{max-width:46ch;font-size:16.5px}
.hero-art{width:min(100%,480px);border-radius:26px;overflow:hidden;position:relative;box-shadow:0 6px 0 rgba(18,26,51,.15)}
.hero-art svg{display:block;width:100%;height:auto}
.hero-art::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 3px var(--ink);pointer-events:none}
.col{width:100%;max-width:520px;margin:0 auto 14px;padding:12px 14px 14px;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 2.5px var(--ink),0 5px 0 rgba(18,26,51,.14)}
.col h2{margin:0;font:800 18px/1.2 var(--kid);display:flex;gap:8px;align-items:center}
.col h2 svg{width:30px;height:30px;flex:none;border-radius:6px}
.col p{margin:4px 0 10px;color:var(--soft);font-weight:700;font-size:14.5px}
.orns{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.orn{text-align:center}
.orn svg{display:block;width:100%;height:auto;border-radius:9px;box-shadow:0 0 0 2px var(--ink)}
.orn small{display:block;font:800 9.5px/1.2 var(--body);color:var(--soft);margin-top:4px;overflow:hidden;text-overflow:ellipsis}
.orn.off svg{box-shadow:0 0 0 2px #cfc4a2}
.orn.new svg{animation:mkPop .6s cubic-bezier(.2,1.6,.4,1)}

.hud{display:flex;align-items:center;gap:8px;margin:0 0 8px;min-height:36px}
.hud .mk-dots{margin-right:auto;justify-content:flex-start}
.chip{display:inline-flex;align-items:baseline;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink);font:800 17px/36px var(--kid);white-space:nowrap}
.chip small{font:800 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.chip.pop{animation:mkPop .35s cubic-bezier(.2,1.6,.4,1)}
.card{width:100%;max-width:560px;margin:0 auto 10px;padding:12px 14px 14px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.12)}
.stp{display:inline-block;margin:0 0 6px;padding:2px 10px;border-radius:999px;background:var(--ac-soft);font:800 12px/1.6 var(--body);letter-spacing:.04em;text-transform:uppercase;color:#8a2c06}
.q{margin:0 0 10px;font:700 16px/1.45 var(--body)}
i{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:700}
sup{font-size:.62em;line-height:0;position:relative;top:-.15em;vertical-align:super}
.exb{margin:0 0 12px;padding:10px 12px;border-radius:14px;background:#fff7e0;box-shadow:inset 0 0 0 2px #e6d39b;text-align:center;font:800 clamp(21px,6vw,27px)/1.35 var(--kid);overflow-wrap:anywhere}
.ex{display:inline-block;padding:1px 9px;border-radius:9px;background:var(--ac-soft);font:800 17px/1.5 var(--kid);white-space:nowrap}
.mk-why .ex,.mk-lt .ex{white-space:normal}
.eq{margin:0 0 12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:5px 5px;font:800 clamp(19px,5.4vw,24px)/1.3 var(--kid);min-height:52px}
.eq .tx{white-space:nowrap}
.eq .gp{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:52px;height:46px;padding:0 9px;border-radius:11px;border:2.5px dashed #b9a877;background:#fffdf4;cursor:pointer;
  font:800 19px/1 var(--kid);color:var(--ink);white-space:nowrap}
.slot.sel{border:2.5px solid #2f6bff;background:#eaf1ff;box-shadow:0 0 0 3px rgba(47,107,255,.2)}
.slot.fil{border-style:solid;border-color:var(--ink);box-shadow:0 3px 0 rgba(18,26,51,.2)}
.slot.fil.sel{border-color:#2f6bff}
.slot.slot.bad{border:2.5px solid #d93a1c!important;background:#ffe9e3!important;box-shadow:0 0 0 3px rgba(217,58,28,.18);animation:mkShake .45s}
.slot.ok{border:2.5px solid #1e8f55;background:#e6f9ee;cursor:default}
.slot.emp{color:#b9a877}
.d0{background:#ffe9a8}.d1{background:#d3f3cc}.d2{background:#cfe2ff}.d3{background:#e6dbff}.df{background:#fff}
.slot.fil.d0{background:#ffe9a8}.slot.fil.d1{background:#d3f3cc}.slot.fil.d2{background:#cfe2ff}.slot.fil.d3{background:#e6dbff}
.grid{display:grid;gap:5px;margin:0 auto 12px;max-width:440px}
.grid .gx{display:grid;place-items:center;font:800 22px/1 var(--kid);color:#a39468}
.gh{display:grid;place-items:center;min-height:46px;border-radius:10px;background:#f3ead0;box-shadow:inset 0 -4px 0 #d9c98f;font:800 19px/1 var(--kid);padding:2px}
.gh.gl{min-height:58px}
.gh .slot{width:100%;min-width:0}
.gcell{display:grid}
.gcell .slot{width:100%;height:58px;min-width:0;border-radius:8px}
.gc.cl{display:grid;place-items:center;height:58px;border-radius:8px;box-shadow:inset 0 0 0 2.5px var(--ink);font:800 19px/1 var(--kid)}
.pre{opacity:.92}
.pre .gc.cl,.pre .gh{min-height:0;height:40px;font-size:16px}
.pre .gh.gl{height:40px}
.trayw{margin:0 0 10px;padding:9px 8px 11px;border-radius:14px;background:#efe3c6;box-shadow:inset 0 0 0 2px #cdbb86,inset 0 -6px 0 #dccb98}
.trayw small{display:block;margin:0 2px 7px;font:700 12.5px/1.3 var(--body);color:#6b5f3c}
.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}
.tile{display:inline-flex;align-items:center;justify-content:center;min-width:56px;height:48px;padding:0 10px;border:0;border-radius:10px;cursor:pointer;white-space:nowrap;
  font:800 19px/1 var(--kid);color:var(--ink);box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.3);transition:transform .08s}
.tile:active{transform:translateY(3px);box-shadow:inset 0 0 0 2.5px var(--ink),0 1px 0 rgba(18,26,51,.3)}
.tile.used{opacity:.28;box-shadow:inset 0 0 0 2.5px var(--ink)}
.tile.sm{height:42px;min-width:44px;padding:0 8px}
.tray.off .tile{pointer-events:none;opacity:.5}
.row{display:inline-flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:5px;min-height:46px;min-width:64px;padding:2px 6px;border-radius:12px;border:2.5px dashed #b9a877;background:#fffdf4}
.row.has{border-style:solid;border-color:#d9c98f}
.row.ok{border:2.5px solid #1e8f55;background:#e6f9ee}
.row .op{font:800 19px/1 var(--kid)}
.row .ph{color:#b9a877}
.note{min-height:0;margin:0 0 10px;font:700 15px/1.4 var(--body);text-align:center}
.note:empty{display:none}
.note.bad{color:#b3261e}.note.warn{color:#8a5a00;background:#fff3c4;border-radius:10px;padding:7px 10px}
.card>.mk-btn{width:100%}
.ans{display:grid;gap:8px;margin:0 0 6px}
.opt{display:block;width:100%;min-height:52px;padding:8px 12px;border:0;border-radius:14px;background:#fff;cursor:pointer;text-align:center;
  font:800 clamp(16px,4.6vw,19px)/1.35 var(--kid);color:var(--ink);box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.18);overflow-wrap:anywhere}
.opt.ok{background:#dff6e8;box-shadow:inset 0 0 0 3px #1e8f55}
.opt.no{background:#ffe9e3;box-shadow:inset 0 0 0 3px #d93a1c}
.ans.off .opt{pointer-events:none}
.ans.off .opt:not(.ok):not(.no){opacity:.55}
.pic{margin:0 0 10px;text-align:center}
.pic svg{display:block;margin:0 auto 4px;max-width:100%;height:auto}
.pic p{margin:0;font:600 13.5px/1.4 var(--body);color:var(--soft)}
#flow .mk-btn{width:100%}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <section id="menu">
    <div class="mk-hero">
      <div class="hero-art" id="heroArt"></div>
      <h1 id="heroH"></h1>
      <p id="heroP"></p>
    </div>
    <div class="col" id="col"></div>
    <div id="levels"></div>
    <div id="learn"></div>
  </section>
  <section id="play" hidden>
    <div class="hud"><div id="dots"></div><span class="chip" id="ptsChip"><small id="ptsL"></small><span id="pts">0</span></span></div>
    <div id="stage"></div>
  </section>
</div>
<script>
(function(){
"use strict";
const T = window.MK_T, GAME = "algebros-mozaika", GRADES = [8];
const R = MK.rnd, P = MK.pick, SH = MK.shuffle;
const K = "#121a33";
const $ = id => document.getElementById(id);

/* ================= algebra: vienanariai ir daugianariai ================= */
const E = s => { const e = {}; (s || "").replace(/([a-z])(\d?)/g, (_, v, n) => { e[v] = (e[v] || 0) + (n ? +n : 1); }); return e; };
const M = (c, s) => ({ c, e: E(s) });
const neg = t => ({ c: -t.c, e: t.e });
const kOf = e => Object.keys(e).filter(v => e[v]).sort().map(v => v + e[v]).join("");
function PL(ms){
  const m = new Map();
  for(const t of ms){ if(!t) continue; const k = kOf(t.e), o = m.get(k); if(o) o.c += t.c; else m.set(k, { c: t.c, e: Object.assign({}, t.e) }); }
  for(const [k, t] of m) if(!t.c) m.delete(k);
  return m;
}
const mulM = (a, b) => { const e = Object.assign({}, a.e); for(const v in b.e) e[v] = (e[v] || 0) + b.e[v]; return { c: a.c * b.c, e }; };
const divM = (a, b) => { const e = Object.assign({}, a.e); for(const v in b.e){ e[v] = (e[v] || 0) - b.e[v]; if(!e[v]) delete e[v]; } return { c: a.c / b.c, e }; };
const pMul = (A, B) => { const r = []; for(const a of A.values()) for(const b of B.values()) r.push(mulM(a, b)); return PL(r); };
const pAdd = (A, B) => PL([...A.values(), ...B.values()]);
const pEq = (A, B) => { if(A.size !== B.size) return false; for(const [k, t] of A){ const u = B.get(k); if(!u || u.c !== t.c) return false; } return true; };
const deg = t => Object.values(t.e).reduce((a, b) => a + b, 0);
function cmpE(p, q){ const vs = [...new Set([...Object.keys(p.e), ...Object.keys(q.e)])].sort(); for(const v of vs){ const d = (q.e[v] || 0) - (p.e[v] || 0); if(d) return d; } return 0; }
const srt = A => [...A.values()].sort((p, q) => deg(q) - deg(p) || cmpE(p, q));
const sup = n => n > 1 ? `<sup>${n}</sup>` : "";
const bodyH = t => { const vars = Object.keys(t.e).filter(v => t.e[v]).sort().map(v => `<i>${v}</i>${sup(t.e[v])}`).join(""), a = Math.abs(t.c); return (a === 1 && vars ? "" : a) + vars; };
const tH = (t, lead) => lead ? (t.c < 0 ? "−" : "") + bodyH(t) : (t.c < 0 ? " − " : " + ") + bodyH(t);
const listH = ts => ts.length ? ts.map((t, i) => tH(t, i === 0)).join("") : "0";
const pH = A => listH(srt(A));
const par = h => h.charAt(0) === "−" ? `(${h})` : h;
const num = n => n < 0 ? "−" + (-n) : "" + n;
const sgn = (t, i) => i === 0 ? tH(t, true) : (t.c < 0 ? "− " : "+ ") + bodyH(t);
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
const nz = (a, b) => { let v; do v = R(a, b); while(!v); return v; };
const sg = () => P([1, -1]);
const VAR = () => P(["x", "x", "x", "y", "t", "m", "p"]);
const PAIRS = [["x", "y"], ["m", "n"], ["p", "q"], ["c", "d"]];

/* Plytelės: narys (vienanaris) arba dauginamasis skliaustuose. */
const TT = t => ({ id: tH(t, true), h: tH(t, true), body: bodyH(t), neg: t.c < 0, p: PL([t]), d: Math.min(3, deg(t)) });
function FT(ts, pw){ let p = PL(ts); if(pw === 2) p = pMul(p, p); const h = `(${listH(ts)})${pw === 2 ? "<sup>2</sup>" : ""}`; return { id: h, h, body: h, neg: false, p, d: "f", fac: true }; }
function mkTray(must, opt, n){
  const seen = new Set(), out = [];
  for(const t of must) if(t && !seen.has(t.id)){ seen.add(t.id); out.push(t); }
  for(const t of SH(opt.filter(Boolean))){ if(out.length >= n) break; if(!seen.has(t.id)){ seen.add(t.id); out.push(t); } }
  return SH(out);
}

/* ================= plotų lentelė ================= */
function gridH(g, slotFn){
  const it = (x, cls) => x.s != null ? slotFn(x.s) : `<span class="gc ${cls}${x.d != null ? " d" + x.d : ""}"><span>${x.h}</span></span>`;
  return `<div class="grid" style="grid-template-columns:minmax(50px,.6fr) repeat(${g.top.length},minmax(0,1fr))"><span class="gx">·</span>${g.top.map(x => `<div class="gh">${it(x, "hd")}</div>`).join("")}${
    g.left.map((l, r) => `<div class="gh gl">${it(l, "hd")}</div>` + g.cells[r].map(c => `<div class="gcell">${it(c, "cl")}</div>`).join("")).join("")}</div>`;
}
function distM(l, t, v){
  const r = mulM(l, t), o = [neg(r), { c: (l.c + t.c) || r.c + 1, e: r.e }];
  const ks = Object.keys(r.e);
  if(ks.length){ const e = Object.assign({}, r.e); e[ks[0]]--; if(!e[ks[0]]) delete e[ks[0]]; o.push({ c: r.c, e }); }
  const e2 = Object.assign({}, r.e), k2 = ks[0] || v; e2[k2] = (e2[k2] || 0) + 1; if(deg({ e: e2 }) <= 3) o.push({ c: r.c, e: e2 });
  return o;
}
function gridTask(left, top, v){
  const cells = left.map(l => top.map(t => mulM(l, t))), flat = cells.flat();
  const exp = flat.map(TT), dis = [];
  left.forEach(l => top.forEach(t => dis.push(...distM(l, t, v))));
  const nU = new Set(exp.map(t => t.id)).size;
  const exH = (left.length === 1 ? tH(left[0], true) : `(${listH(left)})`) + `(${listH(top)})`;
  const hd = a => a.map((t, i) => ({ h: sgn(t, i) }));
  const g = { top: hd(top), left: hd(left), cells: cells.map((row, r) => row.map((c, k) => ({ s: r * top.length + k }))) };
  const lines = []; left.forEach(l => top.forEach(t => lines.push(`${tH(l, true)} · ${par(tH(t, true))} = ${tH(mulM(l, t), true)}`)));
  const target = PL(flat);
  const stages = [{ mode: "slots", q: T.q.grid, ex: exH, grid: g, slots: flat.map(c => ({ exp: TT(c).id, lead: true })), tray: mkTray(exp, dis.map(TT), Math.min(9, nU + 4)),
    eqL: exH, eqR: listH(flat), ansH: listH(flat), why: { body: T.w.grid(lines), more: T.rules.mul } }];
  if(target.size < flat.length){
    const res = srt(target), by = {}, d2 = [], like = [];
    flat.forEach(c => (by[kOf(c.e)] = by[kOf(c.e)] || []).push(c));
    for(const k in by) if(by[k].length > 1){
      const [a, b] = by[k], s = a.c + b.c;
      d2.push(a, b, { c: a.c - b.c, e: a.e }, { c: -s, e: a.e }, { c: a.c * b.c, e: a.e });
      like.push(`${tH(a, true)}${tH(b, false)} = ${s ? tH({ c: s, e: a.e }, true) : "0"}`);
    }
    res.forEach(t => { if(!deg(t)) d2.push(neg(t)); });
    const pre = { top: g.top, left: g.left, cells: cells.map(row => row.map(c => ({ h: tH(c, true), d: Math.min(3, deg(c)) }))) };
    stages.push({ mode: "row", op: "sum", q: T.q.sum, pre: `<div class="pre">${gridH(pre)}</div>`, ex: exH, target, exp: res.map(t => TT(t).id),
      tray: mkTray(res.map(TT), d2.filter(t => t.c).map(TT), 8), eqL: exH, eqR: pH(target), ansH: pH(target), partN: T.nPartSum,
      why: { body: T.w.sum(listH(flat), like.join("; "), pH(target)), more: T.rules.like } });
  }
  return { stages };
}
const choice = (q, ex, opts, ans, why, chk) => ({ stages: [{ mode: "choice", q, ex, opts, ans, chk, ansH: opts[ans], why }] });
const sqM = t => mulM(t, t);
function bino(form){
  const v = VAR();
  if(form === "x") return [M(1, v), M(R(2, 12), "")];
  if(form === "kx") return [M(R(2, 5), v), M(R(1, 7), "")];
  if(form === "rev") return [M(R(2, 9), ""), M(1, v)];
  const [u, w] = P(PAIRS);
  return P([[M(1, u), M(R(2, 4), w)], [M(R(2, 4), u), M(1, w)], [M(R(2, 3), u), M(R(2, 5), w)], [M(1, u), M(1, w)]]);
}
const rowSum = (q, exH, target, dis, why, ansH) => { const res = srt(target); return { stages: [{ mode: "row", op: "sum", q, ex: exH, target, exp: res.map(t => TT(t).id), tray: mkTray(res.map(TT), dis.filter(t => t && t.c).map(TT), 8), eqL: exH, eqR: ansH || pH(target), ansH: ansH || pH(target), partN: T.nPartSum, why }] }; };
const rowProd = (q, exH, target, exp, dis, ansH, why, pre) => ({ mode: "row", op: "prod", q, ex: exH, pre, target, exp: exp.map(t => t.id), tray: mkTray(exp, dis, 8), eqL: exH, eqR: ansH, ansH, partN: T.nPartProd, why });

/* ================= užduočių generatoriai ================= */
const G = {
  /* ---- 1 lygis ---- */
  name(){
    const v = VAR(), a = R(2, 9), b = R(2, 9); let c = R(2, 9), ts, exH; const k = R(0, 5), v2 = v + "2";
    if(k === 0){ exH = `${tH(M(a, v), true)} · ${tH(M(b, v), true)}`; ts = [M(a * b, v2)]; }
    else {
      if(k === 1){ while(c === a) c = R(2, 9); ts = [M(a, v), M(b, ""), M(-c, v)]; }
      else if(k === 2) ts = [M(1, v2), M(a, v), M(b, v), M(-c, "")];
      else if(k === 3) ts = [M(a, v2), M(b, v), M(-a, v2), M(c, "")];
      else if(k === 4) ts = [M(1, v2), M(a, v), M(1, v === "y" ? "x" : "y"), M(-b, "")];
      else ts = [M(a, v2), M(b, v2)];
      exH = listH(ts);
    }
    const res = PL(ts), n = res.size;
    return choice(T.q.name, exH, T.nameOpts, n - 1, { body: T.w.name(pH(res), n, T.w.names[n - 1]), more: T.rules.name }, [0, 1, 2, 3].map(i => i === n - 1));
  },
  mb(){ const v = VAR(), mono = P([M(R(2, 6), ""), M(1, v), M(R(2, 5), v), M(-R(2, 4), v)]); return gridTask([mono], [M(P([1, 1, 2, 3, 4]), v), M(nz(-9, 9), "")], v); },
  mt(){ const v = VAR(), mono = P([M(R(2, 4), v), M(1, v), M(-R(2, 3), "")]); return gridTask([mono], [M(1, v + "2"), M(nz(-5, 5), v), M(nz(-6, 6), "")], v); },
  bb(kind){
    const v = VAR(), [u, w] = P(PAIRS); let a = 1, c = 1, b, d;
    if(kind === "xy") return gridTask([M(1, u), M(nz(-6, 6), "")], [M(1, w), M(nz(-6, 6), "")], u);
    if(kind === "two"){ do{ b = nz(-5, 5); d = nz(-5, 5); } while(b === -d); return gridTask([M(1, u), M(b, w)], [M(1, u), M(d, w)], u); }
    do{
      if(kind === "pos"){ b = R(1, 9); d = R(1, 9); }
      else if(kind === "neg"){ b = nz(-9, 9); d = nz(-9, 9); }
      else { a = R(2, 4); c = R(1, 3); b = nz(-7, 7); d = nz(-7, 7); }

    s.tries++;
    if(s.tries < 2){ s.bad = j.ok.map(o => !o); s.sel = s.bad.indexOf(true); MK.sfx.bad(); note("bad", T.nSlots(s.bad.filter(Boolean).length)); drawSlots(s); }
    else { s.okv = j.ok; s.fill = s.slots.map(sl => s.tray.find(t => t.id === sl.exp)); finishStage(s, false); }
  };
}
/* --- atsakymo eilutė --- */
function rowVal(s, ch){ return s.op === "sum" ? PL(ch.flatMap(t => [...t.p.values()])) : ch.reduce((a, t) => pMul(a, t.p), PL([M(1, "")])); }
function judgeRow(s, ch){
  const ids = new Set(ch.map(t => t.id));
  if(ids.size === s.exp.length && s.exp.every(id => ids.has(id))) return "ok";
  if(ch.length && pEq(rowVal(s, ch), s.target)) return s.op === "sum" && ch.length === s.exp.length ? "ok" : "part";
  return "no";
}
function drawRow(s){
  const ch = s.op === "prod" ? s.ch.filter(t => !t.fac).concat(s.ch.filter(t => t.fac)) : s.ch;
  const inner = ch.length ? ch.map((t, i) => (s.op === "sum" && i ? `<span class="op">${t.neg ? "−" : "+"}</span>` : "") + `<button type="button" class="tile sm d${t.d}" data-r="${s.ch.indexOf(t)}"><span>${s.op === "sum" && i ? t.body : t.h}</span></button>`).join("") : `<span class="ph">${T.empty}</span>`;
  $("work").innerHTML = `<div class="eq"><span class="tx" style="white-space:normal">${s.ex} =</span><span class="row${ch.length ? " has" : ""}${s.done ? " ok" : ""}" id="row">${inner}</span></div>`;
  const c = $("chk"); if(c) c.disabled = s.done || !s.ch.length;
}
function initRow(s){
  s.ch = []; drawRow(s); drawTray(s);
  $("tray").onclick = e => { const b = e.target.closest("[data-t]"); if(!b || s.done) return; const t = s.tray[+b.dataset.t], k = s.ch.indexOf(t); if(k >= 0) s.ch.splice(k, 1); else if(s.ch.length < 6) s.ch.push(t); MK.sfx.tap(); note("", ""); drawRow(s); drawTray(s); };
  $("work").onclick = e => { const b = e.target.closest("[data-r]"); if(!b || s.done) return; s.ch.splice(+b.dataset.r, 1); MK.sfx.tap(); drawRow(s); drawTray(s); };
  $("chk").onclick = () => {
    const j = judgeRow(s, s.ch);
    if(j === "ok") return finishStage(s, true);
    if(j === "part"){ MK.sfx.beep(); return note("warn", s.partN); }
    s.tries++;
    if(s.tries < 2){ MK.sfx.bad(); note("bad", T.nRow(s.ch.filter(t => !s.exp.includes(t.id)).length, s.exp.filter(id => !s.ch.some(t => t.id === id)).length)); $("row").classList.add("mk-shake"); }
    else { s.ch = s.exp.map(id => s.tray.find(t => t.id === id)); finishStage(s, false); }
  };
}
/* --- pasirinkimas --- */
function initChoice(s){
  $("work").innerHTML = `<div class="ans" id="ans">${s.opts.map((o, i) => `<button type="button" class="opt" data-o="${i}">${o}</button>`).join("")}</div>`;
  $("ans").onclick = e => {
    const b = e.target.closest("[data-o]"); if(!b || s.done) return; const i = +b.dataset.o, ok = i === s.ans;
    $("ans").classList.add("off"); $("ans").children[s.ans].classList.add("ok"); if(!ok) b.classList.add("no");
    finishStage(s, ok);
  };
}
function finishStage(s, ok){
  s.done = true; const n = cur.stages.length, full = Math.round(10 / n), last = cur.si === n - 1;
  if(ok){ award(s.tries ? Math.ceil(full / 2) : full); MK.sfx.good(); } else MK.sfx.bad();
  if(!ok || s.tries) cur.first = false;
  note("", "");
  if(s.mode === "slots"){ s.okv = s.slots.map(() => true); s.sel = -1; drawSlots(s); drawTray(s); }
  if(s.mode === "row"){ drawRow(s); drawTray(s); }
  const d = document.createElement("div");
  d.innerHTML = MK.why({ ok, head: ok ? MK.praise() : (s.ansH ? T.bad(s.ansH) : T.badPlain), body: s.why.body, more: s.why.more, sum: T.rule, open: !ok });
  $("flow").appendChild(d.firstElementChild);
  if(last){ dots.mark(ti, cur.first); if(cur.first) okN++; }
  const go = document.createElement("button"); go.type = "button"; go.className = "mk-btn"; go.id = "next";
  go.textContent = !last ? T.nextStep : ti < tasks.length - 1 ? T.next : T.finish;
  go.onclick = () => { MK.sfx.tap(); if(!last){ cur.si++; renderStage(); window.scrollTo(0, 0); } else { ti++; ti < tasks.length ? show() : finish(); } };
  $("flow").appendChild(go);
  setTimeout(() => go.scrollIntoView({ block: "nearest", behavior: "smooth" }), 60);
}
function finish(){
  const n = tasks.length, stars = MK.starsFor(okN, n); MK.best(GAME, LEVELS[L].id, stars);
  const g1 = gotN(total()), gain = T.orn.slice(got0, g1);
  MK.result({ stars, title: `${okN} / ${n}`, text: T.res(okN, n, pts, gain),
    next: L < LEVELS.length - 1 ? () => start(L + 1) : null, again: () => start(L), menu: () => showMenu(gain.length ? got0 : null) });
}
Object.defineProperty(window, "__cur", { get: () => cur });
window.__MK_TEST = { LV, G, T, pEq, pMul, PL, rowVal, judgeRow, judgeSlots, start };
showMenu();
})();
</script>
