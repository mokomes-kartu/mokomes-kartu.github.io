<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Veidrodžių salė – MokomėsKartu.lt</title>
<meta name="description" content="7 klasės fizikos žaidimas: šviesos atspindžio dėsnis, kritimo ir atspindžio kampai, plokščiasis veidrodis – nukreipk spindulį į kristalus.">
<meta name="theme-color" content="#fff9e6">
<meta name="robots" content="noindex">
<link rel="icon" href="/logo/mk-ikona.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800&family=Manrope:wght@600;700;800&display=swap">
<script src="/bendra/mk.js"></script>
<script src="/veidrodziu-sale/tekstai.lt.js"></script>
<style>
/* Meniu: meistrė su žibintu, kristalų siena (kolekcija), lygiai, „Noriu pasimokyti“.
   Užduotys: kampų brėžiniai (pasirinkimas), salės galvosūkiai (pasuk / pastatyk veidrodžius, tada „Įjungti žibintą“),
   atvaizdas plokščiajame veidrodyje (langelis, laikrodžiai, užrašai). */
body{--ac:#7a4be0;--ac-ink:#fff;--ac-soft:#ebe2ff}
.mk-hero{padding-top:0}
.mk-hero h1{margin-top:8px;font-size:clamp(32px,8.4vw,54px)}
.mk-hero p{max-width:42ch;font-size:16.5px}
.hero-art{width:min(100%,480px);border-radius:26px;overflow:hidden;position:relative;box-shadow:0 6px 0 rgba(18,26,51,.15)}
.hero-art svg{display:block;width:100%;height:auto}
.hero-art::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 3px var(--ink);pointer-events:none}
.col{width:100%;max-width:520px;margin:0 auto 14px;padding:12px 14px 14px;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 2.5px var(--ink),0 5px 0 rgba(18,26,51,.14)}
.col h2{margin:0;font:800 18px/1.2 var(--kid);display:flex;gap:8px;align-items:center}
.col h2 svg{width:28px;height:28px;flex:none}
.col p{margin:4px 0 10px;color:var(--soft);font-weight:700;font-size:14.5px}
.wall{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;padding:8px;border-radius:14px;background:#2b2350;box-shadow:inset 0 0 0 2px #121a33}
.wall svg{display:block;width:100%;height:auto}
.wall .off{opacity:.9}
.wall .new{animation:mkPop .6s cubic-bezier(.2,1.6,.4,1)}

.hud{display:flex;align-items:center;gap:8px;margin:0 0 8px;min-height:36px}
.hud .mk-dots{margin-right:auto;justify-content:flex-start}
.chip{display:inline-flex;align-items:baseline;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink);font:800 17px/36px var(--kid);white-space:nowrap}
.chip small{font:800 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.chip.pop{animation:mkPop .35s cubic-bezier(.2,1.6,.4,1)}
.card{width:100%;max-width:600px;margin:0 auto 10px;padding:12px 14px 14px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.12)}
.txt{margin:0 0 10px;font:700 16px/1.5 var(--body)}
.txt b{font-weight:800}
.figw{margin:0 0 10px;border-radius:14px;overflow:hidden;box-shadow:0 0 0 2.5px var(--ink);background:#f6f2ff}
.figw svg{display:block;width:100%;height:auto}
.figw.dark{background:#241d45}
.ans{display:grid;gap:8px}
.ans.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.a{min-height:52px;padding:10px 12px;border:0;border-radius:14px;background:#fff;cursor:pointer;text-align:left;font:800 16.5px/1.3 var(--body);color:var(--ink);
  box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.16);transition:transform .1s;touch-action:manipulation}
.ans.two .a{text-align:center}
.a svg{display:block;width:100%;height:auto;pointer-events:none}
.a.pic{padding:6px 6px 4px;position:relative}
.a.pic i{position:absolute;left:8px;top:5px;font:800 15px/1 var(--kid);font-style:normal;color:var(--ac)}
.a:active{transform:translateY(3px)}
.a.ok{background:#dff7e6;box-shadow:inset 0 0 0 3.5px var(--good),0 4px 0 rgba(18,26,51,.16)}
.a.no{background:#ffe6df;box-shadow:inset 0 0 0 3.5px var(--bad),0 4px 0 rgba(18,26,51,.16)}
.ans.done .a{pointer-events:none}
.ans.done .a:not(.ok):not(.no){opacity:.5}
.go{display:flex;width:100%;max-width:600px;margin:4px auto 0}
.mk-why{max-width:600px;margin-inline:auto}
.mk-why-m p{margin:4px 0}
.fade{animation:mkIn .4s cubic-bezier(.2,1.2,.4,1)}
.note{min-height:24px;margin:8px 0;text-align:center;font:800 15.5px/1.35 var(--body)}
.note.good{color:#1c8a52}.note.warn{color:#b8531a}
.bigbtn{display:flex;width:100%;min-height:54px;font-size:19px}
.bar{display:flex;justify-content:space-between;gap:8px;margin:8px 0 0;font:800 14px/1.2 var(--body);color:var(--soft)}
/* salė */
.hall{margin:0 auto;max-width:440px;border-radius:16px;overflow:hidden;box-shadow:0 0 0 2.5px var(--ink);background:#241d45;touch-action:manipulation}
.hall svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.hall .hit{fill:transparent;cursor:pointer}
.hall .mv{transition:transform .22s cubic-bezier(.3,1.5,.5,1);transform-box:fill-box;transform-origin:center}
.beam{fill:none;stroke-linecap:round;stroke-linejoin:round}
.beam.run{stroke-dasharray:1;stroke-dashoffset:1;animation:bm var(--t,1.4s) linear forwards}
@keyframes bm{to{stroke-dashoffset:0}}
.beam.old{opacity:.38}
.gem.lit .gl{opacity:1}
.gem.lit .gb{filter:brightness(1.35) saturate(1.3)}
.gem .gl{opacity:0;transition:opacity .3s}
.gem.lit{animation:mkPop .45s cubic-bezier(.2,1.6,.4,1);transform-box:fill-box;transform-origin:center}
.tapc{fill:transparent;cursor:pointer}
.tapc.sel{fill:rgba(122,75,224,.25)}
.tapc.ok{fill:rgba(47,179,107,.4)}
.tapc.no{fill:rgba(232,96,75,.4)}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <section id="menu">
    <div class="mk-hero">
      <div class="hero-art" id="heroArt"></div>
      <h1 id="heroH"></h1>
      <p id="heroP"></p>
    </div>
    <div class="col" id="col"></div>
    <div id="levels"></div>
    <div id="learn"></div>
  </section>
  <section id="play" hidden>
    <div class="hud"><div id="dots"></div><span class="chip" id="ptsChip"><small id="ptsL"></small><span id="pts">0</span></span></div>
    <div id="stage"></div>
  </section>
</div>
<script>
(function(){
"use strict";
const T = window.MK_T, GAME = "veidrodziu-sale", GRADES = [7];
const R = MK.rnd, P = MK.pick, SH = MK.shuffle;
const K = "#121a33", S = `stroke="${K}" stroke-width="2.4" stroke-linejoin="round"`;
const rad = d => d * Math.PI / 180, f1 = x => +x.toFixed(1);

/* ================= brėžiniai: atspindžio dėsnis ================= */
function arrow(x1, y1, x2, y2, col, t){
  const mx = x1 + (x2 - x1) * (t || .55), my = y1 + (y2 - y1) * (t || .55), a = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
  return `<path d="M${f1(x1)} ${f1(y1)}L${f1(x2)} ${f1(y2)}" stroke="${col}" stroke-width="4" stroke-linecap="round"/><path d="M-8 -6L5 0L-8 6Z" fill="${col}" transform="translate(${f1(mx)} ${f1(my)}) rotate(${f1(a)})"/>`;
}
function mirrorH(x1, x2, y){
  let h = ""; for(let x = x1 + 4; x < x2; x += 12) h += `<path d="M${x} ${y + 3}l-7 9" stroke="#8a84a8" stroke-width="2"/>`;
  return h + `<path d="M${x1} ${y}H${x2}" stroke="#7fd4f5" stroke-width="7" stroke-linecap="round"/><path d="M${x1} ${y}H${x2}" stroke="${K}" stroke-width="2.5" stroke-linecap="round" transform="translate(0 3.5)"/>`;
}
const lab = (x, y, s, col, sz) => `<text x="${f1(x)}" y="${f1(y)}" text-anchor="middle" dominant-baseline="middle" font-family="Manrope,sans-serif" font-weight="800" font-size="${sz || 15}" fill="${col || K}" stroke="#f6f2ff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">${s}</text>`;
/* o: { a, flip, lab: { inc, ref, mi, mr, bet }, names } – kampai nuo statmens */
function rayFig(o){
  const hx = 160, hy = 150, L = 122, s = o.flip ? -1 : 1, a = o.a;
  const pt = (th, r) => [hx + r * Math.sin(rad(th)), hy - r * Math.cos(rad(th))];
  const arc = (t1, t2, r, col) => { const p = pt(t1, r), q = pt(t2, r); return `<path d="M${f1(p[0])} ${f1(p[1])}A${r} ${r} 0 0 ${t2 > t1 ? 1 : 0} ${f1(q[0])} ${f1(q[1])}" fill="none" stroke="${col}" stroke-width="2.6"/>`; };
  const A = pt(-a * s, L), B = pt(a * s, L); let h = "";
  h += mirrorH(22, 298, hy) + `<path d="M${hx} ${hy}V16" stroke="${K}" stroke-width="2" stroke-dasharray="6 5"/>`;
  const l = o.lab || {}, q = v => v === "?" ? "#d6336c" : "#5a37b8";
  if(a === 0){ h += arrow(hx - (o.noRef ? 0 : 5), 22, hx - (o.noRef ? 0 : 5), hy, "#f29b0c") + (o.noRef ? "" : arrow(hx + 5, hy, hx + 5, 22, "#e8590c")); }
  else {
    h += arrow(A[0], A[1], hx, hy, "#f29b0c") + arrow(hx, hy, B[0], B[1], "#e8590c");
    if(l.inc){ h += arc(-a * s, 0, 46, q(l.inc)); const p = pt(-a * s / 2, 66); h += lab(p[0], p[1], l.inc, q(l.inc)); }
    if(l.ref){ h += arc(0, a * s, 46, q(l.ref)); const p = pt(a * s / 2, 66); h += lab(p[0], p[1], l.ref, q(l.ref)); }
    if(l.mi){ const t1 = -90 * s, t2 = -a * s; h += arc(Math.min(t1, t2), Math.max(t1, t2), 34, q(l.mi)); const p = pt(-(90 + a) / 2 * s, 84); h += lab(p[0], p[1], l.mi, q(l.mi)); }
    if(l.mr){ const t1 = a * s, t2 = 90 * s; h += arc(Math.min(t1, t2), Math.max(t1, t2), 34, q(l.mr)); const p = pt((90 + a) / 2 * s, 84); h += lab(p[0], p[1], l.mr, q(l.mr)); }
    if(l.bet){ h += arc(-a, a, 30, q(l.bet)); h += lab(hx, hy - 46, l.bet, q(l.bet)); }
  }
  h += lab(hx + 30, 12, T.fig.normal, "#5b6480", 11.5) + lab(270, hy + 17, T.fig.mirror, "#5b6480", 11.5);
  return `<div class="figw"><svg viewBox="0 0 320 174" role="img" aria-label="${T.fig.mirror}">${h}</svg></div>`;
}
function miniFig(a, kind){
  const hx = 70, hy = 76, L = 62, pt = (th, r) => [hx + r * Math.sin(rad(th)), hy - r * Math.cos(rad(th))];
  const A = pt(-a, L); let h = mirrorH(8, 132, hy).replace(/stroke-width="7"/, 'stroke-width="5"') + `<path d="M${hx} ${hy}V10" stroke="${K}" stroke-width="1.6" stroke-dasharray="5 4"/>`;
  h += arrow(A[0], A[1], hx, hy, "#f29b0c");
  if(kind === "ok"){ const B = pt(a, L); h += arrow(hx, hy, B[0], B[1], "#e8590c"); }
  else if(kind === "wide" || kind === "narrow"){ const b = kind === "wide" ? Math.min(a + 28, 82) : Math.max(a - 26, 8), B = pt(b, L); h += arrow(hx, hy, B[0], B[1], "#e8590c"); }
  else if(kind === "back"){ const o = 5, B = [A[0] + o, A[1] + o]; h += arrow(hx + o, hy - 1, B[0], B[1], "#e8590c"); }
  else { const B = [hx + 26 * Math.sin(rad(a)), hy + 26 * Math.cos(rad(a))]; h += arrow(hx, hy, B[0], B[1], "#e8590c", .7); }
  return `<svg viewBox="0 0 140 104">${h}</svg>`;
}
function twoFig(a, q2){
  const hx = 150, hy = 160, vx = 252, sn = Math.sin(rad(a)), cs = Math.cos(rad(a));
  const A = [hx - 112 * sn, hy - 112 * cs], t = (vx - hx) / sn, B = [vx, hy - t * cs], C = [B[0] - 78 * sn, B[1] - 78 * cs];
  let h = mirrorH(34, vx, hy) + `<g transform="rotate(-90 ${vx} ${hy})">${mirrorH(vx, vx + 148, hy)}</g>`;
  h += `<path d="M${hx} ${hy}V${hy - 70}" stroke="${K}" stroke-width="2" stroke-dasharray="6 5"/><path d="M${vx} ${f1(B[1])}H${vx - 70}" stroke="${K}" stroke-width="2" stroke-dasharray="6 5"/>`;
  h += arrow(A[0], A[1], hx, hy, "#f29b0c") + arrow(hx, hy, B[0], B[1], "#e8590c") + arrow(B[0], B[1], C[0], C[1], "#d6336c", .7);
  const pt = (th, r) => [hx + r * Math.sin(rad(th)), hy - r * Math.cos(rad(th))], p = pt(-a, 40), q = pt(0, 40), m = pt(-a / 2, 58);
  h += `<path d="M${f1(p[0])} ${f1(p[1])}A40 40 0 0 1 ${f1(q[0])} ${f1(q[1])}" fill="none" stroke="#5a37b8" stroke-width="2.6"/>` + lab(m[0], m[1], a + "°", "#5a37b8");
  if(q2){ const th = (90 - a) / 2, x = vx - 52 * Math.cos(rad(th)), y = B[1] + 52 * Math.sin(rad(th)); h += lab(x, y, "?", "#d6336c", 17); }
  h += lab(80, hy + 17, T.fig.m1, "#5b6480", 11.5) + lab(vx + 14, 12, T.fig.m2, "#5b6480", 11.5).replace('text-anchor="middle"', 'text-anchor="end"');
  return `<div class="figw"><svg viewBox="0 0 320 184">${h}</svg></div>`;
}
function periFig(){
  const mir = (x, y) => `<path d="M${x - 17} ${y - 17}l34 34" stroke="#7fd4f5" stroke-width="7" stroke-linecap="round"/><path d="M${x - 20} ${y - 14}l34 34" stroke="${K}" stroke-width="2.5" stroke-linecap="round" transform="translate(${x < 0 ? 0 : 0} 0)"/>`;
  const h = `<path d="M70 22h106v124h76v40H136V62H70z" fill="#e3dbfa" ${S}/>
    <path d="M139 25l34 34" stroke="${K}" stroke-width="9" stroke-linecap="round"/><path d="M139 25l34 34" stroke="#7fd4f5" stroke-width="5" stroke-linecap="round"/>
    <path d="M139 149l34 34" stroke="${K}" stroke-width="9" stroke-linecap="round"/><path d="M139 149l34 34" stroke="#7fd4f5" stroke-width="5" stroke-linecap="round"/>
    ${arrow(42, 42, 156, 42, "#f29b0c", .45)}${arrow(156, 42, 156, 166, "#e8590c")}${arrow(156, 166, 262, 166, "#d6336c", .6)}
    <ellipse cx="284" cy="166" rx="15" ry="10" fill="#fff" ${S}/><circle cx="281" cy="166" r="5.5" fill="#4a7de0" stroke="${K}" stroke-width="2"/>
    <rect x="20" y="25" width="20" height="34" rx="4" fill="#ffd34d" ${S}/>${lab(30, 72, T.fig.obj, "#5b6480", 11.5)}${lab(284, 188, T.fig.eye, "#5b6480", 11.5)}`;
  return `<div class="figw"><svg viewBox="0 0 320 200">${h}</svg></div>`;
}

/* ================= 1 lygis ================= */
const deg = x => x + "°";
function numOpts(right, cands){
  const set = []; for(const c of SH(cands)){ if(c !== right && c >= 0 && c <= 180 && !set.includes(c)) set.push(c); if(set.length === 3) break; }
  for(let d = 5; set.length < 3; d += 5){ for(const c of [right + d, right - d]) if(c > 0 && c < 180 && c !== right && !set.includes(c) && set.length < 3) set.push(c); }
  const all = SH([right].concat(set)); return { opts: all.map(deg), right: all.indexOf(right), ans: deg(right) };
}
function mc(o){ return Object.assign({ type: "mc" }, o); }
function textOpts(list){ const sh = SH(list.map((_, i) => i)); return { opts: sh.map(i => list[i]), right: sh.indexOf(0), ans: list[0] }; }
const ANG = [20, 25, 30, 35, 40, 50, 55, 60, 65, 70];
function t1(kind){
  const a = P(ANG), f = 90 - a, flip = R(0, 1) === 1, law = T.w1.law;
  switch(kind){
    case "ref": { const o = numOpts(a, [f, 2 * a, 180 - a, 180 - 2 * a]); return mc(Object.assign(o, { kind, fig: rayFig({ a, flip, lab: { inc: deg(a), ref: "?" } }), text: T.q1.ref(a), two: 1, why: { body: T.w1.ref(a), more: law } })); }
    case "mirInc": { const o = numOpts(a, [f, 2 * f, 180 - f, 2 * a]); return mc(Object.assign(o, { kind, fig: rayFig({ a, flip, lab: { mi: deg(f), inc: "?" } }), text: T.q1.mirInc(f), two: 1, why: { body: T.w1.mirInc(f, a), more: law } })); }
    case "mirRef": { const o = numOpts(a, [f, 2 * f, 180 - f, 2 * a]); return mc(Object.assign(o, { kind, fig: rayFig({ a, flip, lab: { mi: deg(f), ref: "?" } }), text: T.q1.mirRef(f), two: 1, why: { body: T.w1.mirRef(f, a), more: law } })); }
    case "between": { const o = numOpts(2 * a, [a, f, 180 - 2 * a, 180 - a, 90]); return mc(Object.assign(o, { kind, fig: rayFig({ a, flip, lab: { inc: deg(a) } }), text: T.q1.between(a), two: 1, why: { body: T.w1.between(a, 2 * a), more: law } })); }
    case "half": { const o = numOpts(a, [2 * a, f, 180 - 2 * a, 4 * a]); return mc(Object.assign(o, { kind, fig: rayFig({ a, flip, lab: { bet: deg(2 * a) } }), text: T.q1.half(2 * a), two: 1, why: { body: T.w1.half(2 * a, a), more: law } })); }
    case "refMir": { const o = numOpts(f, [a, 2 * a, 180 - a, 2 * f]); return mc(Object.assign(o, { kind, fig: rayFig({ a, flip, lab: { inc: deg(a), mr: "?" } }), text: T.q1.refMir(a), two: 1, why: { body: T.w1.refMir(a, f), more: law } })); }
    case "grow": { const x = P([5, 10, 15, 20]), all = SH([2 * x, x, x / 2, 0]), sh = v => v === 0 ? T.o1.grow0 : String(v).replace(".", ",") + "°";
      return mc({ kind, fig: rayFig({ a: 35, flip }), text: T.q1.grow(x), opts: all.map(sh), right: all.indexOf(2 * x), ans: sh(2 * x), two: 1, why: { body: T.w1.grow(x, 2 * x), more: law } }); }
    case "zero": { if(R(0, 1)){ const o = numOpts(0, [90, 45, 180]); return mc(Object.assign(o, { kind, fig: rayFig({ a: 0 }), text: T.q1.zero, two: 1, why: { body: T.w1.zero, more: law } })); }
      return mc(Object.assign(textOpts(T.o1.zero2), { kind: "zero2", fig: rayFig({ a: 0, noRef: 1 }), text: T.q1.zero2, why: { body: T.w1.zero2, more: law } })); }
    case "pick": { const b = P([30, 40, 50, 60]), kinds = SH(["ok", P(["wide", "narrow"]), "back", "thru"]), L = "ABCD";
      return mc({ kind, fig: "", text: T.q1.pick, opts: kinds.map((k, i) => `<i>${L[i]}</i>${miniFig(b, k)}`), pic: 1, two: 1, right: kinds.indexOf("ok"), ans: L[kinds.indexOf("ok")], why: { body: T.w1.pick, more: law } }); }
    case "two": { const b = P([40, 45, 50, 55, 60, 65, 70]), o = numOpts(90 - b, [b, 2 * b, 180 - 2 * b, 180 - b, 90]); return mc(Object.assign(o, { kind, fig: twoFig(b, true), text: T.q1.two(b), two: 1, why: { body: T.w1.two(b, 90 - b), more: law } })); }
    case "two2": return mc(Object.assign(textOpts(T.o1.two2), { kind, fig: twoFig(P([45, 50, 55, 60, 65]), false), text: T.q1.two2, why: { body: T.w1.two2, more: law } }));
    case "peri": { const v = R(0, 1), o = v ? numOpts(90, [45, 180, 60, 30]) : numOpts(45, [90, 30, 60, 180]); return mc(Object.assign(o, { kind: "peri" + v, fig: periFig(), text: v ? T.q1.peri2 : T.q1.peri1, two: 1, why: { body: v ? T.w1.peri2 : T.w1.peri1, more: law } })); }
    default: { const c = kind && kind.q ? kind : P(T.concept1); return mc(Object.assign(textOpts(c.o), { kind: "c:" + T.concept1.indexOf(c), fig: "", text: c.q, why: { body: c.w } })); }
  }
}
function gen1(){
  const core = SH(["ref", "mirInc", "mirRef", "between", "half", "refMir", "grow", "zero"]).slice(0, 4), cs = SH(T.concept1);
  return SH(core.concat(["pick", P(["two", "two2"]), "peri"]).map(t1).concat([t1(cs[0])]));
}

/* ================= salė: spindulio kelias ================= */
const W = 6, H = 6, C = 50, PAD = 8, DX = [1, 0, -1, 0], DY = [0, 1, 0, -1], SL = [3, 2, 1, 0], BS = [1, 0, 3, 2];
function trace(st, mirOf){
  let x = st.lamp.x, y = st.lamp.y, d = st.lamp.d, n = 0; const pts = [[x, y]], lit = new Set(), seen = new Set(), ts = new Set(st.targets);
  for(;;){
    x += DX[d]; y += DY[d];

  <g transform="translate(300 150)"><path d="M0 22V46M-16 46h32" stroke="${K}" stroke-width="5" stroke-linecap="round"/><path d="M-22 22L22 -22" stroke="${K}" stroke-width="11" stroke-linecap="round"/><path d="M-22 22L22 -22" stroke="#8fe0ff" stroke-width="6" stroke-linecap="round"/></g>
  <g transform="translate(300 62)"><path d="M0 -22V-46" stroke="${K}" stroke-width="5" stroke-linecap="round"/><path d="M-22 22L22 -22" stroke="${K}" stroke-width="11" stroke-linecap="round"/><path d="M-22 22L22 -22" stroke="#8fe0ff" stroke-width="6" stroke-linecap="round"/></g>
  <g transform="translate(410 62) scale(2)">${gemSvg("#ff5d8f", true)}</g>

    <ellipse cx="0" cy="102" rx="34" ry="6" fill="#121a33" opacity=".3"/>

    <path d="M-17 22q17-10 34 0l3 44h-40z" fill="#7a4be0" ${S}/><path d="M-6 20l6 9 6-9" fill="#fff" ${S}/>
    <path d="M-16 28q-14 14-8 34" fill="none" stroke="${K}" stroke-width="11" stroke-linecap="round"/><path d="M-16 28q-14 14-8 34" fill="none" stroke="#7a4be0" stroke-width="6.5" stroke-linecap="round"/><circle cx="-24" cy="63" r="5.5" fill="#ffd6b3" ${S}/>

    <g transform="translate(46 54)"><rect x="-10" y="-8" width="20" height="16" rx="4" fill="#ff8a1f" ${S}/><path d="M10 -11h7v22h-7z" fill="#ffd34d" ${S}/></g><circle cx="42" cy="52" r="5.5" fill="#ffd6b3" ${S}/>
    <circle cx="0" cy="0" r="21" fill="#ffd6b3" ${S}/><path d="M-21 -2q-3-24 21-24t21 24q-8-12-21-12t-21 12z" fill="#7b3f1d" ${S}/><path d="M-20 -4q-8 14-2 28" fill="none" stroke="#7b3f1d" stroke-width="7" stroke-linecap="round"/><path d="M20 -4q8 14 2 28" fill="none" stroke="#7b3f1d" stroke-width="7" stroke-linecap="round"/>
    <circle cx="-7" cy="1" r="2.6" fill="${K}"/><circle cx="8" cy="1" r="2.6" fill="${K}"/><path d="M-5 10q6 5 12 0" fill="none" stroke="${K}" stroke-width="2.2" stroke-linecap="round"/><circle cx="-13" cy="8" r="3.4" fill="#ff9d9d" opacity=".7"/><circle cx="14" cy="8" r="3.4" fill="#ff9d9d" opacity=".7"/>
  </g></svg>`;
}
const crystals = () => MK.get(KEY, 0), wallGot = n => Math.min(WALLN, Math.floor(n / 3));
function renderWall(prev){
  const n = crystals(), got = wallGot(n), rank = T.ranks[got >= WALLN ? 4 : got >= 20 ? 3 : got >= 10 ? 2 : got >= 3 ? 1 : 0]; let h = "";
  for(let i = 0; i < WALLN; i++) h += `<svg viewBox="-22 -22 44 44" class="${i < got ? (prev != null && i >= prev ? "new" : "") : "off"}">${i < got ? gemSvg(GEMC[(i * 5 + (i / 9 | 0)) % 6], true) : gemSvg("#4a4170", false)}</svg>`;
  $("col").innerHTML = `<h2><svg viewBox="-22 -22 44 44" aria-hidden="true">${gemSvg("#b184ff", false)}</svg>${T.colH}</h2><p>${T.colP(n, got, WALLN, rank)}</p><div class="wall">${h}</div>`;
}
function showMenu(prev){
  play.hidden = true; menu.hidden = false; $("heroArt").innerHTML = heroSvg(); renderWall(prev);
  MK.levels($("levels"), { game: GAME, levels: LEVELS, onPick: start });
  MK.learn($("learn"), { topics: T.learn, onPlay: start });
  window.scrollTo(0, 0);
}

/* ================= žaidimas ================= */
let L = 0, tasks = [], ti = 0, cur = null, okN = 0, pts = 0, dots = null, wall0 = 0;
function start(i){
  L = i; tasks = LV[i](); ti = 0; okN = 0; pts = 0; $("pts").textContent = 0; wall0 = wallGot(crystals());
  menu.hidden = true; play.hidden = false; dots = MK.dots($("dots"), tasks.length); show();
}
function award(n){ if(n){ pts += n; const c = $("ptsChip"); $("pts").textContent = pts; c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop"); } }
function first(ok){ dots.mark(ti, ok); if(ok){ okN++; MK.set(KEY, crystals() + 1); } }
function whyBlock(ok, w, ans){ return MK.why({ ok, head: ok ? MK.praise() : (ans ? T.bad(ans) : T.badPlain), body: w.body, more: w.more, sum: T.rule, open: !ok }); }
function addWhy(ok, w, ans){ const d = document.createElement("div"); d.innerHTML = whyBlock(ok, w, ans); $("flow").appendChild(d.firstElementChild); }
function nextBtn(){
  const go = document.createElement("button"); go.type = "button"; go.className = "mk-btn go"; go.id = "next"; go.textContent = ti < tasks.length - 1 ? T.next : T.finish;
  go.onclick = () => { MK.sfx.tap(); ti++; ti < tasks.length ? show() : finish(); };
  $("flow").appendChild(go); setTimeout(() => go.scrollIntoView({ behavior: "smooth", block: "nearest" }), 120);
}
function show(){
  cur = tasks[ti]; dots.cur(ti); window.scrollTo({ top: 0 });
  if(cur.type === "rot" || cur.type === "place") return showHall();
  if(cur.type === "tap") return showTap();
  stage.innerHTML = `<div class="card fade">${cur.fig || ""}<p class="txt">${cur.text}</p>
    <div class="ans${cur.two ? " two" : ""}" id="ans">${cur.opts.map((o, i) => `<button type="button" class="a${cur.pic ? " pic" : ""}" data-i="${i}">${o}</button>`).join("")}</div></div><div id="flow"></div>`;
  $("ans").onclick = e => {
    const b = e.target.closest(".a"), ans = $("ans"); if(!b || ans.classList.contains("done")) return;
    ans.classList.add("done"); MK.unlock(); const ok = +b.dataset.i === cur.right;
    b.classList.add(ok ? "ok" : "no"); if(!ok) ans.children[cur.right].classList.add("ok");
    first(ok); if(ok){ award(10); MK.sfx.good(); } else MK.sfx.bad();
    addWhy(ok, cur.why, cur.pic ? cur.ans : cur.ans); nextBtn();
  };
}
function showTap(){
  stage.innerHTML = `<div class="card fade"><p class="txt">${cur.text}</p><div class="figw" id="tapw">${tapFig(cur.o)}</div></div><div id="flow"></div>`;
  let done = false;
  $("tapw").onclick = e => {
    const c = e.target.closest(".tapc"); if(!c || done) return; done = true; MK.unlock();
    const x = +c.dataset.x, y = +c.dataset.y, ok = x === cur.o.ic && y === cur.o.r;
    $("tapw").innerHTML = tapFig(cur.o, { x, y }); first(ok); if(ok){ award(10); MK.sfx.good(); } else MK.sfx.bad();
    addWhy(ok, cur.why, ""); nextBtn();
  };
}
function showHall(){
  const st = cur.st, place = cur.type === "place", nT = st.targets.length; let tries = 0, done = false, busy = false, old = null;
  const lockN = place ? [...st.mir.values()].filter(m => m.lock).length : 0;
  stage.innerHTML = `<div class="card fade"><p class="txt">${place ? T.p3(nT, st.max, lockN) : T.p2(nT)}</p><div class="hall" id="hall"></div>
    <div class="bar"><span id="cnt"></span><span id="trl"></span></div><p class="note" id="note" role="status" aria-live="polite"></p>
    <button type="button" class="mk-btn bigbtn" id="goB">${T.go}</button></div><div id="flow"></div>`;
  const hall = $("hall"), note = $("note"), mirOf = k => st.mir.get(k) && st.mir.get(k).o, placed = () => [...st.mir.values()].filter(m => !m.lock).length;
  const draw = lit => { hall.innerHTML = hallSvg(st, { place, lit }); if(old) hall.querySelector("#beamG").innerHTML = old; $("cnt").textContent = place ? T.left(placed(), st.max) : ""; $("trl").textContent = done ? "" : T.tries(3 - tries); };
  draw();
  hall.onclick = e => {
    const r = e.target.closest(".hit"); if(!r || done || busy) return; const k = +r.dataset.k, m = st.mir.get(k); MK.unlock();
    if(m && m.lock){ note.className = "note warn"; note.textContent = T.locked; return; }
    if(place){
      if(k === st.lamp.y * W + st.lamp.x || st.walls.has(k) || st.targets.includes(k)) return;
      if(!m){ if(placed() >= st.max){ note.className = "note warn"; note.textContent = T.noMore; MK.sfx.bad(); return; } st.mir.set(k, { o: "/" }); }
      else if(m.o === "/") m.o = "\\"; else st.mir.delete(k);
    } else { if(!m) return; m.o = m.o === "/" ? "\\" : "/"; }
    MK.sfx.tap(); note.textContent = ""; old = null; draw();
  };
  $("goB").onclick = () => {
    if(done || busy) return; MK.unlock(); busy = true; tries++; old = null; draw(); $("goB").disabled = true; note.textContent = "";
    const tr = trace(st, mirOf), b = beamSvg(tr, "run"); hall.querySelector("#beamG").innerHTML = b.html; MK.sfx.whoosh();
    setTimeout(() => {
      busy = false; old = beamSvg(tr, tr.ok ? "" : "old").html; draw(tr.lit);
      if(tr.ok){
        done = true; const spare = place && placed() < st.max; first(tries === 1); award([0, 10, 6, 3][tries] + (spare ? 2 : 0)); MK.sfx.good();
        note.className = "note good"; note.textContent = T.win(tr.n) + (spare ? T.spare : ""); $("goB").hidden = true; $("trl").textContent = "";
        addWhy(true, { body: T.wPuz(tr.n), more: T.wPuzMore }); nextBtn();
      } else if(tries >= 3){
        done = true; first(false); MK.sfx.bad(); note.className = "note warn"; note.textContent = T.failEnd; $("goB").hidden = true;
        if(place) [...st.mir.keys()].forEach(k => { if(!st.mir.get(k).lock) st.mir.delete(k); });
        st.sol.forEach((o, k) => st.mir.set(k, { o, lock: st.mir.get(k) && st.mir.get(k).lock }));
        const s = trace(st, mirOf); old = beamSvg(s, "").html; draw(s.lit);
        addWhy(false, { body: T.wPuz(s.n), more: T.wPuzMore }, ""); nextBtn();
      } else { MK.sfx.bad(); note.className = "note warn"; note.textContent = T.fail(tr.lit.size, nT, 3 - tries); $("goB").disabled = false; }
    }, b.t * 1000 + 250);
  };
}
function finish(){
  const total = tasks.length, stars = MK.starsFor(okN, total); MK.best(GAME, LEVELS[L].id, stars);
  const gain = wallGot(crystals()) - wall0;
  MK.result({ stars, title: `${okN} / ${total}`, text: T.res(okN, total, pts, gain),
    next: L < LEVELS.length - 1 ? () => start(L + 1) : null, again: () => start(L), menu: () => showMenu(gain ? wall0 : null) });
}
Object.defineProperty(window, "__cur", { get: () => cur });
window.__MK_TEST = { LV, t1, t4, genRot, genPlace, trace, W, H, T };
showMenu();
})();
</script>
