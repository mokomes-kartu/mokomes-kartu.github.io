<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gyvybės tinklas – MokomėsKartu.lt</title>
<meta name="description" content="8 klasės biologijos žaidimas: mitybos grandinės ir tinklai, gamintojai, gyvėdžiai ir skaidytojai, mitybos lygmenys, energijos kelias, ekosistemų stabilumas ir invazinės rūšys.">
<meta name="theme-color" content="#fff9e6">
<link rel="icon" href="/logo/mk-ikona.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800&family=Manrope:wght@600;700;800&display=swap">
<script src="/bendra/mk.js"></script>
<script src="/gyvybes-tinklas/tekstai.lt.js"></script>
<script src="/gyvybes-tinklas/tinklai.js"></script>
<style>
/* Meniu: piešinys su gamtininke, „Rasos lauko užrašai“ (kolekcija), lygiai, „Noriu pasimokyti“.
   Užduotys: grandinės dėliojimas, skirstymas į grupes, tinklo jungimas rodyklėmis, pasirinkimo klausimai su tinklu ar piramide. */
body{--ac:#2f8f5b;--ac-ink:#fff;--ac-soft:#dff3e3}
.mk-title{font-size:clamp(16px,4.4vw,24px)}
.mk-hero{padding-top:0}
.mk-hero h1{margin-top:8px;font-size:clamp(32px,8.4vw,54px)}
.mk-hero p{max-width:46ch;font-size:16px}
.art{width:min(100%,480px);border-radius:24px;overflow:hidden;position:relative;box-shadow:0 6px 0 rgba(18,26,51,.15);background:#cfeefa}
.art svg{display:block;width:100%;height:auto}
.art::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 3px var(--ink);pointer-events:none}
.col{width:100%;max-width:520px;margin:0 auto 14px;padding:12px 14px 14px;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 2.5px var(--ink),0 5px 0 rgba(18,26,51,.14)}
.col h2{margin:0;font:800 18px/1.2 var(--kid)}
.col p{margin:4px 0 8px;color:var(--soft);font-weight:700;font-size:14.5px}
.col p b{color:var(--ink)}
.col details summary{cursor:pointer;font:800 15px/1 var(--body);color:var(--ac);min-height:36px;display:flex;align-items:center;gap:6px;list-style:none}
.col details summary::-webkit-details-marker{display:none}
.col details summary::before{content:"▸"}.col details[open] summary::before{content:"▾"}
.bar{height:14px;border-radius:99px;background:#efe6c8;box-shadow:inset 0 0 0 2px var(--ink);overflow:hidden;margin:0 0 6px}
.bar i{display:block;height:100%;background:var(--ac);border-right:2px solid var(--ink);min-width:8px}
.atl h3{margin:10px 0 4px;font:800 13px/1.2 var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}
.atl div{display:flex;flex-wrap:wrap;gap:5px}
.atl span{width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px var(--ink);display:grid;place-items:center}
.atl span.off{background:#f1ead2;box-shadow:inset 0 0 0 2px #cfc39a}
.atl span.off svg{filter:grayscale(1) brightness(1.6) contrast(.25);opacity:.45}
.mk-lvl-t b{font-size:19px}

.hud{display:flex;align-items:center;gap:8px;margin:0 0 8px;min-height:36px}
.hud .mk-dots{margin-right:auto;justify-content:flex-start}
.chip{display:inline-flex;align-items:baseline;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink);font:800 17px/36px var(--kid);white-space:nowrap}
.chip small{font:800 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.chip.pop{animation:mkPop .35s cubic-bezier(.2,1.6,.4,1)}
.card{width:100%;max-width:560px;margin:0 auto 10px;padding:12px 12px 14px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.12)}
.eco{display:inline-block;margin:0 0 6px;padding:3px 10px;border-radius:99px;background:var(--ac-soft);font:800 12px/1.4 var(--body);letter-spacing:.04em;text-transform:uppercase;color:#1c5c3a}
.txt{margin:0 0 10px;font:700 16px/1.5 var(--body)}
.note{margin:8px 0;min-height:22px;font:700 14.5px/1.45 var(--body);color:var(--soft)}
.note.ok{color:#177245}.note.bad{color:#b3261e}.note b{color:var(--ink)}
.go{width:100%}
.mk-why{max-width:560px;margin-inline:auto}
.mk-why .mk-ex{font-size:14.5px}
.fade{animation:mkIn .35s backwards}

/* organizmo žetonas */
.tk{display:inline-flex;flex-direction:column;align-items:center;gap:2px;width:58px;padding:0;border:0;background:none;color:var(--ink);font:inherit;vertical-align:top}
button.tk{cursor:pointer;touch-action:manipulation}
.ti{width:50px;height:50px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink),0 3px 0 rgba(18,26,51,.16);display:grid;place-items:center;font:800 24px/1 var(--kid);position:relative}
.ti svg{width:40px;height:40px;display:block}
.tk small,.slot small{display:block;width:calc(100% + 10px);margin:0 -5px;font:800 10.5px/1.15 var(--body);text-align:center;hyphens:manual}
button.tk:active .ti{transform:translateY(2px)}
.tk.sel .ti{box-shadow:inset 0 0 0 3.5px #2f6bff,0 0 0 4px #c9d9ff}
.tk.err .ti{box-shadow:inset 0 0 0 3.5px var(--bad);background:#ffe9e3}
.tk.good .ti{box-shadow:inset 0 0 0 3.5px var(--good);background:#e9faf1}
.tk.q .ti{background:#fff3c4;color:#b3261e;box-shadow:inset 0 0 0 2.5px var(--ink)}
.tk .bd{position:absolute;right:-5px;bottom:-4px;min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:var(--ink);color:#fff;font:800 11px/20px var(--body);text-align:center}
.strip{display:flex;align-items:flex-start;justify-content:center;gap:1px;margin:0 0 10px}
.ar{flex:none;font:800 20px/50px var(--body);font-style:normal;color:var(--ink);width:14px;text-align:center}
.ar.err{color:var(--bad)}.ar.good{color:var(--good)}
.slots{display:flex;align-items:flex-start;justify-content:center;gap:1px;margin:0 0 6px;padding:10px 2px 6px;border-radius:14px;background:#f4f8ee;box-shadow:inset 0 0 0 2px #c9d8b8}
.slot{width:58px;min-height:68px;padding:0;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;color:var(--ink);touch-action:manipulation}
.slot .ti.empty{background:#fff;box-shadow:inset 0 0 0 2.5px #b9c7a8;color:#9aa88a;font-size:18px}
.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 6px;min-height:72px;margin:10px 0 0}
.tray .tk.used{visibility:hidden}
@media (max-width:379px){.tk,.slot{width:52px}.ti{width:46px;height:46px}.ti svg{width:36px;height:36px}.ar{width:11px;font-size:17px;line-height:46px}.tk small,.slot small{font-size:10px}}
.grid6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 4px;justify-items:center;margin:0 0 10px}
.grid6 .tk{width:92px}.grid6 .tk small{font-size:12px}
.bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.bin{min-height:44px;padding:4px 4px;border:0;border-radius:12px;cursor:pointer;font:800 13.5px/1.15 var(--body);color:var(--ink);box-shadow:inset 0 0 0 2.5px var(--ink),0 3px 0 rgba(18,26,51,.16);touch-action:manipulation}
.bin:active{transform:translateY(2px)}
.bin b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;margin-right:4px}
.gG{background:#d6f2c4}.gA{background:#ffe9a8}.gP{background:#ffd0c4}.gS{background:#e3d6c4}.gZ{background:#e6d4f7}
.tk .bd.gG{background:#d6f2c4}.tk .bd.gA{background:#ffe9a8}.tk .bd.gP{background:#ffd0c4}.tk .bd.gS{background:#e3d6c4}.tk .bd.gZ{background:#e6d4f7}
.tk .bd{color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.ans{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.ans.one{grid-template-columns:1fr}
.a{min-height:52px;padding:8px 10px;border:0;border-radius:14px;background:#fff;cursor:pointer;text-align:center;font:800 16.5px/1.25 var(--body);color:var(--ink);
  box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.16);transition:transform .1s;touch-action:manipulation;display:flex;align-items:center;justify-content:center;gap:8px}
.ans.one .a{font-size:15.5px}
.a svg{flex:none}.a span{min-width:0;hyphens:manual}.a.tko{font-size:15.5px;padding-inline:6px;gap:6px}
.a:active{transform:translateY(3px)}
.a.ok{background:#d9f7e6;box-shadow:inset 0 0 0 3px var(--good),0 4px 0 rgba(18,26,51,.1)}
.a.no{background:#ffe6df;box-shadow:inset 0 0 0 3px var(--bad);opacity:.75}
.a[disabled]{pointer-events:none}
.web{margin:0 auto 8px;border-radius:14px;overflow:hidden;box-shadow:0 0 0 2.5px var(--ink);background:#f4f8ee;max-width:420px}
.web svg{display:block;width:100%;height:auto;touch-action:manipulation}
.web .nd{cursor:default}.web.live .nd{cursor:pointer}
.web .nd.shake{animation:mkShake .45s}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .chip{height:32px;font:800 14px/32px var(--body)}
.row .mk-btn{margin-left:auto;min-height:40px;font-size:15px;padding:6px 10px}
.pyr{margin:0 auto 10px;max-width:380px}
.pyr svg{display:block;width:100%;height:auto}
.mk-lt-b ul{margin:6px 0;padding-left:20px}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <section id="menu">
    <div class="mk-hero">
      <div class="art" id="heroArt"></div>
      <h1 id="heroH"></h1>
      <p id="heroP"></p>
    </div>
    <div class="col" id="col"></div>
    <div id="levels"></div>
    <div id="learn"></div>
  </section>
  <section id="play" hidden>
    <div class="hud"><div id="dots"></div><span class="chip" id="ptsChip"><small id="ptsL"></small><span id="pts">0</span></span></div>
    <div id="stage"></div>
  </section>
</div>
<script>
(function(){
"use strict";
const T = window.MK_T, D = window.MK_TINKLAI, O = T.org, GAME = "gyvybes-tinklas", GRADES = [8], AK = "mk-" + GAME + "-atlasas";
const R = MK.rnd, P = MK.pick, SH = MK.shuffle, $ = id => document.getElementById(id), cap = T.cap, nf = T.nf;
const K = "#121a33", S = `stroke="${K}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"`;
const FT = `font-family="Manrope,Arial,sans-serif" font-weight="800"`;

/* ================= ekosistemų grafai ================= */
function graph(e, inv){
  const eats = {}; for(const k in e.eats) eats[k] = e.eats[k].slice();
  if(inv && e.inv){ eats[e.inv.id] = e.inv.eats.slice(); e.inv.by.forEach(b => eats[b] = (eats[b] || []).concat(e.inv.id)); }
  const by = {}, links = [], set = new Set();
  for(const k in eats) eats[k].forEach(f => { (by[f] = by[f] || []).push(k); links.push([f, k]); set.add(f); set.add(k); });
  return { e, eats, by, links, nodes: [...set], has: (f, k) => !!(eats[k] && eats[k].includes(f)) };
}
const GS = D.ECO.map(e => graph(e)), GI = D.ECO.filter(e => e.inv).map(e => graph(e, true));
const eatP = (e, f) => T.part[e + ">" + f] || O[f].i;
function paths(g, len){ const out = []; const go = p => { if(p.length === len){ out.push(p); return; } (g.by[p[p.length - 1]] || []).forEach(n => go(p.concat(n))); }; g.nodes.filter(D.isG).forEach(s => go([s])); return out; }
const validChain = (g, p) => D.isG(p[0]) && p.every((x, i) => !i || g.has(p[i - 1], x));
/* jungus potinklis iš n organizmų: kiekvienas ne gamintojas turi maisto, 3–5 lygmenys */
function sub(g, n, must){
  for(let t = 0; t < 600; t++){
    const set = new Set(must || []); if(!set.size) set.add(P(g.nodes.filter(x => !D.isG(x))));
    let guard = 0;
    while(set.size < n && guard++ < 120){ const u = P([...set]), c = [...(g.eats[u] || []), ...(g.eats[u] || []), ...(g.by[u] || [])].filter(x => !set.has(x)); if(c.length) set.add(P(c)); }
    if(set.size !== n) continue;
    const nodes = [...set], ln = g.links.filter(l => set.has(l[0]) && set.has(l[1]));
    if(nodes.some(x => !D.isG(x) && !ln.some(l => l[1] === x)) || nodes.some(x => D.isG(x) && !ln.some(l => l[0] === x))) continue;
    if(ln.length < n - 1 || ln.length > n + 3) continue;
    const sw = { g, nodes, links: ln, lvl: {}, lens: {} };
    const lens = x => sw.lens[x] || (sw.lens[x] = D.isG(x) ? [1] : [...new Set([].concat(...ln.filter(l => l[1] === x).map(l => lens(l[0]).map(v => v + 1))))].sort());
    nodes.forEach(x => { sw.lvl[x] = Math.max(...lens(x)); });
    sw.maxL = Math.max(...nodes.map(x => sw.lvl[x]));
    if(sw.maxL < 3 || sw.maxL > 5) continue;
    if(nodes.filter(D.isG).length > 3) continue;
    return sw;
  }
  return null;
}
const foods = (sw, x) => sw.links.filter(l => l[1] === x).map(l => l[0]), eaters = (sw, x) => sw.links.filter(l => l[0] === x).map(l => l[1]);
function pathTo(sw, x, len){ if(D.isG(x)) return len === 1 ? [x] : null; for(const f of foods(sw, x)){ const p = pathTo(sw, f, len - 1); if(p) return p.concat(x); } return null; }
function allTo(sw, x){ if(D.isG(x)) return [[x]]; return [].concat(...foods(sw, x).map(f => allTo(sw, f).map(p => p.concat(x)))); }

/* ================= piešiniai ================= */
const lab = id => O[id].n.replace("planktonas", "\u00adplanktonas");
const tok = (id, cls, tag, extra) => `<${tag || "span"} class="tk ${cls || ""}" data-id="${id}"${tag === "button" ? ' type="button"' : ""}><span class="ti">${D.icon(id, 40)}${extra || ""}</span><small>${lab(id)}</small></${tag || "span"}>`;
const strip = (ids, gap) => `<div class="strip">${ids.map((id, i) => (i ? '<i class="ar">→</i>' : "") + (i === gap ? '<span class="tk q"><span class="ti">?</span><small>&nbsp;</small></span>' : tok(id))).join("")}</div>`;
const optTok = id => `${D.icon(id, 32)}<span>${lab(id)}</span>`;
const chainTxt = p => p.map(x => O[x].n).join(" → ");

function lay(sw){
  if(sw.pos) return sw;
  const rows = []; sw.nodes.forEach(n => { const i = sw.lvl[n] - 1; (rows[i] = rows[i] || []).push(n); });
  for(let i = 0; i < rows.length; i++) rows[i] = SH(rows[i] || []);
  const W = 340, RH = 82, H = (rows.length - 1) * RH + 96, pos = {};
  const place = () => rows.forEach((r, i) => { const k = r.length; r.forEach((n, j) => { pos[n] = { x: Math.round(W * (j + .5) / k + (k < 4 && i % 2 ? (k === 1 ? 26 : 14) : 0) - (k < 4 && i % 2 === 0 && k === 1 ? 26 : 0)), y: H - 62 - i * RH }; }); });
  place();
  const avg = a => a.reduce((s, v) => s + v, 0) / a.length;
  for(let s = 0; s < 3; s++){
    for(let i = 1; i < rows.length; i++){ const b = n => avg(foods(sw, n).map(f => pos[f].x)); rows[i].sort((a, c) => b(a) - b(c)); place(); }
    for(let i = rows.length - 2; i >= 0; i--){ const b = n => { const e = eaters(sw, n).map(f => pos[f].x); return e.length ? avg(e) : W / 2; }; rows[i].sort((a, c) => b(a) - b(c)); place(); }
  }
  sw.pos = pos; sw.H = H; sw.W = W; return sw;
}
function arrow(sw, a, b){
  const p = sw.pos[a], q = sw.pos[b], dx = q.x - p.x, dy = q.y - p.y, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
  const obs = []; sw.nodes.forEach(n => { if(n !== a && n !== b){ obs.push([sw.pos[n].x, sw.pos[n].y, 29]); obs.push([sw.pos[n].x, sw.pos[n].y + 34, 20]); } });
  obs.push([p.x, p.y + 36, 14]);
  let c = null;
  for(const off of [0, 30, -30, 55, -55, 80, -80, 110, -110]){
    const cx = (p.x + q.x) / 2 - uy * off, cy = (p.y + q.y) / 2 + ux * off; let ok = cx > 8 && cx < sw.W - 8;
    for(let t = .12; ok && t <= .9; t += .04){ const x = (1 - t) * (1 - t) * p.x + 2 * t * (1 - t) * cx + t * t * q.x, y = (1 - t) * (1 - t) * p.y + 2 * t * (1 - t) * cy + t * t * q.y; if(obs.some(o => Math.hypot(o[0] - x, o[1] - y) < o[2])) ok = false; }
    if(ok){ c = [cx, cy]; break; }
  }
  if(!c) c = [(p.x + q.x) / 2, (p.y + q.y) / 2];
  const t1 = Math.hypot(c[0] - p.x, c[1] - p.y) || 1, t2 = Math.hypot(c[0] - q.x, c[1] - q.y) || 1;
  const sx = p.x + (c[0] - p.x) / t1 * 26, sy = p.y + (c[1] - p.y) / t1 * 26, up = Math.max(0, (q.y - c[1]) / t2 * -1), er = 31 + up * up * (O[b].n.length > 11 && O[b].n.includes(" ") ? 30 : 17), ex = q.x + (c[0] - q.x) / t2 * er, ey = q.y + (c[1] - q.y) / t2 * er;
  return `M${sx.toFixed(1)} ${sy.toFixed(1)}Q${c[0].toFixed(1)} ${c[1].toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`;
}
/* o: links – kuriuos ryšius piešti; sel – pasirinktas; marks {id: "x"|"up"|"dn"}; hot – paryškinti organizmai */
function webSvg(sw, o){
  lay(sw); o = o || {}; const ln = o.links || sw.links, mk = o.marks || {};
  let s = `<svg viewBox="0 0 ${sw.W} ${sw.H}" role="img"><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#3d6b4f"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#e0902a"/></marker></defs>`;
  ln.forEach(l => { const late = o.late && o.late.has(l[0] + ">" + l[1]); s += `<path class="lnk" d="${arrow(sw, l[0], l[1])}" fill="none" stroke="${late ? "#e0902a" : "#3d6b4f"}" stroke-width="2.6" stroke-linecap="round" marker-end="url(#${late ? "ahr" : "ah"})"/>`; });
  sw.nodes.forEach(n => { const p = sw.pos[n], m = mk[n], w = O[n].n.split(" "), two = w.length > 1 && O[n].n.length > 11;
    s += `<g class="nd" data-id="${n}" ${o.live ? 'tabindex="0" role="button"' : ""} aria-label="${O[n].n}"><circle cx="${p.x}" cy="${p.y}" r="24" fill="${m === "x" ? "#e9e4d6" : o.sel === n ? "#dbe6ff" : "#fff"}" stroke="${o.sel === n ? "#2f6bff" : o.hot && o.hot.includes(n) ? "#e0902a" : K}" stroke-width="${o.sel === n || (o.hot && o.hot.includes(n)) ? 4 : 2.5}"/>
      <g transform="translate(${p.x - 20} ${p.y - 20}) scale(.625)" ${m === "x" ? 'opacity=".35"' : ""}>${D.inner(n)}</g>
      <text x="${p.x}" y="${p.y + 37}" text-anchor="middle" font-size="11.5" ${FT} fill="${K}" stroke="#f4f8ee" stroke-width="4" paint-order="stroke" stroke-linejoin="round">${two ? `<tspan x="${p.x}">${w.slice(0, -1).join(" ")}</tspan><tspan x="${p.x}" dy="12">${w[w.length - 1]}</tspan>` : O[n].n}</text>`;
    if(m === "x") s += `<path d="M${p.x - 15} ${p.y - 15}l30 30M${p.x + 15} ${p.y - 15}l-30 30" stroke="#d3382c" stroke-width="5" stroke-linecap="round"/>`;
    if(m === "up" || m === "dn") s += `<g transform="translate(${p.x + 19} ${p.y - 19})"><circle r="11" fill="${m === "up" ? "#2fb36b" : "#ff6b4a"}" ${S}/><path d="${m === "up" ? "M0 6V-5M-5 0l5-6l5 6" : "M0-6V5M-5 0l5 6l5-6"}" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>`;
    s += `</g>`; });
  return s + `</svg>`;
}
function pyrSvg(vals){

const EFFECT = { gone: { prey: "upE", pred: "dnF", comp: "upF", down2: "dnE", up2: "dnF" }, more: { prey: "dnE", pred: "upF", comp: "dnF", down2: "upE", up2: "upF" } };

    opts: ["upE", "upF", "dnF", "dnE"].map(o => T.wOpt[o]), ans: T.wOpt[eff], why: T.wWhy[k][c.type](O[c.X], O[c.Y], c.Z ? O[c.Z] : null) + T.wTail, orgs: sw.nodes, rel: c };

const LV = [
  () => [mkOrder(4), mkCon(0), mkMissing(), mkOrder(4), mkRight(), mkMissing(), mkOrder(4), mkOrder(5)],

/* ================= meniu ir kolekcija ================= */

  const a = atlas(), n = a.size, all = ALLIDS.length, rank = T.ranks[n >= all ? 3 : n >= 45 ? 2 : n >= 18 ? 1 : 0], seen = new Set();

function showMenu(){

}

/* ================= žaidimas ================= */

function start(i){

function close(ok, p, first, head){

function note(cls, s){ const n = $("note"); if(n){ n.className = "note " + (cls || ""); n.innerHTML = s; } }
const head = () => (cur.eco ? `<span class="eco">${T.ecoTag(cur.eco)}</span>` : "") + `<p class="txt">${cur.text}</p>`;
function show(){
  cur = tasks[ti]; dots.cur(ti); tries = 0; locked = false; window.scrollTo({ top: 0 });
  ({ choice: showChoice, order: showOrder, sort: showSort, net: showNet })[cur.kind]();
}
/* ---------- pasirinkimas ---------- */
function showChoice(){
  stage.innerHTML = `<div class="card fade">${head()}${cur.pre || ""}${cur.web ? `<div class="web" id="web">${webSvg(cur.web, { marks: cur.marks0, hot: cur.hot && cur.marks0 ? cur.hot : null, late: cur.late })}</div>` : ""}
    <div class="ans${cur.one ? " one" : ""}" id="ans">${cur.opts.map((o, i) => `<button type="button" class="a${o.indexOf("<svg") === 0 ? " tko" : ""}" data-i="${i}">${o}</button>`).join("")}</div>
    <p class="note" id="note" role="status" aria-live="polite"></p></div><div id="flow"></div>`;
  $("ans").onclick = e => {
    const b = e.target.closest(".a"); if(!b || locked || b.disabled) return;
    const ok = cur.opts[+b.dataset.i] === cur.ans;

    [...$("ans").children].forEach(x => { x.disabled = true; if(cur.opts[+x.dataset.i] === cur.ans) x.classList.add("ok"); });
    note("", ""); if(cur.web && (cur.marks || cur.hot)) $("web").innerHTML = webSvg(cur.web, { marks: cur.marks, hot: cur.hot, late: cur.late });

}
/* ---------- grandinės dėliojimas ---------- */
function showOrder(){
  st = { slots: cur.path.map(() => null), bad: [] };
  stage.innerHTML = `<div class="card fade">${head()}<div class="slots" id="slots"></div><div class="tray" id="tray"></div>
    <p class="note" id="note" role="status" aria-live="polite">${T.ordHint}</p><button type="button" class="mk-btn go" id="chk" disabled>${T.check}</button></div><div id="flow"></div>`;
  const draw = () => {
    $("slots").innerHTML = st.slots.map((id, i) => (i ? `<i class="ar${st.bad.includes(i) ? " err" : ""}">→</i>` : "") + `<button type="button" class="slot" data-i="${i}" aria-label="${i + 1}">${id ? `<span class="ti">${D.icon(id, 40)}</span><small>${lab(id)}</small>` : `<span class="ti empty">${i + 1}</span><small>&nbsp;</small>`}</button>`).join("");

/* ---------- skirstymas į grupes ---------- */

  stage.innerHTML = `<div class="card fade">${head()}<div class="grid6" id="grid"></div><div class="bins" id="bins">${GRP.map(g => `<button type="button" class="bin g${g}" data-g="${g}">${T.GRD[g]}</button>`).join("")}</div>

/* ---------- mitybos tinklo jungimas ---------- */
function showNet(){
  const sw = cur.sw, total = sw.links.length; st = { found: [], sel: null, errs: 0 };
  stage.innerHTML = `<div class="card fade">${head()}<div class="web live" id="web"></div><p class="note" id="note" role="status" aria-live="polite">${T.netHint}</p>
    <div class="row"><span class="chip" id="cnt"></span><span class="chip" id="err"></span><button type="button" class="mk-btn alt" id="give" hidden>${T.giveUp}</button></div></div><div id="flow"></div>`;

      return draw(); }
    let msg = null;
    if(D.isG(e)) msg = T.netG(O[e].d); else if(cur.g.has(e, f)) msg = T.netRev(O[f].d, eatP(f, e));

    $("web").innerHTML = webSvg(sw, { links: st.found, late }); $("give").hidden = true; note("", ""); close(false, 0, false); };
  draw();
}
function finish(){
  const n = tasks.length, stars = MK.starsFor(okN, n); MK.best(GAME, LEVELS[L].id, stars);
