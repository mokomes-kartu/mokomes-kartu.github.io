<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spalvų dirbtuvės – MokomėsKartu.lt</title>
<meta name="description" content="1–3 klasių dailės žaidimas: maišyk dažus, pažink šiltas ir šaltas spalvas, šviesink ir tamsink, nutapyk paveikslus savo galerijai.">
<meta name="theme-color" content="#fff9e6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff5fae'/%3E%3Cpath d='M32 10C18 10 8 19 8 31s10 21 23 21c5 0 6-4 4-7s0-7 5-7h6c6 0 10-4 10-10 0-11-11-18-24-18z' fill='%23f3c98b' stroke='%23121a33' stroke-width='2.5'/%3E%3Ccircle cx='21' cy='26' r='4.5' fill='%23e5243b'/%3E%3Ccircle cx='32' cy='20' r='4.5' fill='%23ffd21a'/%3E%3Ccircle cx='44' cy='25' r='4.5' fill='%232f6bff'/%3E%3Ccircle cx='19' cy='38' r='4.5' fill='%233fae4a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800&family=Manrope:wght@600;700;800&display=swap">
<script src="/bendra/mk.js"></script>
<script src="/spalvu-dirbtuves/tekstai.lt.js"></script>
<style>
/* Meniu: dirbtuvių scena su dailininku, galerijos kortelė ir lygiai.
   Žaidimas: viršuje 8 dažų dėmelės (pažanga), po jomis – dirbtuvės: dailininkas ir molbertas su daiktu ar paveikslu.
   Apačioje – dažų tūbelės ir paletė, kurioje maišosi spalva (2 lygyje – du dideli mygtukai „Šilta“ ir „Šalta“). */
body{--ac:#e0478f;--ac-ink:#fff;--ac-soft:#ffe0ee}
.zl{font:800 15px var(--kid);fill:#121a33}

/* ---------- meniu ---------- */
.mk-hero{padding-top:0}
#heroArt{width:min(100%,52vh)}
.mk-hero h1{margin-top:8px}
.mk-hero p{max-width:32ch;font-size:17px}
.goal{width:100%;max-width:520px;margin:0 auto 14px;padding:12px 14px;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 2.5px var(--ink),0 5px 0 rgba(18,26,51,.14);
  display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;align-items:center}
.goal-who{width:54px;height:54px;border-radius:50%;background:var(--ac-soft);box-shadow:inset 0 0 0 2.5px var(--ink);display:grid;place-items:center}
.goal-who svg{width:34px;height:34px;display:block}
.goal p{margin:0 0 6px;font:800 16.5px/1.25 var(--kid)}
.goal-bar{height:14px;border-radius:999px;background:#eadfba;overflow:hidden;box-shadow:inset 0 0 0 2px var(--ink)}
.goal-bar i{display:block;height:100%;background:var(--ac);border-radius:999px 0 0 999px}
.goal .mk-btn{grid-column:1/-1;min-height:48px;font-size:18px}
.la svg{width:54px;height:54px;display:block}

/* ---------- galerija ---------- */
.alb-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
.alb-head h2{margin:0;font:800 clamp(26px,7vw,36px)/1.1 var(--kid)}
.alb-head span{font:800 18px/1 var(--kid);color:var(--soft);white-space:nowrap}
.alb{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:12px}
.tile{display:grid;justify-items:center;gap:4px;padding:0;border:0;background:none;min-width:0}
button.tile{cursor:pointer}
.frame{width:100%;aspect-ratio:1;border-radius:10px;background:#fffdf6;border:7px solid #d9a441;box-shadow:0 0 0 2.5px var(--ink),inset 0 0 0 2px var(--ink),0 6px 0 rgba(18,26,51,.16);display:grid;place-items:center;overflow:hidden}
.frame svg{width:100%;height:100%;display:block}
.tile b{font:800 13.5px/1.15 var(--kid);text-align:center;overflow-wrap:anywhere}
.tile.lock .frame{border-color:#e3d8b8;box-shadow:0 0 0 2px #cdbf95,inset 0 0 0 2px #cdbf95;background:#f6f0dc}
.tile.lock svg{opacity:.22}
.tile.lock b{color:#b3a67c}
.card-art{width:180px}
.card-fact{font:700 17px/1.3 var(--body);color:var(--ink);margin:0}

/* ---------- žaidimas ---------- */
.dabs{display:flex;justify-content:center;align-items:center;gap:6px;margin:0 0 10px}
.dabs i{width:28px;height:28px;border-radius:50% 50% 50% 50%/56% 56% 44% 44%;background:#fff;box-shadow:inset 0 0 0 2px #d8c99a;transition:transform .2s}
.dabs i.cur{box-shadow:inset 0 0 0 3px var(--ink);transform:translateY(-3px)}
.dabs i.got{background:var(--c);box-shadow:inset 0 0 0 2.5px var(--ink);animation:mkPop .4s cubic-bezier(.2,1.6,.4,1)}
.dabs i.miss{background:#e6e0cf;box-shadow:inset 0 0 0 2px #b9ad8a}
@media (max-width:360px){.dabs i{width:24px;height:24px}}

.scene{position:relative;width:min(100%,50vh);margin:0 auto;aspect-ratio:360/300;border-radius:8%/9.6%;overflow:hidden;box-shadow:0 6px 0 rgba(18,26,51,.15)}
.scene > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 3px var(--ink);pointer-events:none}
.f{fill:var(--c,#fff);transition:fill .9s}
[data-r]{transition:fill .9s}
[data-r].cur{stroke-dasharray:7 5;animation:dash 1s linear infinite,blink 1.3s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
@keyframes blink{50%{fill:#ffe98a}}
.painter{transform-box:fill-box;transform-origin:50% 100%}
.painter.hop{animation:mkHop .5s cubic-bezier(.3,1.6,.5,1) 2}
.painter.shake{animation:mkShake .45s}
#think,#tip,#mineSw,#cvbg{transition:fill .5s}
.tick{transform-box:fill-box;transform-origin:center;animation:mkPop .4s cubic-bezier(.2,1.6,.4,1)}

.tools{width:min(100%,520px);margin:12px auto 0;display:grid;gap:10px}
.tubes{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.tube{display:grid;justify-items:center;gap:2px;min-height:86px;padding:8px 2px 6px;border:0;border-radius:18px;cursor:pointer;background:var(--card);
  box-shadow:inset 0 0 0 2.5px var(--ink),0 5px 0 rgba(18,26,51,.18);transition:transform .1s,opacity .2s}
.tube:active{transform:translateY(3px)}
.tube svg{width:38px;height:50px;display:block}
.tube b{font:800 clamp(12.5px,3.5vw,16px)/1.1 var(--kid);text-align:center}
.tube.used{opacity:.4}
.mixrow{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:10px;align-items:center}
.pal svg{display:block;width:100%;height:auto;max-height:118px}
#puddle{transition:fill .55s}
#puddle.wob{animation:wob .55s}
@keyframes wob{30%{transform:scale(1.12,.92)}60%{transform:scale(.95,1.06)}}
#puddle{transform-box:fill-box;transform-origin:center}
.acts{display:grid;gap:8px}
.acts .mk-btn{min-height:50px;font-size:18px;padding:8px 12px;width:100%}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.zone{display:grid;justify-items:center;gap:2px;min-height:124px;padding:10px 6px;border:0;border-radius:24px;cursor:pointer;background:var(--zb);
  box-shadow:inset 0 0 0 2.5px var(--ink),0 6px 0 rgba(18,26,51,.18);transition:transform .1s}
.zone:active{transform:translateY(3px)}
.zone svg{width:72px;height:72px;display:block}
.zone b{font:800 22px/1.1 var(--kid)}
.zone.ok{box-shadow:inset 0 0 0 5px var(--good),0 6px 0 rgba(18,26,51,.18);animation:mkPulse .6s}
.zone.no{opacity:.4;pointer-events:none}
.fly{position:fixed;left:0;top:0;width:22px;height:28px;margin:-14px 0 0 -11px;z-index:40;pointer-events:none;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;box-shadow:inset 0 0 0 2px #121a33}
.mk-guide{margin-top:12px}
.sw{display:inline-block;width:1.25em;height:1.25em;border-radius:50%;vertical-align:-.25em;box-shadow:inset 0 0 0 2px var(--ink)}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <section id="menu">
    <div class="mk-hero">
      <div class="mk-hero-art scene" id="heroArt"></div>
      <h1 id="h1"></h1>
      <p id="heroP"></p>
    </div>
    <div class="goal" id="goal"></div>
    <div id="levels"></div>
  </section>
  <section id="album" hidden>
    <div class="alb-head"><h2 id="albT"></h2><span id="albN"></span></div>
    <div class="alb" id="alb"></div>
    <div style="display:grid;margin-top:18px"><button type="button" class="mk-btn alt" id="albBack"></button></div>
  </section>
  <section id="play" hidden>
    <div class="dabs" id="dabs" role="img"></div>
    <div class="scene" id="scene"></div>
    <div class="tools" id="tools">
      <div class="tubes" id="tubes"></div>
      <div class="mixrow" id="mixrow">
        <div class="pal" id="pal"></div>
        <div class="acts"><button type="button" class="mk-btn" id="chk"></button><button type="button" class="mk-btn alt" id="rst"></button></div>
      </div>
      <div class="zones" id="zones" hidden></div>
    </div>
    <div id="guideBox"></div>
  </section>
</div>
<script>
(function(){
"use strict";
const T = window.MK_T;
const GAME = "spalvu-dirbtuves", GRADES = [1, 2, 3], ROUND = 8;
const STORE = "mk-" + GAME + "-galerija"; // nutapyti darbai (atskirai nuo žvaigždučių)
const K = "#121a33";

/* ---------- spalvos ----------
   Mišinys: { base: ["R","Y"], w: baltų lašų, k: juodų lašų }. Atspalvis imamas iš fiksuotos lentelės (kaip tikrų dažų),
   o balti ir juodi lašai jį šviesina arba tamsina. */
const HUE = { R: "#e5243b", Y: "#ffd21a", B: "#2f6bff", RY: "#ff8a1f", BY: "#3fae4a", BR: "#8a4fd6", BRY: "#8a5a36", C: "#5cc8f2" };
const TUBE = { R: HUE.R, Y: HUE.Y, B: HUE.B, W: "#ffffff", K: "#2b2f3e" };
const TW = [0, 0.45, 0.7, 0.84], TK = [0, 0.36, 0.58, 0.74];
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const lerp = (a, b, t) => { const x = hex(a), y = hex(b); return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, "0")).join(""); };
const bkey = m => m.base.slice().sort().join("");
const mkey = m => bkey(m) + "|" + m.w + "|" + m.k;
const mk = (b, w, k) => ({ base: b.split(""), w: w || 0, k: k || 0 });
function colorOf(m){
  let c = HUE[bkey(m)];
  if(!c){ if(!m.w && !m.k) return null; c = m.w ? "#ffffff" : "#2b2f3e"; if(m.w && m.k) return lerp("#ffffff", "#2b2f3e", Math.min(0.8, 0.3 * m.k / m.w + 0.2)); return c; }
  c = lerp(c, "#ffffff", TW[Math.min(3, m.w)]);
  return lerp(c, "#1b1e2b", TK[Math.min(3, m.k)]);
}
const partsOf = m => m.base.map(b => T.color[b]).concat(m.w ? [m.w > 1 ? T.times(m.w, T.color.W) : T.color.W] : [], m.k ? [m.k > 1 ? T.times(m.k, T.color.K) : T.color.K] : []);

/* ---------- piešiniai ---------- */
const O = `stroke="${K}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
const LEAF = (d) => `<path d="${d}" fill="#58c45a" ${O}/>`;
/* daiktai: langelis 100×100; dažoma dalis turi klasę „f“ (spalva iš --c) */
const THINGS = {
  apelsinas: { c: "RY", art: `<circle class="f" cx="50" cy="56" r="32" ${O}/>${LEAF("M50 24q4-16 20-14q-2 14-20 14z")}<path d="M50 24v6" ${O} fill="none"/><path d="M36 44q4-8 12-10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".7"/>` },
  morka: { c: "RY", art: `${LEAF("M62 30q-4-16 6-22q4 10 0 22z")}${LEAF("M66 32q10-14 22-10q-6 12-20 14z")}<path class="f" d="M58 26q12 0 16 10q4 8-4 14L30 90q-8 4-12-2q-4-6 0-12L46 34q4-8 12-8z" ${O}/><path d="M48 46l8 5M40 58l8 5M32 70l7 4" fill="none" stroke="${K}" stroke-width="2.4" stroke-linecap="round" opacity=".45"/>` },
  moliugas: { c: "RY", art: `<path d="M48 30q-2-12 8-16l4 5q-6 3-4 11z" fill="#58c45a" ${O}/><ellipse class="f" cx="28" cy="60" rx="18" ry="24" ${O}/><ellipse class="f" cx="72" cy="60" rx="18" ry="24" ${O}/><ellipse class="f" cx="50" cy="60" rx="20" ry="28" ${O}/>` },
  zuvele: { c: "RY", art: `<path class="f" d="M70 52l22-18v36z" ${O}/><path class="f" d="M36 34q10-14 24-8l-6 10z" ${O}/><ellipse class="f" cx="44" cy="52" rx="32" ry="20" ${O}/><path d="M52 44q8 8 0 18" fill="none" stroke="${K}" stroke-width="2.4" stroke-linecap="round" opacity=".5"/><circle cx="26" cy="47" r="6" fill="#fff" stroke="${K}" stroke-width="2"/><circle cx="25" cy="47" r="2.6" fill="${K}"/><path d="M18 60q5 4 10 0" fill="none" stroke="${K}" stroke-width="2.2" stroke-linecap="round"/>` },
  lapas: { c: "BY", art: `<path d="M50 78v16" fill="none" ${O}/><path class="f" d="M50 8q36 24 24 54q-8 18-24 20q-16-2-24-20Q14 32 50 8z" ${O}/><path d="M50 22v54M50 40l14-10M50 40L36 30M50 56l16-10M50 56L34 46" fill="none" stroke="${K}" stroke-width="2.2" stroke-linecap="round" opacity=".5"/>` },
  varle: { c: "BY", art: `<ellipse class="f" cx="22" cy="84" rx="16" ry="7" ${O}/><ellipse class="f" cx="78" cy="84" rx="16" ry="7" ${O}/><ellipse class="f" cx="50" cy="60" rx="34" ry="28" ${O}/><circle class="f" cx="32" cy="30" r="14" ${O}/><circle class="f" cx="68" cy="30" r="14" ${O}/><circle cx="32" cy="29" r="8.5" fill="#fff" stroke="${K}" stroke-width="2"/><circle cx="68" cy="29" r="8.5" fill="#fff" stroke="${K}" stroke-width="2"/><circle cx="33.5" cy="30" r="4" fill="${K}"/><circle cx="66.5" cy="30" r="4" fill="${K}"/><path d="M36 58q14 10 28 0" fill="none" stroke="${K}" stroke-width="3" stroke-linecap="round"/>` },
  agurkas: { c: "BY", art: `<g transform="rotate(38 50 50)"><rect class="f" x="35" y="8" width="30" height="84" rx="15" ${O}/><path d="M43 24v2M56 34v2M45 48v2M57 58v2M44 70v2M55 78v2" stroke="${K}" stroke-width="3.4" stroke-linecap="round" opacity=".45"/></g>` },
  slyva: { c: "BR", art: `<path d="M50 26q0-10 8-16" fill="none" ${O}/>${LEAF("M56 14q12-10 24-2q-10 10-24 2z")}<ellipse class="f" cx="50" cy="58" rx="28" ry="32" ${O}/><path d="M50 28q-10 26 0 60" fill="none" stroke="${K}" stroke-width="2.4" stroke-linecap="round" opacity=".45"/><path d="M34 44q2-8 8-12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/>` },
  vynuoges: { c: "BR", art: `<path d="M50 24V8" fill="none" ${O}/>${LEAF("M52 14q14-12 28-2q-12 12-28 2z")}${[[30, 34], [50, 34], [70, 34], [40, 50], [60, 50], [30, 66], [50, 66], [70, 66], [40, 80], [60, 80]].map(([x, y]) => `<circle class="f" cx="${x}" cy="${y}" r="11" ${O}/>`).join("")}` },
  baklazanas: { c: "BR", art: `<path class="f" d="M64 28q16 12 10 34q-8 28-32 30q-18 0-20-16q-2-14 12-24q14-10 18-22z" ${O}/><path d="M52 30q10-10 22-2q-2 8-10 6q-6 6-12-4z" fill="#58c45a" ${O}/><path d="M68 26q4-10 12-12" fill="none" stroke="#58c45a" stroke-width="6" stroke-linecap="round"/><path d="M34 62q2-10 10-16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".55"/>` }
};
const TID = Object.keys(THINGS);
/* paveikslai: langelis 200×170; sritys žymimos data-r (eilės tvarka kaip tekstų faile) */
const R = (i, tag, attrs) => `<${tag} data-r="${i}" fill="#fff" ${attrs} ${O}/>`;
const PICS = {
  namelis: { need: [mk("B", 1), mk("BY"), mk("Y"), mk("R")], art:
    R(0, "rect", 'x="-4" y="-4" width="208" height="120"') + `<g fill="#fff" stroke="${K}" stroke-width="2"><ellipse cx="44" cy="30" rx="22" ry="9"/><ellipse cx="160" cy="46" rx="18" ry="7"/></g>`
    + R(1, "path", 'd="M-4 112q54-16 104-4t104-6v76H-4z"') + R(2, "rect", 'x="62" y="72" width="80" height="62"') + R(3, "path", 'd="M50 74l52-42 52 42z"')
    + `<rect x="74" y="98" width="22" height="36" fill="#b97a45" ${O}/><circle cx="91" cy="117" r="2.2" fill="${K}"/><rect x="108" y="88" width="24" height="22" fill="#cfeeff" ${O}/><path d="M120 88v22M108 99h24" stroke="${K}" stroke-width="2"/>` },
  laivas: { need: [mk("B", 0, 1), mk("R"), mk("Y"), mk("RY")], art:
    `<rect x="-4" y="-4" width="208" height="130" fill="#eaf6ff"/>` + R(3, "circle", 'cx="160" cy="36" r="20"') + R(0, "path", 'd="M-4 118q26-10 52 0t52 0t52 0t52 0v60H-4z"')
    + `<path d="M96 22v78" fill="none" ${O}/>` + R(2, "path", 'd="M102 24l50 68h-50z"') + `<path d="M90 34L56 92h34z" fill="#fff" ${O}/>` + R(1, "path", 'd="M40 100h124l-18 30H58z"')
    + `<path d="M12 148q8-6 16 0t16 0M150 152q8-6 16 0t16 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/>` },
  gele: { need: [mk("BR"), mk("BY"), mk("R", 1), mk("Y")], art:
    `<rect x="-4" y="-4" width="208" height="178" fill="#fff8e8"/><path d="M-4 142h208v32H-4z" fill="#e9c9a0" ${O}/><path d="M100 70v56" fill="none" stroke="${K}" stroke-width="9" stroke-linecap="round"/>`
    + `<g>${R(1, "path", 'd="M100 108q-30-4-38-26q28-2 38 26z"')}${R(1, "path", 'd="M100 100q28-6 34-28q-28 0-34 28z"')}</g>`
    + R(0, "path", 'd="M74 112h52q8 22-6 44H80q-14-22-6-44z"')
    + [0, 60, 120, 180, 240, 300].map(a => R(2, "ellipse", `cx="100" cy="24" rx="12" ry="19" transform="rotate(${a} 100 48)"`)).join("") + R(3, "circle", 'cx="100" cy="48" r="13"') }
};
const PID = Object.keys(PICS);
const TOTAL = TID.length + PID.length;
const thingSvg = (id, col) => `<svg viewBox="0 0 100 100" aria-hidden="true"${col ? ` style="--c:${col}"` : ""}>${THINGS[id].art}</svg>`;
function picArt(id, done){ // done – kiek sričių jau nudažyta (iš eilės)
  const box = document.createElement("div"); box.innerHTML = `<svg viewBox="0 0 200 170">${PICS[id].art}</svg>`;
  box.querySelectorAll("[data-r]").forEach(e => { const i = +e.dataset.r; if(i < done) e.setAttribute("fill", colorOf(PICS[id].need[i])); });
  return box.firstChild.innerHTML;
}
const picSvg = (id, done) => `<svg viewBox="0 0 200 170" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${picArt(id, done)}</svg>`;
const SHAPES = [
  c => `<path d="M50 14q20-2 28 14q14 2 12 18q10 14-4 24q0 16-18 14q-10 12-24 2q-16 4-20-12q-14-8-6-24q-2-16 14-20q6-14 18-16z" fill="${c}" ${O}/><circle cx="16" cy="18" r="6" fill="${c}" ${O}/><circle cx="88" cy="84" r="5" fill="${c}" ${O}/><path d="M34 36q6-10 16-10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/>`,
  c => `<path d="M50 76q4 10-4 20" fill="none" ${O}/><ellipse cx="50" cy="42" rx="28" ry="34" fill="${c}" ${O}/><path d="M44 76h12l-6-8z" fill="${c}" ${O}/><path d="M34 30q4-10 12-12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/>`,
  c => `<path d="M22 38h56l-6 52H28z" fill="#e9edf3" ${O}/><path d="M18 30h64v10H18z" fill="${c}" ${O}/><path d="M30 40q0 22 8 22t6-22M58 40q0 14 6 14t6-14" fill="${c}" ${O}/><path d="M26 30q24-26 48 0" fill="none" ${O}/>`
];

/* ---------- užduočių sąrašai ---------- */
function makeList(id){
  if(id === "maisymas"){ // dažniau siūlomi dar nenudažyti daiktai
    const fresh = MK.shuffle(TID.filter(t => !got.has(t))), old = MK.shuffle(TID.filter(t => got.has(t)));
    return MK.shuffle(fresh.concat(old).slice(0, ROUND)).map(t => ({ kind: "mix", thing: t, need: mk(THINGS[t].c) }));
  }
  if(id === "siltos"){
    const cols = Object.keys(WARM), list = MK.shuffle(cols).concat(MK.shuffle(cols).slice(0, ROUND - cols.length));
    return list.map((c, i) => ({ kind: "warm", color: c, shape: i % SHAPES.length }));
  }
  if(id === "tonai"){
    const bases = ["R", "B", "BY", "RY", "BR"], pool = n => MK.shuffle(bases.flatMap(b => [mk(b, n), mk(b, 0, n)]).concat(n === 1 ? [mk("Y", 1)] : []));
    const pickBal = n => { const p = pool(n), w = p.filter(m => m.w).slice(0, 2), k = p.filter(m => m.k).slice(0, 2); return MK.shuffle(w.concat(k)); };
    return pickBal(1).concat(pickBal(2)).map(m => ({ kind: "tone", need: m, start: mk(bkey(m)) }));
  }
  return MK.shuffle(PID.slice().sort((a, b) => got.has(a) - got.has(b)).slice(0, 2)).flatMap(p => PICS[p].need.map((m, ri) => ({ kind: "pic", pic: p, ri, need: m })));
}

/* ---------- žaidimo eiga ---------- */
let lvl = 0, L = null, list = [], ti = 0, cur = null, tries = 0, firstOK = 0, newCount = 0, busy = false, marks = [], mix = mk(""), picFirst = 0;
const clone = m => ({ base: m.base.slice(), w: m.w, k: m.k });
function drawDabs(){
  dabsEl.setAttribute("aria-label", T.dabsLabel(marks.filter(Boolean).length, ROUND));
  dabsEl.innerHTML = Array.from({ length: ROUND }, (_, k) => `<i class="${marks[k] || (k === ti ? "cur" : "")}" style="--c:${DABS[k]}"></i>`).join("");

}
function start(i){

  $("heroArt").innerHTML = ""; // scenos elementų id turi būti vieninteliai
  show(play); next();
}
function setTools(kind){

  if(kind === "warm") zonesEl.innerHTML = `<button type="button" class="zone" data-z="1" style="--zb:#ffe9c2">${SUN}<b>${T.warm}</b></button><button type="button" class="zone" data-z="0" style="--zb:#dff1ff">${SNOW}<b>${T.cold}</b></button>`;
}
function next(){
  if(ti >= ROUND) return finish();
  cur = list[ti]; tries = 0; busy = false; drawDabs();
  const k = cur.kind;
  setTools(k);
  if(k === "mix"){
    mix = mk("");
    scene.innerHTML = sceneSvg({ cv: THINGS[cur.thing].art, think: colorOf(cur.need) });
    MK.say(guide, T.askMix(T.things[cur.thing][1], T.colorWith[bkey(cur.need)]));
  } else if(k === "warm"){
    const c = HUE[cur.color];
    scene.innerHTML = sceneSvg({ cv: SHAPES[cur.shape](c), tip: c });
    MK.say(guide, T.askWarm(T.color[cur.color][0].toUpperCase() + T.color[cur.color].slice(1)));
  } else if(k === "tone"){
    mix = clone(cur.start);
    const sw = (y, id, col) => `<rect ${id ? `id="${id}"` : ""} x="26" y="${y}" width="148" height="46" rx="14" fill="${col}" ${O}/>`;
    scene.innerHTML = sceneSvg({ vb: "0 0 200 170", tip: colorOf(cur.start), cv: `<text class="zl" x="100" y="20" text-anchor="middle">${T.sample}</text>${sw(28, "", colorOf(cur.need))}
      <text class="zl" x="100" y="102" text-anchor="middle">${T.mine}</text>${sw(110, "mineSw", colorOf(mix))}` });
    MK.say(guide, T.askTone);
  } else {
    mix = mk("");
    scene.innerHTML = sceneSvg({ vb: "0 0 200 170", slice: true, cv: picArt(cur.pic, cur.ri), think: colorOf(cur.need) });

function hop(mood){ const p = $("painter"); if(!p) return; p.classList.remove("hop", "shake"); void p.getBoundingClientRect(); p.classList.add(mood === "bad" ? "shake" : "hop"); }
/* Lašas nuskrenda iš tūbelės į paletę. */
async function fly(btn, id){
  const a = btn.querySelector("svg").getBoundingClientRect(), b = $("puddle").getBoundingClientRect();
  const f = document.createElement("i"); f.className = "fly"; f.style.background = TUBE[id]; document.body.appendChild(f);
  const x1 = a.left + a.width / 2, y1 = a.top + 6, x2 = b.left + b.width / 2, y2 = b.top + b.height / 2;
  await f.animate([{ transform: `translate(${x1}px,${y1}px) scale(.6)` }, { transform: `translate(${(x1 + x2) / 2}px,${Math.min(y1, y2) - 30}px) scale(1.1)`, offset: 0.45 },
    { transform: `translate(${x2}px,${y2}px) scale(.8)` }], { duration: 380, easing: "ease-in" }).finished.catch(() => {});
  f.remove();
}
async function drop(btn){
  if(!btn || busy) return; MK.unlock();
  const id = btn.dataset.id, isBase = "RYB".includes(id);
  if(isBase && (mix.base.includes(id) || (cur.kind === "mix" && mix.base.length >= 2))) return;
  if(!isBase && (id === "W" ? mix.w : mix.k) >= 3) return;
  busy = true; MK.sfx.tap();
  await fly(btn, id);
  if(isBase) mix.base.push(id); else if(id === "W") mix.w++; else mix.k++;
  drawMix(true); MK.sfx.hop(mix.base.length + mix.w + mix.k);
  busy = false;
  if(cur.kind === "mix" && mix.base.length === 2){ busy = true; await MK.wait(650); busy = false; check(); }
}
function resetMix(){ mix = cur.kind === "tone" ? clone(cur.start) : mk(""); drawMix(); }
async function check(){
  if(busy) return;

  if(cur.kind !== "tone" && !colorOf(mix)){ MK.say(guide, T.empty, "bad"); return; }
  if(cur.kind === "tone" && mkey(mix) === mkey(cur.start)){ MK.say(guide, T.empty, "bad"); return; }
  busy = true; tries++; MK.sfx.bad(); hop("bad");
  if(tries >= 2){
    await MK.wait(500); mix = clone(cur.need); drawMix(true); busy = false; return right(true);
  }
  const s = mix.w - mix.k, t = cur.need.w - cur.need.k;
  MK.say(guide, cur.kind === "mix" ? T.got(T.color[bkey(mix)]) : cur.kind === "tone" ? (s > t ? T.tooLight : s < t ? T.tooDark : T.needMore) : T.wrongPic, "bad");
  await MK.wait(1100); resetMix(); busy = false;
}
function factOf(){
  const n = cur.need;
  if(cur.kind === "warm") return T.warmFact[cur.color];
  if(cur.kind === "tone") return n.w ? T.lighter : T.darker;
  return T.mixFact[bkey(n)] ? T.mixFact[bkey(n)] + (n.w ? " " + T.lighter : n.k ? " " + T.darker : "") : n.w ? T.lighter : n.k ? T.darker : "";
}
function addGallery(id){ if(got.has(id)) return false; got.add(id); save.got = [...got]; MK.set(STORE, save); newCount++; return true; }
async function right(auto, btn){
  busy = true;
  const first = tries === 0 && !auto, k = cur.kind, col = k === "warm" ? HUE[cur.color] : colorOf(cur.need);
  if(first) firstOK++;
  marks[ti] = first ? "got" : "miss";
  MK.sfx.good();
  let fresh = false, extra = "";
  if(k === "mix"){
    $("cv").style.setProperty("--c", col); $("tip").style.fill = col;
    if(first) fresh = addGallery(cur.thing);
  } else if(k === "warm"){
    btn.classList.add("ok"); $("cvbg").style.fill = WARM[cur.color] ? "#ffe9c2" : "#dff1ff";
  } else if(k === "tone"){
    $("tip").style.fill = col;
    $("cv").insertAdjacentHTML("beforeend", `<g class="tick"><circle cx="172" cy="132" r="15" fill="#2fb36b" stroke="${K}" stroke-width="2.6"/><path d="M164 132l6 6 10-12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>`);
  } else {
    scene.querySelectorAll(`[data-r="${cur.ri}"]`).forEach(e => { e.classList.remove("cur"); e.style.fill = col; }); $("tip").style.fill = col;
    if(first) picFirst++;
    if(cur.ri === PICS[cur.pic].need.length - 1){ extra = " " + T.picDone(T.pictures[cur.pic].name); if(picFirst >= 3) fresh = addGallery(cur.pic); picFirst = 0; }
  }
  hop();
  const lead = auto ? `${T.look} ${MK.esc(T.recipe(partsOf(cur.need)))}` : MK.praise();
  MK.say(guide, `${lead} ${MK.esc(factOf())}${MK.esc(extra)}${fresh ? " " + T.newInGallery : ""}`, auto ? "bad" : undefined);
  if(fresh) MK.sfx.coins();
  drawDabs();
  await MK.wait(auto ? 2600 : extra || fresh ? 2300 : 1700);
  ti++; next();
}
function zone(btn){
  if(!btn || busy) return; MK.unlock();
  if(+btn.dataset.z === WARM[cur.color]) return right(false, btn);
  tries++; btn.classList.add("no"); MK.sfx.bad(); hop("bad");
  MK.say(guide, T.again, "bad");
}
tubesEl.addEventListener("click", e => drop(e.target.closest(".tube")));
zonesEl.addEventListener("click", e => zone(e.target.closest(".zone")));
$("chk").addEventListener("click", () => { MK.unlock(); check(); });
$("rst").addEventListener("click", () => { if(busy) return; MK.unlock(); MK.sfx.whoosh(); resetMix(); });
async function finish(){
  busy = true;
  MK.say(guide, T.done);
  await MK.wait(1600);
  const stars = MK.starsFor(firstOK, ROUND); MK.best(GAME, L.id, stars);
  MK.result({ stars, text: T.result(firstOK, ROUND) + "<br>" + (newCount ? T.resNew(newCount) : T.resGallery(got.size, TOTAL)),
    next: lvl < LEVELS.length - 1 ? () => start(lvl + 1) : null, again: () => start(lvl), menu: showMenu });
}
showMenu();
})();
</script>
