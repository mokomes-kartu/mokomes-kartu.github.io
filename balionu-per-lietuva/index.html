<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MokomėsKartu">
<link rel="apple-touch-icon" href="/logo/mk-ikona-180.png">
<title>Balionu per Lietuvą – MokomėsKartu.lt</title>
<meta name="description" content="Visuomeninio ugdymo žaidimas 2–4 klasei: skrisk oro balionu virš tikslaus Lietuvos žemėlapio ir nunešk atvirutes į miestus, prie upių ir ežerų, pas kaimynus ir į etnografinius regionus.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#bfe6ff">
<link rel="icon" href="/logo/mk-ikona.svg">
<script src="/bendra/mk.js"></script>
<script src="tekstai.lt.js"></script>
<script src="karta.js"></script>
<script src="vietos.js"></script>
<style>
body{--ink:#1b2340;--soft:#5a6285;background:linear-gradient(#bfe6ff,#e9f7ff 46%,#fff8e6) fixed;background-size:auto;color:var(--ink)}
.mk-app{max-width:760px}
.hero{position:relative;height:190px;border-radius:26px;overflow:hidden;border:3px solid var(--ink);background:linear-gradient(#7cc8ff,#d6f0ff);box-shadow:0 6px 0 rgba(27,35,64,.18);margin-bottom:12px}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero .bal{animation:bob 4s ease-in-out infinite;transform-origin:50% 50%}
.hero .cl1{animation:drift 26s linear infinite}.hero .cl2{animation:drift 38s linear infinite -14s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(620px)}}
h1{margin:4px 0 4px;font:900 clamp(30px,8.4vw,44px)/1.02 var(--kid);letter-spacing:-.01em}
.lead{margin:0 0 14px;font:600 16px/1.45 var(--body);color:#2b345a;max-width:60ch}
h2{margin:20px 0 8px;font:900 20px/1.2 var(--kid)}
.fl{display:grid;gap:10px}
.fc{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;padding:10px 12px;border:3px solid var(--ink);border-radius:20px;background:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(27,35,64,.18);transition:transform .08s}
.fc:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(27,35,64,.18)}
.fc .ic{width:58px;height:58px;border-radius:16px;border:3px solid var(--ink);display:grid;place-items:center}
.fc .ic svg{width:38px;height:38px}
.fc b{display:block;font:900 19px/1.15 var(--kid)}.fc span.s{display:block;font:600 13.5px/1.3 var(--body);color:var(--soft)}
.fc .g{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;background:#eef2ff;border:2px solid var(--ink);font:800 11px/1.5 var(--body);vertical-align:2px}
.free{margin-top:10px;background:#fff7d6}
.bar{height:16px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd23f,#ff8a3d)}
.alb{display:flex;flex-wrap:wrap;gap:6px}
.ac{padding:4px 9px;border-radius:11px;border:2px dashed #b9c0da;color:#9aa2c0;font:700 12.5px/1.4 var(--body);background:rgba(255,255,255,.5)}
.ac.on{border:2px solid var(--ink);color:var(--ink);background:#fff}.ac.gold{background:#ffe680}
details.lr{border:3px solid var(--ink);border-radius:16px;background:#fff;margin-bottom:8px}
details.lr summary{padding:10px 12px;font:800 16px/1.2 var(--kid);cursor:pointer}
details.lr p{margin:0 12px 10px;font:500 15px/1.5 var(--body)}
/* žaidimo ekranas */
#game{position:fixed;inset:0;z-index:40;background:#bfe6ff;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.hudTop{position:absolute;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;gap:8px;align-items:flex-start;pointer-events:none}
#card{pointer-events:auto;flex:1;min-width:0;max-width:440px;display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;align-items:center;padding:9px 10px;border:3px solid var(--ink);border-radius:18px;background:#fffdf3;box-shadow:0 5px 0 rgba(27,35,64,.2);transform-origin:20% 0}
#card.pop{animation:cardpop .45s cubic-bezier(.3,1.6,.5,1)}
#card.ok{background:#e4fbdc}
@keyframes cardpop{from{transform:scale(.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
#cIc{width:54px;height:54px;border-radius:13px;border:3px solid var(--ink);display:grid;place-items:center;background:#ffe680}
#cIc svg{width:36px;height:36px}
#card small{display:block;font:800 11px/1.2 var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}
#card b{display:block;font:900 clamp(18px,5.4vw,23px)/1.1 var(--kid)}
#cFact{display:block;font:600 13.5px/1.35 var(--body);margin-top:2px}
#cRow{grid-column:1/-1;display:flex;gap:8px;align-items:center;justify-content:space-between}
#cProg{font:800 13px/1 var(--body);color:var(--soft)}
#cNext{height:40px;padding:0 18px;border:3px solid var(--ink);border-radius:13px;background:#2fbf71;color:#fff;font:900 16px/1 var(--kid);cursor:pointer;box-shadow:0 3px 0 rgba(27,35,64,.25)}
#mini{pointer-events:none;flex:none;width:96px;height:80px;border:3px solid var(--ink);border-radius:14px;background:#cfeaff;box-shadow:0 4px 0 rgba(27,35,64,.2)}
#msg{position:absolute;left:max(12px,env(safe-area-inset-left));right:150px;bottom:max(20px,env(safe-area-inset-bottom));pointer-events:none}
#msg span{display:inline-block;max-width:420px;padding:9px 13px;border-radius:16px;border:3px solid var(--ink);background:#fff;font:800 16px/1.3 var(--body);box-shadow:0 4px 0 rgba(27,35,64,.2);animation:cardpop .35s cubic-bezier(.3,1.6,.5,1)}
#msg span.bad{background:#ffe1dc}#msg span.good{background:#e4fbdc}
#arrow{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:calc(max(20px,env(safe-area-inset-bottom)) + 96px);width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.92);border:3px solid var(--ink);box-shadow:0 4px 0 rgba(27,35,64,.2);pointer-events:none}
#arrow svg{width:100%;height:100%}
.tools{position:absolute;right:max(8px,env(safe-area-inset-right));top:calc(max(8px,env(safe-area-inset-top)) + 96px);display:grid;gap:7px;justify-items:end}
.tb{min-width:46px;height:42px;padding:0 10px;border:3px solid var(--ink);border-radius:13px;background:#fff;font:800 12.5px/1 var(--body);cursor:pointer;box-shadow:0 3px 0 rgba(27,35,64,.2)}
.tb.on{background:#ffe680}
#bDrop{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:118px;height:118px;border-radius:50%;border:4px solid var(--ink);background:radial-gradient(circle at 35% 30%,#ff9d7a,#e2452f);color:#fff;font:900 18px/1.1 var(--kid);cursor:pointer;box-shadow:0 7px 0 rgba(27,35,64,.3);display:grid;place-items:center;touch-action:none}
#bDrop svg{width:44px;height:44px;display:block;margin:0 auto 2px}
#bDrop:active,#bDrop.dn{transform:translateY(4px);box-shadow:0 3px 0 rgba(27,35,64,.3)}
#bDrop[disabled]{filter:grayscale(.8);opacity:.6}
#stick{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(27,35,64,.55);background:rgba(255,255,255,.35);pointer-events:none;display:none}
#stick i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#2f80ff;border:3px solid var(--ink)}
#tip{position:absolute;left:14px;bottom:max(22px,env(safe-area-inset-bottom));max-width:calc(100% - 170px);padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.9);border:2px solid var(--ink);font:700 13.5px/1.35 var(--body);pointer-events:none}
#ov{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(27,35,64,.45)}
#ov:empty{display:none}
.rc{width:100%;max-width:420px;padding:18px 16px 14px;border:3px solid var(--ink);border-radius:24px;background:#fffdf3;box-shadow:0 8px 0 rgba(27,35,64,.3);text-align:center;animation:cardpop .45s cubic-bezier(.3,1.6,.5,1)}
.rc h3{margin:0 0 6px;font:900 27px/1.1 var(--kid)}
.rc p{margin:6px 0;font:600 15.5px/1.45 var(--body)}
.rc .st{display:flex;justify-content:center;gap:6px;margin:8px 0}.rc .st svg{width:54px;height:54px}
.rc .bt{display:grid;gap:8px;margin-top:12px}
.rc button{height:52px;border:3px solid var(--ink);border-radius:16px;background:#fff;font:900 17px/1 var(--kid);cursor:pointer;box-shadow:0 4px 0 rgba(27,35,64,.22)}
.rc button.pri{background:#2fbf71;color:#fff}
@media (min-width:800px){#mini{width:144px;height:120px}.tools{top:calc(max(8px,env(safe-area-inset-top)) + 136px)}}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <main id="menu">
    <div class="hero" aria-hidden="true">
      <svg viewBox="0 0 560 190" preserveAspectRatio="xMidYMid slice">
        <path d="M0 150q90-34 190-14t180-8 190-6v68H0z" fill="#bfe6a0"/><path d="M0 164q120-20 240-6t320-14v46H0z" fill="#9ed67f"/>
        <path d="M40 176q70-22 150-10t150-12 180 2" fill="none" stroke="#3a8fe0" stroke-width="6" stroke-linecap="round"/>
        <g class="cl1" fill="#fff"><circle cx="20" cy="50" r="16"/><circle cx="42" cy="42" r="21"/><circle cx="66" cy="52" r="15"/><rect x="18" y="50" width="50" height="16" rx="8"/></g>
        <g class="cl2" fill="#fff" opacity=".9"><circle cx="20" cy="104" r="12"/><circle cx="38" cy="98" r="16"/><circle cx="56" cy="106" r="11"/><rect x="18" y="104" width="40" height="12" rx="6"/></g>
        <g class="bal"><g transform="translate(280 78)" stroke="#1b2340" stroke-width="3" stroke-linejoin="round">
          <path d="M0-62c40 0 54 30 46 56-8 22-28 36-36 50h-20c-8-14-28-28-36-50-8-26 6-56 46-56z" fill="#ff5d5d"/>
          <path d="M0-62c-14 20-18 66-10 106M0-62c14 20 18 66 10 106" fill="none" stroke="#ffd23f" stroke-width="8"/>
          <path d="M-10 44l-4 16M10 44l4 16" stroke-width="2"/><rect x="-17" y="60" width="34" height="22" rx="5" fill="#b77a45"/>
          <rect x="20" y="62" width="30" height="20" rx="3" fill="#fff"/><path d="M20 62l15 11 15-11" fill="none" stroke-width="2"/></g></g>
      </svg>
    </div>
    <h1 id="h1"></h1><p class="lead" id="lead"></p>
    <h2 id="flT"></h2><div class="fl" id="fl"></div>
    <h2 id="albT"></h2><div id="albP"></div><div class="bar"><i id="albBar"></i></div><div class="alb" id="alb"></div>
    <h2 id="lrT"></h2><div id="lr"></div>
  </main>
</div>
<div id="game" hidden>
  <canvas id="gl"></canvas>
  <div class="hudTop">
    <div id="card"><div id="cIc"></div><div><small id="cKind"></small><b id="cName"></b><span id="cFact"></span></div><div id="cRow"><span id="cProg"></span><button id="cNext" type="button" hidden></button></div></div>
    <canvas id="mini" width="192" height="160"></canvas>
  </div>
  <div class="tools"><button class="tb" id="bExit" type="button">✕</button><button class="tb" id="bLab" type="button"></button><button class="tb" id="bZoom" type="button"></button></div>
  <div id="msg"></div><div id="arrow" hidden><svg viewBox="-32 -32 64 64"><g id="arrG"><path d="M0-26L16 2H6v22H-6V2h-10z" fill="#ffd23f" stroke="#1b2340" stroke-width="3.5" stroke-linejoin="round"/></g></svg></div>
  <div id="stick"><i></i></div>
  <div id="tip" hidden></div>
  <button id="bDrop" type="button"><span><svg viewBox="0 0 48 48"><rect x="6" y="12" width="36" height="25" rx="4" fill="#fff" stroke="#1b2340" stroke-width="3"/><path d="M6 14l18 13 18-13" fill="none" stroke="#1b2340" stroke-width="3"/></svg><span id="dropL"></span></span></button>
</div>
<div id="ov"></div>
<script type="module" src="zaidimas.js"></script>
</body>
</html>
