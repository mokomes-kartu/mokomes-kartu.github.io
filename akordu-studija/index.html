<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Akordų studija – MokomėsKartu.lt</title>
<meta name="description" content="Muzikos žaidimas 7–8 klasei: rink akordus klavišais, atpažink juos iš klausos, pritark dainoms ir sugrok 12-os taktų bliuzą su savo grupe.">
<meta name="theme-color" content="#fff9e6">
<link rel="icon" href="/logo/mk-ikona.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800&family=Manrope:wght@600;700;800&display=swap">
<script src="/bendra/mk.js"></script>
<script src="tekstai.lt.js"></script>
<script src="muzika.js"></script>
<style>
/* Akordų studija: scena su grupe, klaviatūra, taktų kortelės. */
body{--ac:#d6336c;--ac-ink:#fff;--ac-soft:#ffe0ea;--gold:#ffc61a}
.mk-ico[data-k="music"]{display:none}
.mk-hero p{max-width:42ch}
.note{max-width:520px;margin:16px auto 0;color:var(--soft);font-size:13px;text-align:center}

/* scena */
.stagebox{width:100%;max-width:520px;margin:0 auto 4px;background:#fff;border-radius:26px;padding:10px 10px 12px;box-shadow:inset 0 0 0 2.5px var(--ink),0 6px 0 rgba(18,26,51,.14)}
.stagebox svg.stage{display:block;width:100%;height:auto;border-radius:18px}
.mem{cursor:pointer}
.mem.lock{cursor:default}
.mem.lock .fig *{fill:#d9cfb4!important;stroke:#c4b997!important}
.mem.lock .lbl{fill:#a39a7e}
.mem.mute .fig{opacity:.35}
.mem .fig{transform-box:fill-box;transform-origin:50% 100%}
.playing .mem:not(.lock):not(.mute) .fig{animation:bop .5s infinite alternate ease-in-out}
.playing .mem:nth-child(even):not(.lock):not(.mute) .fig{animation-delay:.25s}
.mem.fresh .fig{animation:mkStar .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes bop{to{transform:translateY(-4px) rotate(1.5deg)}}
.stagebox .row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;margin-top:10px}
.stagebox .row p{margin:0;font:700 13.5px/1.35 var(--body);color:var(--soft);text-align:left}
.stagebox h2{margin:2px 4px 8px;font:800 19px/1.1 var(--kid);text-align:left;display:flex;justify-content:space-between;align-items:baseline}
.stagebox h2 span{font:800 15px/1 var(--body);color:var(--soft)}
.smb{min-height:44px;padding:8px 16px;font-size:16px;box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.2)}
.smb svg{width:15px;height:15px;flex:none}
.sys{max-width:520px;margin:14px auto 0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 8px;font:700 13.5px/1.2 var(--body);color:var(--soft)}
.sys button{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:7px 12px;font:800 13px/1 var(--body);cursor:pointer;min-height:36px}
.sys button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* žaidimo ekranas */
.bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;margin:0 0 8px}
.x{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;font:800 16px/1 var(--body);cursor:pointer;padding:0}
#dots{gap:5px}
#dots i{width:12px;height:12px}
.chip{font:800 15px/1 var(--kid);background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:8px 12px;white-space:nowrap}
.mk-guide{grid-template-columns:56px minmax(0,1fr)}
.mk-guide .mk-owl{width:56px;height:58px}
.mk-bubble{font:700 15.5px/1.35 var(--body);padding:9px 12px}
.mk-bubble b{font-weight:800;color:var(--ac)}
#board{margin:10px 0}

/* akordo kortelė */
.cc{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;background:#fff;border-radius:20px;padding:10px 14px;box-shadow:inset 0 0 0 2.5px var(--ink)}
.cc .big{font:800 40px/1 var(--kid);padding:8px 14px;border-radius:14px;background:var(--ac-soft);min-width:84px;text-align:center;white-space:nowrap}
.cc .big small{display:block;font:800 12px/1.2 var(--body);color:var(--soft);margin-top:4px}
.cc .ch{font:700 13px/1.3 var(--body);color:var(--soft)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;min-height:30px}
.tag{font:800 15px/1 var(--body);padding:7px 10px;border-radius:999px;background:var(--ink);color:#fff}
.tag.none{background:#f1ead6;color:var(--soft);font-weight:700;font-size:13.5px}

/* klaviatūra */
.kb{position:relative;display:flex;height:158px;margin:10px 0;padding:8px 5px 5px;background:var(--ink);border-radius:14px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.wk{flex:1;min-width:0;margin:0 1px;border:0;border-radius:0 0 8px 8px;background:#fff;display:flex;align-items:flex-end;justify-content:center;padding:0 0 7px;font:800 11px/1 var(--body);color:#9a927a;cursor:pointer}
.bk{position:absolute;top:8px;height:57%;width:6%;transform:translateX(-50%);border:0;padding:0;background:#2a3050;border-radius:0 0 6px 6px;box-shadow:inset 0 -6px 0 #121a33,0 2px 0 rgba(0,0,0,.3);cursor:pointer}
.wk.on{background:linear-gradient(#fff 45%,var(--ac) 45%);color:#fff}
.bk.on{background:var(--ac);box-shadow:inset 0 -6px 0 #a11f4d}
.wk.ok{background:linear-gradient(#fff 45%,var(--good) 45%);color:#fff}
.bk.ok{background:var(--good);box-shadow:inset 0 -6px 0 #1f8a4f}
.kb.ro .wk,.kb.ro .bk{cursor:pointer}
.kb.hit{animation:mkShake .4s}

/* variantai */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{min-height:58px;padding:8px 10px;background:#fff;border:0;border-radius:16px;box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.16);cursor:pointer;font:800 24px/1.1 var(--kid);color:var(--ink)}
.opt.txt{font:800 17px/1.2 var(--body)}
.opt.right{box-shadow:inset 0 0 0 4px var(--good);background:#effcf6}
.opt.wrongb{opacity:.4;pointer-events:none}
.done .opt{pointer-events:none}
.earbtn{display:grid;place-items:center;width:104px;height:104px;margin:4px auto 14px;border-radius:50%;border:0;background:var(--ac);color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(18,26,51,.28)}
.earbtn svg{width:50px;height:50px}
.earbtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(18,26,51,.28)}
.earbtn.ring{animation:mkPulse .6s 2}
.odd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.oddc{display:grid;gap:8px;justify-items:center;background:#fff;border-radius:18px;padding:10px 6px;box-shadow:inset 0 0 0 2.5px var(--ink)}
.oddc b{font:800 14px/1 var(--body);color:var(--soft)}
.oddc .pl{width:52px;height:52px;border-radius:50%;border:0;background:var(--ac);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 rgba(18,26,51,.25)}
.oddc .pl svg{width:20px;height:20px}
.oddc .opt{width:100%;min-height:46px;font:800 15px/1.1 var(--body)}
.oddc.now{box-shadow:inset 0 0 0 4px var(--gold)}
.oddc em{font:800 20px/1 var(--kid);font-style:normal;min-height:20px}
.warn{margin:0 0 10px;padding:9px 12px;border-radius:12px;background:#fff4f1;border:2px dashed #ff8a7a;font:700 14.5px/1.35 var(--body)}

/* taktai */
.keyl{font:800 14px/1.2 var(--body);color:var(--soft);margin:0 2px 6px}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mb{display:grid;gap:4px;padding:6px 6px 8px;background:#fff;border:0;border-radius:16px;box-shadow:inset 0 0 0 2.5px var(--ink);cursor:pointer;text-align:center;color:var(--ink);min-width:0}
.mb>i{font:800 11.5px/1 var(--body);font-style:normal;color:var(--soft);text-align:left;padding-left:4px}
.mb svg{display:block;width:100%;height:auto}
.slot{display:grid;place-items:center;min-height:40px;border-radius:10px;border:2.5px dashed #b9ad8a;font:800 23px/1 var(--kid);color:#b9ad8a}
.slot.f{border-style:solid;border-color:var(--ink);background:var(--ac-soft);color:var(--ink)}
.mb.pre{cursor:default}
.mb.pre .slot{background:#f1ead6;border-color:#b9ad8a}
.mb.act,.bb.act{box-shadow:inset 0 0 0 2.5px var(--ink),0 0 0 4px var(--ac)}
.mb.bad,.bb.bad{box-shadow:inset 0 0 0 4px var(--bad)}
.mb.good,.bb.good{box-shadow:inset 0 0 0 4px var(--good)}
.mb.now,.bb.now{background:#fff6cf}
.pal{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 4px}
.pc{min-width:70px;min-height:54px;padding:6px 10px;background:#fff;border:0;border-radius:14px;box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 rgba(18,26,51,.18);cursor:pointer;font:800 23px/1 var(--kid);color:var(--ink)}
.pc small{display:block;font:700 11.5px/1.2 var(--body);color:var(--soft);margin-top:3px;white-space:nowrap}
.pc:active{transform:translateY(3px)}
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bb{position:relative;min-height:56px;padding:12px 2px 4px;background:#fff;border:0;border-radius:12px;box-shadow:inset 0 0 0 2.5px var(--ink);cursor:pointer;font:800 21px/1 var(--kid);color:var(--ink);min-width:0}
.bb>i{position:absolute;left:6px;top:4px;font:800 10px/1 var(--body);font-style:normal;color:var(--soft)}
.bb.emp{box-shadow:inset 0 0 0 2.5px #b9ad8a;color:#b9ad8a;background:#fffdf5}
.bb.fix{cursor:default;background:#f6f0dc}
.bb.off{opacity:.45;pointer-events:none}
.done .bb,.done .mb,.done .pc{pointer-events:none}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.acts .mk-btn{min-height:50px;font-size:18px;padding:8px 12px}
.acts .mk-btn svg{width:16px;height:16px;flex:none}
.acts .full{grid-column:1/-1}
.hintb{margin:8px 0 0;padding:9px 12px;border-radius:12px;background:#fff;border:2px dashed #d7c9a8;font:600 14.5px/1.4 var(--body)}
.sumL{margin:2px 0;font-weight:700}
@media (max-width:380px){.cc .big{font-size:34px;min-width:72px;padding:8px 10px}.opt{font-size:21px}.bb{font-size:18px}.pc{font-size:21px;min-width:62px}}
</style>
</head>
<body>
<div class="mk-app" id="app">
  <section id="menu">
    <div class="mk-hero">
      <h1 id="h1"></h1>
      <p id="heroP"></p>
    </div>
    <div class="stagebox">
      <h2><em id="bandT" style="font-style:normal"></em><span id="bandS"></span></h2>
      <div id="stage"></div>
      <div class="row"><p id="bandP"></p><button type="button" class="mk-btn alt smb" id="jam"></button></div>
    </div>
    <div class="sys" id="sys"></div>
    <div id="levels" style="margin-top:16px"></div>
    <div id="learn"></div>
    <p class="note" id="note"></p>
  </section>
  <section id="play" hidden>
    <div class="bar"><button type="button" class="x" id="quit">✕</button><div id="dots"></div><div class="chip" id="pts"></div></div>
    <div id="guide"></div>
    <div id="board"></div>
    <div class="kb" id="kb" hidden></div>
    <div class="acts" id="acts"></div>
    <div id="fb"></div>
    <div class="acts"><button type="button" class="mk-btn full" id="next" hidden></button></div>
  </section>
</div>
<script>
(function(){
"use strict";
const T = window.MK_T, Z = window.MK_MUZ, GAME = "akordu-studija", SKEY = "mk-akordu-studija-si";
const $ = id => document.getElementById(id);
const LET = "CDEFGAB";
let sysH = MK.get(SKEY, "B") === "H";

/* ============================== pavadinimai ============================== */
const accS = a => a > 0 ? T.sharp : a < 0 ? T.flat : "";
const nm = n => T.sol[n.L] + accS(n.acc);
function sym(c){
  let r = LET[c.l] + accS(c.a);
  if(sysH && c.l === 6) r = c.a === 0 ? "H" : c.a < 0 ? "B" : "H" + T.sharp;
  return r + (c.q === "M" ? "" : c.q);
}
const notesOf = (c, sep) => c.notes.map(nm).join(sep || " – ");
const WHITE = [0, 2, 4, 5, 7, 9, 11];
function keyName(m, c){
  const pc = m % 12, n = c && c.notes.find(x => x.pc === pc); if(n) return nm(n);
  const w = WHITE.indexOf(pc); if(w >= 0) return T.sol[w];
  const flat = c && (c.a < 0 || c.notes.some(x => x.acc < 0));
  return flat ? T.sol[WHITE.indexOf(pc + 1)] + T.flat : T.sol[WHITE.indexOf(pc - 1)] + T.sharp;
}

/* ============================== garsas ============================== */
let actx = null, master = null, nbuf = null;
const soundOn = () => MK.get("mk-garsas", {}).sfx !== false;
function AC(){
  try{
    if(!actx){ const A = window.AudioContext || window.webkitAudioContext; if(!A) return null; actx = new A(); master = actx.createGain(); const cp = actx.createDynamicsCompressor(); cp.threshold.value = -14; cp.ratio.value = 6; master.connect(cp); cp.connect(actx.destination); }
    if(actx.state === "suspended") actx.resume();
    master.gain.value = soundOn() ? 0.9 : 0;
    return actx;
  }catch(e){ return null; }
}
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function env(c, bus, t, d, vol, att){
  const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + (att || .008));
  g.gain.exponentialRampToValueAtTime(0.0001, t + d); g.connect(bus); return g;
}
function osc(c, g, type, f, t, d){ const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.connect(g); o.start(t); o.stop(t + d + .05); return o; }
function piano(c, bus, t, m, d, vol){
  const g = env(c, bus, t, d + .45, vol || .16); osc(c, g, "triangle", hz(m), t, d + .45);
  const g2 = env(c, bus, t, d * .6 + .2, (vol || .16) * .3); osc(c, g2, "sine", hz(m) * 2, t, d * .6 + .2);
}
function bass(c, bus, t, m, d){ const g = env(c, bus, t, d, .2, .012); osc(c, g, "triangle", hz(m), t, d); const g2 = env(c, bus, t, d, .07, .012); osc(c, g2, "sine", hz(m) * 2, t, d); }
function guitar(c, bus, t, ms, d){
  const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 1900; f.connect(bus);
  ms.forEach((m, i) => { const g = env(c, f, t + i * .012, d, .045, .004); osc(c, g, "sawtooth", hz(m), t + i * .012, d); });
}
function sax(c, bus, t, m, d){
  const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 1500; f.Q.value = 2; f.connect(bus);
  const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.11, t + .04);
  g.gain.setValueAtTime(.11, t + Math.max(.05, d - .06)); g.gain.exponentialRampToValueAtTime(0.0001, t + d); g.connect(f);
  const o = osc(c, g, "square", hz(m), t, d), l = c.createOscillator(), lg = c.createGain();
  l.frequency.value = 5.5; lg.gain.value = 3; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t + d + .05);
  const g3 = c.createGain(); g3.gain.value = .5; g3.connect(g); osc(c, g3, "sawtooth", hz(m), t, d);
}
function noise(c, bus, t, d, vol, type, fq){
  if(!nbuf){ nbuf = c.createBuffer(1, c.sampleRate, c.sampleRate); const a = nbuf.getChannelData(0); for(let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; }
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); s.buffer = nbuf; f.type = type; f.frequency.value = fq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); s.connect(f); f.connect(g); g.connect(bus); s.start(t); s.stop(t + d + .03);
}
function kick(c, bus, t){ const g = env(c, bus, t, .2, .32, .004), o = c.createOscillator(); o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + .16); o.connect(g); o.start(t); o.stop(t + .25); }
const snare = (c, bus, t) => { noise(c, bus, t, .14, .16, "bandpass", 1900); const g = env(c, bus, t, .1, .1, .003); osc(c, g, "triangle", 190, t, .1); };
const hat = (c, bus, t, v) => noise(c, bus, t, .045, v || .07, "highpass", 7000);

function tap(m){ const c = AC(); if(c) piano(c, master, c.currentTime + .005, m, .7); }
function strum(ms, arp){
  const c = AC(); if(!c) return 0; const t = c.currentTime + .03, s = ms.slice().sort((a, b) => a - b);
  if(arp){ s.forEach((m, i) => piano(c, master, t + i * .3, m, .5, .15)); const t2 = t + s.length * .3 + .15; s.forEach(m => piano(c, master, t2, m, 1.5, .11)); return (s.length * .3 + 1.7) * 1000; }
  s.forEach((m, i) => piano(c, master, t + i * .04, m, 1.3, .12)); return 1400;
}

/* ---------- grupė groja ---------- */
const NEED = [0, 2, 5, 9, 13];
const totalStars = () => Object.values(MK.best(GAME)).reduce((a, b) => a + (typeof b === "number" ? b : 0), 0);
const have = s => NEED.filter(n => s >= n).length;
const muted = [false, false, false, false, false];
const layers = () => { const h = have(totalStars()); return muted.map((m, i) => i < h && !m); };
const inRange = (pcs, lo) => pcs.map(p => { let m = lo - (lo % 12) + p; while(m < lo) m += 12; return m; });
function schedBar(c, bus, t, o, n){
  const i = n % o.bars.length, ch = o.bars[i], beat = 60 / o.bpm, L = layers(), B = b => t + b * beat, blues = o.style === "blues", sw = blues ? 2 / 3 : .5;
  if(L[2] || !ch){ [0, 1, 2, 3].forEach(b => { hat(c, bus, B(b)); if(L[2]) hat(c, bus, B(b + sw), .045); }); }
  if(L[2]){ kick(c, bus, B(0)); kick(c, bus, B(2)); snare(c, bus, B(1)); snare(c, bus, B(3)); if(blues) kick(c, bus, B(2 + sw)); }
  if(ch){
    const comp = inRange(ch.pcs, 53);
    if(L[0]){ (blues ? [[0, 1.3], [1 + sw, 1.1], [3, .6]] : [[0, 1.8], [2, 1.8]]).forEach(([b, d]) => comp.forEach(m => piano(c, bus, B(b), m, d * beat, .075))); }
    const r = 36 + ch.rpc;
    if(L[1]){ if(blues) [0, 4, 7, 9].forEach((s, b) => bass(c, bus, B(b), r + s, beat * .9)); else { bass(c, bus, B(0), r, beat * 1.7); bass(c, bus, B(2), r + 7 > 50 ? r - 5 : r + 7, beat * 1.7); } }
    if(L[3]){ const top = inRange(ch.pcs, 64).sort((a, b) => a - b).slice(0, 3); (blues ? [1, 2 + sw, 3] : [.5, 1.5, 2.5, 3.5]).forEach(b => guitar(c, bus, B(b), top, .2)); }
  }
  const mel = o.mel && o.mel[i];
  if(mel){ let p = 0; mel.forEach(x => { if(L[4]) sax(c, bus, B(p), x.m, x.d * beat * .95); else piano(c, bus, B(p), x.m + 12, x.d * beat, .2); p += x.d; }); }
  else if(!o.mel && L[4] && ch){
    let k = 60 + o.key; if(k > 65) k -= 12;
    const riff = [[[0, 12, 1], [1, 10, .6], [1 + sw, 7, 1.2], [3, 10, .9]], [[0, 7, .6], [sw, 10, .9], [2, 12, 1.8]], [[0, 15, .6], [sw, 12, .9], [2, 10, .6], [2 + sw, 7, 1.2]], [[0, 12, 2.6]]][n % 4];
    riff.forEach(([b, s, d]) => sax(c, bus, B(b), k + s, d * beat));
  }
}
let song = null;
function stopSong(){
  if(!song) return; const s = song; song = null; s.timers.forEach(clearTimeout);
  try{ s.bus.gain.setTargetAtTime(0, actx.currentTime, .03); setTimeout(() => s.bus.disconnect(), 300); }catch(e){}
  document.body.classList.remove("playing"); if(s.o.onBar) s.o.onBar(-1); if(s.o.onEnd) s.o.onEnd(); s.done();
}
function playSong(o){
  stopSong(); const c = AC(); if(!c) return Promise.resolve();
  const bus = c.createGain(); bus.connect(master); const barT = 240 / o.bpm, t0 = c.currentTime + .15;
  document.body.classList.add("playing");
  return new Promise(res => {
    const s = song = { bus, timers: [], done: res, o }; let n = 0;
    const at = (t, f) => s.timers.push(setTimeout(() => { if(song === s) f(); }, Math.max(0, (t - c.currentTime) * 1000)));
    const step = () => {
      if(!o.loop && n >= o.bars.length){ at(t0 + n * barT + .3, stopSong); return; }
      const k = n, t = t0 + k * barT; schedBar(c, bus, t, o, k);
      if(o.onBar) at(t, () => o.onBar(k % o.bars.length));
      n++; at(t0 + n * barT - .12, step);
    };
    step();
  });

function roll(notes, lo, hi){
  let p = 0, s = `<path d="M0 49H120" stroke="#e3d8b4" stroke-width="1.5"/>`;
  notes.forEach(n => {
    const x = 3 + p * 28.5, w = n.d * 28.5 - 3, y = 38 - (hi === lo ? .5 : (n.m - lo) / (hi - lo)) * 30;
    s += `<rect x="${x}" y="${y - 7.5}" width="${w}" height="15" rx="5" fill="#121a33"/><text x="${x + w / 2}" y="${y + 3.6}" text-anchor="middle" font-family="Manrope,system-ui,sans-serif" font-weight="800" font-size="10" fill="#fff">${nm(n)}</text>`;
    p += n.d;
  });
  return `<svg viewBox="0 0 120 52" aria-hidden="true">${s}</svg>`;
}
function drawBars(wrong, reveal){

  }).join("");
}

function drawGrid(wrong, reveal){

board.addEventListener("click", e => {
  const t = cur.type;
  const pl = e.target.closest("[data-p]"); if(pl) return playOdd(+pl.dataset.p);
  if(e.target.closest("#ear")) return listen();
  if(done) return;
  const o = e.target.closest(".opt"); if(o) return answer(+o.dataset.o, o);
  const c = e.target.closest(".pc");
  if(c && act >= 0){ const i = +c.dataset.c; fill[act] = i; MK.sfx.tap(); strum(Z.voice(palOf()[i])); act = nextEmpty(act); return t === "harm" ? drawBars() : drawGrid(); }
  const b = e.target.closest("[data-b]"); if(!b) return; const i = +b.dataset.b;
  if(t === "berr") return answerBar(i);
  if(t === "harm" && !cur.bars[i].pre){ act = i; MK.sfx.tap(); drawBars(); }
  if(t === "bfill" && cur.miss.includes(i)){ act = i; MK.sfx.tap(); drawGrid(); }
});

/* ---------- klausymas ---------- */
function barsNow(){ const p = palOf(); return fill.map((f, i) => f < 0 ? null : cur.type === "bfill" && !cur.miss.includes(i) ? cur.three[f] : cur.type === "berr" ? cur.three[f] : p[f]); }
function markNow(sel2, i){ document.querySelectorAll(sel2).forEach((el, k) => el.classList.toggle("now", k === i)); }
function playOdd(i){
  stopSong(); markNow(".oddc", i); const d = strum(Z.voice(cur.chs[i])); const me = cur;
  return new Promise(r => setTimeout(() => { if(cur === me) markNow(".oddc", -1); r(); }, d));
}
async function listen(){
  const t = cur.type, me = cur;
  if(song){ stopSong(); return; }
  if(t === "build") return strum(Array.from(sel));
  if(t === "name") return strum(Z.voice(cur.ch));
  if(t === "ear"){ const e = $("ear"); if(e){ e.classList.remove("ring"); void e.offsetWidth; e.classList.add("ring"); } return strum(Z.voice(cur.ch), true); }
  if(t === "odd"){ for(let i = 0; i < 3; i++){ if(cur !== me || play.hidden) return; await playOdd(i); await MK.wait(250); } return; }
  if(t === "harm") playSong({ bars: barsNow(), mel: cur.bars.map(b => b.notes), style: "pop", bpm: 96, key: cur.key.rpc, onBar: i => markNow(".mb", i), onEnd: setListen });
  else playSong({ bars: barsNow(), style: "blues", bpm: 132, key: cur.key.rpc, onBar: i => markNow(".bb", i), onEnd: setListen });
  setListen();
}
acts.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.id === "listen") return listen();
  if(b.id === "hint"){ hinted = true; MK.sfx.tap(); fb.innerHTML = `<div class="hintb">${T.hintRoot(sym(cur.ch), nm(cur.ch.notes[0]))} ${T.formula[cur.ch.q]} ${T.semi}</div>`; return; }
  if(b.id === "check") return check();
});

/* ---------- tikrinimas ---------- */
function chordWhy(c, extra){ return { body: T.whyChord(sym(c), T.quality[c.q], notesOf(c)) + " " + T.whySteps[c.q] + (extra ? " " + extra : ""), more: `${T.formula[c.q]} ${T.semi} ${T.anyOct}` }; }
function finish(ok, w){
  done = true; play.classList.add("done"); stopSong();
  const first = ok && tries === 0, gain = !ok ? 0 : first && !hinted ? 10 : 5;
  if(first) okN++; pts += gain; dots.mark(ti, first); $("pts").textContent = `${T.points}: ${pts}`;
  fb.innerHTML = MK.why({ ok, head: ok ? T.okHead(MK.praise(), gain) : T.failHead, body: w.body, more: w.more, sum: w.sum || T.sumMore, open: !ok });
  if(ok) MK.sfx.good(); else MK.sfx.bad();
  $("next").hidden = false; $("next").textContent = ti === N - 1 ? T.results : T.next;
  const h = $("hint"), ck = $("check"); if(h) h.hidden = true; if(ck) ck.hidden = true;
  const li = $("listen"); if(li) li.classList.add("full"); setListen();
}
function retry(body){ tries++; MK.sfx.bad(); fb.innerHTML = MK.why({ ok: false, head: T.retry, body }); }
function check(){
  if(done) return; const t = cur.type;
  if(t === "build"){
    const c = cur.ch, ks = Array.from(sel), pcs = Array.from(new Set(ks.map(m => m % 12))), n = c.pcs.length;
    const good = pcs.filter(p => c.pcs.includes(p)).length, bad = ks.filter(m => !c.pcs.includes(m % 12)).length;
    if(good === n && !bad && ks.length > n){ say(T.dup, "bad"); return; }
    if(good === n && !bad){ sel = new Set(ks); drawKb(true); setTimeout(() => strum(ks), 350); return finish(true, chordWhy(c, cur.kind === "morph" ? T.whyMorph[c.q] : "")); }
    if(tries < 1){ kb.classList.remove("hit"); void kb.offsetWidth; kb.classList.add("hit"); return retry(ks.length !== n && !bad && good === pcs.length ? T.needN(n) : T.fbCount(good, bad, n - good)); }
    tries++; sel = new Set(Z.voice(c)); drawKb(true); drawTags(); setTimeout(() => strum(Z.voice(c)), 350);
    return finish(false, chordWhy(c, cur.kind === "morph" ? T.whyMorph[c.q] : ""));
  }
  if(t === "harm"){
    if(fill.includes(-1)){ say(T.harmNeed, "bad"); return; }
    const wrong = fill.map((f, i) => f !== cur.bars[i].c ? i : -1).filter(i => i >= 0);
    const why = { body: cur.bars.map((b, i) => `<p class="sumL">${T.harmLine(i + 1, b.notes.map(nm).join(" – "), sym(cur.pal[b.c]), notesOf(cur.pal[b.c], ", "))}</p>`).join("") };
    if(!wrong.length){ act = -1; finish(true, why); drawBars(null, true); setTimeout(() => { if(done && !play.hidden && !song) listen(); }, 700); return; }
    if(tries < 1){ drawBars(wrong); return retry(T.harmRetry(wrong.length)); }
    tries++; fill = cur.bars.map(b => b.c); act = -1; finish(false, why); drawBars(null, true);
  }
  if(t === "bfill"){
    if(fill.includes(-1)){ say(T.bNeed, "bad"); return; }
    const wrong = cur.miss.filter(i => cur.pal[fill[i]] !== cur.three[cur.form[i]]);
    const why = bluesWhy();
    if(!wrong.length){ act = -1; finish(true, why); toThree(); drawGrid(null, cur.miss); return; }
    if(tries < 1){ drawGrid(wrong); return retry(T.bRetry(wrong.length)); }
    tries++; act = -1; finish(false, why); toThree(); drawGrid(null, cur.miss);
  }
}
/* po užduoties tinklelis rodomas trijų bliuzo akordų numeriais */
function toThree(){ fill = FORM0(); cur = Object.assign({}, cur, { type: "berr", shown: true }); round[ti] = cur; }
const FORM0 = () => Z.FORM.slice();
function bluesWhy(){ const th = cur.three.map(sym); return { body: T.bWhy(th[0], th[1], th[2]), more: T.bForm(th[0], th[1], th[2]), sum: T.sumForm }; }
function answerBar(i){
  if(i === cur.bad){ fill = FORM0(); const w = bluesWhy(); w.body = T.bErrWhy(i + 1, sym(cur.three[cur.right])) + " " + w.body; finish(true, w); drawGrid(null, [i]); return; }
  if(tries < 1){ cur.off = (cur.off || []).concat(i); drawGrid(); return retry(T.bErrRetry); }
  tries++; const bad = cur.bad; fill = FORM0(); const w = bluesWhy(); w.body = T.bErrWhy(bad + 1, sym(cur.three[cur.right])) + " " + w.body; finish(false, w); drawGrid([i], [bad]);
}
function answer(i, el){
  const t = cur.type, ok = i === cur.ans, two = (cur.opts || cur.chs).length > 2;
  const mark = () => board.querySelectorAll(".opt").forEach((o, k) => { o.classList.toggle("right", k === cur.ans); if(k !== cur.ans) o.classList.add("wrongb"); });
  if(!ok && two && tries < 1){ el.classList.add("wrongb"); return retry(t === "name" ? T.wrongOpt : t === "btrans" ? T.transRetry : T.earRetry); }
  if(!ok) tries++;
  mark();
  if(t === "name") return finish(ok, chordWhy(cur.ch));
  if(t === "ear"){ const c = cur.ch; sel = new Set(Z.voice(c)); kb.hidden = false; kb.classList.add("ro"); drawKb(true); finish(ok, { body: T.earWhy(sym(c), T.quality[c.q], notesOf(c)) + " " + T.earTip[c.q] }); acts.innerHTML = btn("listen", "", "alt full"); setListen(); return; }
  if(t === "odd"){ board.querySelectorAll(".oddc em").forEach((e2, k) => e2.textContent = sym(cur.chs[k])); return finish(ok, { body: T.oddWhy(cur.chs.map(c => `<b>${sym(c)}</b> – ${T.quality[c.q]}`).join("; ")) + " " + T.earTip[cur.chs[cur.ans].q] }); }
  if(t === "btrans"){ const th = cur.opts[cur.ans], r = th.map(c => T.sol[c.l] + accS(c.a)); return finish(ok, { body: T.bTransWhy(sym(cur.key), r[0], r[1], r[2]) + " " + T.bWhy(sym(th[0]), sym(th[1]), sym(th[2])) }); }
}
function next(){
  stopSong(); ti++; if(ti < N){ startTask(); window.scrollTo(0, 0); return; }
  const before = have(totalStars()), stars = okN / N >= .3 ? MK.starsFor(okN, N) : 0; MK.best(GAME, T.levels[lvl].id, stars);
  const after = have(totalStars()), who = T.band.slice(before, after).map(b => b.who).join(", ");
  MK.result({ stars, title: T.resTitle(okN, N), text: T.resText(pts, who), next: lvl < T.levels.length - 1 ? () => start(lvl + 1) : null, again: () => start(lvl), menu: () => showMenu(after > before ? before : null) });
}
$("next").addEventListener("click", () => { MK.sfx.tap(); next(); });
$("quit").addEventListener("click", () => { MK.sfx.tap(); showMenu(); });
window.MK_DEBUG = { get cur(){ return cur; }, get fill(){ return fill; }, get sel(){ return sel; }, schedBar, JAM, muted };
showMenu();
})();
</script>
